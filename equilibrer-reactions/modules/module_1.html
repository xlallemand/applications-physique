<style>
  /* tableaux bilan « avant / après » d'un exemple, côte à côte quand la place le permet */
  .er1-bilans { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 28px; margin: 6px 0 10px; }

<div class="er-page er-avec-aide">
  <div class="er-card">
    <span class="er-badge">MODULE 1 · COURS</span>
    <h2 class="er-titre">Comment équilibrer une réaction chimique</h2>
    <p class="er-contexte">Les atomes se conservent au cours d'une transformation chimique. Tu vas voir comment l'écrire dans une équation de réaction, avec les <b>nombres stœchiométriques</b>, puis équilibrer trois réactions.</p>
  </div>
  <div id="etapes"></div>
</div>

<!-- Lien vers le module 2, accessible à tout moment (retour au même endroit, voir plus bas) -->
<a class="er-aide-flottante" href="module_2.html" data-m2><span>?</span>Du mal à compter les atomes ?</a>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Les réactions à équilibrer et les atomes à compter sont des outils
   de er.js (ER.partieEquilibrer, ER.partieCompter, ER.partieRegler).

   Retour du module 2 au même endroit : en partant vers le module 2,
   on note dans l'adresse de retour l'état du cours (étape atteinte,
   questions déjà faites, nombres réglés et dessins de chaque outil,
   tirages au hasard, position dans la page). Au retour, le cours est
   reconstruit en rejouant les étapes et les questions déjà faites.
   ============================================================ */
const { exemple } = COURS;
const fH = ER.formuleHTML;
const zone = document.getElementById('etapes');

/* ---------- État lu dans l'adresse (#{…}) au retour du module 2 ---------- */
let depart = {};
try {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h[0] === '{') depart = JSON.parse(h) || {};
} catch (e) { depart = {}; }
const rejeu = typeof depart.n === 'number';
const objet = o => (o && typeof o === 'object' && !Array.isArray(o) ? o : {});
const faits = objet(depart.f);                 // { 'étape.question.partie': 1 réussie, 2 réponse affichée }
const memoires = objet(depart.m);              // état de chaque outil : { c: nombres, d: dessins, v: validé }
const tirages = Array.isArray(depart.r) ? depart.r : [];
const memoire = cle => (memoires[cle] = objet(memoires[cle]));

// Tirage au hasard, rejoué à l'identique au retour du module 2
let nTirage = 0;
function tirer(liste) {
  const k = nTirage++;
  if (!(Number.isInteger(tirages[k]) && tirages[k] >= 0 && tirages[k] < liste.length)) tirages[k] = Math.floor(Math.random() * liste.length);
  return liste[tirages[k]];
}

// Au retour du module 2, les questions déjà faites sont remontées faites :
// réussies (réponse en place, « Juste ! ») ou réponse affichée (appui rejoué sur « Afficher la réponse »)
const MUET = { fini: () => true, effacer() {}, message() {}, erreur() {}, compterErreur() {}, reussi() {} };
let enAttente = 0;                             // appuis rejoués pas encore faits
function rejouable(e, items) {
  if (!rejeu) return items;
  return items.map((it, i) => Object.assign({}, it, {
    parties: it.parties.map((p, k) => {
      const f = faits[`${e}.${i}.${k}`];
      if (f !== 1 && f !== 2) return p;
      const monterPartie = (z, api) => (p.type === 'perso' ? p.monter(z, api) : COURS.PARTIES[p.type](z, p, api)) || {};
      return {
        type: 'perso', q: p.q, solution: p.solution,
        monter(z, api) {
          if (f === 2) {
            const ctx = monterPartie(z, api);
            enAttente++;
            // le moteur relie le bouton « Afficher la réponse » juste après le montage
            queueMicrotask(() => {
              enAttente--;
              const b = z.parentNode.querySelector('.crs-partie-aide button');
              if (b) b.click();
            });
            return ctx;
          }
          const ctx = monterPartie(z, MUET);
          if (ctx.montrer) ctx.montrer();
          api.reussi();
          return {};
        },
      };
    }),
  }));
}

/* ---------- État du cours, noté en partant vers le module 2 ---------- */
function etatActuel() {
  const f = {};
  zone.querySelectorAll('.er-etape').forEach((carte, e) => {
    carte.querySelectorAll('.crs-atoi-q').forEach((q, i) => {
      q.querySelectorAll('.crs-partie').forEach((p, k) => {
        if (p.querySelector('.crs-partie-aide')) return;                         // pas encore faite
        f[`${e}.${i}.${k}`] = p.querySelector('.crs-partie-retour .callout.crs-solution') ? 2 : 1;
      });
    });
  });
  return { n: cours.n, t: COURS.tout ? 1 : 0, f, m: memoires, r: tirages, y: Math.round(window.scrollY) };
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-m2]');
  if (!a) return;
  e.preventDefault();
  const h = encodeURIComponent(JSON.stringify(etatActuel()));
  // l'état est aussi gardé dans l'adresse de cette page : le retour arrière du navigateur ramène au même endroit
  try { history.replaceState(null, '', '#' + h); } catch (_) { /* adresse inchangée */ }
  window.location.href = 'module_2.html?retour=' + encodeURIComponent('module_1.html#' + h);
});

/* ---------- Petits outils de mise en page ---------- */
const eq = (r, p, c) => `<p class="er-eq">${ER.equationHTML(r, p, c)}</p>`;
const bilan = (r, p, c) => ER.bilanHTML(ER.verifier(r, p, c).bilan);
const choix = (q, options, bonne, indices, solution, colonne) => ({ type: 'choix', q, options, bonne, indices, solution, colonne, melanger: true });

/* ============================================================
   LES ÉTAPES
   ============================================================ */

/* ---------- 1. Le principe ---------- */
function principe(c) {
  const carte = c.carte('1. Le principe');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Au cours d'une transformation chimique, les atomes des réactifs se réarrangent pour former les produits. <b>Aucun atome ne disparaît, aucun atome n'apparaît.</b></p>
      <div class="cle"><p><b class="cle-titre">Conservation des éléments.</b> Pour chaque élément, il y a autant d'atomes dans les réactifs que dans les produits. On dit alors que l'équation de la réaction est <b>équilibrée</b>.</p></div>
      <p>Pour équilibrer une équation, on écrit devant chaque formule un <b>nombre stœchiométrique</b> : c'est le nombre de molécules de cette espèce. Le nombre 1 ne s'écrit pas.</p>
    </div>
    ${exemple(`<p class="er-consigne">Essaie : change le nombre stœchiométrique devant H<sub>2</sub>O avec les flèches et observe le nombre d'atomes.</p>
      <div data-x="switch"></div><div data-x="r"></div>
      <p class="er-guide">2 H<sub>2</sub>O, ce sont 2 molécules d'eau : 2 × 2 = 4 atomes H et 2 × 1 = 2 atomes O.</p>`)}
    <div class="crs-attention">
      <p><b class="cle-titre">Attention : on ne modifie jamais les indices.</b> Changer un indice change la molécule, donc l'espèce chimique.</p>
      <div class="er-comparaison">
        <div><span class="er-formule">2 H<sub>2</sub>O</span><div class="er-mols">${ER.molecule('H2O').repeat(2)}</div><p>2 molécules d'<b>eau</b></p></div>
        <div><span class="er-formule">H<sub>2</sub>O<sub>2</sub></span><div class="er-mols">${ER.molecule('H2O2')}</div><p>1 molécule d'<b>eau oxygénée</b> : une autre espèce !</p></div>
      </div>
    </div>`);
  // démonstration : une seule espèce, nombre réglable, calcul écrit dessous
  const mem = memoire('demo');
  const dessins = mem.d == null ? true : !!mem.d;
  const r = new ER.Reaction(carte.querySelector('[data-x="r"]'), {
    reactifs: ['H2O'], produits: [], comptes: true, detail: true, dessins, max: 9,
    coefs: Number.isInteger(mem.c) && mem.c >= 1 && mem.c <= 9 ? [mem.c] : [1],
    onChange: v => { mem.c = v[0]; },
  });
  carte.querySelector('[data-x="switch"]').replaceWith(ER.interrupteur(dessins, b => { mem.d = b ? 1 : 0; r.options({ dessins: b }); }));

  // espèce et nombre d'atomes à obtenir (le nombre stœchiométrique attendu est entier)
  const R = tirer([
    { f: 'CO2', el: 'O', cible: 6 }, { f: 'NH3', el: 'H', cible: 9 }, { f: 'H2O', el: 'H', cible: 8 },
    { f: 'CH4', el: 'H', cible: 8 }, { f: 'O2', el: 'O', cible: 10 },
  ]);
  c.aToi(carte, rejouable(c.n, [
    { titre: 'Qu\'est-ce qui se conserve ?',
      parties: [choix('Une équation de réaction est équilibrée quand…', [
        { id: 'atomes', label: 'pour chaque élément, il y a autant d\'atomes dans les réactifs que dans les produits' },
        { id: 'molecules', label: 'il y a autant de molécules dans les réactifs que dans les produits' },
        { id: 'especes', label: 'les mêmes espèces chimiques sont présentes avant et après la transformation' },
      ], 'atomes', {
        molecules: 'Le nombre de molécules peut changer : dans 2 H<sub>2</sub> + O<sub>2</sub> → 2 H<sub>2</sub>O, 3 molécules en donnent 2. Ce sont les <b>atomes</b> de chaque élément qui se conservent.',
        especes: 'Au contraire : les réactifs disparaissent et de nouvelles espèces, les produits, se forment. Ce sont les <b>atomes</b> qui se conservent.',
      }, '<p>Les atomes se réarrangent sans disparaître ni apparaître : pour chaque élément, autant d\'atomes de chaque côté de la flèche.</p>', true)] },
    { titre: 'Indice ou nombre stœchiométrique ?',
      parties: [choix('On veut écrire 2 molécules d\'eau H<sub>2</sub>O. Quelle écriture est juste ?', [
        { id: 'bon', label: '2 H<sub>2</sub>O' },
        { id: 'h4o2', label: 'H<sub>4</sub>O<sub>2</sub>' },
        { id: 'h2o2', label: 'H<sub>2</sub>O<sub>2</sub>' },
      ], 'bon', {
        h4o2: 'Tu as multiplié les indices : H<sub>4</sub>O<sub>2</sub> serait <b>une seule</b> molécule avec 4 H et 2 O, ce n\'est plus de l\'eau. Le nombre de molécules s\'écrit <b>devant</b> la formule.',
        h2o2: 'H<sub>2</sub>O<sub>2</sub> est une autre espèce, l\'eau oxygénée. On ne modifie jamais les indices : le nombre de molécules s\'écrit devant la formule.',
      }, '<p>Le nombre stœchiométrique 2, écrit devant, compte les molécules ; la formule H<sub>2</sub>O ne change pas.</p>')] },
    { titre: 'Règle le nombre stœchiométrique',
      parties: [ER.partieRegler({
        formule: R.f, el: R.el, cible: R.cible, memoire: memoire('regler'),
        q: `Règle le nombre stœchiométrique devant ${fH(R.f)} pour avoir <b>${R.cible} atomes ${R.el}</b> en tout.`,
      })] },
  ]));
  return carte;
}

/* ---------- 2. Une première réaction ---------- */
function premiere(c) {
  const carte = c.carte('2. Une première réaction');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Pour équilibrer une équation, on compte les atomes de chaque élément dans les réactifs et dans les produits, puis on ajuste les nombres stœchiométriques.</p>
      <div class="cle"><p><b class="cle-titre">Équilibrer une équation.</b> Pour chaque élément, compare le nombre d'atomes dans les réactifs et dans les produits. S'il en manque d'un côté, augmente le nombre stœchiométrique devant une espèce de ce côté qui contient cet élément.</p></div>
    </div>
    ${exemple(`<p>Dans un moteur, le diazote N<sub>2</sub> et le dioxygène O<sub>2</sub> de l'air forment du monoxyde d'azote NO.</p>
      <div class="er1-bilans">
        <div><p class="er1-legende">N<sub>2</sub> + O<sub>2</sub> → NO</p>${bilan(['N2', 'O2'], ['NO'], [1, 1, 1])}</div>
        <div><p class="er1-legende">N<sub>2</sub> + O<sub>2</sub> → 2 NO</p>${bilan(['N2', 'O2'], ['NO'], [1, 1, 2])}</div>
      </div>
      <p>Il manque 1 atome N et 1 atome O dans les produits : on écrit 2 devant NO. 2 NO, ce sont 2 × 1 = 2 atomes N et 2 × 1 = 2 atomes O, autant que dans les réactifs.</p>
      ${eq(['N2', 'O2'], ['NO'], [1, 1, 2])}`)}`);
  c.aToi(carte, rejouable(c.n, [
    { titre: 'Synthèse du chlorure d\'hydrogène',
      enonce: '<p>Le dihydrogène H<sub>2</sub> réagit avec le dichlore Cl<sub>2</sub> pour former du chlorure d\'hydrogène HCl. Écrite ainsi, l\'équation n\'est pas équilibrée.</p>',
      parties: [ER.partieEquilibrer({
        r: ['H2', 'Cl2'], p: ['HCl'], solution: [1, 1, 2], ordre: ['H', 'Cl'], direct: true, dessins: true, memoire: memoire('r1'),
        q: 'Ajuste les nombres stœchiométriques pour avoir autant d\'atomes de chaque élément des deux côtés de la flèche. Le tableau compare les atomes des réactifs et des produits.',
        bravo: 'Le nombre 2 devant HCl indique 2 molécules HCl : 2 × 1 = 2 atomes H et 2 × 1 = 2 atomes Cl, autant que dans les réactifs.',
      })] },
    { titre: 'Une autre façon d\'équilibrer ?',
      parties: [choix('Un élève équilibre la même réaction en écrivant H<sub>2</sub> + Cl<sub>2</sub> → H<sub>2</sub>Cl<sub>2</sub>. A-t-il raison ?', [
        { id: 'non', label: 'Non : on ne modifie jamais les indices, il faut écrire H<sub>2</sub> + Cl<sub>2</sub> → 2 HCl.' },
        { id: 'oui', label: 'Oui : il y a 2 atomes H et 2 atomes Cl de chaque côté.' },
        { id: 'plus', label: 'Non : il y a plus d\'atomes dans les réactifs que dans les produits.' },
      ], 'non', {
        oui: 'Les atomes sont bien conservés, mais H<sub>2</sub>Cl<sub>2</sub> n\'est pas la formule du chlorure d\'hydrogène HCl : en changeant les indices, l\'élève a changé d\'espèce.',
        plus: 'Compte-les : 2 H et 2 Cl de chaque côté. Le problème est ailleurs : H<sub>2</sub>Cl<sub>2</sub> n\'est pas la formule du chlorure d\'hydrogène.',
      }, '<p>Le produit est le chlorure d\'hydrogène HCl : sa formule ne change pas. On écrit 2 <b>devant</b> HCl pour avoir 2 molécules.</p>', true)] },
  ]));
  return carte;
}

/* ---------- 3. Compter sans dessiner ---------- */
function compter(c) {
  const carte = c.carte('3. Compter sans dessiner');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Dessiner les molécules prend du temps. Inutile de compter les boules une par une : on calcule directement.</p>
      <div class="cle"><p class="er-formule-cle">nombre d'atomes = nombre stœchiométrique × indice</p></div>
    </div>
    ${exemple(`<p>Regarde les atomes de 3 H<sub>2</sub>O : il y a 3 groupes de 2 atomes H, et 3 groupes de 1 atome O.</p>
      <div style="margin:10px 0" data-x="ex"></div>
      <p class="crs-calc">3 H<sub>2</sub>O : 3 × 2 = <span class="c">6 H</span> et 3 × 1 = <span class="c">3 O</span></p>`)}
    <div class="er-lien-m2"><p>Tu as du mal à compter les atomes dans une molécule ?</p>
      <a class="btn-small" style="text-decoration:none" href="module_2.html" data-m2>S'entraîner (module 2) →</a></div>`);
  new ER.Reaction(carte.querySelector('[data-x="ex"]'), { reactifs: ['H2O'], produits: [], coefs: [3], selecteurs: false, dessins: true });
  const regle = 'Multiplie le nombre stœchiométrique par l\'indice de chaque élément.';
  const item = (titre, f, coef, dessins, cle) => ({ titre, parties: [ER.partieCompter({
    formule: f, coef, dessins, regle, memoire: memoire(cle),
    q: `Combien y a-t-il d'atomes de chaque élément dans <b>${coef} ${fH(f)}</b> ? Calcule, puis vérifie.`,
  })] });
  c.aToi(carte, rejouable(c.n, [
    item('Avec le dessin', 'NH3', 2, true, 'k1'),
    item('Sans le dessin (tu peux l\'afficher pour vérifier)', 'CO2', 3, false, 'k2'),
    item('Sans le dessin', 'C2H6', 2, false, 'k3'),
  ]));
  return carte;
}

/* ---------- 4. Deux nombres à trouver ---------- */
function methode(c) {
  const carte = c.carte('4. Deux nombres à trouver');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Quand il faut changer plusieurs nombres stœchiométriques, l'ordre dans lequel on traite les éléments compte.</p>
      <div class="cle"><p><b class="cle-titre">Méthode</b></p>
        <ol class="er-liste">
          <li>Commence par un élément présent dans <b>une seule espèce</b> de chaque côté.</li>
          <li>Termine par l'élément présent <b>seul</b> dans une espèce (O<sub>2</sub>, H<sub>2</sub>…).</li>
          <li>Vérifie tous les éléments à la fin : modifier un nombre peut déséquilibrer un élément déjà équilibré.</li>
        </ol></div>
    </div>
    ${exemple(`<p>Le diazote N<sub>2</sub> réagit avec le dihydrogène H<sub>2</sub> pour former de l'ammoniac NH<sub>3</sub> : N<sub>2</sub> + H<sub>2</sub> → NH<sub>3</sub>.</p>
      <ol class="er-liste">
        <li><b>N</b> est dans une seule espèce de chaque côté : N<sub>2</sub> contient 2 atomes N, il faut donc 2 NH<sub>3</sub> (2 × 1 = 2 N).</li>
        <li><b>H</b> est seul dans H<sub>2</sub> : on le garde pour la fin. 2 NH<sub>3</sub> contiennent 2 × 3 = 6 H, il faut donc 3 H<sub>2</sub> (3 × 2 = 6 H).</li>
        <li>Vérification : 2 N et 6 H de chaque côté.</li>
      </ol>
      ${eq(['N2', 'H2'], ['NH3'], [1, 3, 2])}`)}`);
  c.aToi(carte, rejouable(c.n, [
    { titre: 'Par où finir ?',
      parties: [choix('Pour équilibrer la combustion du propane, C<sub>3</sub>H<sub>8</sub> + O<sub>2</sub> → CO<sub>2</sub> + H<sub>2</sub>O, par quel élément termine-t-on ?', [
        { id: 'O', label: 'Par O' }, { id: 'C', label: 'Par C' }, { id: 'H', label: 'Par H' },
      ], 'O', {
        C: 'C n\'est que dans C<sub>3</sub>H<sub>8</sub> et dans CO<sub>2</sub> : une seule espèce de chaque côté, on commence par lui.',
        H: 'H n\'est que dans C<sub>3</sub>H<sub>8</sub> et dans H<sub>2</sub>O : une seule espèce de chaque côté, on le traite au début.',
      }, '<p>O est dans O<sub>2</sub>, CO<sub>2</sub> et H<sub>2</sub>O, et il est seul dans O<sub>2</sub> : on le garde pour la fin et on termine en réglant le nombre devant O<sub>2</sub>.</p>')] },
    { titre: 'Combustion du méthane',
      enonce: '<p>Le méthane CH<sub>4</sub> (gaz de ville) brûle dans le dioxygène O<sub>2</sub> : il se forme du dioxyde de carbone CO<sub>2</sub> et de l\'eau H<sub>2</sub>O.</p>',
      parties: [ER.partieEquilibrer({
        r: ['CH4', 'O2'], p: ['CO2', 'H2O'], solution: [1, 2, 1, 2], ordre: ['C', 'H', 'O'], direct: true, dessins: false, memoire: memoire('r2'),
        q: 'Équilibre la réaction. Les dessins sont masqués : sous chaque formule, le calcul nombre stœchiométrique × indice est écrit pour toi.',
        bravo: 'C est équilibré dès le départ (1 de chaque côté). Pour H, il faut 2 H<sub>2</sub>O (4 H). Il y a alors 2 + 2 = 4 atomes O dans les produits : il faut 2 O<sub>2</sub>.',
      })] },
  ]));
  return carte;
}

/* ---------- 5. À toi de calculer ---------- */
function calculer(c) {
  const carte = c.carte('5. À toi de calculer');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Cette fois, le nombre d'atomes n'est plus écrit sous les formules : tu le calcules toi-même (nombre stœchiométrique × indice).</p>
      <div class="cle"><p><b class="cle-titre">Les plus petits entiers.</b> Une équation s'écrit avec les plus petits nombres entiers possibles : si tous les nombres peuvent être divisés par un même nombre, on les divise.</p></div>
    </div>
    ${exemple(`<p>Le cuivre Cu réagit avec le dioxygène O<sub>2</sub> pour former de l'oxyde de cuivre CuO : Cu + O<sub>2</sub> → CuO.</p>
      <ol class="er-liste">
        <li><b>Cu</b> : 1 de chaque côté, c'est bon pour l'instant.</li>
        <li><b>O</b> : 2 dans O<sub>2</sub>, 1 dans CuO. Il faut 2 CuO (2 × 1 = 2 O).</li>
        <li>On vérifie : 2 CuO contiennent 2 Cu, il faut donc 2 Cu.</li>
      </ol>
      ${eq(['Cu', 'O2'], ['CuO'], [2, 1, 2])}
      <p>4 Cu + 2 O<sub>2</sub> → 4 CuO est aussi équilibrée, mais tous les nombres peuvent être divisés par 2 : on ne l'écrit pas ainsi.</p>`)}`);
  c.aToi(carte, rejouable(c.n, [
    { titre: 'Synthèse de l\'eau',
      enonce: '<p>Le dihydrogène H<sub>2</sub> brûle dans le dioxygène O<sub>2</sub> en formant de l\'eau H<sub>2</sub>O.</p>',
      parties: [ER.partieEquilibrer({
        r: ['H2', 'O2'], p: ['H2O'], solution: [2, 1, 2], ordre: ['O', 'H'], direct: false, comptes: false, dessins: false, memoire: memoire('r3'),
        q: 'Le nombre d\'atomes n\'est plus écrit : calcule-le toi-même (nombre stœchiométrique × indice), puis valide.',
        bravo: 'On a équilibré O avec 2 H<sub>2</sub>O (2 O), ce qui donne 4 H dans les produits ; puis H avec 2 H<sub>2</sub> (4 H).',
      })] },
    { titre: 'Bien écrite ?',
      parties: [choix('Laquelle de ces équations est écrite correctement ?', [
        { id: 'bon', label: '2 CO + O<sub>2</sub> → 2 CO<sub>2</sub>' },
        { id: 'double', label: '4 CO + 2 O<sub>2</sub> → 4 CO<sub>2</sub>' },
        { id: 'non', label: 'CO + O<sub>2</sub> → CO<sub>2</sub>' },
        { id: 'o', label: 'CO + O → CO<sub>2</sub>' },
      ], 'bon', {
        double: 'Elle est équilibrée, mais tous les nombres peuvent être divisés par 2 : on écrit les plus petits entiers possibles.',
        non: 'Compte les atomes O : 1 + 2 = 3 dans les réactifs, 2 dans les produits. Elle n\'est pas équilibrée.',
        o: 'Le dioxygène s\'écrit O<sub>2</sub> : on ne modifie pas la formule d\'une espèce pour équilibrer.',
      }, '<p>2 CO + O<sub>2</sub> → 2 CO<sub>2</sub> : 2 C et 4 O de chaque côté, avec les plus petits entiers possibles.</p>', true)] },
  ]), 'Ce qu\'il faut retenir →');
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Conservation des éléments.</b> Une équation est équilibrée quand, pour chaque élément, il y a autant d'atomes dans les réactifs que dans les produits.</p></div>
    <div class="cle"><p><b class="cle-titre">Nombre stœchiométrique.</b> Écrit devant la formule, il donne le nombre de molécules. On ne modifie jamais les indices.</p>
      <p class="er-formule-cle">nombre d'atomes = nombre stœchiométrique × indice</p></div>
    <div class="cle"><p><b class="cle-titre">Méthode.</b> Commencer par les éléments présents dans une seule espèce de chaque côté, finir par ceux présents seuls (O<sub>2</sub>, H<sub>2</sub>…), puis tout vérifier.</p></div>
    <div class="cle"><p><b class="cle-titre">Les plus petits entiers.</b> On choisit les plus petits nombres entiers possibles : 2 H<sub>2</sub> + O<sub>2</sub> → 2 H<sub>2</sub>O, et non 4 H<sub>2</sub> + 2 O<sub>2</sub> → 4 H<sub>2</sub>O.</p></div>
    <div class="er-actions">
      <a class="btn-primary" style="text-decoration:none" href="module_3.html">Module 3 : s'entraîner →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_2.html">Module 2 : compter les atomes</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_1.html">Fiche récapitulative</a>
    </div>`);
  return carte;
}

const ETAPES = [principe, premiere, compter, methode, calculer, aRetenir];
const cours = new COURS.Cours(zone, ETAPES);

/* ---------- Retour du module 2 : on rejoue jusqu'à l'étape atteinte, puis on revient à la même position ---------- */
if (rejeu) {
  // pas de défilement automatique pendant qu'on rejoue
  const defiler = Element.prototype.scrollIntoView;
  Element.prototype.scrollIntoView = function () {};
  if (depart.t === 1) cours.toutAfficher();
  const cible = Math.min(ETAPES.length - 1, Math.max(0, depart.n | 0));
  let garde = 0;
  (function pas() {
    if (garde++ < 200) {
      if (enAttente) { setTimeout(pas, 0); return; }
      if (cours.attente && cours.n < cible) { cours.suivante(false); setTimeout(pas, 0); return; }
    }
    setTimeout(() => {
      Element.prototype.scrollIntoView = defiler;
      const y = Math.max(0, depart.y | 0), aller = () => window.scrollTo(0, y);
      aller();
      requestAnimationFrame(aller);
      if (document.fonts) document.fonts.ready.then(aller);
    }, 120);
  })();
  try { history.replaceState(null, '', location.pathname); } catch (_) { /* adresse inchangée */ }
}

ER.menu('module_1');
</script>
