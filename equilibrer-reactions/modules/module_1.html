<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 : Comment équilibrer une réaction — Équilibrer une réaction</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="er.css">
<script src="../../assets/nav.js"></script>
<script src="er.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page er-avec-aide">
  <div class="er-card">
    <span class="er-badge">MODULE 1</span>
    <h2 class="er-titre">Comment équilibrer une réaction chimique</h2>
    <p class="er-contexte">Les atomes se conservent au cours d'une transformation chimique. Tu vas voir comment l'écrire dans une équation de réaction, avec les <b>nombres stœchiométriques</b>, puis équilibrer trois réactions.</p>
  </div>
  <div id="etapes"></div>
</div>

<!-- Lien vers le module 2, accessible à tout moment -->
<a class="er-aide-flottante" href="module_2.html" id="lienM2"><span>?</span>Du mal à compter les atomes ?</a>

<script>
/* ============================================================
   Le module avance par étapes : chaque étape réussie fait
   apparaître la suivante sous elle.
   L'état (étape atteinte, nombres stœchiométriques, dessins…) est
   transmis au module 2 dans l'adresse de retour : le bouton
   « Revenir » du module 2 ramène exactement au même endroit.
   ============================================================ */
const zone = document.getElementById('etapes');
const etat = { e: 0, c1: null, c2: null, c3: null, vk: null, d0: 1, d1: 1, d2: 0, d3: 0, k: 0, v3: 0 };

// État lu dans l'adresse (#e=2&c1=1.1.2…) au retour du module 2
const restaure = {};
location.hash.slice(1).split('&').forEach(p => {
  const [k, v] = p.split('=');
  if (k && v !== undefined) restaure[k] = decodeURIComponent(v);
});
const lireCoefs = s => (s ? s.split('.').map(Number).filter(n => n >= 1 && n <= 60) : null);
if (restaure.e) {
  etat.e = Math.min(5, Math.max(0, parseInt(restaure.e, 10) || 0));
  ['c1', 'c2', 'c3', 'vk'].forEach(k => { etat[k] = lireCoefs(restaure[k]); });
  ['d0', 'd1', 'd2', 'd3', 'k', 'v3'].forEach(k => { if (restaure[k] !== undefined) etat[k] = parseInt(restaure[k], 10) || 0; });
}

// Lien vers le module 2 : on y joint l'état actuel et la position dans la page
function lienModule2() {
  const p = ['e=' + etat.e];
  ['c1', 'c2', 'c3', 'vk'].forEach(k => { if (etat[k]) p.push(k + '=' + etat[k].join('.')); });
  ['d0', 'd1', 'd2', 'd3', 'k', 'v3'].forEach(k => p.push(k + '=' + etat[k]));
  p.push('y=' + Math.round(window.scrollY));
  return 'module_2.html?retour=' + encodeURIComponent('module_1.html#' + p.join('&'));
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-m2]');
  if (!a) return;
  e.preventDefault();
  window.location.href = lienModule2();
});
document.getElementById('lienM2').setAttribute('data-m2', '');

/* ---------- Outils de mise en page ---------- */
function carte(titre) {
  const c = document.createElement('section');
  c.className = 'er-card er-etape';
  c.innerHTML = `<h3 class="cours-titre">${titre}</h3>`;
  zone.appendChild(c);
  return c;
}
function ajouter(parent, html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  parent.appendChild(d);
  return d;
}
// Bouton « Continuer » : affiche l'étape suivante et la fait défiler à l'écran
function continuer(parent, n, texte) {
  const d = ajouter(parent, `<div class="er-suite"><button type="button" class="btn-primary">${texte || 'Continuer →'}</button></div>`);
  const b = d.querySelector('button');
  b.onclick = () => {
    d.remove();
    etat.e = n;
    const c = ETAPES[n]();
    c.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  return d;
}

/* ---------- Réaction à équilibrer avec bilan et indice en direct ---------- */
function reactionGuidee(parent, cfg) {
  const R = cfg.r, P = cfg.p, cle = cfg.cle;
  const bloc = ajouter(parent, `<div data-r="switch"></div><div data-r="reaction"></div>
    <div data-r="bilan"></div><div data-r="guide"></div><div data-r="fin"></div>`);
  const $ = a => bloc.querySelector(`[data-r="${a}"]`);
  const fini = !!cfg.resolu;
  if (etat[cle] && etat[cle].length !== R.length + P.length) etat[cle] = null;   // adresse abîmée
  const reaction = new ER.Reaction($('reaction'), {
    reactifs: R, produits: P, coefs: fini ? cfg.solution : (etat[cle] || R.concat(P).map(() => 1)),
    comptes: cfg.comptes !== false, detail: true, dessins: !!etat[cfg.d],
    onChange: c => { etat[cle] = c; maj(); },
  });
  $('switch').replaceWith(ER.interrupteur(!!etat[cfg.d], b => { etat[cfg.d] = b ? 1 : 0; reaction.options({ dessins: b }); }));
  let reussi = false;
  function maj() {
    const v = reaction.verifier();
    if (cfg.direct) $('bilan').innerHTML = ER.bilanHTML(v.bilan);
    const ind = ER.indice(R, P, reaction.coefs, cfg.ordre);
    if (ind.ok) return succes();
    if (cfg.direct) $('guide').innerHTML = `<p class="er-guide">${ind.html}</p>`;
  }
  function succes(silencieux) {
    if (reussi) return;
    reussi = true;
    reaction.activer(false);
    $('guide').innerHTML = '';
    if (!cfg.direct) $('bilan').innerHTML = ER.bilanHTML(reaction.bilan());
    $('fin').innerHTML = `<div class="callout-success er-retour">
        <p><b class="er-ok">${silencieux ? 'Équation équilibrée' : 'Bravo, l\'équation est équilibrée !'}</b></p>
        <p class="er-eq">${ER.equationHTML(R, P, reaction.coefs)}</p>
        ${cfg.bravo ? `<p>${cfg.bravo}</p>` : ''}
      </div>`;
    if (cfg.onReussi) cfg.onReussi(silencieux);
  }
  // vérification à la demande (réaction 3) : le bilan n'est montré qu'après « Vérifier »
  if (!cfg.direct && !fini) {
    const act = ajouter(bloc, `<div class="er-actions"><button type="button" class="btn-primary">Vérifier</button></div>`);
    $('fin').before(act);
    act.querySelector('button').onclick = () => {
      const v = reaction.verifier();
      $('bilan').innerHTML = ER.bilanHTML(v.bilan);
      etat.v3 = 1;
      if (v.equilibree && v.minimale) { act.remove(); return succes(); }
      const ind = ER.indice(R, P, reaction.coefs, cfg.ordre);
      $('guide').innerHTML = `<div class="callout-danger er-retour"><p><b class="er-ko">Pas encore.</b> ${ind.html}</p></div>`;
      $('reaction').classList.remove('er-secoue'); void $('reaction').offsetWidth; $('reaction').classList.add('er-secoue');
    };
    // nouveau réglage : l'ancien bilan n'est plus valable
    reaction.cfg.onChange = c => { etat[cle] = c; $('bilan').innerHTML = ''; $('guide').innerHTML = ''; };
    if (cfg.revoir) act.querySelector('button').click();
  }
  if (fini) succes(true);
  else if (cfg.direct) maj();
  return reaction;
}

/* ============================================================
   LES ÉTAPES
   ============================================================ */
const ETAPES = [
  // ---------- 0. Le principe ----------
  () => {
    const c = carte('1. Le principe');
    ajouter(c, `<div class="cours-bloc">
        <p>Au cours d'une transformation chimique, les atomes des réactifs se réarrangent pour former les produits. <b>Aucun atome ne disparaît, aucun atome n'apparaît.</b></p>
        <div class="cle"><p><b class="cle-titre">Conservation des éléments.</b> Pour chaque élément, il y a autant d'atomes dans les réactifs que dans les produits. On dit alors que l'équation de la réaction est <b>équilibrée</b>.</p></div>
        <p>Pour équilibrer une équation, on écrit devant chaque formule un <b>nombre stœchiométrique</b> : c'est le nombre de molécules de cette espèce. Le nombre 1 ne s'écrit pas.</p>
      </div>
      <p class="er-consigne">Essaie : change le nombre stœchiométrique devant H<sub>2</sub>O avec les flèches et observe le nombre d'atomes.</p>`);
    const demo = ajouter(c, '<div data-d="switch"></div><div data-d="r"></div>');
    const r = new ER.Reaction(demo.querySelector('[data-d="r"]'), { reactifs: ['H2O'], produits: [], comptes: true, detail: true, dessins: !!etat.d0, max: 9 });
    demo.querySelector('[data-d="switch"]').replaceWith(ER.interrupteur(!!etat.d0, b => { etat.d0 = b ? 1 : 0; r.options({ dessins: b }); }));
    ajouter(c, `<p class="er-guide">2 H<sub>2</sub>O, ce sont 2 molécules d'eau : 2 × 2 = 4 atomes H et 2 × 1 = 2 atomes O.</p>
      <div class="callout" style="margin-top:14px">
        <p><b>Attention : on ne modifie jamais les indices.</b> Changer un indice change la molécule, donc l'espèce chimique.</p>
        <div class="er-comparaison">
          <div><span class="er-formule">2 H<sub>2</sub>O</span><div class="er-mols">${ER.molecule('H2O').repeat(2)}</div><p>2 molécules d'<b>eau</b></p></div>
          <div><span class="er-formule">H<sub>2</sub>O<sub>2</sub></span><div class="er-mols">${ER.molecule('H2O2')}</div><p>1 molécule d'<b>eau oxygénée</b> : une autre espèce !</p></div>
        </div>
      </div>`);
    if (etat.e < 1) continuer(c, 1);
    return c;
  },

  // ---------- 1. Réaction 1 : un nombre égal à 2 ----------
  () => {
    const c = carte('2. Une première réaction');
    ajouter(c, `<p class="er-contexte">Le dihydrogène H<sub>2</sub> réagit avec le dichlore Cl<sub>2</sub> pour former du chlorure d'hydrogène HCl. Écrite ainsi, l'équation n'est pas équilibrée.</p>
      <p class="er-consigne" style="margin-top:10px">Ajuste les nombres stœchiométriques pour avoir autant d'atomes de chaque élément des deux côtés de la flèche. Le tableau compare les atomes des réactifs et des produits.</p>`);
    reactionGuidee(c, {
      r: ['H2', 'Cl2'], p: ['HCl'], solution: [1, 1, 2], cle: 'c1', d: 'd1', direct: true, ordre: ['H', 'Cl'],
      resolu: etat.e > 1,
      bravo: `Le nombre 2 devant HCl indique 2 molécules HCl : 2 × 1 = 2 atomes H et 2 × 1 = 2 atomes Cl, autant que dans les réactifs.`,
      onReussi: () => { if (etat.e < 2) continuer(c, 2); },
    });
    return c;
  },

  // ---------- 2. Du dessin au calcul ----------
  () => {
    const c = carte('3. Compter sans dessiner');
    ajouter(c, `<div class="cours-bloc">
        <p>Dessiner les molécules prend du temps. Regarde les atomes de 3 H<sub>2</sub>O : il y a 3 groupes de 2 atomes H, et 3 groupes de 1 atome O.</p>
        <div class="er-reaction" style="margin:10px 0" data-x="ex"></div>
        <p>Inutile de compter les boules une par une : on calcule directement.</p>
        <div class="cle"><p class="er-formule-cle">nombre d'atomes = nombre stœchiométrique × indice</p>
          <p style="text-align:center">3 H<sub>2</sub>O : 3 × 2 = <b>6 H</b> et 3 × 1 = <b>3 O</b></p></div>
      </div>
      <div class="er-lien-m2" style="margin-bottom:14px"><p>Tu as du mal à compter les atomes dans une molécule ?</p>
        <a class="btn-small" style="text-decoration:none" href="module_2.html" data-m2>S'entraîner (module 2) →</a></div>
      <p class="er-consigne">À toi : combien d'atomes de chaque élément ? Calcule, puis vérifie.</p>`);
    new ER.Reaction(c.querySelector('[data-x="ex"]'), { reactifs: ['H2O'], produits: [], coefs: [3], selecteurs: false, dessins: true });
    const EX = [
      { f: 'NH3', c: 2, dessins: true, titre: 'a) Avec le dessin' },
      { f: 'CO2', c: 3, dessins: false, titre: 'b) Sans le dessin (tu peux l\'afficher pour vérifier)' },
      { f: 'C2H6', c: 2, dessins: false, titre: 'c) Sans le dessin' },
    ];
    function exercice(i) {
      const q = EX[i];
      const d = ajouter(c, `<div class="er-sous-q"><p class="er-sous-q-titre">${q.titre}</p><div></div></div>`);
      new ER.Comptage(d.querySelector('.er-sous-q > div'), {
        formule: q.f, coef: q.c, dessins: q.dessins, resolu: i < etat.k || etat.e > 2,
        valeurs: i === etat.k ? etat.vk : null,
        regle: 'Multiplie le nombre stœchiométrique par l\'indice de chaque élément.',
        onValeurs: v => { etat.vk = v; },
        onReussi: () => {
          etat.k = i + 1; etat.vk = null;
          if (i < EX.length - 1) exercice(i + 1);
          else if (etat.e < 3) continuer(c, 3);
        },
      });
      // retour du module 2 : exercices déjà réussis affichés résolus
      if (i < etat.k || etat.e > 2) {
        if (i < EX.length - 1) exercice(i + 1);
        else if (etat.e < 3) continuer(c, 3);
      }
    }
    exercice(0);
    return c;
  },

  // ---------- 3. Réaction 2 : deux nombres différents de 1 ----------
  () => {
    const c = carte('4. Deux nombres à trouver');
    ajouter(c, `<p class="er-contexte">Le méthane CH<sub>4</sub> (gaz de ville) brûle dans le dioxygène O<sub>2</sub> : il se forme du dioxyde de carbone CO<sub>2</sub> et de l'eau H<sub>2</sub>O.</p>
      <div class="cle"><p><b class="cle-titre">Méthode</b></p>
        <ol class="er-liste">
          <li>Commence par un élément présent dans <b>une seule espèce</b> de chaque côté : ici C, puis H.</li>
          <li>Termine par l'élément présent <b>seul</b> dans une espèce : ici O, dans O<sub>2</sub>.</li>
          <li>Vérifie tous les éléments à la fin : modifier un nombre peut déséquilibrer un élément déjà équilibré.</li>
        </ol></div>
      <p class="er-consigne">Équilibre la réaction. Les dessins sont masqués : sous chaque formule, le calcul nombre stœchiométrique × indice est écrit pour toi.</p>`);
    reactionGuidee(c, {
      r: ['CH4', 'O2'], p: ['CO2', 'H2O'], solution: [1, 2, 1, 2], cle: 'c2', d: 'd2', direct: true, ordre: ['C', 'H', 'O'],
      resolu: etat.e > 3,
      bravo: `C est équilibré dès le départ (1 de chaque côté). Pour H, il faut 2 H<sub>2</sub>O (4 H). Il y a alors 2 + 2 = 4 atomes O dans les produits : il faut 2 O<sub>2</sub>.`,
      onReussi: () => { if (etat.e < 4) continuer(c, 4); },
    });
    return c;
  },

  // ---------- 4. Réaction 3 : l'élève calcule seul ----------
  () => {
    const c = carte('5. À toi de calculer');
    ajouter(c, `<p class="er-contexte">Le dihydrogène H<sub>2</sub> brûle dans le dioxygène O<sub>2</sub> en formant de l'eau H<sub>2</sub>O.</p>
      <p class="er-consigne" style="margin-top:10px">Cette fois, le nombre d'atomes n'est plus écrit : calcule-le toi-même (nombre stœchiométrique × indice), puis clique sur « Vérifier ».</p>`);
    reactionGuidee(c, {
      r: ['H2', 'O2'], p: ['H2O'], solution: [2, 1, 2], cle: 'c3', d: 'd3', direct: false, comptes: false, ordre: ['O', 'H'],
      resolu: etat.e > 4, revoir: !!etat.v3 && etat.e === 4,
      bravo: `On a équilibré O avec 2 H<sub>2</sub>O (2 O), ce qui donne 4 H dans les produits ; puis H avec 2 H<sub>2</sub> (4 H).`,
      onReussi: () => { if (etat.e < 5) continuer(c, 5, 'Ce qu\'il faut retenir →'); },
    });
    return c;
  },

  // ---------- 5. À retenir ----------
  () => {
    const c = carte('À retenir');
    ajouter(c, `<div class="cle"><p><b class="cle-titre">Conservation des éléments.</b> Une équation est équilibrée quand, pour chaque élément, il y a autant d'atomes dans les réactifs que dans les produits.</p></div>
      <div class="cle"><p><b class="cle-titre">Nombre stœchiométrique.</b> Écrit devant la formule, il donne le nombre de molécules. On ne modifie jamais les indices.</p>
        <p class="er-formule-cle">nombre d'atomes = nombre stœchiométrique × indice</p></div>
      <div class="cle"><p><b class="cle-titre">Méthode.</b> Commencer par les éléments présents dans une seule espèce de chaque côté, finir par ceux présents seuls (O<sub>2</sub>, H<sub>2</sub>…), puis tout vérifier.</p></div>
      <div class="cle"><p><b class="cle-titre">Les plus petits entiers.</b> On choisit les plus petits nombres entiers possibles : 2 H<sub>2</sub> + O<sub>2</sub> → 2 H<sub>2</sub>O, et non 4 H<sub>2</sub> + 2 O<sub>2</sub> → 4 H<sub>2</sub>O.</p></div>
      <div class="er-actions">
        <a class="btn-primary" style="text-decoration:none" href="module_3.html">Module 3 : s'entraîner →</a>
        <a class="btn-secondary" style="text-decoration:none" href="../index.html">Accueil de l'application</a>
      </div>`);
    return c;
  },
];

/* ---------- Construction : étapes déjà atteintes, puis position dans la page ---------- */
for (let i = 0; i <= etat.e; i++) ETAPES[i]();
if (restaure.y) {
  const y = parseInt(restaure.y, 10) || 0;
  const aller = () => window.scrollTo(0, y);
  requestAnimationFrame(aller);
  if (document.fonts) document.fonts.ready.then(aller);
  try { history.replaceState(null, '', location.pathname); } catch (_) { /* adresse inchangée */ }
}

ER.menu('module_1');
</script>
</body>
</html>
