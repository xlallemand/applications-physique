<title>Module 3 : questions sur l'intensité et le niveau sonores — Chapitre 18 : Ondes sonores</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="os.css">
<link rel="stylesheet" href="../../assets/sommaire.css">

<body>
<div id="app-nav"></div>
<div class="er-page" id="app"></div>

<script>
/* ============================================================
   10 questions tirées au hasard : L à partir de I (2), I à partir de
   L (2), audible ou non (1), intensité et distance (1), deux sources
   identiques (1), niveaux qui ne s'additionnent pas (1), deux sources
   différentes en trois parties (2).
   Erreurs diagnostiquées : niveaux additionnés, I0 oublié, log et ln
   confondus, facteur 10 oublié, L/10 oublié, distance et surface
   confondues.
   ============================================================ */
const { o, fq, fmt, sci, hasard, proche, fr, niveau, intensite } = OS;
const calc = h => `<p class="ph-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const I0f = '1,0 × 10<sup>−12</sup>';
function diagL(v, I) {
  if (Math.abs(v - 10 * Math.log10(I)) < .6) return 'Tu as oublié de diviser par I<sub>0</sub> : L = 10 log(I / I<sub>0</sub>), avec I<sub>0</sub> = 10<sup>−12</sup> W·m<sup>−2</sup>.';
  if (Math.abs(v - 10 * Math.log(I / 1e-12)) < .6) return 'Tu as utilisé la touche <b>ln</b> : il faut la touche <b>log</b> (logarithme décimal).';
  if (Math.abs(v - niveau(I) / 10) < .06) return 'Il manque le facteur 10 : L = <b>10</b> × log(I / I<sub>0</sub>).';
  return 'L = 10 log(I / I<sub>0</sub>) : calcule d\'abord I / I<sub>0</sub>, puis son log, puis multiplie par 10.';
}
const diagI = (v, L) => (proche(v, Math.pow(10, L / 10), .03) ? 'Il manque I<sub>0</sub> : I = I<sub>0</sub> × 10<sup>L/10</sup>.' : proche(v, 1e-12 * Math.pow(10, L), .03) ? 'L\'exposant est <b>L / 10</b>, pas L.' : 'I = I<sub>0</sub> × 10<sup>L/10</sup>, avec I<sub>0</sub> = 10<sup>−12</sup> W·m<sup>−2</sup>.');
const nombreL = (q, I, opts) => fq.nombre(q, 'L =', niveau(I), 'dB', Object.assign({ tol: .15, signe: false, affiche: fmt(niveau(I), 1), diag: v => diagL(v, I),
  solution: calc(`L = 10 log${fr('I', 'I<sub>0</sub>')} = 10 log${fr(sci(I, 2), I0f)} ≈ ${c(fmt(niveau(I), 1) + ' dB')}`) }, opts));
const sciI = (q, L, lab) => ({ type: 'sci', q, label: (lab || 'I') + ' =', valeur: intensite(L), unite: 'W·m<sup>−2</sup>', cs: 2, diag: v => diagI(v, L),
  solution: calc(`${lab || 'I'} = I<sub>0</sub> × 10<sup>L/10</sup> = ${I0f} × 10<sup>${fmt(L)}/10</sup> ≈ ${c(sci(intensite(L), 2) + ' W·m<sup>−2</sup>')}`) });

/* ---------- Groupe 1 : L à partir de I ---------- */
// source et ordre de grandeur de son intensité sonore (W·m⁻²)
const SOURCES_I = [['un murmure', 1e-10], ['une salle de classe', 1e-6], ['une rue animée', 1e-5], ['une enceinte de concert', 1e-2], ['un aspirateur', 1e-5], ['un marteau-piqueur', 1e-3]];
function LdeI() {
  const s = hasard(SOURCES_I), I = +(hasard([1, 2, 2.5, 4, 5, 8]) * Math.pow(10, Math.floor(Math.log10(s[1])))).toPrecision(2);
  return { theme: 'Niveau sonore', enonce: `<p>Près d'${s[0]}, l'intensité sonore vaut I = ${sci(I, 2)} W·m<sup>−2</sup>.</p><p class="ph-donnees">L = 10 log(I / I<sub>0</sub>) ; I<sub>0</sub> = ${I0f} W·m<sup>−2</sup>.</p>`,
    parties: [nombreL('Calcule le niveau sonore L (au dixième).', I)] };
}

/* ---------- Groupe 2 : I à partir de L ---------- */
function IdeL() {
  const L = hasard([25, 32, 40, 48, 55, 63, 78, 85, 96, 100, 115, 120]);
  return { theme: 'Intensité sonore', enonce: `<p>Un son a un niveau sonore L = ${L} dB.</p><p class="ph-donnees">I = I<sub>0</sub> × 10<sup>L/10</sup> ; I<sub>0</sub> = ${I0f} W·m<sup>−2</sup>.</p>`,
    parties: [sciI('Calcule son intensité sonore I (2 chiffres significatifs).', L)] };
}

/* ---------- Groupe 3 : audible ou non ---------- */
function audible() {
  const aud = Math.random() < .5, I = aud ? hasard([2, 5, 8]) * 1e-12 * hasard([1, 10, 100]) : hasard([2, 4, 6, 8]) * 1e-13;
  return { theme: 'Audible ou non', enonce: `<p>Un son a une intensité sonore I = ${sci(I, 1)} W·m<sup>−2</sup>.</p>`,
    parties: [fq.choix('Peut-il être entendu (dans les meilleures conditions) ?', [o('oui', 'Oui'), o('non', 'Non')], aud ? 'oui' : 'non',
      { melanger: false, indices: { oui: `Compare I à I<sub>0</sub> = ${I0f} W·m<sup>−2</sup> : ici I &lt; I<sub>0</sub>, donc L &lt; 0 dB.`, non: `Compare I à I<sub>0</sub> = ${I0f} W·m<sup>−2</sup> : ici I &gt; I<sub>0</sub>, donc L &gt; 0 dB.` },
        solution: calc(`L = 10 log${fr(sci(I, 1), I0f)} ≈ ${c(fmt(niveau(I), 1) + ' dB')}`) + `<p>${aud ? 'L &gt; 0 dB : le son peut être entendu.' : 'L &lt; 0 dB (I &lt; I<sub>0</sub>) : le son est trop faible pour être entendu.'}</p>` })] };
}

/* ---------- Groupe 4 : intensité et distance ---------- */
function distance() {
  const k = hasard([2, 3]), I1 = hasard([1.8, 3.6, 7.2, 9]) * 1e-4;
  return { theme: 'Intensité et distance', enonce: `<p>À 2 m d'un haut-parleur, l'intensité sonore vaut ${sci(I1, 2)} W·m<sup>−2</sup>. On se place à ${2 * k} m.</p>${OS.svgDistance()}`,
    parties: [{ type: 'sci', q: `Quelle est l'intensité sonore à ${2 * k} m ?`, label: 'I =', valeur: I1 / (k * k), unite: 'W·m<sup>−2</sup>', cs: 2,
      diag: v => (proche(v, I1 / k, .03) ? `La distance est multipliée par ${k}, la <b>surface</b> par ${k * k} : on divise I par ${k * k}.` : proche(v, I1 * k * k, .03) ? 'Plus loin, l\'intensité <b>diminue</b>.' : `Distance × ${k}, surface × ${k * k}.`),
      solution: calc(`Distance × ${k} : surface × ${k * k}, donc I = ${fr(sci(I1, 2), String(k * k))} = ${c(sci(I1 / (k * k), 2) + ' W·m<sup>−2</sup>')}`) }] };
}

/* ---------- Groupe 5 : sources identiques, niveaux qui ne s'additionnent pas ---------- */
function identiques() {
  const L = hasard([62, 68, 74, 81, 87, 93]);
  return { theme: 'Deux sources identiques', enonce: `<p>Un haut-parleur seul produit un niveau sonore de ${L} dB. On ajoute un second haut-parleur identique, qui diffuse le même son.</p>`,
    parties: [fq.nombre('Quel est le niveau sonore avec les deux haut-parleurs ?', 'L =', niveau(2 * intensite(L)), 'dB', { tol: .2, signe: false, affiche: fmt(L + 3),
      diag: v => (Math.abs(v - 2 * L) < .5 ? '<b>Les niveaux ne s\'additionnent pas</b> : l\'intensité double, le niveau augmente de 3 dB.' : 'Intensité doublée : + 3 dB.'),
      solution: calc(`L = 10 log${fr('2 I<sub>1</sub>', 'I<sub>0</sub>')} = ${L} + 10 log 2 ≈ ${c(fmt(L + 3) + ' dB')}`) })] };
}
function pasAddition() {
  const L = hasard([80, 85, 90]);
  return { theme: 'Additionner des sons', enonce: `<p>Deux machines identiques produisent chacune ${L} dB. Un élève affirme : « ensemble, elles produisent ${2 * L} dB ».</p>`,
    parties: [fq.choix('A-t-il raison ?', [o('ok', `Non : les intensités s'additionnent, le niveau passe à ${L + 3} dB`), o('oui', 'Oui : les niveaux s\'additionnent'), o('meme', `Non : le niveau reste ${L} dB`)], 'ok',
      { colonne: true, indices: { oui: 'Ce sont les intensités qui s\'additionnent, pas les niveaux.', meme: 'Deux machines font plus de bruit qu\'une : l\'intensité double.' },
        solution: `<p>L'intensité double : le niveau augmente de 3 dB, soit ${L + 3} dB. (${2 * L} dB serait un son destructeur pour l'oreille !)</p>` })] };
}

/* ---------- Groupe 6 : deux sources différentes ---------- */
function differentes() {
  const LA = hasard([50, 55, 60, 65, 70, 75]), LB = LA + hasard([2, 4, 6, 7, 9]);
  const IA = intensite(LA), IB = intensite(LB), It = IA + IB;
  return { theme: 'Deux sources différentes', enonce: `<p>Deux sources sonores produisent seules L<sub>1</sub> = ${LA} dB et L<sub>2</sub> = ${LB} dB. Elles fonctionnent ensemble.</p><p class="ph-donnees">L = 10 log(I / I<sub>0</sub>) ; I = I<sub>0</sub> × 10<sup>L/10</sup> ; I<sub>0</sub> = ${I0f} W·m<sup>−2</sup>.</p>`,
    parties: [
      sciI('1. Calcule l\'intensité sonore I<sub>1</sub> de la première source.', LA, 'I<sub>1</sub>'),
      sciI('Calcule celle de la deuxième, I<sub>2</sub>.', LB, 'I<sub>2</sub>'),
      { type: 'sci', q: '2. Calcule l\'intensité sonore totale I.', label: 'I =', valeur: It, unite: 'W·m<sup>−2</sup>', cs: 2,
        diag: v => (proche(v, intensite(LA + LB), .05) ? 'Ce sont les intensités qui s\'additionnent : I = I<sub>1</sub> + I<sub>2</sub>.' : 'I = I<sub>1</sub> + I<sub>2</sub> : attention aux puissances de 10.'),
        solution: calc(`I = ${sci(IA, 2)} + ${sci(IB, 2)} ≈ ${c(sci(It, 2) + ' W·m<sup>−2</sup>')}`) },
      nombreL('3. Déduis-en le niveau sonore total (au dixième).', It, { diag: v => (Math.abs(v - (LA + LB)) < .5 ? '<b>Les niveaux ne s\'additionnent pas</b> : L = 10 log(I / I<sub>0</sub>) avec l\'intensité totale.' : diagL(v, It)) }),
    ] };
}

// tirage : 2 + 2 + 1 + 1 + 2 + 2 questions
function tirage() {
  return [LdeI(), LdeI(), IdeL(), IdeL(), audible(), distance(), identiques(), pasAddition(), differentes(), differentes()];
}

OS.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 3 · QUESTIONS', titre: 'Intensité et niveau sonores',
  intro: '<p class="er-contexte">10 questions tirées au hasard : niveau sonore à partir de l\'intensité et l\'inverse, audible ou non, distance, deux sources (les intensités s\'additionnent). Garde ta calculatrice à portée de main (touches log et 10<sup>x</sup>).</p>',
  questions: tirage,
  revoir: { href: 'module_3a_cours.html', label: 'Revoir les cours' },
  suite: { href: 'module_4a_cours.html', label: 'Module 4 : audiogramme et atténuation →' },
});
OS.menu('module_3_questions');
</script>
</body>
</html>
