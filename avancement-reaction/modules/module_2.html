<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : Le tableau d'avancement — Avancement d'une réaction</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/molecules.css">
<link rel="stylesheet" href="av.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/molecules.js"></script>
<script src="av.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="av-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · SECONDE</span>
    <h2 class="er-titre">Le tableau d'avancement</h2>
    <p class="er-contexte">Un tableau d'avancement résume l'évolution des quantités au cours de la réaction. On le construit d'abord avec des molécules.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   1. L'avancement x relié à la simulation
   2. et 3. Tableaux construits étape par étape (avec la ligne
      « à chaque fois » et la frise de l'avancement)
   4. À retenir
   ============================================================ */
const zone = document.getElementById('etapes');
const fH = MOL.formuleHTML;

function carte(html) {
  const c = document.createElement('section');
  c.className = 'er-card';
  c.innerHTML = html;
  zone.appendChild(c);
  return c;
}
function continuer(parent, suivante, texte) {
  parent.insertAdjacentHTML('beforeend', `<div class="av-suite"><button type="button" class="btn-primary">${texte || 'Continuer →'}</button></div>`);
  const b = parent.querySelector('.av-suite:last-child button');
  b.onclick = () => { b.parentNode.remove(); const c = suivante(); c.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
}

/* ---------- 1. L'avancement x ---------- */
function etape1() {
  const q = { r: ['CH4', 'O2'], p: ['CO2', 'H2O'], c: [1, 2, 1, 2], n0: [3, 4, 0, 0] };
  const c = carte(`<h3 class="cours-titre">1. L'avancement x</h3>
    <div class="cle"><p><b class="cle-titre">L'avancement</b>, noté <b>x</b>, est le nombre de fois que la réaction a eu lieu. Au départ, x = 0.</p></div>
    <p class="av-equation">${AV.equationHTML(q)}</p>
    <p class="er-contexte">On reprend 3 molécules de CH<sub>4</sub> et 4 molécules de O<sub>2</sub>. Fais avancer la réaction et regarde le tableau : chaque quantité se calcule à partir de la quantité initiale et du nombre stœchiométrique.</p>
    <div data-x="sim" style="margin-top:12px"></div>
    <div class="av-tab-wrap" data-x="tab" style="margin-top:12px"></div>`);
  const tab = c.querySelector('[data-x="tab"]');
  function tableau(x) {
    const esp = q.r.concat(q.p), nR = q.r.length;
    const sg = k => (k < nR ? '−' : '+');
    const val = k => q.n0[k] + (k < nR ? -1 : 1) * q.c[k] * x;
    tab.innerHTML = `<table class="av-tab"><thead><tr><th>État</th><th><span class="av-long">Avancement</span><span class="av-court">Av.</span></th>${AV.enteteEspeces(q, true)}</tr></thead><tbody>
      <tr><td class="etat">initial</td><td class="x">0</td>${esp.map((_, k) => `<td>${q.n0[k]}</td>`).join('')}</tr>
      <tr class="pont"><td class="etat">à chaque fois</td><td class="x">+1</td>${esp.map((f, k) => `<td>${sg(k)}${q.c[k]} ${fH(f)}</td>`).join('')}</tr>
      <tr><td class="etat">en cours</td><td class="x">x = ${x}</td>${esp.map((_, k) => `<td>${q.n0[k]} ${sg(k)} ${q.c[k] > 1 ? q.c[k] + ' × ' : ''}${x} = <b>${val(k)}</b></td>`).join('')}</tr>
      </tbody></table><p class="av-tab-unite">en nombre de molécules</p>`;
  }
  tableau(0);
  new AV.Simulation(c.querySelector('[data-x="sim"]'), Object.assign({}, q, {
    onEtape: tableau,
    onFin: () => {
      if (c.dataset.fini) return;
      c.dataset.fini = 1;
      c.insertAdjacentHTML('beforeend', `<div class="cle"><p>Pour un avancement x quelconque, la quantité de O<sub>2</sub> est <b>4 − 2x</b> : on part de 4 et on en retire 2 à chaque fois. Celle de H<sub>2</sub>O est <b>0 + 2x</b>.</p>
        <p>La réaction s'arrête pour x = 2 : c'est l'<b>avancement maximal</b>, noté <b>x<sub>max</sub></b>.</p></div>`);
      continuer(c, etape2, 'Construire le tableau →');
    },
  }));
  return c;
}

/* ---------- 2. et 3. Construire le tableau ---------- */
function exercice(titre, q, texte, suivante) {
  const c = carte(`<h3 class="cours-titre">${titre}</h3>
    <p class="av-equation">${AV.equationHTML(q)}</p>
    <p class="er-contexte">${texte}</p><div data-x="ex" style="margin-top:12px"></div>`);
  new AV.Exercice(c.querySelector('[data-x="ex"]'), Object.assign({}, q, {
    unite: 'molécules', mode: 'entier', guide: true, molecules: true, frise: true,
    etapes: ['initial', 'pont', 'cours', 'hyp', 'concl', 'final'],
    onFini: () => continuer(c, suivante),
  }));
  return c;
}
const etape2 = () => exercice('2. Construire le tableau : combustion du méthane',
  { r: ['CH4', 'O2'], p: ['CO2', 'H2O'], c: [1, 2, 1, 2], n0: [3, 4, 0, 0] },
  'Au départ : 3 molécules de CH<sub>4</sub> et 4 molécules de O<sub>2</sub>. Complète le tableau étape par étape.', etape3);
const etape3 = () => exercice("3. Un autre tableau : synthèse de l'ammoniac",
  { r: ['N2', 'H2'], p: ['NH3'], c: [1, 3, 2], n0: [4, 9, 0] },
  'Au départ : 4 molécules de N<sub>2</sub> et 9 molécules de H<sub>2</sub>.', etape4);

/* ---------- 4. À retenir ---------- */
function etape4() {
  const c = carte(`<h3 class="cours-titre">À retenir : la méthode</h3>
    <div class="cle"><p><b class="cle-titre">1. État initial</b> : les quantités de départ ; 0 pour les produits.</p></div>
    <div class="cle"><p><b class="cle-titre">2. État en cours</b> : réactif : n<sub>initial</sub> <b>−</b> nombre stœchiométrique × x ; produit : n<sub>initial</sub> <b>+</b> nombre stœchiométrique × x.</p></div>
    <div class="cle"><p><b class="cle-titre">3. Hypothèses</b> : pour chaque réactif, on suppose qu'il est épuisé (quantité finale nulle) et on calcule x<sub>max</sub>.</p></div>
    <div class="cle"><p><b class="cle-titre">4. Conclusion</b> : la réaction s'arrête au premier réactif épuisé : on garde la <b>plus petite</b> valeur de x<sub>max</sub>. Ce réactif est le réactif limitant.</p></div>
    <div class="cle"><p><b class="cle-titre">5. État final</b> : on remplace x par x<sub>max</sub> dans la ligne « en cours ».</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_3.html">Module 3 : des molécules aux moles →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html">Fiche récapitulative</a></div>`);
  SOM.marquer({ fait: true });                                 // dernière étape atteinte : cours terminé
  return c;
}

etape1();
AV.menu('module_2');
</script>
</body>
</html>
