<title>Module 5 : Avec des puissances de 10 — Avancement d'une réaction</title>
<link rel="stylesheet" href="../../assets/theme.css">

<body>
<div id="app-nav"></div>
<div class="av-page">
  <div class="er-card">
    <span class="er-badge">MODULE 5 · COURS</span>
    <h2 class="er-titre">Avec des puissances de 10</h2>
    <p class="er-contexte">En classe, les quantités de matière sont souvent petites : quelques millimoles. Tu vas les écrire en <b>écriture scientifique</b>, les comparer et calculer avec, puis construire le <b>tableau d'avancement</b> : la méthode ne change pas.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Écrire et saisir une quantité (champ de l'application : nombre
      au clavier, exposant avec les flèches)
   2. Comparer et calculer avec des puissances de 10
   3. Le tableau d'avancement (exemple : iodure de plomb ;
      tableau guidé : hydroxyde de cuivre)
   À retenir
   ============================================================ */
const { hasard, exemple } = COURS;
const fH = MOL.formuleHTML;
const P = v => AV.fmt(v, 'puissance');          // 6,0 × 10⁻³
const D = v => AV.fmt(v);                       // 0,006
const eq = q => `<p class="av-equation">${AV.equationHTML(q)}</p>`;
const xm = 'x<sub>max</sub>';
const egal = AV.egal;
// v / juste est une puissance de 10 (autre que 1) : erreur d'exposant
const puiss10 = r => isFinite(r) && r > 0 && Math.abs(Math.log10(r) - Math.round(Math.log10(r))) < 1e-6 && Math.round(Math.log10(r)) !== 0;
const exposant = v => Math.floor(Math.log10(Math.abs(v)) + 1e-9);
// une valeur saisie avec le champ de l'application (nombre devant au clavier, exposant avec les flèches)
const valeur = (question, v, diag, solution) => AV.partieValeurs({ mode: 'puissance', q: question,
  champs: [{ lab: '', valeur: v, unite: 'mol', aria: 'valeur' }], diag: vs => diag(vs[0]), solution });

/* ---------- 1. Écrire et saisir une quantité ---------- */
function etape1(c) {
  const carte = c.carte('1. Écrire et saisir une quantité');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>0,0060 mol s'écrit <b>6,0 × 10<sup>−3</sup> mol</b> : un nombre entre 1 et 10, multiplié par une puissance de 10.</p>
      <div class="cle"><p><b class="cle-titre">Écriture scientifique</b> : a × 10<sup>n</sup>, avec a entre 1 et 10. Pour une quantité plus petite que 1, l'exposant n est négatif : c'est le nombre de rangs dont on déplace la virgule vers la droite.</p></div>
      <div class="cle"><p><b class="cle-titre">Pour saisir une valeur</b> : écris le nombre devant au clavier (6,0), puis règle l'exposant de 10 avec les flèches (−3).</p></div>
    </div>
    ${exemple(`<p class="crs-calc">0,0060 mol = <span class="c">6,0 × 10<sup>−3</sup> mol</span> (la virgule se déplace de 3 rangs)<br>
      0,025 mol = <span class="c">2,5 × 10<sup>−2</sup> mol</span> (2 rangs)<br>
      0,00090 mol = <span class="c">9,0 × 10<sup>−4</sup> mol</span> (4 rangs)</p>`)}`);

  const t2 = hasard([0.0025, 0.012, 0.0004, 0.075, 0.008, 0.035]), e2 = exposant(t2);
  const [a3, e3] = hasard([[4.0, -3], [2.5, -2], [7.5, -4], [1.2, -2]]), t3 = a3 * Math.pow(10, e3);
  c.aToi(carte, [
    { titre: 'Saisir une valeur',
      parties: [valeur('Saisis 6,0 × 10<sup>−3</sup> mol.', 6e-3, v => {
        if (egal(v, 6e3)) return 'L\'exposant est −3, pas 3 : appuie sur la flèche du bas.';
        if (egal(v, 6)) return 'Règle aussi l\'exposant : appuie 3 fois sur la flèche du bas pour obtenir −3.';
        if (puiss10(v / 6e-3)) return 'Le nombre devant est juste, mais pas l\'exposant : il faut −3.';
        return 'Écris 6,0 dans la case, puis appuie 3 fois sur la flèche du bas pour obtenir −3.';
      }, '<p>Tu peux aussi écrire 60 × 10<sup>−4</sup> ou 0,006 × 10<sup>0</sup> : seule la valeur compte.</p>')] },
    { titre: 'Passer en écriture scientifique',
      parties: [valeur(`Écris ${D(t2)} mol en écriture scientifique.`, t2, v => {
        if (egal(v, t2 * Math.pow(10, -2 * e2))) return `L'exposant est négatif : ${D(t2)} est plus petit que 1.`;
        if (puiss10(v / t2)) { const k = Math.abs(Math.round(Math.log10(v / t2))); return `Tu t'es trompé de ${k} rang${k > 1 ? 's' : ''} : compte de combien de rangs la virgule se déplace vers la droite pour obtenir un nombre entre 1 et 10.`; }
        return `Le nombre devant s'écrit avec les chiffres de ${D(t2)}, entre 1 et 10 : ${AV.fmt(t2 / Math.pow(10, e2))}.`;
      }, `<p class="crs-calc">${D(t2)} mol = <span class="c">${P(t2)} mol</span> (la virgule se déplace de ${-e2} rang${-e2 > 1 ? 's' : ''})</p>`)] },
    { titre: 'Dans l\'autre sens',
      parties: [{ type: 'nombre', q: `Écris ${P(t3)} mol en écriture décimale.`, label: 'n =', unite: 'mol', valeur: t3, signe: false,
        diag: v => {
          if (egal(v, a3 * Math.pow(10, -e3))) return 'L\'exposant est négatif : le nombre est plus petit que 1.';
          if (puiss10(v / t3)) return `Vérifie le nombre de zéros : on déplace la virgule de ${-e3} rangs vers la gauche (10<sup>${String(e3).replace('-', '−')}</sup> = ${D(Math.pow(10, e3))}).`;
          return `Pars de ${AV.fmt(a3)} et déplace la virgule de ${-e3} rangs vers la gauche.`;
        },
        solution: `<p class="crs-calc">${P(t3)} mol = <span class="c">${D(t3)} mol</span></p>` }] },
  ]);
  return carte;
}

/* ---------- 2. Comparer et calculer ---------- */
function etape2(c) {
  const carte = c.carte('2. Comparer et calculer avec des puissances de 10');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Comparer</b> : regarde d'abord les exposants. Le plus petit exposant donne le plus petit nombre (−4 est plus petit que −3). Si les exposants sont égaux, compare les nombres devant.</p></div>
      <div class="cle"><p><b class="cle-titre">Diviser ou multiplier par un nombre</b> : on divise ou on multiplie le nombre devant ; s'il sort de l'intervalle de 1 à 10, on change l'exposant.</p>
        <p><b class="cle-titre">Additionner ou soustraire</b> : on écrit d'abord les deux nombres avec le même exposant.</p></div>
    </div>
    ${exemple(`<p class="crs-calc">5,0 × 10<sup>−3</sup> &lt; 6,0 × 10<sup>−3</sup> (même exposant : 5,0 &lt; 6,0)<br>
      9,0 × 10<sup>−4</sup> &lt; 1,0 × 10<sup>−3</sup> (−4 est plus petit que −3)<br>
      1,0 × 10<sup>−2</sup> ÷ 2 = 0,50 × 10<sup>−2</sup> = <span class="c">5,0 × 10<sup>−3</sup></span><br>
      6,0 × 10<sup>−3</sup> − 5,0 × 10<sup>−3</sup> = <span class="c">1,0 × 10<sup>−3</sup></span></p>`)}`);

  // a. comparer : le plus petit exposant l'emporte (piège : son nombre devant est plus grand)
  const [p1, p2] = hasard([[8e-4, 2e-3], [5e-3, 3e-2], [9.5e-3, 1.2e-2], [7e-4, 1.5e-3]]);
  const [s1, s2] = hasard([[5e-3, 6e-3], [2.5e-2, 4e-2], [1.5e-4, 9e-4]]);
  // b. diviser par le nombre stœchiométrique
  const [nd, cd] = hasard([[1.2e-2, 3], [1e-2, 2], [9e-3, 3], [1.5e-3, 3], [8e-3, 2], [6e-3, 2]]), td = nd / cd;
  // c. état final d'un réactif : n − c × x
  const [ns, cs, xs] = hasard([[6e-3, 1, 5e-3], [5e-3, 2, 2e-3], [1e-2, 2, 3e-3], [8e-3, 3, 2e-3], [2e-2, 2, 6e-3]]), ts = ns - cs * xs;
  c.aToi(carte, [
    { titre: 'Comparer',
      parties: [
        { type: 'choix', q: 'Quelle est la plus petite quantité ?', options: [{ id: 'a', label: P(p1) + ' mol' }, { id: 'b', label: P(p2) + ' mol' }], bonne: 'a',
          indices: { b: `Tu as comparé les nombres devant. Compare d'abord les exposants : ${exposant(p1)} est plus petit que ${exposant(p2)}, donc ${P(p1)} = ${D(p1)} est plus petit que ${P(p2)} = ${D(p2)}.`.replace(/-/g, '−') },
          solution: `<p>${P(p1)} = ${D(p1)} mol est plus petit que ${P(p2)} = ${D(p2)} mol : l'exposant est plus petit.</p>` },
        { type: 'choix', q: 'Et ici ?', options: [{ id: 'a', label: P(s1) + ' mol' }, { id: 'b', label: P(s2) + ' mol' }], bonne: 'a',
          indices: { b: `Les exposants sont égaux : compare les nombres devant, ${AV.fmt(s1 / Math.pow(10, exposant(s1)))} est plus petit que ${AV.fmt(s2 / Math.pow(10, exposant(s2)))}.` },
          solution: `<p>Même exposant : on compare les nombres devant. ${P(s1)} mol est la plus petite quantité.</p>` },
      ] },
    { titre: 'Diviser par un nombre stœchiométrique',
      parties: [valeur(`Calcule ${P(nd)} ÷ ${cd}.`, td, v => {
        if (egal(v, nd)) return `Tu n'as pas divisé par ${cd}.`;
        if (egal(v, nd * cd)) return `Tu as multiplié par ${cd} au lieu de diviser.`;
        if (puiss10(v / td)) return 'Le nombre devant est juste, mais pas la puissance de 10. Si le nombre devant devient plus petit que 1, l\'exposant diminue de 1 : 0,50 × 10<sup>−2</sup> = 5,0 × 10<sup>−3</sup>.';
        return `Divise le nombre devant par ${cd} et garde la puissance de 10, puis réécris le résultat si besoin.`;
      }, `<p class="crs-calc">${P(nd)} ÷ ${cd} = <span class="c">${P(td)} mol</span></p>`)] },
    { titre: 'Soustraire',
      parties: [valeur(`Calcule ${P(ns)} − ${cs > 1 ? cs + ' × ' : ''}${P(xs)}.`, ts, v => {
        if (cs > 1 && egal(v, ns - xs)) return `Tu as oublié de multiplier par ${cs} : ${cs} × ${P(xs)} = ${P(cs * xs)}.`;
        if (egal(v, ns + cs * xs)) return 'Tu as additionné : on soustrait.';
        if (puiss10(v / ts)) return 'Vérifie la puissance de 10 : écris les deux nombres avec le même exposant avant de soustraire.';
        return `Écris les deux nombres avec le même exposant (10<sup>${String(exposant(ns)).replace('-', '−')}</sup>), puis soustrais les nombres devant.`;
      }, `<p class="crs-calc">${cs > 1 ? `${cs} × ${P(xs)} = ${P(cs * xs)}<br>` : ''}${P(ns)} − ${P(cs * xs)} = <span class="c">${P(ts)} mol</span></p>`)] },
  ]);
  return carte;
}

/* ---------- 3. Le tableau d'avancement ---------- */
function etape3(c) {
  const carte = c.carte('3. Le tableau d\'avancement avec des puissances de 10');
  const q = { r: ['Pb2+', 'I-'], p: ['PbI2'], c: [1, 2, 1], n0: [6.0e-3, 1.0e-2, 0] };
  c.ajouter(carte, `<div class="cours-bloc">
      <p>La méthode est la même qu'avec des nombres simples : seuls les calculs se font en écriture scientifique.</p>
      <div class="cle"><p><b class="cle-titre">Hypothèses</b> : ${xm} = n<sub>initial</sub> ÷ nombre stœchiométrique pour chaque réactif. <b class="cle-titre">Conclusion</b> : on compare les deux valeurs (exposants d'abord) et on garde la plus petite. <b class="cle-titre">État final</b> : même exposant pour soustraire.</p></div>
    </div>
    ${exemple(`${eq(q)}<p>On mélange une solution contenant 6,0 × 10<sup>−3</sup> mol d'ions plomb Pb<sup>2+</sup> et une solution contenant 1,0 × 10<sup>−2</sup> mol d'ions iodure I<sup>−</sup>. Il se forme un précipité jaune d'iodure de plomb PbI<sub>2</sub>.</p>
      ${AV.tableauHTML(q, { unite: 'mol', mode: 'puissance' })}
      <p class="crs-calc">Si Pb<sup>2+</sup> est limitant : ${xm} = 6,0 × 10<sup>−3</sup> mol<br>Si I<sup>−</sup> est limitant : ${xm} = 1,0 × 10<sup>−2</sup> ÷ 2 = 5,0 × 10<sup>−3</sup> mol</p>
      <p>Même exposant, 5,0 &lt; 6,0 : <b>${xm} = 5,0 × 10<sup>−3</sup> mol</b>, I<sup>−</sup> est le réactif limitant.</p>
      <p class="crs-calc">Pb<sup>2+</sup> : 6,0 × 10<sup>−3</sup> − 5,0 × 10<sup>−3</sup> = <span class="c">1,0 × 10<sup>−3</sup> mol</span><br>I<sup>−</sup> : 1,0 × 10<sup>−2</sup> − 2 × 5,0 × 10<sup>−3</sup> = <span class="c">0 mol</span><br>PbI<sub>2</sub> : <span class="c">5,0 × 10<sup>−3</sup> mol</span></p>`)}`);

  const r = hasard(BANQUE.REACTIONS.ions1.filter(x => x.c[1] === 2 && x.r[0] !== 'Pb2+' && x.r[0] !== 'Cu2+'));
  const a = BANQUE.quantites(r, BANQUE.NIVEAUX.puissance(hasard([-2, -3])));
  const cu = { r: ['Cu2+', 'HO-'], p: ['Cu(OH)2'], c: [1, 2, 1], n0: [2.0e-3, 5.0e-3, 0] };
  c.aToi(carte, [
    { titre: a.nom, enonce: `${eq(a)}<p>On mélange ${a.r.map((s, k) => `${P(a.n0[k])} mol de ${fH(s)}`).join(' et ')}.</p>`,
      parties: [AV.partieRapports(a, 'puissance', s => `Si ${fH(s)} est limitant : ${xm} =`, `Calcule ${xm} pour chaque hypothèse.`), AV.partieLimitant(a, 'puissance')] },
    { titre: 'Précipitation de l\'hydroxyde de cuivre : le tableau complet',
      enonce: `${eq(cu)}<p>On mélange 2,0 × 10<sup>−3</sup> mol d'ions cuivre Cu<sup>2+</sup> et 5,0 × 10<sup>−3</sup> mol d'ions hydroxyde HO<sup>−</sup>. Il se forme un précipité bleu d'hydroxyde de cuivre Cu(OH)<sub>2</sub>.</p>`,
      parties: [AV.partieExercice(Object.assign({}, cu, { unite: 'mol', mode: 'puissance', etapes: ['initial', 'cours', 'hyp', 'concl', 'final'] }))] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Écriture scientifique</b> : 0,0060 mol = 6,0 × 10<sup>−3</sup> mol (un nombre entre 1 et 10, multiplié par une puissance de 10).</p></div>
    <div class="cle"><p>La méthode du tableau est la même qu'avec des nombres simples. Pour comparer les deux valeurs de ${xm}, regarde d'abord les exposants : 5,0 × 10<sup>−3</sup> &lt; 6,0 × 10<sup>−3</sup>, et 9,0 × 10<sup>−4</sup> &lt; 1,0 × 10<sup>−3</sup>.</p></div>
    <div class="cle"><p>Pour calculer l'état final, écris les deux quantités avec le même exposant : 6,0 × 10<sup>−3</sup> − 5,0 × 10<sup>−3</sup> = 1,0 × 10<sup>−3</sup> mol.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_6.html">Module 6 : s'entraîner →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_7.html">Module 7 : sans tableau</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_5.html">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
AV.menu('module_5');
</script>
</body>
