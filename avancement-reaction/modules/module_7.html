<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 7 : Aller plus loin, sans tableau — Avancement d'une réaction</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/molecules.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="av.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/molecules.js"></script>
<script src="av.js"></script>
<script src="banque.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="av-page">
  <div class="er-card">
    <span class="er-badge">MODULE 7 · COURS</span>
    <h2 class="er-titre">Aller plus loin : sans tableau</h2>
    <p class="er-contexte">Avec un peu d'habitude, on trouve le <b>réactif limitant</b> et <b>x<sub>max</sub></b> directement, sans écrire le tableau d'avancement, puis les quantités à l'<b>état final</b>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Réactif limitant et x_max sans tableau (frise de l'avancement)
   2. Les quantités à l'état final
   3. Tout enchaîner (exemples guidés AV.Exercice sans tableau :
      synthèse de l'eau avec la frise, iodure de plomb)
   À retenir ; l'entraînement noté est sur sa propre page
   (module_7_entrainement.html).
   ============================================================ */
const { hasard, exemple } = COURS;
const fH = MOL.formuleHTML;
const eq = q => `<p class="av-equation">${AV.equationHTML(q)}</p>`;
const xm = 'x<sub>max</sub>';
const melange = (q, mode) => `On mélange ${q.r.map((s, k) => `${AV.fmt(q.n0[k], mode)} mol de ${fH(s)}`).join(' et ')}.`;
const rapport = s => `${fH(s)} :`;
const puiss10 = r => isFinite(r) && r > 0 && Math.abs(Math.log10(r) - Math.round(Math.log10(r))) < 1e-6 && Math.round(Math.log10(r)) !== 0;
// Exemple guidé sans tableau (AV.Exercice : rapports, conclusion, état final)
const guide = (q, mode, frise) => AV.partieExercice(Object.assign({}, q, { unite: 'mol', mode, frise, sansTableau: true, etapes: ['ratio', 'concl', 'final'] }));

// x_max saisi directement (puissances de 10)
function partieXmax(q) {
  const K = AV.calculer(q), P = v => AV.fmt(v, 'puissance');
  return AV.partieValeurs({ mode: 'puissance', q: `Quelle est la valeur de ${xm} ?`,
    champs: [{ lab: `${xm} =`, valeur: K.xmax, unite: 'mol', aria: 'x max' }],
    diag: vs => {
      const v = vs[0];
      if (AV.egal(v, Math.max(...K.xm))) return 'C\'est la plus grande des deux valeurs. La réaction s\'arrête au premier réactif épuisé : on garde la plus petite.';
      const k = q.r.map((_, j) => j).find(j => q.c[j] > 1 && AV.egal(v, q.n0[j]));
      if (k != null) return `Tu as oublié de diviser par le nombre stœchiométrique de ${fH(q.r[k])} : ${P(q.n0[k])} ÷ ${q.c[k]}.`;
      if (puiss10(v / K.xmax)) return 'Le nombre devant est juste, mais pas la puissance de 10.';
      return 'Calcule n<sub>initial</sub> ÷ nombre stœchiométrique pour chaque réactif et garde la plus petite valeur.';
    },
    solution: `${AV.calculsRapports(q, 'puissance')}<p>On garde la plus petite valeur : <b>${xm} = ${P(K.xmax)} mol</b>.</p>` });
}

/* ---------- 1. Réactif limitant et x_max sans tableau ---------- */
function etape1(c) {
  const carte = c.carte('1. Réactif limitant et x<sub>max</sub> sans tableau');
  const q = { r: ['CH4', 'O2'], p: ['CO2', 'H2O'], c: [1, 2, 1, 2], n0: [3, 4, 0, 0] };
  const d = c.ajouter(carte, `<div class="cours-bloc">
      <p>Chaque fois que l'avancement x augmente de 1 mol, chaque réactif perd « nombre stœchiométrique » mol. Un réactif serait donc épuisé pour x = n<sub>initial</sub> ÷ nombre stœchiométrique.</p>
      <div class="cle"><p><b class="cle-titre">Réactif limitant et ${xm} sans tableau</b> : pour chaque réactif, on calcule</p>
        <p class="av-formule-cle">n<sub>initial</sub> ÷ nombre stœchiométrique</p>
        <p>Le réactif qui donne la <b>plus petite</b> valeur est le réactif limitant, et cette valeur est ${xm}.</p></div>
    </div>
    ${exemple(`${eq(q)}
      <p>On mélange 3 mol de CH<sub>4</sub> et 4 mol de O<sub>2</sub>. Chaque fois que x augmente de 1 mol, 1 mol de CH<sub>4</sub> et 2 mol de O<sub>2</sub> disparaissent.</p>
      <div class="av-hyp" style="margin-top:12px">
        <div><p class="av-hyp-q">CH<sub>4</sub> serait épuisé pour</p><p class="av-hyp-calc">x = 3 ÷ 1 = <b>3 mol</b></p></div>
        <div class="gagne"><p class="av-hyp-q">O<sub>2</sub> serait épuisé pour</p><p class="av-hyp-calc">x = 4 ÷ 2 = <b>2 mol</b></p></div>
      </div>
      <div class="av-frise" data-x="frise"></div>
      <div class="er-actions" style="justify-content:center" data-x="lancer"><button type="button" class="btn-primary" data-x="go">Faire avancer la réaction ▶</button></div>
      <div data-x="suite"></div>`)}`);
  // frise animée : le curseur part de 0 et s'arrête au premier mur
  const murs = [{ v: 3, nom: 'CH₄', couleur: AV.COUL[0] }, { v: 2, nom: 'O₂', couleur: AV.COUL[1] }];
  const zf = d.querySelector('[data-x="frise"]');
  AV.frise(zf, murs, 0, 'decimal');
  d.querySelector('[data-x="go"]').onclick = () => {
    d.querySelector('[data-x="lancer"]').remove();
    AV.animerFrise(zf, murs, 'decimal', () => {
      d.querySelector('[data-x="suite"]').innerHTML = '<div class="av-concl"><p>La réaction s\'arrête au premier mur : <b>x<sub>max</sub> = 2 mol</b>, et le réactif limitant est <b>O<sub>2</sub></b>.</p></div>';
    });
  };

  const a = BANQUE.quantites(hasard(BANQUE.REACTIONS.quatre.filter(x => x.r[0] !== 'CH4')), BANQUE.NIVEAUX.dixieme);
  const b = BANQUE.quantites(hasard(BANQUE.REACTIONS.ions1.filter(x => x.c[1] === 2 && x.r[0] !== 'Pb2+')), BANQUE.NIVEAUX.puissance(hasard([-2, -3])));
  c.aToi(carte, [
    { titre: a.nom, enonce: `${eq(a)}<p>${melange(a, 'decimal')}</p>`,
      parties: [AV.partieRapports(a, 'decimal', rapport, 'Calcule n<sub>initial</sub> ÷ nombre stœchiométrique pour chaque réactif.'), AV.partieLimitant(a, 'decimal')] },
    { titre: b.nom, enonce: `${eq(b)}<p>${melange(b, 'puissance')}</p>`,
      parties: [partieXmax(b), AV.partieLimitant(b, 'puissance')] },
  ]);
  return carte;
}

/* ---------- 2. Les quantités à l'état final ---------- */
function etape2(c) {
  const carte = c.carte('2. Les quantités à l\'état final');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Une fois ${xm} connu, on calcule directement les quantités à la fin de la réaction.</p>
      <div class="cle"><p><b class="cle-titre">Quantités à l'état final</b></p>
        <p class="av-formule-cle">réactif : n<sub>final</sub> = n<sub>initial</sub> − nombre stœchiométrique × ${xm}<br>produit : n<sub>final</sub> = n<sub>initial</sub> + nombre stœchiométrique × ${xm}</p>
        <p>Le réactif limitant finit à 0 mol.</p></div>
    </div>
    ${exemple(`<p class="av-equation">CH<sub>4</sub> + <span class="av-c">2</span>&nbsp;O<sub>2</sub> → CO<sub>2</sub> + <span class="av-c">2</span>&nbsp;H<sub>2</sub>O</p>
      <p>3 mol de CH<sub>4</sub> et 4 mol de O<sub>2</sub> : ${xm} = 2 mol (O<sub>2</sub> est le réactif limitant).</p>
      <p class="crs-calc">n(CH<sub>4</sub>) = 3 − 1 × 2 = <span class="c">1 mol</span><br>n(O<sub>2</sub>) = 4 − 2 × 2 = <span class="c">0 mol</span><br>n(CO<sub>2</sub>) = 0 + 1 × 2 = <span class="c">2 mol</span><br>n(H<sub>2</sub>O) = 0 + 2 × 2 = <span class="c">4 mol</span></p>`)}`);

  const a = BANQUE.quantites(hasard(BANQUE.REACTIONS.quatre.filter(x => x.r[0] !== 'CH4')), BANQUE.NIVEAUX.dixieme);
  const b = BANQUE.quantites(hasard(BANQUE.REACTIONS.ions2.filter(x => x.p.length === 1)), BANQUE.NIVEAUX.puissance(hasard([-2, -3])));
  const Ka = AV.calculer(a), Kb = AV.calculer(b);
  const donne = (q, K, mode) => `${melange(q, mode)} Le réactif limitant est ${fH(q.r[K.L])} et ${xm} = ${AV.fmt(K.xmax, mode)} mol.`;
  c.aToi(carte, [
    { titre: a.nom, enonce: `${eq(a)}<p>${donne(a, Ka, 'decimal')}</p>`,
      parties: [AV.partieFinal(a, 'decimal', 'Calcule les quantités à l\'état final.')] },
    { titre: b.nom, enonce: `${eq(b)}<p>${donne(b, Kb, 'puissance')}</p>`,
      parties: [AV.partieFinal(b, 'puissance', 'Calcule les quantités à l\'état final.')] },
  ]);
  return carte;
}

/* ---------- 3. Tout enchaîner sans tableau ---------- */
function etape3(c) {
  const carte = c.carte('3. Tout enchaîner sans tableau');
  const q = { r: ['Cu2+', 'HO-'], p: ['Cu(OH)2'], c: [1, 2, 1], n0: [2.0e-3, 5.0e-3, 0] };
  c.ajouter(carte, `<div class="cours-bloc">
      <p>On enchaîne les trois étapes, sans écrire de tableau.</p>
      <div class="cle"><p><b class="cle-titre">1.</b> Pour chaque réactif : n<sub>initial</sub> ÷ nombre stœchiométrique.</p>
        <p><b class="cle-titre">2.</b> La plus petite valeur est ${xm} ; ce réactif est le réactif limitant.</p>
        <p><b class="cle-titre">3.</b> État final : réactif n<sub>initial</sub> − nombre stœchiométrique × ${xm} ; produit n<sub>initial</sub> + nombre stœchiométrique × ${xm}.</p></div>
    </div>
    ${exemple(`${eq(q)}<p>On mélange 2,0 × 10<sup>−3</sup> mol d'ions Cu<sup>2+</sup> et 5,0 × 10<sup>−3</sup> mol d'ions HO<sup>−</sup>.</p>
      <p class="crs-calc">Cu<sup>2+</sup> : 2,0 × 10<sup>−3</sup> ÷ 1 = 2,0 × 10<sup>−3</sup> mol<br>HO<sup>−</sup> : 5,0 × 10<sup>−3</sup> ÷ 2 = 2,5 × 10<sup>−3</sup> mol</p>
      <p>La plus petite valeur : <b>${xm} = 2,0 × 10<sup>−3</sup> mol</b>, Cu<sup>2+</sup> est le réactif limitant.</p>
      <p class="crs-calc">Cu<sup>2+</sup> : 2,0 × 10<sup>−3</sup> − 2,0 × 10<sup>−3</sup> = <span class="c">0 mol</span><br>HO<sup>−</sup> : 5,0 × 10<sup>−3</sup> − 2 × 2,0 × 10<sup>−3</sup> = <span class="c">1,0 × 10<sup>−3</sup> mol</span><br>Cu(OH)<sub>2</sub> : 0 + 2,0 × 10<sup>−3</sup> = <span class="c">2,0 × 10<sup>−3</sup> mol</span></p>`)}`);

  const eau = { r: ['H2', 'O2'], p: ['H2O'], c: [2, 1, 2], n0: [0.8, 0.5, 0] };
  const pb = { r: ['Pb2+', 'I-'], p: ['PbI2'], c: [1, 2, 1], n0: [6.0e-3, 1.0e-2, 0] };
  c.aToi(carte, [
    { titre: 'Synthèse de l\'eau', enonce: `${eq(eau)}<p>On fait réagir 0,8 mol de H<sub>2</sub> avec 0,5 mol de O<sub>2</sub>.</p>`,
      parties: [guide(eau, 'decimal', true)] },
    { titre: 'Précipitation de l\'iodure de plomb', enonce: `${eq(pb)}<p>On mélange 6,0 × 10<sup>−3</sup> mol d'ions Pb<sup>2+</sup> et 1,0 × 10<sup>−2</sup> mol d'ions I<sup>−</sup>.</p>`,
      parties: [guide(pb, 'puissance', false)] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Réactif limitant et ${xm} sans tableau</b> : pour chaque réactif, on calcule</p>
      <p class="av-formule-cle">n<sub>initial</sub> ÷ nombre stœchiométrique</p>
      <p>Le réactif qui donne la <b>plus petite</b> valeur est le réactif limitant, et cette valeur est ${xm}.</p></div>
    <div class="cle"><p><b class="cle-titre">Quantités à l'état final</b></p>
      <p class="av-formule-cle">réactif : n<sub>final</sub> = n<sub>initial</sub> − nombre stœchiométrique × ${xm}<br>produit : n<sub>final</sub> = n<sub>initial</sub> + nombre stœchiométrique × ${xm}</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_7_entrainement.html">S'entraîner sans tableau →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_7.html">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
AV.menu('module_7');
</script>
</body>
</html>
