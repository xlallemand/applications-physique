<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : questions sur l'équation d'une réaction — Oxydoréduction</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="../../assets/molecules.css">
<link rel="stylesheet" href="ox.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/molecules.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="ox.js"></script>
<script src="demi.js"></script>
<script src="reaction.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page" id="app"></div>

<script>
/* ============================================================
   10 questions tirées au hasard :
   entourer les réactifs, écrire une demi-équation directement dans le
   sens de la réaction (2, la première avec le bouton « Inverser »),
   multiplier, l'autre réactif quand un seul est donné avec les deux
   couples (2, REAC.partieAutreReactif : un oxydant réagit avec un
   réducteur, et inversement), le bon couple quand le second réactif
   appartient à deux couples (2, REAC.partieBonCouple, OX.DEUX_COUPLES),
   puis l'équation de deux réactions dans l'outil compact (REAC.partie).
   Les questions 5 à 8 ne demandent pas d'équilibrer : seulement de
   trouver le second réactif. Les aides des outils coûtent un point.
   Réactions : [couple dont l'oxydant réagit, couple dont le réducteur réagit].
   ============================================================ */
const { hasard, melanger, h, COUPLES: C, couple } = OX;
const R = s => `<span class="ox-r">${s}</span>`;
const eqn = x => `<p class="ox-eqn">${x}</p>`;
const REACTIONS = [['Cr2O7', 'Fe3'], ['MnO4', 'I2'], ['H2O2', 'Fe3'], ['NO3', 'Cu'], ['Cu', 'Al'], ['MnO4', 'Cl2'], ['Cr2O7', 'I2'], ['O2e', 'Fe3'],
  ['Fe3', 'I2'], ['Ag', 'Cu'], ['I2', 'S4O6'], ['H2O2', 'I2'], ['NO3', 'Ag'], ['Cl2', 'Fe3'], ['MnO4', 'Fe3']];
const SIMPLIFIER = [['MnO4', 'CO2'], ['MnO4', 'O2'], ['MnO4', 'SO4'], ['Cr2O7', 'SO4'], ['MnO4', 'Ald'], ['H2O2', 'Ald']];
const enonce = p => `<p>Réaction entre ${R(h(C[p[0]].ox))} et ${R(h(C[p[1]].red))}. Demi-équations des couples :</p>` +
  eqn(melanger([DEMI.solution(C[p[0]]).html, DEMI.solution(C[p[1]]).html]).join('<br>'));
const opt = (p, x) => Object.assign({ a: C[p[0]], b: C[p[1]], serie: true, aides: 'payant' }, x);

/* ---------- entourer les réactifs ---------- */
const qReactifs = p => ({ theme: 'Les réactifs', enonce: `<p>Réaction entre ${h(C[p[0]].ox)} et ${h(C[p[1]].red)}.</p>`,
  parties: [REAC.partieReactifs({ a: C[p[0]], b: C[p[1]], ordre: hasard(['ab', 'ba']) })] });
/* ---------- une demi-équation dans le sens de la réaction ---------- */
// k : 0 (demi-équation de l'oxydant qui réagit) ou 1 (celle du réducteur qui réagit)
function qSens(p, k, inverser) {
  const c = C[p[k]];
  return { theme: 'Dans le sens de la réaction', enonce: `<p>Réaction entre ${R(h(C[p[0]].ox))} et ${R(h(C[p[1]].red))}.</p>`,
    parties: [DEMI.partie({ couple: c, serie: true, mode: 'libre', sens: k ? 'ox' : 'red', reactif: true, aides: 'payant', inverser,
      q: `Écris la demi-équation du couple ${couple(c)} dans le sens de la réaction : le réactif à gauche du signe =.${inverser ? ' Le bouton « ⇄ Inverser » échange les deux membres.' : ''}` })] };
}
/* ---------- multiplier (outil) ---------- */
const qMultiplier = p => ({ theme: 'Égaliser les électrons', enonce: enonce(p), parties: [REAC.partieMultiplier(opt(p))] });
/* ---------- l'autre réactif : un réactif et les deux couples (sans équilibrer) ---------- */
function qAutre(p) {
  const a = C[p[0]], b = C[p[1]], donne = hasard(['ox', 'red']), G = donne === 'ox' ? a.ox : b.red;
  return { theme: 'L\'autre réactif', enonce: `<p>${R(h(G))} réagit avec une espèce de l'autre couple.</p>`,
    parties: [REAC.partieAutreReactif({ a, b, donne, ordre: hasard(['ab', 'ba']) })] };
}
/* ---------- le bon couple : le second réactif appartient à deux couples (sans équilibrer) ---------- */
function qBonCouple(d) {
  const a = C[d.p[0]], b = C[d.p[1]], X = d.x ? b.red : a.ox, G = d.x ? a.ox : b.red;
  return { theme: 'Le bon couple',
    enonce: `<p>Réaction entre ${R(h(G))} (couple ${couple(d.x ? a : b)}) et ${R(h(X))}. ${h(X)} appartient à deux couples : il est oxydant dans l'un, réducteur dans l'autre.</p>`,
    parties: [REAC.partieBonCouple({ a, b, x: d.x, leurre: C[d.leurre], ordre: hasard(['ab', 'ba']) })] };
}
/* ---------- toute la réaction dans l'outil compact ---------- */
const qReaction = p => ({ theme: 'Écrire l\'équation d\'une réaction',
  consigne: `Écris l'équation de la réaction entre ${R(h(C[p[0]].ox))} et ${R(h(C[p[1]].red))}.`,
  enonce: `<p>Couples : ${couple(C[p[0]])} et ${couple(C[p[1]])}.</p>`,
  parties: [REAC.partie({ a: C[p[0]], b: C[p[1]], serie: true, niveau: 2, ordre: hasard(['ab', 'ba']) })] });

// tirage : 10 questions, chacune sur une réaction différente quand c'est possible
function tirage() {
  const L = melanger(REACTIONS), S = melanger(SIMPLIFIER);
  const mult = L.filter(p => { const r = REAC.reaction(C[p[0]], C[p[1]]); return r.mA > 1 || r.mB > 1; });
  const reste = L.slice(2).filter(p => p !== mult[0]);
  // le bon couple : deux espèces à placer différentes si possible
  const d = melanger(OX.DEUX_COUPLES), d2 = d.slice(1).find(x => x.leurre !== d[0].leurre) || d[1];
  return [qReactifs(L[0]), qSens(L[1], 1, true), qSens(S[0], hasard([0, 1]), false), qMultiplier(mult[0]),
    qAutre(reste[0]), qAutre(reste[1]), qBonCouple(d[0]), qBonCouple(d2), qReaction(reste[2]), qReaction(S[1])];
}

OX.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 3 · QUESTIONS', titre: 'Écrire l\'équation d\'une réaction',
  intro: '<p class="er-contexte">10 questions tirées au hasard : repérer les réactifs, écrire une demi-équation dans le sens de la réaction, égaliser les électrons, trouver le second réactif (quand un seul est donné, puis quand il appartient à deux couples), puis écrire l\'équation de deux réactions.</p>',
  aidesPayantes: true,
  questions: tirage,
  revoir: { href: 'module_3_cours.html', label: 'Revoir le cours' },
  suite: { href: 'module_4.html', label: 'Module 4 : entraînement →' },
});
OX.menu('module_3_questions');
</script>
</body>
</html>
