<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype : équilibrer une demi-équation — Oxydoréduction</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="../../assets/molecules.css">
<link rel="stylesheet" href="ox.css">
<script src="../../assets/molecules.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="demi.js"></script>
</head>
<body>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">PROTOTYPE · OUTIL</span>
    <h2 class="er-titre">Équilibrer une demi-équation</h2>
    <p class="er-contexte">Glisse l'<b>oxydant</b> et le <b>réducteur</b> dans la demi-équation, puis équilibre-la en <b>4 étapes</b> : les éléments autres que O et H, l'élément O avec H<sub>2</sub>O, l'élément H avec H<sup>+</sup>, les charges avec les électrons e<sup>−</sup>.</p>
  </div>

  <div class="er-card">
    <p class="ox-etiq">Choisis un couple</p>
    <div class="ox-choix" id="choix"></div>
  </div>

  <div class="er-card" id="outil"></div>
  <div id="bilan"></div>
</div>

<script>
/* ============================================================
   Page de prototype de l'outil DEMI (modules/demi.js) :
   choix du couple, puis bilan des difficultés repérées
   ============================================================ */
const COUPLES = [
  { ox: 'MnO4^-', red: 'Mn^2+' },
  { ox: 'Cr2O7^2-', red: 'Cr^3+' },
  { ox: 'I2', red: 'I^-' },
  { ox: 'S4O6^2-', red: 'S2O3^2-' },
  { ox: 'SO4^2-', red: 'SO2' },
  { ox: 'NO3^-', red: 'NO' },
  { ox: 'CO2', red: 'H2C2O4' },
  { ox: 'H2O2', red: 'H2O' },
  { ox: 'O2', red: 'H2O2' },
  { ox: 'H^+', red: 'H2' },
  { ox: 'Fe^3+', red: 'Fe^2+' },
  { ox: 'Cu^2+', red: 'Cu' },
];
const choix = document.getElementById('choix');
const zoneBilan = document.getElementById('bilan');
let actuel = 0;

// lance l'outil sur le couple n° k
function lancer(k) {
  actuel = k;
  choix.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-pressed', String(j === k)));
  zoneBilan.innerHTML = '';
  DEMI.outil(document.getElementById('outil'), { couple: COUPLES[k], onFini: bilan });
}

// demi-équation terminée : difficultés repérées (nombre de fois)
function bilan(b) {
  const n = {};
  b.codes.forEach(c => { n[c] = (n[c] || 0) + 1; });
  const liste = Object.keys(n).map(c => `<li>${DEMI.DIFFICULTES[c]}${n[c] > 1 ? ` (${n[c]} fois)` : ''}</li>`).join('');
  zoneBilan.innerHTML = `<div class="er-card">
      <p class="ox-etiq">Difficultés repérées</p>
      ${liste ? `<ul class="er-liste">${liste}</ul>` : '<p>Aucune erreur.</p>'}
      ${b.vues ? `<p style="margin-top:6px">Réponse affichée pour ${b.vues} étape${b.vues > 1 ? 's' : ''}.</p>` : ''}
      <div class="er-actions"><button type="button" class="btn-primary" id="suivant">Couple suivant →</button></div>
    </div>`;
  document.getElementById('suivant').onclick = () => {
    lancer((actuel + 1) % COUPLES.length);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
}

COUPLES.forEach((c, k) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn-small';
  b.innerHTML = `${MOL.formuleHTML(c.ox)} / ${MOL.formuleHTML(c.red)}`;
  b.onclick = () => lancer(k);
  choix.appendChild(b);
});
lancer(0);
</script>
</body>
</html>
