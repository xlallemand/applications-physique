<body>
<div id="app-nav"></div>
<div class="er-page" id="app"></div>

<script>
/* ============================================================
   Entraînement : 10 réactions, chacune en 5 parties (reaction.js) :
   a) et b) les deux demi-équations avec l'outil DEMI, c) orienter,
   d) égaliser les électrons, e) additionner et simplifier.
   L'aide diminue au fil des réactions :
     niveau 1 (réactions 1 à 4)  aides libres, demi-équations étape par étape ;
     niveau 2 (réactions 5 à 7)  aides payantes (1 point de moins) ;
     niveau 3 (réactions 8 à 10) sans aide : demi-équations d'un seul tenant,
                                 nombres de l'équation finale écrits directement.
   Les réactions vont des plus simples (sans H+) à celles où il faut
   simplifier H+ et H2O. Chaque réaction est notée 2, 1 ou 0 point.
   Réactions : [couple dont l'oxydant réagit, couple dont le réducteur réagit].
   ============================================================ */
const { hasard, melanger, h, COUPLES: C, couple } = OX;
const R = s => `<span class="ox-r">${s}</span>`;
const SANS_H = [['Fe3', 'I2'], ['Ag', 'Cu'], ['Cu', 'Al'], ['Cl2', 'Fe3'], ['I2', 'S4O6'], ['Fe3', 'Cu'], ['Br2', 'I2'], ['Ag', 'Zn']];
const AVEC_H = [['MnO4', 'Fe3'], ['Cr2O7', 'Fe3'], ['H2O2', 'Fe3'], ['MnO4', 'I2'], ['Cr2O7', 'I2'], ['NO3', 'Cu'], ['H2O2', 'I2'], ['O2e', 'Fe3'], ['MnO4', 'Cl2'], ['NO3', 'Ag']];
const SIMPLIFIER = [['MnO4', 'CO2'], ['MnO4', 'O2'], ['MnO4', 'SO4'], ['Cr2O7', 'SO4'], ['MnO4', 'Ald'], ['H2O2', 'Ald'], ['Cr2O7', 'Ac']];
const NIVEAUX = { 1: 'Niveau 1 · aides libres', 2: 'Niveau 2 · aides : 1 point de moins', 3: 'Niveau 3 · sans aide' };

function reaction(p, niveau) {
  const a = C[p[0]], b = C[p[1]];
  return { theme: NIVEAUX[niveau],
    consigne: `Écris l'équation de la réaction entre ${R(h(a.ox))} et ${R(h(b.red))}.`,
    enonce: `<p>Couples : ${couple(a)} et ${couple(b)}.</p>`,
    parties: REAC.parties({ a, b, niveau, serie: true }) };
}

// tirage : réactions différentes, de plus en plus difficiles
function tirage() {
  const s = melanger(SANS_H), a = melanger(AVEC_H), f = melanger(SIMPLIFIER);
  return [
    reaction(s[0], 1), reaction(a[0], 1), reaction(s[1], 1), reaction(a[1], 1),
    reaction(a[2], 2), reaction(f[0], 2), reaction(a[3], 2),
    reaction(hasard([s[2], a[4]]), 3), reaction(f[1], 3), reaction(f[2], 3),
  ];
}

OX.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 4 · ENTRAÎNEMENT', titre: 'Écrire les réactions d\'oxydoréduction',
  intro: `<p class="er-contexte">10 réactions à écrire entièrement : les deux demi-équations avec l'outil, puis l'équation de la réaction. L'aide diminue au fil des réactions.</p>`,
  aidesPayantes: true,
  bareme: `<ul class="er-liste" style="margin-top:8px"><li>réactions 1 à 4 : les aides sont libres ;</li><li>réactions 5 à 7 : afficher une aide coûte un point ;</li>
    <li>réactions 8 à 10 : pas d'aide, tu écris les demi-équations d'un seul tenant et directement les nombres de l'équation finale.</li></ul>`,
  questions: tirage,
  revoir: { href: 'module_3_cours.html', label: 'Revoir le cours' },
  suite: { href: '../index.html', label: 'Accueil de l\'application' },
});
OX.menu('module_4');
</script>
</body>
</html>
