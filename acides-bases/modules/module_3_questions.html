<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : questions sur le pH — Chapitre 16 : Acides et bases</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="ab.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<script src="../../assets/sommaire.js"></script>
<script src="ab.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page" id="app"></div>

<script>
/* ============================================================
   10 questions, valeurs tirées au hasard :
   acide / neutre / basique, appareil de mesure, pH à partir de [H₃O⁺] (2,
   une décimale), [H₃O⁺] à partir du pH (2, deux chiffres significatifs),
   sens d'évolution du pH (ajout d'acide, de base, dilution), solution la
   plus acide, lecture de l'échelle de survie (ex. 9 p. 201), vrai / faux.
   Erreurs diagnostiquées : signe − oublié, log et 10ˣ confondus,
   « plus acide = pH plus grand ».
   ============================================================ */
const { o, hasard, melanger, fmt, sci, CH, H3O, UNITE, pHde, Hde, diagPH, diagH, nature, figSurvie, SURVIE } = AB;
const VF = [o('vrai', '✓ Vrai'), o('faux', '✗ Faux')];
const concentration = () => hasard([1.0, 2.0, 2.5, 3.0, 4.0, 5.0, 6.0, 8.0]) * Math.pow(10, -hasard([2, 3, 4, 5, 6, 8, 9, 10, 11, 12]));

// acide, neutre ou basique ?
function qNature() {
  const v = hasard([1.5, 2.8, 4.2, 5.5, 6.6, 7, 7.4, 8.9, 10.2, 12.5]);
  return { theme: 'Échelle de pH', enonce: `<p>Une solution a un pH de ${fmt(v)} (à 25 °C).</p>`,
    parties: [{ type: 'choix', q: 'Cette solution est :', melanger: false, options: [o('acide', 'acide'), o('neutre', 'neutre'), o('basique', 'basique')], bonne: nature(v),
      indice: 'pH &lt; 7 : acide ; pH = 7 : neutre ; pH &gt; 7 : basique.',
      solution: `<p>pH = ${fmt(v)} : solution <b>${nature(v)}</b>.</p>` }] };
}
// appareil de mesure
function qMesure() {
  return { theme: 'Mesurer le pH',
    parties: [{ type: 'choix', q: 'Pour mesurer précisément le pH d\'une solution, on utilise :',
      options: [o('ph', 'un pH-mètre'), o('v', 'un voltmètre'), o('b', 'une balance'), o('t', 'un thermomètre')], bonne: 'ph',
      indice: 'L\'appareil porte le nom de la grandeur mesurée.', solution: '<p>Un <b>pH-mètre</b>.</p>' }] };
}
// pH à partir de [H3O+]
function qPH() {
  const c = concentration();
  return { theme: 'Calculer un pH', enonce: `<p>Dans une solution, ${CH} = ${sci(c, 2)} ${UNITE.c}.</p>`,
    parties: [{ type: 'nombre', q: 'Calcule le pH de cette solution (une décimale).', label: 'pH =', valeur: pHde(c), tol: .051, dec: 1,
      diag: v => diagPH(v, c), solution: `<p class="ph-calc">pH = −log(${CH}) = −log(${sci(c, 2)}) ≈ <span class="c">${fmt(pHde(c), 1)}</span></p>` }] };
}
// [H3O+] à partir du pH
function qH() {
  const ph = hasard([1.6, 2.3, 3.5, 4.7, 5.2, 6.4, 7.8, 8.5, 9.3, 10.6, 11.2, 12.9]);
  return { theme: 'Calculer ' + CH, enonce: `<p>Une solution a un pH de ${fmt(ph)}.</p>`,
    parties: [{ type: 'sci', q: `Calcule ${CH} (deux chiffres significatifs).`, label: `${CH} =`, unite: UNITE.c, valeur: Hde(ph), cs: 2,
      diag: v => diagH(v, ph), solution: `<p class="ph-calc">${CH} = 10<sup>−pH</sup> = 10<sup>−${fmt(ph)}</sup> ≈ <span class="c">${sci(Hde(ph), 2)} ${UNITE.c}</span></p>` }] };
}
// sens d'évolution
const CAS = [
  { t: 'On ajoute de l\'acide nitrique (un acide) dans une solution.', b: 'dim', e: 'L\'acide forme des ions H<sub>3</sub>O<sup>+</sup> : [H<sub>3</sub>O<sup>+</sup>] augmente, le pH diminue.' },
  { t: 'On ajoute de l\'ammoniac (une base) dans une solution.', b: 'aug', e: 'La base consomme des ions H<sub>3</sub>O<sup>+</sup> : le pH augmente.' },
  { t: 'On dilue 10 fois une solution d\'acide éthanoïque de pH 3,4.', b: 'aug', e: 'Diluer rapproche le pH de 7 : pour une solution acide, il augmente.' },
  { t: 'On dilue 10 fois une solution de soude de pH 12.', b: 'dim', e: 'Diluer rapproche le pH de 7 : pour une solution basique, il diminue.' },
  { t: 'La concentration en ions H<sub>3</sub>O<sup>+</sup> d\'une solution diminue.', b: 'aug', e: '[H<sub>3</sub>O<sup>+</sup>] et pH varient en sens inverse : le pH augmente.' },
  { t: 'Du dioxyde de carbone se dissout dans l\'eau et forme de l\'acide carbonique.', b: 'dim', e: 'L\'acide carbonique forme des ions H<sub>3</sub>O<sup>+</sup> : le pH diminue.' },
];
function qSens() {
  const x = hasard(CAS);
  return { theme: 'Évolution du pH', enonce: `<p>${x.t}</p>`,
    parties: [{ type: 'choix', q: 'Le pH :', melanger: false, options: [o('aug', 'augmente'), o('dim', 'diminue'), o('meme', 'ne change pas')], bonne: x.b,
      indice: `${CH} et pH varient en sens inverse ; un acide forme des ions ${H3O}, une base en consomme, la dilution rapproche le pH de 7.`,
      solution: `<p>${x.e}</p>` }] };
}
// la plus acide
function qPlusAcide() {
  const [a, b] = melanger([2.1, 3.3, 4.6, 5.8, 8.2, 9.7, 11.4]).slice(0, 2), plus = hasard([true, false]);
  const bonne = plus ? (a < b ? 'A' : 'B') : (a > b ? 'A' : 'B');
  return { theme: 'Comparer deux solutions', enonce: `<p>Solution A : pH = ${fmt(a)} ; solution B : pH = ${fmt(b)}.</p>`,
    parties: [{ type: 'choix', q: `Quelle solution contient le ${plus ? 'plus' : 'moins'} d'ions ${H3O} ?`, melanger: false, options: [o('A', 'la solution A'), o('B', 'la solution B')], bonne,
      indice: plus ? 'Attention : plus il y a d\'ions H<sub>3</sub>O<sup>+</sup>, plus la solution est acide et plus son pH est <b>petit</b>.' : 'Moins il y a d\'ions H<sub>3</sub>O<sup>+</sup>, plus le pH est <b>grand</b>.',
      solution: `<p>${CH} et pH varient en sens inverse : la solution ${bonne} (pH = ${fmt(bonne === 'A' ? a : b)}) contient le ${plus ? 'plus' : 'moins'} d'ions ${H3O}.</p>` }] };
}
// échelle de survie (ex. 9 p. 201) : lire un pH, puis calculer [H3O+]
function qSurvie() {
  const b = hasard(SURVIE.filter(x => [5.9, 5.5, 5.0, 4.4].includes(x.fin)));
  const qui = b.qui;
  return { theme: 'Échelle de survie', consigne: '<p>Le graphique indique jusqu\'à quel pH des espèces aquatiques survivent.</p>', figure: z => { z.innerHTML = figSurvie(); },
    parties: [
      { type: 'nombre', q: `À quel pH ${qui} disparaissent-ils ?`, label: 'pH =', valeur: b.fin, tol: .051, dec: 1,
        indice: 'Lis la fin de la barre sur l\'axe du haut (attention, il va de 7,5 à gauche vers 3,5 à droite ; une graduation = 0,1).',
        solution: `<p>La barre s'arrête à pH = <b>${fmt(b.fin, 1)}</b>.</p>` },
      { type: 'sci', q: `Calcule la concentration en ions ${H3O} correspondante (deux chiffres significatifs).`, label: `${CH} =`, unite: UNITE.c, valeur: Hde(b.fin), cs: 2,
        diag: v => diagH(v, b.fin), solution: `<p class="ph-calc">${CH} = 10<sup>−${fmt(b.fin, 1)}</sup> ≈ <span class="c">${sci(Hde(b.fin), 2)} ${UNITE.c}</span></p>` },
    ] };
}
// vrai ou faux
function qVF() {
  const v = hasard([
    { t: 'Plus une solution est acide, plus son pH est grand.', ok: false, e: 'Plus une solution est acide, plus son pH est <b>petit</b>.' },
    { t: 'Quand on dilue une solution acide, son pH se rapproche de 7.', ok: true, e: 'Diluer rapproche la solution de l\'eau pure : le pH tend vers 7.' },
    { t: 'Quand [H<sub>3</sub>O<sup>+</sup>] est divisée par 10, le pH augmente de 1.', ok: true, e: '[H<sub>3</sub>O<sup>+</sup>] et pH varient en sens inverse : ÷ 10 sur la concentration, + 1 sur le pH.' },
    { t: 'Le pH s\'exprime en mol·L<sup>−1</sup>.', ok: false, e: 'Le pH n\'a <b>pas d\'unité</b> ; c\'est [H<sub>3</sub>O<sup>+</sup>] qui s\'exprime en mol·L<sup>−1</sup>.' },
    { t: 'Ajouter une base dans une solution fait diminuer son pH.', ok: false, e: 'Une base consomme des ions H<sub>3</sub>O<sup>+</sup> : le pH <b>augmente</b>.' },
  ]);
  return { theme: 'Vrai ou faux', enonce: `<p>${v.t}</p>`,
    parties: [{ type: 'choix', q: 'Cette affirmation est-elle vraie ?', melanger: false, options: VF, bonne: v.ok ? 'vrai' : 'faux',
      indice: v.e, solution: `<p>${v.ok ? 'Vrai' : 'Faux'} : ${v.e}</p>` }] };
}

function tirage() {
  return [hasard([qNature, qMesure])(), qNature(), qPH(), qPH(), qH(), qH(), qSens(), qPlusAcide(), qSurvie(), qVF()];
}

AB.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 3 · QUESTIONS', titre: 'Le pH',
  intro: '<p class="er-contexte">10 questions tirées au hasard : échelle de pH, calcul du pH et de [H<sub>3</sub>O<sup>+</sup>], évolution du pH, lecture d\'une échelle de survie.</p>',
  questions: tirage,
  revoir: { href: 'module_3a_cours.html', label: 'Revoir le cours' },
  suite: { href: 'module_4_cours.html', label: 'Module 4 : quantités de matière →' },
});
AB.menu('module_3_questions');
</script>
</body>
</html>
