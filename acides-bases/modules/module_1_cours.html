<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 : acides, bases et couples — Chapitre 16 : Acides et bases</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="ab.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="ab.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 1 · COURS</span>
    <h2 class="er-titre">Acides, bases et couples</h2>
    <p class="er-contexte">Une réaction acido-basique est un <b>transfert de proton H<sup>+</sup></b>. Tu vas apprendre à reconnaître un <b>acide</b> et une <b>base</b>, à écrire la <b>demi-équation</b> d'un couple et à trouver l'<b>espèce conjuguée</b> d'un acide ou d'une base.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Acide et base   2. Couple acide / base et demi-équation
   3. Espèce conjuguée et ampholyte · À retenir
   Les espèces des « À toi » sont tirées au hasard à chaque affichage ;
   l'espèce conjuguée se construit avec les boutons + H⁺ / − H⁺
   (AB.partieConjugue : le nombre de H et la charge s'ajustent seuls).
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { H, f, esp, conj, CP, nomDe, couple, demi, demiInv, partieConjugue } = AB;

// couples des « À toi » (l'eau et l'ion oxonium sont traités à part, à l'étape 3)
const POOL = ['ACE', 'NH4', 'MET', 'HF', 'HNO3', 'H3PO4', 'H2PO4', 'HPO4', 'MA', 'HIO3', 'H2CO3', 'HCO3', 'SULF', 'HCL', 'HCLO'];
const tirer = n => melanger(POOL).slice(0, n).map(k => CP[k]);

// « X peut libérer (capter) un H⁺ pour devenir Y » : acide ou base ?
function role(c, acide) {
  const X = acide ? f(c.a) : f(c.b), Y = acide ? f(c.b) : f(c.a);
  return { enonce: `<p>${X} peut ${acide ? 'libérer' : 'capter'} un proton ${H} pour devenir ${Y}.</p>`,
    parties: [{ type: 'choix', q: `${X} est :`, melanger: false,
      options: [{ id: 'a', label: 'un acide' }, { id: 'b', label: 'une base' }], bonne: acide ? 'a' : 'b',
      indices: {
        b: `${X} <b>libère</b> un proton ${H} : c'est ce que fait un acide. Une base, elle, capte un proton.`,
        a: `${X} <b>capte</b> un proton ${H} : c'est ce que fait une base. Un acide, lui, libère un proton.` },
      solution: `<p>${X} ${acide ? 'libère' : 'capte'} un proton ${H} : c'est ${acide ? 'un <b>acide</b>' : 'une <b>base</b>'}.</p>` }] };
}

/* ---------- 1. Acide et base ---------- */
function etape1(c) {
  const carte = c.carte('1. Acide et base');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Un <b>proton</b> est un ion hydrogène ${H} : un atome d'hydrogène qui a perdu son électron. Certaines espèces chimiques peuvent en <b>libérer</b> un, d'autres peuvent en <b>capter</b> un.</p>
      <div class="cle"><p><b class="cle-titre">Définitions.</b> Un <b>acide</b>, noté AH, est une espèce chimique capable de <b>libérer</b> un proton ${H} :</p>
        <p class="crs-formule">AH → A<sup>−</sup> + ${H}</p>
        <p>Une <b>base</b>, notée A<sup>−</sup>, est une espèce chimique capable de <b>capter</b> un proton ${H} :</p>
        <p class="crs-formule">A<sup>−</sup> + ${H} → AH</p></div>
    </div>
    ${exemple(`<p>L'acide éthanoïque CH<sub>3</sub>COOH peut libérer un proton ${H} pour devenir CH<sub>3</sub>COO<sup>−</sup> : CH<sub>3</sub>COOH est un <b>acide</b>.</p>
      <p>L'ammoniac NH<sub>3</sub> peut capter un proton ${H} pour devenir NH<sub>4</sub><sup>+</sup> : NH<sub>3</sub> est une <b>base</b>.</p>`, 'Exemples')}`);
  const [c1, c2] = tirer(2);
  c.aToi(carte, melanger([role(c1, true), role(c2, false)]));
  return carte;
}

/* ---------- 2. Couple acide / base et demi-équation ---------- */
function etape2(c) {
  const carte = c.carte('2. Couple acide / base et demi-équation');
  const ex = [CP.H3O, CP.ACE, CP.EAU, CP.NH4];
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Un acide AH et la base A<sup>−</sup> qu'il devient en libérant un proton forment un <b>couple acide / base</b>, noté <b>AH / A<sup>−</sup></b> : l'acide toujours en premier.</p>
      <div class="cle"><p>À ce couple correspond une <b>demi-équation</b> :</p>
        <p class="crs-formule">AH = A<sup>−</sup> + ${H}</p>
        <p>Le signe = indique que l'échange peut se faire dans les deux sens.</p></div>
      <p class="ab-ecart"><b>Astuce pour reconnaître l'acide d'un couple :</b> l'acide est celui qui a <b>le plus de H</b> (un H de plus que sa base).</p>
    </div>
    ${exemple(`<div class="crs-defile"><table class="crs-tab ab-couples"><thead><tr><th>Couple acide / base</th><th>Demi-équation</th></tr></thead>
      <tbody>${ex.map(x => `<tr><td>${couple(x)}</td><td>${demi(x)}</td></tr>`).join('')}</tbody></table></div>`, 'Exemples du cours')}`);
  // 1. reconnaître l'acide (espèces dans un ordre au hasard) ; 2. demi-équation ; 3. couple d'une demi-équation écrite à l'envers
  const [c1, c2, c3] = tirer(3);
  const paire = melanger([c1.a, c1.b]);
  const sansCharge = x => f(esp(x.b.pre, x.b.h, x.b.post, x.a.q));       // base dont on a oublié de changer la charge
  c.aToi(carte, [
    { titre: 'Reconnaître l\'acide',
      parties: [{ type: 'choix', q: `${f(paire[0])} et ${f(paire[1])} forment un couple acide / base. Quel est l'acide&nbsp;?`, melanger: false,
        options: paire.map(e => ({ id: f(e) === f(c1.a) ? 'a' : 'b', label: f(e) })), bonne: 'a',
        indices: { b: `${f(c1.b)} a un H de moins : c'est la base. L'acide est celui qui a le plus de H, ${f(c1.a)}.` },
        solution: `<p>${f(c1.a)} a un H de plus : c'est l'acide. Le couple s'écrit <b>${couple(c1)}</b>.</p>` }] },
    { titre: 'Écrire la demi-équation',
      parties: [{ type: 'choix', q: `Quelle est la demi-équation du couple ${couple(c2)}&nbsp;?`, colonne: true,
        options: [{ id: 'ok', label: demi(c2) }, { id: 'cote', label: `${f(c2.a)} + ${H} = ${f(c2.b)}` },
                  { id: 'inv', label: `${f(c2.b)} = ${f(c2.a)} + ${H}` }, { id: 'q', label: `${f(c2.a)} = ${sansCharge(c2)} + ${H}` }],
        bonne: 'ok',
        indices: {
          cote: `${H} est du mauvais côté : l'acide ${f(c2.a)} <b>libère</b> le proton, il s'écrit avec la base, à droite du signe =.`,
          inv: `Acide et base sont inversés : c'est l'acide ${f(c2.a)} (le plus de H) qui libère ${H}.`,
          q: `La charge n'est pas conservée : en perdant ${H}, la charge de l'espèce diminue de 1.` },
        solution: `<p><b>${demi(c2)}</b> : l'acide ${f(c2.a)} libère un proton ${H} et devient la base ${f(c2.b)}.</p>` }] },
    { titre: 'Une demi-équation écrite à l\'envers',
      enonce: `<p class="crs-calc">${demiInv(c3)}</p>`,
      parties: [{ type: 'choix', q: 'Quel est le couple acide / base de cette demi-équation&nbsp;?',
        options: [{ id: 'ok', label: couple(c3) }, { id: 'inv', label: `${f(c3.b)} / ${f(c3.a)}` }], bonne: 'ok',
        indices: { inv: `On écrit l'acide en premier. Ici, la base ${f(c3.b)} capte ${H} pour donner l'acide ${f(c3.a)} : la demi-équation est seulement écrite dans l'autre sens.` },
        solution: `<p>${f(c3.b)} capte un proton : c'est la base ; ${f(c3.a)} est l'acide. Le couple s'écrit <b>${couple(c3)}</b>.</p>` }] },
  ]);
  return carte;
}

/* ---------- 3. Espèce conjuguée et ampholyte ---------- */
function etape3(c) {
  const carte = c.carte('3. Espèce conjuguée et ampholyte');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Dans un couple AH / A<sup>−</sup>, A<sup>−</sup> est la <b>base conjuguée</b> de l'acide AH, et AH est l'<b>acide conjugué</b> de la base A<sup>−</sup>.</p>
      <div class="cle"><p><b class="cle-titre">Méthode.</b> Pour trouver la <b>base conjuguée</b> d'un acide, on <b>enlève un ${H}</b> : un H de moins et la charge diminue de 1.</p>
        <p>Pour trouver l'<b>acide conjugué</b> d'une base, on <b>ajoute un ${H}</b> : un H de plus et la charge augmente de 1.</p></div>
      <div class="cle"><p><b class="cle-titre">Ampholyte.</b> Une espèce qui est l'acide d'un couple et la base d'un autre couple est un <b>ampholyte</b>. L'eau en est un : elle est l'acide du couple H<sub>2</sub>O / HO<sup>−</sup> et la base du couple H<sub>3</sub>O<sup>+</sup> / H<sub>2</sub>O.</p></div>
    </div>
    ${exemple(`<p>Base conjuguée de l'acide nitrique HNO<sub>3</sub> : on enlève ${H}, <b>NO<sub>3</sub><sup>−</sup></b>.</p>
      <p>Acide conjugué de l'ammoniac NH<sub>3</sub> : on ajoute ${H}, <b>NH<sub>4</sub><sup>+</sup></b>.</p>
      <p>Base conjuguée de HPO<sub>4</sub><sup>2−</sup> : on enlève ${H}, la charge passe de 2− à 3− : <b>PO<sub>4</sub><sup>3−</sup></b>.</p>`, 'Exemples')}`);
  const [c1, c2] = tirer(2);
  // ampholyte : une espèce à la fois acide d'un couple et base d'un autre
  const amph = hasard([{ e: CP.HCO3.a, a: CP.HCO3, b: CP.H2CO3 }, { e: CP.HPO4.a, a: CP.HPO4, b: CP.H2PO4 }, { e: CP.H2PO4.a, a: CP.H2PO4, b: CP.H3PO4 }]);
  c.aToi(carte, [
    { titre: 'Base conjuguée',
      parties: [partieConjugue({ lignes: [{ depart: c1.a, cible: c1.b, label: `Construis la base conjuguée de l'acide ${f(c1.a)}.` }] },
        { solution: `<p>On enlève un ${H} à ${f(c1.a)} : sa base conjuguée est <b>${f(c1.b)}</b>. Couple ${couple(c1)}.</p>` })] },
    { titre: 'Acide conjugué',
      parties: [partieConjugue({ lignes: [{ depart: c2.b, cible: c2.a, label: `Construis l'acide conjugué de la base ${f(c2.b)}.` }] },
        { solution: `<p>On ajoute un ${H} à ${f(c2.b)} : son acide conjugué est <b>${f(c2.a)}</b>. Couple ${couple(c2)}.</p>` })] },
    { titre: 'Un ampholyte',
      enonce: `<p>${f(amph.e)} est l'acide du couple ${couple(amph.a)} et la base du couple ${couple(amph.b)}.</p>`,
      parties: [{ type: 'choix', q: `${f(amph.e)} est :`, colonne: true,
        options: [{ id: 'a', label: 'un acide seulement' }, { id: 'b', label: 'une base seulement' }, { id: 'amph', label: 'un ampholyte' }], bonne: 'amph',
        indices: { a: `Regarde le second couple : ${f(amph.e)} y est écrit en second, c'est la base.`, b: `Regarde le premier couple : ${f(amph.e)} y est écrit en premier, c'est l'acide.` },
        solution: `<p>${f(amph.e)} est acide dans un couple et base dans l'autre : c'est un <b>ampholyte</b>, comme l'eau.</p>` }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p>Un <b>acide</b> AH peut libérer un proton : AH → A<sup>−</sup> + ${H}. Une <b>base</b> A<sup>−</sup> peut capter un proton : A<sup>−</sup> + ${H} → AH.</p></div>
    <div class="cle"><p>Un couple se note <b>AH / A<sup>−</sup></b>, l'acide en premier (celui qui a le plus de H). Sa demi-équation :</p>
      <p class="crs-formule">AH = A<sup>−</sup> + ${H}</p></div>
    <div class="cle"><p>Base conjuguée : on <b>enlève</b> un ${H} (charge − 1). Acide conjugué : on <b>ajoute</b> un ${H} (charge + 1).</p>
      <p>Un <b>ampholyte</b> est acide dans un couple et base dans un autre : l'eau (H<sub>3</sub>O<sup>+</sup> / H<sub>2</sub>O et H<sub>2</sub>O / HO<sup>−</sup>).</p></div>
    <div class="er-actions">
      <a class="btn-primary" style="text-decoration:none" href="module_1_questions.html">Questions sur ce cours →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_2_cours.html">Module 2 : réactions acido-basiques</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_1.html">Fiche récapitulative</a>
    </div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
AB.menu('module_1_cours');
</script>
</body>
</html>
