<title>Module 2 : réactions acido-basiques — Chapitre 16 : Acides et bases</title>
<link rel="stylesheet" href="../../assets/theme.css">

<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS</span>
    <h2 class="er-titre">Réactions acido-basiques</h2>
    <p class="er-contexte">Dans une réaction acido-basique, <b>l'acide d'un couple donne un proton H<sup>+</sup> à la base d'un autre couple</b>. Tu vas écrire ces réactions, directement ou avec la <b>règle du gamma γ</b>, et retrouver les <b>couples</b> d'une réaction.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Le transfert d'un proton : méthode directe (outil + H⁺ / − H⁺ sur l'acide et la base)
   2. La règle du gamma γ (outil AB.partieGamma : toucher les réactifs, γ dessiné,
      équation complétée par glisser-déposer)
   3. Reconnaître les couples dans une réaction · À retenir
   (la méthode « additionner les deux demi-équations » du cours n'est pas reprise)
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { o, H, f, conj, CP, couple, demi, somme, equation, partieConjugue, partieGamma, gammaFig, versCours } = AB;

// réactions entre l'acide du couple ca et la base du couple cb
const REAC = [['MET', 'NH4'], ['HF', 'H3O'], ['H3O', 'ACE'], ['ACE', 'NH4'], ['NH4', 'H3O'], ['HNO3', 'NH4'], ['HNO3', 'H3O'],
  ['ACE', 'EAU'], ['MET', 'EAU'], ['NH4', 'EAU'], ['HCL', 'H3O'], ['H3O', 'NH4'], ['HF', 'NH4'], ['NH4', 'HPO4'], ['H3O', 'MET']];
// outil « règle du gamma » : le couple de l'acide en haut ou en bas, au hasard
function gamma(ca, cb) {
  const enHaut = Math.random() < .5;
  const def = enHaut ? { haut: ca, bas: cb, reactifs: ['a1', 'b2'] } : { haut: cb, bas: ca, reactifs: ['b1', 'a2'] };
  const eq = equation(ca, cb);
  return { def, eq };
}
const pourGamma = ([ka, kb]) => {
  const ca = CP[ka], cb = CP[kb], g = gamma(ca, cb);
  return { titre: `Réaction entre ${f(ca.a)} et ${f(cb.b)}`,
    enonce: `<p>Couples : ${couple(ca)} et ${couple(cb)}.</p>`,
    parties: [partieGamma(g.def, { q: `Écris la réaction entre ${f(ca.a)} et ${f(cb.b)} avec la règle du gamma.`,
      solution: `<p class="crs-calc">${g.eq.texte}</p><p>${f(ca.a)} donne son ${H} et devient ${f(ca.b)} ; ${f(cb.b)} le capte et devient ${f(cb.a)}.</p>` })] };
};

/* ---------- 1. Le transfert d'un proton ---------- */
function etape1(c) {
  const carte = c.carte('1. Le transfert d\'un proton');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Réaction acido-basique.</b> L'<b>acide</b> d'un couple <b>donne un proton</b> ${H} à la <b>base</b> d'un autre couple.</p>
        <p>Chaque réactif devient son <b>espèce conjuguée</b> : l'acide perd un ${H}, la base en gagne un.</p></div>
      <p><b>Méthode directe :</b> on déplace un ${H} de l'acide vers la base. ${H} n'apparaît pas dans l'équation : il passe directement de l'un à l'autre.</p>
    </div>
    ${exemple(`<p>Réaction de l'acide H<sub>3</sub>O<sup>+</sup> avec la base CH<sub>3</sub>COO<sup>−</sup> :</p>
      <div class="crs-defile"><div class="ab-annote" role="img" aria-label="H3O+ donne H+ ; H+ vient se coller sur CH3COO− ; H3O+ + CH3COO− donne H2O + CH3COOH">
        <span><small>donne ${H}</small>H<sub>3</sub>O<sup>+</sup></span><span><small></small>+</span><span><small>${H} vient se coller ici</small>CH<sub>3</sub>COO<sup>−</sup></span>
        <span><small></small>→</span><span><small></small>H<sub>2</sub>O</span><span><small></small>+</span><span><small></small>CH<sub>3</sub>COOH</span></div></div>
      <p>H<sub>3</sub>O<sup>+</sup> perd un ${H} et devient H<sub>2</sub>O ; CH<sub>3</sub>COO<sup>−</sup> le capte et devient CH<sub>3</sub>COOH.</p>`)}`);
  const [ka, kb] = hasard(REAC.filter(r => r[0] !== 'H3O' || r[1] !== 'EAU')), ca = CP[ka], cb = CP[kb];
  const paire = melanger([{ id: 'a', label: f(ca.a) }, { id: 'b', label: f(cb.b) }]);
  const eq = equation(ca, cb);
  c.aToi(carte, [
    { titre: `Réaction entre ${f(ca.a)} et ${f(cb.b)}`,
      enonce: `<p>Couples : ${couple(ca)} et ${couple(cb)}.</p>`,
      parties: [
        { type: 'choix', q: `Quelle espèce donne le proton ${H}&nbsp;?`, melanger: false, options: paire, bonne: 'a',
          indices: { b: `${f(cb.b)} est la base de son couple (écrite en second) : elle <b>capte</b> le proton. C'est l'acide qui le donne.` },
          solution: `<p>${f(ca.a)} est l'acide de son couple : c'est lui qui donne le proton ${H}.</p>` },
        partieConjugue({ lignes: [
          { depart: ca.a, cible: ca.b, label: `L'acide ${f(ca.a)} donne son ${H} : que devient-il&nbsp;?` },
          { depart: cb.b, cible: cb.a, label: `La base ${f(cb.b)} capte ce ${H} : que devient-elle&nbsp;?` }] },
          { q: 'Construis les deux produits.', solution: `<p class="crs-calc">${eq.texte}</p>` }),
      ] },
  ]);
  return carte;
}

/* ---------- 2. La règle du gamma γ ---------- */
function etape2(c) {
  const carte = c.carte('2. La règle du gamma γ');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Méthode.</b></p>
        <ol class="ab-methode"><li>On écrit les deux couples <b>l'un sous l'autre</b>, acide à gauche, base à droite.</li>
          <li>On <b>entoure les deux réactifs</b> : un acide et une base, toujours <b>en diagonale</b>.</li>
          <li>Le tracé en <b>γ</b> relie les réactifs à ce qu'ils deviennent : chaque réactif devient son conjugué, écrit à côté de lui. Les <b>produits</b> sont les deux espèces non entourées.</li></ol></div>
      <p>Deux acides ne réagissent pas ensemble, deux bases non plus, et un acide ne réagit pas avec sa propre base conjuguée.</p>
    </div>
    ${exemple(`<p>Réaction entre NH<sub>3</sub> et CH<sub>3</sub>COOH. Couples : NH<sub>4</sub><sup>+</sup> / NH<sub>3</sub> et CH<sub>3</sub>COOH / CH<sub>3</sub>COO<sup>−</sup>.</p>
      ${gammaFig(CP.NH4, CP.ACE, ['b1', 'a2'])}
      <p class="crs-calc">donc NH<sub>3</sub> + CH<sub>3</sub>COOH → NH<sub>4</sub><sup>+</sup> + CH<sub>3</sub>COO<sup>−</sup></p>
      <p style="margin-top:14px">Réaction entre NH<sub>4</sub><sup>+</sup> et H<sub>2</sub>O. Couples : NH<sub>4</sub><sup>+</sup> / NH<sub>3</sub> et H<sub>3</sub>O<sup>+</sup> / H<sub>2</sub>O.</p>
      ${gammaFig(CP.NH4, CP.H3O, ['a1', 'b2'])}
      <p class="crs-calc">donc NH<sub>4</sub><sup>+</sup> + H<sub>2</sub>O → H<sub>3</sub>O<sup>+</sup> + NH<sub>3</sub></p>`, 'Exemples du cours')}`);
  // une réaction sans l'eau, une avec l'eau (ou les ions oxonium et hydroxyde)
  const avecEau = r => ['H3O', 'EAU'].includes(r[0]) || ['H3O', 'EAU'].includes(r[1]);
  const r1 = hasard(REAC.filter(r => !avecEau(r))), r2 = hasard(REAC.filter(avecEau));
  c.aToi(carte, [pourGamma(r1), pourGamma(r2)]);
  return carte;
}

/* ---------- 3. Reconnaître les couples dans une réaction ---------- */
function etape3(c) {
  const carte = c.carte('3. Reconnaître les couples d\'une réaction');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Dans une réaction acido-basique, chaque réactif devient son conjugué. Pour retrouver les couples, on associe chaque <b>réactif</b> au <b>produit</b> qui a un ${H} de plus ou de moins.</p>
      <div class="cle"><p>Une <b>réaction</b> acido-basique met en jeu <b>deux couples</b> et s'écrit avec une flèche →. Une <b>demi-équation</b> AH = A<sup>−</sup> + ${H} ne concerne qu'<b>un seul couple</b> : ${H} y apparaît.</p></div>
    </div>
    ${exemple(`<p class="crs-calc">C<sub>9</sub>H<sub>8</sub>O<sub>4</sub> + H<sub>2</sub>O → C<sub>9</sub>H<sub>7</sub>O<sub>4</sub><sup>−</sup> + H<sub>3</sub>O<sup>+</sup></p>
      <p>C<sub>9</sub>H<sub>8</sub>O<sub>4</sub> perd un ${H} : couple <b>C<sub>9</sub>H<sub>8</sub>O<sub>4</sub> / C<sub>9</sub>H<sub>7</sub>O<sub>4</sub><sup>−</sup></b>. H<sub>2</sub>O en gagne un : couple <b>H<sub>3</sub>O<sup>+</sup> / H<sub>2</sub>O</b>.</p>
      <p class="crs-calc" style="margin-top:10px"><span class="ab-acide">NH<sub>4</sub><sup>+</sup></span> + <span class="ab-base">PO<sub>4</sub><sup>3−</sup></span> → <span class="ab-base">NH<sub>3</sub></span> + <span class="ab-acide">HPO<sub>4</sub><sup>2−</sup></span></p>
      <p>Acides (trait plein) : NH<sub>4</sub><sup>+</sup> et HPO<sub>4</sub><sup>2−</sup> ; bases (pointillés) : PO<sub>4</sub><sup>3−</sup> et NH<sub>3</sub>. Couples NH<sub>4</sub><sup>+</sup> / NH<sub>3</sub> et HPO<sub>4</sub><sup>2−</sup> / PO<sub>4</sub><sup>3−</sup>.</p>
      <p class="crs-calc" style="margin-top:10px">H<sub>2</sub>CO<sub>3</sub> = HCO<sub>3</sub><sup>−</sup> + ${H}</p>
      <p>Ce n'est pas une réaction : c'est la <b>demi-équation</b> d'un seul couple, H<sub>2</sub>CO<sub>3</sub> / HCO<sub>3</sub><sup>−</sup>.</p>`, 'Exemples du cours')}`);
  // une réaction : étiqueter acide / base, puis retrouver les couples ; enfin, réaction ou demi-équation ?
  const [ka, kb] = hasard(REAC.filter(r => !(r[0] === 'H3O' && r[1] === 'EAU'))), ca = CP[ka], cb = CP[kb];
  const eq = equation(ca, cb, Math.random() < .5);
  const roles = [ca.a, cb.b, ca.b, cb.a].map(e => ({ e, acide: e === ca.a || e === cb.a }));
  const ordre = eq.reactifs.concat(eq.produits).map(e => roles.find(r => r.e === e));
  const c3 = CP[hasard(['H2CO3', 'HF', 'NH4', 'ACE', 'HNO3', 'HCO3'])], estDemi = Math.random() < .5;
  const [kx, ky] = hasard(REAC.filter(r => r[0] !== ka)), eq3 = equation(CP[kx], CP[ky]);
  c.aToi(carte, [
    { titre: 'Acides et bases d\'une réaction',
      enonce: `<p class="crs-calc">${eq.texte}</p>`,
      parties: [versCours({ type: 'grille', q: 'Indique pour chaque espèce si c\'est un acide ou une base.',
        options: [o('a', 'acide'), o('b', 'base')],
        lignes: ordre.map((r, i) => ({ id: 'l' + i, label: `${f(r.e)} <span class="ab-lib">(${i < 2 ? 'réactif' : 'produit'})</span>`, bonne: r.acide ? 'a' : 'b',
          indice: r.acide ? `${f(r.e)} a un H de plus que son conjugué : c'est un acide.` : `${f(r.e)} a un H de moins que son conjugué : c'est une base.` })),
        solution: `<p>Acides : ${f(ca.a)} et ${f(cb.a)} ; bases : ${f(cb.b)} et ${f(ca.b)}.</p>` })] },
    { titre: 'Les couples de la réaction',
      enonce: `<p class="crs-calc">${eq.texte}</p>`,
      parties: [{ type: 'choix', q: 'Quels sont les deux couples acide / base mis en jeu&nbsp;?', colonne: true,
        options: [o('ok', `${couple(ca)} et ${couple(cb)}`), o('reac', `${f(ca.a)} / ${f(cb.b)} et ${f(cb.a)} / ${f(ca.b)}`), o('inv', `${f(ca.b)} / ${f(ca.a)} et ${f(cb.b)} / ${f(cb.a)}`)],
        bonne: 'ok',
        indices: { reac: 'Les deux réactifs ne forment pas un couple : un couple, c\'est un réactif et le produit qu\'il devient (un H<sup>+</sup> de différence).',
                   inv: 'Dans un couple, on écrit l\'acide en premier (celui qui a le plus de H).' },
        solution: `<p>Couples <b>${couple(ca)}</b> et <b>${couple(cb)}</b>.</p>` }] },
    { titre: 'Réaction ou demi-équation&nbsp;?',
      enonce: `<p class="crs-calc">${estDemi ? demi(c3) : eq3.texte}</p>`,
      parties: [{ type: 'choix', q: 'Cette écriture est :', colonne: true,
        options: [o('demi', 'une demi-équation (un seul couple)'), o('reac', 'une réaction acido-basique (deux couples)')], bonne: estDemi ? 'demi' : 'reac', melanger: false,
        indices: estDemi ? { reac: `${H} apparaît et il n'y a qu'un couple, ${couple(c3)} : c'est une demi-équation.` }
          : { demi: `Il y a deux couples, ${couple(CP[kx])} et ${couple(CP[ky])}, et ${H} n'apparaît pas : c'est une réaction.` },
        solution: estDemi ? `<p>Une seule espèce et son conjugué, avec ${H} : c'est la <b>demi-équation</b> du couple ${couple(c3)}.</p>`
          : `<p>Deux couples, ${couple(CP[kx])} et ${couple(CP[ky])} : c'est une <b>réaction acido-basique</b>.</p>` }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p>Dans une <b>réaction acido-basique</b>, l'acide d'un couple donne un proton ${H} à la base d'un autre couple : chacun devient son conjugué. ${H} n'apparaît pas dans l'équation.</p></div>
    <div class="cle"><p><b>Règle du gamma γ :</b> les deux couples l'un sous l'autre ; on entoure les deux réactifs (en diagonale) ; les produits sont les deux autres espèces.</p>
      ${gammaFig(CP.NH4, CP.ACE, ['b1', 'a2'])}
      <p class="crs-calc">NH<sub>3</sub> + CH<sub>3</sub>COOH → NH<sub>4</sub><sup>+</sup> + CH<sub>3</sub>COO<sup>−</sup></p></div>
    <div class="cle"><p>Deux acides ne réagissent pas ensemble ; deux bases non plus. L'eau réagit avec elle-même : 2 H<sub>2</sub>O → H<sub>3</sub>O<sup>+</sup> + HO<sup>−</sup>.</p>
      <p>Une demi-équation (avec ${H}, un seul couple) n'est pas une réaction (deux couples).</p></div>
    <div class="er-actions">
      <a class="btn-primary" style="text-decoration:none" href="module_2_questions.html">Questions sur ce cours →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_3a_cours.html">Module 3 : le pH</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html">Fiche récapitulative</a>
    </div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
AB.menu('module_2_cours');
</script>
</body>
