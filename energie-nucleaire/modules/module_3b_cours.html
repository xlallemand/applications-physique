<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : comparaison avec le pétrole, activité — Chapitre 13 : Énergie nucléaire</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="nuc.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="nuc.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · COURS 2 / 2</span>
    <h2 class="er-titre">Comparaison avec le pétrole, activité</h2>
    <p class="er-contexte">Quelle <b>masse de pétrole</b> faudrait-il brûler pour libérer la même énergie qu'un gramme d'uranium ? Et combien de désintégrations par seconde faut-il pour fournir une <b>puissance</b> donnée ?</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. m(pétrole) = E / PC, PC = 42 MJ·kg⁻¹ = 42 × 10⁶ J·kg⁻¹ (OU tableau :
      1 kg ↔ 42 × 10⁶ J) : 5,93 × 10¹² J → 1,41 × 10⁵ kg = 141 t ; à toi :
      PC en J·kg⁻¹, 1,00 g d'uranium (7,61 × 10¹⁰ J → 1,81 × 10³ kg = 1,81 t)
   2. Puissance et activité : nombre de désintégrations par seconde =
      P / E(1 désintégration) = activité A en Bq : 1,0 W et 8,64 × 10⁻¹³ J
      → 1,16 × 10¹² Bq ; à toi : 1 W = 1 J·s⁻¹, 50 W et 8,8 × 10⁻¹³ J
      → 5,7 × 10¹³ Bq
   ============================================================ */
const { exemple } = COURS;
const { o, versCours, diagPetrole, diagActivite, PC } = NUC;
const sci = (q, label, valeur, unite, diag, solution, opts) => versCours(Object.assign({ type: 'sci', q, label, valeur, unite, diag, solution, rel: .01, cs: 3 }, opts));
const nombre = (q, label, valeur, unite, diag, solution, opts) => versCours(Object.assign({ type: 'nombre', q, label, valeur, unite, diag, solution, rel: .01, signe: false }, opts));
// tableau de proportionnalité (voir la charte) : en-têtes « grandeur (unité) », une ligne par couple de valeurs, « ? » : valeur cherchée
const prop = (entetes, lignes) => `<div class="crs-defile"><table class="crs-tab"><thead><tr>${entetes.map(e => `<th>${e}</th>`).join('')}</tr></thead><tbody>${lignes.map(l => `<tr>${l.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

/* ---------- 1. Masse de pétrole équivalente ---------- */
function etape1(c) {
  const carte = c.carte('1. Masse de pétrole équivalente');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Pouvoir calorifique.</b> PC = 42 MJ·kg<sup>−1</sup> pour le pétrole : la combustion de 1 kg de pétrole libère 42 MJ = 42 × 10<sup>6</sup> J.</p>
        <p>Masse de pétrole qui libère la même énergie E :</p><p class="crs-formule">m = <span class="fr"><span>E</span><span>PC</span></span></p>
        <p>E en J, PC en J·kg<sup>−1</sup>, m en kg.</p></div>
      <p style="margin-top:10px"><span class="nuc-ou">OU</span> avec un tableau de proportionnalité : 1 kg ↔ 42 × 10<sup>6</sup> J ; m ↔ E.</p>
      <div class="ph-lien-app"><p>Revoir le pouvoir calorifique</p><a class="btn-small" href="../../combustions/modules/module_5_cours.html" target="_blank" rel="noopener">Combustions : énergie libérée ↗</a></div>
    </div>
    ${exemple(`<p>La formation de 10 g d'hélium 4 libère 5,93 × 10<sup>12</sup> J (cours précédent).</p>
      ${prop(['m (kg)', 'E (J)'], [['1', '42 × 10<sup>6</sup>'], ['?', '5,93 × 10<sup>12</sup>']])}
      <p class="crs-calc">m = 1 × 5,93 × 10<sup>12</sup> / 42 × 10<sup>6</sup> = <span class="c">1,41 × 10<sup>5</sup> kg</span>, soit 141 tonnes de pétrole !</p>`)}`);
  const E = 7.61e10;
  c.aToi(carte, [
    { titre: 'Le pouvoir calorifique en joules', parties: [
      sci('PC = 42 MJ·kg<sup>−1</sup>. Combien de joules par kilogramme ?', 'PC =', 42e6, 'J·kg<sup>−1</sup>', v => (Math.abs(v / 42e3 - 1) < .01 ? '1 MJ = 10<sup>6</sup> J (méga), pas 10<sup>3</sup> J (kilo).' : '1 MJ = 10<sup>6</sup> J.'),
        '<p class="ph-calc">42 MJ·kg<sup>−1</sup> = 42 × 10<sup>6</sup> J·kg<sup>−1</sup> = 4,2 × 10<sup>7</sup> J·kg<sup>−1</sup></p>', { cs: 2 })] },
    { titre: 'Un gramme d\'uranium contre le pétrole', enonce: '<p>La fission de tous les noyaux de 1,00 g d\'uranium 235 libère 7,61 × 10<sup>10</sup> J.</p>', parties: [
      nombre('Quelle masse de pétrole libère la même énergie ?', 'm =', E / PC, 'kg', v => diagPetrole(v, E), '<p class="ph-calc">m = 7,61 × 10<sup>10</sup> / 42 × 10<sup>6</sup> = 1 812 kg</p>', { cs: 3 }),
      nombre('Et en tonnes ?', 'm =', E / PC / 1000, 't', v => (Math.abs(v / (E / PC) - 1) < .01 ? '1 t = 1 000 kg : divise par 1 000.' : 'm (t) = m (kg) / 1 000.'), '<p>1 812 kg ≈ 1,81 t : près de deux tonnes de pétrole pour un seul gramme d\'uranium !</p>', { cs: 3 })] },
  ]);
  return carte;
}

/* ---------- 2. Puissance et activité ---------- */
function etape2(c) {
  const carte = c.carte('2. Puissance et activité');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Puissance.</b> Une source radioactive de puissance P (en W) libère P joules chaque seconde (1 W = 1 J·s<sup>−1</sup>).</p>
        <p>Si chaque désintégration libère l'énergie E(1 désintégration), le nombre de désintégrations par seconde vaut :</p>
        <p class="crs-formule">A = <span class="fr"><span>P</span><span>E(1 désintégration)</span></span></p>
        <p>C'est l'<b>activité</b> A de la source, en becquerels (Bq) : 1 Bq = 1 désintégration par seconde.</p></div>
      <div class="ph-lien-app"><p>Revoir l'activité</p><a class="btn-small" href="../../radioactivite/modules/module_3_cours.html" target="_blank" rel="noopener">Chapitre 12 : activité ↗</a></div>
    </div>
    ${exemple(`<p>Une source de polonium 210 libère une puissance P = 1,0 W ; chaque désintégration libère 8,64 × 10<sup>−13</sup> J.</p>
      <p class="crs-calc">A = 1,0 / 8,64 × 10<sup>−13</sup> = <span class="c">1,2 × 10<sup>12</sup> Bq</span></p>
      <p>Il faut 1,2 × 10<sup>12</sup> désintégrations par seconde pour fournir 1 J par seconde.</p>`)}`);
  c.aToi(carte, [
    { titre: 'Le watt', parties: [{ type: 'choix', q: 'Une source de puissance 1 W libère :', colonne: true,
      options: [o('ok', '1 joule chaque seconde'), o('bq', '1 désintégration chaque seconde'), o('tot', '1 joule en tout')], bonne: 'ok',
      indices: { bq: '1 désintégration par seconde, c\'est 1 becquerel (l\'activité).', tot: 'La puissance est une énergie par seconde.' },
      solution: '1 W = 1 J·s<sup>−1</sup> : un joule chaque seconde.' }] },
    { titre: 'L\'activité d\'une source', enonce: '<p>Une source radioactive fournit une puissance P = 50 W ; chaque désintégration libère 8,8 × 10<sup>−13</sup> J.</p>', parties: [
      sci('Calcule son activité (2 chiffres significatifs).', 'A =', 50 / 8.8e-13, 'Bq', v => diagActivite(v, 50, 8.8e-13), '<p class="ph-calc">A = 50 / 8,8 × 10<sup>−13</sup> = 5,7 × 10<sup>13</sup> Bq</p>', { cs: 2 })] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Pétrole équivalent.</b> m = E / PC, avec PC = 42 MJ·kg<sup>−1</sup> = 42 × 10<sup>6</sup> J·kg<sup>−1</sup> (ou un tableau : 1 kg ↔ 42 × 10<sup>6</sup> J).</p></div>
    <div class="cle"><p><b class="cle-titre">Activité.</b> Nombre de désintégrations par seconde = P / E(1 désintégration) = A, en Bq.</p></div>
    <div class="er-actions">
      <a class="btn-primary" style="text-decoration:none" href="module_3_questions.html">Questions sur l'énergie d'un échantillon →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_4.html">Module 4 : exercices</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_3.html#comparaison">Fiche récapitulative</a>
    </div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
NUC.menu('module_3b_cours');
</script>
</body>
</html>
