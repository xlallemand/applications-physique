        :root {
            --app-accent-50:  var(--paper);
            --app-accent-100: var(--paper-2);
            --app-accent-200: var(--cle-bg);
            --app-accent-400: var(--line-strong);

        .btn-module { transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }

        @keyframes correctPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }

        .fr-cours .cours-bloc .cle + p { margin-top: 12px; }
        .fr-cours .crs-calc .frac, .fr-cours .crs-formule .frac { margin: 0 3px; }

        .fr-cours .crs-champs:not(.ligne) {

        /* « a/b = [case] sur M » : numérateur à compléter au-dessus du dénominateur donné */
        .fr-cours .crs-valeur:has(.fr-den) { display: inline-grid; grid-template-columns: auto auto; align-items: center; column-gap: 10px; row-gap: 0; }
        .fr-cours .crs-valeur:has(.fr-den) > .crs-lab { grid-row: 1 / span 2; }
        .fr-cours .crs-valeur:has(.fr-den) > .crs-champ-box { grid-column: 2; padding-bottom: 6px; border-bottom: 3px solid var(--ink); }
        .fr-cours .crs-valeur:has(.fr-den) > .crs-unite { grid-column: 2; text-align: center; padding-top: 4px; }

        .module-card-actions .btn-secondary { font-size: .9rem; padding: 10px 20px; }

<body class="bg-white min-h-screen">

<div id="app" class="container mx-auto px-4 py-8 max-w-4xl">

    <!-- une ligne dépliable par module (voir assets/sommaire.js) -->

</div>

<script>
// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// PLAN DE L'APPLICATION ET NAVIGATION (voir assets/sommaire.js)
// Application en une seule page : chaque page du sommaire est une
// ancre de l'adresse (#course-1, #training-1, #fiche-1…).
// ═══════════════════════════════════════════════════════════════
const PLAN = [
    { n: 1, titre: 'Simplification d\'une fraction', desc: 'Trouver la forme irréductible en divisant par le PGCD', fiche: 'fiche-1',
      parties: [{ nom: 'Simplification', cours: 'course-1', entrainement: 'training-1' }] },
    { n: 2, titre: 'Multiplication, inverse et division', desc: 'Multiplier deux fractions, calculer l\'inverse, diviser deux fractions', fiche: 'fiche-2',
      parties: [{ nom: 'Multiplication, inverse, division', cours: 'course-2', entrainement: 'training-2' }] },
    { n: 3, titre: 'Addition et soustraction (même dénominateur)', desc: 'Additionner et soustraire des fractions de même dénominateur', fiche: 'fiche-3',
      parties: [{ nom: 'Même dénominateur', cours: 'course-3', entrainement: 'training-3' }] },
    { n: 4, titre: 'Addition et soustraction (dénominateurs différents)', desc: 'Trouver le dénominateur commun, puis calculer', fiche: 'fiche-4',
      parties: [{ nom: 'Dénominateurs différents', cours: 'course-4', entrainement: 'training-4' }] },
    { n: 5, titre: 'S\'entraîner sur toutes les notions', desc: 'Questions qui combinent tous les modules',
      parties: [{ nom: 'Toutes les notions', entrainement: 'training-5' }] },
];
SOM.init({ nom: 'Fractions', id: 'fractions-college', spa: true, plan: PLAN });

let currentPage = 'home'; // 'home' | 'course-1' … 'course-4' | 'training-1' … 'training-5'

// ═══════════════════════════════════════════════════════════════
// COULEUR ET TITRE DE CHAQUE MODULE (cours et entraînement)
// ═══════════════════════════════════════════════════════════════
const MODULE_THEMES = {
    1: { color:'blue',   title:'Simplification',                                total:15 },
    2: { color:'purple', title:'Multiplication, inverse et division',           total:15 },
    3: { color:'blue',   title:'Addition et soustraction (même dénominateur)',  total:15 },
    4: { color:'orange', title:'Addition et soustraction (dénominateurs différents)', total:15 },
    5: { color:'rose',   title:'Toutes les notions',                            total:20 },
};

// ═══════════════════════════════════════════════════════════════
// ÉTAT GLOBAL
// ═══════════════════════════════════════════════════════════════
let currentModule = 0, currentQuestion = 0, score = 0, questions = [];

// Pavé numérique commun, sans touche virgule (les fractions n'utilisent que des entiers)
function fracNumpad() { return numpadWidget(false, { decimal: false }); }

// ═══════════════════════════════════════════════════════════════
// HELPERS FRACTIONS
// ═══════════════════════════════════════════════════════════════
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }

// Affiche une fraction HTML (inline)
function F(num, den) {
    return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
}
// Fraction simplifiée retournée comme objet {n, d}
function simplify(n, d) {
    const g = gcd(Math.abs(n), Math.abs(d));
    let sn = n / g, sd = d / g;
    if (sd < 0) { sn = -sn; sd = -sd; }
    return { n: sn, d: sd };
}

// Lit une fraction saisie par l'élève (numérateur, dénominateur) SANS la simplifier :
// seul le signe est ramené au numérateur. Renvoie null si la saisie est invalide.
function readFrac(numId, denId) {
    const n = parseInt(document.getElementById(numId).value.replace('−', '-'), 10);
    const d = parseInt(document.getElementById(denId).value.replace('−', '-'), 10);
    if (isNaN(n) || isNaN(d) || d === 0) return null;
    return d < 0 ? { n: -n, d: -d } : { n, d };
}

// Compare la fraction saisie au résultat attendu, sans simplification automatique :
// 'ok' = forme irréductible attendue, 'equiv' = égale mais non simplifiée, 'ko' = fausse
function compareFrac(user, correctN, correctD) {
    const c = simplify(correctN, correctD);
    if (user.n === c.n && user.d === c.d) return 'ok';
    if (user.n * c.d === c.n * user.d) return 'equiv';
    return 'ko';
}

// Champ de saisie d'une fraction (numérateur au-dessus, dénominateur en dessous)
function fracInput(numId, denId, cls) {
    return `<div class="frac-input-wrap">
        <input type="text" inputmode="numeric" id="${numId}" class="${cls}" placeholder="?" onfocus="numpadFocus(this.id)" ontouchstart="numpadFocus(this.id)">
        <div class="frac-bar"></div>
        <input type="text" inputmode="numeric" id="${denId}" class="${cls}" placeholder="?" onfocus="numpadFocus(this.id)" ontouchstart="numpadFocus(this.id)">
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
// (le titre de la page affichée est donné par le bandeau du sommaire)
function setTopBarTitle() {}
// sommaire de la page affichée ; l'adresse suit la page (#course-1…) pour que le retour arrière fonctionne
function updateActiveMenuItem() {
    const h = currentPage === 'home' ? '' : '#' + currentPage;
    if (location.hash !== h) history.pushState(null, '', location.pathname + location.search + h);
    SOM.menu(currentPage === 'home' ? 'accueil' : currentPage);
    if (currentPage === 'home') SOM.accueil(document.getElementById('menu'));
    // (un cours est marqué fait par assets/cours.js quand sa dernière étape s'affiche)
}
// une ancre de l'adresse ouvre la page correspondante (liens du sommaire et de l'accueil, retour arrière)
function ouvrirAncre() {
    const m = /^#(course|training|fiche)-(\d+)$/.exec(location.hash);
    if (!m) { backToMenu(); return; }
    const n = Number(m[2]);
    if (m[1] === 'course') showCourse(n);
    else if (m[1] === 'training') showTraining(n);
    else showFiche(n);
}
addEventListener('hashchange', ouvrirAncre);

function hideMenu() {
    document.getElementById('mainHeader').style.display = 'none';
    document.getElementById('menu').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
function backToMenu() {
    document.getElementById('moduleContainer').innerHTML = '';
    document.getElementById('mainHeader').style.display = '';
    document.getElementById('menu').style.display = '';
    setTopBarTitle(null);
    currentPage = 'home';
    updateActiveMenuItem();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
// cours par étapes du module num (voir COURS_FR plus bas) : en-tête, puis les étapes
// construites par le moteur commun ; les liens de fin (entraînement, module suivant,
// fiche) sont dans la carte « À retenir »
function showCourse(num) {
    hideMenu();
    const cours = COURS_FR[num];
    const c = document.getElementById('moduleContainer');
    c.innerHTML = `<div class="er-page fr-cours">
        <div class="er-card">
            <span class="er-badge">MODULE ${num} · COURS</span>
            <h2 class="er-titre">${cours.titre}</h2>
            <p class="er-contexte">${cours.contexte}</p>
        </div>
        <div class="fr-etapes"></div>
    </div>`;
    new COURS.Cours(c.querySelector('.fr-etapes'), cours.etapes, { cle: 'course-' + num });
    currentPage = 'course-' + num;
    updateActiveMenuItem();
}
// ═══════════════════════════════════════════════════════════════
// FICHES RÉCAPITULATIVES (une par module avec un cours)
// ═══════════════════════════════════════════════════════════════
function getFiche(num) {
    const carte = (titre, html) => `<section class="er-card"><h3 class="cours-titre">${titre}</h3>${html}</section>`;
    const FICHES = {
        1: ['Simplification d\'une fraction', [
            carte('Fraction irréductible', `
                <div class="cle"><p>${F('a', 'b')} est <b>irréductible</b> quand a et b n'ont aucun diviseur commun autre que 1.</p>
                <p>Pour simplifier, on divise le numérateur et le dénominateur par leur <b>PGCD</b> :</p>
                <p class="som-formule">${F('a', 'b')} = ${F('a ÷ PGCD(a,b)', 'b ÷ PGCD(a,b)')}</p></div>
                <p>PGCD(18, 24) = 6, donc ${F(18, 24)} = ${F('18 ÷ 6', '24 ÷ 6')} = ${F(3, 4)}</p>`),
            carte('Trouver le PGCD', `
                <div class="cle"><p>Lister les diviseurs de chaque nombre, puis prendre le plus grand diviseur commun.</p></div>
                <p>Diviseurs de 12 : 1, 2, 3, <b>4</b>, 6, 12 ; diviseurs de 8 : 1, 2, <b>4</b>, 8 : PGCD(12, 8) = 4.</p>
                <p>Cas particuliers : ${F(3, 7)} est déjà irréductible (PGCD = 1) ; ${F(7, 7)} = 1 ; ${F(0, 5)} = 0.</p>`),
        ]],
        2: ['Multiplication, inverse et division', [
            carte('Les trois règles', `
                <div class="cle">
                <p><b class="cle-titre">Multiplication</b> : numérateur × numérateur, dénominateur × dénominateur.</p><p class="som-formule">${F('a', 'b')} × ${F('c', 'd')} = ${F('a × c', 'b × d')}</p>
                <p><b class="cle-titre">Inverse</b> : on retourne la fraction.</p><p class="som-formule">inverse de ${F('a', 'b')} = ${F('b', 'a')}</p>
                <p><b class="cle-titre">Division</b> : diviser par une fraction, c'est multiplier par son inverse.</p><p class="som-formule">${F('a', 'b')} ÷ ${F('c', 'd')} = ${F('a', 'b')} × ${F('d', 'c')} = ${F('a × d', 'b × c')}</p></div>
                <p>${F(2, 3)} × ${F(4, 5)} = ${F(8, 15)} &nbsp;·&nbsp; ${F(3, 4)} ÷ ${F(2, 5)} = ${F(3, 4)} × ${F(5, 2)} = ${F(15, 8)}</p>`),
        ]],
        3: ['Addition et soustraction (même dénominateur)', [
            carte('La règle', `
                <div class="cle"><p>Même dénominateur : on additionne (ou soustrait) <b>uniquement les numérateurs</b> et on garde le dénominateur.</p>
                <p class="som-formule">${F('a', 'd')} + ${F('b', 'd')} = ${F('a + b', 'd')} &nbsp;&nbsp; ${F('a', 'd')} − ${F('b', 'd')} = ${F('a − b', 'd')}</p></div>
                <p>${F(3, 8)} + ${F(2, 8)} = ${F(5, 8)} &nbsp;·&nbsp; ${F(7, 10)} − ${F(3, 10)} = ${F(4, 10)} = ${F(2, 5)} (on simplifie)</p>`),
        ]],
        4: ['Addition et soustraction (dénominateurs différents)', [
            carte('La méthode', `
                <div class="cle"><ol class="er-liste" style="margin:0">
                    <li>trouver le dénominateur commun (souvent le <b>PPCM</b> des deux dénominateurs) ;</li>
                    <li>transformer chaque fraction en fraction égale ayant ce dénominateur ;</li>
                    <li>additionner ou soustraire les numérateurs ;</li>
                    <li>simplifier si possible.</li></ol></div>
                <p>Un dénominateur multiple de l'autre : ${F(1, 3)} + ${F(1, 6)} = ${F(2, 6)} + ${F(1, 6)} = ${F(3, 6)} = ${F(1, 2)}</p>
                <p>Cas général, PPCM(3, 4) = 12 : ${F(2, 3)} + ${F(3, 4)} = ${F(8, 12)} + ${F(9, 12)} = ${F(17, 12)}</p>`),
        ]],
    };
    const [titre, cartes] = FICHES[num];
    return `<div class="som-fiche">
        <div class="er-card"><span class="er-badge">MODULE ${num} · FICHE RÉCAPITULATIVE</span><h2 class="er-titre">${titre}</h2></div>
        ${cartes.join('')}
        <div class="er-actions som-fiche-liens"><a class="btn-secondary" href="#course-${num}">Revoir le cours</a><a class="btn-secondary" href="#training-${num}">S'entraîner</a></div>
    </div>`;
}
function showFiche(num) {
    hideMenu();
    document.getElementById('moduleContainer').innerHTML = getFiche(num);
    currentPage = 'fiche-' + num;
    updateActiveMenuItem();
}
function showTraining(num) {
    hideMenu();
    currentModule = num; currentQuestion = 0; score = 0;
    if (num === 1) questions = generateT1();
    else if (num === 2) questions = generateT2();
    else if (num === 3) questions = generateT3();
    else if (num === 4) questions = generateT4();
    else if (num === 5) questions = generateT5();
    questions = questions.map(shuffleQcm);
    setTopBarTitle(`Module ${num} : ${MODULE_THEMES[num].title} — Entraînement`);
    currentPage = 'training-' + num;
    updateActiveMenuItem();
    document.getElementById('moduleContainer').innerHTML = getTrainingHTML(num);
    showQuestion();
}

// ═══════════════════════════════════════════════════════════════
// COURS PAR ÉTAPES (moteur commun assets/cours.js) :
// notion → exemple → « À toi » → … → « À retenir ».
// Chaque cours est reconstruit à chaque affichage (showCourse) :
// les fractions des « À toi » sont tirées au hasard à chaque fois.
// ═══════════════════════════════════════════════════════════════
const COURS_FR = (function () {
    const { hasard, entre, exemple, melanger } = COURS;
    // liens de fin de cours (dernière carte « À retenir »)
    const actions = liens => `<div class="er-actions">${liens.map(([h, t], i) =>
        `<a class="${i ? 'btn-secondary' : 'btn-primary'}" href="${h}">${t}</a>`).join('')}</div>`;
    // tirage au hasard recommencé tant que la condition « refus » est vraie
    const tirerSauf = (tirer, refus) => { let x; do { x = tirer(); } while (refus(x)); return x; };
    // fraction irréductible écrite : 6/9 → 2/3 ; 6/6 → 1
    const ecrire = (n, d) => { const s = simplify(n, d); return s.d === 1 ? String(s.n) : F(s.n, s.d); };
    // fin d'un calcul : « 6/9 = 2/3 » (simplification si besoin), le résultat mis en valeur
    const fin = (n, d) => { const s = simplify(n, d); return s.n !== n || s.d !== d ? `${F(n, d)} = <span class="c">${ecrire(n, d)}</span>` : `<span class="c">${F(n, d)}</span>`; };
    const PAR = { '+': 'additionne', '−': 'soustrais' };

    /* ---------- Saisie d'une fraction (deux cases validées ensemble) ----------
       o = { q, n, d : fraction attendue (irréductible),
             diag(x, y) : diagnostic propre au calcul (ou rien),
             equiv(x, y) : message propre quand la fraction est juste mais pas simplifiée,
             zero : message quand le dénominateur saisi est 0, indice, solution } */
    function partieFrac(o) {
        return { type: 'champs', q: o.q,
            champs: [{ valeur: o.n, tol: 0, entier: true, signe: false, aria: 'Numérateur' },
                     { valeur: o.d, tol: 0, entier: true, signe: false, aria: 'Dénominateur' }],
            diag: vs => diagFrac(vs[0], vs[1], o), solution: o.solution };
    }
    function diagFrac(x, y, o) {
        if (!Number.isInteger(x) || !Number.isInteger(y)) return 'Le numérateur et le dénominateur sont des nombres entiers.';
        if (y === 0) return o.zero || 'Le dénominateur d\'une fraction ne peut pas être 0.';
        if (x < 0 && y < 0) return 'Écris la fraction sans signe moins : un quotient de deux nombres négatifs est positif.';
        // fraction égale au résultat mais pas irréductible : oubli de simplifier
        if (x * o.d === o.n * y) return (o.equiv && o.equiv(x, y))
            || `Ta fraction ${F(x, y)} est égale au résultat, mais elle n'est pas irréductible : divise encore le numérateur et le dénominateur par ${gcd(x, y)}.`;
        const propre = o.diag && o.diag(x, y);
        if (propre) return propre;
        if (x * o.n === o.d * y) return 'Tu as inversé le numérateur et le dénominateur.';
        return o.indice || 'Vérifie ton calcul.';
    }

    /* ═══════════════ COURS 1 — Simplification ═══════════════ */
    // erreurs fréquentes quand on simplifie a/b
    function diagSimpl(x, y, a, b) {
        if ((x === a) !== (y === b)) return 'Il faut diviser le numérateur <b>et</b> le dénominateur par le même nombre.';
        if (a - x === b - y && x > 0) return 'On ne soustrait pas : on <b>divise</b> le numérateur et le dénominateur par le même nombre.';
        if (x > 0 && y > 0 && a % x === 0 && b % y === 0 && a / x !== b / y)
            return `Tu as divisé ${a} par ${a / x} et ${b} par ${b / y} : il faut diviser les deux par le <b>même</b> nombre, leur PGCD.`;
        return null;
    }
    function equivSimpl(x, y, a, b) {
        if (x === a && y === b) return `Tu as recopié la fraction : divise le numérateur et le dénominateur par leur PGCD (${gcd(a, b)}).`;
        return `Tu as simplifié, mais pas jusqu'au bout : ${F(x, y)} se simplifie encore par ${gcd(x, y)}. En divisant directement par le PGCD (${gcd(a, b)}), tu arrives au résultat en une fois.`;
    }
    // simplifier a/b (avec ou sans le PGCD donné)
    function itemSimplifier(titre, a, b, pgcdDonne) {
        const g = gcd(a, b), s = simplify(a, b);
        return { titre,
            enonce: pgcdDonne ? `<p>PGCD(${a}, ${b}) = ${g}.</p>` : '',
            parties: [partieFrac({ q: `Simplifie ${F(a, b)} : donne la fraction irréductible.`, n: s.n, d: s.d,
                diag: (x, y) => diagSimpl(x, y, a, b), equiv: (x, y) => equivSimpl(x, y, a, b),
                indice: `Divise ${a} et ${b} par leur PGCD${pgcdDonne ? ` (${g})` : ''}.`,
                solution: `<p class="crs-calc">PGCD(${a}, ${b}) = ${g}, donc ${F(a, b)} = ${F(`${a} ÷ ${g}`, `${b} ÷ ${g}`)} = <span class="c">${F(s.n, s.d)}</span></p>` })] };
    }
    // diviseurs de n, ceux qui sont communs avec m en gras
    const listeDiv = (n, m) => divisors(n).map(k => m % k === 0 ? `<b>${k}</b>` : k).join(', ');

    function c1Irreductible(c) {
        const carte = c.carte('1. Qu\'est-ce qu\'une fraction irréductible ?');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>Une fraction ${F('a', 'b')} est <b>irréductible</b> quand le numérateur a et le dénominateur b n'ont <b>aucun diviseur commun autre que 1</b>.</p>
                <div class="cle"><p>Pour simplifier une fraction, on divise le numérateur et le dénominateur par leur <b>PGCD</b> (plus grand commun diviseur) :</p>
                    <p class="crs-formule">${F('a', 'b')} = ${F('a ÷ PGCD(a, b)', 'b ÷ PGCD(a, b)')}</p></div>
            </div>
            ${exemple(`<p>Simplifier ${F(6, 9)} : PGCD(6, 9) = 3.</p>
                <p class="crs-calc">${F(6, 9)} = ${F('6 ÷ 3', '9 ÷ 3')} = <span class="c">${F(2, 3)}</span> &nbsp;irréductible ✓</p>
                <p>De même : ${F(18, 24)} = ${F('18 ÷ 6', '24 ÷ 6')} = ${F(3, 4)} (PGCD = 6) · ${F(15, 25)} = ${F('15 ÷ 5', '25 ÷ 5')} = ${F(3, 5)} (PGCD = 5).</p>`, 'Exemples')}`);
        // une fraction irréductible et trois fractions qui se simplifient
        const bonne = hasard([[5, 7], [4, 9], [8, 15], [9, 10], [7, 12]]);
        const pieges = melanger([[4, 6], [9, 12], [6, 10], [10, 15], [14, 21], [12, 20]]).slice(0, 3);
        const indices = {};
        pieges.forEach(([a, b], k) => { const g = gcd(a, b); indices['f' + k] = `${a} et ${b} sont tous les deux divisibles par ${g} : ${F(a, b)} = ${F(a / g, b / g)}.`; });
        const [a, b, g] = hasard([[14, 21, 7], [15, 25, 5], [16, 24, 8], [12, 18, 6], [20, 30, 10], [9, 15, 3]]);
        c.aToi(carte, [
            { titre: 'Reconnaître une fraction irréductible',
              parties: [{ type: 'choix', q: 'Laquelle de ces fractions est irréductible ?',
                options: [{ id: 'ok', label: F(bonne[0], bonne[1]) }, ...pieges.map(([x, y], k) => ({ id: 'f' + k, label: F(x, y) }))],
                bonne: 'ok', indices,
                solution: `<p>${F(bonne[0], bonne[1])} : le seul diviseur commun de ${bonne[0]} et ${bonne[1]} est 1.</p>` }] },
            itemSimplifier('Simplifier avec le PGCD', a, b, g),
        ]);
        return carte;
    }

    function c1Pgcd(c) {
        const carte = c.carte('2. Comment trouver le PGCD ?');
        c.ajouter(carte, `<div class="cours-bloc">
                <div class="cle"><p><b class="cle-titre">Méthode des diviseurs communs.</b> On écrit la liste des diviseurs de chaque nombre, puis on prend le plus grand diviseur commun.</p></div>
            </div>
            ${exemple(`<p>Diviseurs de 12 : 1, 2, 3, <b>4</b>, 6, 12</p>
                <p>Diviseurs de 8 : 1, 2, <b>4</b>, 8</p>
                <p>PGCD(12, 8) = 4, donc :</p>
                <p class="crs-calc">${F(12, 8)} = ${F('12 ÷ 4', '8 ÷ 4')} = <span class="c">${F(3, 2)}</span></p>`)}`);
        const [p, q, G] = hasard([[12, 18, 6], [15, 25, 5], [8, 20, 4], [14, 21, 7], [16, 24, 8], [9, 27, 9]]);
        const f1 = hasard([[10, 15], [6, 9], [8, 12], [14, 35], [12, 20]]);
        const f2 = hasard([[36, 48], [24, 36], [30, 45], [28, 42], [32, 48]]);
        c.aToi(carte, [
            { titre: 'Trouver le PGCD',
              parties: [{ type: 'nombre', q: `Quel est le PGCD de ${p} et ${q} ?`, label: `PGCD(${p}, ${q}) =`, valeur: G, entier: true, signe: false, tol: 0,
                diag: v => !Number.isInteger(v) || v <= 0 ? 'Le PGCD est un nombre entier positif.'
                    : v > Math.min(p, q) ? `Le PGCD divise ${p} et ${q} : il ne peut pas être plus grand que ${Math.min(p, q)}. Tu as peut-être cherché un multiple commun.`
                    : p % v || q % v ? `${v} ne divise pas ${p % v ? p : q}.`
                    : `${v} divise bien ${p} et ${q}, mais ce n'est pas le <b>plus grand</b> diviseur commun.`,
                solution: `<p>Diviseurs de ${p} : ${listeDiv(p, q)}</p><p>Diviseurs de ${q} : ${listeDiv(q, p)}</p><p class="crs-calc">PGCD(${p}, ${q}) = <span class="c">${G}</span></p>` }] },
            itemSimplifier('Simplifier', f1[0], f1[1], false),
            itemSimplifier('Des nombres plus grands', f2[0], f2[1], false),
        ]);
        return carte;
    }

    function c1Cas(c) {
        const carte = c.carte('3. Cas particuliers');
        c.ajouter(carte, `<div class="cours-bloc">
                <div class="cle"><p>Si PGCD(a, b) = 1, la fraction est <b>déjà irréductible</b>.</p>
                    <p>Si le numérateur est égal au dénominateur, la fraction vaut <b>1</b>.</p>
                    <p>Si le numérateur est 0, la fraction vaut <b>0</b>.</p></div>
            </div>
            ${exemple(`<p class="crs-calc">${F(3, 7)} : PGCD(3, 7) = 1 → <span class="c">déjà irréductible</span></p>
                <p class="crs-calc">${F(7, 7)} = 7 ÷ 7 = <span class="c">1</span> &nbsp;·&nbsp; ${F(0, 5)} = 0 ÷ 5 = <span class="c">0</span></p>`, 'Exemples')}`);
        const [a, b] = hasard([[8, 15], [9, 14], [10, 21], [4, 9], [16, 25], [14, 15]]);
        const indices = {};
        [2, 3, 5].forEach(k => { indices['k' + k] = a % k ? `${a} n'est pas divisible par ${k}.` : `${k} divise ${a}, mais ${b} n'est pas divisible par ${k}.`; });
        const n = entre(3, 12), d = entre(3, 12);
        c.aToi(carte, [
            { titre: 'Peut-on simplifier ?',
              parties: [{ type: 'choix', q: `Peut-on simplifier ${F(a, b)} ?`, melanger: false, colonne: true,
                options: [{ id: 'non', label: 'Non, elle est déjà irréductible' }, { id: 'k2', label: 'Oui, par 2' }, { id: 'k3', label: 'Oui, par 3' }, { id: 'k5', label: 'Oui, par 5' }],
                bonne: 'non', indices,
                solution: `<p>Diviseurs de ${a} : ${listeDiv(a, b)} · diviseurs de ${b} : ${listeDiv(b, a)}. PGCD(${a}, ${b}) = 1 : ${F(a, b)} est déjà irréductible.</p>` }] },
            { titre: 'Numérateur égal au dénominateur',
              parties: [{ type: 'nombre', q: `Combien vaut ${F(n, n)} ?`, label: `${F(n, n)} =`, valeur: 1, entier: true, signe: false, tol: 0,
                diag: v => v === 0 ? `${n} − ${n} = 0, mais une fraction est une <b>division</b> : ${n} ÷ ${n} = 1.`
                    : v === n ? `Une fraction est une division : ${F(n, n)} = ${n} ÷ ${n}.`
                    : `Une fraction est une division : ${n} ÷ ${n}.`,
                solution: `<p class="crs-calc">${F(n, n)} = ${n} ÷ ${n} = <span class="c">1</span></p>` }] },
            { titre: 'Numérateur nul',
              parties: [{ type: 'nombre', q: `Combien vaut ${F(0, d)} ?`, label: `${F(0, d)} =`, valeur: 0, entier: true, signe: false, tol: 0,
                diag: v => v === d ? `0 ÷ ${d} = 0 : zéro partagé en ${d} parts, ça fait toujours 0.`
                    : `Une fraction est une division : ${F(0, d)} = 0 ÷ ${d}.`,
                solution: `<p class="crs-calc">${F(0, d)} = 0 ÷ ${d} = <span class="c">0</span></p>` }] },
        ]);
        return carte;
    }

    function c1Retenir(c) {
        const carte = c.carte('À retenir');
        c.ajouter(carte, `<div class="cle"><p>${F('a', 'b')} est <b>irréductible</b> quand a et b n'ont aucun diviseur commun autre que 1. Pour simplifier, on divise a et b par leur <b>PGCD</b> :</p>
                <p class="crs-formule">${F('a', 'b')} = ${F('a ÷ PGCD(a, b)', 'b ÷ PGCD(a, b)')}</p></div>
            <div class="cle"><p>PGCD : on liste les diviseurs de chaque nombre et on prend le plus grand diviseur commun.</p></div>
            <div class="cle"><p>${F(3, 7)} est déjà irréductible (PGCD = 1) · ${F(7, 7)} = 1 · ${F(0, 5)} = 0.</p></div>
            ${actions([['#training-1', 'S\'entraîner à simplifier →'], ['#course-2', 'Module 2 : multiplication, inverse et division'], ['#fiche-1', 'Fiche récapitulative']])}`);
        return carte;
    }

    /* ═══════════════ COURS 2 — Multiplication, inverse, division ═══════════════ */
    function itemProduit(titre, [a, b, c, d]) {
        const s = simplify(a * c, b * d);
        return { titre,
            parties: [partieFrac({ q: `Calcule ${F(a, b)} × ${F(c, d)} (donne une fraction irréductible).`, n: s.n, d: s.d,
                diag: (x, y) => x * (b * c) === y * (a * d) ? `Tu as multiplié en croix (${a} × ${d} et ${b} × ${c}) : pour un produit, on multiplie numérateur × numérateur et dénominateur × dénominateur.`
                    : x === a + c && y === b + d ? 'Tu as additionné : pour un produit, on <b>multiplie</b> les numérateurs entre eux et les dénominateurs entre eux.'
                    : null,
                indice: `Calcule ${a} × ${c} au numérateur et ${b} × ${d} au dénominateur, puis simplifie si possible.`,
                solution: `<p class="crs-calc">${F(a, b)} × ${F(c, d)} = ${F(`${a} × ${c}`, `${b} × ${d}`)} = ${fin(a * c, b * d)}</p>` })] };
    }
    function itemQuotient(titre, [a, b, c, d]) {
        const s = simplify(a * d, b * c);
        return { titre,
            parties: [partieFrac({ q: `Calcule ${F(a, b)} ÷ ${F(c, d)} (donne une fraction irréductible).`, n: s.n, d: s.d,
                diag: (x, y) => x * (b * d) === y * (a * c) ? `Tu as multiplié par ${F(c, d)} sans la retourner : diviser par ${F(c, d)}, c'est multiplier par son <b>inverse</b> ${F(d, c)}.`
                    : x * (a * d) === y * (b * c) ? 'Tu as retourné la première fraction : c\'est la deuxième (celle par laquelle on divise) qu\'on retourne.'
                    : null,
                indice: `Multiplie ${F(a, b)} par l'inverse de ${F(c, d)}, puis simplifie si possible.`,
                solution: `<p class="crs-calc">${F(a, b)} ÷ ${F(c, d)} = ${F(a, b)} × ${F(d, c)} = ${F(`${a} × ${d}`, `${b} × ${c}`)} = ${fin(a * d, b * c)}</p>` })] };
    }

    function c2Multiplication(c) {
        const carte = c.carte('1. Multiplier deux fractions');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>On multiplie <b>numérateur × numérateur</b> et <b>dénominateur × dénominateur</b> :</p>
                <div class="cle"><p class="crs-formule">${F('a', 'b')} × ${F('c', 'd')} = ${F('a × c', 'b × d')}</p></div>
            </div>
            ${exemple(`<p class="crs-calc">${F(2, 3)} × ${F(4, 5)} = ${F('2 × 4', '3 × 5')} = <span class="c">${F(8, 15)}</span></p>
                <p class="crs-calc">${F(3, 4)} × ${F(8, 9)} = ${F('3 × 8', '4 × 9')} = ${F(24, 36)} = <span class="c">${F(2, 3)}</span> &nbsp;(après simplification)</p>
                <p class="crs-calc">${F(5, 7)} × ${F(7, 5)} = ${F('5 × 7', '7 × 5')} = ${F(35, 35)} = <span class="c">1</span> &nbsp;(fractions inverses)</p>`, 'Exemples')}`);
        c.aToi(carte, [
            itemProduit('Un produit simple', hasard([[3, 5, 2, 7], [2, 3, 4, 5], [1, 4, 3, 5], [4, 7, 2, 3], [5, 6, 1, 7]])),
            itemProduit('Un produit à simplifier', hasard([[3, 4, 8, 9], [2, 3, 9, 4], [5, 6, 3, 10], [4, 5, 15, 8], [2, 5, 5, 6], [3, 8, 4, 9]])),
        ]);
        return carte;
    }

    function c2Inverse(c) {
        const carte = c.carte('2. L\'inverse d\'une fraction');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>L'inverse de ${F('a', 'b')} est ${F('b', 'a')} : on <b>retourne</b> la fraction.</p>
                <div class="cle"><p class="crs-formule">inverse de ${F('a', 'b')} = ${F('b', 'a')}</p>
                    <p>Un nombre entier n s'écrit ${F('n', '1')} : son inverse est ${F('1', 'n')}.</p></div>
            </div>
            ${exemple(`<p class="crs-calc">Inverse de ${F(3, 4)} = <span class="c">${F(4, 3)}</span></p>
                <p class="crs-calc">Inverse de ${F(2, 7)} = <span class="c">${F(7, 2)}</span></p>
                <p class="crs-calc">5 = ${F(5, 1)}, donc inverse de 5 = <span class="c">${F(1, 5)}</span></p>`, 'Exemples')}`);
        const [a, b] = hasard([[5, 8], [3, 4], [2, 7], [4, 9], [3, 5], [7, 2]]);
        const n = entre(2, 9);
        const [p, q] = hasard([[2, 3], [3, 5], [4, 7], [5, 9]]);
        c.aToi(carte, [
            { titre: 'Inverse d\'une fraction',
              parties: [partieFrac({ q: `Quel est l'inverse de ${F(a, b)} ?`, n: b, d: a,
                diag: (x, y) => x === a && y === b ? 'Tu as recopié la fraction : l\'inverse, c\'est la fraction <b>retournée</b> (le dénominateur passe en haut).' : null,
                indice: 'Retourne la fraction : le numérateur passe en bas, le dénominateur en haut.',
                solution: `<p class="crs-calc">Inverse de ${F(a, b)} = <span class="c">${F(b, a)}</span></p>` })] },
            { titre: 'Inverse d\'un nombre entier',
              parties: [partieFrac({ q: `Quel est l'inverse de ${n} ? Écris-le sous forme de fraction.`, n: 1, d: n,
                diag: (x, y) => x === n && y === 1 ? `${F(n, 1)} = ${n} : c'est le nombre lui-même. Retourne ${F(n, 1)}.` : null,
                indice: `${n} = ${F(n, 1)} : retourne cette fraction.`,
                solution: `<p class="crs-calc">${n} = ${F(n, 1)}, donc son inverse est <span class="c">${F(1, n)}</span></p>` })] },
            { titre: 'Une fraction et son inverse',
              parties: [{ type: 'choix', q: `Combien vaut ${F(p, q)} × ${F(q, p)} ?`,
                options: [{ id: 'un', label: '1' }, { id: 'carre', label: F(p * p, q * q) }, { id: 'zero', label: '0' }],
                bonne: 'un',
                indices: { carre: `Tu as multiplié ${F(p, q)} par elle-même : ici la deuxième fraction est retournée, ${F(`${p} × ${q}`, `${q} × ${p}`)}.`,
                           zero: `Ce n'est pas une soustraction : ${F(`${p} × ${q}`, `${q} × ${p}`)} = ${F(p * q, p * q)}.` },
                solution: `<p class="crs-calc">${F(p, q)} × ${F(q, p)} = ${F(`${p} × ${q}`, `${q} × ${p}`)} = ${F(p * q, p * q)} = <span class="c">1</span></p><p>Une fraction multipliée par son inverse donne toujours 1.</p>` }] },
        ]);
        return carte;
    }

    function c2Division(c) {
        const carte = c.carte('3. Diviser deux fractions');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>Diviser par une fraction, c'est <b>multiplier par son inverse</b> :</p>
                <div class="cle"><p class="crs-formule">${F('a', 'b')} ÷ ${F('c', 'd')} = ${F('a', 'b')} × ${F('d', 'c')} = ${F('a × d', 'b × c')}</p></div>
            </div>
            ${exemple(`<p class="crs-calc">${F(3, 4)} ÷ ${F(2, 5)} = ${F(3, 4)} × ${F(5, 2)} = ${F('3 × 5', '4 × 2')} = <span class="c">${F(15, 8)}</span></p>
                <p class="crs-calc">${F(6, 7)} ÷ ${F(3, 7)} = ${F(6, 7)} × ${F(7, 3)} = ${F('6 × 7', '7 × 3')} = ${F(42, 21)} = <span class="c">2</span></p>`, 'Exemples')}`);
        c.aToi(carte, [
            itemQuotient('Une division simple', hasard([[3, 4, 2, 5], [2, 3, 5, 7], [1, 2, 3, 5], [5, 6, 1, 7], [3, 5, 4, 7]])),
            itemQuotient('Une division à simplifier', hasard([[4, 5, 2, 3], [2, 3, 4, 9], [5, 8, 5, 4], [3, 4, 9, 8], [2, 5, 4, 3]])),
        ]);
        return carte;
    }

    function c2Retenir(c) {
        const carte = c.carte('À retenir');
        c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Multiplication</b> : numérateur × numérateur, dénominateur × dénominateur.</p><p class="crs-formule">${F('a', 'b')} × ${F('c', 'd')} = ${F('a × c', 'b × d')}</p></div>
            <div class="cle"><p><b class="cle-titre">Inverse</b> : on retourne la fraction.</p><p class="crs-formule">inverse de ${F('a', 'b')} = ${F('b', 'a')}</p></div>
            <div class="cle"><p><b class="cle-titre">Division</b> : diviser par une fraction, c'est multiplier par son inverse.</p><p class="crs-formule">${F('a', 'b')} ÷ ${F('c', 'd')} = ${F('a × d', 'b × c')}</p></div>
            ${actions([['#training-2', 'S\'entraîner sur la multiplication et la division →'], ['#course-3', 'Module 3 : addition et soustraction (même dénominateur)'], ['#fiche-2', 'Fiche récapitulative']])}`);
        return carte;
    }

    /* ═══════════════ COURS 3 — Même dénominateur ═══════════════ */
    // a/d op b/d
    function itemMeme(titre, a, b, d, op) {
        const r = op === '+' ? a + b : a - b, s = simplify(r, d);
        return { titre,
            parties: [partieFrac({ q: `Calcule ${F(a, d)} ${op} ${F(b, d)} (simplifie si possible).`, n: s.n, d: s.d,
                zero: `Tu as soustrait les dénominateurs (${d} − ${d} = 0) : quand ils sont égaux, on <b>garde</b> le dénominateur et on soustrait seulement les numérateurs.`,
                diag: (x, y) => x * (2 * d) === y * r ? 'Tu as additionné les dénominateurs : quand ils sont égaux, on <b>garde</b> le dénominateur et on additionne seulement les numérateurs.'
                    : x === a * b && y === d * d ? `Tu as multiplié : pour ${op === '+' ? 'une addition' : 'une soustraction'}, on ${op === '+' ? 'additionne' : 'soustrait'} les numérateurs.`
                    : null,
                indice: `Garde le dénominateur ${d} et ${PAR[op]} les numérateurs : ${a} ${op} ${b}.`,
                solution: `<p class="crs-calc">${F(a, d)} ${op} ${F(b, d)} = ${F(`${a} ${op} ${b}`, d)} = ${fin(r, d)}</p>` })] };
    }

    function c3Addition(c) {
        const carte = c.carte('1. Additionner deux fractions de même dénominateur');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>Quand deux fractions ont <b>le même dénominateur</b>, on additionne <b>uniquement les numérateurs</b> et on <b>garde le dénominateur</b>.</p>
                <div class="cle"><p class="crs-formule">${F('a', 'd')} + ${F('b', 'd')} = ${F('a + b', 'd')}</p></div>
                <p><b>Astuce :</b> pense à des parts de pizza. Si la pizza est coupée en 8 parts, 3 parts plus 2 parts font bien 5 parts sur 8.</p>
            </div>
            ${exemple(`<p class="crs-calc">${F(3, 8)} + ${F(2, 8)} = ${F('3 + 2', 8)} = <span class="c">${F(5, 8)}</span> &nbsp;·&nbsp; ${F(1, 5)} + ${F(3, 5)} = ${F('1 + 3', 5)} = <span class="c">${F(4, 5)}</span></p>
                <p class="crs-calc">${F(5, 6)} + ${F(1, 6)} = ${F('5 + 1', 6)} = ${F(6, 6)} = <span class="c">1</span> &nbsp;(on simplifie !)</p>`, 'Exemples')}`);
        // somme déjà irréductible, puis somme à simplifier
        const [a, b, d] = tirerSauf(() => { const d = hasard([5, 7, 9, 11, 13]), a = entre(1, d - 2); return [a, entre(1, d - 1 - a), d]; },
            ([a, b, d]) => gcd(a + b, d) !== 1);
        const [p, q, D] = hasard([[4, 2, 9], [3, 2, 10], [5, 1, 12], [4, 6, 15], [1, 3, 6], [3, 3, 8]]);
        c.aToi(carte, [itemMeme('Une addition', a, b, d, '+'), itemMeme('Une addition à simplifier', p, q, D, '+')]);
        return carte;
    }

    function c3Soustraction(c) {
        const carte = c.carte('2. Soustraire deux fractions de même dénominateur');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>C'est la même règle : on soustrait <b>uniquement les numérateurs</b> et on <b>garde le dénominateur</b>.</p>
                <div class="cle"><p class="crs-formule">${F('a', 'd')} − ${F('b', 'd')} = ${F('a − b', 'd')}</p></div>
            </div>
            ${exemple(`<p class="crs-calc">${F(5, 7)} − ${F(2, 7)} = ${F('5 − 2', 7)} = <span class="c">${F(3, 7)}</span></p>
                <p class="crs-calc">${F(7, 10)} − ${F(3, 10)} = ${F('7 − 3', 10)} = ${F(4, 10)} = <span class="c">${F(2, 5)}</span> &nbsp;(simplification par 2)</p>
                <p class="crs-calc">${F(9, 12)} − ${F(3, 12)} = ${F('9 − 3', 12)} = ${F(6, 12)} = <span class="c">${F(1, 2)}</span> &nbsp;(simplification par 6)</p>`, 'Exemples')}`);
        const [a, b, d] = tirerSauf(() => { const d = hasard([7, 9, 11, 13, 15]), a = entre(3, d - 1); return [a, entre(1, a - 1), d]; },
            ([a, b, d]) => gcd(a - b, d) !== 1);
        const [p, q, D] = hasard([[7, 3, 10], [9, 3, 12], [11, 5, 12], [7, 4, 9], [9, 3, 15], [5, 3, 8]]);
        c.aToi(carte, [itemMeme('Une soustraction', a, b, d, '−'), itemMeme('Une soustraction à simplifier', p, q, D, '−')]);
        return carte;
    }

    function c3Retenir(c) {
        const carte = c.carte('À retenir');
        c.ajouter(carte, `<div class="cle"><p>Même dénominateur : on additionne (ou on soustrait) <b>uniquement les numérateurs</b> et on garde le dénominateur.</p>
                <p class="crs-formule">${F('a', 'd')} + ${F('b', 'd')} = ${F('a + b', 'd')} &nbsp;&nbsp; ${F('a', 'd')} − ${F('b', 'd')} = ${F('a − b', 'd')}</p></div>
            <div class="cle"><p>On simplifie le résultat si possible : ${F(7, 10)} − ${F(3, 10)} = ${F(4, 10)} = ${F(2, 5)}.</p></div>
            ${actions([['#training-3', 'S\'entraîner sur l\'addition et la soustraction →'], ['#course-4', 'Module 4 : dénominateurs différents'], ['#fiche-3', 'Fiche récapitulative']])}`);
        return carte;
    }

    /* ═══════════════ COURS 4 — Dénominateurs différents ═══════════════ */
    // a/b op c/d avec L = PPCM(b, d)
    function itemDiff(titre, [a, b, c, d], op) {
        const L = lcm(b, d), A = a * L / b, C = c * L / d, r = op === '+' ? A + C : A - C, s = simplify(r, L);
        const calc = (x, y) => op === '+' ? x + y : x - y;
        return { titre,
            parties: [partieFrac({ q: `Calcule ${F(a, b)} ${op} ${F(c, d)} (simplifie si possible).`, n: s.n, d: s.d,
                diag: (x, y) => (x === calc(a, c) && y === calc(b, d)) ? `Tu as ${op === '+' ? 'additionné' : 'soustrait'} les numérateurs entre eux et les dénominateurs entre eux : il faut d'abord mettre les deux fractions au <b>même dénominateur</b>.`
                    : (y === L && x === calc(a, c)) ? `Le dénominateur commun ${L} est juste, mais il faut aussi multiplier chaque numérateur par le même nombre que son dénominateur : ${b === L ? `${F(c, d)} = ${F(C, L)}` : `${F(a, b)} = ${F(A, L)}`}.`
                    : (x === a * c && y === b * d) ? `Tu as multiplié les fractions : pour ${op === '+' ? 'une addition' : 'une soustraction'}, il faut un dénominateur commun.`
                    : null,
                equiv: (x, y) => y % L === 0 && y > L ? `Ton calcul est juste, mais ${F(x, y)} n'est pas irréductible : divise par ${gcd(x, y)}. Avec le PPCM (${L}) comme dénominateur commun, les nombres restent plus petits.` : null,
                indice: `Mets d'abord les deux fractions au même dénominateur (${L}), puis ${PAR[op]} les numérateurs.`,
                solution: `<p class="crs-calc">Dénominateur commun : ${L}. ${L === b ? `${F(c, d)} = ${F(`${c} × ${L / d}`, `${d} × ${L / d}`)} = ${F(C, L)}`
                        : L === d ? `${F(a, b)} = ${F(`${a} × ${L / b}`, `${b} × ${L / b}`)} = ${F(A, L)}`
                        : `${F(a, b)} = ${F(A, L)} et ${F(c, d)} = ${F(C, L)}`}</p>
                    <p class="crs-calc">${F(A, L)} ${op} ${F(C, L)} = ${F(`${A} ${op} ${C}`, L)} = ${fin(r, L)}</p>` })] };
    }

    function c4Principe(c) {
        const carte = c.carte('1. Le principe : un dénominateur commun');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>Pour additionner ou soustraire des fractions de dénominateurs <b>différents</b>, on doit d'abord les mettre <b>au même dénominateur</b>.</p>
                <div class="cle"><ol class="er-liste">
                    <li>Trouver le <b>dénominateur commun</b> (souvent le PPCM des deux dénominateurs) ;</li>
                    <li>transformer chaque fraction en fraction égale ayant ce dénominateur ;</li>
                    <li>additionner ou soustraire les numérateurs ;</li>
                    <li>simplifier si possible.</li></ol></div>
                <p>Pour changer le dénominateur sans changer la fraction, on multiplie le numérateur <b>et</b> le dénominateur par le même nombre.</p>
            </div>
            ${exemple(`<p class="crs-calc">${F(1, 3)} = ${F('1 × 2', '3 × 2')} = <span class="c">${F(2, 6)}</span> &nbsp;·&nbsp; ${F(3, 4)} = ${F('3 × 2', '4 × 2')} = <span class="c">${F(6, 8)}</span></p>`)}`);
        const item = (titre, a, b, k) => {
            const M = b * k;
            return { titre,
                parties: [{ type: 'nombre', q: `Complète pour que la fraction ait le dénominateur ${M}.`, label: `${F(a, b)} =`,
                    unite: `<span class="fr-den">${M}</span>`, valeur: a * k, entier: true, signe: false, tol: 0, aria: 'Numérateur',
                    diag: v => v === a ? `Tu as gardé le numérateur : le dénominateur a été multiplié par ${k}, le numérateur doit l'être aussi.`
                        : v === a + M - b ? `Tu as ajouté ${M - b} : pour garder une fraction égale, on <b>multiplie</b> le numérateur et le dénominateur par le même nombre (ici ${k}).`
                        : `${b} × ${k} = ${M} : multiplie aussi le numérateur ${a} par ${k}.`,
                    solution: `<p class="crs-calc">${b} × ${k} = ${M}, donc ${F(a, b)} = ${F(`${a} × ${k}`, `${b} × ${k}`)} = <span class="c">${F(a * k, M)}</span></p>` }] };
        };
        const [a, b] = hasard([[1, 3], [3, 4], [2, 5], [5, 6], [1, 4]]);
        const [p, q] = hasard([[2, 3], [3, 5], [4, 7], [5, 8]]);
        c.aToi(carte, [item('Une fraction égale', a, b, entre(2, 3)), item('Un autre exemple', p, q, entre(3, 5))]);
        return carte;
    }

    function c4CasSimple(c) {
        const carte = c.carte('2. Cas simple : un dénominateur est multiple de l\'autre');
        c.ajouter(carte, `<div class="cours-bloc">
                <div class="cle"><p>Si un dénominateur est un multiple de l'autre, c'est lui le dénominateur commun : on ne transforme que l'autre fraction.</p></div>
            </div>
            ${exemple(`<p>${F(1, 3)} + ${F(1, 6)} : 6 est un multiple de 3, on met tout au dénominateur 6.</p>
                <p class="crs-calc">${F(1, 3)} = ${F('1 × 2', '3 × 2')} = ${F(2, 6)}, donc ${F(2, 6)} + ${F(1, 6)} = ${F('2 + 1', 6)} = ${F(3, 6)} = <span class="c">${F(1, 2)}</span></p>
                <p>${F(3, 4)} − ${F(1, 8)} : 8 est un multiple de 4, dénominateur commun 8.</p>
                <p class="crs-calc">${F(3, 4)} = ${F('3 × 2', '4 × 2')} = ${F(6, 8)}, donc ${F(6, 8)} − ${F(1, 8)} = ${F('6 − 1', 8)} = <span class="c">${F(5, 8)}</span></p>`, 'Exemples')}`);
        c.aToi(carte, [
            itemDiff('Une addition', hasard([[1, 2, 1, 4], [1, 3, 1, 9], [2, 3, 1, 6], [1, 4, 3, 8], [2, 5, 3, 10]]), '+'),
            itemDiff('Une soustraction', hasard([[3, 4, 1, 8], [7, 8, 1, 4], [4, 5, 1, 10], [2, 3, 1, 9]]), '−'),
            itemDiff('Un résultat à simplifier', hasard([[1, 3, 1, 6], [1, 4, 1, 12], [1, 2, 1, 6], [3, 4, 1, 12], [2, 5, 1, 10]]), '+'),
        ]);
        return carte;
    }

    function c4Ppcm(c) {
        const carte = c.carte('3. Cas général : utiliser le PPCM');
        c.ajouter(carte, `<div class="cours-bloc">
                <div class="cle"><p>Le <b>PPCM</b> (plus petit commun multiple) de deux nombres est le plus petit entier divisible par les deux. On le prend comme dénominateur commun.</p></div>
                <p>Pour le trouver, écris les multiples du plus grand dénominateur jusqu'à tomber sur un multiple de l'autre : multiples de 4 : 4, 8, <b>12</b> ; 12 est divisible par 3, donc PPCM(3, 4) = 12.</p>
            </div>
            ${exemple(`<p>${F(2, 3)} + ${F(3, 4)} : PPCM(3, 4) = 12.</p>
                <p class="crs-calc">${F(2, 3)} = ${F('2 × 4', '3 × 4')} = ${F(8, 12)} et ${F(3, 4)} = ${F('3 × 3', '4 × 3')} = ${F(9, 12)}, donc ${F(8, 12)} + ${F(9, 12)} = ${F('8 + 9', 12)} = <span class="c">${F(17, 12)}</span></p>
                <p>${F(5, 6)} − ${F(1, 4)} : PPCM(6, 4) = 12.</p>
                <p class="crs-calc">${F(5, 6)} = ${F('5 × 2', '6 × 2')} = ${F(10, 12)} et ${F(1, 4)} = ${F('1 × 3', '4 × 3')} = ${F(3, 12)}, donc ${F(10, 12)} − ${F(3, 12)} = ${F('10 − 3', 12)} = <span class="c">${F(7, 12)}</span></p>`, 'Exemples')}`);
        const [m, n] = hasard([[3, 4], [4, 6], [6, 8], [2, 5], [6, 9], [4, 10]]), P = lcm(m, n);
        c.aToi(carte, [
            { titre: 'Trouver le PPCM',
              parties: [{ type: 'nombre', q: `Quel est le PPCM de ${m} et ${n} ?`, label: `PPCM(${m}, ${n}) =`, valeur: P, entier: true, signe: false, tol: 0,
                diag: v => !Number.isInteger(v) || v <= 0 ? 'Le PPCM est un nombre entier positif.'
                    : v % m || v % n ? `${v} n'est pas un multiple de ${v % m ? m : n}.`
                    : `${v} est bien un multiple de ${m} et de ${n}, mais ce n'est pas le <b>plus petit</b>.`,
                solution: `<p>Multiples de ${Math.max(m, n)} : ${[1, 2, 3, 4, 5].map(k => k * Math.max(m, n)).filter(x => x <= P).map(x => x === P ? `<b>${x}</b>` : x).join(', ')}</p>
                    <p class="crs-calc">${P} est le premier divisible par ${Math.min(m, n)} : PPCM(${m}, ${n}) = <span class="c">${P}</span></p>` }] },
            itemDiff('Une addition', hasard([[1, 3, 1, 4], [1, 4, 2, 5], [3, 5, 1, 3], [2, 5, 1, 3], [1, 6, 2, 5]]), '+'),
            itemDiff('Une soustraction', hasard([[5, 6, 1, 4], [3, 4, 1, 6], [5, 6, 3, 8], [7, 10, 1, 4], [5, 8, 1, 6]]), '−'),
        ]);
        return carte;
    }

    function c4Retenir(c) {
        const carte = c.carte('À retenir');
        c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Même dénominateur</b> : ${F('a', 'd')} ± ${F('b', 'd')} = ${F('a ± b', 'd')}</p></div>
            <div class="cle"><p><b class="cle-titre">Dénominateurs différents</b> : on met les deux fractions au même dénominateur (le PPCM des dénominateurs), puis on additionne ou on soustrait les numérateurs, et on simplifie si possible.</p>
                <p>${F(2, 3)} + ${F(3, 4)} = ${F(8, 12)} + ${F(9, 12)} = ${F(17, 12)}</p></div>
            ${actions([['#training-4', 'S\'entraîner sur les dénominateurs différents →'], ['#training-5', 'Module 5 : toutes les notions'], ['#fiche-4', 'Fiche récapitulative']])}`);
        return carte;
    }

    return {
        1: { titre: 'Simplification d\'une fraction',
             contexte: 'Tu vas apprendre à rendre une fraction <b>irréductible</b> en divisant son numérateur et son dénominateur par leur <b>PGCD</b>.',
             etapes: [c1Irreductible, c1Pgcd, c1Cas, c1Retenir] },
        2: { titre: 'Multiplication, inverse et division',
             contexte: 'Tu vas apprendre à <b>multiplier</b> deux fractions, à trouver l\'<b>inverse</b> d\'une fraction et à <b>diviser</b> par une fraction.',
             etapes: [c2Multiplication, c2Inverse, c2Division, c2Retenir] },
        3: { titre: 'Addition et soustraction (même dénominateur)',
             contexte: 'Quand deux fractions ont le <b>même dénominateur</b>, les additionner ou les soustraire est simple : tu vas voir comment.',
             etapes: [c3Addition, c3Soustraction, c3Retenir] },
        4: { titre: 'Addition et soustraction (dénominateurs différents)',
             contexte: 'Pour additionner ou soustraire des fractions de <b>dénominateurs différents</b>, on les met d\'abord au même dénominateur, avec le <b>PPCM</b>.',
             etapes: [c4Principe, c4CasSimple, c4Ppcm, c4Retenir] },
    };
})();

// AFFICHAGE D'UNE QUESTION
// ═══════════════════════════════════════════════════════════════
function showQuestion() {
    const q = questions[currentQuestion];
    const color = MODULE_THEMES[currentModule].color;
    const container = document.getElementById('questionContainer');
    const total = questions.length;
    document.getElementById('questionNum').textContent = currentQuestion + 1;
    document.getElementById('progressBar').style.width = ((currentQuestion + 1) / total * 100) + '%';
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('submitBtn').style.display = 'block';
    document.getElementById('nextBtn').style.display = 'none';

    if (q.type === 'frac_input') {
        // Réponse = fraction à saisir (numérateur + dénominateur)
        container.innerHTML = `
            <div class="bg-${color}-50 rounded-xl p-6 question-box">
                <p class="text-xl mb-6 font-medium">${q.question}</p>
                <div class="flex items-center gap-4 flex-wrap mt-2 text-${color}-900">
                    <span class="text-gray-600 font-semibold text-lg">Réponse :</span>
                    ${fracInput('answerN', 'answerD', `border-2 border-${color}-400 rounded bg-white text-lg`)}
                </div>
                ${fracNumpad()}
                <p class="text-sm text-gray-500 mt-3">Saisis le numérateur (haut) et le dénominateur (bas). Simplifie si possible.</p>
            </div>`;

    } else if (q.type === 'int_input' || q.type === 'pgcd_input') {
        // Réponse = entier (PGCD ou autre)
        container.innerHTML = `
            <div class="bg-${color}-50 rounded-xl p-6 question-box">
                <p class="text-xl mb-6 font-medium">${q.question}</p>
                <div class="flex items-center gap-4 flex-wrap mt-2">
                    <span class="text-gray-600 font-semibold text-lg">${q.type === 'pgcd_input' ? 'PGCD =' : 'Réponse :'}</span>
                    <input type="text" inputmode="numeric" id="answerN" class="border-2 border-${color}-400 rounded px-4 py-2 text-lg w-32 bg-white font-bold" placeholder="?" onfocus="numpadFocus(this.id)" ontouchstart="numpadFocus(this.id)">
                </div>
                ${fracNumpad()}
            </div>`;

    } else if (q.type === 'qcm') {
        container.innerHTML = `
            <div class="bg-${color}-50 rounded-xl p-6 question-box">
                <p class="text-xl mb-5 font-medium">${q.question}</p>
                <div class="space-y-3">
                    ${q.options.map((opt, i) => `
                        <label class="qcm-option-label flex items-center p-4 bg-white rounded-xl cursor-pointer hover:bg-${color}-100 border-2 border-${color}-200 transition">
                            <input type="radio" name="qcm" value="${i}" class="mr-3 w-5 h-5">
                            <span class="text-lg">${opt}</span>
                        </label>`).join('')}
                </div>
            </div>`;
    }
}

// ═══════════════════════════════════════════════════════════════
// VALIDATION
// ═══════════════════════════════════════════════════════════════
function submitAnswer() {
    const q = questions[currentQuestion];
    const feedback = document.getElementById('feedback');
    let isCorrect = false;
    let remark = '';

    if (q.type === 'frac_input') {
        // Pas de simplification automatique : la fraction saisie doit être la forme irréductible
        const user = readFrac('answerN', 'answerD');
        if (user) {
            const res = compareFrac(user, q.answerN, q.answerD);
            isCorrect = res === 'ok';
            if (res === 'equiv') remark = `Ta fraction ${F(user.n, user.d)} est égale au résultat, mais elle n'est pas irréductible : il fallait la simplifier.`;
        }
    } else if (q.type === 'int_input' || q.type === 'pgcd_input') {
        const val = parseInt(document.getElementById('answerN').value, 10);
        isCorrect = (val === q.answer);
    } else if (q.type === 'qcm') {
        const sel = document.querySelector('input[name="qcm"]:checked');
        if (sel) isCorrect = parseInt(sel.value) === q.answer;
        document.querySelectorAll('input[name="qcm"]').forEach(radio => {
            radio.disabled = true;
            const label = radio.closest('.qcm-option-label');
            if (parseInt(radio.value) === q.answer) label.classList.add('opt-correct');
            else if (radio.checked) label.classList.add('opt-wrong');
        });
    }

    if (isCorrect) {
        score++;
        feedback.innerHTML = `<div class="callout-success correct">
            <p class="text-green-800 font-bold text-xl">✓ Correct ! 🎉</p>
            <p class="text-green-700 mt-2">${q.explanation}</p></div>`;
    } else {
        feedback.innerHTML = `<div class="callout-danger">
            <p class="text-red-800 font-bold text-xl">✗ Incorrect</p>
            ${remark ? `<p class="text-red-800 font-semibold mt-2">${remark}</p>` : ''}
            <p class="text-red-700 mt-2">${q.explanation}</p></div>`;
    }

    document.getElementById('score').textContent = score;
    document.getElementById('total').textContent = currentQuestion + 1;
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) showQuestion();
    else showResults();
}

function showResults() {
    SOM.marquer({ note: Math.round(score / questions.length * 20 * 2) / 2 }, 'training-' + currentModule);   // meilleure note sur 20
    const total = questions.length;
    const pct = Math.round(score / total * 100);
    const color = MODULE_THEMES[currentModule].color;
    let msg = '';
    if (pct >= 90) msg = 'Excellent ! Tu maîtrises parfaitement les fractions ! 🏆';
    else if (pct >= 70) msg = 'Très bien ! Continue comme ça ! 👍';
    else if (pct >= 50) msg = 'Pas mal ! Avec un peu plus de travail tu vas y arriver. 💪';
    else msg = 'Continue à t\'entraîner, tu vas progresser ! 📚';
    document.getElementById('questionContainer').innerHTML = `
        <div class="bg-${color}-50 border border-${color}-200 rounded-2xl shadow-lg p-10 text-center">
            <h3 class="text-2xl font-bold text-gray-800 mb-3">Entraînement terminé !</h3>
            <div class="text-6xl font-bold text-${color}-700 mb-2">${score} / ${total}</div>
            <div class="text-xl font-bold text-gray-400 mb-6">${pct}%</div>
            <p class="text-gray-500 mb-8 text-lg">${msg}</p>
            <div class="flex gap-4 justify-center flex-wrap">
                <button onclick="showTraining(${currentModule})" class="bg-${color}-500 hover:bg-${color}-600 text-white px-6 py-3 rounded-lg font-bold">Recommencer</button>
            </div>
        </div>`;
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
}

// ═══════════════════════════════════════════════════════════════
// MODULE 1 — Simplification
// ═══════════════════════════════════════════════════════════════
function generateT1() {
    const qs = [];

    // Paires (num, den, pgcd, simplified)
    const pool = shuffle([
        [6,9,3,{n:2,d:3}], [4,8,4,{n:1,d:2}], [6,10,2,{n:3,d:5}],
        [8,12,4,{n:2,d:3}], [9,15,3,{n:3,d:5}], [10,15,5,{n:2,d:3}],
        [12,16,4,{n:3,d:4}], [14,21,7,{n:2,d:3}], [15,25,5,{n:3,d:5}],
        [18,24,6,{n:3,d:4}], [20,30,10,{n:2,d:3}], [16,24,8,{n:2,d:3}],
        [6,14,2,{n:3,d:7}], [9,12,3,{n:3,d:4}], [10,25,5,{n:2,d:5}],
        [12,18,6,{n:2,d:3}], [15,20,5,{n:3,d:4}], [21,28,7,{n:3,d:4}],
        [24,36,12,{n:2,d:3}], [30,45,15,{n:2,d:3}]
    ]);

    // Q1-10 : Simplifier une fraction → résultat
    for (let i = 0; i < 10; i++) {
        const [n, d, g, s] = pool[i];
        qs.push({
            type: 'frac_input',
            question: `Simplifie la fraction ${F(n,d)} — donne la fraction irréductible :`,
            answerN: s.n, answerD: s.d,
            explanation: `PGCD(${n}, ${d}) = ${g} → ${F(n,d)} = ${F(n+'÷'+g, d+'÷'+g)} = ${F(s.n, s.d)}`
        });
    }

    // Q11-12 : Trouver le PGCD
    const pgcdPool = shuffle([
        [12,18,6], [15,25,5], [8,20,4], [14,21,7], [16,24,8], [9,27,9]
    ]);
    for (let i = 0; i < 2; i++) {
        const [a, b, g] = pgcdPool[i];
        qs.push({
            type: 'pgcd_input',
            question: `Quel est le PGCD de ${a} et ${b} ?`,
            answer: g,
            explanation: `PGCD(${a}, ${b}) = ${g}. Diviseurs de ${a} : ${divisors(a).join(', ')}. Diviseurs de ${b} : ${divisors(b).join(', ')}.`
        });
    }

    // Q13-14 : QCM — fraction irréductible ?
    const qcmPool = shuffle([
        { frac: F(4,6), opts: [F(2,3), F(4,6), F(1,2), F(3,4)], a:0,
          expl: `${F(4,6)} = ${F(2,3)} car PGCD(4,6) = 2.` },
        { frac: F(9,12), opts: [F(3,4), F(9,12), F(6,8), F(1,4)], a:0,
          expl: `${F(9,12)} = ${F(3,4)} car PGCD(9,12) = 3.` },
        { frac: F(15,20), opts: [F(3,4), F(15,20), F(5,6), F(2,3)], a:0,
          expl: `${F(15,20)} = ${F(3,4)} car PGCD(15,20) = 5.` }
    ]);
    for (let i = 0; i < 2; i++) {
        const d = qcmPool[i];
        qs.push({
            type: 'qcm',
            question: `Quelle est la forme irréductible de ${d.frac} ?`,
            options: d.opts, answer: d.a, explanation: d.expl
        });
    }

    // Q15 : QCM — déjà irréductible ?
    qs.push({
        type: 'qcm',
        question: `Laquelle de ces fractions est déjà irréductible ?`,
        options: [F(5,7), F(4,6), F(9,12), F(6,10)],
        answer: 0,
        explanation: `${F(5,7)} est irréductible car PGCD(5,7) = 1. Les autres peuvent être simplifiées.`
    });

    return qs;
}

function divisors(n) {
    const d = [];
    for (let i = 1; i <= n; i++) { if (n % i === 0) d.push(i); }
    return d;
}

// MODULE 2 — Multiplication, inverse, division
// ═══════════════════════════════════════════════════════════════
function generateT2() {
    const qs = [];

    // Q1-5 : Multiplication simple
    const mulPool = shuffle([
        [2,3,4,5], [3,4,2,7], [1,3,2,5], [5,6,3,4], [2,5,3,8],
        [3,7,2,9], [4,5,1,3], [2,3,5,7], [1,4,3,5], [5,8,2,3]
    ]);
    for (let i = 0; i < 5; i++) {
        const [a,b,c,d] = mulPool[i];
        const rn = a*c, rd = b*d;
        const s = simplify(rn, rd);
        qs.push({
            type: 'frac_input',
            question: `Calcule ${F(a,b)} × ${F(c,d)} — donne la réponse sous forme irréductible :`,
            answerN: s.n, answerD: s.d,
            explanation: `${F(a,b)} × ${F(c,d)} = ${F(a+'×'+c, b+'×'+d)} = ${F(rn,rd)}${rn!==s.n||rd!==s.d?' = '+F(s.n,s.d):''}`
        });
    }

    // Q6-8 : Inverse
    const invPool = shuffle([
        [3,4], [2,7], [5,8], [1,3], [4,9], [3,5], [7,2]
    ]);
    for (let i = 0; i < 3; i++) {
        const [a,b] = invPool[i];
        qs.push({
            type: 'frac_input',
            question: `Donne l'inverse de ${F(a,b)} :`,
            answerN: b, answerD: a,
            explanation: `L'inverse de ${F(a,b)} est ${F(b,a)} — on retourne la fraction.`
        });
    }

    // Q9-12 : Division
    const divPool = shuffle([
        [3,4,2,5], [5,6,1,3], [2,3,4,9], [3,5,6,7], [1,2,3,4],
        [4,7,2,3], [5,8,5,4], [3,4,9,8], [2,5,4,3], [7,9,7,3]
    ]);
    for (let i = 0; i < 4; i++) {
        const [a,b,c,d] = divPool[i];
        const rn = a*d, rd = b*c;
        const s = simplify(rn, rd);
        qs.push({
            type: 'frac_input',
            question: `Calcule ${F(a,b)} ÷ ${F(c,d)} — donne la réponse irréductible :`,
            answerN: s.n, answerD: s.d,
            explanation: `${F(a,b)} ÷ ${F(c,d)} = ${F(a,b)} × ${F(d,c)} = ${F(a+'×'+d, b+'×'+c)} = ${F(rn,rd)}${rn!==s.n||rd!==s.d?' = '+F(s.n,s.d):''}`
        });
    }

    // Q13 : QCM — règle de multiplication
    qs.push({
        type: 'qcm',
        question: `Comment calcule-t-on ${F('a','b')} × ${F('c','d')} ?`,
        options: [F('a×c','b×d'), F('a+c','b+d'), F('a×d','b×c'), F('a+c','b×d')],
        answer: 0,
        explanation: `On multiplie numérateur × numérateur et dénominateur × dénominateur : ${F('a','b')} × ${F('c','d')} = ${F('a×c','b×d')}`
    });

    // Q14 : QCM — division
    qs.push({
        type: 'qcm',
        question: `${F(3,4)} ÷ ${F(3,4)} est égal à :`,
        options: ['1', F(9,16), '0', F(3,2)],
        answer: 0,
        explanation: `${F(3,4)} ÷ ${F(3,4)} = ${F(3,4)} × ${F(4,3)} = ${F('3×4','4×3')} = ${F(12,12)} = 1`
    });

    // Q15 : QCM — inverse
    qs.push({
        type: 'qcm',
        question: `Quel est l'inverse de 5 ?`,
        options: [F(1,5), F(5,1)+' (= 5)', '-5', '0'],
        answer: 0,
        explanation: `5 = ${F(5,1)}, donc son inverse est ${F(1,5)}.`
    });

    return qs;
}

// MODULE 3 — Addition/soustraction même dénominateur
// ═══════════════════════════════════════════════════════════════
function generateT3() {
    const qs = [];

    // Additions
    const addPool = shuffle([
        [1,7,3,7], [2,9,4,9], [3,11,5,11], [1,8,5,8],
        [2,13,6,13], [3,10,4,10], [5,12,1,12], [4,15,6,15],
        [1,6,3,6], [2,7,3,7]
    ]);
    for (let i = 0; i < 6; i++) {
        const [a,b,c,d] = addPool[i];
        // b === d (même dénominateur)
        const rn = a + c, rd = b;
        const s = simplify(rn, rd);
        qs.push({
            type: 'frac_input',
            question: `Calcule ${F(a,b)} + ${F(c,d)} — simplifie si possible :`,
            answerN: s.n, answerD: s.d,
            explanation: `${F(a,b)} + ${F(c,d)} = ${F(a+'+'+c, b)} = ${F(rn,rd)}${rn!==s.n||rd!==s.d?' = '+F(s.n,s.d):''}`
        });
    }

    // Soustractions
    const subPool = shuffle([
        [5,7,2,7], [7,9,4,9], [8,11,3,11], [6,8,2,8],
        [9,13,3,13], [7,10,3,10], [11,12,5,12], [9,15,3,15]
    ]);
    for (let i = 0; i < 6; i++) {
        const [a,b,c,d] = subPool[i];
        const rn = a - c, rd = b;
        const s = simplify(rn, rd);
        qs.push({
            type: 'frac_input',
            question: `Calcule ${F(a,b)} − ${F(c,d)} — simplifie si possible :`,
            answerN: s.n, answerD: s.d,
            explanation: `${F(a,b)} − ${F(c,d)} = ${F(a+'−'+c, b)} = ${F(rn,rd)}${rn!==s.n||rd!==s.d?' = '+F(s.n,s.d):''}`
        });
    }

    // Q13 : QCM
    qs.push({
        type: 'qcm',
        question: `Que vaut ${F(5,8)} + ${F(3,8)} ?`,
        options: ['1', F(8,16), F(8,64), F(2,8)],
        answer: 0,
        explanation: `${F(5,8)} + ${F(3,8)} = ${F('5+3',8)} = ${F(8,8)} = 1`
    });

    // Q14 : QCM
    qs.push({
        type: 'qcm',
        question: `Que vaut ${F(7,12)} − ${F(3,12)} ?`,
        options: [F(1,3), F(4,24), F(4,0), F(10,12)],
        answer: 0,
        explanation: `${F(7,12)} − ${F(3,12)} = ${F('7−3',12)} = ${F(4,12)} = ${F(1,3)} (PGCD(4,12) = 4)`
    });

    // Q15 : QCM
    qs.push({
        type: 'qcm',
        question: `Comment calcule-t-on ${F('a','d')} + ${F('b','d')} quand les dénominateurs sont égaux ?`,
        options: [F('a+b','d'), F('a+b','2d'), F('a','b+d'), F('2a','d')],
        answer: 0,
        explanation: `On additionne les numérateurs et on garde le même dénominateur : ${F('a+b','d')}`
    });

    return qs;
}

// MODULE 4 — Addition/soustraction dénominateurs différents
// ═══════════════════════════════════════════════════════════════
function generateT4() {
    const qs = [];

    // Paires avec dénominateurs différents (un est multiple de l'autre)
    const easyPool = shuffle([
        [1,2,1,4], [1,3,1,6], [3,4,1,8], [2,3,1,9],
        [1,2,1,6], [5,6,1,12], [2,5,1,10], [3,4,1,12],
        [1,3,2,9], [5,8,1,16]
    ]);
    // Additions faciles
    for (let i = 0; i < 4; i++) {
        const [a,b,c,d] = easyPool[i];
        const L = lcm(b,d);
        const rn = a*(L/b) + c*(L/d);
        const s = simplify(rn, L);
        qs.push({
            type: 'frac_input',
            question: `Calcule ${F(a,b)} + ${F(c,d)} — simplifie si possible :`,
            answerN: s.n, answerD: s.d,
            explanation: `Dénominateur commun = ${L}.<br>${F(a,b)} = ${F(a*(L/b),L)} et ${F(c,d)} = ${F(c*(L/d),L)}<br>= ${F(rn,L)}${rn!==s.n||L!==s.d?' = '+F(s.n,s.d):''}`
        });
    }

    // Soustractions faciles
    const easySub = shuffle([
        [3,4,1,8], [5,6,1,12], [2,3,1,6], [7,8,1,4], [4,5,1,10]
    ]);
    for (let i = 0; i < 3; i++) {
        const [a,b,c,d] = easySub[i];
        const L = lcm(b,d);
        const rn = a*(L/b) - c*(L/d);
        const s = simplify(rn, L);
        qs.push({
            type: 'frac_input',
            question: `Calcule ${F(a,b)} − ${F(c,d)} — simplifie si possible :`,
            answerN: s.n, answerD: s.d,
            explanation: `Dénominateur commun = ${L}.<br>${F(a,b)} = ${F(a*(L/b),L)} et ${F(c,d)} = ${F(c*(L/d),L)}<br>= ${F(rn,L)}${rn!==s.n||L!==s.d?' = '+F(s.n,s.d):''}`
        });
    }

    // Additions avec PPCM général
    const hardAdd = shuffle([
        [1,3,1,4], [2,3,3,4], [1,4,2,5], [3,5,1,3], [2,5,3,7],
        [1,6,2,5], [3,7,1,4], [2,9,1,6]
    ]);
    for (let i = 0; i < 3; i++) {
        const [a,b,c,d] = hardAdd[i];
        const L = lcm(b,d);
        const rn = a*(L/b) + c*(L/d);
        const s = simplify(rn, L);
        qs.push({
            type: 'frac_input',
            question: `Calcule ${F(a,b)} + ${F(c,d)} — simplifie si possible :`,
            answerN: s.n, answerD: s.d,
            explanation: `PPCM(${b}, ${d}) = ${L}.<br>${F(a,b)} = ${F(a*(L/b),L)} ; ${F(c,d)} = ${F(c*(L/d),L)}<br>= ${F(rn,L)}${rn!==s.n||L!==s.d?' = '+F(s.n,s.d):''}`
        });
    }

    // Soustractions avec PPCM général
    const hardSub = shuffle([
        [3,4,1,3], [5,6,2,5], [3,5,1,4], [7,8,2,3]
    ]);
    for (let i = 0; i < 2; i++) {
        const [a,b,c,d] = hardSub[i];
        const L = lcm(b,d);
        const rn = a*(L/b) - c*(L/d);
        const s = simplify(rn, L);
        qs.push({
            type: 'frac_input',
            question: `Calcule ${F(a,b)} − ${F(c,d)} — simplifie si possible :`,
            answerN: s.n, answerD: s.d,
            explanation: `PPCM(${b}, ${d}) = ${L}.<br>${F(a,b)} = ${F(a*(L/b),L)} ; ${F(c,d)} = ${F(c*(L/d),L)}<br>= ${F(rn,L)}${rn!==s.n||L!==s.d?' = '+F(s.n,s.d):''}`
        });
    }

    // Q14 QCM
    qs.push({
        type: 'qcm',
        question: `Pour calculer ${F(1,3)} + ${F(1,4)}, quel dénominateur commun utilise-t-on ?`,
        options: ['12', '7', '3', '4'],
        answer: 0,
        explanation: `PPCM(3, 4) = 12. On convertit : ${F(1,3)} = ${F(4,12)} et ${F(1,4)} = ${F(3,12)}, donc ${F(4,12)} + ${F(3,12)} = ${F(7,12)}.`
    });

    // Q15 QCM
    qs.push({
        type: 'qcm',
        question: `Que vaut ${F(1,2)} + ${F(1,3)} ?`,
        options: [F(5,6), F(2,5), F(1,6), F(2,6)],
        answer: 0,
        explanation: `PPCM(2,3) = 6. ${F(1,2)} = ${F(3,6)}, ${F(1,3)} = ${F(2,6)}. Donc ${F(3,6)} + ${F(2,6)} = ${F(5,6)}.`
    });

    return qs;
}

        { q:`${F(5,7)} ÷ ${F(10,14)}`, an:1, ad:1, expl:`${F(5,7)} ÷ ${F(10,14)} = ${F(5,7)} × ${F(14,10)} = ${F(70,70)} = 1` },
        { q:`${F(4,5)} × ${F(15,8)}`, an:3, ad:2, expl:`${F(4,5)} × ${F(15,8)} = ${F(60,40)} = ${F(3,2)}` }

    for (let i = 0; i < 4; i++) {

        qs.push({ type:'frac_input', question:`Calcule ${d.q} — simplifie :`, answerN:d.an, answerD:d.ad, explanation:d.expl });

    // 3 additions même dénominateur
    const s3Pool = shuffle([
        [3,8,5,8], [4,11,5,11], [7,15,4,15]
    ]);
    for (let i = 0; i < 3; i++) {
        const [a,b,c,d] = s3Pool[i];
        const rn = a+c, rd = b;
        const s = simplify(rn,rd);
        qs.push({ type:'frac_input', question:`Calcule ${F(a,b)} + ${F(c,d)} :`, answerN:s.n, answerD:s.d,
            explanation:`${F(a,b)} + ${F(c,d)} = ${F(rn,rd)}${rn!==s.n?' = '+F(s.n,s.d):''}` });
    }

    // 3 additions/soustractions dénominateurs différents
    const s4Pool = shuffle([
        { a:1,b:3,c:1,d:4, op:'+' }, { a:5,b:6,c:1,d:4, op:'-' },
        { a:2,b:5,c:1,d:3, op:'+' }, { a:3,b:4,c:2,d:6, op:'-' }
    ]);
    for (let i = 0; i < 3; i++) {
        const {a,b,c,d,op} = s4Pool[i];
        const L = lcm(b,d);
        const rn = op==='+' ? a*(L/b)+c*(L/d) : a*(L/b)-c*(L/d);
        const s = simplify(rn,L);
        qs.push({ type:'frac_input', question:`Calcule ${F(a,b)} ${op} ${F(c,d)} — simplifie :`, answerN:s.n, answerD:s.d,
            explanation:`PPCM(${b},${d})=${L}. ${F(a*(L/b),L)} ${op} ${F(c*(L/d),L)} = ${F(rn,L)}${rn!==s.n?' = '+F(s.n,s.d):''}` });
    }

    // 3 QCM variés
    qs.push({
        type:'qcm',
        question:`Quelle opération permet de diviser ${F('a','b')} par ${F('c','d')} ?`,
        options:[`Multiplier ${F('a','b')} par ${F('d','c')}`, `Multiplier ${F('a','b')} par ${F('c','d')}`,
                 `Additionner numérateurs et dénominateurs`, `Soustraire les dénominateurs`],
        answer:0, explanation:`Diviser par une fraction revient à multiplier par son inverse : ${F('a','b')} ÷ ${F('c','d')} = ${F('a','b')} × ${F('d','c')}`
    });
    qs.push({
        type:'qcm',
        question:`Laquelle de ces fractions est égale à ${F(6,9)} ?`,
        options:[F(2,3), F(3,6), F(9,6), F(4,9)],
        answer:0, explanation:`${F(6,9)} = ${F(2,3)} car PGCD(6,9) = 3.`
    });
    qs.push({
        type:'qcm',

    });

    // 2 questions inverses
    const invP = shuffle([[7,3],[5,4],[9,2]]);
    for (let i = 0; i < 2; i++) {
        const [a,b] = invP[i];
        qs.push({ type:'frac_input', question:`Donne l'inverse de ${F(a,b)} :`, answerN:b, answerD:a,
            explanation:`L'inverse de ${F(a,b)} est ${F(b,a)}.` });
    }

    return shuffle(qs).slice(0, 20);
}

// HELPERS
// ═══════════════════════════════════════════════════════════════
// Mélange les propositions d'un QCM et met à jour l'indice de la bonne réponse
function shuffleQcm(q) {
    if (q.type !== 'qcm') return q;
    const order = shuffle(q.options.map((_, i) => i));
    return { ...q, options: order.map(i => q.options[i]), answer: order.indexOf(q.answer) };
}
function rnd(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}
