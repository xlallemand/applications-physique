<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 : fiche récapitulative — Puissance active</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="pa.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<script src="../../assets/sommaire.js"></script>
<script src="pa.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page som-fiche" id="fiche"></div>

<script>
/* ============================================================
   Fiche récapitulative du module 1 : valeurs efficaces, puissance et énergie.
   ============================================================ */
document.getElementById('fiche').innerHTML = `
  <div class="er-card">
    <span class="er-badge">MODULE 1 · FICHE RÉCAPITULATIVE</span>
    <h2 class="er-titre">La valeur efficace</h2>
  </div>

  <section class="er-card">
    <h3 class="cours-titre">Valeurs efficaces</h3>
    <div class="cle"><p>Pour une tension et une intensité <b>sinusoïdales</b> :</p>
      <p class="som-formule">U<sub>eff</sub> = U<sub>max</sub> / √2 &nbsp;;&nbsp; I<sub>eff</sub> = I<sub>max</sub> / √2</p></div>
    <p>La valeur efficace est la valeur de la grandeur <b>continue</b> qui fournirait la <b>même puissance</b> au même appareil. C'est elle qu'indiquent les appareils (230 V) et que mesurent voltmètre et ampèremètre en mode alternatif (AC).</p>
    <p class="er-petit">Exemple : sur le secteur, U<sub>eff</sub> = 230 V, donc U<sub>max</sub> = 230 × √2 ≈ 325 V.</p>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Puissance d'un appareil résistif</h3>
    <div class="cle"><p>La puissance instantanée p = u × i varie entre 0 et U<sub>max</sub> × I<sub>max</sub>. La puissance moyenne reçue vaut la moitié du maximum :</p>
      <p class="som-formule">P = U<sub>max</sub> × I<sub>max</sub> / 2 = U<sub>eff</sub> × I<sub>eff</sub></p></div>
    <div class="cle"><p><b class="cle-titre">Énergie.</b> L'énergie reçue pendant Δt est l'aire sous la courbe p(t) :</p>
      <p class="som-formule">E = P × Δt</p>
      <p>E en joules (J), P en watts (W), Δt en secondes (s).</p></div>
  </section>

  <div class="er-actions som-fiche-liens">
    <a class="btn-secondary" href="module_1.html">Revoir l'activité</a>
  </div>`;
PA.menu('fiche_1');
</script>
</body>
</html>
