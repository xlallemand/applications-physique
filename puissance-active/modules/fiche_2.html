<body>
<div id="app-nav"></div>
<div class="er-page som-fiche" id="fiche"></div>

<script>
/* ============================================================
   Fiche récapitulative du module 2 : déphasage, puissance active, facteur de puissance.
   ============================================================ */
document.getElementById('fiche').innerHTML = `
  <div class="er-card">
    <span class="er-badge">MODULE 2 · FICHE RÉCAPITULATIVE</span>
    <h2 class="er-titre">Comprendre la puissance active</h2>
  </div>

  <section class="er-card">
    <h3 class="cours-titre">Déphasage</h3>
    <div class="cle"><p>Le décalage entre i et u se mesure par l'angle <b>φ</b>. Une période complète correspond à 360°, soit <b>2π rad</b> : un décalage de T/8 correspond à φ = 2π/8 = π/4 rad (45°).</p></div>
    <div class="cle"><p><b class="cle-titre">Puissance instantanée négative.</b> Quand i est déphasé par rapport à u, p = u × i est parfois négative : l'appareil <b>restitue</b> au réseau une partie de l'énergie reçue (stockée dans une bobine ou un condensateur).</p></div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Puissance active et facteur de puissance</h3>
    <div class="cle"><p>Puissance moyenne réellement consommée, en watts (W) :</p>
      <p class="som-formule">P = U<sub>eff</sub> × I<sub>eff</sub> × cos φ</p>
      <p>Facteur de puissance : <b>k = P / (U<sub>eff</sub> × I<sub>eff</sub>) = cos φ</b>. À U<sub>eff</sub> et I<sub>eff</sub> donnés, P diminue quand le déphasage augmente.</p></div>
    <div class="cle"><p><b class="cle-titre">Conséquence.</b> Pour consommer sa puissance P sous la tension du réseau, l'appareil demande un courant :</p>
      <p class="som-formule">I<sub>eff</sub> = P / (U<sub>eff</sub> × cos φ)</p>
      <p>Plus le déphasage est grand, plus I<sub>eff</sub> est grand et plus les <b>pertes par effet Joule</b> dans les câbles (r × I<sub>eff</sub><sup>2</sup>) augmentent : on cherche un facteur de puissance proche de 1.</p></div>
  </section>

  <div class="er-actions som-fiche-liens">
    <a class="btn-secondary" href="module_2.html">Revoir l'activité</a>
  </div>`;
PA.menu('fiche_2');
</script>
</body>
</html>
