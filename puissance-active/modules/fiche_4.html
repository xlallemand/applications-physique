<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="../../assets/theme.css">

<body>
<div id="app-nav"></div>
<div class="er-page som-fiche" id="fiche"></div>

<script>
/* ============================================================
   Fiche récapitulative du module 4 : schéma de conversion, relations entre les puissances.
   ============================================================ */
document.getElementById('fiche').innerHTML = `
  <div class="er-card">
    <span class="er-badge">MODULE 4 · FICHE RÉCAPITULATIVE</span>
    <h2 class="er-titre">La puissance active en exercices</h2>
  </div>

  <section class="er-card">
    <h3 class="cours-titre">Le schéma de conversion d'énergie</h3>
    ${PA.schema(PA.SCHEMA_COURS)}
    <ul class="er-liste">
      <li>avant le compteur, côté réseau : la <b>puissance apparente S</b> ;</li>
      <li>entre le compteur et l'appareil : la <b>puissance active P</b>, reçue par l'appareil et facturée ;</li>
      <li>à la sortie de l'appareil : la <b>puissance utile P<sub>u</sub></b> et la <b>puissance perdue P<sub>perdue</sub></b> ; η est le rendement.</li>
    </ul>
    <div class="cle"><p><b class="cle-titre">Méthode.</b> Toujours faire le schéma de conversion et y placer les données de l'énoncé.</p></div>
    <div class="cle"><p><b class="cle-titre">Sur les appareils</b>, la puissance indiquée est la puissance active P ; la tension et l'intensité sont des valeurs efficaces (même si ce n'est pas écrit).</p></div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Relations</h3>
    <div class="cle">
      <p class="som-formule">S = U<sub>eff</sub> × I<sub>eff</sub> &nbsp;;&nbsp; P = U<sub>eff</sub> × I<sub>eff</sub> × cos φ</p>
      <p class="som-formule">k = cos φ = P / S &nbsp;;&nbsp; P = S × k</p>
      <p class="som-formule">P<sub>u</sub> = η × P &nbsp;;&nbsp; P<sub>perdue</sub> = P − P<sub>u</sub></p>
      <p>P, P<sub>u</sub>, P<sub>perdue</sub> en W ; S en VA (ou W) ; k et η sans unité.</p></div>
  </section>

  <div class="er-actions som-fiche-liens">
    <a class="btn-secondary" href="module_4_cours.html">Revoir le cours</a>
    <a class="btn-secondary" href="module_4_exercices.html">Exercices d'application</a>
  </div>`;
PA.menu('fiche_4');
</script>
</body>
</html>
