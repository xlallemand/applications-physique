<title>Module 5 : isoler t avec ln — Chapitre 12 : Radioactivité</title>
<link rel="stylesheet" href="../../assets/theme.css">

<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 5 · COURS 2 / 3</span>
    <h2 class="er-titre">Isoler t avec ln</h2>
    <p class="er-contexte">Pour calculer la date t quand on connaît N, il faut <b>isoler t</b> dans N<sub>0</sub> e<sup>−λt</sup> = N. C'est la <b>même méthode que pour le pH</b> : la fonction <b>ln</b> annule e<sup>x</sup>, comme log annule 10<sup>x</sup>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Même dispositif que le cours du module 2 de l'application « pH »
   (étapes 4 et 5) : démonstration étape par étape (PH.demo), puis
   l'élève refait la manipulation dans l'éditeur d'équation par
   glisser-déposer (PH.Editeur de ph/modules/eq.js, avec les outils
   eˣ et ln).
   1. ln, fonction réciproque de eˣ (comme log et 10ˣ)
   2. N₀ e^(−λt) = N  ⇒  e^(−λt) = N/N₀  ⇒  −λt = ln(N/N₀)  ⇒  t = ln(N/N₀)/(−λ)
   3. La même manipulation avec A₀ e^(−λt) = A
   ============================================================ */
const { exemple } = COURS;
const { o, fmt } = RAD;
const M = RAD.MOINS;
const { T, S, P, F, FN } = PH.EQ;

// « Afficher tout le cours » : la démonstration PH.demo se déplie avec le moteur de cours commun
PH.vivant = COURS.vivant;
PH.oublier = COURS.oublier;
Object.defineProperty(PH, 'tout', { get: () => COURS.tout, configurable: true });

// grandeurs (N ou A), constante radioactive et date
const grandeurs = s => ({ x: T(s, s), x0: T(s + '0', `${s}<sub>0</sub>`), l: T('l', 'λ'), t: T('t', 't') });
const G = { N: grandeurs('N'), A: grandeurs('A') };
const expo = g => FN('exp', P(S(g.l, g.t), true));                  // e^(−λt)
const frac = g => F(S(g.x), S(g.x0));                                // N / N₀
// valeurs de test : N₀, λ et t varient, N s'en déduit
function valeurs(s) {
  return () => {
    const x0 = 100 + Math.random() * 9900, l = .01 + Math.random() * .5, t = 1 + Math.random() * 20;
    return { [s + '0']: x0, l, t, [s]: x0 * Math.exp(-l * t) };
  };
}
// étapes de la démonstration (comme le cours : N₀ e^(−λt) = N → t = ln(N/N₀) / (−λ))
function etapesDemo(s) {
  const g = G[s], n0 = `${s}<sub>0</sub>`;
  return [
    { L: P([S(g.x0), expo(g)]), R: P(S(g.x)) },
    { op: `÷ ${n0}`, L: P([expo(g)]), R: P([frac(g)]), texte: `On divise les deux membres par ${n0} : ${n0}, qui multipliait e<sup>${M}λt</sup>, passe de l'autre côté en divisant.` },
    { op: 'ln', L: P([FN('ln', P([expo(g)]))]), R: P([FN('ln', P([frac(g)]))]), texte: 'On applique aux deux membres la fonction ln, réciproque de e<sup>x</sup>.' },
    { centre: 'car ln(e<sup>a</sup>) = a', L: P(S(g.l, g.t), true), R: P([FN('ln', P([frac(g)]))]), texte: 'ln annule e<sup>x</sup>.' },
    { op: `÷ (${M}λ)`, L: P(S(g.t)), R: P([F(P([FN('ln', P([frac(g)]))]), P(S(g.l), true))]), final: true, texte: `On divise les deux membres par (${M}λ) : ${M}λ, qui multipliait t, passe de l'autre côté en divisant.` },
  ];
}
const MODE_EMPLOI = `<p class="eq-consigne"><b>Comment faire :</b> glisse un outil (×(−1), e<sup>x</sup>, ln) sur <b>un membre</b> de l'équation, puis sur l'autre membre : une opération se fait toujours des deux côtés. Glisse la barre de fraction ··· / ··· sur une case pour créer une fraction. Glisse une grandeur pour la déplacer, touche-la pour la supprimer. Un dénominateur se glisse de l'autre côté du signe =. ⇄ inverse les deux membres. Après chaque étape : « Vérifier l'étape ».</p>`;
const GAGNER = '<p class="eq-consigne"><b>Pour gagner du temps</b>, tu peux faire plusieurs manipulations à la suite, puis cliquer une seule fois sur « Vérifier l\'étape ».</p>';
const LIEN_PH = `<div class="ph-lien-app"><p>La même méthode avec log et 10<sup>x</sup> : la définition du pH.</p>
  <span class="er-actions" style="margin:0"><a class="btn-small" href="../../ph/modules/module_2_cours.html" target="_blank" rel="noopener">pH : isoler [H<sub>3</sub>O<sup>+</sup>] ↗</a>
  <a class="btn-small" href="../../equations-en-physique/modules/module_8.html" target="_blank" rel="noopener">Les fonctions réciproques ↗</a></span></div>`;

// éditeur d'équation : partie 'perso' d'un « À toi » (réussi quand t est isolé)
function partieEditeur(s) {
  const g = G[s], n0 = `${s}<sub>0</sub>`;
  return { type: 'perso', solution: `t = ${M}ln(${s}/${n0}) / λ, c'est la même chose que t = ln(${s}/${n0}) / (${M}λ).`,
    monter(zone, api) {
      const d = document.createElement('div');
      zone.appendChild(d);
      const ed = new PH.Editeur(d, {
        tuiles: [g.x, g.x0, g.l, g.t], cible: 't', outils: ['neg', 'exp', 'ln', 'frac'], valeurs: valeurs(s),
        gauche: () => P([S(g.x0), expo(g)]), droite: () => P(S(g.x)),
        aides: [
          `${n0} multiplie e<sup>${M}λt</sup> : glisse-le de l'autre côté, il divisera. Glisse d'abord la barre de fraction sur ${s}, puis ${n0} dans le dénominateur.`,
          'Applique ln, la réciproque de e<sup>x</sup>, aux deux membres : glisse l\'outil ln sur le membre de gauche, puis sur celui de droite.',
          'λ multiplie t : glisse la barre de fraction sur le membre de droite, puis glisse λ dans le dénominateur.',
          'Il reste un signe − devant t : glisse l\'outil ×(−1) sur les deux membres.',
        ],
        solution: etapesDemo(s),
        onErreur: () => api.compterErreur(),
        onResolu: () => api.reussi(),
      });
      return { montrer() { ed.montrerSolution(); } };
    } };
}

/* ---------- 1. ln, réciproque de eˣ ---------- */
function etape1(c) {
  const carte = c.carte('1. La fonction ln, réciproque de e<sup>x</sup>');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Pour le pH, on isolait [H<sub>3</sub>O<sup>+</sup>] en appliquant 10<sup>x</sup>, la fonction réciproque de log. Ici, la grandeur cherchée t est dans l'exposant de e : on applique la fonction réciproque de e<sup>x</sup>, le <b>logarithme népérien ln</b> (touche <b>ln</b> de la calculatrice).</p>
      <div class="cle"><p class="crs-formule">ln(e<sup>a</sup>) = a &nbsp; et &nbsp; e<sup>ln a</sup> = a</p>
        <p>ln annule e<sup>x</sup> (et e<sup>x</sup> annule ln), comme log annule 10<sup>x</sup>.</p></div>
      ${LIEN_PH}
    </div>
    ${exemple(`<p class="crs-calc">e<sup>x</sup> = 0,50 &nbsp;donne&nbsp; x = ln(0,50) ≈ <span class="c">${M}0,693</span></p>`)}`);
  c.aToi(carte, [
    { parties: [{ type: 'choix', q: 'Quelle fonction annule e<sup>x</sup> ?', melanger: false,
      options: [o('ln', 'ln'), o('log', 'log'), o('exp', 'e<sup>x</sup>'), o('p10', '10<sup>x</sup>')], bonne: 'ln',
      indices: { log: 'log annule 10<sup>x</sup> (pH). Pour e<sup>x</sup>, c\'est le logarithme népérien.', exp: 'Appliquer e<sup>x</sup> à une exponentielle ne l\'annule pas : il faut sa fonction réciproque.', p10: '10<sup>x</sup> annule log, pas e<sup>x</sup>.' },
      solution: 'ln, le logarithme népérien : ln(e<sup>a</sup>) = a.' }] },
    { parties: [{ type: 'nombre', q: 'e<sup>x</sup> = 0,25. Calcule x (3 chiffres significatifs).', label: 'x =', valeur: Math.log(.25), rel: .005,
      diag: v => (Math.abs(v - Math.log10(.25)) < .005 ? 'Tu as utilisé log : c\'est ln (logarithme népérien) qui annule e<sup>x</sup>.' : Math.abs(v - Math.exp(.25)) < .005 ? 'e<sup>0,25</sup> : il faut la réciproque, ln.' : Math.abs(v + Math.log(.25)) < .005 ? 'Attention au signe : ln d\'un nombre inférieur à 1 est négatif.' : 'x = ln(0,25) : touche ln.'),
      solution: `x = ln(0,25) ≈ ${M}1,39.` }] },
  ]);
  return carte;
}

/* ---------- 2. Isoler t (démonstration, puis éditeur) ---------- */
function etape2(c) {
  const carte = c.carte('2. Isoler t dans N<sub>0</sub> e<sup>−λt</sup> = N');
  c.ajouter(carte, `<div class="cours-bloc"><p>On connaît N<sub>0</sub>, λ et N : il faut isoler t, avec <b>la même opération sur les deux membres</b> à chaque étape.</p></div>
    <p class="er-consigne">Suis la démonstration, étape par étape.</p>`);
  const zone = c.ajouter(carte, '');
  PH.demo(zone, {
    etapes: etapesDemo('N'),
    onFini: () => {
      c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Pour calculer t quand on connaît N :</b></p>
          <p class="crs-formule">t = ${RAD.fr('ln(N / N<sub>0</sub>)', `${M}λ`)}</p></div>
        <p class="rad-complete"><b>✍ Complète ton cours :</b> N<sub>0</sub> e<sup>${M}λt</sup> = N ⇔ e<sup>${M}λt</sup> = N/N<sub>0</sub> ⇔ ${M}λt = ln(N/N<sub>0</sub>) ⇔ t = ln(N/N<sub>0</sub>) / (${M}λ).</p>`);
      c.aToi(carte, [{ titre: 'Refais la manipulation', enonce: `<p class="er-consigne">Isole t dans N<sub>0</sub> e<sup>${M}λt</sup> = N.</p>${MODE_EMPLOI}${GAGNER}`, parties: [partieEditeur('N')] }]);
    },
  });
  return carte;
}

/* ---------- 3. La même chose avec l'activité ---------- */
function etape3(c) {
  const carte = c.carte('3. La même manipulation avec l\'activité');
  c.ajouter(carte, `<div class="cours-bloc"><p>L'activité suit la même loi : A<sub>0</sub> e<sup>${M}λt</sup> = A. Les étapes sont les mêmes, avec A et A<sub>0</sub> à la place de N et N<sub>0</sub>.</p></div>`);
  c.aToi(carte, [{ titre: 'Avec l\'activité', enonce: `<p class="er-consigne">Isole t dans A<sub>0</sub> e<sup>${M}λt</sup> = A.</p>${GAGNER}`, parties: [partieEditeur('A')] }], 'Ce qu\'il faut retenir →');
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Fonctions réciproques.</b> ln annule e<sup>x</sup> : ln(e<sup>a</sup>) = a (comme log annule 10<sup>x</sup>).</p></div>
    <div class="cle"><p><b class="cle-titre">Isoler t.</b> N<sub>0</sub> e<sup>${M}λt</sup> = N ⇔ e<sup>${M}λt</sup> = N/N<sub>0</sub> ⇔ ${M}λt = ln(N/N<sub>0</sub>) ⇔ <b>t = ln(N/N<sub>0</sub>) / (${M}λ)</b>.</p>
      <p>De même avec l'activité : t = ln(A/A<sub>0</sub>) / (${M}λ).</p></div>
    <div class="er-actions">
      <a class="btn-primary" style="text-decoration:none" href="module_5c_cours.html">Cours : calculer t →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_5.html#isoler">Fiche récapitulative</a>
    </div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
RAD.menu('module_5b_cours');
</script>
