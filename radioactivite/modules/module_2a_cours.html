<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : les trois types de radioactivité — Chapitre 12 : Radioactivité</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="rad.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="rad.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS 1 / 2</span>
    <h2 class="er-titre">Les trois types de radioactivité</h2>
    <p class="er-contexte">Un noyau radioactif se désintègre en émettant une particule : un <b>noyau d'hélium</b> (α), un <b>électron</b> (β<sup>−</sup>) ou un <b>positron</b> (β<sup>+</sup>). Tu vas apprendre ce tableau par cœur et reconnaître la particule dans une équation.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Les trois types : α (⁴₂He), β⁻ (⁰₋₁e), β⁺ (⁰₁e), avec les
      exemples du cours (U 235, C 14, O 15)
   2. Reconnaître la particule dans une équation : He → α ;
      e et −1 → électron (β⁻) ; e et +1 → positron (β⁺)
   ============================================================ */
const { exemple } = COURS;
const { o, nuc, n, equation, PARTICULES } = RAD;
const L = h => `<span class="rad-lisible">${h}</span>`;
const P = PARTICULES;
const EX = {
  alpha: equation([n(235, 92)], [n(4, 2, 'He'), n(231, 90)]),
  moins: equation([n(14, 6)], [n(0, -1, 'e'), n(14, 7)]),
  plus: equation([n(15, 8)], [n(0, 1, 'e'), n(15, 7)]),
};
const TYPES = [o('alpha', 'α'), o('moins', 'β<sup>−</sup>'), o('plus', 'β<sup>+</sup>')];

/* ---------- 1. Les trois types ---------- */
function etape1(c) {
  const carte = c.carte('1. Les trois types de radioactivité');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Il y a <b>trois types</b> de radioactivité, selon la particule émise.</p>
      <div class="cle"><p><b class="cle-titre">À connaître par cœur.</b></p>
        <div class="crs-defile"><table class="crs-tab rad-tab">
          <tr><th>Type</th><th>Particule émise</th><th>Symbole</th><th>Exemple</th></tr>
          <tr><td><b>α</b></td><td>noyau d'hélium</td><td>${nuc(4, 2, 'He')}</td><td>${EX.alpha}</td></tr>
          <tr><td><b>β<sup>−</sup></b></td><td>électron</td><td>${nuc(0, -1, 'e')}</td><td>${EX.moins}</td></tr>
          <tr><td><b>β<sup>+</sup></b></td><td>positron (ou positon)</td><td>${nuc(0, 1, 'e')}</td><td>${EX.plus}</td></tr>
        </table></div></div>
    </div>
    ${exemple(`<p>Le carbone 14 est radioactif β<sup>−</sup> : en se désintégrant, il émet un <b>électron</b> ${L(nuc(0, -1, 'e'))} et devient un noyau d'azote 14.</p>`)}`);
  const particule = (type, titre) => ({ titre, parties: [{ type: 'choix', q: `Radioactivité ${P[type].type} : quelle particule est émise ?`, melanger: false,
    options: [o('alpha', 'un noyau d\'hélium'), o('moins', 'un électron'), o('plus', 'un positron')], bonne: type,
    indices: { alpha: 'Le noyau d\'hélium, c\'est la radioactivité α.', moins: 'L\'électron, de charge négative, c\'est β<sup>−</sup> (le signe −).', plus: 'Le positron, de charge positive, c\'est β<sup>+</sup> (le signe +).' },
    solution: `${P[type].type} : ${P[type].nom}, ${L(nuc(P[type].A, P[type].Z, P[type].s))}.` }] });
  c.aToi(carte, [
    particule('moins', 'Quelle particule ?'),
    particule('alpha'),
    particule('plus'),
    { titre: 'Quel symbole ?', parties: [{ type: 'choix', q: 'Quel est le symbole du positron ?',
      options: [o('ok', L(nuc(0, 1, 'e'))), o('em', L(nuc(0, -1, 'e'))), o('he', L(nuc(4, 2, 'He')))], bonne: 'ok',
      indices: { em: 'Z = −1 : c\'est l\'électron, de charge négative. Le positron a une charge positive.', he: 'C\'est le noyau d\'hélium, la particule α.' },
      solution: `Le positron : ${L(nuc(0, 1, 'e'))} (A = 0, Z = +1).` }] },
  ]);
  return carte;
}

/* ---------- 2. Reconnaître la particule dans une équation ---------- */
function etape2(c) {
  const carte = c.carte('2. Reconnaître la particule dans une équation');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Méthode.</b> Dans l'équation de désintégration, cherche la particule émise :</p>
        <ul class="er-liste"><li><b>He</b> : noyau d'hélium, radioactivité <b>α</b> ;</li>
          <li><b>e</b> avec <b>−1</b> en bas : électron, radioactivité <b>β<sup>−</sup></b> ;</li>
          <li><b>e</b> avec <b>+1</b> en bas : positron, radioactivité <b>β<sup>+</sup></b>.</li></ul></div>
    </div>
    ${exemple(`<p class="crs-calc rad-lisible">${EX.alpha}</p><p>On trouve He : un noyau d'hélium est émis, c'est une radioactivité <b>α</b>.</p>
      <p class="crs-calc rad-lisible">${EX.plus}</p><p>On trouve e avec +1 en bas : un positron est émis, c'est une radioactivité <b>β<sup>+</sup></b>.</p>`)}`);
  const quel = (eq, type, titre) => ({ titre, enonce: `<p class="crs-calc rad-lisible">${eq}</p>`, parties: [{ type: 'choix', q: 'Quel est le type de radioactivité ?', melanger: false,
    options: TYPES, bonne: type,
    indices: { alpha: 'Pour α, on trouve He (noyau d\'hélium) dans l\'équation.', moins: 'Pour β<sup>−</sup>, on trouve e avec −1 en bas (électron).', plus: 'Pour β<sup>+</sup>, on trouve e avec +1 en bas (positron).' },
    solution: { alpha: 'He : noyau d\'hélium émis, radioactivité α.', moins: 'e et −1 : électron émis, radioactivité β<sup>−</sup>.', plus: 'e et +1 : positron émis, radioactivité β<sup>+</sup>.' }[type] }] });
  c.aToi(carte, [
    quel(EX.moins, 'moins', 'Quel type ?'),
    quel(equation([n(226, 88)], [n(222, 86), n(4, 2, 'He')]), 'alpha'),
    quel(equation([n(53, 27)], [n(53, 26), n(0, 1, 'e')]), 'plus'),
    quel(equation([n(32, 15)], [n(32, 16), n(0, -1, 'e')]), 'moins'),
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">α</b> : noyau d'hélium ${L(nuc(4, 2, 'He'))} ; <b class="cle-titre">β<sup>−</sup></b> : électron ${L(nuc(0, -1, 'e'))} ; <b class="cle-titre">β<sup>+</sup></b> : positron ${L(nuc(0, 1, 'e'))}.</p></div>
    <div class="cle"><p><b class="cle-titre">Dans une équation</b>, la particule donne le type : He → α ; e et −1 → β<sup>−</sup> ; e et +1 → β<sup>+</sup>.</p></div>
    <div class="er-actions">
      <a class="btn-primary" style="text-decoration:none" href="module_2b_cours.html">Cours : équations de désintégration →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html#types">Fiche récapitulative</a>
    </div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
RAD.menu('module_2a_cours');
</script>
</body>
</html>
