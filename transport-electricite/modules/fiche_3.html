<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : fiche récapitulative — Transport de l'électricité</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="te.css">
<script src="te.js"></script>
<script src="schemas.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page te-fiche" id="fiche"></div>

<script>
/* ============================================================
   Fiche récapitulative du module 3 : effets du courant, protection
   des biens et des personnes, tableau électrique.
   ============================================================ */
document.getElementById('fiche').innerHTML = `
  <div class="er-card">
    <span class="er-badge">MODULE 3 · FICHE RÉCAPITULATIVE</span>
    <h2 class="er-titre">Le risque électrique</h2>
  </div>

  <section class="er-card">
    <h3 class="cours-titre">Le courant et le corps humain</h3>
    <div class="cle"><p>C'est l'<b>intensité</b> du courant qui traverse le corps (et la durée) qui est dangereuse. Le corps se comporte comme un conducteur ohmique : I = U / R, avec R ≈ 1 kΩ sous 230 V (peau sèche).</p></div>
    <div class="te-defile"><table class="te-tab">
      <tr><th>Intensité</th><th>Effet</th></tr>
      <tr><td>0,5 mA</td><td>sensation très faible</td></tr>
      <tr><td>10 mA</td><td>seuil de non-lâcher</td></tr>
      <tr><td>30 mA (3 min)</td><td>paralysie respiratoire</td></tr>
      <tr><td>40 mA (3 s) ou 50 mA (1 s)</td><td>fibrillation cardiaque irréversible</td></tr>
      <tr><td>1 A</td><td>arrêt du cœur</td></tr>
    </table></div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Protection des biens</h3>
    <div class="cle"><p><b class="cle-titre">Disjoncteurs (ou fusibles).</b> Ils coupent si l'intensité dépasse leur calibre (surintensité) : les fils ne chauffent pas trop, pas d'incendie. Le calibre est adapté à la section des fils : 10 A (1,5 mm<sup>2</sup>, éclairage), 16 A (2,5 mm<sup>2</sup>, prises), 32 A (6 mm<sup>2</sup>, plaques de cuisson).</p>
      <p>Appareils en dérivation (multiprise) : les intensités s'additionnent.</p></div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Protection des personnes</h3>
    <div class="cle"><ul class="er-liste">
      <li>Relier les appareils à la <b>terre</b> (fil vert-jaune) : le courant de fuite passe par le fil de terre.</li>
      <li>Utiliser des <b>disjoncteurs différentiels 30 mA</b> : ils comparent le courant entrant (phase) et le courant sortant (neutre) et coupent s'ils repèrent une fuite d'au moins 30 mA.</li>
    </ul></div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Le tableau électrique</h3>
    <div class="cle"><p>En tête de chaque rangée, un <b>interrupteur différentiel 30 mA</b> (protection des personnes) ; à la suite, un <b>disjoncteur</b> par circuit (protection des biens).</p></div>
    ${SCH.tableau({ reperes: true })}
  </section>

  <div class="er-actions te-fiche-liens">
    <a class="btn-secondary" style="text-decoration:none" href="module_3_cours.html">Revoir le cours</a>
    <a class="btn-secondary" style="text-decoration:none" href="module_3_questions.html">Questions sur le risque électrique</a>
  </div>`;
TE.menu('fiche_3');
</script>
</body>
</html>
