<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 : fiche récapitulative — Transport de l'électricité</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="te.css">
<script src="te.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page te-fiche" id="fiche"></div>

<script>
/* ============================================================
   Fiche récapitulative du module 1 : effet Joule, intérêt d'une
   tension élevée, facteur de puissance.
   ============================================================ */
const fr = TE.fr;
document.getElementById('fiche').innerHTML = `
  <div class="er-card">
    <span class="er-badge">MODULE 1 · FICHE RÉCAPITULATIVE</span>
    <h2 class="er-titre">Les pertes par effet Joule</h2>
  </div>

  <section class="er-card">
    <h3 class="cours-titre">L'effet Joule dans les lignes</h3>
    <div class="cle"><p><b class="cle-titre">Puissance perdue</b> (convertie en énergie thermique) dans un câble de résistance R parcouru par un courant d'intensité I :</p>
      <p class="ph-formule grand">P<sub>J</sub> = R × I<sup>2</sup></p>
      <p>R en ohms (Ω) ; I en ampères (A) ; P<sub>J</sub> en watts (W).</p></div>
    <div class="cle"><p><b class="cle-titre">Intensité au carré.</b> Intensité × n → pertes × n<sup>2</sup> ; intensité ÷ n → pertes ÷ n<sup>2</sup>.</p></div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Réduire les pertes : augmenter la tension</h3>
    <div class="cle"><p>Pour une même puissance P transportée : I = ${fr('P', 'U')}. Plus la tension est élevée, plus l'intensité est faible, plus les pertes sont faibles.</p>
      <p>Tension × n → intensité ÷ n → pertes ÷ n<sup>2</sup>. D'où le transport sous très haute tension (400 kV).</p></div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Facteur de puissance</h3>
    <div class="cle"><p class="ph-formule">k = cos φ = ${fr('P', 'S')}</p>
      <ul class="er-liste">
        <li>P : puissance active, réellement consommée par l'appareil (W) ;</li>
        <li>S = U × I : puissance apparente, fournie par EDF (VA).</li>
      </ul>
      <p>Pour une puissance P donnée : S = ${fr('P', 'k')} et I = ${fr('S', 'U')} = ${fr('P', 'U × k')}.</p></div>
    <div class="cle"><p>Plus cos φ est petit, plus I est grand dans les lignes de distribution, plus les pertes sont grandes. EDF impose aux installations industrielles <b>cos φ ≥ 0,93</b>.</p></div>
  </section>

  <div class="er-actions te-fiche-liens">
    <a class="btn-secondary" style="text-decoration:none" href="module_1_cours.html">Revoir le cours</a>
    <a class="btn-secondary" style="text-decoration:none" href="module_1_questions.html">Questions sur les pertes par effet Joule</a>
  </div>`;
TE.menu('fiche_1');
</script>
</body>
</html>
