<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 1 · COURS</span>
    <h2 class="er-titre">L'exercice type et la méthode</h2>
    <p class="er-contexte">Un type d'exercice revient très souvent sur les combustions : on brûle une <b>masse de combustible</b> et on cherche la <b>masse de dioxyde de carbone</b> formé. Tu vas voir comment le résoudre, et pourquoi on suit toujours le même chemin.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. L'exercice type   2. Pourquoi passer par les moles ?
   3. La méthode        4. Le schéma de la méthode   · À retenir
   Exemple suivi tout au long du cours : 23 g d'éthanol C2H6O.
   ============================================================ */
const { fmt, hasard, melanger, exemple } = COURS;
const fH = CO.fH;
const frac = (a, b) => `<span class="co-frac"><span>${a}</span><span>${b}</span></span>`;

// Situations des « À toi » de l'étape 1 (mêmes situations que les exercices du module 7)
const SITUATIONS = [
  { f: 'CH4', nom: 'le méthane', texte: `Une gazinière brûle 80 g de méthane ${fH('CH4')}.` },
  { f: 'C3H8', nom: 'le propane', texte: `Un barbecue au gaz brûle 220 g de propane ${fH('C3H8')}.` },
  { f: 'C4H10', nom: 'le butane', texte: `Un réchaud de camping brûle 29 g de butane ${fH('C4H10')}.` },
  { f: 'C8H18', nom: 'l\'octane', texte: `Un moteur à essence brûle 1 140 g d'octane ${fH('C8H18')}.` },
];

/* ---------- 1. L'exercice type ---------- */
function etape1(c) {
  const carte = c.carte('1. Un exercice classique');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>On brûle une <b>masse donnée de combustible</b> (carburant, gaz, alcool…) et on demande la <b>masse de dioxyde de carbone formé</b>. Il y a aussi souvent une question sur l'<b>énergie libérée</b> par la combustion.</p>
      <div class="cle"><p><b class="cle-titre">Exercice type du cours</b> · Calculer la masse de dioxyde de carbone formé lors de la combustion de 23 g d'éthanol ${fH('C2H6O')}, puis l'énergie libérée.</p></div>
    </div>
    ${exemple(`<p>Dans l'exercice type :</p>
      <ul class="er-liste"><li>le <b>combustible</b> est l'éthanol ${fH('C2H6O')} : il brûle en réagissant avec le dioxygène ${fH('O2')} de l'air ;</li>
        <li>la <b>donnée</b> est la masse de combustible brûlé : m = 23 g ;</li>
        <li>on <b>cherche</b> la masse de ${fH('CO2')} formé, puis l'énergie libérée.</li></ul>`)}`);
  const [a, b] = melanger(SITUATIONS);
  c.aToi(carte, [
    { titre: 'Le combustible',
      enonce: `<p>${a.texte} Calcule la masse de dioxyde de carbone formé.</p>`,
      parties: [{ type: 'choix', q: 'Quel est le combustible ?',
        options: [{ id: 'ok', label: `${a.nom} ${fH(a.f)}` }, { id: 'O2', label: `le dioxygène ${fH('O2')}` },
          { id: 'CO2', label: `le dioxyde de carbone ${fH('CO2')}` }, { id: 'H2O', label: `l'eau ${fH('H2O')}` }],
        bonne: 'ok',
        indices: {
          O2: 'Le dioxygène de l\'air est l\'autre réactif : il fait brûler le combustible, mais ce n\'est pas lui qu\'on brûle.',
          CO2: 'Le dioxyde de carbone est <b>formé</b> par la combustion : c\'est un produit, pas le combustible.',
          H2O: 'L\'eau est <b>formée</b> par la combustion : c\'est un produit, pas le combustible.',
        },
        solution: `<p>Le combustible est ${a.nom} : c'est lui qui brûle, en réagissant avec le dioxygène de l'air. Le dioxyde de carbone et l'eau sont les produits.</p>` }] },
    { titre: 'La donnée et l\'inconnue',
      enonce: `<p>${b.texte} Quelle masse de dioxyde de carbone rejette-t-il ?</p>`,
      parties: [
        { type: 'choix', q: 'Quelle grandeur l\'énoncé donne-t-il ?', colonne: true,
          options: [{ id: 'ok', label: 'la masse de combustible brûlé' }, { id: 'n', label: 'la quantité de matière (en mol) de combustible' },
            { id: 'mCO2', label: 'la masse de dioxyde de carbone formé' }],
          bonne: 'ok',
          indices: {
            n: 'La donnée est en grammes : c\'est une <b>masse</b>. La quantité de matière (en mol), il faudra la calculer.',
            mCO2: 'C\'est ce qu\'on cherche : l\'énoncé demande de la calculer.',
          },
          solution: '<p>L\'énoncé donne la masse de combustible brûlé, en g.</p>' },
        { type: 'choix', q: 'Que cherche-t-on ?', colonne: true,
          options: [{ id: 'ok', label: 'la masse de dioxyde de carbone formé' }, { id: 'O2', label: 'la masse de dioxygène consommé' },
            { id: 'E', label: 'l\'énergie libérée' }],
          bonne: 'ok',
          indices: {
            O2: 'Relis la question : elle porte sur le dioxyde de carbone rejeté, pas sur le dioxygène.',
            E: 'L\'énergie libérée est souvent demandée en plus, mais pas ici : la question porte sur le dioxyde de carbone rejeté.',
          },
          solution: '<p>On cherche la masse de dioxyde de carbone formé (rejeté) : c\'est l\'exercice type.</p>' },
      ] },
  ]);
  return carte;
}

/* ---------- 2. Pourquoi passer par les moles ? ---------- */
function etape2(c) {
  const carte = c.carte('2. Pourquoi passer par les moles ?');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>On ne peut pas passer directement de la masse de combustible à la masse de ${fH('CO2')}, car <b>les molécules n'ont pas la même masse</b> : une molécule d'éthanol est plus lourde qu'une molécule de ${fH('CO2')}, et elle en donne deux.</p>
      <div class="co-pourquoi" role="img" aria-label="Une molécule d'éthanol (46 g/mol) donne deux molécules de dioxyde de carbone (44 g/mol chacune)">
        <div><div class="co-pq-mol">${MOL.molecule('C2H6O')}</div><b>1 ${fH('C2H6O')}</b><span>M = 46 g/mol</span></div>
        <div class="co-pq-fl">→</div>
        <div><div class="co-pq-mol">${MOL.molecule('CO2').repeat(2)}</div><b>2 ${fH('CO2')}</b><span>M = 44 g/mol chacune</span></div>
      </div>
      <div class="cle"><p>L'équation de la réaction donne les proportions en <b>nombre de molécules</b>, donc en <b>moles</b>, pas en grammes. Il faut donc passer par les <b>quantités de matière</b> :</p>
        <p class="co-formule">masse → moles → moles → masse</p></div>
    </div>
    ${exemple(`<p>D'après l'équation, 1 molécule d'éthanol donne 2 molécules de ${fH('CO2')}. Donc 1 mol d'éthanol, soit 46 g, donne 2 mol de ${fH('CO2')}, soit 2 × 44 = 88 g :</p>
      <p class="crs-calc">46 g d'éthanol → 1 mol → 2 mol de ${fH('CO2')} → <span class="c">88 g de ${fH('CO2')}</span></p>
      <p>La masse de ${fH('CO2')} formé n'est pas égale à la masse d'éthanol brûlé : ce sont les nombres de molécules qui suivent l'équation.</p>`)}`);
  c.aToi(carte, [
    { titre: 'Un raisonnement à vérifier',
      enonce: `<p>Un élève écrit : « 23 g d'éthanol brûlent, donc il se forme 23 g de ${fH('CO2')}. »</p>`,
      parties: [{ type: 'choix', q: 'A-t-il raison ?', colonne: true,
        options: [{ id: 'ok', label: 'Non : les molécules n\'ont pas la même masse, il faut passer par les moles.' },
          { id: 'oui', label: 'Oui : la masse se conserve au cours d\'une réaction.' },
          { id: 'x2', label: `Non : l'éthanol donne 2 ${fH('CO2')}, il se forme donc 2 × 23 = 46 g de ${fH('CO2')}.` }],
        bonne: 'ok',
        indices: {
          oui: `La masse <b>totale</b> se conserve, mais elle compte aussi le dioxygène consommé et l'eau formée. Et une molécule d'éthanol n'a pas la même masse qu'une molécule de ${fH('CO2')} : il faut passer par les moles.`,
          x2: 'Le 2 de l\'équation compte des molécules, donc des moles, pas des grammes : on ne peut pas l\'appliquer directement aux masses.',
        },
        solution: `<p>L'équation relie des nombres de molécules : on passe de la masse aux moles, on utilise l'équation, puis on revient à la masse. Avec 23 g d'éthanol, on trouvera 44 g de ${fH('CO2')}.</p>` }] },
    { titre: 'Le chemin à suivre',
      parties: [{ type: 'choix', q: `Dans quel ordre passe-t-on de la masse de combustible brûlé à la masse de ${fH('CO2')} formé ?`, colonne: true,
        options: [{ id: 'ok', label: `masse de combustible → n(combustible) → n(${fH('CO2')}) → masse de ${fH('CO2')}` },
          { id: 'direct', label: `masse de combustible → masse de ${fH('CO2')}, avec les nombres de l'équation` },
          { id: 'envers', label: `n(combustible) → masse de combustible → masse de ${fH('CO2')} → n(${fH('CO2')})` }],
        bonne: 'ok',
        indices: {
          direct: 'Les nombres de l\'équation relient des quantités de matière (des moles), pas des masses.',
          envers: `On part de la donnée (la masse de combustible) et on finit par ce qu'on cherche (la masse de ${fH('CO2')}) ; l'équation sert au milieu, entre les deux quantités de matière.`,
        },
        solution: '<p>masse → moles → moles → masse : l\'équation sert à passer des moles de combustible aux moles de dioxyde de carbone.</p>' }] },
  ]);
  return carte;
}

/* ---------- 3. La méthode ---------- */
function etape3(c) {
  const carte = c.carte('3. La méthode, étape par étape');
  c.ajouter(carte, `<div class="cours-bloc"><p>On suit toujours les mêmes étapes. Chacune est travaillée dans un module de l'application.</p></div>
    <ol class="co-methode">
      <li><b>Écrire et équilibrer l'équation de la combustion</b><span>combustible + O<sub>2</sub> → CO<sub>2</sub> + H<sub>2</sub>O : elle donne les proportions en moles.</span><a class="co-lien" href="module_2_cours.html">Module 2 · équilibrer une combustion →</a></li>
      <li><b>Calculer n(combustible)</b><span>n = m / M, avec la masse molaire calculée à partir des atomes.</span><a class="co-lien" href="module_3_cours.html">Module 3 · masse, quantité de matière, masse molaire →</a></li>
      <li><b>Calculer n(CO<sub>2</sub>) formé</b><span>avec la relation stœchiométrique : n(combustible) / a = n(CO<sub>2</sub>) / c.</span><a class="co-lien" href="module_4_cours.html">Module 4 · relations stœchiométriques →</a></li>
      <li><b>Calculer m(CO<sub>2</sub>)</b><span>m = n × M(CO<sub>2</sub>).</span><a class="co-lien" href="module_3_cours.html">Module 3 · masse, quantité de matière, masse molaire →</a></li>
      <li class="co-methode-e"><b>Souvent en plus : l'énergie libérée</b><span>E = PC × m (m en kg), avec le pouvoir calorifique PC.</span><a class="co-lien" href="module_5_cours.html">Module 5 · l'énergie libérée →</a></li>
    </ol>
    ${exemple(`<p>Sur l'exercice type (23 g d'éthanol, M = 46 g/mol, PC = 28,8 MJ/kg) :</p>
      <ol class="er-liste">
        <li>${CO.equation('C2H6O')}</li>
        <li>n(${fH('C2H6O')}) = ${frac('23', '46')} = 0,5 mol</li>
        <li>n(${fH('CO2')}) = 2 × 0,5 = 1 mol (2 ${fH('CO2')} pour 1 ${fH('C2H6O')})</li>
        <li>m(${fH('CO2')}) = 1 × 44 = <b>44 g</b></li>
        <li>E = 28,8 × 0,023 ≈ <b>0,66 MJ</b> (23 g = 0,023 kg)</li>
      </ol>`)}`);
  c.aToi(carte, [
    { titre: 'Par quoi commencer ?',
      parties: [{ type: 'choix', q: 'Quelle est la première étape de la méthode ?', colonne: true,
        options: [{ id: 'ok', label: 'Écrire et équilibrer l\'équation de la combustion' }, { id: 'n', label: 'Calculer n(combustible) = m / M' },
          { id: 'm', label: `Calculer m(${fH('CO2')})` }],
        bonne: 'ok',
        indices: {
          n: `On en aura besoin, mais d'abord l'équation : sans elle, on ne sait pas combien de ${fH('CO2')} donne une molécule de combustible.`,
          m: 'C\'est la dernière étape : c\'est ce qu\'on cherche.',
        },
        solution: '<p>D\'abord l\'équation équilibrée : ses nombres stœchiométriques donnent les proportions en moles.</p>' }] },
    { titre: `Du combustible au ${fH('CO2')}`,
      parties: [{ type: 'choix', q: `On connaît n(combustible). Comment obtient-on n(${fH('CO2')}) ?`, colonne: true,
        options: [{ id: 'ok', label: 'avec la relation stœchiométrique, tirée de l\'équation' },
          { id: 'egal', label: `n(${fH('CO2')}) = n(combustible), toujours` }, { id: 'm', label: 'avec m = n × M' }],
        bonne: 'ok',
        indices: {
          egal: `Pas toujours : une molécule d'éthanol donne 2 molécules de ${fH('CO2')}. Ce sont les nombres stœchiométriques qui le disent.`,
          m: `m = n × M donne une masse : c'est l'étape suivante, une fois n(${fH('CO2')}) connu.`,
        },
        solution: `<p>La relation stœchiométrique, par exemple n(${fH('C2H6O')}) / 1 = n(${fH('CO2')}) / 2 pour l'éthanol.</p>` }] },
    { titre: 'L\'énergie libérée',
      parties: [{ type: 'choix', q: 'On calcule E = PC × m avec PC en MJ/kg. Dans quelle unité faut-il la masse m ?',
        options: [{ id: 'kg', label: 'en kg' }, { id: 'g', label: 'en g' }, { id: 'mol', label: 'en mol' }],
        bonne: 'kg',
        indices: {
          g: 'PC est l\'énergie libérée par 1 kg (MJ/kg) : la masse doit être en kilogrammes, par exemple 23 g = 0,023 kg.',
          mol: 'PC est donné par kilogramme (MJ/kg), pas par mole : la masse doit être en kg.',
        },
        solution: '<p>En kg, comme dans l\'unité du pouvoir calorifique (MJ/kg).</p>' }] },
  ]);
  return carte;
}

/* ---------- 4. Le schéma de la méthode ---------- */
function etape4(c) {
  const carte = c.carte('4. Le schéma de la méthode');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>On résume la méthode par un schéma : chaque espèce a sa colonne, sous l'équation. Les flèches pleines mènent à la masse de ${fH('CO2')} ; les pointillés montrent qu'on peut aussi calculer le dioxygène consommé et l'eau formée.</p>
      <div class="cle"><p>masse → quantité de matière (n = m / M) → quantité de matière d'une autre espèce (relation stœchiométrique) → masse (m = n × M)</p></div>
    </div>
    ${exemple(`<p>Combustion de 23 g d'éthanol :</p>${CO.schema('C2H6O', 23, true)}`, 'Exemple : l\'exercice type')}`);
  // k fois plus d'éthanol : 23k g → 0,5k mol → k mol de CO2 → 44k g
  const k = hasard([2, 3, 4]);
  c.aToi(carte, [
    { titre: 'Lire le schéma',
      parties: [{ type: 'choix', q: `Sur le schéma, pourquoi n(${fH('CO2')}) = 2 × n(${fH('C2H6O')}) ?`, colonne: true,
        options: [{ id: 'ok', label: `L'équation donne 2 ${fH('CO2')} pour 1 ${fH('C2H6O')}.` },
          { id: 'M', label: `Les masses molaires de ${fH('CO2')} et de ${fH('C2H6O')} sont presque égales.` },
          { id: 'ind', label: `La molécule ${fH('CO2')} contient 2 atomes d'oxygène.` }],
        bonne: 'ok',
        indices: {
          M: 'Les masses molaires servent à passer de la masse aux moles, pas d\'une espèce à l\'autre : ce sont les nombres stœchiométriques qui relient les quantités de matière.',
          ind: `Le 2 de ${fH('CO2')} est un indice : il compte les atomes O dans une molécule. Ici, c'est le nombre stœchiométrique 2, <b>devant</b> ${fH('CO2')} dans l'équation, qui compte.`,
        },
        solution: `<p>${frac(`n(${fH('C2H6O')})`, 1)} = ${frac(`n(${fH('CO2')})`, 2)} : les nombres stœchiométriques de l'équation.</p>` }] },
    { titre: `${k} fois plus d'éthanol`,
      enonce: `<p>On brûle maintenant ${23 * k} g d'éthanol, ${k} fois plus que dans l'exemple.</p>`,
      parties: [{ type: 'nombre', q: `Quelle masse de ${fH('CO2')} se forme-t-il ?`, label: `m(${fH('CO2')}) =`, unite: 'g', valeur: 44 * k, signe: false,
        diag: v => (CO.egal(v, 44) ? `44 g, c'est pour 23 g d'éthanol. Avec ${k} fois plus d'éthanol, il se forme ${k} fois plus de ${fH('CO2')}.`
          : CO.egal(v, 23 * k) ? `La masse de ${fH('CO2')} n'est pas égale à la masse d'éthanol : passe par les moles.`
            : CO.egal(v, k) || CO.egal(v, 0.5 * k) ? `C'est une quantité de matière (en mol). La dernière flèche donne la masse : m = n × M(${fH('CO2')}) = n × 44.`
              : `Suis le schéma : n(${fH('C2H6O')}) = m / 46, puis n(${fH('CO2')}) = 2 × n(${fH('C2H6O')}), puis m(${fH('CO2')}) = n(${fH('CO2')}) × 44.`),
        solution: `<p class="crs-calc">n(${fH('C2H6O')}) = ${frac(23 * k, 46)} = ${fmt(0.5 * k)} mol → n(${fH('CO2')}) = 2 × ${fmt(0.5 * k)} = ${k} mol → m(${fH('CO2')}) = ${k} × 44 = <span class="c">${44 * k} g</span></p>` }] },
    { titre: 'Et l\'eau formée ?',
      enonce: `<p>Toujours avec 23 g d'éthanol. Masse molaire de l'eau : M(${fH('H2O')}) = 18 g/mol.</p>`,
      parties: [{ type: 'nombre', q: 'Quelle masse d\'eau se forme-t-il ?', label: `m(${fH('H2O')}) =`, unite: 'g', valeur: 27, signe: false,
        diag: v => (CO.egal(v, 1.5) ? `1,5 mol, c'est la quantité de matière d'eau. Multiplie par M(${fH('H2O')}) = 18 g/mol pour avoir la masse.`
          : CO.egal(v, 9) ? `Tu as pris n(${fH('C2H6O')}) = 0,5 mol. Il se forme 3 ${fH('H2O')} pour 1 ${fH('C2H6O')} : n(${fH('H2O')}) = 3 × 0,5 = 1,5 mol.`
            : CO.egal(v, 23) ? 'La masse d\'eau n\'est pas égale à la masse d\'éthanol : passe par les moles.'
              : `Lis n(${fH('H2O')}) sur le schéma (en pointillés), puis m = n × M(${fH('H2O')}).`),
        solution: `<p class="crs-calc">n(${fH('H2O')}) = 3 × 0,5 = 1,5 mol → m(${fH('H2O')}) = 1,5 × 18 = <span class="c">27 g</span></p>` }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Pourquoi passer par les moles ?</b> L'équation donne les proportions en nombre de molécules, donc en moles, pas en grammes : masse → moles → moles → masse.</p></div>
    <div class="cle"><p><b class="cle-titre">La méthode</b></p>
      <ol class="er-liste"><li>Écrire et équilibrer l'équation de la combustion.</li><li>n(combustible) = m / M.</li>
        <li>n(CO<sub>2</sub>) avec la relation stœchiométrique.</li><li>m(CO<sub>2</sub>) = n × M(CO<sub>2</sub>).</li>
        <li>Souvent en plus : l'énergie libérée E = PC × m (m en kg).</li></ol></div>
    <div class="cours-bloc"><p><b>Et ensuite ?</b> Modules 2 à 5 : chaque étape en détail. <a class="co-lien-txt" href="module_6.html">Module 6</a> : l'exemple du cours résolu pas à pas, puis un deuxième exemple. <a class="co-lien-txt" href="module_7.html">Module 7</a> : exercices complets (10 exercices différents).</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2_cours.html">Module 2 : équilibrer une combustion →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_6.html">Module 6 : l'exemple du cours, pas à pas</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_1.html">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, etape4, aRetenir]);
CO.menu('module_1');
</script>
