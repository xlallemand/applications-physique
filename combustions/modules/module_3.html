CO.serie({

  badge: 'MODULE 3',
  titre: "Masse, quantité de matière, masse molaire",
  intro: `<h3 class="cours-titre" style="font-size:1.15rem;margin-top:14px">Cours rapide</h3>
  <div class="cle"><p><b class="cle-titre">Quantité de matière</b> · La quantité de matière n, ou nombre de moles, se calcule à partir de la masse m et de la masse molaire M :</p>
    <p class="co-formule">n = <span class="co-frac"><span>m</span><span>M</span></span></p>
    <p class="co-legende"><b>n</b> : quantité de matière en <span class="co-unite-tag">mol</span> · <b>m</b> : masse en <span class="co-unite-tag">g</span> · <b>M</b> : masse molaire en <span class="co-unite-tag">g/mol</span></p>
    <p class="co-legende">La même relation s'écrit aussi <b>m = n × M</b> ou <b>M = m / n</b>.</p></div>
  <div class="cle"><p><b class="cle-titre">Vérifier avec les unités</b> · Les unités se calculent comme les nombres. Si la formule est juste, l'unité du résultat est la bonne :</p>
    <p class="co-formule">n = <span class="co-frac"><span>m</span><span>M</span></span> → <span class="co-frac"><span>g</span><span>g/mol</span></span> = g × <span class="co-frac"><span>mol</span><span>g</span></span> = mol ✓</p></div>
  <div class="cle"><p><b class="cle-titre">Masse molaire d'une molécule</b> · C'est la somme des masses molaires de ses atomes : chaque masse est multipliée par le nombre d'atomes.</p>
    <p class="co-formule">M(H<sub>2</sub>O) = 2 × M(H) + M(O) = 2 × 1 + 16 = 18 g/mol</p>
    <p class="co-legende">Masses molaires atomiques utilisées : M(C) = 12 g/mol ; M(H) = 1 g/mol ; M(O) = 16 g/mol.</p></div>`,
  questions: BANQUE.module3,
  suite: { href: 'module_4.html', label: 'Module 4 : relations stœchiométriques →' },
});

</script>
