  app: document.getElementById('app'),
  badge: 'MODULE 4',
  titre: "Les relations stœchiométriques",
  intro: `<h3 class="cours-titre" style="font-size:1.15rem;margin-top:14px">La relation</h3>
  <div class="cle"><p>Pour la réaction <b>a A + b B → c C + d D</b>, les quantités de matière consommées (A, B) et formées (C, D) sont proportionnelles aux nombres stœchiométriques :</p>
    <p class="co-formule"><span class="co-frac"><span>n<sub>A</sub></span><span>a</span></span> = <span class="co-frac"><span>n<sub>B</sub></span><span>b</span></span> = <span class="co-frac"><span>n<sub>C</sub></span><span>c</span></span> = <span class="co-frac"><span>n<sub>D</sub></span><span>d</span></span></p>
    <p class="co-legende">n<sub>A</sub>, n<sub>B</sub> : quantités de matière <b>consommées</b> · n<sub>C</sub>, n<sub>D</sub> : quantités de matière <b>formées</b>.</p></div>
  <div class="cle"><p><b class="cle-titre">Exemple</b> · Combustion du méthane :</p>
    <p class="co-eq">CH<sub>4</sub> + <span class="er-eq-c">2</span>&nbsp;O<sub>2</sub> → CO<sub>2</sub> + <span class="er-eq-c">2</span>&nbsp;H<sub>2</sub>O</p>
    <p class="co-formule"><span class="co-frac"><span>n(CH<sub>4</sub>)</span><span>1</span></span> = <span class="co-frac"><span>n(O<sub>2</sub>)</span><span>2</span></span> = <span class="co-frac"><span>n(CO<sub>2</sub>)</span><span>1</span></span> = <span class="co-frac"><span>n(H<sub>2</sub>O)</span><span>2</span></span></p>
    <p class="co-legende">Si 3 mol de CH<sub>4</sub> brûlent : n(O<sub>2</sub>) = 2 × 3 = <b>6 mol</b> consommées, n(CO<sub>2</sub>) = <b>3 mol</b> et n(H<sub>2</sub>O) = 2 × 3 = <b>6 mol</b> formées. Comme dans une recette : pour 1 « part » de méthane, il faut 2 parts de dioxygène.</p></div>`,
  questions: BANQUE.module4,
  suite: { href: 'module_5.html', label: 'Module 5 : énergie libérée →' },
});
CO.menu('module_4');
</script>
