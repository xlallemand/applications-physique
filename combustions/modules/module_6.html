<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 6 : l'exemple du cours, pas à pas — Chapitre 14 : Combustions</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/molecules.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="co.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/molecules.js"></script>
<script src="../../equilibrer-reactions/modules/er.js"></script>
<script src="co.js"></script>
<script src="banque.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 6 · EXEMPLE</span>
    <h2 class="er-titre">L'exemple du cours, pas à pas</h2>
    <p class="er-contexte">On résout l'<b>exercice type</b> du cours en suivant la méthode du module 1. Tu fais les calculs ; si tu bloques, tu peux afficher la réponse (ce module n'est pas noté). Un <b>deuxième exemple</b> suit, à ton tour.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Exemple du cours résolu pas à pas, avec le moteur de cours commun
   (assets/cours.js). Les « À toi » montent les parties de co.js
   ('especes', 'equilibrer', 'valeur') dans des parties 'perso'.
   1. L'exercice type     2. Question 1 : l'équation
   3. Question 2 : masse de CO2 en 3 étapes     4. Le schéma de la méthode
   5. Question 3 : l'énergie     6. Deuxième exemple : à ton tour
   Le cours est marqué fait à l'affichage de la dernière étape.
   ============================================================ */
const fH = CO.fH, B = BANQUE;

/* Les deux exercices : l'exercice type du cours, puis « à ton tour » */
const TYPE = { f: 'C2H6O', m: 23 };
const TOI = { f: 'CH4', m: 32 };

// Partie de co.js montée dans une partie 'perso' du cours : le bouton « Valider » disparaît une fois la partie terminée
function outilCO(p) {
  return Object.assign({}, p, {
    type: 'perso',
    monter(zone, api) {
      const fermer = () => { const a = zone.querySelector('.co-actions-partie'); if (a) a.remove(); };
      const ctx = CO.PARTIES[p.type](zone, p, Object.assign({}, api, { reussi() { fermer(); api.reussi(); } }));
      return { montrer() { ctx.montrer(); fermer(); } };
    },
  });
}

/* ---------- 1. L'exercice type ---------- */
function etape1(c) {
  const carte = c.carte('1. L\'exercice type');
  c.ajouter(carte, `<div class="cle"><ol class="er-liste" style="margin:0">
      <li>Écrire la réaction de combustion de l'éthanol ${fH('C2H6O')}.</li>
      <li>Calculer la masse de dioxyde de carbone formé lors de la combustion de 23 g de ${fH('C2H6O')}.<br><span class="co-legende">Données : M(C) = 12 g/mol ; M(H) = 1 g/mol ; M(O) = 16 g/mol.</span></li>
      <li>Calculer l'énergie libérée par la réaction. <span class="co-legende">PC(éthanol) = 28,8 MJ/kg.</span></li>
    </ol></div>
    <p class="er-contexte">Question 1 : l'équation (module 2). Question 2 : n(combustible), puis n(CO<sub>2</sub>), puis m(CO<sub>2</sub>) (modules 3 et 4). Question 3 : avec le pouvoir calorifique (module 5).</p>`);
  c.continuer(carte, 'Commencer →');
  return carte;
}

/* ---------- 2. Question 1 : l'équation ---------- */
function etape2(c) {
  const carte = c.carte('2. Question 1 : l\'équation de la combustion');
  c.ajouter(carte, `<div class="cours-bloc"><p>Combustible + dioxygène → dioxyde de carbone + eau, puis on équilibre : C, puis H, puis O.</p></div>`);
  c.aToi(carte, [
    { titre: 'La combustion de l\'éthanol',
      parties: [
        outilCO({ type: 'especes', comb: TYPE.f, q: 'Complète l\'équation.' }),
        outilCO({ type: 'equilibrer', comb: TYPE.f, q: 'Équilibre-la.', solution: `<p class="er-eq">${CO.equation(TYPE.f)}</p>` }),
      ] },
  ]);
  return carte;
}

/* ---------- 3. Question 2 : masse de CO2 en 3 étapes ---------- */
function etape3(c) {
  const n = TYPE.m / CO.M(TYPE.f);
  const carte = c.carte('3. Question 2 : la masse de CO<sub>2</sub> formé');
  c.ajouter(carte, `<div class="cours-bloc"><p class="co-eq">${CO.equation(TYPE.f)}</p>
      <p>On ne peut pas passer directement de la masse d'éthanol à la masse de CO<sub>2</sub> : il faut passer par les <b>quantités de matière</b>, car l'équation donne les proportions en moles. Trois étapes :</p></div>`);
  c.aToi(carte, [
    { titre: 'Étape 1 · De la masse à la quantité de matière du combustible',
      enonce: `<p class="co-legende">m(${fH('C2H6O')}) = 23 g. On utilise <b>n = m / M</b> : il faut d'abord la masse molaire.</p>`,
      parties: [outilCO(B.pM(TYPE.f)), outilCO(B.pN(TYPE.f, TYPE.m))] },
    { titre: 'Étape 2 · La relation stœchiométrique',
      enonce: `<p class="co-legende">Les quantités de matière sont proportionnelles aux nombres stœchiométriques : ${B.relation(TYPE.f)}</p>`,
      parties: [outilCO(B.pRelation(TYPE.f, 0, n, 2))] },
    { titre: 'Étape 3 · De la quantité de matière à la masse de CO<sub>2</sub>',
      enonce: '<p class="co-legende">On utilise <b>m = n × M</b> avec la masse molaire du CO<sub>2</sub>.</p>',
      parties: [outilCO(B.pM('CO2')), outilCO(B.pMasse('CO2', 2 * n))] },
  ]);
  return carte;
}

/* ---------- 4. Le schéma complet ---------- */
function etape4(c) {
  const carte = c.carte('4. Le schéma de la méthode');
  c.ajouter(carte, `<div class="cours-bloc">${CO.schema(TYPE.f, TYPE.m, true)}
      <p>Les flèches pleines donnent la masse de CO<sub>2</sub>. Avec la même relation, on peut aussi calculer la quantité de dioxygène <b>consommé</b> et d'eau <b>formée</b> (flèches en pointillés) : n(O<sub>2</sub>) = 3 × 0,5 = 1,5 mol et n(H<sub>2</sub>O) = 3 × 0,5 = 1,5 mol.</p></div>`);
  c.continuer(carte);
  return carte;
}

/* ---------- 5. Question 3 : l'énergie ---------- */
function etape5(c) {
  const carte = c.carte('5. Question 3 : l\'énergie libérée');
  c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Pouvoir calorifique</b> · C'est l'énergie fournie par la combustion de <b>1 kg</b> de combustible. PC(éthanol) = 28,8 MJ/kg : 1 kg d'éthanol libère 28,8 MJ.</p>
      <p class="co-legende">L'énergie est proportionnelle à la masse brûlée : E = PC × m, avec m en kg.</p></div>`);
  c.aToi(carte, [
    { titre: 'L\'énergie libérée par 23 g d\'éthanol', parties: [outilCO(B.pConv(23)), outilCO(B.pE('C2H6O', 0.023))] },
  ], 'Deuxième exemple →');
  return carte;
}

/* ---------- 6. Deuxième exemple : à ton tour ---------- */
function etape6(c) {
  const n = TOI.m / CO.M(TOI.f);
  const carte = c.carte('6. Deuxième exemple : à ton tour');
  c.ajouter(carte, `<div class="cours-bloc"><p>Une gazinière brûle <b>32 g de méthane</b> ${fH('CH4')}. Calcule la masse de CO<sub>2</sub> formé, puis l'énergie libérée.</p>
      <p class="co-donnees">Données : M(C) = 12 g/mol ; M(H) = 1 g/mol ; M(O) = 16 g/mol ; PC(méthane) = 50 MJ/kg.</p></div>`);
  const pE = B.pE(TOI.f, TOI.m / 1000);
  c.aToi(carte, [
    { titre: 'L\'équation',
      parties: [outilCO({ type: 'equilibrer', comb: TOI.f, q: '1. Équilibre la combustion du méthane.', solution: `<p class="er-eq">${CO.equation(TOI.f)}</p>` })] },
    { titre: 'La quantité de matière de méthane',
      parties: [outilCO(Object.assign(B.pM(TOI.f), { q: '2. Masse molaire du méthane.' })), outilCO(Object.assign(B.pN(TOI.f, TOI.m), { q: '3. Quantité de matière de méthane brûlé.' }))] },
    { titre: 'La masse de CO<sub>2</sub> formé',
      parties: [outilCO(Object.assign(B.pRelation(TOI.f, 0, n, 2), { q: '4. Quantité de matière de CO<sub>2</sub> formé.' })),
        outilCO(Object.assign(B.pMasse('CO2', n), { q: '5. Masse de CO<sub>2</sub> formé (M(CO<sub>2</sub>) = 44 g/mol).' }))] },
    { titre: 'L\'énergie libérée',
      parties: [outilCO(Object.assign(B.pConv(TOI.m), { q: '6. Masse de méthane en kg.' })),
        outilCO(Object.assign(pE, { q: '7. Énergie libérée.', solution: `${pE.solution}<p><b>Exercice terminé !</b> Le schéma de ce deuxième exemple :</p>${CO.schema(TOI.f, TOI.m, false)}` }))] },
  ]);
  c.ajouter(carte, `<div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_6_entrainement.html">Entraînement : exercices complets →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_7.html">Module 7 : exercices du chapitre</a></div>`);
  return carte;
}

CO.menu('module_6');
new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, etape4, etape5, etape6]);
</script>
</body>
</html>
