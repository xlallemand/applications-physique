CO.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 5',
  titre: "L'énergie libérée",
  intro: `<h3 class="cours-titre" style="font-size:1.15rem;margin-top:14px">Le pouvoir calorifique</h3>
  <div class="cle"><p>Le <b>pouvoir calorifique</b> PC d'un combustible est l'<b>énergie fournie par la combustion de 1 kg</b> de ce combustible. Il s'exprime en <span class="co-unite-tag">MJ/kg</span>.</p>
    <p class="co-legende">Exemple : PC(éthanol) = 28,8 MJ/kg. Énergie libérée par la combustion de 23 g = 0,023 kg d'éthanol :</p>
    <table class="co-prop"><tr><td>Énergie (MJ)</td><td>28,8</td><td class="x">E</td></tr><tr><td>Masse (kg)</td><td>1</td><td>0,023</td></tr></table>
    <p class="co-formule">E = 28,8 × 0,023 ≈ 0,66 MJ</p></div>
  <div class="co-grille2">
    <div class="cle" style="margin:0"><p><b class="cle-titre">Énergie libérée</b></p><p class="co-formule">E = PC × m</p></div>
    <div class="cle" style="margin:0"><p><b class="cle-titre">Masse à brûler</b></p><p class="co-formule">m = <span class="co-frac"><span>E</span><span>PC</span></span></p></div>
  </div>
  <p class="co-legende" style="margin-top:10px">E en MJ, PC en MJ/kg, <b>m en kg</b> (1 kg = 1 000 g ; 1 MJ = 1 000 kJ).</p>`,
  questions: BANQUE.module5,
  suite: { href: 'module_6.html', label: 'Module 6 : exercices complets →' },
});
