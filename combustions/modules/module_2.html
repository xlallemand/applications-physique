<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : Équilibrer une combustion — Combustions</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/molecules.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="co.css">
<script src="../../assets/nav.js"></script>
<script src="../../assets/molecules.js"></script>
<script src="../../equilibrer-reactions/modules/er.js"></script>
<script src="co.js"></script>
<script src="banque.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page" id="app">
  <div class="er-card">
    <span class="er-badge">MODULE 2</span>
    <h2 class="er-titre">Équilibrer une combustion</h2>
    <p class="er-contexte">D'abord un test rapide pour vérifier que tu sais équilibrer une réaction. Ensuite, la méthode propre aux combustions, sur trois exemples guidés. Pour finir, un entraînement noté.</p>
    <div class="er-actions"><button type="button" class="btn-small" id="direct">Déjà à l'aise ? Aller directement à l'entraînement noté →</button></div>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   A. Test de départ : une réaction simple, sans aide
   B. Si échec : faire le point sur les compétences (application
      « Équilibrer une réaction »), avec un lien si les lacunes
      sont trop importantes
   C. Les combustions : cours rapide et trois exemples guidés
   D. Entraînement noté (10 combustions)
   ============================================================ */
const zone = document.getElementById('etapes'), app = document.getElementById('app');
const fH = CO.fH, eqHTML = ER.equationHTML;
const LIEN = '../../equilibrer-reactions/';

function carte(html, cls) {
  const c = document.createElement('section');
  c.className = 'er-card' + (cls ? ' ' + cls : '');
  c.innerHTML = html;
  zone.appendChild(c);
  return c;
}
function continuer(parent, suivante, texte) {
  parent.insertAdjacentHTML('beforeend', `<div class="co-suite"><button type="button" class="btn-primary">${texte || 'Continuer →'}</button></div>`);
  const b = parent.querySelector('.co-suite:last-child button');
  b.onclick = () => { b.parentNode.remove(); const c = suivante(); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
}
const secouer = e => { e.classList.remove('er-secoue'); void e.offsetWidth; e.classList.add('er-secoue'); };

/* Réactions simples (test de départ et test d'équilibrage) */
const SIMPLES = CO.melanger([
  { r: ['H2', 'O2'], p: ['H2O'], c: [2, 1, 2], nom: 'Synthèse de l\'eau' },
  { r: ['N2', 'H2'], p: ['NH3'], c: [1, 3, 2], nom: 'Synthèse de l\'ammoniac' },
  { r: ['C3H8', 'O2'], p: ['CO2', 'H2O'], c: [1, 5, 3, 4], nom: 'Combustion du propane' },
  { r: ['CO', 'O2'], p: ['CO2'], c: [2, 1, 2], nom: 'Combustion du monoxyde de carbone' },
  { r: ['Mg', 'O2'], p: ['MgO'], c: [2, 1, 2], nom: 'Combustion du magnésium' },
]);

/* ---------- A. Test de départ ---------- */
function partieA() {
  const q = SIMPLES[0];
  const c = carte(`<span class="co-etape">TEST DE DÉPART</span><h3 class="cours-titre">Équilibre cette réaction, sans aide</h3>
    <p class="er-contexte">Ajuste les nombres stœchiométriques avec les flèches, puis valide. Tu as <b>deux essais</b>.</p>
    <p class="er-q-nom">${q.nom}</p><div data-x="r"></div><div data-x="ret"></div>
    <div class="er-actions" data-x="act"><button type="button" class="btn-primary">Valider</button></div>`);
  const ret = c.querySelector('[data-x="ret"]'), act = c.querySelector('[data-x="act"]');
  const reac = new ER.Reaction(c.querySelector('[data-x="r"]'), { reactifs: q.r, produits: q.p, onChange: () => { ret.innerHTML = ''; } });
  let essais = 0;
  act.querySelector('button').onclick = () => {
    const v = reac.verifier();
    essais++;
    if (v.equilibree && v.minimale) {
      reac.activer(false); act.innerHTML = '';
      ret.innerHTML = `<div class="callout-success er-retour"><p><b class="er-ok">Bravo, c'est juste !</b></p><p class="er-eq">${eqHTML(q.r, q.p, q.c)}</p><p>Tu sais équilibrer une réaction : passons aux combustions.</p></div>`;
      continuer(c, partieC);
    } else if (essais < 2) {
      ret.innerHTML = '<div class="callout-danger er-retour"><p><b class="er-ko">Ce n\'est pas encore ça.</b> Il te reste un essai.</p></div>';
      secouer(c.querySelector('[data-x="r"]'));
    } else {
      reac.fixer(q.c); reac.activer(false); act.innerHTML = '';
      ret.innerHTML = `<div class="callout er-retour"><p><b>La bonne réponse :</b></p><p class="er-eq">${eqHTML(q.r, q.p, q.c)}</p><p>Faisons le point sur ce qu'il faut savoir faire pour équilibrer une réaction.</p></div>`;
      continuer(c, partieB, 'Faire le point →');
    }
  };
  return c;
}

/* ---------- B. Faire le point sur les compétences ---------- */
const resultats = [];
function partieB() { return testComptage(1, 'H2O', 3, () => testComptage(2, 'C2H6O', 2, testConservation)); }

function testComptage(num, formule, coef, suite) {
  const c = carte(`<span class="co-etape">FAIRE LE POINT · ${num}/4</span><h3 class="cours-titre">Compter les atomes</h3>
    <p class="er-contexte">Combien y a-t-il d'atomes de chaque élément dans <b>${coef} ${fH(formule)}</b> ?</p><div data-x="cpt"></div>`, 'co-test');
  new ER.Comptage(c.querySelector('[data-x="cpt"]'), {
    formule, coef,
    regle: 'Le nombre stœchiométrique multiplie tous les atomes de la molécule : nombre d\'atomes = nombre stœchiométrique × indice.',
    onReussi: erreurs => { resultats.push({ nom: num === 1 ? 'Compter les atomes' : 'Compter les atomes (molécule plus grande)', comp: 'compter', ok: erreurs === 0 }); continuer(c, suite); },
  });
  return c;
}

function testConservation() {
  const eqs = CO.melanger([
    { r: ['CH4', 'O2'], p: ['CO2', 'H2O'], c: [1, 2, 1, 2], ok: true },
    { r: ['N2', 'H2'], p: ['NH3'], c: [1, 1, 2], ok: false },
  ]);
  const c = carte(`<span class="co-etape">FAIRE LE POINT · 3/4</span><h3 class="cours-titre">Une équation équilibrée ?</h3>
    <p class="er-contexte">Une équation est équilibrée si chaque élément a <b>le même nombre d'atomes</b> dans les réactifs et dans les produits.</p><div data-x="q"></div>`, 'co-test');
  const partie = e => ({
    type: 'choix', q: `<span class="er-eq">${eqHTML(e.r, e.p, e.c)}</span><br>Cette équation est-elle équilibrée ?`,
    options: [{ id: 'oui', label: 'Oui' }, { id: 'non', label: 'Non' }], bonne: e.ok ? 'oui' : 'non',
    indice: 'Compte les atomes de chaque élément de chaque côté de la flèche (nombre stœchiométrique × indice).',
    solution: ER.bilanHTML(ER.verifier(e.r, e.p, e.c).bilan, { boule: false }),
  });
  CO.question(c.querySelector('[data-x="q"]'), { parties: eqs.map(partie) }, {
    fin: p => { resultats.push({ nom: 'Reconnaître une équation équilibrée', comp: 'equilibrer', ok: p === 2 }); continuer(c, testEquilibrer); },
  });
  return c;
}

function testEquilibrer() {
  const q = SIMPLES[1];
  const c = carte(`<span class="co-etape">FAIRE LE POINT · 4/4</span><h3 class="cours-titre">Équilibrer, avec le nombre d'atomes affiché</h3>
    <p class="er-contexte">Le nombre d'atomes de chaque élément est écrit sous chaque espèce. Ajuste les nombres stœchiométriques.</p>
    <p class="er-q-nom">${q.nom}</p><div data-x="r"></div><div data-x="ret"></div>
    <div class="er-actions" data-x="act"><button type="button" class="btn-primary">Valider</button><button type="button" class="btn-secondary">Afficher la réponse</button></div>`, 'co-test');
  const ret = c.querySelector('[data-x="ret"]'), act = c.querySelector('[data-x="act"]');
  const reac = new ER.Reaction(c.querySelector('[data-x="r"]'), { reactifs: q.r, produits: q.p, comptes: true, onChange: () => { ret.innerHTML = ''; } });
  let erreurs = 0;
  const [bVal, bRep] = act.querySelectorAll('button');
  const finir = (ok, html) => {
    reac.activer(false); act.innerHTML = '';
    ret.innerHTML = html;
    resultats.push({ nom: 'Équilibrer une réaction', comp: 'equilibrer', ok });
    continuer(c, bilanB, 'Voir le bilan →');
  };
  bVal.onclick = () => {
    const ind = ER.indice(q.r, q.p, reac.coefs);
    if (ind.ok) { finir(erreurs <= 1, `<div class="callout-success er-retour"><p><b class="er-ok">C'est juste !</b></p><p class="er-eq">${eqHTML(q.r, q.p, q.c)}</p></div>`); return; }
    erreurs++;
    ret.innerHTML = `<div class="callout-danger er-retour"><p><b class="er-ko">Pas encore.</b> ${ind.html}</p></div>`;
    secouer(c.querySelector('[data-x="r"]'));
  };
  bRep.onclick = () => { reac.fixer(q.c); finir(false, `<div class="callout er-retour"><p><b>Réponse :</b></p><p class="er-eq">${eqHTML(q.r, q.p, q.c)}</p></div>`); };
  return c;
}

function bilanB() {
  const ko = resultats.filter(r => !r.ok), compter = ko.some(r => r.comp === 'compter'), equil = ko.some(r => r.comp === 'equilibrer');
  const conseils = [];
  if (compter) conseils.push(`<li><a href="${LIEN}modules/module_2.html" target="_blank" rel="noopener">Module 2 : Compter les atomes ↗</a></li>`);
  if (equil) conseils.push(`<li><a href="${LIEN}modules/module_1.html" target="_blank" rel="noopener">Module 1 : Comment équilibrer une réaction ↗</a>, puis <a href="${LIEN}modules/module_3.html" target="_blank" rel="noopener">module 3 : réactions faciles ↗</a></li>`);
  const chips = `<div class="co-diag">${resultats.map(r => `<span class="${r.ok ? 'ok' : 'ko'}">${r.ok ? '✓' : '✗'} ${r.nom}</span>`).join('')}</div>`;
  let html;
  if (ko.length >= 2) {
    html = `<div class="callout-danger er-retour"><p><b class="er-ko">Il te manque encore des bases pour équilibrer une réaction.</b></p>
      <p>Entraîne-toi d'abord avec l'application « Équilibrer une réaction » (elle s'ouvre dans un nouvel onglet), puis reviens ici :</p><ul class="er-liste">${conseils.join('')}</ul></div>
      <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="${LIEN}index.html" target="_blank" rel="noopener">Ouvrir « Équilibrer une réaction » ↗</a></div>`;
  } else {
    html = `<div class="callout-success er-retour"><p><b class="er-ok">Tu as les bases nécessaires.</b> Passons aux combustions.</p>
      ${conseils.length ? `<p>Pour consolider, tu peux revoir (nouvel onglet) :</p><ul class="er-liste">${conseils.join('')}</ul>` : ''}</div>`;
  }
  const c = carte(`<h3 class="cours-titre">Bilan</h3>${chips}${html}`);
  continuer(c, partieC, ko.length >= 2 ? 'Continuer quand même →' : 'Continuer →');
  return c;
}

/* ---------- C. Les combustions ---------- */
function partieC() {
  const c = carte(`<h3 class="cours-titre">Les combustions</h3>
    <div class="cle"><p><b class="cle-titre">Toujours la même équation</b> · Une combustion dans le dioxygène a toujours la même forme :</p>
      <p class="co-formule">combustible + O<sub>2</sub> → CO<sub>2</sub> + H<sub>2</sub>O</p>
      <p class="co-legende">Le dioxygène O<sub>2</sub> est toujours un <b>réactif</b> ; le dioxyde de carbone CO<sub>2</sub> et l'eau H<sub>2</sub>O sont toujours les <b>produits</b>.</p></div>
    <div class="cle"><p><b class="cle-titre">Toujours le même ordre pour équilibrer</b></p>
      <ol class="er-liste" style="margin:0"><li><b>C</b> : le carbone, avec le nombre devant CO<sub>2</sub> ;</li><li><b>H</b> : l'hydrogène, avec le nombre devant H<sub>2</sub>O ;</li>
      <li><b>O en dernier</b>, avec le nombre devant O<sub>2</sub> : cette molécule ne contient que de l'oxygène, la modifier ne change ni C ni H.</li></ol>
      <p class="co-legende" style="margin-top:6px">Uniquement des <b>nombres entiers</b> : s'il faudrait un demi, on multiplie tous les nombres par 2.</p></div>`);
  continuer(c, () => guidee(1, 'CH4', () => guidee(2, 'C3H8', () => guidee(3, 'C2H6', retenir))), 'Exemple 1 →');
  return c;
}

// Exemple guidé : espèces, puis C, puis H, puis O (et ×2 si un demi apparaît)
function guidee(num, f, suite) {
  const coef = CO.coefs(f), demi = coef[0] === 2, nb = el => MOL.nb(f, el);
  const c = carte(`<span class="co-etape">EXEMPLE ${num}${demi ? ' · LE CAS DU DEMI' : ''}</span><h3 class="cours-titre">Combustion du ${CO.COMB[f].nom}</h3><div data-x="esp"></div>`, 'co-guidee');
  CO.question(c.querySelector('[data-x="esp"]'), { parties: [{ type: 'especes', comb: f, q: 'Complète l\'équation avec les bonnes espèces.' }] }, { fin: equilibrer });
  function equilibrer() {
    const box = document.createElement('div');
    box.innerHTML = `<p class="co-etape" data-x="et" style="margin-top:14px"></p><p class="co-guide" data-x="guide" style="margin:0 0 6px"></p>
      <div data-x="r"></div><div data-x="ret"></div>
      <div class="er-actions" data-x="act"><button type="button" class="btn-primary" data-x="ok">Vérifier</button><button type="button" class="btn-secondary co-impossible hidden" data-x="imp">Impossible avec un nombre entier</button></div>`;
    c.appendChild(box);
    const $ = x => box.querySelector(`[data-x="${x}"]`), ret = $('ret');
    const reac = new ER.Reaction($('r'), { reactifs: [f, 'O2'], produits: ['CO2', 'H2O'], comptes: true, onChange: () => { if (!fini) ret.innerHTML = ''; } });
    let etape = 'C', fini = false;
    const ETAPES = {
      C: { t: 'ÉTAPE 1 · LE CARBONE C', a: [2], g: `${fH(f)} contient ${nb('C')} atome${nb('C') > 1 ? 's' : ''} de carbone. Règle le nombre devant ${fH('CO2')} pour avoir autant d'atomes C de chaque côté.` },
      H: { t: 'ÉTAPE 2 · L\'HYDROGÈNE H', a: [3], g: `${fH(f)} contient ${nb('H')} atomes d'hydrogène, et chaque ${fH('H2O')} en contient 2. Règle le nombre devant ${fH('H2O')}.` },
      O: { t: 'ÉTAPE 3 · L\'OXYGÈNE O, EN DERNIER', a: [1], g: `Compte les atomes O dans les produits${nb('O') ? ' (sans oublier celui du combustible dans les réactifs)' : ''}, puis règle le nombre devant ${fH('O2')}. Si c'est impossible avec un nombre entier, touche « Impossible avec un nombre entier ».` },
      X2: { t: 'ÉTAPE 4 · PAS DE DEMI : ON MULTIPLIE TOUT PAR 2', a: [0, 1, 2, 3], g: 'Multiplie <b>tous</b> les nombres stœchiométriques par 2 (y compris celui du combustible), puis vérifie.' },
    };
    function aller(e, msg) {
      etape = e;
      reac.sels.forEach((s, k) => s.activer(ETAPES[e].a.includes(k)));
      $('et').textContent = ETAPES[e].t;
      $('guide').innerHTML = ETAPES[e].g;
      $('imp').classList.toggle('hidden', e !== 'O');
      ret.innerHTML = msg ? `<p class="co-ok">${msg}</p>` : '';
    }
    const erreur = h => { ret.innerHTML = `<div class="callout-danger er-retour"><p><b class="er-ko">Pas encore.</b> ${h}</p></div>`; secouer($('r')); };
    aller('C');
    $('ok').onclick = () => {
      if (fini) return;
      const v = reac.verifier(), B = e => v.bilan.find(x => x.el === e), C = B('C'), H = B('H'), O = B('O');
      if (etape === 'C') {
        if (C.r === C.p) aller('H', `✓ Carbone : ${C.r} atome${C.r > 1 ? 's' : ''} de chaque côté.`);
        else erreur(`Carbone : ${C.r} dans les réactifs, ${C.p} dans les produits.`);
      } else if (etape === 'H') {
        if (H.r === H.p) aller('O', `✓ Hydrogène : ${H.r} atomes de chaque côté.`);
        else erreur(`Hydrogène : ${H.r} dans les réactifs, ${H.p} dans les produits. Chaque ${fH('H2O')} contient 2 atomes H.`);
      } else if (etape === 'O') {
        if (O.r === O.p) terminer();
        else erreur(`Oxygène : ${O.r} dans les réactifs, ${O.p} dans les produits. Chaque ${fH('O2')} apporte 2 atomes O.${demi ? ' Peux-tu vraiment y arriver avec un nombre entier ?' : ''}`);
      } else if (v.equilibree && v.minimale) terminer();
      else erreur(CO.indiceCombustion(f, reac.coefs));
    };
    $('imp').onclick = () => {
      if (fini || etape !== 'O') return;
      const v = reac.verifier(), O = v.bilan.find(x => x.el === 'O'), apport = O.r - 2 * reac.coefs[1], besoin = (O.p - apport) / 2;
      if (demi) {
        aller('X2');
        ret.innerHTML = `<div class="callout-accent er-retour"><p><b>Bien vu !</b> Il faut ${O.p} atomes O dans les produits${apport ? `, dont ${apport} apporté${apport > 1 ? 's' : ''} par le combustible` : ''} : il faudrait ${CO.fmt(besoin)} ${fH('O2')}. On ne peut pas couper une molécule en deux, les nombres stœchiométriques doivent être <b>entiers</b>.</p></div>`;
      } else erreur(`Si, c'est possible : il faut ${O.p - apport} atomes O apportés par le dioxygène, soit ${CO.fmt(besoin)} ${fH('O2')}.`);
    };
    function terminer() {
      fini = true;
      reac.activer(false);
      $('act').innerHTML = '';
      ret.innerHTML = `<div class="callout-success er-retour"><p><b class="er-ok">Équilibrée !</b></p><p class="er-eq">${CO.equation(f)}</p>
        ${demi ? `<p>Avec 1 ${fH(f)}, il aurait fallu ${CO.fmt(coef[1] / 2)} ${fH('O2')} : on a tout multiplié par 2.</p>` : ''}</div>`;
      continuer(c, suite, num < 3 ? `Exemple ${num + 1} →` : 'Continuer →');
    }
  }
  return c;
}

function retenir() {
  const c = carte(`<h3 class="cours-titre">À retenir</h3>
    <div class="cle"><p class="co-formule">combustible + O<sub>2</sub> → CO<sub>2</sub> + H<sub>2</sub>O</p>
      <p>On équilibre dans l'ordre : <b>C</b> (avec CO<sub>2</sub>), puis <b>H</b> (avec H<sub>2</sub>O), puis <b>O en dernier</b> (avec O<sub>2</sub>).</p>
      <p>Que des nombres entiers : s'il faudrait un demi de O<sub>2</sub>, on multiplie tous les nombres par 2.</p></div>
    <div class="er-actions"><button type="button" class="btn-primary" id="go">Entraînement noté : 10 combustions →</button></div>`);
  c.querySelector('#go').onclick = entrainement;
  return c;
}

/* ---------- D. Entraînement noté ---------- */
function entrainement() {
  CO.serie({
    app, badge: 'MODULE 2', titre: 'Entraînement : équilibrer des combustions',
    intro: '<p class="er-contexte">10 combustions de difficulté croissante, différentes à chaque essai. Pour les premières, complète d\'abord l\'équation avec les bonnes espèces ; le nombre d\'atomes est affiché pour les questions 1, 2 et 5.</p>',
    questions: BANQUE.equilibrage,
    suite: { href: 'module_3.html', label: 'Module 3 : masse, quantité de matière, masse molaire →' },
  });
  return null;
}

document.getElementById('direct').onclick = entrainement;
partieA();
CO.menu('module_2');
</script>
</body>
</html>
