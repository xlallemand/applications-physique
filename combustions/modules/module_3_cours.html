<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · COURS</span>
    <h2 class="er-titre">Masse, quantité de matière, masse molaire</h2>
    <p class="er-contexte">Pour passer de la masse de combustible brûlée à la masse de CO<sub>2</sub> rejetée, on compte les molécules en <b>moles</b>. Tu vas voir comment passer d'une masse à une quantité de matière, et inversement, puis comment faire quand on connaît un <b>volume</b>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Masses molaires atomiques : C = 12, H = 1, O = 16 g/mol.
   ============================================================ */
const { fmt, hasard, entre, exemple } = COURS;
const fH = CO.fH;
const frac = (a, b) => `<span class="co-frac"><span>${a}</span><span>${b}</span></span>`;

// Molécules des questions : « 36 g d'eau », « la masse molaire de l'eau »
const MOLECULES = [
  { f: 'H2O', de: 'd\'eau', du: 'de l\'eau' }, { f: 'CO2', de: 'de dioxyde de carbone', du: 'du dioxyde de carbone' },
  { f: 'CH4', de: 'de méthane', du: 'du méthane' }, { f: 'O2', de: 'de dioxygène', du: 'du dioxygène' },
  { f: 'C3H8', de: 'de propane', du: 'du propane' }, { f: 'C2H6O', de: 'd\'éthanol', du: 'de l\'éthanol' },
  { f: 'C4H10', de: 'de butane', du: 'du butane' },
];
const masseMolaire = f => CO.M(f);

// Erreurs fréquentes sur n = m / M : produit au lieu du quotient, quotient inversé
function diagN(v, m, M) {
  if (CO.egal(v, m * M)) return 'Tu as multiplié m par M. La quantité de matière est n = m / M : on <b>divise</b> la masse par la masse molaire.';
  if (CO.egal(v, M / m)) return 'Tu as calculé M / m. C\'est la masse qu\'on divise : n = m / M.';
  return 'Applique n = m / M, avec m en g et M en g/mol.';
}
function diagM(v, n, M) {
  if (CO.egal(v, n / M)) return 'Tu as divisé n par M. Pour retrouver la masse, on <b>multiplie</b> : m = n × M.';
  if (CO.egal(v, M / n)) return 'Tu as calculé M / n. La masse est m = n × M.';
  return 'Applique m = n × M, avec n en mol et M en g/mol.';
}
// Erreurs fréquentes sur une masse molaire : un atome compté une seule fois
function diagMolaire(v, f) {
  const atomes = MOL.analyser(f);
  if (v === atomes.reduce((s, a) => s + CO.MASSES[a.el], 0)) return 'Tu as compté chaque élément une seule fois. Multiplie la masse molaire de chaque atome par son nombre dans la formule (l\'indice).';
  if (v === atomes.reduce((s, a) => s + a.n, 0)) return 'Tu as compté les atomes. Il faut additionner leurs masses molaires : M(C) = 12, M(H) = 1, M(O) = 16 g/mol.';
  return 'Additionne les masses molaires de tous les atomes : ' + CO.calculM(f, true) + '.';
}

/* ---------- 1. La quantité de matière ---------- */
function etape1(c) {
  const carte = c.carte('1. Passer de la masse à la quantité de matière');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Les molécules sont trop petites pour être comptées une par une : on les compte par paquets, les <b>moles</b>. La <b>quantité de matière</b> n (le nombre de moles) se calcule à partir de la masse m et de la <b>masse molaire</b> M, la masse d'une mole.</p>
      <div class="cle"><p class="co-formule">n = ${frac('m', 'M')}</p>
        <p class="co-legende"><b>n</b> : quantité de matière en <span class="co-unite-tag">mol</span> · <b>m</b> : masse en <span class="co-unite-tag">g</span> · <b>M</b> : masse molaire en <span class="co-unite-tag">g/mol</span></p>
        <p class="co-legende">La même relation s'écrit aussi <b>m = n × M</b> ou <b>M = m / n</b>.</p></div>
    </div>
    ${exemple(`<p>On brûle m = 64 g de méthane CH<sub>4</sub>, de masse molaire M = 16 g/mol.</p>
      <p class="crs-calc">n = ${frac('m', 'M')} = ${frac('64', '16')} = <span class="c">4 mol</span></p>`)}`);
  // m multiple de M pour que le résultat tombe juste
  const a = hasard(MOLECULES.slice(0, 4)), Ma = masseMolaire(a.f), na = entre(2, 5);
  const b = hasard(MOLECULES.slice(4)), Mb = masseMolaire(b.f), nb = hasard([0.5, 1.5, 2.5, 3]);
  const d = hasard(MOLECULES.slice(0, 2)), Md = masseMolaire(d.f), nd = entre(2, 6);
  c.aToi(carte, [
    { titre: 'De la masse à la quantité de matière',
      enonce: `<p>On dispose de m = ${fmt(na * Ma)} g ${a.de} ${fH(a.f)}, de masse molaire M = ${Ma} g/mol.</p>`,
      parties: [{ type: 'nombre', q: 'Quelle est la quantité de matière ?', label: 'n =', unite: 'mol', valeur: na, signe: false,
        diag: v => diagN(v, na * Ma, Ma), solution: `<p class="crs-calc">n = ${frac(fmt(na * Ma), Ma)} = <span class="c">${fmt(na)} mol</span></p>` }] },
    { titre: 'Un résultat non entier',
      enonce: `<p>On brûle m = ${fmt(nb * Mb)} g ${b.de} ${fH(b.f)}, de masse molaire M = ${Mb} g/mol.</p>`,
      parties: [{ type: 'nombre', q: 'Quelle quantité de matière de combustible brûle-t-on ?', label: 'n =', unite: 'mol', valeur: nb, signe: false,
        diag: v => diagN(v, nb * Mb, Mb), solution: `<p class="crs-calc">n = ${frac(fmt(nb * Mb), Mb)} = <span class="c">${fmt(nb)} mol</span></p>` }] },
    { titre: 'Dans l\'autre sens',
      enonce: `<p>Une combustion forme n = ${nd} mol ${d.de} ${fH(d.f)}, de masse molaire M = ${Md} g/mol.</p>`,
      parties: [{ type: 'nombre', q: 'Quelle masse cela représente-t-il ?', label: 'm =', unite: 'g', valeur: nd * Md, signe: false,
        diag: v => diagM(v, nd, Md), solution: `<p class="crs-calc">m = n × M = ${nd} × ${Md} = <span class="c">${fmt(nd * Md)} g</span></p>` }] },
  ]);
  return carte;
}

/* ---------- 2. Vérifier avec les unités ---------- */
function etape2(c) {
  const carte = c.carte('2. Vérifier une formule avec les unités');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Les unités se calculent comme les nombres. Si la formule est juste, l'unité du résultat est la bonne.</p>
      <div class="cle"><p class="co-formule">n = ${frac('m', 'M')} → ${frac('g', 'g/mol')} = g × ${frac('mol', 'g')} = mol ✓</p></div>
    </div>
    ${exemple(`<p>Un élève écrit n = m × M. Unité : g × g/mol = g²/mol. Ce n'est pas des moles : la formule est <b>fausse</b>.</p>`)}`);
  c.aToi(carte, [
    { titre: 'Quelle formule donne une masse ?',
      parties: [{ type: 'choix', q: 'On connaît n (en mol) et M (en g/mol). Quelle formule donne une masse en g ?', melanger: false,
        options: [{ id: 'nM', label: 'm = n × M' }, { id: 'n/M', label: `m = ${frac('n', 'M')}` }, { id: 'M/n', label: `m = ${frac('M', 'n')}` }],
        bonne: 'nM',
        indices: { 'n/M': `Unité : ${frac('mol', 'g/mol')} = mol²/g. Ce n'est pas des grammes.`, 'M/n': `Unité : ${frac('g/mol', 'mol')} = g/mol². Ce n'est pas des grammes.` },
        solution: '<p>mol × g/mol = g : c\'est bien une masse.</p>' }] },
    { titre: 'Quelle formule donne une masse molaire ?',
      parties: [{ type: 'choix', q: 'On connaît m (en g) et n (en mol). Quelle formule donne une masse molaire en g/mol ?', melanger: false,
        options: [{ id: 'mn', label: 'M = m × n' }, { id: 'm/n', label: `M = ${frac('m', 'n')}` }, { id: 'n/m', label: `M = ${frac('n', 'm')}` }],
        bonne: 'm/n',
        indices: { mn: 'Unité : g × mol. Ce n\'est pas des g/mol.', 'n/m': `Unité : ${frac('mol', 'g')}, c'est l'inverse de g/mol.` },
        solution: `<p>${frac('g', 'mol')} = g/mol : c'est bien une masse molaire.</p>` }] },
  ]);
  return carte;
}

/* ---------- 3. Masse molaire d'une molécule ---------- */
function etape3(c) {
  const carte = c.carte('3. Calculer la masse molaire d\'une molécule');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>La masse molaire d'une molécule est la somme des masses molaires de ses atomes : chaque masse est <b>multipliée par le nombre d'atomes</b> (l'indice dans la formule).</p>
      <div class="cle"><p>M(C) = 12 g/mol ; M(H) = 1 g/mol ; M(O) = 16 g/mol.</p></div>
    </div>
    ${exemple(`<p>L'eau H<sub>2</sub>O contient 2 atomes H et 1 atome O :</p>
      <p class="crs-calc">M(H<sub>2</sub>O) = 2 × M(H) + M(O) = 2 × 1 + 16 = <span class="c">18 g/mol</span></p>`)}`);
  const item = (titre, f) => ({ titre, enonce: `<p>Calcule la masse molaire ${MOLECULES.find(m => m.f === f).du} ${fH(f)}.</p>`,
    parties: [{ type: 'nombre', label: `M(${fH(f)}) =`, unite: 'g/mol', valeur: masseMolaire(f), tol: 0, signe: false, entier: true,
      diag: v => diagMolaire(v, f), solution: `<p class="crs-calc">${CO.calculM(f)}</p>` }] });
  c.aToi(carte, [
    item('Deux éléments', hasard(['CO2', 'CH4'])),
    item('Plus d\'atomes', hasard(['C3H8', 'C4H10'])),
    item('Trois éléments', 'C2H6O'),
  ]);
  return carte;
}

/* ---------- 4. Quand on connaît un volume ---------- */
// liquides (masse volumique en g/mL) et erreurs fréquentes sur m = ρ × V et n = c × V
const LIQUIDES = [{ nom: 'd\'éthanol', rho: 0.79 }, { nom: 'd\'octane', rho: 0.70 }, { nom: 'de pentane', rho: 0.63 }, { nom: 'd\'heptane', rho: 0.68 }];
function diagRho(v, rho, V) {
  if (CO.egal(v, V / rho)) return 'Tu as divisé le volume par la masse volumique. La masse volumique est la masse d\'un millilitre : m = ρ × V, on <b>multiplie</b>.';
  if (CO.egal(v, rho / V)) return 'Tu as divisé ρ par V. La masse est m = ρ × V.';
  return 'Applique m = ρ × V, avec ρ en g/mL et V en mL.';
}
function diagC(v, c, VL) {
  if (CO.egal(v, c * VL * 1000)) return 'Le volume doit être en <b>litres</b>, comme dans l\'unité de c (mol/L) : 1 mL = 10<sup>−3</sup> L.';
  if (CO.egal(v, c / VL) || CO.egal(v, VL / c)) return 'La quantité de matière est n = c × V : on <b>multiplie</b> la concentration par le volume.';
  return 'Applique n = c × V, avec c en mol/L et V en L.';
}
function etape4(c) {
  const carte = c.carte('4. Quand on connaît un volume');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>On ne connaît pas toujours la masse : pour un liquide, l'énoncé donne parfois son <b>volume</b> V et sa <b>masse volumique</b> ρ, la masse d'un millilitre (ou d'un litre). On calcule d'abord la masse, puis n = m / M.</p>
      <div class="cle"><p class="co-formule">ρ = ${frac('m', 'V')} &nbsp;donc&nbsp; m = ρ × V</p>
        <p class="co-legende"><b>m</b> en <span class="co-unite-tag">g</span> · <b>ρ</b> en <span class="co-unite-tag">g/mL</span> · <b>V</b> en <span class="co-unite-tag">mL</span> (le même volume que dans l'unité de ρ). Eau : ρ = 1 g/mL, soit 1 kg/L.</p></div>
      <p>Pour une espèce <b>dissoute</b> dans une solution, on utilise sa <b>concentration</b> c (en quantité de matière) et le volume V de la solution :</p>
      <div class="cle"><p class="co-formule">n = c × V</p>
        <p class="co-legende"><b>n</b> en <span class="co-unite-tag">mol</span> · <b>c</b> en <span class="co-unite-tag">mol/L</span> · <b>V</b> en <span class="co-unite-tag">L</span></p></div>
    </div>
    ${exemple(`<p>2,0 mL d'éthanol ${fH('C2H6O')}, de masse volumique ρ = 0,79 g/mL et de masse molaire M = 46 g/mol :</p>
      <p class="crs-calc">m = ρ × V = 0,79 × 2,0 = 1,58 g, puis n = ${frac('m', 'M')} = ${frac('1,58', '46')} = <span class="c">0,034 mol</span></p>
      <p>0,50 L d'une solution de concentration c = 0,20 mol/L :</p>
      <p class="crs-calc">n = c × V = 0,20 × 0,50 = <span class="c">0,10 mol</span></p>`)}`);
  const l = hasard(LIQUIDES), V1 = hasard([10, 20, 50, 100]);
  const c2 = hasard([0.1, 0.2, 0.5]), V2 = hasard([0.5, 1.5, 2]);
  const V3 = hasard([23, 46, 92]), m3 = 0.79 * V3;
  c.aToi(carte, [
    { titre: 'Du volume à la masse',
      enonce: `<p>On prélève V = ${V1} mL ${l.nom}, de masse volumique ρ = ${fmt(l.rho)} g/mL.</p>`,
      parties: [{ type: 'nombre', q: 'Quelle est la masse du liquide prélevé ?', label: 'm =', unite: 'g', valeur: l.rho * V1, signe: false, rel: .01,
        diag: v => diagRho(v, l.rho, V1), solution: `<p class="crs-calc">m = ρ × V = ${fmt(l.rho)} × ${V1} = <span class="c">${fmt(l.rho * V1)} g</span></p>` }] },
    { titre: 'Une espèce dissoute',
      enonce: `<p>On dispose de V = ${fmt(V2)} L d'une solution de concentration c = ${fmt(c2)} mol/L.</p>`,
      parties: [{ type: 'nombre', q: 'Quelle quantité de matière de l\'espèce dissoute contient-elle ?', label: 'n =', unite: 'mol', valeur: c2 * V2, signe: false, rel: .01,
        diag: v => diagC(v, c2, V2), solution: `<p class="crs-calc">n = c × V = ${fmt(c2)} × ${fmt(V2)} = <span class="c">${fmt(c2 * V2)} mol</span></p>` }] },
    { titre: 'Du volume à la quantité de matière',
      enonce: `<p>On brûle V = ${V3} mL d'éthanol ${fH('C2H6O')} : ρ = 0,79 g/mL et M = 46 g/mol.</p>`,
      parties: [
        { type: 'nombre', q: 'Calcule d\'abord la masse d\'éthanol.', label: 'm =', unite: 'g', valeur: m3, signe: false, rel: .01,
          diag: v => diagRho(v, 0.79, V3), solution: `<p class="crs-calc">m = ρ × V = 0,79 × ${V3} = <span class="c">${fmt(m3)} g</span></p>` },
        { type: 'nombre', q: 'Puis la quantité de matière d\'éthanol.', label: 'n =', unite: 'mol', valeur: m3 / 46, signe: false, rel: .02,
          diag: v => (CO.egal(v, V3 / 46) ? 'Tu as utilisé le volume à la place de la masse : n = m / M, avec la masse calculée juste avant.' : diagN(v, m3, 46)),
          solution: `<p class="crs-calc">n = ${frac('m', 'M')} = ${frac(fmt(m3), '46')} = <span class="c">${fmt(+(m3 / 46).toPrecision(3))} mol</span></p>` },
      ] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p class="co-formule">n = ${frac('m', 'M')} &nbsp;·&nbsp; m = n × M</p>
      <p class="co-legende">n en mol · m en g · M en g/mol. On vérifie une formule avec les unités.</p></div>
    <div class="cle"><p>Masse molaire d'une molécule : somme des masses molaires de ses atomes, chacune multipliée par le nombre d'atomes.</p></div>
    <div class="cle"><p class="co-formule">m = ρ × V &nbsp;·&nbsp; n = c × V</p>
      <p class="co-legende">Avec un volume : la masse d'un liquide (ρ en g/mL, V en mL), ou la quantité de matière d'une espèce dissoute (c en mol/L, V en L).</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_3.html">Questions sur la quantité de matière →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_4_cours.html">Module 4 : relations stœchiométriques</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_3.html">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, etape4, aRetenir]);
CO.menu('module_3_cours');
</script>
</body>
