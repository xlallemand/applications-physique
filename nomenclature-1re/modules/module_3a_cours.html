<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : alcools, aldéhydes, cétones, acides carboxyliques — Nomenclature (Structure des entités organiques)</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="../../assets/orga.css">
<link rel="stylesheet" href="nom.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/orga.js"></script>
<script src="../../assets/orga-dessin.js"></script>
<script src="nom.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · COURS 1 / 2</span>
    <h2 class="er-titre">Alcools, aldéhydes, cétones, acides carboxyliques</h2>
    <p class="er-contexte">Une molécule appartient à une <b>famille</b> (classe fonctionnelle) selon son <b>groupe caractéristique</b> (groupe fonctionnel). Savoir <b>entourer</b> le groupe, le <b>nommer</b> et donner la <b>famille</b> : c'est le plus important du chapitre.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 1 du module 3 (tiré des cours 3a, 3b et 3c de terminale,
   sans les familles hors programme de 1re) : vocabulaire (famille et
   groupe caractéristique, ou classe fonctionnelle et groupe fonctionnel) ;
   le groupe hydroxyle (alcools) ; le groupe carbonyle (aldéhydes et
   cétones) ; le groupe carboxyle (acides carboxyliques) et les confusions
   classiques (acide ≠ alcool + cétone, aldéhyde ≠ cétone), qui sont les
   diagnostics de l'outil d'entourage et des choix « groupe · famille ».
   « À toi » : entourer le groupe (ORGA.partieEntourer), puis le nommer et
   donner la famille (ORGA.partiesNommerGroupes). Molécules en
   semi-développée ou en développée (pas de topologique : hors programme).
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { o, molHTML, video, familles, FAMS } = NOM;
const groupeLegende = s => ORGA.legendeHTML(ORGA.groupes(NOM.mol(s)));
const ent = (s, ec) => molHTML(s, { ecriture: ec || 'semi', entourer: true, legende: groupeLegende(s) });
// extrait d'une semi-développée : seulement le groupe caractéristique (les traits vers le reste de la molécule restent)
const extrait = (s, masquer, label) => `<span class="nom-extrait">${ORGA.dessinHTML(NOM.mol(s), { ecriture: 'semi', masquer: new Set(masquer), label, sansAide: true })}</span>`;
// « À toi » : entourer puis nommer le groupe d'une molécule fabriquée
function aToiGroupe(cle, titre, ec) {
  const x = ORGA.fabriqueFamille(cle, { min: 3, max: 6, ramMax: 1 });
  return { titre, parties: [ORGA.partieEntourer(x.mol, { ecriture: ec || 'semi' })].concat(ORGA.partiesNommerGroupes(x.mol)) };
}

/* ---------- 1. Familles et groupes ; le groupe hydroxyle ---------- */
function etape1(c) {
  const carte = c.carte('1. Familles et groupes caractéristiques ; les alcools');
  c.ajouter(carte, `${video('https://www.youtube.com/watch?v=1OQyiSniTgI', 'nomenclature en chimie organique (1)')}
    <div class="cours-bloc">
      <p><b>Vocabulaire</b> : on parle de <b>famille</b> et de <b>groupe caractéristique</b> (le plus utilisé) ; on trouve aussi <b>classe fonctionnelle</b> et <b>groupe fonctionnel</b>.</p>
      <div class="cle"><p><b class="cle-titre">À apprendre par cœur.</b> Les quatre familles de l'année :</p>
        ${familles(FAMS)}
        <p>On <b>entoure</b> le groupe : tous ses atomes (avec ou sans les H qui leur sont liés), et rien d'autre. Puis on écrit son nom et la famille entre parenthèses.</p></div>
    </div>
    ${exemple(`<div class="nom-mols">${ent('CC(C)(C)O')}${ent('CCCCO')}</div>
      <p>Le groupe hydroxyle –OH, sur un C qui ne porte pas de =O : famille des <b>alcools</b>.</p>`)}`);
  c.aToi(carte, [aToiGroupe('alcool', 'Molécule 1'), aToiGroupe('alcool', 'Molécule 2', 'developpee')]);
  return carte;
}

/* ---------- 2. Le groupe carbonyle : aldéhyde ou cétone ---------- */
function etape2(c) {
  const carte = c.carte('2. Le groupe carbonyle : aldéhyde ou cétone ?');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Le groupe carbonyle</b> : C=O (un O lié à un C par une double liaison).</p>
        <ul class="er-liste"><li>C=O <b>en bout de chaîne</b> (le C porte un H) : famille des <b>aldéhydes</b> ;</li>
        <li>C=O <b>entre deux C</b> : famille des <b>cétones</b>.</li></ul>
        <p>On entoure le C et le O (avec le H du C pour un aldéhyde, si on veut).</p></div>
    </div>
    ${exemple(`<div class="nom-mols">${ent('CC=O')}${ent('CCCC(C)=O')}${ent('CCC(C)CC=O')}${ent('CC(=O)CC(CC)CC')}</div>
      <p>Un CH=O au bout de la chaîne est un aldéhyde ; un C=O entre deux C est une cétone.</p>`)}`);
  const OPTS = [o('aldehyde', 'aldéhyde'), o('cetone', 'cétone')];
  const x = ORGA.fabriqueFamille(hasard(['aldehyde', 'cetone']), { min: 4, max: 6, ramMax: 1 });
  c.aToi(carte, [aToiGroupe('aldehyde', 'Molécule 1'), aToiGroupe('cetone', 'Molécule 2'),
    { titre: 'Aldéhyde ou cétone ?', enonce: NOM.dessin(x.mol, { ecriture: 'semi' }), parties: [{ type: 'choix', q: 'Cette molécule est-elle un aldéhyde ou une cétone ?', options: OPTS, bonne: x.res.famille, melanger: false,
      indice: 'Regarde où est le C=O : au bout de la chaîne (le C porte un H), aldéhyde ; entre deux C, cétone.', solution: `<p>${x.res.famille === 'aldehyde' ? 'C=O au bout de la chaîne : <b>aldéhyde</b>.' : 'C=O entre deux C : <b>cétone</b>.'}</p>` }] }]);
  return carte;
}

/* ---------- 3. Le groupe carboxyle ; les confusions classiques ---------- */
function etape3(c) {
  const carte = c.carte('3. Le groupe carboxyle ; les confusions classiques');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Le C=O et un OH sur le même C.</b></p>
        <ul class="nom-extraits"><li>${extrait('CC(=O)O', [0], 'groupe carboxyle : C, =O et OH')}<span>groupe <b>carboxyle</b>, famille des <b>acides carboxyliques</b>.</span></li></ul>
        <p>On entoure les trois : C, =O et OH.</p></div>
      <div class="cle"><p><b class="cle-titre">Attention.</b> <b>Acide ≠ alcool + cétone</b> : le OH et le =O sur le même C forment un seul groupe, le groupe carboxyle. <b>Aldéhyde ≠ cétone</b> : regarde où est le C=O.</p></div>
    </div>
    ${exemple(`<div class="nom-mols">${ent('CC(C)CC(=O)O')}${ent('CCC(=O)O', 'developpee')}</div>`)}`);
  const x = ORGA.fabriqueFamille(hasard(FAMS), { min: 3, max: 6, ramMax: 1 });
  c.aToi(carte, [aToiGroupe('acide', 'Molécule 1'), { titre: 'Molécule 2', parties: [ORGA.partieEntourer(x.mol, { ecriture: 'semi' })].concat(ORGA.partiesNommerGroupes(x.mol)) }]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle">${familles(FAMS)}</div>
    <div class="cle"><p>On entoure le groupe, on écrit son nom, puis la famille entre parenthèses : « groupe hydroxyle (alcools) ».</p></div>
    <div class="cle"><p>Acide ≠ alcool + cétone ; aldéhyde ≠ cétone.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_3b_cours.html">Cours : nommer alcools, aldéhydes, cétones, acides carboxyliques →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_3.html#familles">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
NOM.menu('module_3a_cours');
</script>
</body>
</html>
