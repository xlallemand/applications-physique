<title>Module 3 : nommer alcools, aldéhydes, cétones, acides carboxyliques — Nomenclature (Structure des entités organiques)</title>
<link rel="stylesheet" href="../../assets/theme.css">

<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · COURS 2 / 2</span>
    <h2 class="er-titre">Nommer alcools, aldéhydes, cétones, acides carboxyliques</h2>
    <p class="er-contexte">Même méthode que pour les alcanes, avec deux règles de plus : la chaîne principale <b>contient le groupe</b>, et le <b>numéro du groupe</b> est le plus petit possible. La terminaison donne la famille.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : nommer les molécules qui ont un
   groupe (alcools, aldéhydes, cétones, acides carboxyliques ; tiré du
   cours 3d de terminale, sans alcènes ni halogénoalcanes) : la chaîne
   principale contient le groupe, le n° est celui du C qui porte le
   groupe ; terminaisons ; les acides carboxyliques (acide …oïque).
   « À toi » : l'outil de nomenclature (aides activées, étape « groupe »
   en tête), puis un nom à écrire directement (sans aide).
   Molécules en semi-développée (pas de topologique : hors programme).
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { o, molHTML, video } = NOM;
// une molécule en couleurs, groupe entouré, avec son nom
const ex = (s, ec, note) => molHTML(s, { nom: true, ecriture: ec || 'semi', entourer: ORGA.groupes(NOM.mol(s)).map(g => ({ atomes: g.atomes, avecH: g.avecH })), legende: note ? `<p class="nom-avert">${note}</p>` : '' });
// « À toi » : nommer une molécule fabriquée d'une famille (aides activées ; sansAide : nom écrit directement)
const aToiNom = (cle, titre, sansAide) => {
  const x = ORGA.fabriqueFamille(cle, { min: 3, max: 6, ramMax: 1 });
  return { titre, parties: [NOM.partieNom(x.mol, sansAide ? { ecriture: 'semi', sansAide: true, q: 'Écris directement le nom de cette molécule.' } : { ecriture: 'semi' })] };
};

/* ---------- 1. La chaîne contient le groupe ; le numéro du groupe ---------- */
function etape1(c) {
  const carte = c.carte('1. La chaîne contient le groupe ; le numéro du groupe');
  c.ajouter(carte, `${video('https://www.youtube.com/watch?v=d-w-bRSgWgg', 'nommer les molécules (vidéo longue qui prend le temps d\'expliquer)', 'Attention : dans la vidéo, il met des tirets partout ; il n\'y a des tirets qu\'entre les lettres et les chiffres. Elle parle aussi de familles que tu verras en terminale.')}
    <div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Règles.</b></p>
        <ol class="er-liste">
          <li>La <b>chaîne principale</b> est la plus longue qui <b>contient le groupe caractéristique</b> (elle passe par le C qui porte le groupe).</li>
          <li><b>Le n° est celui de l'atome de carbone qui porte le groupe caractéristique</b> : il doit être le plus petit possible. Il s'écrit juste devant la terminaison : propan-2-ol.</li>
          <li>Les <b>ramifications</b> de la chaîne principale sont écrites au début.</li>
        </ol></div>
    </div>
    ${exemple(`<div class="nom-mols">${ex('CCC(C)O')}${ex('CC(C)(C)O')}${ex('OCC(CC)CCC', 'semi', 'La chaîne la plus longue a 6 C, mais elle ne passe pas par le C qui porte le OH : la chaîne principale a 5 C.')}</div>`)}`);
  c.aToi(carte, [aToiNom('alcool', 'Molécule 1'), aToiNom('alcool', 'Molécule 2'), aToiNom('alcool', 'Sans aide', true)]);
  return carte;
}

/* ---------- 2. Les terminaisons ---------- */
function etape2(c) {
  const carte = c.carte('2. Les terminaisons');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><div class="crs-defile"><table class="crs-tab"><thead><tr><th>Famille</th><th>Nom</th><th>Exemple</th></tr></thead><tbody>
        <tr><td>alcool</td><td>…an-n-<b>ol</b></td><td>butan-2-ol</td></tr>
        <tr><td>aldéhyde</td><td>…an<b>al</b></td><td>butanal</td></tr>
        <tr><td>cétone</td><td>…an-n-<b>one</b></td><td>butan-2-one</td></tr>
        <tr><td>acide carboxylique</td><td><b>acide</b> …an<b>oïque</b></td><td>acide butanoïque</td></tr></tbody></table></div>
        <p>-al, -oïque : le C du groupe est le n° 1 ; on n'écrit pas son numéro. Devant une voyelle, « ane » perd son e : butan<b>-2-ol</b>, butan<b>al</b>.</p></div>
    </div>
    ${exemple(`<div class="nom-mols">${ex('CC=O')}${ex('CCCC(C)=O')}${ex('CCC(C)CC=O')}</div>`)}`);
  c.aToi(carte, [aToiNom('aldehyde', 'Molécule 1'), aToiNom('cetone', 'Molécule 2'), aToiNom(hasard(['aldehyde', 'cetone', 'alcool']), 'Sans aide', true)]);
  return carte;
}

/* ---------- 3. Les acides carboxyliques : acide …oïque ---------- */
function etape3(c) {
  const carte = c.carte('3. Nommer un acide carboxylique');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Règle.</b> Le nom d'un acide carboxylique est un peu différent des autres : on ajoute le mot « <b>acide</b> » <b>avant</b> le nom, et le nom finit par « <b>oïque</b> » : acide …an<b>oïque</b>.</p>
        <p>Le C du groupe carboxyle est le n° 1 de la chaîne principale : on n'écrit pas son numéro. Les ramifications se placent entre « acide » et le nom de la chaîne : acide 3-méthylbutanoïque.</p></div>
    </div>
    ${exemple(`<div class="nom-mols">${ex('CCC(=O)O')}${ex('CC(C)CC(=O)O')}${ex('CCCC(CC)C(=O)O')}</div>
      <p>acide + 3-méthyl + butan + oïque : acide 3-méthylbutanoïque. Le « e » de « ane » tombe devant « oïque ».</p>`)}`);
  c.aToi(carte, [aToiNom('acide', 'Acide 1'), aToiNom('acide', 'Acide 2'), aToiNom('acide', 'Sans aide', true)]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p>La chaîne principale <b>contient le groupe</b> ; le n° est celui du C qui porte le groupe, le plus petit possible.</p></div>
    <div class="cle"><p>-ol (butan-2-ol), -al (butanal), -one (butan-2-one) ; devant une voyelle, « ane » perd son e.</p></div>
    <div class="cle"><p>Acide carboxylique : « acide » avant le nom, terminaison « oïque » : acide 3-méthylbutanoïque.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_3_entourer.html">Atelier : entourer les groupes →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_3_questions.html">Questions</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_3.html#nommer">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
NOM.menu('module_3b_cours');
</script>
</body>
</html>
