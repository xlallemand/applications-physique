<title>Module 5 : la formule topologique — Nomenclature (Structure des entités organiques)</title>

<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 5 · COURS 1 / 2</span>
    <h2 class="er-titre">La formule topologique</h2>
    <p class="er-contexte">Une troisième écriture, la plus rapide à dessiner : la formule <b>topologique</b>. Elle est la plus utilisée en terminale.</p>
    <div class="callout nom-hp"><p><b>Hors programme de 1re.</b> Ce module est là pour te préparer à la terminale.</p></div>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Module 5 (hors programme de 1re, pour se préparer à la terminale ;
   tiré du cours 1b de terminale) : la formule topologique (compter les
   C, formule brute : piège des H implicites ; aide pas à pas visible,
   NOM.aideTopo : C repérés, H de chaque C = 4 − nombre de traits, autres
   atomes), puis trois molécules dans les trois écritures et reconnaître
   une écriture. Molécules des familles au programme de 1re.
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { o, molHTML, trois, video, partieBrute, EC } = NOM;

const TROIS = ['CC(C)C(O)C', 'CCC(=O)CC(C)C', 'CC(C)CC(=O)O'];
const DIVERSES = ['CC(C)CC(C)O', 'CCC(C)CC=O', 'CC(C)CC(=O)O', 'CCCC(C)(C)O', 'CCC(=O)CC', 'CC(C)CC(C)C', 'CCC(C)C(=O)O', 'CC(C)C(C)=O'];
const OPTS_EC = [o('developpee', 'développée'), o('semi', 'semi-développée'), o('topo', 'topologique')];
const IND_EC = {
  developpee: 'En développée, on voit <b>tous</b> les atomes, H compris, et toutes les liaisons.',
  semi: 'En semi-développée, les H sont regroupés sur leur atome : CH₃, CH₂, OH…',
  topo: 'En topologique, les C ne sont pas écrits : chaque sommet, chaque bout de trait est un C.',
};
// reconnaître l'écriture d'une molécule tirée au hasard
function reconnaitre(titre) {
  const ec = hasard(['developpee', 'semi', 'topo']), s = hasard(DIVERSES);
  return { titre, enonce: `<div class="nom-fig">${ORGA.dessinHTML(NOM.mol(s), { ecriture: ec, label: 'Formule à reconnaître' })}</div>`,
    parties: [{ type: 'choix', q: 'Quelle est cette écriture ?', options: OPTS_EC, bonne: ec, melanger: false,
      indices: Object.fromEntries(OPTS_EC.filter(x => x.id !== ec).map(x => [x.id, IND_EC[ec]])), solution: `<p>Formule <b>${EC[ec].toLowerCase()}</b>.</p>` }] };
}

/* ---------- 1. La formule topologique ---------- */
function etape1(c) {
  const carte = c.carte('1. La formule topologique');
  c.ajouter(carte, `${video('https://www.youtube.com/watch?v=OMv3DIvZFYU', 'la formule topologique (1)')}${video('https://www.youtube.com/watch?v=PSQ_g8mJQzs', 'la formule topologique (2)')}
    <div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Formule topologique.</b> On ne représente <b>ni les atomes de carbone</b>, <b>ni les atomes d'hydrogène liés à des carbones</b>. La chaîne est dessinée en <b>zigzag</b> ; <b>chaque sommet et chaque bout de trait est un C</b>. Les autres atomes (O…) sont écrits, avec leurs H : OH.</p></div>
      <p>Chaque C a 4 liaisons : ses H, qu'on ne voit pas, complètent (4 − nombre de traits).</p>
    </div>
    ${exemple(`<div class="nom-mols">${molHTML(TROIS[0], { titre: 'Semi-développée', ecriture: 'semi' })}${molHTML(TROIS[0], { titre: 'Topologique', ecriture: 'topo' })}</div>
      <p>5 sommets et bouts de trait sans lettre : 5 C. Le C qui porte OH a 3 traits : il porte 1 H. Formule brute : C<sub>5</sub>H<sub>12</sub>O.</p>`)}`);
  const [a, b] = melanger(['CC(C)CC(C)C', 'CCC(C)CO', 'CCCC(C)C(=O)O', 'CCC(=O)CC(C)C', 'CC(C)(C)CCO', 'CCC(C)CC=O']).slice(0, 2);
  const nC = s => NOM.mol(s).atomes.filter(x => x.el === 'C').length;
  // aide pas à pas, visible : chaque C repéré sur le dessin, puis le calcul des H de chaque C
  c.aToi(carte, [
    { titre: 'Compter les C', enonce: NOM.aideTopo(a, { seulementC: true }),
      parties: [{ type: 'nombre', q: 'Combien d\'atomes de carbone a cette molécule ?', label: 'Nombre de C :', valeur: nC(a), entier: true, signe: false, tol: 0,
        diag: v => (v < nC(a) ? 'Tu as oublié des C : <b>chaque bout de trait</b> est aussi un C, pas seulement les sommets.' : 'Compte une seule fois chaque sommet et chaque bout de trait sans lettre.'), solution: `<p><b>${nC(a)} C</b> (sommets et bouts de trait).</p>` }] },
    { titre: 'Formule brute', enonce: NOM.aideTopo(b),
      parties: [partieBrute(NOM.mol(b), { ecriture: 'topo', partie: { q: 'Écris la formule brute de cette molécule : d\'abord les C, puis les H (additionne les H de chaque C, sans oublier ceux des autres atomes), puis les autres atomes.' } })] },
  ]);
  return carte;
}

/* ---------- 2. Les trois écritures côte à côte ---------- */
function etape2(c) {
  const carte = c.carte('2. Les trois écritures côte à côte');
  c.ajouter(carte, `<div class="cours-bloc"><p>Trois molécules, chacune dans les trois écritures.</p></div>
    ${exemple(TROIS.map(s => trois(s)).join(''))}`);
  c.aToi(carte, [reconnaitre('Écriture 1'), reconnaitre('Écriture 2'), reconnaitre('Écriture 3')]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p><b>Topologique</b> : ni les C, ni les H liés aux C ; zigzag ; chaque sommet et chaque bout de trait est un C ; les autres atomes écrits avec leurs H.</p></div>
    ${trois(TROIS[0])}
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_5b_cours.html">Cours : passer d'une écriture à l'autre →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_5.html#topologique">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
NOM.menu('module_5a_cours');
</script>
</body>
</html>
