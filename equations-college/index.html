<style>
    :root {

    /* ── Badges de score par question ────────── */

    @keyframes toastIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateY(-8px)} }
    @keyframes floatUp { 0%{opacity:1;transform:translate(-50%,0)} 100%{opacity:0;transform:translate(-50%,-60px)} }

<!-- Zone des messages flottants -->

<script>
'use strict';

// ═══════════════════════════════════════════════════════
//  CONSTANTES ET DÉFINITION DES MODULES
// ═══════════════════════════════════════════════════════

const MODULES = [
  { id:0, emoji:'➕', title:'Termes additifs',       desc:'x + a = b  ·  Changer le signe en passant un terme', skills:['signe'],            optSteps:1, maxSteps:2 },
  { id:1, emoji:'✖️', title:'Termes multiplicatifs',  desc:'ax = b  ·  La multiplication devient division',     skills:['mult'],             optSteps:1, maxSteps:2 },
  { id:2, emoji:'📐', title:'Deux opérations',        desc:'ax + b = c  ·  Combiner les deux règles',           skills:['signe','mult'],      optSteps:2, maxSteps:3 },
  { id:3, emoji:'⚖️', title:'x des deux côtés',       desc:'ax + b = cx + d  ·  Regrouper les x',               skills:['signe','mult','2x'], optSteps:3, maxSteps:4 },
  { id:4, emoji:'½',  title:'Résultats fractionnaires',desc:'Exprimer la solution en fraction irréductible',     skills:['frac'],             optSteps:2, maxSteps:3 },
  { id:5, emoji:'📦', title:'Développement simple',   desc:'a(x + b) = c  ·  Développer les parenthèses',      skills:['dev'],              optSteps:2, maxSteps:4 },
  { id:6, emoji:'➖', title:'Facteurs négatifs',       desc:'−(ax + b) = cx + d  ·  Signes et double négation',  skills:['signe','dev'],      optSteps:3, maxSteps:5 },
  { id:7, emoji:'🔥', title:'Tout combiné',            desc:'Équations complexes — toutes les compétences',      skills:['all'],              optSteps:4, maxSteps:6 },
];

const SPEED_THRESHOLDS = [40,40,60,75,60,90,100,120]; // secondes par module pour le bonus de rapidité maximal
const Q_PER_MODULE = 10;

// ═══════════════════════════════════════════════════════
//  OUTILS
// ═══════════════════════════════════════════════════════

function rand(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }
function choice(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function randNZ(min, max) { let v; do { v = rand(min, max); } while(v===0); return v; }
function gcd(a, b) { a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a||1; }
function reduceFrac(n, d) {
  if(d<0){n=-n;d=-d;}
  const g=gcd(Math.abs(n),d);
  return {n:n/g, d:d/g};
}
function fracToStr(n, d) {
  const r=reduceFrac(n,d);
  return r.d===1 ? String(r.n) : `(${r.n}/${r.d})`;
}
// Vrai si toutes les fractions a/b (ou (a/b)) écrites dans la ligne sont irréductibles
// (dénominateur positif différent de 1, numérateur et dénominateur premiers entre eux)
function fractionsIrreductibles(str) {
  const re=/(-?\d+)\s*\/\s*(-?\d+)/g;
  let m;
  while((m=re.exec(str))){
    const n=parseInt(m[1]), d=parseInt(m[2]);
    if(d<=1||gcd(n,d)!==1) return false;
  }
  return true;
}

// ═══════════════════════════════════════════════════════
//  EXPRESSION AFFINE : ax + b
// ═══════════════════════════════════════════════════════

class LinExpr {
  constructor(a=0,b=0){ this.a=a; this.b=b; }
  add(e){ return new LinExpr(this.a+e.a, this.b+e.b); }
  sub(e){ return new LinExpr(this.a-e.a, this.b-e.b); }
  neg()  { return new LinExpr(-this.a, -this.b); }
  mul(e){
    if(this.a!==0&&e.a!==0) throw new Error('Quadratique');
    if(this.a!==0) return new LinExpr(this.a*e.b, this.b*e.b);
    return new LinExpr(this.b*e.a, this.b*e.b);
  }
  div(e){
    if(Math.abs(e.a)>1e-9) throw new Error('Division par x');
    if(Math.abs(e.b)<1e-9) throw new Error('Division par zéro');
    return new LinExpr(this.a/e.b, this.b/e.b);
  }
  static num(n){ return new LinExpr(0,n); }
  static x()   { return new LinExpr(1,0); }
}

// ═══════════════════════════════════════════════════════
//  DÉCOUPAGE EN SYMBOLES
// ═══════════════════════════════════════════════════════

function tokenize(s) {
  s = s.replace(/\s+/g,'').replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/')
        .replace(/−/g,'-').replace(/－/g,'-').replace(/＝/g,'=').replace(/，/g,'.');
  const tokens = [];
  let i = 0;
  while(i<s.length){
    if(/[0-9.]/.test(s[i])){
      let n=''; while(i<s.length&&/[0-9.]/.test(s[i])) n+=s[i++];
      tokens.push({type:'num', val:parseFloat(n)});
    } else if(s[i]==='x'||s[i]==='X'){
      tokens.push({type:'x'}); i++;
    } else if('+-*/()='.includes(s[i])){
      tokens.push({type:'op', val:s[i]}); i++;
    } else {
      i++; // caractère inconnu ignoré
    }
  }
  return tokens;
}

// ═══════════════════════════════════════════════════════
//  ANALYSEUR SYNTAXIQUE (descente récursive)  →  LinExpr
// ═══════════════════════════════════════════════════════

class Parser {
  constructor(tokens){ this.t=tokens; this.p=0; }
  peek(){ return this.p<this.t.length?this.t[this.p]:null; }
  consume(){ return this.t[this.p++]; }

  parseExpr(){ return this.parseAddSub(); }

  parseAddSub(){
    let r=this.parseMulDiv();
    while(this.peek()&&this.peek().type==='op'&&(this.peek().val==='+'||this.peek().val==='-')){
      const op=this.consume().val;
      const right=this.parseMulDiv();
      r=op==='+'?r.add(right):r.sub(right);
    }
    return r;
  }

  parseMulDiv(){
    let r=this.parseUnary();
    while(this.peek()&&this.peek().type==='op'&&(this.peek().val==='*'||this.peek().val==='/')){
      const op=this.consume().val;
      const right=this.parseUnary();
      r=op==='*'?r.mul(right):r.div(right);
    }
    return r;
  }

  parseUnary(){
    const pk=this.peek();
    if(pk&&pk.type==='op'&&pk.val==='-'){ this.consume(); return this.parsePrimary().neg(); }
    if(pk&&pk.type==='op'&&pk.val==='+'){ this.consume(); return this.parsePrimary(); }
    return this.parsePrimary();
  }

  parsePrimary(){
    const pk=this.peek();
    if(!pk) throw new Error('Inattendu fin');
    if(pk.type==='op'&&pk.val==='('){
      this.consume();
      const inner=this.parseExpr();
      if(this.peek()&&this.peek().type==='op'&&this.peek().val===')') this.consume();
      // multiplication implicite après )
      const next=this.peek();
      if(next&&(next.type==='num'||next.type==='x'||(next.type==='op'&&next.val==='('))){
        const right=this.parsePrimary();
        return inner.mul(right);
      }
      return inner;
    }
    if(pk.type==='x'){
      this.consume();
      return LinExpr.x();
    }
    if(pk.type==='num'){
      this.consume();
      const n=pk.val;
      const next=this.peek();
      // multiplication implicite : 2x ou 2(
      if(next&&next.type==='x'){ this.consume(); return new LinExpr(n,0); }
      if(next&&next.type==='op'&&next.val==='('){
        this.consume();
        const inner=this.parseExpr();
        if(this.peek()&&this.peek().type==='op'&&this.peek().val===')') this.consume();
        return LinExpr.num(n).mul(inner);
      }
      return LinExpr.num(n);
    }
    throw new Error('Token inattendu');
  }
}

function parseSide(str){
  const tokens=tokenize(str);
  const p=new Parser(tokens);
  const r=p.parseExpr();
  return r;
}

function parseEquation(equStr){
  // Renvoie {lhs, rhs, solution} ou null
  const idx=equStr.indexOf('=');
  if(idx<0) return null;
  const lStr=equStr.substring(0,idx).trim();
  const rStr=equStr.substring(idx+1).trim();
  if(!lStr||!rStr) return null;
  try {
    const lhs=parseSide(lStr);
    const rhs=parseSide(rStr);
    // (lhs.a - rhs.a)*x = rhs.b - lhs.b
    const ca=lhs.a-rhs.a;
    const cb=rhs.b-lhs.b;
    let solution;
    if(Math.abs(ca)<1e-9){
      solution=Math.abs(cb)<1e-9?'all':'none';
    } else {
      solution=cb/ca;
    }
    return {lhs,rhs,solution};
  } catch(e){
    return null;
  }
}

function equivCheck(eq1, eq2){
  const r1=parseEquation(eq1);
  const r2=parseEquation(eq2);
  if(!r1||!r2) return false;
  if(r1.solution==='all'&&r2.solution==='all') return true;
  if(r1.solution==='none'&&r2.solution==='none') return true;
  if(typeof r1.solution==='number'&&typeof r2.solution==='number'){
    return Math.abs(r1.solution-r2.solution)<1e-6;
  }
  return false;
}

function isFinalForm(equStr){
  // x = N ou N = x
  const r=parseEquation(equStr);
  if(!r||typeof r.solution!=='number') return false;
  const {lhs,rhs}=r;
  const lxOnly=(Math.abs(lhs.a-1)<1e-9&&Math.abs(lhs.b)<1e-9);
  const rxOnly=(Math.abs(rhs.a-1)<1e-9&&Math.abs(rhs.b)<1e-9);
  const lNum=(Math.abs(lhs.a)<1e-9);
  const rNum=(Math.abs(rhs.a)<1e-9);
  // on accepte aussi -x = N (solution correcte)
  const lxNeg=(Math.abs(lhs.a+1)<1e-9&&Math.abs(lhs.b)<1e-9);
  const rxNeg=(Math.abs(rhs.a+1)<1e-9&&Math.abs(rhs.b)<1e-9);
  return (lxOnly&&rNum)||(rxOnly&&lNum)||(lxNeg&&rNum)||(rxNeg&&lNum);
}

// ═══════════════════════════════════════════════════════
//  MISE EN FORME DES ÉQUATIONS
// ═══════════════════════════════════════════════════════

function fmtCoeff(a, forceSign=false) {
  if(a===1) return forceSign?'+':'' ;
  if(a===-1) return '-';
  return (forceSign&&a>0?'+':'')+a;
}

function fmtLinear(a, b) {
  // Écrit ax + b sous forme de texte
  let s='';
  if(Math.abs(a)>1e-9){
    if(a===1) s='x';
    else if(a===-1) s='-x';
    else s=a+'x';
  }
  if(Math.abs(b)>1e-9||Math.abs(a)<1e-9){
    if(Math.abs(a)>1e-9){
      s+=b>0?' + '+b:' - '+Math.abs(b);
    } else {
      s=String(b);
    }
  }
  return s||'0';
}

function fmtLinearFrac(a, b_n, b_d) {
  // ax + b_n/b_d
  let s='';
  if(Math.abs(a)>1e-9){
    s=a===1?'x':a===-1?'-x':a+'x';
  }
  const rf=reduceFrac(b_n,b_d);
  if(rf.n!==0){
    const fs=rf.d===1?String(rf.n):fracToStr(rf.n,rf.d);
    if(Math.abs(a)>1e-9) s+=rf.n>0?' + '+fs:' - '+fs.replace('-','');
    else s=fs;
  } else if(Math.abs(a)<1e-9) s='0';
  return s;
}

function renderEqHTML(str) {
  // Affiche (a/b) en fraction HTML (telle qu'elle a été écrite, sans simplification) et * en ×
  return str
    .replace(/\((-?\d+)\/(-?\d+)\)/g, (_,n,d)=>
      `<span class="frac"><span class="frac-num">${n}</span><span class="frac-den">${d}</span></span>`)
    .replace(/\*/g,'×')
    .replace(/ - /g,' − ')
    .replace(/^-/,'−');
}

// ═══════════════════════════════════════════════════════
//  GÉNÉRATEURS D'ÉQUATIONS
// ═══════════════════════════════════════════════════════

function genM0() {
  // x + a = b  (terme additif seul)
  const sol=rand(-12,12);
  const a=randNZ(-15,15);
  const b=sol+a;
  return { eq:fmtLinear(1,a)+' = '+b, sol };
}

function genM1() {
  // ax = b  (coefficient multiplicatif, solution entière)
  let sol, a;
  do { sol=randNZ(-8,8); a=randNZ(-9,9); } while(Math.abs(a)===1);
  return { eq:fmtLinear(a,0)+' = '+(a*sol), sol };
}

function genM2() {
  // ax + b = c
  let sol,a,b;
  do {
    sol=rand(-8,8); a=randNZ(-6,6);
  } while(Math.abs(a)===1);
  b=randNZ(-12,12);
  return { eq:fmtLinear(a,b)+' = '+(a*sol+b), sol };
}

function genM3() {
  // ax + b = cx + d
  let sol,a,c,b;
  do { sol=rand(-8,8); a=randNZ(-6,6); c=randNZ(-6,6); b=randNZ(-10,10); }
  while(a===c);
  const d=(a-c)*sol+b;
  return { eq:fmtLinear(a,b)+' = '+fmtLinear(c,d), sol };
}

function genM4() {
  // ax + b = c avec solution fractionnaire p/q (q dans {2,3,4,5,6})
  let a, b, q, p, c;
  do {
    q=choice([2,3,4,5,6]);
    p=randNZ(-9,9);
    // p/q doit être irréductible et non entier
    const g=gcd(Math.abs(p),q);
    if(g>1&&p/g===Math.round(p/g)){ continue; }
    // a multiple de q pour que a*(p/q) soit entier
    const k=randNZ(-4,4);
    a=k*q;
    b=randNZ(-8,8);
    c=k*p+b;
  } while(Math.abs(a)===0||Math.abs(a)===1||Math.abs(p)===q||gcd(Math.abs(p),q)>1);
  const sol=p/q;
  return {
    eq:fmtLinear(a,b)+' = '+c,
    sol,
    solFrac:reduceFrac(p,q)
  };
}

function genM5() {
  // a(x + b) = c  (développement simple)
  let sol,a,b;
  do { sol=rand(-8,8); a=randNZ(2,7); b=randNZ(-8,8); } while(Math.abs(a)===1);
  const c=a*(sol+b);
  const inner=fmtLinear(1,b);
  const lhs=a+'('+inner+')';
  return { eq:lhs+' = '+c, sol };
}

function genM6() {
  // -(ax + b) = cx + d  (facteur négatif)
  let sol,a,b,c;
  do {
    sol=rand(-6,6);
    a=rand(1,4);
    b=randNZ(-6,6);
    c=rand(-3,3);
  } while(c===-a);
  // membre de gauche : -(ax+b) = -ax-b
  // membre de droite : cx+d avec d = (-a-c)*sol - b
  const d=(-a-c)*sol-b;
  const inner=fmtLinear(a,b);
  return { eq:'-('+inner+') = '+fmtLinear(c,d), sol };
}

function genM7() {
  // a(bx + c) + dx = e(x + f) + g  (tout combiné)
  let sol,a,b,ci,d,e,f,g;
  let attempts=0;
  do {
    sol=rand(-5,5);
    a=rand(2,4); b=rand(1,3); ci=randNZ(-4,4); d=randNZ(-4,4);
    e=randNZ(-3,3); f=randNZ(-4,4);
    // coefficient de x à gauche : a*b+d
    // constante à gauche : a*ci
    // coefficient de x à droite : e
    // constante à droite : e*f + g
    // Solution: (a*b+d)*sol + a*ci = e*sol + e*f + g
    // g = (a*b+d)*sol + a*ci - e*sol - e*f
    g=(a*b+d)*sol+a*ci-e*sol-e*f;
    attempts++;
  } while((a*b+d===e)||Math.abs(g)>30);

  const lhsInner=fmtLinear(b,ci);
  let lhsParts=[a+'('+lhsInner+')'];
  if(d>0) lhsParts.push('+ '+d+'x');
  else lhsParts.push('- '+Math.abs(d)+'x');
  const lhs=lhsParts.join(' ');

  const rhsInner=fmtLinear(1,f);
  let rhs=e+'('+rhsInner+')';
  if(g>0) rhs+=' + '+g;
  else if(g<0) rhs+=' - '+Math.abs(g);

  return { eq:lhs+' = '+rhs, sol };
}

const GENERATORS=[genM0,genM1,genM2,genM3,genM4,genM5,genM6,genM7];

function generateQuestion(moduleId) {
  const gen=GENERATORS[moduleId];
  const mod=MODULES[moduleId];
  const data=gen();
  return {
    eq: data.eq,
    sol: data.sol,
    solFrac: data.solFrac||null,
    optSteps: mod.optSteps,
    maxSteps: mod.maxSteps,
  };
}

//  INDICES
// ═══════════════════════════════════════════════════════

const HINTS = {
  signe: "💡 Rappelle-toi : quand on fait passer un terme <strong>additif (+/−)</strong> de l'autre côté du signe =, son signe change : + devient − et − devient +.",
  mult:  "💡 Rappelle-toi : quand on fait passer un <strong>coefficient multiplicatif</strong> de l'autre côté, × devient ÷ et inversement.",
  dev:   "💡 Vérifie ton <strong>développement</strong> : chaque terme entre les parenthèses doit être multiplié par le facteur extérieur.",
  neg:   "💡 Attention aux <strong>signes</strong> : (−) × (−) = (+). Deux facteurs négatifs donnent un résultat positif !",
  frac:  "💡 La solution est une fraction. Exprime-la sous la forme (numérateur/dénominateur) en la réduisant au maximum.",
  gen:   "💡 Cette ligne n'est pas équivalente à la précédente. Refais l'opération en vérifiant chaque terme.",
  parse: "⚠️ La ligne que tu as écrite n'est pas une équation valide. Vérifie qu'elle contient bien un signe =.",
};

function getHint(prevEq, wrongEq, moduleId) {
  const r1=parseEquation(prevEq);
  const r2=parseEquation(wrongEq);
  if(!r2) return HINTS.parse;

  // détection d'une erreur de signe : solution exactement opposée
  if(r1&&typeof r1.solution==='number'&&typeof r2.solution==='number'){
    if(Math.abs(r2.solution+r1.solution)<1e-6&&Math.abs(r1.solution)>0.1){
      return HINTS.signe;
    }
  }

  // indice selon le module
  if(moduleId===0) return HINTS.signe;
  if(moduleId===1) return HINTS.mult;
  if(moduleId===2) return Math.random()<0.5?HINTS.signe:HINTS.mult;
  if(moduleId===4) return HINTS.frac;
  if(moduleId===5) return HINTS.dev;
  if(moduleId===6) return Math.random()<0.6?HINTS.neg:HINTS.dev;
  return HINTS.gen;
}

// ═══════════════════════════════════════════════════════
//  CALCUL DES XP
// ═══════════════════════════════════════════════════════

function calcXP(moduleId, errors, solved, seconds, stepsUsed, optSteps, maxSteps) {
  if(!solved) return 0;
  let xp=10;                                    // XP de base pour une résolution
  if(errors===0) xp+=10;                        // bonus sans erreur
  // bonus de rapidité (0–20)
  const thr=SPEED_THRESHOLDS[moduleId];
  if(seconds<thr) xp+=20;
  else if(seconds<thr*2.5) xp+=Math.round(20*(1-(seconds-thr)/(thr*1.5)));
  // bonus d'économie d'étapes (0–30)
  if(stepsUsed<=optSteps) xp+=30;
  else if(stepsUsed<maxSteps) xp+=Math.round(30*(maxSteps-stepsUsed)/(maxSteps-optSteps));
  return xp;
}

function xpLevel(totalXP) {
  // Renvoie {level, title, progress (0-1), xpToNext}
  const levels=[
    {min:0,    title:'Débutant'},
    {min:100,  title:'Initié'},
    {min:300,  title:'Apprenti'},
    {min:600,  title:'Confirmé'},
    {min:1000, title:'Expert'},
    {min:1500, title:'Maître'},
    {min:2500, title:'Légende'},
  ];
  let lvl=0;
  for(let i=0;i<levels.length;i++) if(totalXP>=levels[i].min) lvl=i;
  const cur=levels[lvl].min;
  const nxt=lvl<levels.length-1?levels[lvl+1].min:cur+1000;
  return {
    level:lvl+1,
    title:levels[lvl].title,
    progress:(totalXP-cur)/(nxt-cur),
    xpToNext:nxt-totalXP,
    cur,nxt
  };
}

function activeInput(){ return document.getElementById('activeStepInput'); }

// Insère un caractère à la position du curseur
function kbInsert(char){
  const inp=activeInput();
  if(!inp) return;
  const s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??s, v=inp.value;
  inp.value=v.substring(0,s)+char+v.substring(e);
  inp.selectionStart=inp.selectionEnd=s+char.length;
}

function kbDelete(){
  const inp=activeInput();
  if(!inp) return;
  const s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??s, v=inp.value;
  if(s===e&&s>0){ inp.value=v.substring(0,s-1)+v.substring(s); inp.selectionStart=inp.selectionEnd=s-1; }
  else { inp.value=v.substring(0,s)+v.substring(e); inp.selectionStart=inp.selectionEnd=s; }
}

function startTimer(){
  clearInterval(state.timerInterval);
  state.qStartTime=Date.now();
  state.qSeconds=0;
  state.timerInterval=setInterval(()=>{
    state.qSeconds=Math.floor((Date.now()-state.qStartTime)/1000);
    const el=document.getElementById('qTimer');
    if(el){
      const m=Math.floor(state.qSeconds/60), s=state.qSeconds%60;
      el.textContent=(m?m+' min ':'')+s+' s';
      el.className='q-timer'+(state.qSeconds<SPEED_THRESHOLDS[state.moduleId]?' fast':'');
    }
  },1000);
}
function stopTimer(){ clearInterval(state.timerInterval); }

// ═══════════════════════════════════════════════════════
//  DÉROULEMENT D'UN MODULE
// ═══════════════════════════════════════════════════════

function startModule(moduleId){
  state.moduleId=moduleId;
  state.questions=[];
  for(let i=0;i<Q_PER_MODULE;i++) state.questions.push(generateQuestion(moduleId));
  state.currentQ=0;
  state.qScores=[];
  state.qXP=[];
  initQuestion();
  navigate('module');
}

function initQuestion(){
  const q=state.questions[state.currentQ];
  state.steps=[{text:q.eq, isStart:true}];
  state.errors=0;
  state.solved=false;
  startTimer();
}

function markInputError(inp){
  inp.classList.add('is-ko');
  setTimeout(()=>inp.classList.remove('is-ko'),600);
}

function showStepFeedback(html, cls){
  const fb=document.getElementById('stepFeedback');
  if(!fb) return;
  fb.innerHTML=html;
  fb.className='step-feedback '+cls;
}

function validateStep(){
  const inp=activeInput();
  if(!inp) return;
  const raw=inp.value.trim();
  if(!raw){ showToast('Écris une équation !','ko'); return; }

  const q=state.questions[state.currentQ];
  const prevEq=state.steps[state.steps.length-1].text;

  // Ligne illisible
  if(!parseEquation(raw)){
    state.errors++;
    showStepFeedback(HINTS.parse,'ko');
    markInputError(inp);
    return;
  }

  // Ligne non équivalente à la précédente
  if(!equivCheck(prevEq, raw)){
    state.errors++;
    showStepFeedback(getHint(prevEq, raw, state.moduleId),'ko');
    markInputError(inp);
    showToast('Erreur — un indice est affiché','ko');
    return;
  }

  // Ligne correcte : est-ce la forme finale x = … avec une fraction simplifiée ?
  const finalForm=isFinalForm(raw);
  const final=finalForm&&fractionsIrreductibles(raw);
  state.steps.push({text:raw, isFinal:final});

  if(final){
    stopTimer();
    state.solved=true;
    const pts=state.errors===0?2:1;
    const xp=calcXP(state.moduleId, state.errors, true, state.qSeconds,
                    state.steps.length-1, q.optSteps, q.maxSteps);
    state.qScores.push(pts);
    state.qXP.push(xp);
    db.xp+=xp;
    saveDB();
    renderQuestion();
    setTimeout(()=>{
      showXPFloat(xp);
      if(pts===2) doConfetti();
      showToast(pts===2?'Parfait ! +2 pts':'Bien joué ! +1 pt', pts===2?'ok':'xp');
    },300);
  } else {
    renderQuestion();
    // Étape juste mais fraction à simplifier : on le signale
    if(finalForm) showStepFeedback('Ta ligne est juste, mais la fraction n\'est pas irréductible : simplifie-la à l\'étape suivante.','info');
  }
}

function nextQuestion(){
  if(state.currentQ<Q_PER_MODULE-1){
    state.currentQ++;
    initQuestion();
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    finishModule();
  }
}

function finishModule(){
  stopTimer();
  const totalScore=state.qScores.reduce((a,b)=>a+b,0);
  const totalXP=state.qXP.reduce((a,b)=>a+b,0);
  const mid=state.moduleId;

  // Sauvegarde du résultat
  const existing=db.results[mid];
  const attempts=(existing?existing.attempts:0)+1;
  const bestScore=existing?Math.max(existing.bestScore,totalScore):totalScore;
  db.results[mid]={ score:totalScore, bestScore, xp:totalXP, attempts };
  saveDB();

  navigate('results');
  if(totalScore>=18) doConfetti();
}

        ${[
          {icon:'±', txt:'Quand on passe un terme <b>additif</b> de l\'autre côté du =, on <b>change son signe</b>'},
          {icon:'×÷', txt:'Quand on passe un terme <b>multiplicatif</b>, × devient ÷ et inversement'},
          {icon:'( )', txt:'Pour <b>développer</b>, on multiplie chaque terme par le facteur extérieur. Un facteur négatif inverse les signes'},
          {icon:'−−', txt:'<b>Deux facteurs négatifs</b> qui se multiplient donnent un résultat positif : (−)×(−) = (+)'},
          {icon:'a/b', txt:'Utiliser la notation <b>fraction</b> (pas le signe ÷). Toujours réduire la fraction au maximum'},
        ].map(k=>`
          <div class="flex gap-3 items-start">
            <span class="module-badge" style="min-width:42px">${k.icon}</span>
            <p class="text-gray-700 pt-2">${k.txt}</p>
          </div>`).join('')}
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════
//  AFFICHAGE — QUESTION
// ═══════════════════════════════════════════════════════

function scoreBadge(s, label){
  return `<span class="q-badge ${s===2?'ok':s===1?'mid':'ko'}">${label}</span>`;
}

function renderQuestion(){
  const main=document.getElementById('appMain');
  const q=state.questions[state.currentQ];
  const mod=MODULES[state.moduleId];
  const totalPts=state.qScores.reduce((a,b)=>a+b,0);

  const stepsHTML=state.steps.map((step,i)=>`
      <div class="step-row">
        <div class="step-num">${step.isStart?'Départ':'Étape '+i}</div>
        <div class="step-content">
          <div class="step-fixed ${step.isStart?'is-start':step.isFinal?'is-final':''}">
            <div class="eq-display">${renderEqHTML(step.text)}</div>
            <span class="step-icon">${step.isStart?'':'✓'}</span>
          </div>
        </div>
      </div>`).join('');

  const inputHTML=state.solved?`
    <div class="callout-success mt-4">
      <p class="text-green-800 font-bold text-xl">✓ Équation résolue ! 🎉</p>
      <p class="text-green-700 mt-2">
        ${state.errors===0?'Résolution parfaite, aucune erreur !':'Résolu avec '+state.errors+' erreur'+(state.errors>1?'s':'')+'.'}
        Points : <b>${state.qScores[state.qScores.length-1]} pt${state.qScores[state.qScores.length-1]>1?'s':''}</b> · XP : <b>+${state.qXP[state.qXP.length-1]}</b>
      </p>
    </div>
    <button class="w-full mt-4 bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-lg font-bold" onclick="nextQuestion()">
      ${state.currentQ<Q_PER_MODULE-1?'Question suivante →':'Voir les résultats →'}
    </button>
  `:`
    <div class="step-row">
      <div class="step-num">Étape ${state.steps.length}</div>
      <div class="step-content">
        <div class="step-input-row">
          <input type="text" id="activeStepInput" class="step-input" placeholder="Ex : 3x = 9" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            onkeydown="if(event.key==='Enter')validateStep()">
          <button type="button" class="bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg font-bold step-validate" onclick="validateStep()">Valider ✓</button>
        </div>
        <div id="stepFeedback" class="step-feedback hidden"></div>
        ${keypadWidget()}
      </div>
    </div>
  `;

  main.innerHTML=`
    <div class="mb-6">
      <div class="flex justify-between text-sm font-bold text-gray-500 mb-2 gap-3 flex-wrap">
        <span>Question ${state.currentQ+1} / ${Q_PER_MODULE}</span>
        <span id="qTimer" class="q-timer">0 s</span>
        <span class="text-emerald-600">Score : ${totalPts} / ${state.qScores.length*2} · ${db.xp} XP</span>
      </div>
      <div class="progress-bar bg-emerald-100"><div class="progress-fill bg-gradient-to-r from-emerald-600 to-emerald-700" style="width:${Math.round((state.currentQ+1)/Q_PER_MODULE*100)}%"></div></div>
      ${state.qScores.length?`<div class="flex gap-2 flex-wrap mt-3">${state.qScores.map((s,i)=>scoreBadge(s,'Q'+(i+1)+' : '+s+' pt'+(s>1?'s':''))).join('')}</div>`:''}
    </div>

    <div class="bg-white rounded-xl shadow-2xl p-6 md:p-10 question-box">
      <h2 class="text-xl md:text-2xl font-bold text-emerald-900 mb-6">Module ${state.moduleId+1} : ${mod.title}</h2>
      ${numpadToggleBar()}

      <div class="callout-accent mb-5">
        <p class="text-sm font-bold text-emerald-800 uppercase tracking-wide mb-1">Résous l'équation</p>
        <div class="eq-display eq-big text-emerald-900">${renderEqHTML(q.eq)}</div>
        ${q.solFrac?`<p class="text-sm text-emerald-800 mt-2">La solution est une fraction : utilise la notation (a/b) et donne-la sous forme irréductible.</p>`:''}
      </div>

      <div class="callout-warning mb-5 text-sm" style="padding:10px 16px">
        <b>Méthode :</b> ${getModuleTip(state.moduleId)}
      </div>

      <div class="steps-container">
        ${stepsHTML}
        ${inputHTML}
      </div>

      <div class="flex justify-between flex-wrap gap-2 text-xs font-semibold text-gray-400 mt-5">
        <span>Étapes : ${state.steps.length-1} effectuée${state.steps.length>2?'s':''}</span>
        <span>Optimal : ${q.optSteps} · Maximum conseillé : ${q.maxSteps}</span>
      </div>
    </div>`;

  nav.setTitle('Module '+(state.moduleId+1)+' : '+mod.title);
  nav.setActive('module-'+state.moduleId);

  // Mise au point du champ de saisie
  if(!state.solved){
    setTimeout(()=>{ const inp=activeInput(); if(inp) inp.focus(); },100);
  }
}

function getModuleTip(moduleId){
  const tips=[
    'Passe le terme numérique de l\'autre côté du = en <strong>changeant son signe</strong>.',
    'Divise les deux membres par le <strong>coefficient de x</strong> pour isoler x.',
    'D\'abord, <strong>passe les nombres</strong> d\'un côté (change le signe), puis <strong>divise</strong> par le coefficient de x.',
    'Regroupe les termes en x d\'un côté et les nombres de l\'autre. N\'oublie pas de changer les signes !',
    'Exprime la solution sous forme de <strong>fraction irréductible</strong> (a/b). Utilise la touche a/b du pavé.',
    '<strong>Développe</strong> les parenthèses en multipliant chaque terme par le facteur extérieur, puis résous.',
    'Attention au facteur <strong>négatif</strong> : il inverse le signe de chaque terme entre les parenthèses.',
    'Développe, regroupe, puis résous. Procède <strong>étape par étape</strong>, sans brûler les étapes.',
  ];
  return tips[moduleId]||tips[7];
}

// ═══════════════════════════════════════════════════════
//  AFFICHAGE — RÉSULTATS D'UN MODULE
// ═══════════════════════════════════════════════════════

function renderResults(){
  const score=state.qScores.reduce((a,b)=>a+b,0);
  const xp=state.qXP.reduce((a,b)=>a+b,0);
  const pct=Math.round(score/20*100);
  const stars=score>=18?3:score>=14?2:score>=8?1:0;
  let msg='';
  if(pct>=90) msg='Excellent ! Tu maîtrises parfaitement ce module ! 🏆';
  else if(pct>=70) msg='Très bien ! Continue comme ça ! 👍';
  else if(pct>=50) msg='Pas mal ! Avec un peu plus de travail tu vas y arriver. 💪';
  else msg='Continue à t\'entraîner, tu vas progresser ! 📚';

  document.getElementById('appMain').innerHTML=`
    <div class="bg-white rounded-xl shadow-2xl p-6 md:p-10">
      <h2 class="text-xl md:text-2xl font-bold text-emerald-900 mb-6">Module ${state.moduleId+1} : ${MODULES[state.moduleId].title}</h2>
      <div class="bg-emerald-50 border border-emerald-200 rounded-2xl shadow-lg p-8 text-center">
        <h3 class="text-2xl font-bold text-gray-800 mb-3">Module terminé !</h3>
        <div class="text-6xl font-bold text-emerald-700 mb-2">${score} / 20</div>
        <div class="text-2xl mb-2">${[1,2,3].map(i=>`<span style="${i<=stars?'':'filter:grayscale(1);opacity:.35'}">⭐</span>`).join(' ')}</div>
        <div class="text-lg font-bold text-emerald-600 mb-4">+${xp} XP gagnés</div>
        <p class="text-gray-500 mb-6 text-lg">${msg}</p>
        <div class="flex gap-2 justify-center flex-wrap mb-8">
          ${state.qScores.map((s,i)=>scoreBadge(s,'Q'+(i+1)+' : '+(s===2?'parfait':s===1?'résolu':'non résolu')+' · +'+state.qXP[i]+' XP')).join('')}
        </div>
        <div class="flex gap-4 justify-center flex-wrap">
          <button onclick="startModule(${state.moduleId})" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-lg font-bold">Recommencer</button>
          <button onclick="navigate('home')" class="btn-secondary">Choisir un autre module</button>
        </div>
      </div>
    </div>`;
  nav.setTitle('Module '+(state.moduleId+1)+' : '+MODULES[state.moduleId].title);
  nav.setActive('module-'+state.moduleId);
}

// ═══════════════════════════════════════════════════════
//  AFFICHAGE — MA PROGRESSION
// ═══════════════════════════════════════════════════════

function renderStats(){
  const lv=xpLevel(db.xp);
  const totalAttempts=Object.values(db.results).reduce((a,r)=>a+r.attempts,0);
  const totalModsDone=Object.keys(db.results).length;
  const statTile=(val,label)=>`
    <div class="callout text-center">
      <div class="text-3xl font-bold text-emerald-700">${val}</div>
      <div class="text-xs font-bold text-gray-500 uppercase tracking-wide mt-1">${label}</div>
    </div>`;

  document.getElementById('appMain').innerHTML=`
    <div class="bg-white rounded-xl shadow-2xl p-6 md:p-10">
      <h2 class="text-2xl md:text-3xl font-bold text-emerald-900 mb-6">Ma progression</h2>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        ${statTile(db.xp,'XP au total')}
        ${statTile(lv.level,'Niveau · '+lv.title)}
        ${statTile(totalModsDone+' / '+MODULES.length,'Modules terminés')}
        ${statTile(totalAttempts,'Tentatives')}
      </div>

      <h3 class="text-xl font-bold text-emerald-800 mb-3 border-b-2 border-emerald-200 pb-2">Résultats par module</h3>
      <div class="flex flex-col gap-2 mb-8">
        ${MODULES.map((mod,i)=>{
          const res=db.results[i];
          return `
          <div class="flex items-center gap-3 border border-gray-200 rounded-xl px-4 py-3">
            <span class="module-badge">${i+1}</span>
            <div class="flex-1 min-w-0">
              <div class="font-bold text-gray-900">${mod.title}</div>
              <div class="text-sm text-gray-500">${res?`${res.attempts} tentative${res.attempts>1?'s':''} · dernière note ${res.score}/20 · +${res.xp} XP`:'Non commencé'}</div>
            </div>
            <div class="text-lg font-bold ${res?'text-emerald-700':'text-gray-300'}">${res?res.bestScore+'/20':'—'}</div>
          </div>`;
        }).join('')}
      </div>

      <h3 class="text-xl font-bold text-emerald-800 mb-3 border-b-2 border-emerald-200 pb-2">Comment gagner des XP</h3>
      <div class="callout-accent mb-8">
        <div class="progress-bar bg-white mb-1"><div class="progress-fill bg-gradient-to-r from-emerald-500 to-emerald-700" style="width:${Math.round(lv.progress*100)}%"></div></div>
        <p class="text-sm font-semibold text-gray-600 mb-3">${lv.xpToNext} XP avant le niveau ${lv.level+1}</p>
        <ul class="text-gray-700 space-y-1">
          <li><b>10 XP</b> : résoudre une équation</li>
          <li><b>+10 XP</b> : résolution sans erreur</li>
          <li><b>0 à 20 XP</b> : bonus de rapidité</li>
          <li><b>0 à 30 XP</b> : bonus d'économie d'étapes</li>
        </ul>
      </div>

      <button class="btn-small" style="color:var(--danger);border-color:#fca5a5" onclick="confirmReset()">Réinitialiser la progression</button>
    </div>`;
  nav.setTitle('Ma progression');
  nav.setActive('stats');
}

function confirmReset(){
  if(confirm('Réinitialiser TOUTE ta progression (XP, scores) ? Cette action est irréversible.')){
    db={xp:0,results:{},showKb:db.showKb};
    saveDB();
    navigate('home');
    showToast('Progression réinitialisée','ko');
  }
}

// ═══════════════════════════════════════════════════════
//  AFFICHAGE PRINCIPAL
// ═══════════════════════════════════════════════════════

function render(){
  switch(state.view){
    case 'module':  renderQuestion(); break;
    case 'results': renderResults(); break;
    case 'stats':   renderStats(); break;
    default:
      renderHome();
      nav.setTitle(null);
      nav.setActive(null);
  }
}

// ═══════════════════════════════════════════════════════
//  DÉMARRAGE
// ═══════════════════════════════════════════════════════

loadDB();
baseSetNumpadPref(db.showKb);
render();

</script>
</body>
</html>
