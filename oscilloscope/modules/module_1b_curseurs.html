<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 1 · SIMULATION</span>
    <h2 class="er-titre">Durée entre deux signaux : utiliser les curseurs</h2>
    <p class="er-contexte">Les <b>curseurs</b> de type X sont deux traits verticaux que l'on place sur l'écran ; l'oscilloscope affiche la durée entre eux, <b>ΔX</b><span id="bulle"></span>. Place-les au <b>départ</b> de chaque signal : le décalage est Δt = ΔX.</p>
  </div>
  <div id="zone"></div>
</div>
<script>
SOM.menu('module_1b_curseurs');
document.getElementById('bulle').innerHTML = BULLE.info("Curseurs de <b>type X</b> (curseurs horizontaux)\xa0: deux traits verticaux qu'on déplace le long de l'axe des temps\xa0; ΔX est la durée entre eux. Curseurs de <b>type Y</b> (curseurs verticaux)\xa0: deux traits horizontaux qu'on déplace verticalement\xa0; ΔY est la tension entre eux.", 'Curseurs X et Y');
OS.duree(document.getElementById('zone'), 'curseurs');
</script>
</body>
