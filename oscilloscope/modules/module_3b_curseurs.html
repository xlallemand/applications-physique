    <h2 class="er-titre">Tension : utiliser les curseurs</h2>
    <p class="er-contexte">Les <b>curseurs de type Y</b> sont deux traits horizontaux ; l'oscilloscope affiche la valeur de chacun et leur écart <b>ΔY</b>, avec l'échelle de la voie choisie par <b>Source</b><span id="bulle"></span> (CH1 ou CH2).</p>
  </div>
  <div id="zone"></div>
</div>
<script>
SOM.menu('module_3b_curseurs');
document.getElementById('bulle').innerHTML = BULLE.info("Avec des curseurs de type Y, les valeurs affichées sous l'écran sont calculées avec l'échelle de la voie choisie par le 3<sup>e</sup> bouton, <b>Source</b>\xa0: CH1 pour le signal jaune, CH2 pour le signal bleu. Chaque valeur est mesurée depuis le 0 V de cette voie.", 'Source');
OS.tension(document.getElementById('zone'), 'curseurs');
</script>
