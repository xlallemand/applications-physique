<title>Module 3 : questions sur la modulation — Chapitre 19 : Ondes électromagnétiques</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">

<body>
<div id="app-nav"></div>
<div class="er-page" id="app"></div>

<script>
/* ============================================================
   10 questions tirées au hasard : pourquoi transposer (1),
   vocabulaire (1), identifier modulant, porteuse et modulé (1), AM ou
   FM d'après une figure (2), largeur de la bande occupée (1), bornes
   de la bande occupée (1), bande passante suffisante ou non (1),
   nombre de stations dans une bande (1), écart minimal entre deux
   porteuses (1).
   Erreurs diagnostiquées : modulant et porteuse confondus, AM et FM
   confondues, f_h au lieu de 2 f_h, F ± 2 f_h, comparaison avec f_max
   au lieu de 2 f_max, bornes comptées comme des canaux.
   ============================================================ */
const { o, fq, fmt, hasard, melanger, proche, fr } = OEM;
const calc = h => `<p class="ph-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const fh = 'f<sub>h</sub>';
const figure = (type, e, titre) => OEM.fig(W => MOD.svgSignal(type, e, { W: Math.min(W, 640), titre, axeT: false, enveloppe: false }));
function signalAuHasard(mode) {
  const fm = hasard([.5, .6, .8, 1]), F = Math.round(fm * hasard([16, 20, 24]));
  return { fm, F, Um: mode === 'am' ? hasard([.6, .7, .8]) : hasard([.9, 1, 1.2]), forme: Math.random() < .3 ? 'son' : 'sinus' };
}

function qTransposer() {
  return { theme: 'Transposition de fréquence', parties: [fq.choix('Pourquoi transpose-t-on la voix (20 Hz à 20 kHz) vers de hautes fréquences avant de l\'émettre ?',
    [o('ok', 'Les basses fréquences portent mal, et des émissions sur des fréquences différentes ne se brouillent pas'), o('vide', 'Les basses fréquences ne se propagent pas dans le vide'),
      o('vite', 'Les hautes fréquences vont plus vite'), o('son', 'Pour rendre le son plus aigu à l\'arrivée')], 'ok',
    { colonne: true, indices: { vide: 'Toutes les ondes électromagnétiques se propagent dans le vide.', vite: 'Toutes les ondes électromagnétiques ont la même célérité c.', son: 'Le récepteur retrouve le signal modulant : le son n\'est pas modifié.' },
      solution: '<p>Les basses fréquences ont une portée très limitée (et demanderaient des antennes immenses) ; avec des porteuses différentes, les émissions ne se brouillent pas.</p>' })] };
}
function qVocabulaire() {
  const [q, bonne, sol] = hasard([
    ['L\'onde de haute fréquence, d\'amplitude et de fréquence constantes, qui sert à transporter l\'information s\'appelle :', 'p', 'la porteuse.'],
    ['L\'information à transmettre (la voix, la musique) s\'appelle :', 'm', 'le signal modulant.'],
    ['La porteuse dont on a modifié l\'amplitude ou la fréquence s\'appelle :', 's', 'le signal modulé.']]);
  return { theme: 'Vocabulaire', parties: [fq.choix(q, [o('m', 'le signal modulant'), o('p', 'la porteuse'), o('s', 'le signal modulé')], bonne,
    { melanger: false, indice: 'Modulant : l\'information ; porteuse : l\'onde de haute fréquence ; modulé : la porteuse modifiée.', solution: `<p>C'est ${sol}</p>` })] };
}
function qIdentifier() {
  const mode = hasard(['am', 'fm']), e = mode === 'am' ? { fm: .5, F: 12, Um: .7, forme: 'sinus' } : { fm: .5, F: 12, Um: 1.1, forme: 'sinus' };
  const ordre = melanger(['modulant', 'porteuse', 'mod']), noms = { modulant: 'le signal modulant', porteuse: 'la porteuse', mod: 'le signal modulé' };
  return { theme: 'Modulant, porteuse, modulé', enonce: `<div class="oem-signaux">${ordre.map((t, i) => `<p class="oem-signal-t">Signal ${i + 1}</p>${figure(t === 'mod' ? mode : t, e, '')}`).join('')}</div>`,
    parties: [{ type: 'grille', q: 'Identifie chaque signal.', options: [o('modulant', 'Modulant'), o('porteuse', 'Porteuse'), o('mod', 'Modulé')],
      lignes: ordre.map((t, i) => ({ id: 's' + i, label: `Signal ${i + 1}`, bonne: t,
        indices: { modulant: 'Le modulant est le signal lent (basse fréquence).', porteuse: 'La porteuse est une sinusoïde rapide d\'amplitude et de fréquence constantes.', mod: 'Le signal modulé est rapide, et son amplitude ou sa fréquence varie.' } })),
      solution: `<p>${ordre.map((t, i) => `Signal ${i + 1} : ${noms[t]}`).join(' ; ')}. C'est une modulation ${mode === 'am' ? 'd\'amplitude' : 'de fréquence'}.</p>` }] };
}
function qAMFM() {
  const m = hasard(['am', 'fm']), e = signalAuHasard(m);
  return { theme: 'AM ou FM ?', enonce: figure(m, e, 'Signal modulé'), parties: [fq.choix('Ce signal est-il modulé en amplitude ou en fréquence ?',
    [o('am', 'AM : modulation d\'amplitude'), o('fm', 'FM : modulation de fréquence')], m,
    { melanger: false, indices: { am: 'Les sommets sont tous à la même hauteur : l\'amplitude ne varie pas. Regarde l\'écart entre les oscillations.', fm: 'Les oscillations sont régulièrement espacées ; c\'est la hauteur des sommets qui varie.' },
      solution: m === 'am' ? '<p>L\'amplitude varie, la fréquence reste la même : modulation d\'amplitude.</p>' : '<p>L\'amplitude est constante, les oscillations se resserrent et s\'écartent : modulation de fréquence.</p>' })] };
}
function qAMFMtexte() {
  const [q, bonne] = hasard([['Dans une modulation d\'amplitude, ce qui varie au rythme du signal modulant, c\'est :', 'a'], ['Dans une modulation de fréquence, ce qui varie au rythme du signal modulant, c\'est :', 'f']]);
  return { theme: 'AM et FM', parties: [fq.choix(q, [o('a', 'l\'amplitude de la porteuse'), o('f', 'la fréquence de la porteuse'), o('m', 'la fréquence du modulant')], bonne,
    { melanger: false, indices: { a: 'En FM, l\'amplitude reste constante.', f: 'En AM, la fréquence de la porteuse reste la même.', m: 'Le modulant est l\'information : on ne le modifie pas, on modifie la porteuse.' },
      solution: bonne === 'a' ? '<p>AM : l\'amplitude de la porteuse varie.</p>' : '<p>FM : la fréquence de la porteuse varie.</p>' })] };
}
function qBande() {
  const h = hasard([3, 4, 4.5, 5, 7.5, 10, 15]);
  return { theme: 'Bande occupée', enonce: `<p>Le signal modulant d'une émission contient des fréquences jusqu'à ${fh} = ${fmt(h)} kHz.</p>`,
    parties: [fq.nombre('Quelle est la largeur de la bande occupée par le signal modulé ?', 'bande =', 2 * h, 'kHz', { tol: .01, signe: false,
      diag: v => (proche(v, h) ? `Il y a une bande latérale de chaque côté de la porteuse : 2 ${fh}.` : `Bande occupée = 2 ${fh}.`),
      solution: calc(`2 ${fh} = 2 × ${fmt(h)} = ${c(fmt(2 * h) + ' kHz')}`) })] };
}
function qBornes() {
  const [F, h] = hasard([[252, 4], [198, 4.5], [1000, 5], [180, 3], [600, 4.5], [162, 4.5]]);
  return { theme: 'Bornes de la bande occupée', enonce: `<p>Une station AM a pour porteuse F = ${fmt(F)} kHz ; le modulant va jusqu'à ${fh} = ${fmt(h)} kHz.</p>`,
    parties: [{ type: 'gabarit', q: 'Entre quelles fréquences s\'étend le signal modulé ?', morceaux: ['de', { v: F - h, tol: .01 }, 'kHz à', { v: F + h, tol: .01 }, 'kHz'],
      diag: v => (proche(v[0], F - 2 * h) || proche(v[1], F + 2 * h) ? `De chaque côté de F, on retranche ou on ajoute ${fh}, pas 2 ${fh}.` : `Calcule F − ${fh} et F + ${fh}.`),
      solution: calc(`F − ${fh} = ${fmt(F - h)} kHz ; F + ${fh} = ${fmt(F + h)} kHz`) }] };
}
function qPassante() {
  const [bp, fmax, ok] = hasard([[12.5, 4.2, true], [9, 5, false], [25, 10, true], [10, 6, false], [9, 4.5, true], [20, 12, false], [12.5, 7, false], [25, 8.4, true]]);
  return { theme: 'Bande passante', enonce: `<p>Les porteuses de deux canaux voisins sont séparées de ${fmt(bp)} kHz. On veut transmettre un signal dont la plus haute fréquence est f<sub>max</sub> = ${fmt(fmax)} kHz.</p>`,
    parties: [fq.choix('La bande passante d\'un canal est-elle suffisante pour le transmettre sans déformation ?', [o('oui', 'Oui'), o('non', 'Non')], ok ? 'oui' : 'non',
      { melanger: false, indices: { oui: `Compare ${fmt(bp)} kHz à 2 f<sub>max</sub> = ${fmt(2 * fmax)} kHz, pas à f<sub>max</sub>.`, non: `2 f<sub>max</sub> = ${fmt(2 * fmax)} kHz : compare avec ${fmt(bp)} kHz.` },
        solution: calc(`2 f<sub>max</sub> = ${fmt(2 * fmax)} kHz ${ok ? '≤' : '&gt;'} ${fmt(bp)} kHz`) + `<p>Bande passante ${ok ? 'suffisante' : 'insuffisante'}.</p>` })] };
}
function qStations() {
  const [a, b, l, u, nom] = hasard([[148.5, 238.5, 9, 'kHz', 'La bande des grandes ondes'], [87.5, 108, .1, 'MHz', 'La bande FM'], [446, 446.1, .0125, 'MHz', 'La bande des talkies-walkies (PMR 446)'], [526.5, 1606.5, 9, 'kHz', 'La bande des petites ondes']]);
  const n = Math.round((b - a) / l);
  return { theme: 'Nombre de stations', enonce: `<p>${nom} va de ${fmt(a)} ${u} à ${fmt(b)} ${u}. Les porteuses de deux stations voisines sont séparées de ${fmt(l)} ${u}.</p>`,
    parties: [fq.nombre('Combien de stations (de canaux) peut-on y placer ?', 'N =', n, '', { tol: .01, signe: false,
      diag: v => (proche(v, n + 1) ? 'On compte les intervalles : N = largeur de la bande / écart entre porteuses.' : 'N = largeur de la bande / écart entre deux porteuses (même unité).'),
      solution: calc(`N = ${fr(fmt(b) + ' − ' + fmt(a), fmt(l))} = ${c(n)}`) })] };
}
function qEcart() {
  const h = hasard([4, 4.5, 5, 6, 7.5]);
  return { theme: 'Écart entre porteuses', enonce: `<p>Deux stations AM voisines transmettent de la musique jusqu'à ${fh} = ${fmt(h)} kHz.</p>`,
    parties: [fq.nombre('Quel écart minimal faut-il entre leurs porteuses pour qu\'elles ne se brouillent pas ?', 'F<sub>2</sub> − F<sub>1</sub> =', 2 * h, 'kHz', { tol: .01, signe: false,
      diag: v => (proche(v, h) ? `Chaque station occupe 2 ${fh} : f<sub>h</sub> de chaque côté de sa porteuse.` : `Écart ≥ bande occupée = 2 ${fh}.`),
      solution: calc(`F<sub>2</sub> − F<sub>1</sub> ≥ 2 ${fh} = ${c(fmt(2 * h) + ' kHz')}`) })] };
}

// tirage : une question de chaque sorte (deux figures AM / FM)
function tirage() {
  return [qTransposer, qVocabulaire, qIdentifier, qAMFM, qAMFMtexte, qBande, qBornes, qPassante, qStations, qEcart].map(f => f());
}

OEM.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 3 · QUESTIONS', titre: 'Modulation',
  intro: '<p class="er-contexte">10 questions : transposition de fréquence, modulant, porteuse et signal modulé, AM ou FM, bande occupée 2 f<sub>h</sub>, bande passante d\'un canal, nombre de stations dans une bande.</p>',
  questions: tirage,
  revoir: { href: 'module_3a_cours.html', label: 'Revoir le cours' },
  suite: { href: 'module_4_cours.html', label: 'Module 4 : antennes →' },
});
OEM.menu('module_3_questions');
</script>
</body>
</html>
