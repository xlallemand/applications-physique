<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double périodicité d'une onde</title>
<meta name="description" content="Simulateur : l'onde entre un émetteur et un récepteur (périodicité spatiale) et le signal reçu en fonction du temps (périodicité temporelle), λ = c × T = c / f.">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="modules/dp.css">
<link rel="stylesheet" href="../assets/plein-ecran.css">
<link rel="stylesheet" href="../assets/sommaire.css">
<script src="../assets/sommaire.js"></script>
<script src="../assets/plein-ecran.js"></script>
</head>
<body>
<div id="app-nav"></div>

<!-- Écran unique : les deux graphes à gauche, les réglages à droite -->
<div class="er-page dp-ecran">

  <section class="dp-graphes" aria-label="Graphes">
    <!-- Périodicité spatiale : l'onde entre E et R à l'instant t -->
    <div class="er-card dp-carte">
      <div class="dp-tete">
        <h2>Périodicité spatiale&nbsp;<small>: l'onde dans le milieu à l'instant t (émetteur E, récepteur R)</small></h2>
        <span class="dp-instant" id="dp-t">t = 0,00 s</span>
      </div>
      <div class="dp-corps">
        <figure class="dp-situ">
          <div id="dp-situ-film"></div>
          <figcaption>On <b>filme</b> l'onde : chaque image montre tout le milieu à un instant t.</figcaption>
        </figure>
        <div class="dp-svg" id="dp-espace"></div>
      </div>
    </div>
    <!-- Périodicité temporelle : signal reçu par R -->
    <div class="er-card dp-carte">
      <div class="dp-tete">
        <h2>Périodicité temporelle&nbsp;<small>: le signal reçu par R en fonction du temps</small></h2>
      </div>
      <div class="dp-corps">
        <figure class="dp-situ">
          <div id="dp-situ-papier"></div>
          <figcaption>Un <b>stylo</b> relié à R suit le signal sur un <b>papier qui défile</b>, comme un sismographe.</figcaption>
        </figure>
        <div class="dp-svg" id="dp-temps"></div>
      </div>
    </div>
  </section>

  <!-- Réglages, valeurs, animation, démonstration -->
  <aside class="er-card dp-panneau" aria-label="Réglages">
    <div class="dp-bloc">
      <p class="dp-lab">Forme de l'onde</p>
      <div class="dp-seg" role="group" aria-label="Forme de l'onde">
        <button type="button" data-forme="sin" aria-pressed="true">Sinusoïdale</button>
        <button type="button" data-forme="cplx" aria-pressed="false">Non sinusoïdale</button>
      </div>
    </div>

    <div class="dp-bloc">
      <label class="dp-reglage">
        <span class="dp-reglage-nom">Fréquence de l'émetteur <b id="dp-vf">f = 1,0 Hz</b></span>
        <input type="range" id="dp-f" min="0.5" max="3" step="0.1" value="1" aria-label="Fréquence f de l'émetteur">
      </label>
      <label class="dp-reglage">
        <span class="dp-reglage-nom">Célérité de l'onde (milieu) <b id="dp-vc">c = 2,0 m·s<sup>−1</sup></b></span>
        <input type="range" id="dp-c" min="1" max="3" step="0.1" value="2" aria-label="Célérité c de l'onde">
      </label>
    </div>

    <div class="dp-bloc dp-valeurs">
      <div class="dp-val-tete">
        <p class="dp-lab">Valeurs</p>
        <button type="button" class="btn-small" id="dp-masquer" aria-pressed="false">Masquer les valeurs</button>
      </div>
      <p class="dp-val">Période : <b>T = 1 / f = <span id="dp-vT">1,00 s</span></b></p>
      <p class="dp-val">Longueur d'onde : <b>λ = c / f = <span id="dp-vl">2,00 m</span></b></p>
    </div>

    <div class="dp-bloc">
      <p class="dp-lab">Animation</p>
      <div class="dp-boutons">
        <button type="button" class="btn-primary" id="dp-lecture">▶ Lecture</button>
        <button type="button" class="btn-small" id="dp-pas" aria-label="Avancer d'un pas (un vingtième de période)">Pas à pas</button>
        <button type="button" class="btn-small dp-zero" id="dp-zero" aria-label="Recommencer" title="Recommencer">↺</button>
      </div>
      <div class="dp-seg dp-vitesse" role="group" aria-label="Vitesse de l'animation">
        <button type="button" data-vitesse="0.25" aria-pressed="false">× 0,25</button>
        <button type="button" data-vitesse="0.5" aria-pressed="false">× 0,5</button>
        <button type="button" data-vitesse="1" aria-pressed="true">× 1</button>
        <button type="button" data-vitesse="2" aria-pressed="false">× 2</button>
      </div>
    </div>

    <div class="dp-bloc">
      <button type="button" class="btn-secondary dp-periodes" id="dp-periodes" aria-pressed="false">Afficher les périodes</button>
    </div>

    <div class="dp-bloc">
      <button type="button" class="btn-secondary dp-suivre" id="dp-suivre">Suivre l'onde pendant T</button>
      <div class="dp-message" id="dp-msg" aria-live="polite"></div>
    </div>
  </aside>
</div>

<script src="modules/dp.js"></script>
</body>
</html>
