    /* ============================================================

    .op-diagram { text-align:center; margin-bottom:8px; }

    @media (max-width:480px) {

    .er-etape .ep-pal-t { font-size:.75rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); margin:16px 0 8px; }
    .ep-palette { display:flex; flex-wrap:wrap; gap:12px; padding:16px; background:var(--paper); border:1px solid var(--line); border-radius:12px; }
    /* manipulation réussie ou réponse affichée : l'équation reste affichée, plus rien ne bouge */
    .ep-fige .ep-barre, .ep-fige .ep-pal-t, .ep-fige .ep-palette, .ep-fige .ep-actions { display:none; }
    @media (max-width:480px) { .ep-zone { padding:24px 4px; } }

    .ep-op::after { content:' →'; }
    @media (max-width:560px) { .ep-op::after { content:' ↓'; } }

<script>
/* ============================================================
   Module 4 · Méthode : les fonctions réciproques
   Cours par étapes (assets/cours.js) : une étape par règle, avec
   la règle (.cle), un exemple traité (avant / après) puis un
   « À toi » dont les items sont les manipulations de l'éditeur
   d'équation (parties 'perso').
   Version « avec aide » : un déplacement non autorisé est bloqué et la
   règle à suivre est rappelée (../aide-rules.js), comme une erreur.
   L'éditeur est une instance par manipulation (monterEditeur) :
   en mode « Afficher tout le cours », toutes les manipulations
   sont affichées en même temps et fonctionnent indépendamment.
   ============================================================ */

EP.menu('module_8');

// ═══════════════════════════════════════════════════════════════
// OUTILS DE CONSTRUCTION DE NŒUDS
// un membre d'équation est soit une grandeur simple {kind:'simple',
// items:[tile]}, soit une fonction appliquée à un membre
// {kind:'func', fn:'sqrt'|'sq'|'sin'|'asin', inner}
// ═══════════════════════════════════════════════════════════════
function tile(id, label) { return { id, label }; }
function simple(items) { return { kind:'simple', items: items.map(t => ({...t})) }; }
function func(fn, inner) { return { kind:'func', fn, inner }; }

const RECIPROCAL = { sqrt:'sq', sq:'sqrt', sin:'asin', asin:'sin' };
const FUNC_TOOL_LABEL = { sqrt:'√', sq:'x²', sin:'sin', asin:'sin<sup>−1</sup>' };

function nodeEq(a, b) {
    if (!a || !b || a.kind !== b.kind) return false;
    if (a.kind === 'simple') {
        return a.items.length === b.items.length && a.items.every((it, i) => it.id === b.items[i].id);
    }
    if (a.kind === 'func') return a.fn === b.fn && nodeEq(a.inner, b.inner);
    return false;
}

// ── Affichage (les tuiles ne sont pas manipulables individuellement :
// seule l'application de l'outil réciproque agit sur l'équation) ──
function renderStatic(node) {
    if (node.kind === 'simple') {
        if (node.items.length === 0) return '<span class="eq-tile-frozen">…</span>';
        return node.items.map(it => `<span class="eq-tile-frozen"><span>${it.label}</span></span>`).join('');
    }
    if (node.kind === 'func') {
        if (node.fn === 'sqrt') {
            return `<div class="sqrt-wrap"><svg class="sqrt-hook" aria-hidden="true"></svg><div class="sqrt-inner">${renderStatic(node.inner)}</div></div>`;
        }
        if (node.fn === 'sq') {
            return `<span class="func-wrap">${renderStatic(node.inner)}<sup class="func-exp">2</sup></span>`;
        }
        const label = node.fn === 'sin' ? 'sin' : 'sin<sup>−1</sup>';
        return `<span class="func-wrap"><span class="func-name">${label}</span>(${renderStatic(node.inner)})</span>`;
    }
    return '';
}
// crochet de chaque racine carrée, dessiné à la hauteur réelle de son contenu
function sizeSqrtHooks(container) {
    container.querySelectorAll('.sqrt-hook').forEach(svg => {
        const inner = svg.nextElementSibling;
        if (!inner) return;
        const h = Math.max(inner.offsetHeight, 24);
        const hookH = Math.min(16, h - 6);
        const d = `M0,${(h - hookH * 0.55).toFixed(1)} L${(hookH * 0.4).toFixed(1)},${(h - 2).toFixed(1)} L13,2`;
        svg.setAttribute('viewBox', `0 0 14 ${h}`);
        svg.setAttribute('width', '14');
        svg.setAttribute('height', String(h));
        svg.innerHTML = `<path d="${d}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
    });
}
const eqStat = (g, d) => `<div class="eq-line-static">${renderStatic(g)}<span class="eq-sign petit">=</span>${renderStatic(d)}</div>`;

// schéma « on applique la même opération aux deux côtés » au-dessus de l'éditeur
function schemaOperation(gauche, droite, od) {
    const fleche = miroir => `<svg viewBox="0 0 60 46" class="op-arrow-svg${miroir ? ' miroir' : ''}" aria-hidden="true"><path d="M46,4 Q12,10 16,38" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M16,38 L7,26 M16,38 L25,29" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    return `<div class="op-diagram">
        ${eqStat(gauche, droite)}
        <div class="op-diagram-arrows">
            <div class="op-arrow-row op-arrow-row-left">
                <span class="op-arrow-label">${od.label}${od.noteLeft ? `<span class="op-arrow-note">${od.noteLeft}</span>` : ''}</span>${fleche(false)}
            </div>
            <div class="op-arrow-row op-arrow-row-right">
                ${fleche(true)}<span class="op-arrow-label">${od.label}${od.noteRight ? `<span class="op-arrow-note">${od.noteRight}</span>` : ''}</span>
            </div>
        </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
// ÉDITEUR D'ÉQUATION : une instance par manipulation
//   monterEditeur(hote, cfg, api) construit l'éditeur dans hote et renvoie { montrer() }.
//   cfg : left(), right()      équation de départ
//         toolFn               outil de la palette ('sq', 'sqrt', 'sin', 'asin')
//         check(st)            true quand c'est réussi
//         diag(st)             diagnostic d'une erreur
//         solution()           { left, right } : équation finale attendue (« Afficher la réponse »)
//         opDiagram            schéma de l'opération
//   api : celle d'une partie 'perso' du moteur de cours (reussi, erreur, effacer, fini)
// Chaque instance a son propre état et ses propres éléments : aucun id fixe,
// et le glisser-déposer ne vise que les membres de sa propre équation.
// ═══════════════════════════════════════════════════════════════
let nbEditeurs = 0;
function monterEditeur(hote, cfg, api) {
    const num = ++nbEditeurs;
    let state = null;               // équation en cours { left, right }
    let fige = false;               // réussi ou réponse affichée : plus rien ne bouge

    if (window.DragDrop) DragDrop.cleanupGhosts();
    hote.innerHTML = `<div class="ep-edit" data-ep="${num}">
        <div class="ep-barre"><button type="button" class="btn-small ep-recommencer">↺ Recommencer</button></div>
        ${cfg.opDiagram ? schemaOperation(cfg.left(), cfg.right(), cfg.opDiagram) : ''}
        <div class="ep-zone eq-row"></div>
        <p class="ep-pal-t">Glisse l'outil sur l'équation</p><div class="ep-palette"></div>
        <div class="er-actions crs-actions-partie ep-actions"><button type="button" class="btn-primary ep-valider">Valider</button></div>
    </div>`;
    const racine = hote.firstElementChild;
    const zoneEq = racine.querySelector('.ep-zone');
    const pal = racine.querySelector('.ep-palette');
    racine.querySelector('.ep-recommencer').addEventListener('click', resetDrill);
    racine.querySelector('.ep-valider').addEventListener('click', checkDrill);
    sizeSqrtHooks(racine);

    function renderEquationZone() {
        zoneEq.innerHTML = `<div class="eq-side-static func-target" data-path="left">${renderStatic(state.left)}</div>` +
            `<div class="eq-sign">=</div>` +
            `<div class="eq-side-static func-target" data-path="right">${renderStatic(state.right)}</div>`;
        sizeSqrtHooks(zoneEq);
    }
    function refreshView() {
        renderEquationZone();
        buildToolPalette(cfg.toolFn);
    }

    // ── Application de la fonction réciproque à un membre ──
    function applyFuncTool(toolFn, side) {
        if (fige || (side !== 'left' && side !== 'right')) return;
        const inverse = RECIPROCAL[toolFn];
        const cur = state[side];
        if (cur.kind === 'func' && cur.fn === inverse) {
            state[side] = cur.inner;
        } else {
            state[side] = func(toolFn, cur);
        }
        refreshView();
    }
    function buildToolPalette(toolFn) {
        pal.innerHTML = '';
        const el = document.createElement('div');
        el.className = 'palette-tile';
        el.innerHTML = `<span>${FUNC_TOOL_LABEL[toolFn]}</span>`;
        DragDrop.enable(el, {
            zoneSelector: `[data-ep="${num}"] .func-target`,
            dragOverClass: 'drag-over',
            onDrop: (item, zone) => { if (zone) applyFuncTool(toolFn, zone.dataset.path); },
        });
        pal.appendChild(el);
    }

    // ── Recommencer, valider ──
    function resetDrill() {
        if (fige) return;
        if (window.DragDrop) DragDrop.cleanupGhosts();
        state = { left: cfg.left(), right: cfg.right() };
        api.effacer();
        refreshView();
    }
    function checkDrill() {
        if (fige || api.fini()) return;
        if (cfg.check(state)) {
            figer();
            api.reussi();
        } else {
            api.erreur((cfg.diag && cfg.diag(state)) || "Ce n'est pas encore ça, réessaie.");
        }
    }
    function figer() {
        fige = true;
        racine.classList.add('ep-fige');
        refreshView();
    }

    state = { left: cfg.left(), right: cfg.right() };
    refreshView();
    racine.ep = { etat: () => state, check: () => cfg.check(state) };   // (utile pour vérifier l'application)
    // « Afficher la réponse » : l'équation finale attendue
    return { montrer() { state = cfg.solution(); figer(); } };
}

// ═══════════════════════════════════════════════════════════════
// DIAGNOSTIC DES MANIPULATIONS : l'outil doit être appliqué une fois à
// gauche et une fois à droite
// ═══════════════════════════════════════════════════════════════
function diagFonction(st, m) {
    const sol = m.solution();
    const okG = nodeEq(st.left, sol.left), okD = nodeEq(st.right, sol.right);
    const depG = nodeEq(st.left, m.left()), depD = nodeEq(st.right, m.right());
    if (okG && depD) return 'Tu as appliqué l\'outil à gauche seulement : applique-le aussi à droite, sinon l\'égalité n\'est plus vraie.';
    if (okD && depG) return 'Tu as appliqué l\'outil à droite seulement : applique-le aussi à gauche, sinon l\'égalité n\'est plus vraie.';
    if (depG && depD) return 'Glisse l\'outil de la palette sur chaque membre de l\'équation : une fois à gauche, une fois à droite.';
    return 'Tu as appliqué l\'outil plusieurs fois au même membre. Clique sur ↺ Recommencer, puis applique-le une seule fois à gauche et une seule fois à droite.';
}

// ═══════════════════════════════════════════════════════════════
// LES MANIPULATIONS (dans l'ordre du cours)
// ═══════════════════════════════════════════════════════════════
const X = tile('x','x'), Y = tile('y','y'), TH = tile('theta','θ');
const M_RACINE = [
    {   titre: 'Supprimer une racine carrée',
        instruction: "Voici l'équation v = √(2gh) simplifiée en x = √(y) : la racine carrée s'applique à y, à droite. Pour la supprimer, glisse l'outil <b>x²</b> (le carré, réciproque de la racine carrée) sur le côté gauche, PUIS sur le côté droit.",
        left: () => simple([X]),
        right: () => func('sqrt', simple([Y])),
        toolFn: 'sq',
        opDiagram: { label: 'x²', noteLeft:'(applique le carré)', noteRight:'(applique le carré)' },
        check: (st) => nodeEq(st.left, func('sq', simple([X]))) && nodeEq(st.right, simple([Y])),
        solution: () => ({ left: func('sq', simple([X])), right: simple([Y]) }),
        explication: '<p>Le carré annule la racine carrée : (√y)² = y. À gauche, x devient x² : x² = y.</p>',
    },
    {   titre: 'Supprimer un carré',
        instruction: "Repartons d'une équation avec un carré : x² = y. Pour supprimer le carré, glisse l'outil <b>√</b> (la racine carrée, réciproque du carré) sur le côté gauche, PUIS sur le côté droit.",
        left: () => func('sq', simple([X])),
        right: () => simple([Y]),
        toolFn: 'sqrt',
        opDiagram: { label: '√', noteLeft:'(applique la racine)', noteRight:'(applique la racine)' },
        check: (st) => nodeEq(st.left, simple([X])) && nodeEq(st.right, func('sqrt', simple([Y]))),
        solution: () => ({ left: simple([X]), right: func('sqrt', simple([Y])) }),
        explication: '<p>La racine carrée annule le carré : √(x²) = x (x positif, comme une grandeur physique). À droite, y devient √y : x = √y.</p>',
    },
];
const M_SINUS = [
    {   titre: 'Supprimer un sinus',
        instruction: "Le sinus a lui aussi une fonction réciproque, notée <b>sin<sup>−1</sup></b> (on dit aussi « arcsinus »). Si sin(θ) = y, alors θ = sin<sup>−1</sup>(y). Glisse l'outil <b>sin<sup>−1</sup></b> sur le côté gauche, PUIS sur le côté droit, pour supprimer le sinus.",
        left: () => func('sin', simple([TH])),
        right: () => simple([Y]),
        toolFn: 'asin',
        opDiagram: { label: 'sin<sup>−1</sup>', noteLeft:'(applique sin<sup>−1</sup>)', noteRight:'(applique sin<sup>−1</sup>)' },
        check: (st) => nodeEq(st.left, simple([TH])) && nodeEq(st.right, func('asin', simple([Y]))),
        solution: () => ({ left: simple([TH]), right: func('asin', simple([Y])) }),
        explication: '<p>sin<sup>−1</sup> annule le sinus : sin<sup>−1</sup>(sin(θ)) = θ. À droite, y devient sin<sup>−1</sup>(y) : θ = sin<sup>−1</sup>(y).</p>',
    },
    {   titre: 'Supprimer un sin⁻¹',
        instruction: "Et dans l'autre sens : si l'équation contient déjà un sin<sup>−1</sup>, quelle fonction faut-il appliquer pour l'enlever ? Glisse l'outil <b>sin</b> sur le côté gauche, PUIS sur le côté droit.",
        left: () => func('asin', simple([X])),
        right: () => simple([TH]),
        toolFn: 'sin',
        opDiagram: { label: 'sin', noteLeft:'(applique sin)', noteRight:'(applique sin)' },
        check: (st) => nodeEq(st.left, simple([X])) && nodeEq(st.right, func('sin', simple([TH]))),
        solution: () => ({ left: simple([X]), right: func('sin', simple([TH])) }),
        explication: '<p>sin annule sin<sup>−1</sup> : sin(sin<sup>−1</sup>(x)) = x. À droite, θ devient sin(θ) : x = sin(θ).</p>',
    },
];
[...M_RACINE, ...M_SINUS].forEach(m => { m.diag = st => diagFonction(st, m); });

// une manipulation = un item d'« À toi » (partie 'perso' : l'éditeur)
const manip = m => ({ titre: m.titre, enonce: `<p>${m.instruction}</p>`,
    parties: [{ type: 'perso', solution: m.explication, monter: (zone, api) => monterEditeur(zone, m, api) }] });

// ═══════════════════════════════════════════════════════════════
// LE COURS PAR ÉTAPES
// ═══════════════════════════════════════════════════════════════
const { exemple } = COURS;
const T = (id, label) => tile(id, label || id);
const fr = (a, b) => `<span class="som-fr"><span>${a}</span><span>${b}</span></span>`;
// exemple traité : l'équation avant et après la manipulation
const avantApres = (avant, op, apres) => `<div class="ep-avap">
    <div class="ep-av"><p class="ep-av-t">Avant</p>${avant}</div>
    <p class="ep-op">${op}</p>
    <div class="ep-av"><p class="ep-av-t">Après</p>${apres}</div></div>`;
const MODE_EMPLOI = `<div class="callout"><p><b>Dans l'éditeur.</b> Glisse l'outil de la palette (à la souris ou au doigt) sur un membre de l'équation : une fois à gauche, puis une fois à droite. ↺ Recommencer remet l'équation de départ. Clique sur <b>Valider</b> quand c'est fait.</p></div>`;
// les crochets des racines des exemples se dessinent une fois la carte affichée
const ajouter = (c, carte, html) => { const d = c.ajouter(carte, html); sizeSqrtHooks(d); return d; };

/* ---------- 1. Racine carrée et carré ---------- */
function etape1(c) {
    const carte = c.carte('1. Racine carrée et carré');
    ajouter(c, carte, `<div class="cours-bloc">
        <p>Certaines équations utilisent des fonctions mathématiques (racine carrée, carré, sinus…) appliquées à une grandeur. Pour supprimer une fonction, il faut appliquer sa <b>fonction réciproque</b> aux deux membres de l'équation : elle annule la fonction du côté où elle s'applique, et apparaît de l'autre côté.</p>
        <div class="cle"><p><b class="cle-titre">Règle.</b> Pour supprimer une fonction, on applique sa fonction réciproque aux <b>deux membres</b>. La réciproque de la racine carrée √ est le carré x², et inversement.</p></div>
      </div>
      ${exemple(`<p>Dans v = √(2gh), on applique le carré aux deux membres :</p>
        ${avantApres(eqStat(simple([T('v')]), func('sqrt', simple([T('2'), T('g'), T('h')]))), 'x² des deux côtés',
                     eqStat(func('sq', simple([T('v')])), simple([T('2'), T('g'), T('h')])))}
        <p>À droite, le carré annule la racine ; à gauche, v devient v² : v² = 2gh. On peut ensuite isoler h avec les règles du module 1 : h = ${fr('v²', '2g')}.</p>`)}
      ${MODE_EMPLOI}`);
    c.aToi(carte, M_RACINE.map(manip));
    return carte;
}

/* ---------- 2. Sinus et sin⁻¹ ---------- */
function etape2(c) {
    const carte = c.carte('2. Sinus et sin<sup>−1</sup>');
    ajouter(c, carte, `<div class="cours-bloc">
        <p>Le sinus a lui aussi une fonction réciproque, notée <b>sin<sup>−1</sup></b> (on dit aussi « arcsinus ») : si sin(θ) = y, alors θ = sin<sup>−1</sup>(y). Sur la calculatrice, c'est la touche sin<sup>−1</sup> (ou asin).</p>
        <div class="cle"><p><b class="cle-titre">Règle.</b> La réciproque de sin est sin<sup>−1</sup>, et inversement : sin(θ) = y &nbsp;⇔&nbsp; θ = sin<sup>−1</sup>(y).</p></div>
      </div>
      ${exemple(`<p>Un rayon lumineux arrive avec un angle i tel que sin(i) = 0,5. On applique sin<sup>−1</sup> aux deux membres :</p>
        ${avantApres(eqStat(func('sin', simple([T('i')])), simple([T('0,5')])), 'sin<sup>−1</sup> des deux côtés',
                     eqStat(simple([T('i')]), func('asin', simple([T('0,5')]))))}
        <p>La calculatrice (en degrés) donne i = sin<sup>−1</sup>(0,5) = 30°.</p>`)}`);
    c.aToi(carte, M_SINUS.map(manip));
    return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
    const carte = c.carte('À retenir');
    c.ajouter(carte, `<div class="cle"><p>Pour supprimer une fonction (racine carrée, carré, sinus…), on applique sa <b>fonction réciproque</b> aux <b>deux membres</b> : elle annule la fonction d'un côté et apparaît de l'autre.</p>
        <div class="crs-defile"><table class="crs-tab">
          <tr><th>Fonction</th><th>Fonction réciproque</th><th>Exemple</th></tr>
          <tr><td>√ (racine carrée)</td><td>x² (carré)</td><td>x = √y &nbsp;⇔&nbsp; x² = y</td></tr>
          <tr><td>x² (carré)</td><td>√ (racine carrée)</td><td>x² = y &nbsp;⇔&nbsp; x = √y</td></tr>
          <tr><td>sin</td><td>sin<sup>−1</sup> (arcsinus)</td><td>sin(θ) = y &nbsp;⇔&nbsp; θ = sin<sup>−1</sup>(y)</td></tr>
          <tr><td>sin<sup>−1</sup></td><td>sin</td><td>θ = sin<sup>−1</sup>(x) &nbsp;⇔&nbsp; sin(θ) = x</td></tr>
        </table></div></div>
      <div class="cle"><p>Exemple : v = √(2gh) donne v² = 2gh, puis h = ${fr('v²', '2g')}.</p></div>
      <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_9.html">Entraînement →</a>
        <a class="btn-secondary" style="text-decoration:none" href="fiche_4.html">Fiche récapitulative</a></div>`);
    return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
</script>
