<title>Module 3 : questions — Bilan des forces</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="bf.css">

<body>
<div id="app-nav"></div>
<div class="er-page" id="app"></div>

<script>
/* ============================================================
   Série du module 3 : 10 questions, au choix du niveau (2de, 1re, Tle) :
   calcul du poids, masse à partir du poids, poids sur la Lune, réaction
   sans frottement, tension d'un fil, force de l'air, nom d'un vecteur force
   (situations du niveau, situations.js) ; en 1re et en Terminale, sens des
   frottements et <span class="vec-nom">R</span> = <span class="vec-nom">R</span>ₙ + <span class="vec-nom">f</span> ; en Terminale, poussée d'Archimède.
   ============================================================ */
const { o, fq, fmt, sci, hasard, melanger, proche, cap, nomV, scene, sceneRemplie, couleursForces, OPTS_AIR, bonneAir, REGLE_AIR, SITUATIONS: S, PARCOURS } = BF;
// situations du niveau choisi (et des niveaux précédents) : fixées par tirage()
const RANG = { '2de': 0, '1re': 1, Tle: 2 };
let TOUTES = PARCOURS.map(id => S[id]);
const calc = h => `<p class="ph-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const r3 = v => +v.toPrecision(3);

const QUESTIONS = [
  function poids() {
    const [m, u] = hasard([[850, 'kg'], [46, 'g'], [400, 'g'], [600, 'kg'], [10, 't'], [72, 'kg']]);
    const mk = u === 'g' ? m / 1000 : u === 't' ? m * 1000 : m, P = mk * 9.81;
    return { theme: 'Le poids', enonce: `<p>Un système a une masse de ${fmt(m)} ${u === 't' ? 'tonnes' : u}.</p>`,
      parties: [{ type: 'sci', q: 'Calcule son poids (g = 9,81 N/kg, 3 chiffres significatifs).', label: 'P =', valeur: P, unite: 'N', calc: true, cs: 3, rel: .01,
        diag: v => proche(v, m * 9.81, .02) && u !== 'kg' ? 'Convertis la masse en kg.' : proche(v, mk / 9.81, .02) ? 'On multiplie : P = m × g.' : 'P = m × g, m en kg.',
        solution: calc(`m = ${fmt(mk)} kg ; P = m × g = ${fmt(mk)} × 9,81 ≈ ${c(sci(P, 3) + ' N')}`) }] };
  },
  function masse() {
    const P = hasard([490.5, 735.75, 19.62, 2943]);
    return { theme: 'Le poids', enonce: `<p>Le poids d'un objet vaut ${fmt(P)} N (g = 9,81 N/kg).</p>`,
      parties: [fq.nombre('Quelle est sa masse ?', 'm =', P / 9.81, 'kg', { signe: false, calc: true, rel: .01, diag: v => (proche(v, P * 9.81, .02) ? 'P = m × g donc m = P / g : on divise.' : 'm = P / g.'), solution: calc(`m = P / g = ${fmt(P)} / 9,81 = ${c(fmt(r3(P / 9.81)) + ' kg')}`) })] };
  },
  function lune() {
    const m = hasard([80, 60, 150, 25]);
    return { theme: 'Poids et masse', enonce: `<p>Un astronaute équipé a une masse de ${m} kg. Il marche sur la Lune (g<sub>Lune</sub> = 1,62 N/kg).</p>`,
      parties: [fq.nombre('Calcule son poids sur la Lune (3 chiffres significatifs).', 'P =', m * 1.62, 'N', { signe: false, calc: true, rel: .01, affiche: fmt(r3(m * 1.62)),
        diag: v => (proche(v, m * 9.81, .02) ? 'Sur la Lune, g = 1,62 N/kg.' : proche(v, m, .01) ? 'Ce nombre est sa masse (en kg) ; son poids est P = m × g.' : 'P = m × g<sub>Lune</sub>.'), solution: calc(`P = ${m} × 1,62 ≈ ${c(fmt(r3(m * 1.62)) + ' N')}`) })] };
  },
  function reaction() {
    const s = hasard([S.skieurSans, S.palet, S.brique]);
    return { theme: 'Réaction du support', enonce: `<p>${s.enonce}</p><div class="bf-sc-cadre">${scene(s)}</div>`,
      parties: [fq.choix('Sans frottement, la réaction du support est :', [o('perp', 'perpendiculaire au support'), o('vert', 'toujours verticale, vers le haut'), o('para', 'parallèle au support'), o('opp', 'toujours opposée au poids')], 'perp',
        { indices: { vert: 'Pense au support incliné : la réaction n\'y est pas verticale.', para: 'Une force parallèle au support, ce sont les frottements.', opp: 'Sur un support incliné, la réaction n\'est pas opposée au poids.' }, solution: '<p>Sans frottement, la réaction du support est perpendiculaire au support : c\'est la réaction normale.</p>' })] };
  },
  function tension() {
    const [t, q, bonne, sol] = hasard([['Une lampe est suspendue au plafond par un câble vertical.', 'la force exercée par le câble sur la lampe', 'haut', 'Le câble tire la lampe vers le plafond.'],
      ['Un enfant tire un traîneau avec une corde horizontale, vers la droite.', 'la force exercée par la corde sur le traîneau', 'droite', 'La corde tire le traîneau vers l\'enfant.'],
      ['Une masse est accrochée sous un ressort fixé au plafond.', 'la force exercée par le ressort sur la masse', 'haut', 'Le ressort tire la masse vers le plafond.']]);
    return { theme: 'Tension d\'un fil', enonce: `<p>${t}</p>`, parties: [fq.choix(`Direction et sens de ${q} :`, [o('haut', 'verticale, vers le haut'), o('bas', 'verticale, vers le bas'), o('droite', 'horizontale, vers la droite'), o('gauche', 'horizontale, vers la gauche')], bonne,
      { melanger: false, colonne: true, indice: 'Un fil tire le système le long du fil, vers ce qui le retient ou le tire.', solution: `<p>${sol}</p>` })] };
  },
  function archimede() {
    const [t, bonne, sol] = hasard([['Un bateau flotte, immobile.', 'egal', 'Immobile : la poussée d\'Archimède compense le poids.'], ['Une montgolfière s\'élève.', 'plus', 'Elle monte : F<sub>archi</sub> &gt; P.'],
      ['Une bille d\'acier coule au fond d\'un verre d\'eau.', 'moins', 'Elle coule : F<sub>archi</sub> &lt; P (la poussée existe pourtant).']]);
    return { theme: 'Poussée d\'Archimède', enonce: `<p>${t}</p>`, parties: [fq.choix('Compare la valeur de la poussée d\'Archimède à celle du poids :', [o('plus', 'F<sub>archi</sub> &gt; P'), o('egal', 'F<sub>archi</sub> = P'), o('moins', 'F<sub>archi</sub> &lt; P')], bonne,
      { melanger: false, indice: 'Le système monte, reste immobile ou coule ?', solution: `<p>${sol} La poussée d'Archimède est verticale, vers le haut.</p>` })] };
  },
  function air() {
    const s = hasard(TOUTES.filter(x => x.air)), bonne = bonneAir(s.air);
    return { theme: 'La force de l\'air', enonce: `<p>${s.enonce}</p><div class="bf-sc-cadre">${scene(s)}</div>`,
      parties: [fq.choix('L\'air touche le système : peut-on négliger sa force ?', OPTS_AIR, bonne, { melanger: false, colonne: true, indice: s.air.indice || REGLE_AIR, solution: `<p>${s.air.raison}</p>` })] };
  },
  function frottements() {
    const [t, bonne, sol] = hasard([['Une voiture à traction avant démarre vers la droite. Frottements de la route sur les roues avant (motrices) :', 'avant', 'Sans frottement, les roues motrices patineraient : les frottements sont vers l\'avant (force motrice).'],
      ['Une voiture à traction avant démarre vers la droite. Frottements de la route sur les roues arrière :', 'arriere', 'Sans frottement, les roues arrière avanceraient sans tourner : frottements vers l\'arrière.'],
      ['Une voiture roule vers la droite et freine, roues bloquées. Frottements de la route sur les roues :', 'arriere', 'Sans frottement, les roues bloquées glisseraient vers l\'avant : frottements vers l\'arrière.'],
      ['Un livre glisse vers la droite sur une table. Frottements de la table sur le livre :', 'arriere', 'Le livre glisse vers la droite : les frottements sont vers la gauche (l\'arrière).']]);
    return { theme: 'Frottements solides', enonce: `<p>${t}</p>`, parties: [fq.choix('Dans quel sens sont dirigés les frottements ?', [o('avant', 'vers l\'avant (vers la droite)'), o('arriere', 'vers l\'arrière (vers la gauche)')], bonne,
      { melanger: false, indice: 'Imagine le mouvement sans frottement : dans quel sens glisserait le point de contact ?', solution: `<p>${sol}</p>` })] };
  },
  function nom() {
    const s = hasard(TOUTES), i = Math.floor(Math.random() * s.forces.length), f = s.forces[i];
    const opts = melanger(s.nomsProposes.filter(k => f.noms.indexOf(k) === -1)).slice(0, 3).map(k => o(k, nomV(k))).concat([o(f.noms[0], nomV(f.noms[0]))]);
    const cols = couleursForces(s.forces);
    return { theme: 'Nom du vecteur', enonce: `<p>${s.enonce}</p><div class="bf-sc-cadre">${scene(s, { forces: s.forces.map((g, k) => ({ pt: g.pts[0], ang: g.angs[0], num: k + 1, coul: cols[k], cote: g.cote, L: g.L, etat: k === i ? 'actif' : '' })) })}</div>`,
      parties: [fq.choix(`Comment note-t-on la force n° ${i + 1} (${f.lib}) ?`, opts, f.noms[0], { indice: f.indNom, solution: `<p>${f.indNom}</p>` })] };
  },
  function decompose() {
    const s = hasard([S.incline, S.livreIncline, S.livre, S.skieur]);
    return { theme: 'Réaction et frottements', enonce: `<p>${s.enonce}</p><div class="bf-sc-cadre">${sceneRemplie(s, { reaction: true })}</div><p>La réaction du support <span class="vec-nom">R</span> est dessinée en noir.</p>`,
      parties: [fq.choix('Quelle relation est juste ?', [o('ok', `${nomV('R')} = ${nomV('RN')} + ${nomV('f')}`), o('moins', `${nomV('R')} = ${nomV('RN')} − ${nomV('f')}`), o('p', `${nomV('R')} = ${nomV('P')} + ${nomV('f')}`), o('rn', `${nomV('R')} = ${nomV('RN')}`)], 'ok',
        { indices: { moins: 'La réaction est la <b>somme</b> de ses deux composantes.', p: 'Le poids est exercé par la Terre, pas par le support.', rn: 'Avec frottements, la réaction n\'est plus perpendiculaire au support.' }, solution: `<p>${nomV('R')} = ${nomV('RN')} + ${nomV('f')} : réaction normale (perpendiculaire au support) plus frottements (parallèles au support).</p>` })] };
  },
];

// sortes de questions de chaque niveau (10 questions ; une sorte peut revenir, avec un autre énoncé)
const Q = {};
QUESTIONS.forEach(f => { Q[f.name] = f; });
const SORTES = {
  '2de': ['poids', 'masse', 'lune', 'reaction', 'tension', 'air', 'nom', 'tension', 'air', 'nom'],
  '1re': ['poids', 'masse', 'reaction', 'tension', 'air', 'nom', 'frottements', 'frottements', 'decompose', 'nom'],
  Tle: ['poids', 'lune', 'reaction', 'tension', 'archimede', 'archimede', 'air', 'nom', 'frottements', 'decompose'],
};
function tirage(niv) {
  TOUTES = PARCOURS.map(id => S[id]).filter(s => RANG[s.niv] <= RANG[niv]);
  const qs = [], vus = [];
  SORTES[niv].forEach(k => {
    // pas deux fois le même énoncé
    let q, essais = 0;
    do { q = Q[k](); } while (vus.indexOf(q.enonce + q.parties[0].q) !== -1 && ++essais < 20);
    vus.push(q.enonce + q.parties[0].q);
    qs.push(q);
  });
  return melanger(qs);
}

BF.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 3 · QUESTIONS', titre: 'Les forces usuelles',
  intro: '<p class="er-contexte">10 questions : poids et masse, réaction du support, tension d\'un fil, force de l\'air, noms des forces ; en 1re et en Terminale, frottements solides ; en Terminale, poussée d\'Archimède.</p>',
  niveaux: [{ id: '2de', nom: '2de' }, { id: '1re', nom: '1re' }, { id: 'Tle', nom: 'Terminale' }],
  questions: tirage,
  revoir: { href: 'module_3a_cours.html', label: 'Revoir les cours' },
  suite: { href: 'module_4_cours.html', label: 'Module 4 : centre de masse →' },
});
BF.menu('module_3_questions');
</script>
</body>
