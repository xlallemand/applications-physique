<!DOCTYPE html>

<style>
/* ============================================================
   Contenu à valider : compétences, niveaux, questions et formulaires
   de la famille « Combiner des équations » (equations-physique-mobile).
   Tout est modifiable : un appui sur un texte l'ouvre en écriture
   (notation linéaire : m_NaOH indice, v^2 puissance, a / b fraction,
   √( ) racine ; une équation par ligne, « (inutile) » devant une
   équation qui ne sert pas). Statut et remarque pour chaque élément.
   Les modifications sont gardées dans ce navigateur ; « Exporter »
   fabrique un fichier à me renvoyer.
   ============================================================ */
body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); margin: 0; padding: 0 0 80px; }
.page { max-width: 1320px; margin: 0 auto; padding: 0 16px; }
.barre { position: sticky; top: 0; z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line); }
.barre-in { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.barre-in b { margin-right: auto; }
.cpt { font-size: .85rem; color: var(--ink-2); }
h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; margin: 24px 0 6px; }
h2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; margin: 34px 0 8px; }
.note { color: var(--ink-2); line-height: 1.55; max-width: 950px; }
.note b { color: var(--ink); }
.regles { background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 6px 16px; }
.regle { display: grid; grid-template-columns: 200px 1fr 230px; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--paper-3); align-items: start; }
.regle:last-child { border-bottom: 0; }
.regle > b { font-size: .92rem; }
.ed { border-radius: 8px; padding: 3px 5px; margin: -3px -5px; line-height: 1.45; cursor: text; outline: none; }
.ed:hover { background: var(--paper); }
.ed:focus { background: var(--cle-bg); box-shadow: inset 0 0 0 1.5px var(--accent); white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88rem; }
.ed.modif { box-shadow: inset 3px 0 0 var(--accent); }
.etat { display: flex; flex-direction: column; gap: 5px; }
.etat-b { display: flex; gap: 4px; flex-wrap: wrap; }
.etat-b button { font: inherit; font-size: .75rem; font-weight: 700; border: 0; border-radius: 999px; padding: 4px 9px; background: var(--paper); color: var(--ink-2); cursor: pointer; touch-action: manipulation; }
.etat-b button[aria-pressed="true"][data-v="ok"] { background: var(--success-bg); color: var(--success-text); }
.etat-b button[aria-pressed="true"][data-v="mod"] { background: var(--cle-bg); color: var(--accent-ink); }
.etat-b button[aria-pressed="true"][data-v="sup"] { background: var(--danger-bg); color: var(--danger-text); }
textarea { font: inherit; font-size: .82rem; border: 1px solid var(--line-strong); border-radius: 10px; padding: 5px 7px; resize: vertical; min-height: 30px; width: 100%; box-sizing: border-box; background: var(--sheet); color: var(--ink); }
.comp { background: var(--sheet); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin: 0 0 22px; }
.comp-t { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 10px; }
.comp-id { background: var(--ink); color: var(--sheet); font-weight: 800; border-radius: 999px; padding: 3px 12px; }
.comp-t h3 { margin: 0; font-size: 1.15rem; letter-spacing: -.01em; }
section.comp { scroll-margin-top: 70px; }
.pastille .ed, .comp-t h3 .ed { display: inline-block; }
.pastille { font-size: .78rem; font-weight: 800; border-radius: 999px; padding: 3px 10px; background: var(--cle-bg); color: var(--accent-ink); }
.fiche { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; font-size: .9rem; background: var(--paper); border-radius: 14px; padding: 10px 12px; margin: 0 0 8px; }
.fiche > span:nth-child(odd) { font-weight: 700; color: var(--ink-2); font-size: .82rem; padding-top: 2px; }
.defile { overflow-x: auto; }
table.q { border-collapse: collapse; width: 100%; min-width: 1100px; font-size: .88rem; }
table.q th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-2); background: var(--paper); padding: 6px 8px; position: sticky; top: 0; }
table.q td { border-top: 1px solid var(--paper-3); padding: 8px; vertical-align: top; }
table.q tr.sup td { opacity: .45; }
table.q tr.sup td:last-child { opacity: 1; }
.c-n { width: 52px; font-weight: 800; color: var(--ink-2); font-size: .78rem; }
.c-d { width: 46px; } .c-cl { width: 52px; } .c-ctx { width: 230px; } .c-eq { width: 210px; } .c-ci { width: 60px; } .c-av { width: 120px; } .c-fo { width: 170px; } .c-et { width: 200px; }
.eqs .l { display: block; white-space: nowrap; }
.eqs .l.inu { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.eqs .l.inu::after { content: '  inutile'; font-size: .7rem; font-weight: 800; text-decoration: none; color: var(--ink-2); }
.ctx-t { font-weight: 700; display: block; }
.ajout { margin-top: 10px; }
.form { background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px; margin: 0 0 14px; display: grid; grid-template-columns: 260px 1fr 230px; gap: 12px; }
.form .eqs .l { padding: 1px 0; }
.btn { font: inherit; font-weight: 700; font-size: .85rem; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; background: var(--sheet); box-shadow: inset 0 0 0 1.5px var(--paper-3); color: var(--ink); touch-action: manipulation; }
.btn.noir { background: var(--ink); color: var(--sheet); box-shadow: none; }
.filtres { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 0; }
.filtres button { font: inherit; font-size: .8rem; font-weight: 700; border: 0; border-radius: 999px; padding: 5px 11px; background: var(--paper); cursor: pointer; }
.filtres button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.recap { width: 100%; border-collapse: collapse; background: var(--sheet); border-radius: 14px; overflow: hidden; font-size: .9rem; }
.recap th, .recap td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: center; }
.recap th:first-child, .recap td:first-child { text-align: left; }
@media (max-width: 760px) {
  .regle, .form { grid-template-columns: 1fr; }
  .fiche { grid-template-columns: 1fr; }
}
</style>

<script>
/* ============================================================
   1. LE CONTENU PROPOSÉ (valeurs de départ, jamais modifiées ici :
      les changements sont gardés à part, dans le stockage du navigateur)

// règles générales de la mise en œuvre (choix de la maquette)
const REGLES = [
  ['famille', 'Famille', 'Nouvelle famille « CO · Combiner des équations » dans les séances habituelles de 5 questions, avec Mon suivi, Fiches, Réglages, succès (un succès de famille comme MU, AD, FO).'],

  ['report', 'Report (B1)', 'Dès qu’une grandeur est seule à gauche d’une équation (étape vérifiée), l’outil « grandeur = expression » apparaît dans la réserve des autres équations ; on le glisse sur la grandeur à remplacer. Une fraction se répartit de part et d’autre du trait ; dans un carré, chaque grandeur prend la puissance (v = d / Δt dans v^2 → d^2 / Δt^2).'],

  ['inutile', 'Équation inutile (G1)', 'Dès la 1re (compétence CO5, puis CO7 et CO8) : le bilan dit pourquoi l’équation ne servait pas. La reporter n’est pas une erreur, mais la question ne finit pas tant que ses grandeurs restent.'],
  ['formulaire', 'Formulaire (E1)', 'CO8 (Terminale) : l’élève choisit ses équations (4 au plus) dans le formulaire du chapitre, « + Utiliser » ; elles prennent les indices de la situation. Choisir une formule inutile ne compte pas comme une erreur.'],

  ['decouverte', 'Découverte', 'Deux écrans de plus à la fin de la Découverte des méthodes : « Remplacer une grandeur » (c = n / V et n = m / M, c en fonction de m, M et V) puis « Remplacer et simplifier » (P = m g et P = G M_T m / R_T^2, g en fonction de G, M_T et R_T).'],

];

let etat = {};
try { etat = JSON.parse(localStorage.getItem(CLE) || '{}') || {}; } catch (e) { etat = {}; }
const garder = () => { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) { /* stockage indisponible */ } compter(); };
// valeur d'un champ : modifiée, ou d'origine
const val = (k, orig) => (etat[k] && etat[k].v !== undefined ? etat[k].v : orig);

/* ---------- écriture : indices, puissances (notation linéaire → HTML) ---------- */
function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function rendu(t) {
  return esc(t)
    .replace(/_\{([^}]*)\}/g, '<sub>$1</sub>')
    .replace(/_([A-Za-zÀ-ÿ0-9½′]+)/g, '<sub>$1</sub>')
    .replace(/\^\(([^)]*)\)/g, '<sup>$1</sup>')
    .replace(/\^([A-Za-z0-9½]+)/g, '<sup>$1</sup>');
}
const rendreEqs = t => t.split('\n').filter(l => l.trim()).map((l, k) => {
  const inu = /^\(inutile\)\s*/.test(l);
  return `<span class="l${inu ? ' inu' : ''}">${k + 1}. ${rendu(l.replace(/^\(inutile\)\s*/, ''))}</span>`;
}).join('');

/* ---------- un champ modifiable : affiché mis en forme, écrit en notation linéaire ---------- */
function champ(k, orig, type) {
  const v = val(k, orig);
  const aff = type === 'eqs' ? rendreEqs : type === 'html' ? (x => x) : rendu;
  return `<div class="ed${type === 'eqs' ? ' eqs' : ''}${v !== orig ? ' modif' : ''}" contenteditable="true" spellcheck="false" data-k="${k}" data-t="${type || ''}">${aff(v)}</div>`;
}
// statut (validé, à modifier, à supprimer) et remarque
function statut(k) {
  const s = (etat['s:' + k] || {}).v || '', r = (etat['r:' + k] || {}).v || '';
  const b = (v, t) => `<button type="button" data-s="${k}" data-v="${v}" aria-pressed="${s === v}">${t}</button>`;
  return `<div class="etat"><div class="etat-b">${b('ok', '✓ Validé')}${b('mod', '✎ À modifier')}${b('sup', '✗ Supprimer')}</div><textarea data-r="${k}" placeholder="Remarque…">${esc(r)}</textarea></div>`;
}

/* ============================================================
   3. LA PAGE
   ============================================================ */
const NOMS = { '2de': '2de', '1re': '1re', tle: 'Terminale' };
let filtre = '';
function page() {
  let h = `<h1>Combiner des équations : contenu à valider</h1>
  <p class="note">Tout se modifie : touche un texte pour l’écrire (notation linéaire : <b>m_NaOH</b> pour un indice, <b>v^2</b> pour une puissance, <b>a / b</b> pour une fraction, <b>√( )</b> ; une équation par ligne, <b>(inutile)</b> devant une équation qui ne sert pas). Pour chaque élément : ✓ Validé, ✎ À modifier ou ✗ Supprimer, et une remarque. Tes changements restent dans ce navigateur ; quand tu as fini, <b>⤓ Exporter mes modifications</b> fabrique un fichier à me renvoyer (ou <b>Copier</b>, puis colle le texte dans la conversation). Pour ajouter une question, utilise « + Ajouter une question » sous la compétence.</p>`;

  // récapitulatif : nombre de questions par compétence et par classe
  h += `<h2>Récapitulatif</h2><div class="defile"><table class="recap"><thead><tr><th>Compétence</th><th>Classe</th><th>Niveau</th><th>2de</th><th>1re</th><th>Terminale</th><th>Total</th></tr></thead><tbody>`;
  COMPS.forEach(c => {
    const qs = toutes().filter(q => q.comp === c.id);
    const n = cl => qs.filter(q => q.classe === cl).length;
    h += `<tr><td><b>${c.id}</b> ${val('c:' + c.id + ':titre', c.titre)}</td><td>${NOMS[val('c:' + c.id + ':classe', c.classe)] || ''}</td><td>${val('c:' + c.id + ':niveau', c.niveau)}</td><td>${n('2de') || ''}</td><td>${n('1re') || ''}</td><td>${n('tle') || ''}</td><td><b>${qs.length}</b></td></tr>`;
  });
  h += `</tbody></table></div>`;

  // règles générales
  h += `<h2>Règles de mise en œuvre</h2><div class="regles">` + REGLES.map(r => `<div class="regle"><b>${r[1]}</b>${champ('g:' + r[0], r[2])}${statut('g:' + r[0])}</div>`).join('') + `</div>`;

  // compétences et questions
  h += `<h2>Compétences et questions</h2><p class="note">Classe : classe minimale de la compétence (réglage « Ma classe »). Niveau : ordre de progression dans le mode automatique (MU1, MU2 : 1 ; MU3, AD1 : 2…). Diff. : difficulté de la question (1 à 3), qui fixe aussi l’affichage du bandeau d’objectif (difficulté 1).</p>
  <div class="filtres" role="group" aria-label="Classe des questions"><span class="cpt">Questions affichées :</span>${[['', 'Toutes'], ['2de', '2de'], ['1re', '1re'], ['tle', 'Terminale']].map(f => `<button type="button" data-f="${f[0]}" aria-pressed="${filtre === f[0]}">${f[1]}</button>`).join('')}</div><br>`;
  COMPS.forEach(c => {
    const k = 'c:' + c.id + ':';
    h += `<section class="comp" id="${c.id}"><div class="comp-t"><span class="comp-id">${c.id}</span><h3>${champ(k + 'titre', c.titre)}</h3>
      <span class="pastille">Classe ${champ(k + 'classe', c.classe)}</span><span class="pastille">Niveau ${champ(k + 'niveau', c.niveau)}</span><span class="pastille">Prérequis ${champ(k + 'prerequis', c.prerequis)}</span></div>
      <div class="fiche"><span>Équations</span>${champ(k + 'nb', c.nb)}<span>Fiche : règle</span>${champ(k + 'regle', c.regle, 'html')}<span>Méthode</span>${champ(k + 'methode', c.methode, 'html')}<span>Piège</span>${champ(k + 'piege', c.piege, 'html')}<span>Statut</span>${statut('c:' + c.id)}</div>
      <div class="defile"><table class="q"><thead><tr><th class="c-n">N°</th><th class="c-d">Diff.</th><th class="c-cl">Classe</th><th class="c-ctx">Situation</th><th class="c-eq">Équations données</th><th class="c-ci">Exprimer</th><th class="c-av">En fonction de</th><th class="c-fo">Forme finale</th><th class="c-et">Statut, remarque</th></tr></thead><tbody>`;
    toutes().filter(q => q.comp === c.id).forEach(q => {
      const cl = val('q:' + q.id + ':classe', q.classe);
      if (filtre && cl !== filtre) return;
      const sup = (etat['s:q:' + q.id] || {}).v === 'sup';
      const K = 'q:' + q.id + ':';
      h += `<tr class="${sup ? 'sup' : ''}"><td class="c-n">${q.id}</td><td>${champ(K + 'diff', String(q.diff))}</td><td>${champ(K + 'classe', q.classe)}</td>
        <td><span class="ctx-t">${champ(K + 'titre', q.titre)}</span>${champ(K + 'ctx', q.ctx)}</td><td>${champ(K + 'eqs', q.eqs, 'eqs')}</td>
        <td>${champ(K + 'cible', q.cible)}</td><td>${champ(K + 'avec', q.avec)}</td><td>${champ(K + 'forme', q.forme)}</td><td>${statut('q:' + q.id)}</td></tr>`;
    });
    h += `</tbody></table></div><button class="btn ajout" type="button" data-ajout="${c.id}">+ Ajouter une question à ${c.id}</button></section>`;
  });

  // formulaires
  h += `<h2>Formulaires des chapitres (CO8)</h2><p class="note">Formules proposées à l’élève dans « Choisis tes équations » (E1). Une formule par ligne.</p>` +
    FORMS.map(f => `<div class="form"><div><b>${f.id}</b>${champ('f:' + f.id + ':titre', f.titre)}</div>${champ('f:' + f.id + ':f', f.f, 'eqs')}${statut('f:' + f.id)}</div>`).join('');
  document.getElementById('page').innerHTML = h;
  compter();
}

// questions d'origine + questions ajoutées (numérotées CO1-01…)
function toutes() {
  const L = [], n = {};
  Q.forEach(x => {
    n[x[0]] = (n[x[0]] || 0) + 1;
    L.push({ id: x[0] + '-' + String(n[x[0]]).padStart(2, '0'), comp: x[0], diff: x[1], classe: x[2], titre: x[3], ctx: x[4], eqs: x[5], cible: x[6], avec: x[7], forme: x[8] });
  });
  (etat.ajouts || []).forEach(a => L.push(a));
  return L;
}
function compter() {
  const s = Object.keys(etat).filter(k => k.startsWith('s:'));
  const nb = v => s.filter(k => etat[k].v === v).length;
  const mods = Object.keys(etat).filter(k => !k.startsWith('s:') && !k.startsWith('r:') && k !== 'ajouts').length;
  document.getElementById('cpt').textContent = `${toutes().length} questions · ${nb('ok')} validés · ${nb('mod')} à modifier · ${nb('sup')} à supprimer · ${mods} textes modifiés`;
}

/* ---------- écriture dans un champ : texte brut pendant l'écriture, mis en forme ensuite ---------- */
document.addEventListener('focusin', e => {
  const el = e.target.closest && e.target.closest('.ed');
  if (!el) return;
  const k = el.dataset.k;
  el.textContent = val(k, origine(k));
});
document.addEventListener('focusout', e => {
  const el = e.target.closest && e.target.closest('.ed');
  if (!el) return;
  const k = el.dataset.k, o = origine(k), v = el.innerText.replace(/ /g, ' ').replace(/\n+$/, '');
  if (v === o) delete etat[k]; else etat[k] = { v };
  garder();
  el.classList.toggle('modif', v !== o);
  el.innerHTML = el.dataset.t === 'eqs' ? rendreEqs(v) : el.dataset.t === 'html' ? v : rendu(v);
});
// valeur d'origine d'un champ, d'après sa clé
function origine(k) {
  const p = k.split(':');
  if (p[0] === 'g') return (REGLES.find(r => r[0] === p[1]) || [])[2] || '';
  if (p[0] === 'c') { const c = COMPS.find(x => x.id === p[1]); return c ? String(c[p[2]] || '') : ''; }
  if (p[0] === 'f') { const f = FORMS.find(x => x.id === p[1]); return f ? f[p[2]] : ''; }
  if (p[0] === 'q') { const q = toutes().find(x => x.id === p[1]); return q ? String(q[p[2]] || '') : ''; }
  return '';
}
// statuts, remarques, filtres, ajouts
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.s) {
    const k = 's:' + b.dataset.s, actif = b.getAttribute('aria-pressed') === 'true';
    if (actif) delete etat[k]; else etat[k] = { v: b.dataset.v };
    b.parentNode.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(!actif && x === b)));
    const tr = b.closest('tr'); if (tr) tr.classList.toggle('sup', !actif && b.dataset.v === 'sup');
    garder();
  } else if (b.dataset.f !== undefined) { filtre = b.dataset.f; page(); }
  else if (b.dataset.ajout) {
    const c = b.dataset.ajout, a = etat.ajouts = etat.ajouts || [];
    const n = a.filter(x => x.comp === c).length + 1;
    a.push({ id: c + '-N' + n, comp: c, diff: 1, classe: (COMPS.find(x => x.id === c) || {}).classe || '2de', titre: 'Nouvelle situation', ctx: 'Contexte…', eqs: 'a = b c\nb = d / e', cible: 'a', avec: 'c, d, e', forme: 'a = c d / e', ajout: true });
    garder(); page();
    document.getElementById(c).scrollIntoView({ block: 'end', behavior: 'smooth' });
  }
});
document.addEventListener('input', e => {
  if (!e.target.dataset || !e.target.dataset.r) return;
  const k = 'r:' + e.target.dataset.r;
  if (e.target.value.trim()) etat[k] = { v: e.target.value }; else delete etat[k];
  garder();
});

/* ---------- export : tout ce qui a changé, lisible, plus le détail en JSON ---------- */
function texteExport() {
  const lignes = ['Combiner des équations : retour de validation (' + new Date().toLocaleDateString('fr-FR') + ')', ''];
  Object.keys(etat).sort().forEach(k => {
    if (k === 'ajouts') return;
    const v = etat[k].v;
    if (k.startsWith('s:')) lignes.push(`[statut] ${k.slice(2)} : ${{ ok: 'validé', mod: 'à modifier', sup: 'à supprimer' }[v]}`);
    else if (k.startsWith('r:')) lignes.push(`[remarque] ${k.slice(2)} : ${v}`);
    else lignes.push(`[modifié] ${k}\n   avant : ${origine(k).replace(/\n/g, ' | ')}\n   après : ${String(v).replace(/\n/g, ' | ')}`);
  });
  (etat.ajouts || []).forEach(a => lignes.push(`[ajout] ${a.id} : ${['diff ' + val('q:' + a.id + ':diff', a.diff), val('q:' + a.id + ':classe', a.classe), val('q:' + a.id + ':titre', a.titre), val('q:' + a.id + ':ctx', a.ctx), val('q:' + a.id + ':eqs', a.eqs).replace(/\n/g, ' | '), 'exprimer ' + val('q:' + a.id + ':cible', a.cible), 'avec ' + val('q:' + a.id + ':avec', a.avec), val('q:' + a.id + ':forme', a.forme)].join(' ; ')}`));
  return lignes.join('\n') + '\n\n--- détail (JSON) ---\n' + JSON.stringify(etat);
}
document.getElementById('exporter').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texteExport()], { type: 'text/plain;charset=utf-8' }));
  a.download = 'combiner-equations-validation.txt';
  document.body.appendChild(a); a.click(); a.remove();
});
document.getElementById('copier').addEventListener('click', e => {
  const b = e.currentTarget;
  navigator.clipboard.writeText(texteExport()).then(() => { b.textContent = '✓ Copié'; setTimeout(() => { b.textContent = 'Copier'; }, 1500); }, () => { b.textContent = 'Copie impossible'; });
});
document.getElementById('raz').addEventListener('click', () => {
  if (!confirm('Effacer toutes tes modifications, statuts et remarques ?')) return;
  etat = {}; garder(); page();
});

page();
</script>
