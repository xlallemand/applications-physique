<!DOCTYPE html>
<html lang="fr" data-matiere="francais" data-teinte="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette : Orthographe (3e)</title>
<link rel="stylesheet" href="../../assets/theme.css">
<style>
/* =====================================================================
   Maquette de l'application Orthographe (3e, dictée du brevet)
   ---------------------------------------------------------------------
   Une seule page : barre de maquette (écran, option, appareil, couleur)
   puis un « cadre » qui simule l'application (sommaire à gauche sur
   ordinateur, bandeau « où suis-je » sur téléphone).
   Couleurs : variables de assets/theme.css. Seule exception : les trois
   teintes proposées pour le nouveau domaine « Français » (à valider,
   puis à déclarer dans theme.css).
   ===================================================================== */
html:root[data-teinte="a"] { --accent: #0e7490; --accent-ink: #0a5266; --cle-bg: #e0f0f4; --cle-line: #b9dce5; }
html:root[data-teinte="b"] { --accent: #9d2f72; --accent-ink: #6e1f50; --cle-bg: #f6e6ef; --cle-line: #e7c3d7; }
html:root[data-teinte="c"] { --accent: #8a6a00; --accent-ink: #5f4900; --cle-bg: #f5eed6; --cle-line: #e6d9a8; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper-2); color: var(--ink); font-family: var(--font-sans); line-height: 1.5; }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

/* ---------------- barre de la maquette (hors application) */
.mq { position: sticky; top: 0; z-index: 50; background: var(--ink); color: var(--sheet); padding: 8px 12px; }
.mq-l { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding: 3px 0; scrollbar-width: thin; }
.mq-l b { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); flex: none; margin-right: 4px; }
.mq-p { flex: none; border: 1px solid var(--ink-2); background: transparent; color: var(--sheet); border-radius: 99px; padding: 5px 11px; font-size: .85rem; cursor: pointer; }
.mq-p.on { background: var(--sheet); color: var(--ink); border-color: var(--sheet); }
.mq-p .pt { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
.mq-desc { font-size: .85rem; color: var(--paper-3); margin: 4px 0 2px; }

/* ---------------- cadre : application simulée */
.scene { padding: 16px 12px 40px; display: flex; justify-content: center; }
.cadre { background: var(--paper); width: 100%; max-width: 1280px; min-height: 80vh; border-radius: 14px; box-shadow: 0 2px 20px rgba(0,0,0,.08); position: relative; overflow: hidden; display: flex; }
.cadre.tel { max-width: 390px; display: block; border-radius: 28px; border: 8px solid var(--ink); min-height: 760px; }
.som { width: 264px; flex: none; background: var(--sheet); border-right: 1px solid var(--line); padding: 16px 12px; font-size: .9rem; }
.cadre.tel .som { display: none; }
.som-app { font-weight: 800; font-size: 1.05rem; }
.som-acc { display: inline-block; margin: 6px 0 14px; padding: 3px 10px; border-radius: 99px; background: var(--paper-2); font-size: .8rem; }
.som-lab { font-size: .72rem; text-transform: uppercase; color: var(--ink-3); letter-spacing: .05em; margin-bottom: 6px; }
.som-m { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; cursor: pointer; }
.som-m.on { background: var(--cle-bg); }
.som-n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .75rem; font-weight: 700; flex: none; }
.som-m.on .som-n { background: var(--accent); color: var(--sheet); }
.som-pages { margin: 2px 0 6px 19px; padding-left: 14px; border-left: 2px solid var(--cle-line); }
.som-pg { display: block; padding: 3px 8px; border-radius: 8px; color: var(--ink-2); cursor: pointer; font-size: .85rem; }
.som-pg.on { outline: 2px solid var(--accent); color: var(--ink); font-weight: 600; background: var(--sheet); }
.bandeau { display: none; }
.cadre.tel .bandeau { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 10px; background: var(--sheet); border-bottom: 1px solid var(--line); }
.bandeau .pil { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--cle-bg); border-radius: 99px; padding: 5px 12px 5px 6px; min-width: 0; }
.bandeau .pil small { display: block; color: var(--accent-ink); font-size: .7rem; line-height: 1.1; }
.bandeau .pil b { display: block; font-size: .88rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.corps { flex: 1; min-width: 0; padding: 22px 24px 60px; overflow-x: hidden; }
.cadre.tel .corps { padding: 14px 12px 50px; }
.page { max-width: 60rem; margin: 0 auto; }

/* ---------------- éléments de l'application (charte) */
.carte { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin: 0 0 14px; }
.cadre.tel .carte { padding: 14px; }
.badge { display: inline-block; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; background: var(--cle-bg); color: var(--accent-ink); border-radius: 6px; padding: 2px 8px; }
h2.titre { margin: 8px 0 4px; font-size: 1.45rem; }
.ctx { color: var(--ink-2); margin: 0; }
.btn { border: 0; border-radius: 12px; padding: 11px 18px; background: var(--ink); color: var(--sheet); font-weight: 600; cursor: pointer; min-height: 46px; }
.btn.sec { background: var(--paper-2); color: var(--ink); }
.btn.acc { background: var(--accent); color: var(--sheet); }
.btn.pt { padding: 6px 12px; min-height: 38px; font-size: .88rem; border-radius: 10px; }
.rangee { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cle { background: var(--cle-bg); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
.ok { background: var(--success-bg); color: var(--success-text); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
.ko { background: var(--danger-bg); color: var(--danger-text); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
.neutre { background: var(--paper); border-radius: 10px; padding: 10px 14px; margin: 10px 0; color: var(--ink-2); }
.petit { font-size: .85rem; color: var(--ink-3); }
.seg { display: inline-flex; background: var(--paper-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px 12px; cursor: pointer; font-size: .88rem; min-height: 38px; }
.seg button.on { background: var(--sheet); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 700; }
.reglage { display: grid; grid-template-columns: 11rem 1fr; gap: 6px 12px; align-items: center; margin: 6px 0; }
.cadre.tel .reglage { grid-template-columns: 1fr; }
.reglage > span { font-size: .88rem; color: var(--ink-2); }

/* ---------------- accueil */
.hero { background: var(--ink); color: var(--sheet); border-radius: 16px; padding: 26px 22px; margin-bottom: 14px; position: relative; overflow: hidden; }
.hero small { color: var(--cle-line); text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; }
.hero h1 { margin: 4px 0 6px; font-size: 1.8rem; }
.hero p { margin: 0; color: var(--paper-3); }
.hero .lettres { position: absolute; right: 14px; top: 6px; font-size: 4.5rem; font-weight: 800; color: var(--accent); opacity: .5; letter-spacing: -.04em; }
.reprendre { background: var(--ink); color: var(--sheet); border-radius: 14px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.mod { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; }
.mod-t { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
.mod-t .som-n { width: 30px; height: 30px; font-size: .85rem; }
.mod-t div { flex: 1; min-width: 0; }
.mod-t b { display: block; }
.mod-t span.d { color: var(--ink-2); font-size: .88rem; }
.cadre.tel .mod-t span.d { display: none; }
.mod-c { padding: 0 14px 14px 56px; display: none; }
.cadre.tel .mod-c { padding-left: 14px; }
.mod.ouvert .mod-c { display: block; }
.seance { border: 2px solid var(--accent); }
.seance h3 { margin: 0 0 6px; }
.pastilles-r { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.pr { background: var(--cle-bg); color: var(--accent-ink); border-radius: 99px; padding: 3px 10px; font-size: .82rem; font-weight: 600; }

/* ---------------- texte de dictée */
.dictee { font-size: 1.15rem; line-height: 2.2; background: var(--sheet); border-radius: 12px; }
.cadre.tel .dictee { font-size: 1.05rem; }
.mot { border-radius: 5px; padding: 1px 2px; cursor: default; }
.repere .mot, .cliquable .mot { cursor: pointer; }
.cliquable .mot:hover { background: var(--paper-2); }
.mot.faute { background: var(--cle-bg); border-bottom: 2px dashed var(--accent); cursor: pointer; }
.mot.sel { outline: 2px solid var(--accent); }
.mot.corrige { background: var(--success-bg); color: var(--success-text); border-bottom: 0; font-weight: 600; }
.mot.rate { background: var(--danger-bg); color: var(--danger-text); border-bottom: 0; }
.mot.fausse { background: var(--paper-2); text-decoration: underline wavy var(--ink-3); }
.fin { display: inline-flex; align-items: baseline; }
.fin input { width: 4.2em; font: inherit; font-size: 16px; border: 0; border-bottom: 2px solid var(--accent); background: var(--cle-bg); padding: 0 3px; border-radius: 4px 4px 0 0; color: var(--ink); }
.fin input.okc { border-color: var(--success); background: var(--success-bg); }
.fin input.koc { border-color: var(--danger); background: var(--danger-bg); }
.panneau { border: 2px solid var(--accent); border-radius: 14px; padding: 14px; background: var(--sheet); margin-top: 10px; }
.choix { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.choix button { min-height: 46px; min-width: 6rem; border: 1px solid var(--line-strong); background: var(--sheet); border-radius: 12px; padding: 8px 14px; cursor: pointer; font-size: 1.05rem; }
.choix button.bon { background: var(--success-bg); border-color: var(--success); color: var(--success-text); }
.choix button.mauvais { background: var(--danger-bg); border-color: var(--danger); color: var(--danger-text); }
input.champ { font: inherit; font-size: 16px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 12px; min-height: 46px; background: var(--sheet); color: var(--ink); }
.regle-pop { background: var(--paper); border-radius: 12px; padding: 12px 14px; margin-top: 10px; font-size: .95rem; }
.regle-pop h4 { margin: 0 0 4px; }
.regle-pop mark { background: var(--cle-bg); color: var(--accent-ink); font-weight: 700; padding: 0 2px; border-radius: 3px; }
.deux { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.cadre.tel .deux { grid-template-columns: 1fr; }
.liste-f { list-style: none; margin: 0; padding: 0; }
.liste-f li { border-bottom: 1px dashed var(--paper-3); padding: 8px 0; }
.points { display: flex; gap: 6px; justify-content: center; margin: 10px 0; }
.points i { width: 10px; height: 10px; border-radius: 50%; background: var(--paper-3); }
.points i.on { background: var(--accent); }
.points i.fait { background: var(--ink-3); }

/* ---------------- audio */
.lecteur { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rond { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--sheet); font-size: 1.4rem; cursor: pointer; }
.rond.sec { background: var(--paper-2); color: var(--ink); width: 50px; height: 50px; font-size: 1.1rem; }
.groupes { display: flex; gap: 3px; margin: 12px 0; }
.groupes i { flex: 1; height: 8px; border-radius: 99px; background: var(--paper-3); cursor: pointer; }
.groupes i.fait { background: var(--cle-line); }
.groupes i.on { background: var(--accent); }
.gros { font-size: 1.6rem; font-weight: 700; text-align: center; padding: 18px 10px; }
.cache { filter: blur(7px); user-select: none; }
textarea.copie { width: 100%; min-height: 9rem; font: inherit; font-size: 1.1rem; line-height: 2; border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 14px; background: repeating-linear-gradient(var(--sheet), var(--sheet) 2.15rem, var(--paper-2) 2.2rem); color: var(--ink); }
.etapes { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.etape { flex: 1 1 8rem; border-radius: 12px; padding: 8px 10px; background: var(--paper-2); font-size: .85rem; }
.etape.on { background: var(--accent); color: var(--sheet); }
.etape.fait { background: var(--cle-bg); color: var(--accent-ink); }
.etape b { display: block; font-size: 1rem; }
.chrono { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.tableau { background: var(--ink); color: var(--sheet); border-radius: 12px; padding: 10px 16px; font-size: 1rem; }

/* ---------------- relecture */
.mot.verbe { background: var(--cle-bg); outline: 2px solid var(--accent); }
.mot.sujet { background: var(--paper-2); outline: 2px dashed var(--accent); }
.passages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
.cadre.tel .passages { grid-template-columns: 1fr 1fr; }
.passage { border-radius: 12px; padding: 8px 10px; background: var(--paper-2); font-size: .82rem; cursor: pointer; border: 0; text-align: left; }
.passage b { display: block; font-size: .95rem; }
.passage.on { background: var(--accent); color: var(--sheet); }
.passage.fait { background: var(--cle-bg); color: var(--accent-ink); }
.check { list-style: none; padding: 0; margin: 0; }
.check li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--paper-3); }
.check li .c { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--accent); flex: none; display: grid; place-items: center; color: var(--sheet); font-weight: 700; }
.check li.fait .c { background: var(--accent); }
.envers { display: flex; flex-wrap: wrap; gap: 6px; font-size: 1.2rem; }
.envers span { background: var(--paper); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.envers span.on { outline: 2px solid var(--accent); background: var(--sheet); font-weight: 700; }

/* ---------------- résultat et suivi */
.note { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.note .n { font-size: 3.2rem; font-weight: 800; line-height: 1; }
.note .n small { font-size: 1.3rem; color: var(--ink-3); }
.barre { display: grid; grid-template-columns: 12rem 1fr 3rem; gap: 8px; align-items: center; margin: 6px 0; font-size: .9rem; }
.cadre.tel .barre { grid-template-columns: 7.5rem 1fr 2.6rem; font-size: .82rem; }
.barre .j { height: 10px; background: var(--paper-3); border-radius: 99px; overflow: hidden; }
.barre .j i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.barre .j i.bas { background: var(--danger); }
.barre .j i.haut { background: var(--success); }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.t td, table.t th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.grille { overflow-x: auto; }
.grille table { border-collapse: separate; border-spacing: 4px; }
.grille th { font-size: .75rem; color: var(--ink-2); font-weight: 600; text-align: left; vertical-align: bottom; }
.tuile { min-width: 3.1rem; height: 2.3rem; border-radius: 8px; font-size: .72rem; font-weight: 700; display: grid; place-items: center; cursor: pointer; border: 0; }
.tuile.m { background: var(--success-bg); color: var(--success-text); }
.tuile.f { background: var(--cle-bg); color: var(--accent-ink); outline: 2px solid var(--accent); }
.tuile.t { background: var(--danger-bg); color: var(--danger-text); }
.tuile.n { background: var(--paper-2); color: var(--ink-3); }
.tuile.v { background: var(--paper); color: var(--paper-3); border: 1px dashed var(--paper-3); }
.legende { display: flex; flex-wrap: wrap; gap: 10px; font-size: .8rem; margin-top: 6px; }
.legende span { display: inline-flex; gap: 5px; align-items: center; }
.legende i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
svg.courbe { width: 100%; height: 150px; }

/* ---------------- choix des notions */
.fam { border: 1px solid var(--line); border-radius: 12px; margin: 8px 0; background: var(--sheet); }
.fam-t { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
.fam-t b { flex: 1; }
.fam-c { padding: 0 12px 10px 42px; display: none; }
.fam.ouvert .fam-c { display: block; }
.cadre.tel .fam-c { padding-left: 14px; }
label.cb { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
label.cb input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); margin-top: 2px; }
.niv-pt { font-size: .7rem; border-radius: 5px; padding: 1px 6px; background: var(--paper-2); color: var(--ink-2); margin-left: 4px; white-space: nowrap; }
.cartes-niv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.cadre.tel .cartes-niv { grid-template-columns: 1fr; }

/* ---------------- fiche */
.fiche h3 { color: var(--accent-ink); margin: 18px 0 6px; }
.fiche .ex mark { background: var(--cle-bg); color: var(--accent-ink); font-weight: 700; padding: 0 2px; border-radius: 3px; }

/* ---------------- validation de la maquette */
.valid { max-width: 1280px; margin: 0 auto 60px; padding: 0 12px; }
.valid .carte { background: var(--sheet); }
.valid textarea { width: 100%; font: inherit; font-size: .9rem; border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px; min-height: 3rem; background: var(--sheet); color: var(--ink); }
.valid textarea.res { min-height: 12rem; font-size: .82rem; }
.cadre.reel { border: 0; border-radius: 0; max-width: none; min-height: 0; box-shadow: none; }
.scene.reel { padding: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<!-- ================= Barre de la maquette ================= -->
<div class="mq">
  <div class="mq-l" id="mq-ecrans"><b>Écran</b></div>
  <div class="mq-l" id="mq-options"><b>Option</b></div>
  <div class="mq-l"><b>Appareil</b>
    <button class="mq-p" data-app="ordi">Ordinateur</button><button class="mq-p" data-app="tel">Téléphone</button>
    <b style="margin-left:12px">Couleur « Français »</b>
    <button class="mq-p" data-teinte="a"><span class="pt" style="background:#0e7490"></span>Sarcelle</button>
    <button class="mq-p" data-teinte="b"><span class="pt" style="background:#9d2f72"></span>Prune</button>
    <button class="mq-p" data-teinte="c"><span class="pt" style="background:#8a6a00"></span>Ocre</button>
  </div>
  <div class="mq-desc" id="mq-desc"></div>
</div>

<div class="scene">
  <div class="cadre" id="cadre">
    <nav class="som" id="som"></nav>
    <div class="bandeau" id="bandeau"></div>
    <main class="corps"><div class="page" id="page"></div></main>
  </div>
</div>

<!-- ================= Validation de la maquette ================= -->
<div class="valid">
  <div class="carte">
    <span class="badge">Validation de la maquette</span>
    <p>Pour chaque écran, choisis une option dans la barre noire (elle est retenue) et laisse un commentaire si besoin. Choisis aussi la couleur. Puis télécharge ou copie le résumé.</p>
    <div id="comm-zone"></div>
    <p><b>Remarque générale</b></p>
    <textarea id="comm-gen" placeholder="Idées, oublis, ce qui ne va pas…"></textarea>
    <div class="rangee" style="margin-top:10px">
      <button class="btn" id="b-res">Mettre à jour le résumé</button>
      <button class="btn sec" id="b-cop">Copier</button>
      <button class="btn sec" id="b-tel">Télécharger (.txt)</button>
    </div>
    <textarea class="res" id="res" readonly aria-label="Résumé"></textarea>
  </div>
</div>

<script src="../orthographe/donnees/regles.js"></script>
<script>
/* =====================================================================
   Moteur de la maquette (espace de noms MQ, IIFE)
   - ECRANS : liste des écrans et de leurs options
   - DICTEE : texte d'exemple annoté (fautes injectées, règle, choix)
   - un rendu par écran ; état gardé dans localStorage['ortho-maquette']
   ===================================================================== */
(function () {
  'use strict';
  var D = window.ORTHO_DONNEES, R = {};
  D.regles.forEach(function (r) { R[r.id] = r; });

  /* ---------------------------------------------- écrans et options */
  var ECRANS = [
    { id: 'accueil', nom: 'Accueil', page: 'Accueil', opts: [
      ['A', 'Lignes dépliables', 'Accueil standard de la charte : une ligne par module, carte « Reprendre ».'],
      ['B', 'Séance du jour en tête', 'La séance proposée par le mode automatique en premier, les modules dessous.'] ] },
    { id: 'notions', nom: 'Choix des notions', page: 'Choisir mes notions', opts: [
      ['A', 'Par famille', 'Cases à cocher regroupées par famille de règles (une case par famille coche tout le groupe).'],
      ['B', 'Par niveau', 'Cases regroupées par niveau de priorité (Socle, Essentiel brevet…).'] ] },
    { id: 'corriger', nom: 'Dictée à corriger', page: 'Dictée à corriger', opts: [
      ['A', 'Texte entier', 'Tout le texte ; on touche un mot, la correction s’ouvre juste dessous.'],
      ['B', 'Phrase par phrase', 'Une phrase à la fois en grand, puis la suivante.'],
      ['C', 'Texte + liste des fautes', 'Le texte à gauche, la liste des corrections à droite (dessous sur téléphone).'] ] },
    { id: 'audio', nom: 'Dictée audio', page: 'Dictée audio', opts: [
      ['A', 'Lecteur à segments', 'Barre des groupes de mots, boutons lire / pause / répéter / précédent / suivant.'],

  /* =============================================== ÉCRAN : dictée à corriger */
  function etatF(t) { return C.etat[t.i] || (C.etat[t.i] = { trouve: C.reglage.rep === 'reperees', essais: 0, fini: false, juste: false }); }
  function classeMot(t) {

    if (C.reglage.corr === 'fin') return;

        var d = el('div'); d.style.cssText = 'padding:8px 0;border-bottom:1px dashed var(--paper-3)';
        d.innerHTML = '<span class="faux" style="color:var(--danger-text);text-decoration:line-through">' + x[0] + '</span> → <b style="color:var(--success-text)">' + x[1] + '</b> <span class="petit">· ' + esc(R[x[2]].titre) + '</span> ';
        var b = el('button', 'btn sec pt', '📖 Règle'); var z = el('div');
        b.addEventListener('click', function () { z.innerHTML = ''; if (!b.dataset.o) { z.appendChild(blocRegle(x[2])); b.dataset.o = 1; } else delete b.dataset.o; });
        d.appendChild(b); d.appendChild(z); c3.appendChild(d);
      });
      c3.appendChild(el('div', 'cle', '<b>À travailler :</b> l’accord du verbe avec un sujet pluriel (SV2) et le sujet « qui » (SV3). Le mode automatique te les proposera.'));
      P.appendChild(c3);
    } else {
      var c4 = el('div', 'carte'), t = '<table class="t"><tr><th>Tu as écrit</th><th>Attendu</th><th>Règle</th><th>Points</th></tr>';
      RES.forEach(function (x) { t += '<tr><td>' + x[0] + '</td><td><b>' + x[1] + '</b></td><td>' + x[2] + ' · ' + esc(R[x[2]].titre) + '</td><td>−' + String(x[3]).replace('.', ',') + '</td></tr>'; });
      c4.innerHTML = '<div style="overflow-x:auto">' + t + '</table></div>'; P.appendChild(c4);
    }
    var r = el('div', 'rangee'); var a = el('button', 'btn', 'Retravailler ces règles →'); a.addEventListener('click', function () { aller('corriger'); });
    r.appendChild(a); r.appendChild(el('button', 'btn sec', 'Imprimer le bilan')); P.appendChild(r);
  }

  /* =============================================== ÉCRAN : suivi */
  // données fictives de maîtrise : m maîtrisé, f fragile, t à travailler, n pas encore vu
  var MAI = { GN1: 'm', GN2: 'm', SV1: 'm', SV2: 'f', EE1: 't', EE2: 'f', CJ1: 'm', CJ2: 'm', HO1: 'm', HO2: 'f', HO3: 'm', HO4: 'm', HO5: 'm', LX1: 'f', GN3: 'm', GN4: 'f', SV3: 't', HO6: 'f', HO7: 't', PP1: 'f', LX4: 'm' };
  function statut(r) { if (MAI[r.id]) return MAI[r.id]; var ok = r.prerequis.every(function (p) { return MAI[p] === 'm'; }); return ok ? 'n' : 'v'; }
  function priorites() {
    return D.regles.filter(function (r) { var s = statut(r); return (s === 't' || s === 'f') && r.prerequis.every(function (p) { return statut(R[p]) === 'm'; }); })
      .sort(function (a, b) { return (a.niveau - b.niveau) || ((statut(a) === 't' ? 0 : 1) - (statut(b) === 't' ? 0 : 1)) || (b.brevet - a.brevet); }).slice(0, 3);
  }
  function ecranSuivi(P) {
    P.appendChild(entete('Mon entraînement', 'Mon suivi', 'Calculé sur tes <b>14 dernières séances</b> (312 occasions de faute). Les règles se débloquent quand leurs prérequis sont maîtrisés.'));
    var pr = el('div', 'carte seance'); pr.appendChild(el('h3', '', 'À travailler en priorité'));
    priorites().forEach(function (r, k) { pr.appendChild(el('div', '', '<b>' + (k + 1) + '. ' + esc(r.titre) + '</b> <span class="petit">· niveau ' + r.niveau + ' · ' + r.brevet + ' pièges au brevet</span>')); });
    var b = el('button', 'btn acc', 'Lancer une séance sur ces règles →'); b.style.marginTop = '10px'; b.addEventListener('click', function () { aller('corriger'); }); pr.appendChild(b);
    P.appendChild(pr);
    if (opt('suivi') === 'A') {
      var c = el('div', 'carte'); c.appendChild(el('h3', '', 'Carte des compétences'));
      var g = el('div', 'grille'), t = el('table'), h = el('tr'); h.appendChild(el('th', '', ''));
      D.familles.forEach(function (f) { h.appendChild(el('th', '', esc(f.nom.replace('Accord du verbe avec son sujet', 'Sujet-verbe').replace('Accords dans le groupe nominal', 'Groupe nominal').replace('Terminaisons en [é] et participes en -i / -u', '-é, -er, -i, -u').replace('Accord du participe passé', 'Participe passé').replace('Homophones grammaticaux', 'Homophones').replace('Orthographe d’usage', 'Usage')))); });
      t.appendChild(h);
      var info = el('div', 'neutre', 'Touche une tuile pour voir la règle et ta réussite.');
      D.niveaux.forEach(function (n) {
        var tr = el('tr'); tr.appendChild(el('th', '', 'Niv. ' + n.n));
        D.familles.forEach(function (f) {
          var td = el('td'), w = el('div'); w.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px';
          D.regles.filter(function (r) { return r.famille === f.id && r.niveau === n.n; }).forEach(function (r) {
            var s = statut(r), x = el('button', 'tuile ' + s, r.id);
            x.addEventListener('click', function () { info.innerHTML = '<b>' + r.id + ' · ' + esc(r.titre) + '</b><br>' + ({ m: 'Maîtrisée : 92 % de réussite.', f: 'Fragile : 68 % de réussite.', t: 'À travailler : 41 % de réussite.', n: 'Pas encore travaillée : prérequis acquis.', v: 'Pas encore : maîtrise d’abord ' + r.prerequis.join(', ') + '.' })[s]; });
            w.appendChild(x);
          });
          td.appendChild(w); tr.appendChild(td);
        });
        t.appendChild(tr);
      });
      g.appendChild(t); c.appendChild(g);
      c.appendChild(el('div', 'legende', '<span><i style="background:var(--success-bg)"></i>Maîtrisée</span><span><i style="background:var(--cle-bg);outline:2px solid var(--accent)"></i>Fragile</span><span><i style="background:var(--danger-bg)"></i>À travailler</span><span><i style="background:var(--paper-2)"></i>Pas encore vue</span><span><i style="border:1px dashed var(--paper-3)"></i>Prérequis à acquérir</span>'));
      c.appendChild(info); P.appendChild(c);
    } else {
      var c2 = el('div', 'carte'); c2.appendChild(el('h3', '', 'Réussite par famille'));
      [['Groupe nominal', 88, 'haut'], ['Sujet-verbe', 61, ''], ['-é, -er, -i, -u', 47, 'bas'], ['Conjugaison', 82, 'haut'], ['Participe passé', 58, ''], ['Homophones', 72, ''], ['Usage', 79, '']].forEach(function (x) {
        c2.appendChild(el('div', 'barre', '<span>' + x[0] + '</span><span class="j"><i class="' + x[2] + '" style="width:' + x[1] + '%"></i></span><b>' + x[1] + ' %</b>'));
      });
      P.appendChild(c2);
      var c3 = el('div', 'carte'); c3.appendChild(el('h3', '', 'Mes notes (dictées brevet)'));
      var notes = [8, 9.5, 9, 11, 10.5, 12, 13, 12.5, 14, 13], w = 600, hh = 150, pts = notes.map(function (v, i) { return (20 + i * (w - 40) / (notes.length - 1)) + ',' + (hh - 15 - v / 20 * (hh - 30)); }).join(' ');
      c3.innerHTML += '<svg class="courbe" viewBox="0 0 ' + w + ' ' + hh + '" preserveAspectRatio="none" role="img" aria-label="Évolution des notes de 8 à 13 sur 20"><line x1="20" x2="580" y1="' + (hh - 15 - 10 / 20 * (hh - 30)) + '" y2="' + (hh - 15 - 10 / 20 * (hh - 30)) + '" stroke-dasharray="4 4" style="stroke:var(--paper-3)"/><polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="3" style="color:var(--accent)"/></svg><p class="petit">De 8/20 à 13/20 en 10 dictées · pointillés : 10/20</p>';
      P.appendChild(c3);
    }
  }

  /* =============================================== ÉCRAN : fiche */
  function ecranFiche(P) {
    P.appendChild(entete('Fiche récapitulative', 'Les homophones grammaticaux', 'Mots qui se prononcent pareil mais n’ont pas la même nature. <b>Un test de remplacement</b> par mot.'));
    var c = el('div', 'carte fiche');
    D.regles.filter(function (r) { return r.famille === 'HO' && r.niveau <= 2; }).forEach(function (r) {
      c.appendChild(el('h3', '', esc(r.titre)));
      c.appendChild(el('p', '', esc(r.regle)));
      c.appendChild(el('div', 'cle', '<b>Test :</b> ' + esc(r.astuce)));
      c.appendChild(el('p', 'ex', r.exemples.map(marque).join(' · ')));
    });
    c.appendChild(el('p', 'petit', '… règles de niveau 3 et 4 de la famille à la suite.'));
    P.appendChild(c);
  }

  /* =============================================== rendu général */
  var RENDUS = { accueil: ecranAccueil, notions: ecranNotions, corriger: ecranCorriger, audio: ecranAudio, brevet: ecranBrevet, relecture: ecranRelecture, resultat: ecranResultat, suivi: ecranSuivi, fiche: ecranFiche };
  function rendre() {
    var y = window.scrollY;
    rendreBarre(); rendreNav();
    var P = document.getElementById('page'); P.innerHTML = '';
    RENDUS[E.ecran](P);
    window.scrollTo(0, y);
    rendreComm();
  }

  /* =============================================== validation de la maquette */
  function rendreComm() {
    var z = document.getElementById('comm-zone');
    if (z.dataset.fait) return; z.dataset.fait = 1;
    ECRANS.forEach(function (ec) {
      var l = el('label', '', '<b>' + esc(ec.nom) + '</b>'); l.style.display = 'block'; l.style.marginTop = '8px';
      var t = el('textarea'); t.value = E.comm[ec.id] || ''; t.placeholder = 'Commentaire sur l’écran « ' + ec.nom + ' »';
      t.addEventListener('input', function () { E.comm[ec.id] = t.value; garder(); });
      l.appendChild(t); z.appendChild(l);
    });
    var g = document.getElementById('comm-gen'); g.value = E.gen || ''; g.addEventListener('input', function () { E.gen = g.value; garder(); });
  }
  function resume() {
    var L = ['MAQUETTE — Orthographe 3e (' + new Date().toLocaleDateString('fr-FR') + ')', ''];
    L.push('Couleur « Français » : ' + { a: 'Sarcelle', b: 'Prune', c: 'Ocre' }[E.teinte], '');
    ECRANS.forEach(function (ec) {
      var o = ec.opts.filter(function (x) { return x[0] === opt(ec.id); })[0];
      L.push('• ' + ec.nom + ' : option ' + o[0] + ' (' + o[1] + ')' + (E.comm[ec.id] ? '\n    Commentaire : ' + E.comm[ec.id] : ''));
    });
    L.push('', 'Remarque générale : ' + (E.gen || '(aucune)'));
    return L.join('\n');
  }
  document.getElementById('b-res').addEventListener('click', function () { document.getElementById('res').value = resume(); });
  document.getElementById('b-cop').addEventListener('click', function () { var t = document.getElementById('res'); t.value = resume(); t.select(); try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); } this.textContent = 'Copié ✓'; });
  document.getElementById('b-tel').addEventListener('click', function () {
    var txt = resume(); document.getElementById('res').value = txt;
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' })); a.download = 'maquette-orthographe.txt'; document.body.appendChild(a); a.click(); a.remove();
  });

  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = function () {};
  window.addEventListener('resize', function () { rendreBarre(); });
  window.MQ = { aller: aller };
  rendre();
})();
</script>
