@media (max-width: 640px) {

  function filtrer() {
    racine.querySelectorAll('[data-fe]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.fe === E.filtreEtat)));
    racine.querySelectorAll('[data-ft]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ft === E.filtreTheme)));
    let visibles = 0;
    APPS.forEach(a => {
      const d = dec(a.id);
      const okEtat = E.filtreEtat === 'tout' || (E.filtreEtat === 'voir' ? d === '' : d === E.filtreEtat);
      const okTheme = E.filtreTheme === 'tout' || a.theme === E.filtreTheme;
      const c = racine.querySelector(`.lp-carte[data-app="${a.id}"]`);
      c.hidden = !(okEtat && okTheme);
      if (!c.hidden) visibles++;
    });
    racine.querySelectorAll('[data-section]').forEach(s => { s.hidden = !s.querySelector('.lp-carte:not([hidden])'); });
    racine.querySelector('[data-z="aucune"]').hidden = visibles > 0;
  }

  function toutReplier() {
    const tout = APPS.every(a => E.pliees[a.id]);
    APPS.forEach(a => { E.pliees[a.id] = !tout; });
    if (!tout) E.modOuverts = {};          // replier aussi les modules
    garder();
    APPS.forEach(a => majCarte(a.id));
    bilan();
  }

  /* ---------- Ajouts et remarques générales ---------- */
  function rendreAjouts(focusDernier) {
    const z = racine.querySelector('[data-z="ajouts"]');
    z.innerHTML = E.ajouts.map((t, i) => `<div class="lp-ajout">
      <textarea class="lp-zone" data-ajout="${i}" aria-label="Application à ajouter ${i + 1}" placeholder="Application à ajouter"></textarea>
      <button type="button" class="btn-small" data-retirer="${i}" aria-label="Retirer la zone ${i + 1}">Retirer</button></div>`).join('');
    z.querySelectorAll('[data-ajout]').forEach(t => { t.value = E.ajouts[Number(t.dataset.ajout)] || ''; });
    if (focusDernier) { const l = z.querySelectorAll('[data-ajout]'); l[l.length - 1].focus(); }
  }

  /* ---------- Texte des retours ---------- */
  function texteRetours() {
    const L = [`Retours liste 2nde — version ${VERSION} (${APPS.length} applications)`];
    const nonTraitees = [];
    APPS.forEach(a => {
      const d = dec(a.id), titre = `${a.id} ${brut(a.nom)}`;
      if (d === 'sup') { L.push(`${titre} : SUPPRIMÉE`); return; }
      const details = [];
      a.modules.forEach((m, i) => {
        const k = idMod(a, i), rq = ligne(E.remMod[k]);
        if (E.garder[k] === false) details.push(`  ${k} retiré${rq ? ' — remarque : ' + rq : ''}`);
        else if (rq) details.push(`  ${k} : ${rq}`);
      });
      a.questions.forEach((q, i) => {
        const k = idQ(a, i), c = E.rep[k], lib = ligne(E.libre[k]), parts = [];
        if (typeof c === 'number' && q.choix[c] != null) parts.push(brut(q.choix[c]));
        if (lib) parts.push(lib);
        if (parts.length) details.push(`  Question ${i + 1} (${q.cle}) : ${parts.join(' ; ')}`);
      });
      if (d === 'ok') L.push(`${titre} : VALIDÉE`);
      else if (d === 'mod') L.push(`${titre} : MODIFIÉE — remarque : ${ligne(E.notes[a.id]) || '(à préciser)'}`);
      else if (details.length) L.push(`${titre} : SANS DÉCISION`);
      else { nonTraitees.push(a.id); return; }
      L.push(...details);
    });
    if (nonTraitees.length) L.push(`Non traitées : ${nonTraitees.join(', ')}`);
    const ajouts = E.ajouts.map(ligne).filter(Boolean);
    if (ajouts.length === 1) L.push(`Ajouts : ${ajouts[0]}`);
    else if (ajouts.length) L.push('Ajouts :', ...ajouts.map(t => '  - ' + t));
    const rem = ligne(E.remarques);
    if (rem) L.push(`Remarques générales : ${rem}`);
    return L.map(typo).join('\n');
  }

  // copie : presse-papiers, sinon execCommand, sinon texte sélectionné à copier à la main
  function copier() {
    const txt = texteRetours();
    const sortie = racine.querySelector('[data-z="sortie"]'), zt = sortie.querySelector('textarea'), msg = racine.querySelector('[data-z="copie"]');
    zt.value = txt;
    sortie.hidden = false;
    const reussi = () => { msg.classList.remove('refus'); msg.textContent = typo('✓ Copié : colle-le dans la conversation.'); };
    const parExec = () => {
      let ok = false;
      try { zt.focus(); zt.select(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) reussi();
      else { msg.classList.add('refus'); msg.textContent = typo('La copie automatique a été refusée : le texte est sélectionné, copie-le (Ctrl+C ou appui long).'); zt.focus(); zt.select(); }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(reussi, parExec);
      else parExec();
    } catch (e) { parExec(); }
    sortie.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- Événements (délégués) ---------- */
  racine.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || !racine.contains(b)) return;
    if (b.dataset.dec) {
      const id = b.dataset.app, k = b.dataset.dec;
      if (dec(id) === k) delete E.dec[id]; else E.dec[id] = k;
      garder(); majCarte(id); bilan(); filtrer();
      if (E.dec[id] === 'mod') { const t = racine.querySelector(`[data-note="${id}"]`); if (t) t.focus(); }
    } else if (b.dataset.plier) {
      E.pliees[b.dataset.plier] = !E.pliees[b.dataset.plier];
      garder(); majCarte(b.dataset.plier); bilan();
    } else if (b.dataset.ouvrir) {
      const k = b.dataset.ouvrir;
      E.modOuverts[k] = !E.modOuverts[k];
      garder(); majCarte(k.split('-')[0]);
    } else if (b.dataset.q) {
      const k = b.dataset.q, c = Number(b.dataset.c);
      if (E.rep[k] === c) delete E.rep[k]; else E.rep[k] = c;
      garder(); majCarte(k.split('-')[0]);
    } else if (b.dataset.fe) {
      E.filtreEtat = b.dataset.fe; garder(); filtrer();
    } else if (b.dataset.ft) {
      E.filtreTheme = b.dataset.ft; garder(); filtrer();
    } else if (b.dataset.retirer) {
      E.ajouts.splice(Number(b.dataset.retirer), 1);
      if (!E.ajouts.length) E.ajouts = [''];
      garder(); rendreAjouts(false);
    } else if (b.dataset.a === 'ajout') {
      E.ajouts.push(''); garder(); rendreAjouts(true);
    } else if (b.dataset.a === 'replier') {
      toutReplier();
    } else if (b.dataset.a === 'copier') {
      copier();
    } else if (b.dataset.a === 'effacer') {
      racine.querySelector('[data-z="confirm"]').hidden = false;
      racine.querySelector('[data-a="effacer-non"]').focus();
    } else if (b.dataset.a === 'effacer-non') {
      racine.querySelector('[data-z="confirm"]').hidden = true;
    } else if (b.dataset.a === 'effacer-oui') {
      E = vierge();
      try { localStorage.removeItem(CLE); } catch (err) { /* stockage indisponible */ }
      tout();
      window.scrollTo(0, 0);
    }
  });

  racine.addEventListener('input', e => {
    const t = e.target, ds = t.dataset;
    if (ds.note) E.notes[ds.note] = t.value;
    else if (ds.remmod) E.remMod[ds.remmod] = t.value;
    else if (ds.libre) E.libre[ds.libre] = t.value;
    else if (ds.ajout !== undefined) E.ajouts[Number(ds.ajout)] = t.value;
    else if (t.hasAttribute('data-rem')) E.remarques = t.value;
    else return;
    garder();
  });

  racine.addEventListener('change', e => {
    const t = e.target;
    if (!t.dataset.garder) return;
    const k = t.dataset.garder;
    if (t.checked) delete E.garder[k]; else E.garder[k] = false;
    garder(); majCarte(k.split('-')[0]);
  });

  // (re)construit toute la page à partir de l'état E
  function tout() {
    squelette();
    rendreListe();
    rendreAjouts(false);
    racine.querySelector('[data-rem]').value = E.remarques || '';
    bilan();
    filtrer();
  }
  tout();

  // accès pour les vérifications automatiques
  window.LISTE = { texte: texteRetours, cle: CLE };
})();
</script>
