/* ============================================================
   Outil « Schéma d'une pile » : moteur partagé pile/pile.js (le même que

   erreur, 0 point si la réponse est affichée ; note sur 20 gardée (SOM).
   ============================================================ */

  entete: { badge: 'MODULE 1 · ENTRAÎNEMENT', titre: 'Schéma d\'une pile' },
  fin: note => SOM.marquer({ note }),                     // meilleure note sur 20 (sommaire, accueil)

});
