<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 4 : utilisation, chute — Chapitre 7 : Théorème de l'énergie cinétique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="ec.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/dragdrop.js"></script>
<script src="../../assets/sommaire.js"></script>
<script src="ec.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 4 · COURS 2 / 6</span>
    <h2 class="er-titre">Utilisation : chute</h2>
    <p class="er-contexte">On applique le théorème avec la même <b>méthode</b> à chaque fois, en commençant par un <b>schéma</b>. Premier cas : un objet lâché qui <b>tombe</b>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 2 du module 4 : méthode avec schéma (outil schéma :
   données placées par glisser-déposer EC.partieDonnees, angle de chaque
   force EC.partieAngles, théorème EC.partieEquation), exemple 1 du cours
   (pomme lâchée), puis « À toi » à valeurs changées.
   Valeurs (vérifiées par un script) : ex. 1 v_B = √200 ≈ 14,1 m/s ;
   « À toi » : bille de 1,8 m → v_B = 6,0 m/s.
   ============================================================ */
const { exemple } = COURS;
const { proche, fr, rac, W, schemaMvt, partieDonnees, partieAngles, partieEquation, versCours } = EC;
const calc = h => `<p class="crs-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const EC_ = 'E<sub>c</sub>', vA = 'v<sub>A</sub>', vB = 'v<sub>B</sub>';
const v2 = x => `${x}<sup>2</sup>`;
const G = 'm·s<sup>−2</sup>';

/* ---------- 1. La méthode, exemple 1 : pomme lâchée ---------- */
const METHODE = `<div class="cle"><p><b class="cle-titre">Méthode</b> (dans toutes les corrections) :</p>
  <ol class="er-liste"><li>un <b>schéma</b> avec A, B, le déplacement, chaque force et son angle α avec le déplacement, et les données (${vA}, ${vB}, h ou AB, m) ;</li>
    <li>écrire le <b>théorème</b> ;</li><li>remplacer chaque <b>travail</b> : une force ⊥ au déplacement donne 0 ; à 180°, cos α = −1 ;</li>
    <li>l'<b>application numérique</b> ;</li><li><b>isoler</b> l'inconnue.</li></ol></div>`;
const CHUTE = { sens: 'bas', objet: 'pomme', forces: ['P'], d: 'h' };
function etape1(c_) {
  const carte = c_.carte('1. La méthode : une chute (exemple 1)');
  c_.ajouter(carte, `<div class="cours-bloc">${METHODE}</div>
    ${exemple(`<p>On lâche une pomme de masse m = 100 g d'une hauteur de 10 m. Quelle est sa vitesse en arrivant au sol ? (g = 10 ${G} ; on néglige l'air)</p>
      ${schemaMvt(Object.assign({ angles: true }, CHUTE), { m: '100 g = 0,100 kg', vA: '0 (lâchée)', vB: '?', d: '10 m' })}
      <p>D'après le théorème de l'énergie cinétique :</p>
      ${calc(`ΔE<sub>c</sub> = ${W('P')}`)}
      ${calc(`½ m ${v2(vB)} − ½ m ${v2(vA)} = m g h`)}
      ${calc(`0,5 × 0,100 × ${v2(vB)} − 0,5 × 0,100 × 0<sup>2</sup> = 0,100 × 10 × 10`)}
      ${calc(`0,05 ${v2(vB)} = 10 &nbsp; donc &nbsp; ${v2(vB)} = ${fr('10', '0,05')} = 200 &nbsp; et &nbsp; ${vB} = ${rac('200')} ≈ ${c('14,1 m/s')}`)}
      <p><b>OU</b>, en littéral : ½ m ${v2(vB)} = m g h donne ${v2(vB)} = 2 g h, soit ${vB} = ${rac('2 g h')} = ${rac('2 × 10 × 10')} = ${rac('200')}. La masse se simplifie.</p>`, 'Exemple 1 (traité)')}`);
  // « À toi » : une bille tombe de 1,8 m
  const o1 = CHUTE;
  c_.aToi(carte, [{ titre: 'Une bille qui tombe', enonce: `<p>Une bille de <b>50 g</b> est lâchée sans vitesse d'une hauteur de <b>1,8 m</b>. On cherche sa vitesse en arrivant au sol (g = 10 ${G}, air négligé).</p>`,
    parties: [
      versCours(partieDonnees(o1, { m: '50 g', vA: '0 m/s', vB: '?', d: '1,8 m' })),
      versCours(partieAngles(o1)),
      partieEquation(o1, { solution: `<p>Le poids est la seule force qui travaille : ½ m ${v2(vB)} − ½ m ${v2(vA)} = m g h.</p>` }),
      { type: 'nombre', q: `Isole ${vB} (avec ${vA} = 0) et calcule-la.`, label: `${vB} =`, valeur: 6, unite: 'm/s', signe: false,
        diag: v => (proche(v, 36) ? 'Tu as trouvé v² : prends la <b>racine carrée</b>.' : proche(v, Math.sqrt(18)) ? `${v2(vB)} = 2 g h : n'oublie pas le 2.` : `${vB} = ${rac('2 g h')}.`),
        solution: calc(`½ m ${v2(vB)} = m g h donc ${v2(vB)} = 2 g h = 2 × 10 × 1,8 = 36 et ${vB} = ${rac('36')} = ${c('6,0 m/s')}`) },
    ] }]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p><b>Méthode</b> : schéma (A, B, forces et angles, données) ; théorème ; chaque travail (⊥ → 0, 180° → cos = −1) ; application numérique ; isoler l'inconnue.</p></div>
    <div class="cle"><p>Chute de h : ${W('P')} = m g h et ${vB} = √(2 g h) si ${vA} = 0. La masse se simplifie.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_4c_cours.html">Utilisation : lancé vers le haut →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_4.html#chute">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, aRetenir]);
EC.menu('module_4b_cours');
</script>
</body>
</html>
