<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 4 : théorème de l'énergie cinétique, énoncé et chute — Chapitre 7 : Théorème de l'énergie cinétique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="ec.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/dragdrop.js"></script>
<script src="../../assets/sommaire.js"></script>
<script src="ec.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 4 · COURS · PARTIE A</span>
    <h2 class="er-titre">Théorème de l'énergie cinétique : énoncé et chute</h2>
    <p class="er-contexte">La variation de l'énergie cinétique d'un solide entre A et B est égale à la <b>somme des travaux</b> des forces qui s'exercent sur lui : ΔE<sub>c</sub> = Σ W. On l'applique toujours avec la même <b>méthode</b>, en commençant par un <b>schéma</b>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Énoncé du théorème, usage, méthode avec schéma (outil schéma :
   données placées par glisser-déposer EC.partieDonnees, angle de
   chaque force EC.partieAngles, théorème EC.partieEquation), exemples
   1 (pomme lâchée) et 2 (pomme lancée vers le haut) du cours, puis
   « À toi » à valeurs changées.
   Valeurs (vérifiées par un script) : ex. 1 v_B = √200 ≈ 14,1 m/s ;
   ex. 2 h = 5 m ; « À toi » : bille de 1,8 m → v_B = 6,0 m/s ;
   balle lancée à 8,0 m/s → h = 3,2 m.
   ============================================================ */
const { exemple } = COURS;
const { o, fmt, proche, fr, rac, nomV, W, schemaMvt, partieDonnees, partieAngles, partieEquation, versCours } = EC;
const calc = h => `<p class="crs-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const EC_ = 'E<sub>c</sub>', vA = 'v<sub>A</sub>', vB = 'v<sub>B</sub>';
const G = 'm·s<sup>−2</sup>';
const v2 = x => `${x}<sup>2</sup>`;

/* ---------- 1. Le théorème ---------- */
function etape1(c_) {
  const carte = c_.carte('1. Le théorème de l\'énergie cinétique');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Théorème.</b> Pour un solide qui se déplace d'un point A à un point B, soumis aux forces ${nomV('F')}<sub>1</sub>, ${nomV('F')}<sub>2</sub>… :</p>
        <p class="crs-formule">ΔE<sub>c</sub> = ${EC_}(B) − ${EC_}(A) = W<sub>AB</sub>(${nomV('F')}<sub>1</sub>) + W<sub>AB</sub>(${nomV('F')}<sub>2</sub>) + …</p>
        <p class="crs-formule">½ m ${v2(vB)} − ½ m ${v2(vA)} = W<sub>AB</sub>(${nomV('F')}<sub>1</sub>) + W<sub>AB</sub>(${nomV('F')}<sub>2</sub>) + …</p></div>
      <p>L'énergie cinétique est liée à la <b>vitesse</b> ; le travail est lié aux <b>forces</b> et au <b>déplacement</b>. Donc :</p>
      <ul class="er-liste"><li>si on connaît les travaux, on calcule ΔE<sub>c</sub>, donc la variation de vitesse ;</li>
        <li>si on connaît la vitesse au départ et à l'arrivée, on calcule le travail, donc une <b>force</b> ou une <b>distance</b>.</li></ul>
    </div>
    ${exemple(`<p>Un chariot a une énergie cinétique de 40 J en A. Entre A et B, une force motrice fournit 60 J et les frottements retirent 20 J.</p>
      ${calc(`${EC_}(B) − ${EC_}(A) = 60 + (−20) = 40 J donc ${EC_}(B) = 40 + 40 = ${c('80 J')}`)}<p>Le chariot a accéléré : la somme des travaux est positive.</p>`)}`);
  c_.aToi(carte, [
    { titre: 'Une luge', enonce: `<p>Une luge a une énergie cinétique de 50 J en A. Entre A et B, une seule force travaille : les frottements, W = −30 J.</p>`,
      parties: [{ type: 'nombre', q: `Que vaut ${EC_}(B) ?`, label: `${EC_}(B) =`, valeur: 20, unite: 'J', signe: false,
        diag: v => (proche(v, 80) ? 'Le travail est <b>négatif</b> : il retire de l\'énergie. 50 + (−30).' : `${EC_}(B) = ${EC_}(A) + Σ W.`), solution: calc(`${EC_}(B) = 50 + (−30) = ${c('20 J')}`) }] },
    { titre: 'Accélère ou ralentit ?', enonce: '<p>Entre A et B, la somme des travaux des forces qui s\'exercent sur un vélo est négative.</p>',
      parties: [{ type: 'choix', q: 'Entre A et B, le vélo :', melanger: false, options: [o('r', 'ralentit'), o('a', 'accélère'), o('c', 'garde la même vitesse')], bonne: 'r',
        indices: { a: 'Σ W &lt; 0 donc ΔE<sub>c</sub> &lt; 0 : l\'énergie cinétique diminue.', c: 'ΔE<sub>c</sub> = Σ W n\'est pas nul.' }, solution: '<p>ΔE<sub>c</sub> = Σ W &lt; 0 : l\'énergie cinétique, donc la vitesse, diminue.</p>' }] },
  ]);
  return carte;
}

/* ---------- 2. La méthode, exemple 1 : pomme lâchée ---------- */
const METHODE = `<div class="cle"><p><b class="cle-titre">Méthode</b> (dans toutes les corrections) :</p>
  <ol class="er-liste"><li>un <b>schéma</b> avec A, B, le déplacement, chaque force et son angle α avec le déplacement, et les données (${vA}, ${vB}, h ou AB, m) ;</li>
    <li>écrire le <b>théorème</b> ;</li><li>remplacer chaque <b>travail</b> : une force ⊥ au déplacement donne 0 ; à 180°, cos α = −1 ;</li>
    <li>l'<b>application numérique</b> ;</li><li><b>isoler</b> l'inconnue.</li></ol></div>`;
const CHUTE = { sens: 'bas', objet: 'pomme', forces: ['P'], d: 'h' };
function etape2(c_) {
  const carte = c_.carte('2. La méthode : une chute (exemple 1)');
  c_.ajouter(carte, `<div class="cours-bloc">${METHODE}</div>
    ${exemple(`<p>On lâche une pomme de masse m = 100 g d'une hauteur de 10 m. Quelle est sa vitesse en arrivant au sol ? (g = 10 ${G} ; on néglige l'air)</p>
      ${schemaMvt(Object.assign({ angles: true }, CHUTE), { m: '100 g = 0,100 kg', vA: '0 (lâchée)', vB: '?', d: '10 m' })}
      <p>D'après le théorème de l'énergie cinétique :</p>
      ${calc(`ΔE<sub>c</sub> = ${W('P')}`)}
      ${calc(`½ m ${v2(vB)} − ½ m ${v2(vA)} = m g h`)}
      ${calc(`0,5 × 0,100 × ${v2(vB)} − 0,5 × 0,100 × 0<sup>2</sup> = 0,100 × 10 × 10`)}
      ${calc(`0,05 ${v2(vB)} = 10 &nbsp; donc &nbsp; ${v2(vB)} = ${fr('10', '0,05')} = 200 &nbsp; et &nbsp; ${vB} = ${rac('200')} ≈ ${c('14,1 m/s')}`)}
      <p><b>OU</b>, en littéral : ½ m ${v2(vB)} = m g h donne ${v2(vB)} = 2 g h, soit ${vB} = ${rac('2 g h')} = ${rac('2 × 10 × 10')} = ${rac('200')}. La masse se simplifie.</p>`, 'Exemple 1 (traité)')}`);
  // « À toi » : une bille tombe de 1,8 m
  const o1 = CHUTE;
  c_.aToi(carte, [{ titre: 'Une bille qui tombe', enonce: `<p>Une bille de <b>50 g</b> est lâchée sans vitesse d'une hauteur de <b>1,8 m</b>. On cherche sa vitesse en arrivant au sol (g = 10 ${G}, air négligé).</p>`,
    parties: [
      versCours(partieDonnees(o1, { m: '50 g', vA: '0 m/s', vB: '?', d: '1,8 m' })),
      versCours(partieAngles(o1)),
      partieEquation(o1, { solution: `<p>Le poids est la seule force qui travaille : ½ m ${v2(vB)} − ½ m ${v2(vA)} = m g h.</p>` }),
      { type: 'nombre', q: `Isole ${vB} (avec ${vA} = 0) et calcule-la.`, label: `${vB} =`, valeur: 6, unite: 'm/s', signe: false,
        diag: v => (proche(v, 36) ? 'Tu as trouvé v² : prends la <b>racine carrée</b>.' : proche(v, Math.sqrt(18)) ? `${v2(vB)} = 2 g h : n'oublie pas le 2.` : `${vB} = ${rac('2 g h')}.`),
        solution: calc(`½ m ${v2(vB)} = m g h donc ${v2(vB)} = 2 g h = 2 × 10 × 1,8 = 36 et ${vB} = ${rac('36')} = ${c('6,0 m/s')}`) },
    ] }]);
  return carte;
}

/* ---------- 3. Exemple 2 : la hauteur atteinte ---------- */
const LANCER = { sens: 'haut', objet: 'pomme', forces: ['P'], d: 'h' };
function etape3(c_) {
  const carte = c_.carte('3. Lancé vers le haut : la hauteur atteinte (exemple 2)');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="crs-attention"><p><b class="cle-titre">Important, à savoir.</b> Au <b>sommet</b> de sa trajectoire, un objet lancé vers le haut s'arrête un instant : <b>${vB} = 0</b>.</p></div>
      <p>À la montée, le poids est opposé au déplacement : ${W('P')} = −m g h.</p>
    </div>
    ${exemple(`<p>On lance une pomme de masse m = 100 g vers le haut, avec une vitesse ${vA} = 10 m/s. À quelle hauteur va-t-elle monter ? (g = 10 ${G})</p>
      ${schemaMvt(Object.assign({ angles: true }, LANCER), { m: '100 g', vA: '10 m/s', vB: '0 (sommet)', d: '?' })}
      ${calc(`${EC_}(B) − ${EC_}(A) = ${W('P')}`)}
      ${calc(`½ m ${v2(vB)} − ½ m ${v2(vA)} = −m g h`)}
      ${calc(`½ × 100 × 10<sup>−3</sup> × 0 − ½ × 100 × 10<sup>−3</sup> × 10<sup>2</sup> = −100 × 10<sup>−3</sup> × 10 × h`)}
      ${calc(`−5 = −1 × h &nbsp; donc &nbsp; ${c('h = 5 m')}`)}`, 'Exemple 2 (traité)')}`);
  c_.aToi(carte, [{ titre: 'Une balle lancée vers le haut', enonce: `<p>On lance verticalement vers le haut une balle de <b>200 g</b>, avec une vitesse de <b>8,0 m/s</b>. On cherche la hauteur atteinte (g = 10 ${G}, air négligé).</p>`,
    parties: [
      versCours(partieDonnees(LANCER, { m: '200 g', vA: '8,0 m/s', vB: '0 m/s', d: '?' })),
      versCours(partieAngles(LANCER)),
      partieEquation(LANCER),
      { type: 'nombre', q: 'Calcule la hauteur h atteinte.', label: 'h =', valeur: 3.2, unite: 'm', signe: false,
        diag: v => (proche(v, -3.2) ? 'Une hauteur est positive : les deux membres sont négatifs (0 − ½ m v<sub>A</sub>² = −m g h), le signe − se simplifie.' : proche(v, 6.4) ? 'N\'oublie pas le ½ : ½ m v² = m g h.' : proche(v, .8) ? 'La vitesse est au carré : 8,0² = 64.' : 'h = v<sub>A</sub>² / (2 g).'),
        solution: calc(`0 − ½ m ${v2(vA)} = −m g h donc h = ${fr(v2(vA), '2 g')} = ${fr('8,0<sup>2</sup>', '2 × 10')} = ${c('3,2 m')}`) },
    ] }]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p><b>Théorème de l'énergie cinétique</b> : ΔE<sub>c</sub> = ${EC_}(B) − ${EC_}(A) = Σ W<sub>AB</sub>, soit ½ m ${v2(vB)} − ½ m ${v2(vA)} = W<sub>AB</sub>(${nomV('F')}<sub>1</sub>) + W<sub>AB</sub>(${nomV('F')}<sub>2</sub>) + …</p></div>
    <div class="cle"><p><b>Méthode</b> : schéma (A, B, forces et angles, données) ; théorème ; chaque travail (⊥ → 0, 180° → cos = −1) ; application numérique ; isoler l'inconnue.</p></div>
    <div class="cle"><p>Chute de h : ${W('P')} = m g h et ${vB} = √(2 g h) si ${vA} = 0. Lancer vers le haut : ${W('P')} = −m g h ; au sommet, <b>${vB} = 0</b>.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_4a_questions.html">Questions : énoncé et chute →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_4b_cours.html">Partie B : freinage et démarrage</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_4.html#chute">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
EC.menu('module_4a_cours');
</script>
</body>
