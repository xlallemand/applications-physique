<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 4 : énoncé du théorème de l'énergie cinétique — Chapitre 7 : Théorème de l'énergie cinétique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="ec.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/dragdrop.js"></script>
<script src="../../assets/sommaire.js"></script>
<script src="ec.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 4 · COURS 1 / 6</span>
    <h2 class="er-titre">Énoncé du théorème de l'énergie cinétique</h2>
    <p class="er-contexte">La variation de l'énergie cinétique d'un solide entre A et B est égale à la <b>somme des travaux</b> des forces qui s'exercent sur lui : ΔE<sub>c</sub> = Σ W.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 1 du module 4 : énoncé du théorème de l'énergie cinétique
   et son usage (Σ W connue → E_c(B) ; signe de Σ W → accélère ou ralentit).
   Valeurs (vérifiées par un script) : 40 + 60 − 20 → 80 J ; 50 − 30 → 20 J.
   ============================================================ */
const { exemple } = COURS;
const { o, proche, nomV } = EC;
const calc = h => `<p class="crs-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const EC_ = 'E<sub>c</sub>', vA = 'v<sub>A</sub>', vB = 'v<sub>B</sub>';
const v2 = x => `${x}<sup>2</sup>`;

/* ---------- 1. Le théorème ---------- */
function etape1(c_) {
  const carte = c_.carte('1. Le théorème de l\'énergie cinétique');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Théorème.</b> Pour un solide qui se déplace d'un point A à un point B, soumis aux forces ${nomV('F')}<sub>1</sub>, ${nomV('F')}<sub>2</sub>… :</p>
        <p class="crs-formule">ΔE<sub>c</sub> = ${EC_}(B) − ${EC_}(A) = W<sub>AB</sub>(${nomV('F')}<sub>1</sub>) + W<sub>AB</sub>(${nomV('F')}<sub>2</sub>) + …</p>
        <p class="crs-formule">½ m ${v2(vB)} − ½ m ${v2(vA)} = W<sub>AB</sub>(${nomV('F')}<sub>1</sub>) + W<sub>AB</sub>(${nomV('F')}<sub>2</sub>) + …</p></div>
      <p>L'énergie cinétique est liée à la <b>vitesse</b> ; le travail est lié aux <b>forces</b> et au <b>déplacement</b>. Donc :</p>
      <ul class="er-liste"><li>si on connaît les travaux, on calcule ΔE<sub>c</sub>, donc la variation de vitesse ;</li>
        <li>si on connaît la vitesse au départ et à l'arrivée, on calcule le travail, donc une <b>force</b> ou une <b>distance</b>.</li></ul>
    </div>
    ${exemple(`<p>Un chariot a une énergie cinétique de 40 J en A. Entre A et B, une force motrice fournit 60 J et les frottements retirent 20 J.</p>
      ${calc(`${EC_}(B) − ${EC_}(A) = 60 + (−20) = 40 J donc ${EC_}(B) = 40 + 40 = ${c('80 J')}`)}<p>Le chariot a accéléré : la somme des travaux est positive.</p>`)}`);
  c_.aToi(carte, [
    { titre: 'Une luge', enonce: `<p>Une luge a une énergie cinétique de 50 J en A. Entre A et B, une seule force travaille : les frottements, W = −30 J.</p>`,
      parties: [{ type: 'nombre', q: `Que vaut ${EC_}(B) ?`, label: `${EC_}(B) =`, valeur: 20, unite: 'J', signe: false,
        diag: v => (proche(v, 80) ? 'Le travail est <b>négatif</b> : il retire de l\'énergie. 50 + (−30).' : `${EC_}(B) = ${EC_}(A) + Σ W.`), solution: calc(`${EC_}(B) = 50 + (−30) = ${c('20 J')}`) }] },
    { titre: 'Accélère ou ralentit ?', enonce: '<p>Entre A et B, la somme des travaux des forces qui s\'exercent sur un vélo est négative.</p>',
      parties: [{ type: 'choix', q: 'Entre A et B, le vélo :', melanger: false, options: [o('r', 'ralentit'), o('a', 'accélère'), o('c', 'garde la même vitesse')], bonne: 'r',
        indices: { a: 'Σ W &lt; 0 donc ΔE<sub>c</sub> &lt; 0 : l\'énergie cinétique diminue.', c: 'ΔE<sub>c</sub> = Σ W n\'est pas nul.' }, solution: '<p>ΔE<sub>c</sub> = Σ W &lt; 0 : l\'énergie cinétique, donc la vitesse, diminue.</p>' }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p><b>Théorème de l'énergie cinétique</b> : ΔE<sub>c</sub> = ${EC_}(B) − ${EC_}(A) = Σ W<sub>AB</sub>, soit ½ m ${v2(vB)} − ½ m ${v2(vA)} = W<sub>AB</sub>(${nomV('F')}<sub>1</sub>) + W<sub>AB</sub>(${nomV('F')}<sub>2</sub>) + …</p></div>
    <div class="cle"><p>Σ W &gt; 0 : la vitesse augmente ; Σ W &lt; 0 : elle diminue ; Σ W = 0 : elle ne change pas.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_4b_cours.html">Utilisation : chute →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_4.html#enonce">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, aRetenir]);
EC.menu('module_4a_cours');
</script>
</body>
</html>
