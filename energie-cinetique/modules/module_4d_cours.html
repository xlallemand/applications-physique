<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 4 : utilisation, freinage — Chapitre 7 : Théorème de l'énergie cinétique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="ec.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/dragdrop.js"></script>
<script src="../../assets/sommaire.js"></script>
<script src="ec.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 4 · COURS 4 / 6</span>
    <h2 class="er-titre">Utilisation : freinage</h2>
    <p class="er-contexte">Un « classique du bac » : la <b>force de freinage</b> d'une voiture qui s'arrête. Même méthode à chaque fois : <b>schéma</b>, <b>théorème</b>, <b>travaux</b> (les forces ⊥ au déplacement donnent 0), application numérique, inconnue isolée.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 4 du module 4 : exemple 3 du cours (force de freinage)
   traité avec le schéma (EC.schemaMvt), puis « À toi » à valeurs changées
   (données glissées, angle de chaque force, théorème) et le calcul.
   Valeurs (vérifiées par un script) : ex. 3 : 900 kg, 50 km/h, 10 m →
   ΔE_c = −8,68 × 10⁴ J, f ≈ 8,7 × 10³ N ; « À toi » : 1 000 kg, 72 km/h,
   25 m → f = 8,0 × 10³ N.
   ============================================================ */
const { exemple } = COURS;
const { proche, fr, nomV, W, schemaMvt, partieDonnees, partieAngles, partieEquation, versCours } = EC;
const calc = h => `<p class="crs-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const EC_ = 'E<sub>c</sub>', vA = 'v<sub>A</sub>', vB = 'v<sub>B</sub>';
const v2 = x => `${x}<sup>2</sup>`;
const TEC = `${EC_}(B) − ${EC_}(A) = ${W('P')} + ${W('RN')} + ${W('f')}`;

/* ---------- 1. Exemple 3 : la force de freinage ---------- */
const FREIN = { sens: 'droite', objet: 'voiture', forces: ['P', 'RN', 'f'] };
function etape1(c_) {
  const carte = c_.carte('1. La force de freinage (exemple 3)');
  c_.ajouter(carte, exemple(`<p>Une voiture de masse m = 900 kg, qui roule à v = 50 km/h, freine pour s'arrêter. La distance d'arrêt est de 10 m. Calculer la valeur de la force de frottement pendant le freinage (supposée constante).</p>
      ${schemaMvt(Object.assign({ angles: true }, FREIN), { m: '900 kg', vA: '50 km/h', vB: '0 m/s', d: '10 m' })}
      <p>Théorème de l'énergie cinétique :</p>
      ${calc(TEC)}
      ${calc(`½ m ${v2(vB)} − ½ m ${v2(vA)} = 0 + 0 + f × AB × cos 180° &nbsp; (0 car ⊥ au déplacement)`)}
      ${calc(`½ × 900 × 0<sup>2</sup> − ½ × 900 × (${fr('50', '3,6')})<sup>2</sup> = f × 10 × (−1)`)}
      ${calc(`−8,68 × 10<sup>4</sup> = −10 f &nbsp; donc &nbsp; f = ${fr('8,68 × 10<sup>4</sup>', '10')} ≈ ${c('8,7 × 10<sup>3</sup> N')}`)}`, 'Exemple 3 (traité, classique du bac)'));
  c_.aToi(carte, [{ titre: 'Un freinage', enonce: '<p>Une voiture de <b>1 000 kg</b> roule à <b>72 km/h</b>. Elle freine et s\'arrête sur <b>25 m</b>. On cherche la force de frottement f, supposée constante.</p>',
    parties: [
      versCours(partieDonnees(FREIN, { m: '1 000 kg', vA: '72 km/h', vB: '0 m/s', d: '25 m' })),
      versCours(partieAngles(FREIN)),
      partieEquation(FREIN),
      { type: 'nombre', q: `Convertis ${vA} en m/s.`, label: `${vA} =`, valeur: 20, unite: 'm/s', signe: false, diag: v => (proche(v, 259.2) ? 'On <b>divise</b> par 3,6.' : '72 / 3,6.'), solution: calc(`${vA} = 72 / 3,6 = ${c('20 m/s')}`) },
      { type: 'sci', q: `Calcule ΔE<sub>c</sub> = ${EC_}(B) − ${EC_}(A), avec son signe.`, label: 'ΔE<sub>c</sub> =', valeur: -2e5, unite: 'J', cs: 2, rel: .01,
        diag: v => (proche(v, 2e5) ? `${EC_}(B) = 0 : ΔE<sub>c</sub> = 0 − ${EC_}(A) est <b>négative</b>.` : proche(Math.abs(v), .5 * 1000 * 72 * 72) ? 'Utilise la vitesse en m/s.' : `ΔE<sub>c</sub> = 0 − ½ × 1 000 × 20².`),
        solution: calc(`ΔE<sub>c</sub> = ½ × 1 000 × 0<sup>2</sup> − ½ × 1 000 × 20<sup>2</sup> = ${c('−2,0 × 10<sup>5</sup> J')}`) },
      { type: 'nombre', q: 'Isole f et calcule-la.', label: 'f =', valeur: 8000, unite: 'N', signe: false,
        diag: v => (proche(v, -8000) ? 'Une force (sa valeur) est positive : −2,0 × 10<sup>5</sup> = −25 f donne f &gt; 0.' : proche(v, 2e5 * 25) ? 'On <b>divise</b> par AB : f = 2,0 × 10<sup>5</sup> / 25.' : '−2,0 × 10<sup>5</sup> = f × 25 × (−1).'),
        solution: calc(`−2,0 × 10<sup>5</sup> = −25 f &nbsp; donc &nbsp; f = ${fr('2,0 × 10<sup>5</sup>', '25')} = ${c('8,0 × 10<sup>3</sup> N')}`) },
    ] }]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>Sur une route horizontale, ${nomV('P')} et ${nomV('RN')} sont ⊥ au déplacement : leurs travaux sont <b>nuls</b>. Les frottements (α = 180°) : ${W('f')} = −f × AB.</p></div>
    <div class="cle"><p>Freinage jusqu'à l'arrêt (${vB} = 0) : −½ m ${v2(vA)} = −f × AB, donc f = ${fr('½ m ' + v2(vA), 'AB')}.</p></div>
    <div class="cle"><p>Vitesses en <b>m/s</b> (÷ 3,6) avant de les élever au carré.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_4e_cours.html">Utilisation : distance d'arrêt →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_4.html#freinage">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, aRetenir]);
EC.menu('module_4d_cours');
</script>
</body>
</html>
