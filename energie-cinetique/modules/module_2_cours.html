<title>Module 2 : travail d'une force — Chapitre 7 : Théorème de l'énergie cinétique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="ec.css">
<link rel="stylesheet" href="../../assets/sommaire.css">

<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS</span>
    <h2 class="er-titre">Travail d'une force</h2>
    <p class="er-contexte">Le <b>travail</b> d'une force est l'énergie qu'elle transmet à un solide au cours d'un déplacement : W<sub>AB</sub>(<span class="vec-nom">F</span>) = <b>F × AB × cos α</b>, en joules. Il est <b>moteur</b>, <b>résistant</b> ou <b>nul</b>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Définition et formule W = F × AB × cos α (calculatrice en degrés,
   cos 0° = 1, cos 90° = 0, cos 180° = −1), signe du travail (simulateur
   EC.Simu en « À toi »), travail du poids (± m g h), force
   perpendiculaire au déplacement (W = 0 sans calcul).
   Erreurs diagnostiquées : calculatrice en radians, sin au lieu de cos,
   signe oublié pour α > 90°, longueur du chemin AB prise pour la
   hauteur h.
   Valeurs (vérifiées par un script) : 50 × 4,0 × cos 30° ≈ 173 J ;
   20 × 5 × cos 60° = 50 J ; 40 × 2,5 × cos 120° = −50 J ;
   70 × 9,81 × 200 ≈ 1,37 × 10⁵ J ; −60 × 9,81 × 500 ≈ −2,94 × 10⁵ J.
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { o, fmt, proche, nomV, W, figTravail, figPente } = EC;
const calc = h => `<p class="crs-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const WF = W('F');
const cosd = a => EC.cosd(a);
const rad = a => Math.cos(a);   // cos d'un angle pris (à tort) en radians

// petit cercle trigonométrique : cos 0° = 1, cos 90° = 0, cos 180° = −1
const CERCLE = `<svg viewBox="0 0 300 168" class="ec-doc ec-doc-petit" style="max-width:300px" role="img" aria-label="Cercle trigonométrique : cos 0° = 1, cos 90° = 0, cos 180° = −1">
  <line x1="40" y1="90" x2="262" y2="90" class="ec-sc-sol"/><path d="M270,90 l-9,-4 v8 Z" class="ec-sc-point"/><text x="272" y="82" class="ec-sc-txt">cos α</text>
  <line x1="150" y1="20" x2="150" y2="160" class="ec-sc-cote"/>
  <circle cx="150" cy="90" r="58" fill="none" class="ec-sc-arc"/>
  <circle cx="208" cy="90" r="5" class="ec-sc-point"/><circle cx="150" cy="32" r="5" class="ec-sc-point"/><circle cx="92" cy="90" r="5" class="ec-sc-point"/>
  <text x="214" y="80" class="ec-sc-alpha">α = 0°</text><text x="158" y="26" class="ec-sc-alpha">α = 90°</text><text x="86" y="80" text-anchor="end" class="ec-sc-alpha">α = 180°</text>
  <text x="208" y="110" text-anchor="middle" class="ec-sc-proj">1</text><text x="160" y="110" class="ec-sc-proj">0</text><text x="92" y="110" text-anchor="middle" class="ec-sc-proj">−1</text></svg>
  <p style="text-align:center"><b>cos 0° = 1 ; cos 90° = 0 ; cos 180° = −1</b></p>`;

/* ---------- 1. Définition et formule ---------- */
function qCalcul(titre, F, AB, a) {
  const w = F * AB * cosd(a);
  return { titre, enonce: `<p>F = ${F} N, AB = ${fmt(AB)} m, α = ${a}°.</p>`,
    parties: [{ type: 'nombre', q: `Calcule le travail ${WF}.`, label: `${WF} =`, valeur: w, unite: 'J', rel: .01, tol: Math.abs(w) < 1e-9 ? 1e-9 : null,
      diag: v => (proche(v, F * AB * rad(a), .02) ? 'Ta calculatrice est en <b>radians</b> : règle-la en <b>degrés</b>.'
        : proche(v, -w, .02) ? `cos ${a}° est <b>négatif</b> : le travail aussi.`
        : proche(v, F * AB * Math.sin(a * Math.PI / 180), .02) ? 'C\'est <b>cos</b> α, pas sin α.'
        : proche(v, F * AB, .02) ? 'N\'oublie pas de multiplier par cos α.' : 'W = F × AB × cos α.'),
      solution: calc(`${WF} = ${F} × ${fmt(AB)} × cos ${a}° = ${c(fmt(Math.round(w * 10) / 10) + ' J')}`) }] };
}
function etape1(c_) {
  const carte = c_.carte('1. Le travail d\'une force');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Définition.</b> Le <b>travail</b> d'une force est l'<b>énergie transmise</b> à un solide par cette force au cours d'un déplacement. Il s'exprime en <b>joules (J)</b>.</p></div>
      ${figTravail({ alpha: 30 })}
      <div class="cle"><p class="crs-formule">${WF} = F × AB × cos α</p>
        <p>F : valeur de la force, constante, en N ; AB : longueur du déplacement, en m ; α : angle entre ${nomV('F')} et le déplacement <span class="vec-nom">AB</span>.</p></div>
      <p><b>Calculatrice</b> : règle-la en <b>degrés</b> quand l'angle est en degrés (en radians quand il est en radians). Trois valeurs à connaître :</p>
      ${CERCLE}
    </div>
    ${exemple(`<p>Une force de 50 N tire un chariot sur AB = 4,0 m ; elle fait un angle de 30° avec le déplacement.</p>
      ${calc(`${WF} = F × AB × cos α = 50 N × 4,0 m × cos 30° ≈ ${c('173 J')}`)}`)}`);
  c_.aToi(carte, [qCalcul('Calcul 1', 20, 5, 60), qCalcul('Calcul 2', 200, 3, 0), qCalcul('Calcul 3', 40, 2.5, 120)]);
  return carte;
}

/* ---------- 2. Signe du travail ---------- */
// « À toi » avec le simulateur : régler la force pour obtenir le travail demandé
function partieSimu(q, test, diag, reponse, sol, init) {
  return { type: 'perso', q, solution: sol,
    monter(zone, api) {
      const s = EC.Simu(zone, Object.assign({ boutons: false, chariot: false }, init));
      const b = EC.boutonValider(zone);
      b.onclick = () => {
        if (api.fini()) return;
        const e = s.etat();
        if (test(e)) { b.fermer(); api.reussi(); } else api.erreur(diag(e));
      };
      return { montrer() { s.regler(reponse); b.fermer(); } };
    } };
}
function etape2(c_) {
  const carte = c_.carte('2. Travail moteur, résistant ou nul');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><ul class="er-liste">
        <li>α &lt; 90° : cos α &gt; 0, <b>W &gt; 0</b> : travail <b>moteur</b>, il fait <b>augmenter</b> la vitesse ;</li>
        <li>α &gt; 90° : cos α &lt; 0, <b>W &lt; 0</b> : travail <b>résistant</b>, il fait <b>diminuer</b> la vitesse ;</li>
        <li>α = 90° : cos α = 0, <b>W = 0</b> : travail <b>nul</b>.</li></ul></div>
    </div>
    ${exemple('<p>Un enfant tire sa luge avec une corde inclinée de 30° : travail <b>moteur</b>. Les frottements de la neige sur la luge, opposés au mouvement (α = 180°) : travail <b>résistant</b>. Le poids de la luge, perpendiculaire au sol horizontal : travail <b>nul</b>.</p>')}`);
  c_.aToi(carte, [
    { titre: 'Un travail résistant', parties: [partieSimu('Règle le simulateur pour que le travail de la force soit <b>résistant</b> (avec F ≠ 0 et AB ≠ 0), puis valide.',
      e => e.W < -1e-9, e => (e.F === 0 || e.AB === 0 ? 'Avec F = 0 ou AB = 0, le travail est nul.' : Math.abs(e.W) < 1e-9 ? 'À α = ±90°, le travail est nul.' : 'Le travail est moteur : la force tire vers l\'avant. Fais-la tirer vers l\'arrière (α plus grand que 90°).'),
      { alpha: 150 }, '<p>Le travail est résistant quand α est compris entre 90° et 180° (ou entre −90° et −180°) : la force tire vers l\'arrière.</p>', { F: 10, AB: 1, alpha: 30 })] },
    { titre: 'Un travail donné', parties: [partieSimu('Avec F = 10 N et AB = 1 m, règle l\'angle α pour que le travail vaille <b>W = 5,0 J</b>.',
      e => Math.abs(e.W - 5) < .05, e => (e.F !== 10 || e.AB !== 1 ? 'Garde F = 10 N et AB = 1,0 m.' : e.W < 0 ? 'Le travail doit être moteur : α inférieur à 90°.' : e.W > 5 ? 'W est trop grand : augmente α.' : 'W est trop petit : diminue α.'),
      { F: 10, AB: 1, alpha: 60 }, '<p>10 × 1 × cos α = 5 donne cos α = 0,5 : α = 60° (ou −60°).</p>', { F: 10, AB: 1, alpha: 0 })] },
    { titre: 'Quel travail ?', enonce: '<p>Une voiture freine : les frottements de la route sur les roues s\'opposent au mouvement.</p>',
      parties: [{ type: 'choix', q: 'Le travail des frottements est :', options: [o('m', 'moteur'), o('r', 'résistant'), o('n', 'nul')], bonne: 'r', melanger: false,
        indices: { m: 'Les frottements ralentissent la voiture : ils lui retirent de l\'énergie.', n: 'Les frottements sont opposés au déplacement (α = 180°), pas perpendiculaires.' },
        solution: '<p>α = 180°, cos α = −1 : W &lt; 0, travail résistant (la vitesse diminue).</p>' }] },
  ]);
  return carte;
}

/* ---------- 3. Travail du poids ---------- */
function etape3(c_) {
  const carte = c_.carte('3. Le travail du poids');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p>Quand un solide de masse m change d'altitude de h :</p>
        <p class="crs-formule">${W('P')} = m × g × h</p><p style="text-align:center">s'il <b>descend</b> de h (travail moteur) ;</p>
        <p class="crs-formule">${W('P')} = −m × g × h</p><p style="text-align:center">s'il <b>monte</b> de h (travail résistant).</p>
        <p>h est la <b>différence d'altitude</b> (en m), pas la longueur du chemin AB ; g = 9,81 N/kg.</p></div>
      ${figPente({ sens: 'descend' })}
    </div>
    ${exemple(`<p>Un skieur de 70 kg descend une piste de 800 m de long ; le dénivelé est h = 200 m.</p>
      ${calc(`${W('P')} = m × g × h = 70 kg × 9,81 N/kg × 200 m ≈ ${c('1,37 × 10<sup>5</sup> J')}`)}<p>Le skieur descend : le travail du poids est moteur. La longueur de la piste (800 m) ne sert pas.</p>`)}`);
  c_.aToi(carte, [
    { titre: 'Une randonnée', enonce: '<p>Une randonneuse de 60 kg monte au sommet d\'une colline par un chemin de 3,0 km ; le dénivelé est de 500 m.</p>',
      parties: [{ type: 'sci', q: `Calcule le travail de son poids ${W('P')} (3 chiffres significatifs, avec son signe).`, label: `${W('P')} =`, valeur: -60 * 9.81 * 500, unite: 'J', cs: 3, rel: .01,
        diag: v => (proche(v, 60 * 9.81 * 500, .02) ? 'Elle <b>monte</b> : le travail du poids est négatif (bouton ± devant le nombre).' : proche(Math.abs(v), 60 * 9.81 * 3000, .02) ? 'h est le <b>dénivelé</b> (500 m), pas la longueur du chemin.' : '−m × g × h, avec h = 500 m.'),
        solution: calc(`${W('P')} = −m × g × h = −60 × 9,81 × 500 ≈ ${c('−2,94 × 10<sup>5</sup> J')}`) + '<p>À la montée, le poids s\'oppose au mouvement : travail résistant.</p>' }] },
    { titre: 'Une chute', enonce: '<p>Une balle de 0,50 kg tombe d\'une hauteur de 2,0 m.</p>',
      parties: [{ type: 'nombre', q: `Calcule le travail de son poids ${W('P')} (3 chiffres significatifs).`, label: `${W('P')} =`, valeur: .5 * 9.81 * 2, unite: 'J', rel: .01,
        diag: v => (proche(v, -9.81) ? 'Elle <b>descend</b> : le travail du poids est positif.' : proche(v, 9.81 * 2) ? 'N\'oublie pas la masse : m = 0,50 kg.' : 'm × g × h.'),
        solution: calc(`${W('P')} = 0,50 × 9,81 × 2,0 ≈ ${c('9,81 J')}`) }] },
  ]);
  return carte;
}

/* ---------- 4. Force perpendiculaire au déplacement ---------- */
function etape4(c_) {
  const carte = c_.carte('4. Une force perpendiculaire au déplacement');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p>Une force <b>perpendiculaire</b> au déplacement ne travaille pas : α = 90°, cos 90° = 0, donc <b>W = 0</b>.</p>
        <p>Important : <b>pas besoin de calcul</b>. On écrit simplement : « la force est ⊥ au déplacement, donc W = 0 ».</p></div>
    </div>
    ${exemple(`<p>Une voiture roule sur une route horizontale. Le poids ${nomV('P')} et la réaction normale ${nomV('RN')} sont verticaux, le déplacement est horizontal :</p>
      ${calc(`${W('P')} = 0 car ${nomV('P')} ⊥ au déplacement ; ${W('RN')} = 0 car ${nomV('RN')} ⊥ au déplacement`)}`)}`);
  c_.aToi(carte, [
    { titre: 'La réaction de la route', enonce: `<p>Un vélo roule sur 50 m d'une route horizontale. La route exerce sur lui la réaction normale ${nomV('RN')}, de valeur 800 N.</p>`,
      parties: [{ type: 'choix', q: `Que vaut le travail ${W('RN')} ?`, colonne: true, bonne: 'ok',
        options: [o('ok', `0 car ${nomV('RN')} ⊥ au déplacement`), o('p', '800 × 50 = 40 000 J'), o('m', '−800 × 50 = −40 000 J')],
        indices: { p: `${nomV('RN')} est verticale et le déplacement horizontal : α = 90°.`, m: `${nomV('RN')} ne s'oppose pas au déplacement : elle lui est perpendiculaire.` },
        solution: `<p>${nomV('RN')} est perpendiculaire au déplacement : ${W('RN')} = 0, sans calcul.</p>` }] },
    { titre: 'Le plateau du serveur', enonce: '<p>Un serveur marche en ligne droite sur un sol horizontal en portant un plateau. Sa main exerce sur le plateau une force verticale, vers le haut.</p>',
      parties: [{ type: 'choix', q: 'Le travail de cette force est :', options: [o('m', 'moteur'), o('r', 'résistant'), o('n', 'nul')], bonne: 'n', melanger: false,
        indices: { m: 'La force est verticale, le déplacement horizontal : regarde l\'angle.', r: 'La force est verticale, le déplacement horizontal : regarde l\'angle.' },
        solution: '<p>La force est perpendiculaire au déplacement : W = 0. Porter un plateau à l\'horizontale ne lui fournit pas d\'énergie.</p>' }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>Le <b>travail</b> d'une force est l'énergie transmise au solide au cours d'un déplacement, en <b>joules</b> : ${WF} = F × AB × cos α (calculatrice en degrés).</p></div>
    <div class="cle"><p>W &gt; 0 : travail <b>moteur</b> (la vitesse augmente) ; W &lt; 0 : travail <b>résistant</b> (la vitesse diminue) ; W = 0 : travail <b>nul</b>. cos 0° = 1, cos 90° = 0, cos 180° = −1.</p></div>
    <div class="cle"><p>Travail du poids : ${W('P')} = m g h à la descente, −m g h à la montée (h : différence d'altitude).</p></div>
    <div class="cle"><p>Une force <b>perpendiculaire au déplacement</b> ne travaille pas : « la force est ⊥ au déplacement donc W = 0 ».</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2_questions.html">Questions sur le travail d'une force →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_3_cours.html">Module 3 : énergie cinétique</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, etape4, aRetenir]);
EC.menu('module_2_cours');
</script>
</body>
</html>
