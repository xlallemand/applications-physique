<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 4 : questions, énoncé et chute — Chapitre 7 : Théorème de l'énergie cinétique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="ec.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<script src="../../assets/sommaire.js"></script>
<script src="ec.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page" id="app"></div>

<script>
/* ============================================================
   10 questions tirées au hasard : vitesse finale après une chute (4,
   dont une lancée vers le bas), hauteur atteinte d'un objet lancé vers
   le haut (3), énoncé du théorème (2), angle du poids et expression de
   son travail (1). Valeurs aléatoires, choisies pour des calculs
   propres (g = 10 m·s⁻² ou 9,81 m·s⁻²).
   Erreurs diagnostiquées : racine oubliée, facteur 2 oublié, signe de
   m g h, v_B ≠ 0 au sommet, signe du travail.
   ============================================================ */
const { o, fq, fmt, hasard, melanger, proche, fr, rac, W, schemaMvt, partieAngles, partieEquation } = EC;
const calc = h => `<p class="ph-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const vA = 'v<sub>A</sub>', vB = 'v<sub>B</sub>', EC_ = 'E<sub>c</sub>';
const v2 = x => `${x}<sup>2</sup>`;
const r3 = v => +v.toPrecision(3);
const CHUTE = { sens: 'bas', objet: 'pomme', forces: ['P'], d: 'h' }, LANCER = { sens: 'haut', objet: 'balle', forces: ['P'], d: 'h' };
const gTxt = g => (g === 10 ? '10 m·s<sup>−2</sup>' : '9,81 m·s<sup>−2</sup>');

/* ---------- Groupe 1 : vitesse après une chute ---------- */
function qChute(g, avecEq) {
  const [qui, m] = hasard([['Une pomme', '100 g'], ['Une bille', '20 g'], ['Un pot de fleurs', '1,5 kg'], ['Une balle', '60 g']]);
  const h = g === 10 ? hasard([1.25, 1.8, 3.2, 5, 7.2, 20]) : hasard([2, 4, 6, 10, 15]), v = Math.sqrt(2 * g * h);
  const ps = [];
  if (avecEq) ps.push(partieEquation(CHUTE, { solution: `<p>Le poids, seule force qui travaille, est dans le sens du déplacement : ${W('P')} = m g h.</p>` }));
  ps.push(fq.nombre(`Calcule ${vB}, la vitesse en arrivant au sol (3 chiffres significatifs).`, `${vB} =`, v, 'm/s', { signe: false, rel: .01, affiche: fmt(r3(v)),
    diag: x => (proche(x, v * v, .02) ? 'Tu as trouvé v² : prends la <b>racine carrée</b>.' : proche(x, Math.sqrt(g * h), .02) ? `${v2(vB)} = 2 g h : n'oublie pas le 2.` : proche(x, 2 * g * h, .02) ? 'Prends la racine carrée.' : `${vB} = √(2 g h).`),
    solution: calc(`½ m ${v2(vB)} − 0 = m g h donc ${vB} = ${rac('2 g h')} = ${rac(`2 × ${fmt(g)} × ${fmt(h)}`)} ≈ ${c(fmt(r3(v)) + ' m/s')}`) }));
  return { theme: 'Vitesse après une chute', enonce: `<p>${qui} de ${m} tombe sans vitesse initiale d'une hauteur de ${fmt(h)} m (g = ${gTxt(g)} ; on néglige l'air).</p>`,
    figure: z => { z.innerHTML = schemaMvt(CHUTE, { m, vA: '0', vB: '?', d: fmt(h) + ' m' }); }, parties: ps };
}
function qChuteLancee() {
  const [va, h] = hasard([[5, 3.75], [6, 6.4], [10, 15], [4, 2.4]]);
  const v = Math.sqrt(va * va + 20 * h);
  return { theme: 'Vitesse après une chute', enonce: `<p>On lance une balle vers le bas avec une vitesse ${vA} = ${va} m/s, d'une hauteur de ${fmt(h)} m (g = 10 m·s<sup>−2</sup>).</p>`,
    parties: [fq.nombre(`Calcule ${vB}, la vitesse en arrivant au sol (3 chiffres significatifs).`, `${vB} =`, v, 'm/s', { signe: false, rel: .01, affiche: fmt(r3(v)),
      diag: x => (proche(x, Math.sqrt(20 * h), .02) ? `${vA} n'est pas nulle ici : ½ m ${v2(vB)} − ½ m ${v2(vA)} = m g h.` : proche(x, va + Math.sqrt(20 * h), .02) ? 'On n\'ajoute pas les vitesses : ce sont les <b>carrés</b> qui s\'ajoutent.' : `${v2(vB)} = ${v2(vA)} + 2 g h.`),
      solution: calc(`½ m ${v2(vB)} − ½ m ${v2(vA)} = m g h donc ${v2(vB)} = ${v2(vA)} + 2 g h = ${va}<sup>2</sup> + 2 × 10 × ${fmt(h)} = ${fmt(r3(v * v))}`) + calc(`${vB} ≈ ${c(fmt(r3(v)) + ' m/s')}`) })] };
}
const G1 = [() => qChute(10, true), () => qChute(10, false), () => qChute(9.81, false), qChuteLancee];

/* ---------- Groupe 2 : hauteur atteinte ---------- */
function qHauteur(avecSommet) {
  const v = hasard([4, 6, 8, 10, 12, 14]), h = v * v / 20;
  const ps = [];
  if (avecSommet) ps.push(fq.choix(`Que vaut la vitesse ${vB} au sommet B ?`, [o('0', '0 m/s'), o('vA', `${v} m/s (la même qu'au départ)`), o('div', `${v / 2} m/s (la moitié)`)], '0',
    { melanger: false, indices: { vA: 'L\'objet ralentit en montant…', div: 'Au sommet, l\'objet s\'arrête un instant avant de redescendre.' }, solution: `<p>Au sommet, l'objet s'arrête un instant : ${vB} = 0 (à savoir).</p>` }));
  ps.push(fq.nombre('Calcule la hauteur h atteinte (2 chiffres significatifs).', 'h =', h, 'm', { signe: false, rel: .01, affiche: fmt(h),
    diag: x => (proche(x, -h) ? 'Une hauteur est positive : 0 − ½ m v<sub>A</sub>² = −m g h.' : proche(x, 2 * h) ? 'N\'oublie pas le ½ de l\'énergie cinétique.' : proche(x, v / 20) ? 'La vitesse est au carré.' : `h = ${fr(v2(vA), '2 g')}.`),
    solution: calc(`0 − ½ m ${v2(vA)} = −m g h donc h = ${fr(v2(vA), '2 g')} = ${fr(v + '<sup>2</sup>', '2 × 10')} = ${c(fmt(h) + ' m')}`) }));
  return { theme: 'Hauteur atteinte', enonce: `<p>On lance verticalement vers le haut une balle avec une vitesse ${vA} = ${v} m/s (g = 10 m·s<sup>−2</sup>, air négligé).</p>`,
    figure: z => { z.innerHTML = schemaMvt(LANCER, { vA: v + ' m/s', vB: '0', d: '?' }); }, parties: ps };
}
const G2 = [() => qHauteur(true), () => qHauteur(false), () => qHauteur(false)];

/* ---------- Groupe 3 : le théorème ---------- */
const G3 = [
  function bilan() {
    const eA = hasard([20, 40, 60, 100]), w1 = hasard([30, 50, 80]), w2 = -hasard([10, 20, 30]), eB = eA + w1 + w2;
    return { theme: 'Théorème de l\'énergie cinétique', enonce: `<p>Un chariot a une énergie cinétique de ${eA} J en A. Entre A et B, une force fournit un travail de ${w1} J et les frottements un travail de ${fmt(w2)} J.</p>`,
      parties: [fq.nombre(`Calcule ${EC_}(B).`, `${EC_}(B) =`, eB, 'J', { signe: false, tol: .01,
        diag: x => (proche(x, eA + w1 - w2) ? 'Le travail des frottements est <b>négatif</b> : on l\'ajoute avec son signe.' : proche(x, w1 + w2) ? `C'est ΔE<sub>c</sub> ; ${EC_}(B) = ${EC_}(A) + ΔE<sub>c</sub>.` : `${EC_}(B) = ${EC_}(A) + Σ W.`),
        solution: calc(`${EC_}(B) = ${eA} + ${w1} + (${fmt(w2)}) = ${c(eB + ' J')}`) })] };
  },
  function signe() {
    const [txt, bon] = hasard([['La somme des travaux des forces est positive.', 'a'], ['La somme des travaux des forces est négative.', 'r'], ['La somme des travaux des forces est nulle.', 'c']]);
    return { theme: 'Théorème de l\'énergie cinétique', enonce: `<p>Un solide va de A à B. ${txt}</p>`,
      parties: [fq.choix('Entre A et B, le solide :', [o('a', 'accélère'), o('r', 'ralentit'), o('c', 'garde la même vitesse')], bon, { melanger: false, indice: 'ΔE<sub>c</sub> = Σ W : le signe de Σ W donne le signe de ΔE<sub>c</sub>.', solution: '<p>ΔE<sub>c</sub> a le signe de Σ W : positif → la vitesse augmente ; négatif → elle diminue ; nul → elle ne change pas.</p>' })] };
  },
];

/* ---------- Groupe 4 : angle du poids ---------- */
const G4 = [function angles() {
  const s = hasard([CHUTE, LANCER]);
  return { theme: 'Travail du poids', enonce: `<p>${s.sens === 'bas' ? 'Une pomme tombe de A (en haut) à B (en bas).' : 'Une balle lancée vers le haut monte de A (en bas) à B (le sommet).'}</p>`,
    figure: z => { z.innerHTML = schemaMvt(s, {}); }, parties: [partieAngles(s)] };
}];

// tirage : 4 + 3 + 2 + 1 questions
function tirage() {
  return G1.map(f => f()).concat(G2.map(f => f()), G3.map(f => f()), G4.map(f => f()));
}

EC.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 4 · QUESTIONS · PARTIE A', titre: 'Énoncé et chute',
  intro: '<p class="er-contexte">10 questions tirées au hasard : vitesse après une chute, hauteur atteinte par un objet lancé vers le haut, énoncé du théorème, travail du poids.</p>',
  questions: tirage,
  revoir: { href: 'module_4a_cours.html', label: 'Revoir le cours' },
  suite: { href: 'module_4b_cours.html', label: 'Partie B : freinage et démarrage →' },
});
EC.menu('module_4a_questions');
</script>
</body>
</html>
