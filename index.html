<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Des applications pour s'entraîner en Physique-Chimie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* ============================================================
   Données communes aux trois propositions de design :
   liste des matières et des applications du portail.
   ============================================================ */
window.MATIERES = [
  {
    id: 'maths', nom: 'Outils mathématiques', couleur: 'maths',
    apps: [
      { titre: 'Puissances de 10', desc: "S'entraîner à utiliser les puissances de 10, indispensables pour les conversions.", dossier: 'puissances-10' },
      { titre: 'Conversions', desc: 'Réaliser facilement des conversions en utilisant les puissances de 10.', dossier: 'conversions' },
      { titre: 'Équations en physique', desc: 'Manipuler les équations pour exprimer une grandeur en fonction des autres.', dossier: 'equations-en-physique' },
      { titre: 'Équations en physique (avec aide)', desc: 'Même entraînement, avec blocage et explication de la règle en cas de déplacement incorrect.', dossier: 'equations-en-physique-avec-aide' },
      { titre: 'Proportionnalité', desc: 'Reconnaître une situation de proportionnalité, la calculer et la lire sur un graphique.', dossier: 'proportionnalite' }
    ]
  },
  {
    id: 'chimie', nom: 'Chimie', couleur: 'chimie',
    apps: [
      { titre: 'Oxydoréduction', desc: "Apprendre à écrire les réactions d'oxydoréduction.", dossier: 'oxydoreduction-STI2D', niveau: 'Terminale STI2D' },
      { titre: "Schéma d'une pile", desc: "Compléter le schéma et le fonctionnement d'une pile électrochimique.", dossier: 'pile' }
    ]
  },
  {
    id: 'physique', nom: 'Physique', couleur: 'physique',
    apps: [
      { titre: 'Désintégration radioactive', desc: 'Simulation interactive de la loi de décroissance radioactive.', dossier: 'decroissance-radioactive' }
    ]
  },
  {
    id: 'college', nom: 'Collège', couleur: 'college',
    apps: [
      { titre: 'Équations du 1er degré', desc: 'Résoudre des équations étape par étape, avec progression sauvegardée.', dossier: 'equations-college' },
      { titre: 'Fractions', desc: 'Simplifier, multiplier, diviser, additionner et soustraire des fractions.', dossier: 'fractions-college' }
    ]
  }
];

/* Générateur pseudo-aléatoire reproductible (mêmes images à chaque chargement) */
window.graine = function (seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
};
</script>
<style>
  /* ============================================================
     PORTAIL — design « Chambre à bulles »
     Grand bandeau d'accueil : traces de particules chargées dans
     un champ magnétique (dessinées en points, comme sur les
     clichés de chambre à bulles). L'image descend moins vite que
     la page, puis une feuille blanche vient la recouvrir.
     ============================================================ */
  :root {
    --paper: #f3f1ec;
    --sheet: #ffffff;
    --ink: #16181d;
    --ink-2: #55585f;
    --ink-3: #8d8f94;
    --line: #ebe8e2;

    --maths: #2952c8;
    --chimie: #0a7d57;
    --physique: #5a3fc4;
    --college: #c2570c;

    --font: 'Hanken Grotesk', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--paper); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .wrap { max-width: 1160px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }

  /* ---------- Boîte à parallaxe générique ---------- */
  .plx { position: relative; overflow: hidden; }
  .plx canvas { position: absolute; left: 0; width: 100%; display: block; will-change: transform; }

  /* ---------- Bandeau d'accueil ---------- */
  .hero { height: clamp(560px, 92vh, 880px); display: flex; flex-direction: column; }
  /* Sur smartphone : image moins haute pour que la suite de la page arrive plus vite */
  @media (max-width: 760px) { .hero { height: clamp(400px, 60svh, 520px); } .hero-text { padding-bottom: 48px; } }
  .hero::after {
    /* voile pour garantir la lisibilité du titre */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(243,241,236,.97) 0%, rgba(243,241,236,.85) 32%, rgba(243,241,236,0) 68%),
      linear-gradient(0deg, rgba(243,241,236,.9) 0%, rgba(243,241,236,0) 30%);
  }
  .hero > .wrap { position: relative; z-index: 1; width: 100%; }
  .nav { display: flex; align-items: center; height: 72px; gap: 8px; }
  .brand { font-weight: 800; letter-spacing: -.02em; font-size: 1.05rem; color: var(--ink); text-decoration: none; margin-right: auto; }
  .nav a.lien { color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: .95rem; padding: 8px 12px; border-radius: 999px; transition: background .15s; }
  .nav a.lien:hover { background: rgba(22,24,29,.06); color: var(--ink); }
  @media (max-width: 760px) { .nav a.lien { display: none; } }

  .hero-text { margin-top: auto; padding-bottom: clamp(56px, 9vh, 96px); }
  .hero h1 { margin: 0; font-size: clamp(3rem, 10vw, 7.5rem); line-height: .92; letter-spacing: -.05em; font-weight: 800; }
  .hero .lead { margin: 22px 0 0; font-size: clamp(1.05rem, 2vw, 1.3rem); color: var(--ink-2); max-width: 32ch; }
  .legende { position: absolute; z-index: 1; right: 16px; bottom: 16px; font-size: .78rem; color: var(--ink-3); max-width: 60%; text-align: right; }
  @media (max-width: 760px) { .legende { display: none; } }

  /* ---------- Feuille de contenu qui recouvre l'image ---------- */
  .sheet { position: relative; z-index: 2; background: var(--sheet); border-radius: 28px 28px 0 0; margin-top: -28px; padding-top: clamp(40px, 7vw, 80px); }

  .subject { display: grid; grid-template-columns: 300px 1fr; gap: 32px; padding: 40px 0; border-top: 1px solid var(--line); }
  .subject:first-child { border-top: none; padding-top: 0; }
  .subject-side { position: sticky; top: 24px; align-self: start; }
  .subject-side .idx { font-size: .85rem; font-weight: 600; color: var(--c); font-variant-numeric: tabular-nums; }
  .subject-side h2 { margin: 6px 0 6px; font-size: clamp(1.6rem, 3.4vw, 2.3rem); line-height: 1.05; letter-spacing: -.035em; font-weight: 800; }
  .subject-side .count { color: var(--ink-3); font-size: .95rem; }
  @media (max-width: 820px) {
    .subject { grid-template-columns: 1fr; gap: 18px; padding: 32px 0; }
    .subject-side { position: static; }
  }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px;
    padding: 22px 24px; border-radius: 20px; background: var(--paper);
    text-decoration: none; color: inherit; transition: background .2s;
  }
  .item:hover { background: color-mix(in srgb, var(--c) 8%, var(--paper)); }
  .item:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
  .item h3 { margin: 0; font-size: clamp(1.15rem, 2.2vw, 1.4rem); letter-spacing: -.02em; font-weight: 700; line-height: 1.2; }
  .item p { margin: 6px 0 0; color: var(--ink-2); font-size: .98rem; max-width: 56ch; }
  .item .tag { display: inline-block; margin-left: 8px; vertical-align: 3px; font-size: .72rem; font-weight: 700; letter-spacing: .02em; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 35%, white); padding: 2px 8px; border-radius: 999px; }
  .rond {
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    background: var(--sheet); color: var(--ink); transition: background .2s, color .2s, transform .2s;
  }
  .rond svg { width: 18px; height: 18px; }
  .item:hover .rond { background: var(--c); color: #fff; transform: rotate(-45deg); }
  @media (max-width: 520px) { .item { padding: 18px; gap: 12px; } .rond { width: 38px; height: 38px; } }


  footer { background: var(--sheet); color: var(--ink-3); font-size: .88rem; padding: 0 0 48px; }
  footer .foot { border-top: 1px solid var(--line); padding-top: 20px; }
</style>
</head>
<body>

<!-- ====== Bandeau d'accueil avec image en parallaxe ====== -->
<header class="hero plx" data-graine="7">
  <canvas aria-hidden="true"></canvas>
  <div class="wrap">
    <nav class="nav" id="nav"><a class="brand" href="#">Physique-Chimie</a></nav>
  </div>
  <div class="wrap hero-text">
    <h1>Physique<br>Chimie</h1>
    <p class="lead">Applications d'entraînement, niveau lycée, de la seconde à la terminale.</p>
  </div>
  <p class="legende">Traces de particules chargées dans une chambre à bulles.</p>
</header>

<!-- ====== Feuille de contenu ====== -->
<main class="sheet">
  <div class="wrap" id="subjects"></div>

</main>

<footer><div class="wrap"><div class="foot">Applications d'entraînement en Physique-Chimie · Niveau lycée</div></div></footer>

<script>
  /* ---------- Construction du portail ---------- */
  const fleche = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  document.getElementById('subjects').innerHTML = MATIERES.map((m, i) => `
    <section class="subject" id="${m.id}" style="--c: var(--${m.couleur})">
      <div class="subject-side">
        <div class="idx">${String(i + 1).padStart(2, '0')}</div>
        <h2>${m.nom}</h2>
        <div class="count">${m.apps.length} activité${m.apps.length > 1 ? 's' : ''}</div>
      </div>
      <div class="list">
        ${m.apps.map(a => `
          <a class="item" href="./${a.dossier}/index.html">
            <div>
              <h3>${a.titre}${a.niveau ? `<span class="tag">${a.niveau}</span>` : ''}</h3>
              <p>${a.desc}</p>
            </div>
            <span class="rond">${fleche}</span>
          </a>`).join('')}
      </div>
    </section>`).join('');
  document.getElementById('nav').insertAdjacentHTML('beforeend',
    MATIERES.map(m => `<a class="lien" href="#${m.id}">${m.nom}</a>`).join(''));

  /* ---------- Image : cliché de chambre à bulles ----------
     Chaque trace est une suite de petites bulles. Une particule chargée
     décrit un arc de cercle ; en perdant de l'énergie son rayon diminue,
     d'où les spirales (électrons). */
  function chambre(canvas, seed) {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const rnd = graine(seed);
    const E = Math.max(w, h) / 1400;           // échelle des motifs

    ctx.fillStyle = '#f3f1ec'; ctx.fillRect(0, 0, w, h);

    // Repères (croix) gravés sur la fenêtre de la chambre
    ctx.strokeStyle = 'rgba(22,24,29,.12)'; ctx.lineWidth = 1;
    const pasCroix = 190 * E;
    for (let x = pasCroix / 2; x < w; x += pasCroix) for (let y = pasCroix / 2; y < h; y += pasCroix) {
      ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5); ctx.stroke();
    }

    // Trace d'une particule : k = courbure (rad/px), perte = croissance de k à chaque pas
    function trace(x, y, a, k, perte, longueur, taille, alpha) {
      const pas = 2.1 * E;
      ctx.fillStyle = `rgba(22,24,29,${alpha})`;
      for (let s = 0; s < longueur; s += pas) {
        x += Math.cos(a) * pas; y += Math.sin(a) * pas;
        a += k * pas; k *= perte;
        if (rnd() < .6) {
          ctx.beginPath();
          ctx.arc(x + (rnd() - .5) * .9, y + (rnd() - .5) * .9, taille * (.55 + rnd() * .7), 0, 7);
          ctx.fill();
        }
        if (Math.abs(k) > .5 / E || x < -300 || x > w + 300 || y < -300 || y > h + 300) break;
      }
      return { x, y, a };
    }
    const signe = () => (rnd() < .5 ? -1 : 1);

    // Faisceau incident : traces presque rectilignes venant de la gauche
    const nFaisceau = 9;
    for (let i = 0; i < nFaisceau; i++) {
      const y0 = h * (.08 + .86 * (i + rnd() * .6) / nFaisceau);
      const a0 = (rnd() - .5) * .04;
      const k0 = signe() * 2e-5 / E;
      const interaction = rnd() < .6;
      const L = interaction ? w * (.35 + rnd() * .55) : w * 1.3;
      const fin = trace(-40, y0, a0, k0, 1, L, 1.05 * E + .35, .55);

      if (interaction) {
        // Vertex d'interaction : gerbe de particules secondaires
        const n = 2 + Math.floor(rnd() * 4);
        for (let j = 0; j < n; j++) {
          trace(fin.x, fin.y, fin.a + (rnd() - .5) * 1.6, signe() * (4e-4 + rnd() * 2.2e-3) / E,
                1 + rnd() * .0025, (300 + rnd() * 900) * E, .95 * E + .35, .5);
        }
      }
      // Électrons arrachés (rayons delta) : petites spirales serrées
      if (rnd() < .7) {
        const px = w * (.1 + rnd() * .7), py = y0 + Math.tan(a0) * px;
        trace(px, py, rnd() * 6.28, signe() * (.01 + rnd() * .02) / E, 1.006, 700 * E, .8 * E + .3, .45);
      }
    }

    // Désintégrations « en V » d'une particule neutre (aucune trace incidente)
    for (let i = 0; i < 3; i++) {
      const vx = w * (.45 + rnd() * .5), vy = h * (.15 + rnd() * .7), a = (rnd() - .5) * .8;
      trace(vx, vy, a - .25, 1.2e-3 / E, 1.001, 700 * E, .95 * E + .35, .5);
      trace(vx, vy, a + .25, -1.4e-3 / E, 1.001, 650 * E, .95 * E + .35, .5);
    }

    // Quelques grandes spirales isolées
    for (let i = 0; i < 4; i++) {
      trace(w * (.3 + rnd() * .7), h * rnd(), rnd() * 6.28, signe() * (.003 + rnd() * .004) / E,
            1.0035, 2600 * E, .85 * E + .3, .42);
    }
  }

  /* ---------- Parallaxe : l'image descend à 60 % de la vitesse du scroll ---------- */
  const F = 0.4;                                   // retard de l'image
  const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const boites = [...document.querySelectorAll('.plx')];

  function dimensionner() {
    boites.forEach(b => {
      const cv = b.querySelector('canvas');
      const hb = b.offsetHeight;
      const hautMax = Math.min(b.getBoundingClientRect().top + scrollY, innerHeight);   // position la plus basse où la boîte est visible
      const f = reduit ? 0 : F;
      cv.style.top = (-f * hautMax) + 'px';
      cv.style.height = (hb + f * (hautMax + hb)) + 'px';
      chambre(cv, +b.dataset.graine);
    });
    deplacer();
  }
  function deplacer() {
    if (reduit) return;
    boites.forEach(b => {
      const r = b.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight) return;       // hors écran : rien à faire
      b.querySelector('canvas').style.transform = `translate3d(0, ${-r.top * F}px, 0)`;
    });
  }

  dimensionner();
  let attente = false;
  addEventListener('scroll', () => {
    if (!attente) { attente = true; requestAnimationFrame(() => { deplacer(); attente = false; }); }
  }, { passive: true });
  let minuterie, largeur = innerWidth;
  addEventListener('resize', () => {
    clearTimeout(minuterie);
    // sur mobile, la barre d'adresse change la hauteur : on ne redessine que si la largeur change
    minuterie = setTimeout(() => { if (innerWidth !== largeur) { largeur = innerWidth; dimensionner(); } else deplacer(); }, 200);
  });
  document.fonts && document.fonts.ready.then(dimensionner);
</script>
</body>
</html>
