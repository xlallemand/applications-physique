<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Des applications pour s'entraîner en Physique-Chimie</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ============================================================
   Portail — styles de base (après assets/theme.css)
   - couleurs de domaine (--c, --c-ink, --c-bg) sur .d-physique, .d-chimie, .d-maths
   - bandeau d'accueil avec image en parallaxe (.hero.plx)
   - feuille blanche qui recouvre l'image (.feuille)
   - pastilles de tri (.puce)
   ============================================================ */

/* Couleur de chaque domaine : mêmes valeurs que data-matiere dans theme.css
   (le thème ne les pose que sur <html>, il faut ici les porter par élément) */
.d-physique { --c: #5a3fc4; --c-ink: #3f2a93; --c-bg: #ebe7f8; }
.d-chimie   { --c: #0a7d57; --c-ink: #075c40; --c-bg: #e2f1ea; }
.d-maths    { --c: #2952c8; --c-ink: #1c3782; --c-bg: #e6ecf9; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--sheet); line-height: 1.5; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
@media (min-width: 760px) { .wrap { padding-left: 32px; padding-right: 32px; } }

/* ---------- Bandeau d'accueil (image en parallaxe) ---------- */
.plx { position: relative; overflow: hidden; }
.plx canvas { position: absolute; left: 0; width: 100%; display: block; will-change: transform; }
.hero { height: clamp(420px, 66vh, 640px); display: flex; flex-direction: column; background: var(--paper); }
.hero::after {
  /* voile pour garantir la lisibilité du titre */
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--paper) 97%, transparent) 0%, color-mix(in srgb, var(--paper) 85%, transparent) 32%, transparent 68%),
    linear-gradient(0deg, color-mix(in srgb, var(--paper) 90%, transparent) 0%, transparent 30%);
}
.hero > .wrap { position: relative; z-index: 1; width: 100%; }
.hero-nav { display: flex; align-items: center; height: 72px; }
.hero-texte { margin-top: auto; padding-bottom: clamp(60px, 9vh, 96px); }
.hero h1 { margin: 0; font-size: clamp(3rem, 9vw, 6.6rem); line-height: .92; letter-spacing: -.05em; font-weight: 800; color: var(--ink); }
.hero .lead { margin: 18px 0 0; font-size: clamp(1.02rem, 2vw, 1.25rem); color: var(--ink-2); max-width: 32ch; }
.legende { position: absolute; z-index: 1; right: 16px; bottom: 40px; margin: 0; font-size: .78rem; color: var(--ink-3); }
@media (max-width: 760px) {
  /* téléphone : image moins haute pour que la liste arrive vite */
  .hero { height: clamp(300px, 46svh, 380px); }
  .hero-nav { height: 60px; }
  .hero-texte { padding-bottom: 48px; }
  .legende { display: none; }
}
@media (prefers-reduced-motion: reduce) { .plx canvas { transform: none !important; } }

/* ---------- Feuille blanche qui recouvre l'image ---------- */
.feuille { position: relative; z-index: 2; background: var(--sheet); border-radius: 28px 28px 0 0; margin-top: -28px; }

/* ---------- Pastilles de tri ---------- */
.puce {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px;
  border: none; border-radius: 999px; background: var(--sheet); color: var(--ink);
  box-shadow: inset 0 0 0 1.5px var(--paper-3);
  font: 700 .86rem/1 var(--font-sans); white-space: nowrap; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  transition: background .15s, box-shadow .15s, color .15s;
}
.puce:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.puce[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
.puce:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
/* pastille de domaine : petit rond de la couleur du domaine, fond teinté quand choisie */
.puce .rond-c { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.puce.d-physique[aria-pressed="true"], .puce.d-chimie[aria-pressed="true"], .puce.d-maths[aria-pressed="true"] {
  background: var(--c-bg); color: var(--c-ink); box-shadow: inset 0 0 0 1.5px var(--c);
}

/* Étiquettes de niveau d'une application */
.niv { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 700; line-height: 1.5;
  background: var(--paper); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.niv.ici { background: var(--c-bg); color: var(--c-ink); }

/* Message quand le tri ne laisse rien */
.vide { padding: 28px 20px; border-radius: 20px; background: var(--paper); text-align: center; color: var(--ink-2); }
.vide p { margin: 0 0 12px; }

.pied { color: var(--ink-3); font-size: .85rem; padding: 32px 0 40px; }
.pied .wrap > div { border-top: 1px solid var(--line); padding-top: 18px; }
</style>
<style>
  /* ============================================================
     PORTAIL — liste des applications
     L'image, puis une barre de tri collée en haut de l'écran
     (domaines, niveaux) et une liste compacte en lignes,
     regroupée par domaine.
     ============================================================ */

  /* ---------- Barre collée en haut pendant le défilement : recherche, puis pastilles de tri ---------- */
  .tri { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--sheet) 94%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 28px 28px 0 0; }
  .tri.colle { border-radius: 0; border-bottom: 1px solid var(--line); }
  .tri .tri-g { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; padding-top: 14px; padding-bottom: 14px; }
  .groupe { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .groupe-lab { flex-shrink: 0; margin-right: 4px; font-size: .68rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  /* icône d'une pastille de type (mêmes signes que le sommaire des applications) */
  .puce .ic { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 3px; border-radius: 6px; background: var(--paper); color: var(--ink-2); font-size: .7rem; font-weight: 800; }
  .puce[aria-pressed="true"] .ic { background: color-mix(in srgb, var(--sheet) 18%, transparent); color: var(--sheet); }
  .sep { flex-shrink: 0; width: 1px; height: 22px; background: var(--paper-3); margin: 0 4px; }
  .compteur { margin-left: auto; font-size: .85rem; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .compteur button { margin-left: 8px; }
  @media (max-width: 760px) {
    /* téléphone : une ligne par groupe, qui défile de côté */
    .tri .tri-g { display: block; padding: 10px 0 4px; }
    .groupe { overflow-x: auto; padding: 0 16px 6px; scrollbar-width: none; }
    .groupe .puce { height: 32px; padding: 0 12px; }
    .groupe::-webkit-scrollbar { display: none; }
    .groupe-lab { display: none; }
    /* le compteur n'apparaît sur téléphone que si un tri est en cours */
    .compteur { display: none; align-items: center; justify-content: space-between; margin: 0 16px 6px; font-size: .8rem; }
    .compteur.trie { display: flex; }
    /* en descendant dans la liste, les pastilles se cachent (la recherche reste) ; elles reviennent dès qu'on remonte */
    .tri.replie .tri-g { display: none; }
    .tri.replie .rch { padding-bottom: 10px; }
  }

  /* ---------- Recherche ---------- */
  .rch { position: relative; padding-top: 18px; }
  .rch-champ { position: relative; display: flex; align-items: center; }
  .rch-champ svg { position: absolute; left: 18px; width: 20px; height: 20px; color: var(--ink-3); pointer-events: none; }
  .rch input {
    width: 100%; height: 54px; padding: 0 52px 0 50px; border: none; border-radius: 999px;
    background: var(--paper); color: var(--ink); font: 600 1.02rem var(--font-sans);
    box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow .15s, background .15s;
    -webkit-appearance: none; appearance: none;
  }
  .rch input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .rch input::placeholder { color: var(--ink-3); font-weight: 500; }
  .rch input:hover { box-shadow: inset 0 0 0 1.5px var(--paper-3); }
  .rch input:focus { outline: none; background: var(--sheet); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .rch-effacer { position: absolute; right: 8px; width: 38px; height: 38px; border: none; border-radius: 50%; background: transparent; color: var(--ink-2);
    font: 700 1.2rem/1 var(--font-sans); cursor: pointer; touch-action: manipulation; }
  .rch-effacer:hover { background: var(--paper-2); }
  /* liste déroulante : idées de recherche (champ vide) ou suggestions */
  .rch-liste { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); background: var(--sheet); border: 1px solid var(--line-strong);
    border-radius: 22px; padding: 8px; max-height: min(60vh, 460px); overflow-y: auto; overscroll-behavior: contain; }
  @media (min-width: 760px) { .rch-liste { left: 32px; right: 32px; } }
  @media (max-width: 760px) { .rch-liste { left: 16px; right: 16px; } }
  .rch-titre { margin: 6px 10px; font-size: .68rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  .rch-idees { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 6px 6px; }
  .sug { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border: none; border-radius: 14px; background: none;
    color: var(--ink); text-align: left; text-decoration: none; font-family: var(--font-sans); cursor: pointer; }
  .sug:hover, .sug.sel { background: var(--paper); }
  .sug-ic { flex-shrink: 0; min-width: 34px; height: 34px; padding: 0 5px; border-radius: 10px; display: grid; place-items: center; background: var(--c-bg); color: var(--c-ink); font: 800 .82rem/1 var(--font-sans); }
  .sug-c { min-width: 0; flex: 1; }
  .sug-c b { display: block; font-size: .95rem; font-weight: 700; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sug-c small { display: block; font-size: .8rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sug-tout { justify-content: center; font-weight: 700; font-size: .88rem; color: var(--ink-2); }
  .rch-rien { margin: 8px 10px 10px; color: var(--ink-2); font-size: .9rem; }
  /* mots cherchés mis en valeur */
  .sug mark, .res mark, .app mark { background: var(--c-bg); color: var(--c-ink); border-radius: 3px; padding: 0 1px; }
  @media (max-width: 760px) {
    .rch { padding-top: 10px; }
    .rch input { height: 46px; font-size: 1rem; padding-left: 46px; }
    .rch-champ svg { left: 15px; }
  }

  /* ---------- Liste ---------- */
  #liste { padding-top: 14px; padding-bottom: 8px; }
  .dom { padding: 16px 0 10px; scroll-margin-top: 230px; }
  .dom-t { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; padding: 0 4px; }
  .dom-t h2 { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -.03em; color: var(--c-ink); }
  .dom-t span { font-size: .85rem; font-weight: 600; color: var(--ink-3); }
  .lignes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 760px) { .lignes { grid-template-columns: minmax(0, 1fr); gap: 6px; } .dom-t h2 { font-size: 1.15rem; } }

  .app {
    display: flex; align-items: center; gap: 14px; padding: 13px 14px 13px 18px; border-radius: 18px;
    background: var(--paper); color: var(--ink); text-decoration: none; position: relative;
    transition: background .15s;
  }
  .app::before { content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: var(--c); }
  .app:hover { background: var(--paper-2); }
  .app:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
  .app-c { flex: 1; min-width: 0; }
  .app-t { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .app .niv { background: var(--sheet); }
  .app-t b { font-size: 1.02rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; margin-right: 2px; }
  .app-d { margin: 3px 0 0; font-size: .86rem; color: var(--ink-2); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-f { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--sheet); color: var(--ink); transition: background .15s, color .15s; }
  .app-f svg { width: 16px; height: 16px; }
  /* avancement de l'application (x/y), comme les compteurs de l'accueil de l'application */
  .app-n { flex-shrink: 0; font-size: .78rem; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .app:hover .app-f { background: var(--c); color: #fff; }
  @media (max-width: 640px) { .app-d { display: none; } .app { padding: 11px 10px 11px 16px; } .app-f { width: 32px; height: 32px; } }
  /* étiquette « Application entière » quand un type est choisi */
  .ent { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 700; line-height: 1.5; background: var(--ink); color: var(--sheet); white-space: nowrap; }

  /* ---------- Application dont seuls certains modules ou pages répondent : carte avec sous-lignes ---------- */
  .lignes { align-items: start; }
  .grp { border-radius: 18px; background: var(--paper); padding: 12px 8px 8px 18px; position: relative; min-width: 0; }
  .grp::before { content: ''; position: absolute; left: 0; top: 16px; width: 4px; height: 24px; border-radius: 0 4px 4px 0; background: var(--c); }
  .grp-t { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 2px 6px 8px 0; color: var(--ink); text-decoration: none; }
  .grp-t b { font-size: .92rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.3; }
  .grp-t:hover b { text-decoration: underline; }
  .grp-t .app-n { margin-left: auto; }
  .grp .niv { background: var(--sheet); }
  .res { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 14px; background: var(--sheet); color: var(--ink); text-decoration: none; margin-top: 4px; transition: background .15s; }
  .res:hover { background: var(--paper-2); }
  .res:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
  .res-ic { flex-shrink: 0; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 9px; display: grid; place-items: center; background: var(--c-bg); color: var(--c-ink); font: 800 .78rem/1 var(--font-sans); }
  .res-c { flex: 1; min-width: 0; }
  .res-c b { display: block; font-size: .93rem; font-weight: 700; line-height: 1.3; }
  .res-c small { display: block; font-size: .8rem; color: var(--ink-3); line-height: 1.35; }
  .res .app-f { width: 30px; height: 30px; background: var(--paper); }
  .res:hover .app-f { background: var(--c); color: #fff; }
</style>
<link rel="stylesheet" href="assets/progression.css">
<link rel="stylesheet" href="assets/revisions.css">
</head>
<body>

<!-- ====== Bandeau d'accueil avec image en parallaxe ====== -->
<header class="hero plx" data-graine="7">
  <canvas aria-hidden="true"></canvas>
  <div class="wrap"><nav class="hero-nav">
    <!-- Révisions (flashcards) : nombre de cartes à réviser aujourd'hui, assets/revisions.js -->
    <a class="btn-small rev-nav" id="rev-nav" href="revisions.html">Révisions</a>
    <!-- Enregistrer / reprendre la progression : assets/progression.js -->
    <div class="prog-actions">
      <button type="button" class="btn-small" id="prog-enregistrer">Enregistrer ma progression</button>
      <button type="button" class="btn-small" id="prog-reprendre">Reprendre depuis un fichier</button>
      <input type="file" id="prog-fichier" class="prog-cache" accept=".html,.htm,text/html" tabindex="-1" aria-hidden="true">
    </div>
  </nav></div>
  <div class="wrap hero-texte">
    <h1>Physique<br>Chimie</h1>
    <p class="lead">Applications d'entraînement, niveau lycée, de la seconde à la terminale.</p>
  </div>
  <p class="legende">Traces de particules chargées dans une chambre à bulles.</p>
</header>

<!-- ====== Feuille de contenu ====== -->
<main class="feuille">
  <!-- carte du jour, seulement quand des flashcards sont à réviser (assets/revisions.js) -->
  <div class="wrap rev-portail" id="rev-portail" hidden></div>
  <!-- barre collée en haut : recherche (assets/recherche-index.js), puis pastilles de tri -->
  <div class="tri" id="tri">
    <div class="wrap rch" id="rch">
      <div class="rch-champ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input type="search" id="q" autocomplete="off" spellcheck="false" enterkeyhint="search" placeholder="Cherche une notion, un chapitre, un simulateur…"
               role="combobox" aria-expanded="false" aria-controls="rch-liste" aria-autocomplete="list" aria-label="Rechercher dans les applications">
        <button type="button" class="rch-effacer" id="effacer" aria-label="Effacer la recherche" hidden>×</button>
      </div>
      <div class="rch-liste" id="rch-liste" role="listbox" aria-label="Suggestions" hidden></div>
    </div>
    <div class="wrap tri-g" id="tri-g">
      <div class="groupe" role="group" aria-label="Domaine" id="g-dom"></div>
      <div class="groupe" role="group" aria-label="Niveau" id="g-niv"></div>
      <div class="groupe" role="group" aria-label="Type" id="g-typ"></div>
      <div class="compteur" id="compteur" aria-live="polite"></div>
    </div>
  </div>
  <div class="wrap" id="liste"></div>
</main>

<footer class="pied"><div class="wrap"><div>Applications d'entraînement en Physique-Chimie · Niveau lycée</div></div></footer>

<script src="assets/avancement.js"></script>
<!-- index des modules et des pages de toutes les applications (généré : docs/outils/index-recherche.py) -->
<script src="assets/recherche-index.js"></script>
<script>
/* ============================================================
   Portail — données et fonctions
   ------------------------------------------------------------
   ACC.DOMAINES  liste des domaines (Physique, Chimie, Outils mathématiques ; pastille : false = pas de pastille de tri)
   ACC.NIVEAUX   liste des niveaux (Collège, 2de, 1re spé, Tle spé, Tle STI2D)
   ACC.APPS      liste des applications avec leurs étiquettes et leurs mots-clés de recherche (mots)
   ACC.TYPES     pastilles de type : Manipuler (simulateurs, animations, ateliers), Fiches
   ACC.CATS      libellé de chaque type de page (simulateur, animation, atelier, activite, cours, exercices, fiche)
   ACC.IDEES     idées de recherche proposées quand le champ est vide
   ACC.filtre    état du tri : { dom: Set, niv: Set, typ: Set } (ensemble vide = tout afficher)
   ACC.basculer(groupe, id)   ajoute / retire une étiquette du tri
   ACC.toutAfficher(groupe)   vide le tri d'un groupe (ou tout, recherche comprise)
   ACC.chercher(texte)        change le texte cherché ; ACC.requete() le rend
   ACC.visible(app)           l'application passe-t-elle le tri par domaine et niveau ?
   ACC.rangees()              résultats repliés (voir plus bas), avec leur score de recherche ;
                              une ligne « application » porte aussi ses modules et pages qui répondent
                              par leurs propres textes (details), pour les suggestions
   ACC.mots()                 mots de la recherche (sans accents) ; ACC.norm(texte) : texte sans accents
   ACC.surChangement(fn)      fn() est appelée à chaque changement du tri ou de la recherche
   ACC.chambre(canvas, graine) dessine le cliché de chambre à bulles
   ACC.parallaxe()            met en place l'image qui descend moins vite que la page
   ACC.rafraichir()           redessine la liste (avancement x/y à jour) ; posée par le script de la liste

   Principe du tri : par défaut aucune étiquette n'est choisie et tout
   est affiché ; choisir une étiquette ne garde que les applications qui
   la portent, en choisir d'autres les ajoute. Les groupes (domaine,
   niveau, type) et la recherche se combinent.

   Pages de chaque application : assets/recherche-index.js (objet RECH,
   généré par docs/outils/index-recherche.py à partir des PLAN).
   Résultats repliés : on garde les pages qui passent le domaine, le
   niveau, le type et la recherche ; si toutes les pages d'une
   application sont gardées → une ligne « application » ; sinon, si
   toutes les pages d'un module (au moins deux) le sont → une ligne
   « module » (ouvre l'accueil de l'application, module déplié :
   index.html#module-N) ; sinon une ligne par page. Les fiches ne
   comptent que si la pastille Fiches est choisie.
   ============================================================ */
(function () {
  'use strict';

  const DOMAINES = [
    { id: 'physique', nom: 'Physique', court: 'Physique' },
    { id: 'chimie', nom: 'Chimie', court: 'Chimie' },
    { id: 'maths', nom: 'Outils mathématiques', court: 'Outils maths' }
  ];

  // court : étiquette des pastilles ; abr : en-tête de colonne étroite
  const NIVEAUX = [
    { id: 'col', nom: 'Collège', court: 'Collège', abr: 'Coll.' },
    { id: '2de', nom: 'Seconde', court: '2de', abr: '2de' },
    { id: '1re', nom: 'Première spécialité', court: '1re spé', abr: '1re spé' },
    { id: 'spe', nom: 'Terminale spécialité', court: 'Tle spé', abr: 'Spé' },
    { id: 'sti', nom: 'Terminale STI2D', court: 'Tle STI2D', abr: 'STI2D' }
  ];

  // Lycée complet (outils mathématiques)
  const LYCEE = ['2de', '1re', 'spe', 'sti'];

  const APPS = [
    // ---- Physique ----
    { titre: 'Désintégration radioactive', dom: 'physique', niv: ['spe'], dossier: 'decroissance-radioactive',

      mots: ['équation', 'inconnue', 'résoudre'] },

  ];

  // Libellé de chaque type de page (index de recherche), et pastilles de type
  const CATS = {
    simulateur: 'Simulateur', animation: 'Animation', atelier: 'Atelier', activite: 'Activité documentaire',
    cours: 'Cours', exercices: 'Exercices', fiche: 'Fiche récapitulative'
  };
  const TYPES = [
    { id: 'manipuler', nom: 'Manipuler', ic: '▸', cats: ['simulateur', 'animation', 'atelier'] },
    { id: 'fiche', nom: 'Fiches', ic: '≡', cats: ['fiche'] }
  ];
  // Idées de recherche (champ vide)
  const IDEES = ['simulateur', 'demi-vie', 'oscilloscope', 'tableau d\'avancement', 'conversions', 'pH'];

  /* ---------- Tri : afficher / masquer ---------- */
  const filtre = { dom: new Set(), niv: new Set(), typ: new Set() };
  let requete = '';
  const abonnes = [];
  const prevenir = () => abonnes.forEach(fn => fn());

  function basculer(groupe, id) {
    const s = filtre[groupe];
    if (s.has(id)) s.delete(id); else s.add(id);
    // toutes les étiquettes choisies = aucune : on revient à « Tous »
    // (pas pour le type : Manipuler + Fiches ne couvrent pas toutes les pages)
    const total = groupe === 'dom' ? DOMAINES.filter(d => d.pastille !== false).length : groupe === 'niv' ? NIVEAUX.length : Infinity;
    if (s.size === total) s.clear();
    prevenir();
  }
  function toutAfficher(groupe) {
    if (groupe) filtre[groupe].clear(); else { filtre.dom.clear(); filtre.niv.clear(); filtre.typ.clear(); requete = ''; }
    prevenir();
  }
  function chercher(texte) { requete = texte; prevenir(); }
  function visible(app) {
    const okDom = !filtre.dom.size || filtre.dom.has(app.dom);
    const okNiv = !filtre.niv.size || app.niv.some(n => filtre.niv.has(n));
    return okDom && okNiv;
  }
  // Une étiquette est « allumée » quand elle est choisie ; « Tous » quand le groupe est vide
  const choisi = (groupe, id) => filtre[groupe].has(id);
  const actif = () => filtre.dom.size > 0 || filtre.niv.size > 0 || filtre.typ.size > 0 || mots().length > 0;

  /* ---------- Recherche : texte sans accents ni indices (H₃O⁺ → h3o+), découpé en mots ---------- */
  const norm = s => (s || '').normalize('NFKD').toLowerCase().replace(/[̀-ͯ]/g, '')
    .replace(/œ/g, 'oe').replace(/æ/g, 'ae').replace(/[^a-z0-9+]+/g, ' ').trim();
  const mots = () => norm(requete).split(' ').filter(Boolean);

  /* ---------- Pages de chaque application (index RECH) ----------
     app.pages : { app, mod, k, ty, l, c, d } ; une application sans PLAN
     (ou absente de l'index) a une seule page, l'application elle-même. */
  const RECH = window.RECH || {};
  APPS.forEach(a => {
    const r = RECH[a.dossier];
    a.mods = r && r.m ? r.m.map(m => Object.assign({ app: a }, m)) : [];
    a.pages = [];
    if (!a.mods.length) a.pages.push({ app: a, mod: null, k: null, ty: 'seul', l: a.titre, c: (r && r.seul) || 'exercices', d: '' });
    a.mods.forEach(m => m.p.forEach(p => a.pages.push(Object.assign({ app: a, mod: m }, p))));
    // textes cherchés, sans accents (poids : titre > mots-clés > description)
    a.rTitre = norm(a.titre); a.rMots = norm((a.mots || []).join(' ')); a.rDesc = norm(a.desc);
    a.mods.forEach(m => { m.rTitre = norm(m.t); m.rDesc = norm(m.d); });
    a.pages.forEach(p => {
      p.rTitre = p.mod ? norm(p.l) : '';
      p.rDesc = norm(p.d);
      // le type est cherché aussi : « simulateur », « atelier », « fiche », « manipuler »…
      p.rType = norm(CATS[p.c] + (TYPES[0].cats.includes(p.c) ? ' manipuler' : ''));
    });
  });

  // Un mot de la recherche est trouvé s'il commence un mot du texte (ou s'y trouve, à partir de 4 lettres) ;
  // un mot d'une ou deux lettres doit être un mot entier (« ph » ne trouve pas « physique »)
  function trouve(texte, mot) {
    if (!texte) return 0;
    if (mot.length <= 2) return (' ' + texte + ' ').includes(' ' + mot + ' ') ? 1 : 0;
    if ((' ' + texte).includes(' ' + mot)) return 1;
    return mot.length >= 4 && texte.includes(mot) ? .6 : 0;
  }
  // Score d'une page : chaque mot doit être trouvé dans la page, son module ou son application
  function scorePage(p, ms) {
    const a = p.app, m = p.mod;
    let total = 0;
    for (const w of ms) {
      const s = Math.max(
        3 * trouve(p.rTitre, w), 2 * trouve(p.rType, w), .8 * trouve(p.rDesc, w),
        m ? Math.max(2.5 * trouve(m.rTitre, w), trouve(m.rDesc, w)) : 0,
        2.5 * trouve(a.rTitre, w), 2 * trouve(a.rMots, w), trouve(a.rDesc, w));
      if (!s) return 0;
      total += s;
    }
    return total;
  }
  // Score d'une application ou d'un module pour ses propres textes (classement des suggestions)
  // complet : 0 si un mot manque dans ces textes
  function scorePropre(textes, ms, complet) {
    let t = 0;
    for (const w of ms) {
      const s = Math.max(...textes.map(([x, k]) => k * trouve(x, w)));
      if (!s && complet) return 0;
      t += s;
    }
    return t;
  }
  // Modules et pages qui répondent par leurs propres textes, dans une application retenue en entier :
  // proposés aussi dans les suggestions (« demi-vie » → le module « Demi-vie »)
  function details(a, cand, ms) {
    if (!ms.length) return [];
    const res = [];
    a.mods.forEach(m => {
      const mc = cand.filter(p => p.mod === m);
      const s = scorePropre([[m.rTitre, 3], [m.rDesc, 1.2]], ms, true);
      if (s) res.push({ niveau: 'mod', app: a, mod: m, pages: mc, score: s + .3 });
      else mc.forEach(p => { const sp = scorePropre([[p.rTitre, 3]], ms, true); if (sp) res.push({ niveau: 'page', app: a, mod: m, page: p, score: sp + .2 }); });
    });
    return res;
  }

  /* ---------- Résultats repliés (voir l'en-tête) ----------
     [{ niveau: 'app' | 'mod' | 'page', app, mod, page, pages, score }] dans l'ordre de APPS */
  function rangees() {
    const cats = new Set();
    TYPES.forEach(t => { if (filtre.typ.has(t.id)) t.cats.forEach(c => cats.add(c)); });
    const ms = mots();
    // les fiches comptent avec la pastille Fiches, ou quand la recherche les demande (« fiche pile »)
    const avecFiche = cats.has('fiche') || ms.some(w => trouve('fiche fiches recapitulative', w));
    const res = [];
    APPS.forEach(a => {
      if (!visible(a)) return;
      const cand = a.pages.filter(p => p.c !== 'fiche' || avecFiche);
      const garde = new Map();
      cand.forEach(p => {
        if (cats.size && !cats.has(p.c)) return;
        const s = ms.length ? scorePage(p, ms) : 1;
        if (s) garde.set(p, s);
      });
      if (!garde.size) return;
      if (garde.size === cand.length) {
        res.push({ niveau: 'app', app: a, pages: cand, score: scorePropre([[a.rTitre, 3], [a.rMots, 2.5], [a.rDesc, 1]], ms) + .5, details: details(a, cand, ms) });
        return;
      }
      a.mods.forEach(m => {
        const mc = cand.filter(p => p.mod === m), mg = mc.filter(p => garde.has(p));
        if (!mg.length) return;
        if (mg.length === mc.length && mc.length > 1) res.push({ niveau: 'mod', app: a, mod: m, pages: mg, score: scorePropre([[m.rTitre, 3], [m.rDesc, 1.2]], ms) + .3 });
        else mg.forEach(p => res.push({ niveau: 'page', app: a, mod: m, page: p, score: garde.get(p) }));
      });
    });
    return res;
  }

  /* ---------- Image : cliché de chambre à bulles ----------
     Chaque trace est une suite de petites bulles. Une particule chargée
     décrit un arc de cercle ; en perdant de l'énergie son rayon diminue,
     d'où les spirales (électrons). */
  function graine(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function chambre(canvas, seed) {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const rnd = graine(seed);
    const E = Math.max(w, h) / 1400;           // échelle des motifs
    const css = getComputedStyle(document.documentElement);
    const papier = css.getPropertyValue('--paper').trim() || '#f3f1ec';

    ctx.fillStyle = papier; ctx.fillRect(0, 0, w, h);

    // Repères (croix) gravés sur la fenêtre de la chambre
    ctx.strokeStyle = 'rgba(22,24,29,.12)'; ctx.lineWidth = 1;
    const pasCroix = 190 * E;
    for (let x = pasCroix / 2; x < w; x += pasCroix) for (let y = pasCroix / 2; y < h; y += pasCroix) {
      ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5); ctx.stroke();
    }

    // Trace d'une particule : k = courbure (rad/px), perte = croissance de k à chaque pas
    function trace(x, y, a, k, perte, longueur, taille, alpha) {
      const pas = 2.1 * E;
      ctx.fillStyle = `rgba(22,24,29,${alpha})`;
      for (let s = 0; s < longueur; s += pas) {
        x += Math.cos(a) * pas; y += Math.sin(a) * pas;
        a += k * pas; k *= perte;
        if (rnd() < .6) {
          ctx.beginPath();
          ctx.arc(x + (rnd() - .5) * .9, y + (rnd() - .5) * .9, taille * (.55 + rnd() * .7), 0, 7);
          ctx.fill();
        }
        if (Math.abs(k) > .5 / E || x < -300 || x > w + 300 || y < -300 || y > h + 300) break;
      }
      return { x, y, a };
    }
    const signe = () => (rnd() < .5 ? -1 : 1);

    // Faisceau incident : traces presque rectilignes venant de la gauche
    const nFaisceau = 9;
    for (let i = 0; i < nFaisceau; i++) {
      const y0 = h * (.08 + .86 * (i + rnd() * .6) / nFaisceau);
      const a0 = (rnd() - .5) * .04;
      const k0 = signe() * 2e-5 / E;
      const interaction = rnd() < .6;
      const L = interaction ? w * (.35 + rnd() * .55) : w * 1.3;
      const fin = trace(-40, y0, a0, k0, 1, L, 1.05 * E + .35, .55);

      if (interaction) {
        // Vertex d'interaction : gerbe de particules secondaires
        const n = 2 + Math.floor(rnd() * 4);
        for (let j = 0; j < n; j++) {
          trace(fin.x, fin.y, fin.a + (rnd() - .5) * 1.6, signe() * (4e-4 + rnd() * 2.2e-3) / E,
                1 + rnd() * .0025, (300 + rnd() * 900) * E, .95 * E + .35, .5);
        }
      }
      // Électrons arrachés (rayons delta) : petites spirales serrées
      if (rnd() < .7) {
        const px = w * (.1 + rnd() * .7), py = y0 + Math.tan(a0) * px;
        trace(px, py, rnd() * 6.28, signe() * (.01 + rnd() * .02) / E, 1.006, 700 * E, .8 * E + .3, .45);
      }
    }

    // Désintégrations « en V » d'une particule neutre (aucune trace incidente)
    for (let i = 0; i < 3; i++) {
      const vx = w * (.45 + rnd() * .5), vy = h * (.15 + rnd() * .7), a = (rnd() - .5) * .8;
      trace(vx, vy, a - .25, 1.2e-3 / E, 1.001, 700 * E, .95 * E + .35, .5);
      trace(vx, vy, a + .25, -1.4e-3 / E, 1.001, 650 * E, .95 * E + .35, .5);
    }

    // Quelques grandes spirales isolées
    for (let i = 0; i < 4; i++) {
      trace(w * (.3 + rnd() * .7), h * rnd(), rnd() * 6.28, signe() * (.003 + rnd() * .004) / E,
            1.0035, 2600 * E, .85 * E + .3, .42);
    }
  }

  /* ---------- Parallaxe : l'image descend à 60 % de la vitesse du scroll ---------- */
  function parallaxe() {
    const F = 0.4;                                   // retard de l'image
    const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const boites = [...document.querySelectorAll('.plx')];

    function dimensionner() {
      boites.forEach(b => {
        const cv = b.querySelector('canvas');
        const hb = b.offsetHeight;
        const hautMax = Math.min(b.getBoundingClientRect().top + scrollY, innerHeight);
        const f = reduit ? 0 : F;
        cv.style.top = (-f * hautMax) + 'px';
        cv.style.height = (hb + f * (hautMax + hb)) + 'px';
        chambre(cv, +b.dataset.graine);
      });
      deplacer();
    }
    function deplacer() {
      if (reduit) return;
      boites.forEach(b => {
        const r = b.getBoundingClientRect();
        if (r.bottom < 0 || r.top > innerHeight) return;       // hors écran : rien à faire
        b.querySelector('canvas').style.transform = `translate3d(0, ${-r.top * F}px, 0)`;
      });
    }

    dimensionner();
    let attente = false;
    addEventListener('scroll', () => {
      if (!attente) { attente = true; requestAnimationFrame(() => { deplacer(); attente = false; }); }
    }, { passive: true });
    let minuterie, largeur = innerWidth;
    addEventListener('resize', () => {
      clearTimeout(minuterie);
      // sur mobile, la barre d'adresse change la hauteur : on ne redessine que si la largeur change
      minuterie = setTimeout(() => { if (innerWidth !== largeur) { largeur = innerWidth; dimensionner(); } else deplacer(); }, 200);
    });
    document.fonts && document.fonts.ready.then(dimensionner);
  }

  /* ---------- Petits utilitaires d'affichage ---------- */
  const domaine = id => DOMAINES.find(d => d.id === id);
  const niveau = id => NIVEAUX.find(n => n.id === id);
  const fleche = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;

  // Étiquettes de niveau d'une application : « Lycée » remplace les quatre niveaux du lycée
  function etiquettes(app) {
    const lycee = LYCEE.every(n => app.niv.includes(n));
    const liste = lycee ? [{ texte: 'Lycée', ids: LYCEE }] : [];
    app.niv.filter(n => !lycee || !LYCEE.includes(n)).forEach(n => liste.push({ texte: niveau(n).court, ids: [n] }));
    return liste.map(e => `<span class="niv${e.ids.some(n => filtre.niv.has(n)) ? ' ici' : ''}" title="${e.ids.map(n => niveau(n).nom).join(', ')}">${e.texte}</span>`).join('');
  }

  window.ACC = {
    DOMAINES, NIVEAUX, APPS, TYPES, CATS, IDEES, filtre, basculer, toutAfficher, chercher, visible, choisi, actif,
    rangees, mots, norm, requete: () => requete,
    surChangement: fn => abonnes.push(fn),
    chambre, parallaxe, domaine, niveau, fleche, pluriel, etiquettes
  };
})();
</script>
<script>
/* ============================================================
   Portail — affichage : pastilles, recherche (suggestions), liste
   - pastilles Domaine, Niveau, Type (Manipuler, Fiches)
   - champ de recherche : idées quand il est vide, suggestions pendant
     la frappe (flèches, Entrée, Échap), la liste suit la recherche
   - liste regroupée par domaine : ligne « application », ou carte de
     l'application avec ses modules / pages retenus (ACC.rangees)
   - barre collée en haut ; sur téléphone, les pastilles se cachent
     quand on descend dans la liste et reviennent quand on remonte
   ============================================================ */
(function () {
  'use strict';
  const { DOMAINES, NIVEAUX, APPS, TYPES, CATS } = ACC;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* ---------- Pastilles de tri ---------- */
  function pastilles() {
    document.getElementById('g-dom').innerHTML =
      '<span class="groupe-lab">Domaine</span>' +
      `<button type="button" class="puce" data-g="dom" data-id="" aria-pressed="${!ACC.filtre.dom.size}">Tous</button>` +
      DOMAINES.filter(d => d.pastille !== false).map(d => `<button type="button" class="puce d-${d.id}" data-g="dom" data-id="${d.id}" aria-pressed="${ACC.choisi('dom', d.id)}"><span class="rond-c"></span>${d.court}</button>`).join('');
    document.getElementById('g-niv').innerHTML =
      '<span class="groupe-lab">Niveau</span>' +
      `<button type="button" class="puce" data-g="niv" data-id="" aria-pressed="${!ACC.filtre.niv.size}">Tous</button>` +
      NIVEAUX.map(n => `<button type="button" class="puce" data-g="niv" data-id="${n.id}" aria-pressed="${ACC.choisi('niv', n.id)}" title="${n.nom}">${n.court}</button>`).join('');
    document.getElementById('g-typ').innerHTML =
      '<span class="groupe-lab">Type</span>' +
      `<button type="button" class="puce" data-g="typ" data-id="" aria-pressed="${!ACC.filtre.typ.size}">Tous</button>` +
      TYPES.map((t, i) => (i ? '<span class="sep" aria-hidden="true"></span>' : '') +
        `<button type="button" class="puce" data-g="typ" data-id="${t.id}" aria-pressed="${ACC.choisi('typ', t.id)}" title="${t.cats.map(c => CATS[c]).join(', ')}"><span class="ic" aria-hidden="true">${t.ic}</span>${t.nom}</button>`).join('');
  }
  document.getElementById('tri').addEventListener('click', e => {
    const b = e.target.closest('button[data-g], button[data-tout]');
    if (!b) return;
    if (b.dataset.tout) return ACC.toutAfficher();
    if (b.dataset.id) ACC.basculer(b.dataset.g, b.dataset.id); else ACC.toutAfficher(b.dataset.g);
  });

  /* ---------- Avancement d'une application : x/y (assets/avancement.js) ---------- */
  function avancement(app) {
    const av = window.AV && AV.avancement(app.dossier);
    return av ? `<span class="app-n" title="Avancement : ${av.fait} sur ${av.total}">${av.fait}/${av.total}</span>` : '';
  }

  /* ---------- Mots cherchés mis en valeur (comparaison sans accents, caractère par caractère) ---------- */
  function surligner(texte) {
    const ms = ACC.mots();
    if (!ms.length) return esc(texte);
    const car = [...texte];
    const chaine = car.map(c => (ACC.norm(c) || ' ')[0]).join('');
    const marque = new Array(car.length).fill(false);
    ms.forEach(w => {
      let i = -1;
      while ((i = chaine.indexOf(w, i + 1)) >= 0) {
        if (i === 0 || chaine[i - 1] === ' ' || w.length >= 4) for (let k = i; k < i + w.length; k++) marque[k] = true;
      }
    });
    let html = '', ouvert = false;
    car.forEach((c, k) => {
      if (marque[k] !== ouvert) { html += ouvert ? '</mark>' : '<mark>'; ouvert = marque[k]; }
      html += esc(c);
    });
    return html + (ouvert ? '</mark>' : '');
  }

  /* ---------- Adresses et libellés d'un résultat ---------- */
  const lienApp = a => `./${a.dossier}/index.html`;
  const lienMod = m => `./${m.app.dossier}/index.html#module-${m.n}`;     // accueil de l'application, module déplié
  const lienPage = p => p.mod ? `./${p.app.dossier}/modules/${p.k}.html` : lienApp(p.app);
  const ICONES = { simulateur: '▸', animation: '▸', atelier: '▸', activite: 'A', cours: 'C', exercices: 'Q', fiche: '≡' };
  const ctxPage = p => !p.mod ? '' : p.c === 'fiche' ? `Module ${p.mod.n}` : `Module ${p.mod.n} : ${esc(p.mod.t)}`;
  const typesModule = r => [...new Set(r.pages.map(p => CATS[p.c]))].join(', ');

  /* ---------- Liste regroupée par domaine ---------- */
  function ligneApp(a) {
    const ent = ACC.filtre.typ.size ? '<span class="ent">Application entière</span>' : '';
    return `
      <a class="app" href="${lienApp(a)}">
        <div class="app-c">
          <div class="app-t"><b>${surligner(a.titre)}</b>${ACC.etiquettes(a)}${ent}</div>
          <p class="app-d">${surligner(a.desc)}</p>
        </div>
        ${avancement(a)}
        <span class="app-f">${ACC.fleche}</span>
      </a>`;
  }
  function sousLigne(r) {
    if (r.niveau === 'mod') {
      const m = r.mod;
      return `<a class="res" href="${lienMod(m)}"><span class="res-ic" aria-hidden="true">M${m.n}</span><span class="res-c">
        <b>Module ${m.n} : ${surligner(m.t)}</b><small>Module entier · ${ACC.pluriel(r.pages.length, 'page')} · ${typesModule(r)}</small></span><span class="app-f">${ACC.fleche}</span></a>`;
    }
    const p = r.page, ctx = ctxPage(p);
    return `<a class="res" href="${lienPage(p)}"><span class="res-ic" aria-hidden="true">${ICONES[p.c]}</span><span class="res-c">
      <b>${surligner(p.l)}</b><small>${CATS[p.c]}${ctx ? ' · ' + ctx : ''}</small></span><span class="app-f">${ACC.fleche}</span></a>`;
  }

  function liste() {
    const rs = ACC.rangees();
    const html = DOMAINES.map(d => {
      const dr = rs.filter(r => r.app.dom === d.id);
      if (!dr.length) return '';
      const apps = [...new Set(dr.map(r => r.app))];
      const nApps = dr.filter(r => r.niveau === 'app').length;
      const compte = nApps === dr.length ? ACC.pluriel(nApps, 'application') : ACC.pluriel(dr.length, 'résultat');
      return `
        <section class="dom d-${d.id}" id="${d.id}">
          <div class="dom-t"><h2>${d.nom}</h2><span>${compte}</span></div>
          <div class="lignes">
            ${apps.map(a => {
              const ar = dr.filter(r => r.app === a);
              if (ar[0].niveau === 'app') return ligneApp(a);
              return `<div class="grp"><a class="grp-t" href="${lienApp(a)}"><b>${surligner(a.titre)}</b>${ACC.etiquettes(a)}${avancement(a)}</a>${ar.map(sousLigne).join('')}</div>`;
            }).join('')}
          </div>
        </section>`;
    }).join('');
    document.getElementById('liste').innerHTML = html ||
      `<div class="vide"><p>${ACC.mots().length ? 'Aucun résultat pour cette recherche.' : 'Aucune application pour ce choix.'}</p><button type="button" class="btn-small" id="vider">Tout afficher</button></div>`;
    const v = document.getElementById('vider');
    if (v) v.onclick = () => ACC.toutAfficher();
    // compteur : applications entières, modules, pages (seulement les nombres non nuls)
    const n = k => rs.filter(r => r.niveau === k).length;
    const parts = [[n('app'), 'application'], [n('mod'), 'module'], [n('page'), 'page']].filter(x => x[0]).map(x => ACC.pluriel(x[0], x[1]));
    const c = document.getElementById('compteur');
    c.classList.toggle('trie', ACC.actif());
    c.innerHTML = ACC.actif()
      ? `<span>${parts.join(' + ') || 'Aucun résultat'}</span><button type="button" class="btn-small" data-tout="1">Tout afficher</button>`
      : `${APPS.length} applications`;
  }

  /* ---------- Champ de recherche et suggestions ---------- */
  const champ = document.getElementById('q'), boite = document.getElementById('rch-liste'), effacer = document.getElementById('effacer');
  let sel = -1, sugg = [];

  function fermer() {
    boite.hidden = true; sel = -1;
    champ.setAttribute('aria-expanded', 'false'); champ.removeAttribute('aria-activedescendant');
  }
  function suggestions() {
    const ms = ACC.mots();
    let h;
    if (!ms.length) {
      // champ vide : idées de recherche
      sugg = [];
      h = '<p class="rch-titre">Idées de recherche</p><div class="rch-idees">' +
        ACC.IDEES.map(i => `<button type="button" class="puce" data-idee="${esc(i)}">${esc(i)}</button>`).join('') + '</div>';
    } else {
      // les meilleurs résultats d'abord (même tri par domaine, niveau et type que la liste)
      const rs = ACC.rangees();
      // une application entière peut aussi proposer son module ou sa page la plus précise
      const tous = rs.concat(...rs.map(r => r.details || [])).sort((x, y) => y.score - x.score);
      sugg = tous.slice(0, 7);
      h = !sugg.length ? '<p class="rch-rien">Aucun résultat. Essaie un autre mot (« vitesse », « pile », « simulateur »…).</p>'
        : '<p class="rch-titre">Suggestions</p>' + sugg.map((r, i) => {
          const a = r.app;
          let ic, t, sous, href;
          if (r.niveau === 'app') { ic = 'App'; t = a.titre; sous = 'Application · ' + ACC.domaine(a.dom).nom; href = lienApp(a); }
          else if (r.niveau === 'mod') { ic = 'M' + r.mod.n; t = `Module ${r.mod.n} : ${r.mod.t}`; sous = a.titre; href = lienMod(r.mod); }
          else {
            // page au nom générique (« Cours », « Entraînement »…) : on ajoute le titre de son module
            const p = r.page, generique = p.mod && !/[:·]/.test(p.l) && p.l.length < 14;
            ic = ICONES[p.c]; t = generique ? `${p.l} · ${p.mod.t}` : p.l; sous = CATS[p.c] + ' · ' + a.titre; href = lienPage(p);
          }
          return `<a class="sug d-${a.dom}${i === sel ? ' sel' : ''}" role="option" aria-selected="${i === sel}" id="sug-${i}" href="${href}">` +
            `<span class="sug-ic" aria-hidden="true">${ic}</span><span class="sug-c"><b>${surligner(t)}</b><small>${surligner(sous)}</small></span></a>`;
        }).join('') + (rs.length > sugg.length ? `<button type="button" class="sug sug-tout" data-voir="1">Voir les ${rs.length} résultats dans la liste</button>` : '');
    }
    boite.innerHTML = h;
    boite.hidden = false;
    champ.setAttribute('aria-expanded', 'true');
    if (sel >= 0) champ.setAttribute('aria-activedescendant', 'sug-' + sel); else champ.removeAttribute('aria-activedescendant');
  }
  // Entrée sans suggestion choisie, ou « Voir les … résultats » : on referme et on montre la liste
  function voirListe() {
    fermer();
    champ.blur();                        // téléphone : le clavier se ferme, la liste est visible
  }
  champ.addEventListener('input', () => { sel = -1; effacer.hidden = !champ.value; ACC.chercher(champ.value); suggestions(); });
  champ.addEventListener('focus', () => {
    suggestions();
    // téléphone : la barre de recherche monte en haut de l'écran, pour laisser la place aux suggestions au-dessus du clavier
    const haut = document.getElementById('tri').parentElement.getBoundingClientRect().top;
    if (matchMedia('(max-width: 760px)').matches && haut > 0) scrollTo({ top: scrollY + haut, behavior: 'smooth' });
  });
  champ.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (boite.hidden) return suggestions();
      if (!sugg.length) return;
      e.preventDefault();
      // -1 = aucune suggestion choisie (le texte tapé), puis 0 … n-1
      if (e.key === 'ArrowDown') sel = sel + 1 >= sugg.length ? -1 : sel + 1;
      else sel = sel - 1 < -1 ? sugg.length - 1 : sel - 1;
      suggestions();
      const s = document.getElementById('sug-' + sel);
      if (s) s.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (sel >= 0 && !boite.hidden) document.getElementById('sug-' + sel).click(); else voirListe();
    } else if (e.key === 'Escape') fermer();
  });
  effacer.addEventListener('click', () => { champ.value = ''; effacer.hidden = true; ACC.chercher(''); champ.focus(); suggestions(); });
  boite.addEventListener('mousedown', e => e.preventDefault());        // le champ garde le focus
  boite.addEventListener('click', e => {
    const i = e.target.closest('[data-idee]');
    if (i) { champ.value = i.dataset.idee; effacer.hidden = false; ACC.chercher(champ.value); suggestions(); return; }
    if (e.target.closest('[data-voir]')) voirListe();
  });
  // un appui ailleurs referme la liste déroulante
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#rch')) fermer(); });
  // le champ suit l'état (« Tout afficher » vide aussi la recherche)
  function majChamp() {
    if (champ.value !== ACC.requete()) champ.value = ACC.requete();
    effacer.hidden = !champ.value;
  }

  function maj() { pastilles(); majChamp(); liste(); }
  ACC.surChangement(() => {
    // après un tri ou une recherche, on ramène le haut de la liste sous la barre si on l'avait dépassé
    const tri = document.getElementById('tri');
    const haut = tri.parentElement.getBoundingClientRect().top;
    maj();
    if (haut < 0) scrollTo({ top: scrollY + haut, behavior: 'auto' });
  });
  maj();
  // avancement à jour après une reprise de progression (assets/progression.js)
  ACC.rafraichir = liste;
  // retour arrière depuis une application : la page revient du cache, l'avancement a pu changer
  addEventListener('pageshow', e => { if (e.persisted) { fermer(); liste(); } });

  /* ---------- Barre collée en haut ----------
     - elle perd ses coins arrondis quand elle est collée ;
     - téléphone : les pastilles se cachent quand on descend dans la liste
       et reviennent dès qu'on remonte ; la recherche reste. La hauteur
       retirée est rendue en marge sous la barre : la liste ne saute pas. */
  const tri = document.getElementById('tri'), triG = document.getElementById('tri-g');
  const telephone = matchMedia('(max-width: 760px)');
  let replie = false, dernierY = scrollY;
  function replier(oui) {
    if (oui === replie) return;
    replie = oui;
    if (oui) { tri.style.marginBottom = triG.offsetHeight + 'px'; tri.classList.add('replie'); }
    else { tri.classList.remove('replie'); tri.style.marginBottom = ''; }
  }
  function defiler() {
    const colle = tri.getBoundingClientRect().top <= 0 && tri.parentElement.getBoundingClientRect().top < 0;
    tri.classList.toggle('colle', colle);
    const y = scrollY, dy = y - dernierY;
    if (!telephone.matches || !colle) replier(false);
    else if (dy > 8) replier(true);
    else if (dy < -8) replier(false);
    if (Math.abs(dy) > 8 || !colle) dernierY = y;
  }
  addEventListener('scroll', defiler, { passive: true });
  telephone.addEventListener('change', () => replier(false));
  defiler();

  ACC.parallaxe();
})();
</script>
<script src="assets/revisions.js"></script>
<script>
/* Révisions (assets/revisions.js) : pilule du bandeau et carte du jour,
   mises à jour après une reprise de progression et au retour arrière */
(function () {
  'use strict';
  const maj = () => REV.portail({ pilule: document.getElementById('rev-nav'), carte: document.getElementById('rev-portail'), apps: ACC.APPS });
  maj();
  const liste = ACC.rafraichir;
  ACC.rafraichir = () => { liste(); maj(); };
