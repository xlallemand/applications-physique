<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : le groupe carbonyle — Nomenclature</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="../../assets/orga.css">
<link rel="stylesheet" href="nom.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/orga.js"></script>
<script src="../../assets/orga-dessin.js"></script>
<script src="nom.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · COURS 2 / 5</span>
    <h2 class="er-titre">Le groupe carbonyle</h2>
    <p class="er-contexte">Le groupe <b>carbonyle</b> C=O donne deux familles : les <b>aldéhydes</b> et les <b>cétones</b>. Tout dépend de la place du C=O dans la chaîne.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : le groupe carbonyle C=O ;
   aldéhyde (C=O en bout de chaîne, le C porte un H) et cétone (C=O entre
   deux C). « À toi » : entourer, nommer le groupe, donner la famille ;
   distinguer aldéhyde et cétone en topologique.
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { o, molHTML, video, familles } = NOM;
const groupeLegende = s => ORGA.legendeHTML(ORGA.groupes(NOM.mol(s)));
const ent = (s, ec) => molHTML(s, { ecriture: ec || 'semi', entourer: true, legende: groupeLegende(s) });
// « À toi » : entourer puis nommer le groupe d'une molécule fabriquée
function aToiGroupe(cle, titre) {
  const x = ORGA.fabriqueFamille(cle, { min: 3, max: 6, ramMax: 1 });
  return { titre, parties: [ORGA.partieEntourer(x.mol, { ecriture: hasard(['semi', 'topo']) })].concat(ORGA.partiesNommerGroupes(x.mol)) };
}

function etape1(c) {
  const carte = c.carte('1. Aldéhyde ou cétone ?');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Le groupe carbonyle</b> : C=O (un O lié à un C par une double liaison).</p>
        <ul class="er-liste"><li>C=O <b>en bout de chaîne</b> (le C porte un H) : famille des <b>aldéhydes</b> ;</li>
        <li>C=O <b>entre deux C</b> : famille des <b>cétones</b>.</li></ul>
        <p>On entoure le C et le O (avec le H du C pour un aldéhyde, si on veut).</p></div>
    </div>
    ${exemple(`<div class="nom-mols">${ent('CC=O')}${ent('CCCC(C)=O')}${ent('CCC(C)CC=O', 'topo')}${ent('CC(=O)CC(CC)CC', 'topo')}</div>
      <p>En topologique, un C=O au bout d'un trait est un aldéhyde ; un C=O sur un sommet entre deux traits est une cétone.</p>`)}`);
  const OPTS = [o('aldehyde', 'aldéhyde'), o('cetone', 'cétone')];
  const x = ORGA.fabriqueFamille(hasard(['aldehyde', 'cetone']), { min: 4, max: 6, ramMax: 1 });
  c.aToi(carte, [aToiGroupe('aldehyde', 'Molécule 1'), aToiGroupe('cetone', 'Molécule 2'),
    { titre: 'Aldéhyde ou cétone ?', enonce: NOM.dessin(x.mol, { ecriture: 'topo' }), parties: [{ type: 'choix', q: 'Cette molécule est-elle un aldéhyde ou une cétone ?', options: OPTS, bonne: x.res.famille, melanger: false,
      indice: 'Regarde où est le C=O : au bout d\'un trait (le C porte un H) aldéhyde ; sur un sommet entre deux C, cétone.', solution: `<p>${x.res.famille === 'aldehyde' ? 'C=O au bout de la chaîne : <b>aldéhyde</b>.' : 'C=O entre deux C : <b>cétone</b>.'}</p>` }] }]);
  return carte;
}
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle">${familles(['aldehyde', 'cetone'])}</div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_3c_cours.html">Cours : acides carboxyliques, esters, amides →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_3.html#carbonyle">Fiche récapitulative</a></div>`);
  return carte;
}
new COURS.Cours(document.getElementById('etapes'), [etape1, aRetenir]);
NOM.menu('module_3b_cours');
</script>
</body>
</html>
