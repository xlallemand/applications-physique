<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : acides carboxyliques, esters, amides — Nomenclature</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="../../assets/orga.css">
<link rel="stylesheet" href="nom.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/orga.js"></script>
<script src="../../assets/orga-dessin.js"></script>
<script src="nom.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · COURS 3 / 5</span>
    <h2 class="er-titre">Acides carboxyliques, esters, amides</h2>
    <p class="er-contexte">Trois familles où le C du C=O porte <b>un autre atome</b> : un OH (acides carboxyliques), un O lié à un C (esters), un N (amides).</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : le C=O et un autre atome sur le
   même C : acide carboxylique (OH), ester (O lié à un C), amide (N) ;
   les confusions classiques (acide ≠ alcool + cétone, ester ≠ acide,
   amide ≠ amine + cétone, aldéhyde ≠ cétone) sont les diagnostics de
   l'outil d'entourage et des choix « groupe · famille ». Les groupes
   carboxyle et ester sont dessinés en extrait de semi-développée.
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { o, molHTML, video, familles } = NOM;
const groupeLegende = s => ORGA.legendeHTML(ORGA.groupes(NOM.mol(s)));
const ent = (s, ec) => molHTML(s, { ecriture: ec || 'semi', entourer: true, legende: groupeLegende(s) });
// extrait d'une semi-développée : seulement le groupe caractéristique (les traits vers le reste de la molécule restent)
const extrait = (s, masquer, label, h) => `<span class="nom-extrait">${ORGA.dessinHTML(NOM.mol(s), { ecriture: 'semi', masquer: new Set(masquer), h, label, sansAide: true })}</span>`;
// « À toi » : entourer puis nommer le groupe d'une molécule fabriquée
function aToiGroupe(cle, titre) {
  const x = ORGA.fabriqueFamille(cle, { min: 3, max: 6, ramMax: 1 });
  return { titre, parties: [ORGA.partieEntourer(x.mol, { ecriture: hasard(['semi', 'topo']) })].concat(ORGA.partiesNommerGroupes(x.mol)) };
}

function etape1(c) {
  const carte = c.carte('1. Acides carboxyliques et esters');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Le C=O et un O sur le même C.</b></p>
        <ul class="nom-extraits"><li>${extrait('CC(=O)O', [0], 'groupe carboxyle : C, =O et OH')}<span>le O porte un H : groupe <b>carboxyle</b>, famille des <b>acides carboxyliques</b> ;</span></li>
        <li>${extrait('CC(=O)OC', [0], 'groupe ester : C, =O et O lié à un autre C', [0, 0, 0, 0, 0])}<span>le O est lié à un autre C : groupe <b>ester</b>, famille des <b>esters</b>.</span></li></ul>
        <p>On entoure les trois : C, =O et O (avec son H pour l'acide). <b>Acide ≠ alcool + cétone</b> : le OH et le =O sur le même C forment un seul groupe.</p></div>
    </div>
    ${exemple(`<div class="nom-mols">${ent('CC(C)CC(=O)O')}${ent('CCCCOC(C)=O')}</div>`)}`);
  c.aToi(carte, [aToiGroupe('acide', 'Molécule 1'), aToiGroupe('ester', 'Molécule 2')]);
  return carte;
}
function etape2(c) {
  const carte = c.carte('2. Amides ; les confusions classiques');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Le C=O et un N sur le même C</b> : groupe <b>amide</b>, famille des <b>amides</b>. On entoure C, =O et N (avec ses H).</p></div>
      <div class="cle"><p><b class="cle-titre">Attention.</b> Acide ≠ alcool + cétone ; ester ≠ acide (le O est lié à un C, pas à un H) ; amide ≠ amine + cétone ; aldéhyde ≠ cétone.</p></div>
    </div>
    ${exemple(`<div class="nom-mols">${ent('CCCC(N)=O')}${ent('CCCCNC(C)=O')}${ent('CCCC(C)CC(=O)NC', 'topo')}</div>`)}`);
  const x = ORGA.fabriqueFamille(hasard(['acide', 'ester', 'amide']), { min: 3, max: 6, ramMax: 1 });
  c.aToi(carte, [aToiGroupe('amide', 'Molécule 1'), { titre: 'Molécule 2', parties: [ORGA.partieEntourer(x.mol, { ecriture: 'topo' })].concat(ORGA.partiesNommerGroupes(x.mol)) }]);
  return carte;
}
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle">${familles(['acide', 'ester', 'amide'])}</div>
    <div class="cle"><p>Acide ≠ alcool + cétone ; ester ≠ acide ; amide ≠ amine + cétone ; aldéhyde ≠ cétone.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_3d_cours.html">Cours : nommer alcènes, alcools, aldéhydes, cétones, acides carboxyliques →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_3.html#acides">Fiche récapitulative</a></div>`);
  return carte;
}
new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
NOM.menu('module_3c_cours');
</script>
</body>
</html>
