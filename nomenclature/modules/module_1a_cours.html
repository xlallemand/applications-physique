<title>Module 1 : combien de liaisons ? — Chapitre 2 : Nomenclature</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="../../assets/orga.css">
<link rel="stylesheet" href="nom.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/orga.js"></script>

<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 1 · COURS 1 / 3</span>
    <h2 class="er-titre">Combien de liaisons ?</h2>
    <p class="er-contexte">Pour dessiner une molécule, il faut savoir <b>combien de liaisons</b> fait chaque atome : H 1, C 4, N 3, O 2, halogènes 1. La classification périodique permet de le retrouver.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 1 du module 1 : règles du duet et de l'octet (liaisons et
   doublets non liants de H, C, N, O et des halogènes), lien avec la
   classification (outil NOM.classif), puis s'en servir : compléter les H
   d'une formule développée (ORGA.partieH), repérer une formule impossible.
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { o, motif, classif, molHTML } = NOM;

// les écritures de la remarque manuscrite du cours : liaisons et doublets non liants
const MOTIFS = `<div class="nom-motifs">
  <span class="nom-motif-l">${motif('C', [[0, 1], [90, 1], [180, 1], [270, 1]], [], 'C avec quatre liaisons simples')}4 simples</span>
  <span class="nom-motif-l">${motif('C', [[180, 2], [30, 1], [-30, 1]], [], 'C avec une double liaison et deux simples')}1 double, 2 simples</span>
  <span class="nom-motif-l">${motif('C', [[180, 3], [0, 1]], [], 'C avec une triple liaison et une simple')}1 triple, 1 simple</span>
  <span class="nom-motif-l">${motif('N', [[180, 1], [0, 1], [270, 1]], [90], 'N avec trois liaisons simples et un doublet non liant')}N : 3 liaisons</span>
  <span class="nom-motif-l">${motif('N', [[0, 3]], [180], 'N avec une triple liaison et un doublet non liant')}N : 1 triple</span>
  <span class="nom-motif-l">${motif('O', [[180, 1], [0, 1]], [90, 270], 'O avec deux liaisons simples et deux doublets non liants')}O : 2 simples</span>
  <span class="nom-motif-l">${motif('O', [[0, 2]], [90, 270], 'O avec une double liaison et deux doublets non liants')}O : 1 double</span>
  <span class="nom-motif-l">${motif('Cl', [[180, 1]], [90, 0, 270], 'halogène avec une liaison et trois doublets non liants')}X : 1 liaison</span>
</div>`;

/* ---------- 1. Duet et octet ---------- */
const ATOMES = {
  H: { l: 1, nl: 0, nom: 'un atome d\'hydrogène H' }, C: { l: 4, nl: 0, nom: 'un atome de carbone C' },
  N: { l: 3, nl: 1, nom: 'un atome d\'azote N' }, O: { l: 2, nl: 2, nom: 'un atome d\'oxygène O' },
  Cl: { l: 1, nl: 3, nom: 'un atome de chlore Cl (halogène)' }, Br: { l: 1, nl: 3, nom: 'un atome de brome Br (halogène)' },
};
const OPTS_L = [o('1', '1'), o('2', '2'), o('3', '3'), o('4', '4')];
function etape1(c) {
  const carte = c.carte('1. Duet et octet : le nombre de liaisons');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Dans une molécule, les atomes sont liés par des <b>doublets liants</b> (les liaisons) ; certains atomes ont aussi des <b>doublets non liants</b>.</p>
      <div class="cle"><p><b class="cle-titre">Règles.</b> L'atome d'hydrogène suit la règle du <b>duet</b> : un seul doublet, liant. Les autres atomes suivent la règle de l'<b>octet</b> : <b>4 doublets</b> autour de l'atome.</p>
        <div class="crs-defile"><table class="crs-tab"><thead><tr><th>Atome</th><th>Liaisons</th><th>Doublets non liants</th></tr></thead>
        <tbody><tr><td>H</td><td>1</td><td>0</td></tr><tr><td>C</td><td>4</td><td>0</td></tr><tr><td>N</td><td>3</td><td>1</td></tr><tr><td>O</td><td>2</td><td>2</td></tr><tr><td>F, Cl, Br, I</td><td>1</td><td>3</td></tr></tbody></table></div>
        <p>Liaisons = doublets liants. F, Cl, Br, I sont les halogènes. Une double liaison compte pour 2, une triple pour 3.</p></div>
    </div>
    ${exemple(`<p>Les mêmes règles, écrites avec les doublets non liants (petits traits) :</p>${MOTIFS}
      <p>Un C fait toujours 4 liaisons : 4 simples, ou 1 double et 2 simples, ou 1 triple et 1 simple. Un O fait 2 liaisons et garde 2 doublets non liants.</p>`)}`);
  const choisis = melanger(Object.keys(ATOMES)).slice(0, 3);
  c.aToi(carte, choisis.map((x, k) => ({ titre: `Atome ${k + 1}`,
    parties: [
      { type: 'choix', q: `Combien de liaisons fait ${ATOMES[x].nom} ?`, options: OPTS_L, bonne: String(ATOMES[x].l), melanger: false,
        indice: 'Règle de l\'octet : 4 doublets en tout (le duet pour H). H 1 liaison, C 4, N 3, O 2, halogènes 1.', solution: `<p>${x} fait <b>${ATOMES[x].l} liaison${ATOMES[x].l > 1 ? 's' : ''}</b> (${ATOMES[x].nl} doublet${ATOMES[x].nl > 1 ? 's' : ''} non liant${ATOMES[x].nl > 1 ? 's' : ''}).</p>` },
      ...(x === 'H' ? [] : [{ type: 'choix', q: 'Et combien de doublets non liants ?', options: [o('0', '0'), o('1', '1'), o('2', '2'), o('3', '3')], bonne: String(ATOMES[x].nl), melanger: false,
        indice: `4 doublets en tout : ${ATOMES[x].l} liant${ATOMES[x].l > 1 ? 's' : ''}, donc 4 − ${ATOMES[x].l} non liant${4 - ATOMES[x].l > 1 ? 's' : ''}.`, solution: `<p>4 − ${ATOMES[x].l} = <b>${ATOMES[x].nl}</b>.</p>` }]),
    ] })));
  return carte;
}

/* ---------- 2. Lien avec la classification ---------- */
const QUESTIONS_CL = [['S', 'le soufre S (sous l\'oxygène)', 2], ['P', 'le phosphore P (sous l\'azote)', 3], ['Si', 'le silicium Si (sous le carbone)', 4], ['I', 'l\'iode I', 1], ['N', 'l\'azote N', 3], ['O', 'l\'oxygène O', 2]];
function etape2(c) {
  const carte = c.carte('2. Lien avec la classification');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Règle.</b> Nombre de liaisons d'un atome = nombre de <b>cases</b> à parcourir <b>vers la droite</b> pour arriver dans la dernière colonne, celle des <b>gaz nobles</b>.</p>
        <p>C : 4 cases jusqu'au néon, 4 liaisons ; N : 3 ; O : 2 ; F : 1 ; H : 1 case jusqu'à l'hélium.</p></div>
    </div>
    ${exemple('<p>Touche un élément : ses cases se comptent jusqu\'à la colonne des gaz nobles.</p><div data-classif></div>')}`);
  classif(carte.querySelector('[data-classif]'));
  const qs = melanger(QUESTIONS_CL).slice(0, 2);
  c.aToi(carte, qs.map(([x, nom, n], k) => ({ titre: `Élément ${k + 1}`,
    parties: [{ type: 'nombre', q: `Avec la classification, combien de liaisons fait ${nom} ?`, label: 'Liaisons :', valeur: n, entier: true, signe: false, tol: 0,
      diag: v => (v === 8 - n ? 'Tu as compté vers la gauche : on compte les cases vers la droite, jusqu\'à la colonne des gaz nobles.' : 'Compte les cases vers la droite, jusqu\'à la dernière colonne (les gaz nobles).'),
      solution: `<p>${x} : ${n} case${n > 1 ? 's' : ''} jusqu'au gaz noble, <b>${n} liaison${n > 1 ? 's' : ''}</b>.</p>` }] })));
  return carte;
}

/* ---------- 3. S'en servir ---------- */
// formules à compléter (H) et formules à juger (H imposés : possible, trop de liaisons, pas assez)
const A_COMPLETER = ['CCO', 'CC(C)N', 'CC=O', 'C=CCl', 'CC(=O)O', 'CNC'];
const BASES = ['CC(C)CC', 'CCC(C)O', 'CC(=O)CC', 'CCCN', 'CC(C)C=O', 'CCCO'];
function formuleJugee() {
  const m = NOM.mol(hasard(BASES)), n = m.atomes.length;
  const h = m.atomes.map((a, i) => ORGA.nbH(m, i));
  const cas = hasard(['ok', 'trop', 'trop', 'manque']);
  let i = null;
  if (cas !== 'ok') {
    const possibles = m.atomes.map((a, j) => j).filter(j => cas === 'trop' ? m.atomes[j].el !== 'Cl' : h[j] > 0);
    i = hasard(possibles);
    h[i] += cas === 'trop' ? 1 : -1;
  }
  return { m, h, cas, i };
}
function etape3(c) {
  const carte = c.carte('3. S\'en servir : compléter les H, repérer une formule impossible');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Méthode.</b> Pour chaque atome, on compte ses liaisons avec les autres atomes ; les H complètent : <b>nombre de H = liaisons de l'atome − liaisons déjà faites</b>. Un C a toujours 4 liaisons, un O 2, un N 3 : une formule où un atome en a plus (ou moins) est <b>impossible</b>.</p></div>
    </div>
    ${exemple(`<div class="nom-mols">${molHTML('CC(O)C', { titre: 'Développée', ecriture: 'developpee' })}</div>
      <p>Le C du milieu est lié à 2 C et à 1 O : 3 liaisons, il lui faut <b>1 H</b> (4 en tout). Les C des bouts sont liés à 1 C : <b>3 H</b>. L'O est lié à 1 C : <b>1 H</b> (2 liaisons en tout).</p>`)}`);
  const jug = formuleJugee();
  const OPTS_J = [o('ok', 'oui, elle est possible'), o('trop', 'non : un atome a trop de liaisons'), o('manque', 'non : il manque des liaisons à un atome')];
  const ex = jug.i == null ? '' : `${ORGA.etiquetteH(jug.m.atomes[jug.i].el, jug.h[jug.i], true)} : ${ORGA.somme(jug.m, jug.i) + jug.h[jug.i]} liaisons au lieu de ${ORGA.valence(jug.m.atomes[jug.i].el)}.`;
  c.aToi(carte, [
    { titre: 'Compléter les H', parties: [ORGA.partieH(hasard(A_COMPLETER), { ecriture: 'developpee', q: 'Touche chaque atome pour lui ajouter un H (touche un H pour l\'enlever), puis valide.' })] },
    { titre: 'Formule possible ?', enonce: `<div class="nom-fig">${ORGA.dessinHTML(jug.m, { ecriture: 'semi', h: jug.h, label: 'Formule semi-développée à juger' })}</div>`,
      parties: [{ type: 'choix', q: 'Cette formule semi-développée est-elle possible ?', options: OPTS_J, bonne: jug.cas, melanger: false,
        indice: 'Compte les liaisons de chaque atome, H compris : C 4, N 3, O 2, Cl 1.', solution: `<p>${jug.cas === 'ok' ? 'Chaque atome a le bon nombre de liaisons, H compris.' : ex}</p>` }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p><b>Nombre de liaisons</b> : H 1, C 4, N 3 (+ 1 doublet non liant), O 2 (+ 2 doublets non liants), halogènes F, Cl, Br, I 1 (+ 3 doublets non liants).</p></div>
    <div class="cle"><p>Dans la classification : nombre de liaisons = nombre de cases vers la droite jusqu'à la colonne des gaz nobles.</p></div>
    <div class="cle"><p>Les H complètent les liaisons de chaque atome. Un atome avec trop (ou pas assez) de liaisons : formule impossible.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_1b_cours.html">Cours : les trois écritures →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_1.html#liaisons">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
NOM.menu('module_1a_cours');
</script>
</body>
</html>
