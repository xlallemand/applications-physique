<style>

    .mult-sign { display:inline-block; font-weight:800; color:#64748b; margin:0 3px; font-size:1rem; flex-shrink:0; }

    .topbar {

    /* ── Zones d'insertion à côté d'une fraction (module 4) ─────────── */

    /* ── Racine carrée ─────────── */
    .sqrt-wrap { display:inline-flex; align-items:flex-end; margin:0 6px; flex-shrink:0; }

<script>
// ═══════════════════════════════════════════════════════════════
// OUTILS DE CONSTRUCTION DE NŒUDS
// une équation (membre gauche/droit) est une séquence de "zones" (slots)
// multipliées entre elles : {kind:'seq', slots:[...]}
// chaque zone est soit simple {kind:'simple', items:[...]}, soit une fraction
// {kind:'frac', num, den}. Une racine peut envelopper tout un membre :
// {kind:'sqrt', inner}
// ═══════════════════════════════════════════════════════════════
function tile(id,label){ return {id,label}; }
function simple(items){ return { kind:'simple', items: items.map(t => ({...t})) }; }
function frac(numItems, denItems){ return { kind:'frac', num: simple(numItems), den: simple(denItems) }; }
function seq(slots){ return { kind:'seq', slots }; }
function emptySeq(){ return seq([simple([])]); }
function sqrtNode(inner){ return { kind:'sqrt', inner }; }
function idsOf(items){ return items.map(i => i.id); }
function setEq(a,b){ if (a.length !== b.length) return false; const sa=[...a].sort(), sb=[...b].sort(); return sa.every((v,i)=>v===sb[i]); }
function staticFracHtml(num, den) {
    return `<span class="frac-wrap-static"><span class="frac-num-static">${num}</span><span class="frac-line-static"></span><span class="frac-den-static">${den}</span></span>`;
}

// ═══════════════════════════════════════════════════════════════
// ÉTAT GLOBAL
// ═══════════════════════════════════════════════════════════════
let state = { left: emptySeq(), right: emptySeq() };
let history = [];
let resolved = false;
let stepOneValidated = false;
let currentExercise = null;
let hadError = false;
let viewMode = 'drill';
let activeHighlightId = null;
let currentDrill = null;
let currentDrillOnSuccess = null;
let currentDrillCfg = null;
let draggedData = null;
let touchStartPos = null;
let dragGhostEl = null;

function getNode(path) {
    const parts = path.split('.');
    let cur = parts[0] === 'left' ? state.left : state.right;
    for (let i = 1; i < parts.length; i++) {
        if (!cur) return null;
        const p = parts[i];
        cur = /^\d+$/.test(p) ? (cur.slots ? cur.slots[+p] : undefined) : cur[p];
    }
    return cur || null;
}
function setNode(path, newNode) {
    const parts = path.split('.');
    if (parts.length === 1) { state[parts[0]] = newNode; return; }
    const parent = getNode(parts.slice(0, -1).join('.'));
    const last = parts[parts.length - 1];
    if (/^\d+$/.test(last)) parent.slots[+last] = newNode;
    else parent[last] = newNode;
}

// ═══════════════════════════════════════════════════════════════
// AFFICHAGE
// ═══════════════════════════════════════════════════════════════
function isOperatorTile(it) { return it.id === 'plus' || it.id === 'minus' || it.id === 'times'; }

function renderInsertZone(sidePath, where) {
    return `<div class="insert-zone" data-side="${sidePath}" data-where="${where}"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="handleInsertDrop(event,'${sidePath}','${where}')"></div>`;
}

function renderNode(node, path) {
    if (node.kind === 'simple') {
        const items = node.items.map((it, idx) => {
            const hl = (activeHighlightId && it.id === activeHighlightId) ? ' tile-highlight' : '';
            const sep = (idx > 0 && !isOperatorTile(node.items[idx-1]) && !isOperatorTile(it)) ? '<span class="mult-sign">×</span>' : '';
            return sep + `<span class="eq-tile${hl}" draggable="true" data-path="${path}" data-idx="${idx}"
                   onclick="deleteItem('${path}',${idx})"
                   ondragstart="dragMoveStart(event,'${path}',${idx})"
                   ondragend="this.classList.remove('dragging')"
                   ondragover="event.preventDefault();event.stopPropagation()"
                   ondrop="handleTileDrop(event,'${path}',${idx})"
                   ontouchstart="touchMoveStart(event,'${path}',${idx})">
                ${it.label}<span class="tile-del"
                    onclick="event.stopPropagation();deleteItem('${path}',${idx})"
                    ontouchstart="event.stopPropagation()"
                    ontouchend="event.stopPropagation();event.preventDefault();deleteItem('${path}',${idx})">✕</span>
            </span>`;
        }).join('');
        return `<div class="slot-simple" data-path="${path}"
                     ondragover="allowDrop(event)"
                     ondragleave="this.classList.remove('drag-over')"
                     ondrop="handleDrop(event,'${path}')">
                    ${items || '<span class="slot-placeholder">…</span>'}
                </div>`;
    }
    if (node.kind === 'frac') {
        const denIsLoneOne = node.den.items.length === 1 && node.den.items[0].id === 'one';
        return `<div class="frac-wrap">
            <div class="frac-num-wrap">${renderNode(node.num, path + '.num')}</div>
            <div class="frac-line"></div>
            <div class="frac-den-wrap">
                ${denIsLoneOne ? `<span class="frac-del"
                    onclick="deleteItem('${path}.den',0)"
                    ontouchstart="event.stopPropagation()"
                    ontouchend="event.stopPropagation();event.preventDefault();deleteItem('${path}.den',0)"
                    title="Supprimer le dénominateur">✕</span>` : ''}
                ${renderNode(node.den, path + '.den')}
            </div>
        </div>`;
    }
    if (node.kind === 'sqrt') {
        return `<div class="sqrt-wrap"><span class="sqrt-symbol">√</span><div class="sqrt-inner">${renderNode(node.inner, path + '.inner')}</div></div>`;
    }
    // seq
    let html = '';
    const n = node.slots.length;
    if (node.slots[0].kind === 'frac') html += renderInsertZone(path, 'start');
    node.slots.forEach((slot, i) => {
        if (i > 0) html += '<span class="mult-sign">×</span>';
        html += renderNode(slot, path + '.' + i);
    });
    if (node.slots[n-1].kind === 'frac') html += renderInsertZone(path, 'end');
    return `<div class="eq-side" data-path="${path}">${html}</div>`;
}

function renderStatic(node) {
    if (node.kind === 'simple') {
        if (node.items.length === 0) return '<span class="slot-placeholder">…</span>';
        return node.items.map((it, idx) => {
            const sep = (idx > 0 && !isOperatorTile(node.items[idx-1]) && !isOperatorTile(it)) ? '<span class="mult-sign">×</span>' : '';
            return sep + `<span class="eq-tile-frozen">${it.label}</span>`;
        }).join('');
    }
    if (node.kind === 'frac') {
        return `<div class="frac-wrap">
            <div class="frac-num-wrap">${renderStatic(node.num)}</div>
            <div class="frac-line"></div>
            <div class="frac-den-wrap">${renderStatic(node.den)}</div>
        </div>`;
    }
    if (node.kind === 'sqrt') {
        return `<div class="sqrt-wrap"><span class="sqrt-symbol">√</span><div class="sqrt-inner">${renderStatic(node.inner)}</div></div>`;
    }
    return `<div class="eq-side">${node.slots.map((s,i) => (i>0?'<span class="mult-sign">×</span>':'') + renderStatic(s)).join('')}</div>`;
}

function renderEquationZone() {
    const zone = document.getElementById('currentStepZone');
    if (!zone) return;
    zone.innerHTML =
        renderNode(state.left, 'left') +
        `<div class="eq-sign">=</div>` +
        renderNode(state.right, 'right') +
        `<button class="flip-btn" onclick="flipEquation()" title="Inverser le sens de l'équation">⇄</button>`;
}
function renderHistory() {
    const el = document.getElementById('stepsHistory');
    if (!el) return;
    el.innerHTML = history.map((st, i) => `
        <div class="step-row eq-row py-3">
            <span class="text-xs font-bold text-gray-400 mr-1">Étape ${i + 1}</span>
            ${renderStatic(st.left)}
            <span class="eq-sign" style="font-size:1.4rem;margin:0 12px;">=</span>
            ${renderStatic(st.right)}
            <span class="text-green-600 font-bold ml-2">✓</span>
        </div>`).join('');
}
function updateHint() {
    const h = document.getElementById('stepHint');
    if (!h) return;
    h.textContent = stepOneValidated
        ? "Déplace les termes pour isoler la grandeur demandée à gauche, ou utilise ⇄ pour inverser le sens de l'équation."
        : "Recopie l'équation ci-dessus. Un terme peut se glisser au numérateur d'une fraction, ou juste à côté d'elle : c'est équivalent.";
}
function refreshView() {
    renderEquationZone();
    if (viewMode === 'solve') { buildPalette(); updateHint(); }
    else if (viewMode === 'drill' && currentDrillCfg && currentDrillCfg.showPalette) { buildDrillPalette(); }
}
function showFeedback(msg, ok) {
    const f = document.getElementById('feedback');
    if (!f) return;
    f.innerHTML = msg;
    f.className = 'text-center mt-4 font-semibold text-lg ' + (ok ? 'text-green-600' : 'text-red-600');
}

// ═══════════════════════════════════════════════════════════════
// GLISSER-DÉPOSER
// ═══════════════════════════════════════════════════════════════
function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function handleDrop(e, path) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!draggedData) return;
    processDrop(path, draggedData);
    draggedData = null;
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
}

// une zone de niveau supérieur (juste à côté d'une fraction) devenue vide disparaît,
// pour laisser réapparaître la zone d'insertion
function pruneEmptySlot(path) {
    const parts = path.split('.');
    if (parts.length !== 2) return;
    const side = getNode(parts[0]);
    const idx = +parts[1];
    const slot = side.slots[idx];
    if (slot && slot.kind === 'simple' && slot.items.length === 0 && side.slots.length > 1) {
        side.slots.splice(idx, 1);
    }
}
// numérateur/dénominateur vidé (à l'intérieur d'une fraction)
function applyEmptinessRuleFrac(path, removedId) {
    if (path.endsWith('.num')) {
        setNode(path, simple([{ id:'one', label:'1' }]));
        return;
    }
    if (path.endsWith('.den')) {
        if (removedId === 'one') {
            const fracPath = path.slice(0, -4);
            const fracNode = getNode(fracPath);
            setNode(fracPath, fracNode.num);
        } else {
            setNode(path, simple([{ id:'one', label:'1' }]));
        }
    }
}
function handleEmptied(path, removedId) {
    const parts = path.split('.');
    if (parts.length === 2) pruneEmptySlot(path);
    else applyEmptinessRuleFrac(path, removedId);
}

function processDrop(path, data) {
    if (data.type === 'frac') {
        const node = getNode(path);
        if (!node || node.kind !== 'simple') return;
        setNode(path, frac(node.items, [{ id:'one', label:'1' }]));
        refreshView();
        return;
    }
    if (data.type === 'sqrt') {
        processSqrtDrop(path);
        return;
    }
    const node = getNode(path);
    if (!node || node.kind !== 'simple') return;
    if (data.type === 'move') {
        if (data.from === path) { refreshView(); return; }
        const src = getNode(data.from);
        if (src && src.items[data.idx] && src.items[data.idx].id === data.id) {
            const removedId = src.items[data.idx].id;
            src.items.splice(data.idx, 1);
            if (src.items.length === 0) handleEmptied(data.from, removedId);
        }
    }
    node.items.push({ id: data.id, label: data.label });
    refreshView();
}

function handleInsertDrop(e, sidePath, where) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!draggedData || draggedData.type === 'frac' || draggedData.type === 'sqrt') { draggedData = null; return; }
    const side = getNode(sidePath);
    if (!side || side.kind !== 'seq') { draggedData = null; return; }
    const newSlot = simple([{ id: draggedData.id, label: draggedData.label }]);
    if (where === 'start') side.slots.unshift(newSlot); else side.slots.push(newSlot);
    if (draggedData.type === 'move') {
        const src = getNode(draggedData.from);
        if (src && src.items[draggedData.idx] && src.items[draggedData.idx].id === draggedData.id) {
            const removedId = src.items[draggedData.idx].id;
            src.items.splice(draggedData.idx, 1);
            if (src.items.length === 0) handleEmptied(draggedData.from, removedId);
        }
    }
    draggedData = null;
    refreshView();
}

function deleteItem(path, idx) {
    const node = getNode(path);
    if (!node || node.kind !== 'simple') return;
    const removed = node.items[idx];
    if (!removed) return;
    node.items.splice(idx, 1);
    if (node.items.length === 0) handleEmptied(path, removed.id);
    refreshView();
}

function handleTileDrop(e, path, idx) {
    e.preventDefault();
    e.stopPropagation();
    if (!draggedData) return;
    if (draggedData.type === 'sqrt') { processSqrtOnTile(path, idx); draggedData = null; return; }
    processDrop(path, draggedData);
    draggedData = null;
}

function dragMoveStart(e, path, idx) {
    const node = getNode(path);
    const it = node && node.items[idx];
    if (!it) return;
    draggedData = { type:'move', from:path, idx:idx, id:it.id, label:it.label };

function isFullyIsolatedSeq(node, targetId) {
    return node && node.kind === 'seq' && node.slots.length === 1
        && node.slots[0].kind === 'simple' && node.slots[0].items.length === 1
        && node.slots[0].items[0].id === targetId;
}
function isIsolatedSeq(node, targetId) {
    if (!node || node.kind !== 'seq' || node.slots.length !== 1) return false;
    const s = node.slots[0];
    if (s.kind === 'simple') return s.items.length === 1 && s.items[0].id === targetId;
    if (s.kind === 'frac') return s.num.items.length === 1 && s.num.items[0].id === targetId
        && s.den.items.length === 1 && s.den.items[0].id === 'one';
    return false;
}
function processSqrtOnTile(path, idx) {
    const ex = currentExercise;
    if (!ex || !ex.hasSqrt) return;
    const node = getNode(path);
    const it = node && node.items && node.items[idx];
    if (!it || it.id !== ex.sqrtTargetId) return;
    const parts = path.split('.');
    const isTopSlot = parts.length === 2 && parts[1] === '0';
    const side = isTopSlot ? getNode(parts[0]) : null;
    const isolated = isTopSlot && side && side.kind === 'seq' && side.slots.length === 1 && node.items.length === 1;
    if (!isolated) {
        showFeedback(`✕ Il est trop tôt pour enlever le carré. Il faut le faire après avoir isolé ${ex.sqrtTargetLabel}.`, false);
        return;
    }
    node.items[0] = { id: ex.sqrtPlainId, label: ex.sqrtPlainLabel };
    refreshView();
}
function processSqrtDrop(path) {
    if (path !== 'left' && path !== 'right') return;
    const ex = currentExercise;
    if (!ex || !ex.hasSqrt) return;
    const already = isFullyIsolatedSeq(state.left, ex.sqrtPlainId) || isFullyIsolatedSeq(state.right, ex.sqrtPlainId);
    if (!already) {
        showFeedback(`✕ Il est trop tôt pour enlever le carré. Il faut le faire après avoir isolé ${ex.sqrtTargetLabel}.`, false);
        return;
    }
    const node = getNode(path);
    if (node.kind === 'sqrt' || isFullyIsolatedSeq(node, ex.sqrtPlainId)) { refreshView(); return; }
    state[path] = sqrtNode(node);
    refreshView();
}

function countIdAnywhere(id) {
    function c(node) {
        if (!node) return 0;
        if (node.kind === 'simple') return node.items.filter(i => i.id === id).length;
        if (node.kind === 'sqrt') return c(node.inner);
        if (node.kind === 'frac') return c(node.num) + c(node.den);
        return node.slots.reduce((s, sl) => s + c(sl), 0);
    }
    return c(state.left) + c(state.right);
}

// ÉVALUATION ALGÉBRIQUE
// ═══════════════════════════════════════════════════════════════
function tokenValue(id, v) {
    if (id === 'one') return 1;
    return (v && id in v) ? v[id] : NaN;
}
function evaluateNode(node, v) {
    if (node.kind === 'sqrt') return Math.sqrt(evaluateNode(node.inner, v));
    if (node.kind === 'seq') return node.slots.reduce((p, s) => p * evaluateNode(s, v), 1);
    if (node.kind === 'frac') return evaluateNode(node.num, v) / evaluateNode(node.den, v);
    if (node.items.length === 0) return NaN;
    let terms = [], termValue = 1, sign = 1;
    node.items.forEach(it => {
        if (it.id === 'plus')       { terms.push(sign * termValue); termValue = 1; sign = 1; }
        else if (it.id === 'minus') { terms.push(sign * termValue); termValue = 1; sign = -1; }
        else if (it.id === 'times') { /* juxtaposition = produit */ }
        else termValue *= tokenValue(it.id, v);
    });
    terms.push(sign * termValue);
    return terms.reduce((s, t) => s + t, 0);
}
function isSlotEmpty(node) {
    if (node.kind === 'simple') return node.items.length === 0;
    if (node.kind === 'sqrt') return isSlotEmpty(node.inner);
    if (node.kind === 'frac') return isSlotEmpty(node.num) || isSlotEmpty(node.den);
    return node.slots.some(isSlotEmpty);
}
function countOnesIn(node) {
    if (node.kind === 'simple') return node.items.filter(i => i.id === 'one').length;
    if (node.kind === 'sqrt') return countOnesIn(node.inner);
    if (node.kind === 'frac') return countOnesIn(node.num) + countOnesIn(node.den);
    return node.slots.reduce((s, sl) => s + countOnesIn(sl), 0);
}

function verifyStep() {
    if (isSlotEmpty(state.left) || isSlotEmpty(state.right)) {
        showFeedback("✕ Complète les deux membres de l'équation avant de vérifier.", false);
        hadError = true;
        return;
    }
    let equationTrue = true;
    for (let i = 0; i < 5 && equationTrue; i++) {
        const v = currentExercise.sample();
        const l = evaluateNode(state.left, v);
        const r = evaluateNode(state.right, v);
        if (!isFinite(l) || !isFinite(r) || Math.abs(l - r) > 1e-6 * Math.max(1, Math.abs(r))) equationTrue = false;
    }
    if (!equationTrue) {
        showFeedback("✕ Cette équation n'est pas correcte : vérifie tes calculs.", false);
        hadError = true;
        return;
    }

    history.push(JSON.parse(JSON.stringify(state)));
    renderHistory();
    stepOneValidated = true;

    const target = currentExercise.targetId;
    const leftFull  = isFullyIsolatedSeq(state.left, target);
    const rightFull = !leftFull && isFullyIsolatedSeq(state.right, target);
    const leftLoose  = !leftFull && isIsolatedSeq(state.left, target);
    const rightLoose = !rightFull && !leftLoose && isIsolatedSeq(state.right, target);

    const onesTotal = countOnesIn(state.left) + countOnesIn(state.right);
    const onesElsewhere = onesTotal - (leftLoose ? 1 : 0) - (rightLoose ? 1 : 0);
    const complete = leftFull && onesElsewhere === 0;

    if (complete) {
        resolved = true;
        document.getElementById('workZone').classList.add('hidden');
        const dm = document.getElementById('doneMsg');
        dm.classList.remove('hidden');
        showFeedback('', true);
        if (currentExercise.onSolved) currentExercise.onSolved(dm);
        else dm.innerHTML = '🎉 Équation résolue !';
    } else {
        let msg;
        if (rightFull) {
            msg = "✓ Étape correcte ! Il ne reste plus qu'à inverser le sens de l'équation avec ⇄.";
        } else if (rightLoose) {
            msg = "✓ Étape correcte ! Inverse le sens de l'équation avec ⇄, puis retire le dénominateur qui vaut 1.";
        } else if (leftLoose && onesElsewhere > 0) {
            msg = "✓ Étape correcte ! La grandeur à isoler ne doit plus être dans une fraction : clique sur la croix du dénominateur (qui vaut 1) pour le supprimer. Retire les 1 inutiles.";
        } else if (leftLoose) {
            msg = "✓ Étape correcte ! La grandeur à isoler ne doit plus être dans une fraction : clique sur la croix du dénominateur (qui vaut 1) pour le supprimer.";
        } else if (onesElsewhere > 0) {
            msg = "✓ Retire les 1 inutiles.";
        } else {
            msg = "✓ Étape correcte, continue !";
        }
        showFeedback(msg, true);
        state = JSON.parse(JSON.stringify(state));
        refreshView();
    }
}

}

    app.innerHTML = `
      <div class="bg-white rounded-xl shadow-lg p-6 mb-6 border-l-8 border-purple-500">

        <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${progressPct}%"></div></div>
      </div>
      <div class="bg-white rounded-xl shadow-lg p-6 mb-6 border-l-8 border-blue-500">
        <p class="text-gray-700 text-lg mb-2">${q.intro}</p>
        <p class="unit-legend mb-2">${q.legend}</p>
        <div class="eq-line-static text-lg md:text-2xl my-4">${q.staticEqHtml}</div>
        <p class="font-bold text-indigo-900">Exprimer ${q.tiles.find(t=>t.id===q.target).label}.</p>
        <div class="text-right mt-2"><button onclick="abandonQuestion4()" class="text-xs font-bold text-red-500 hover:text-red-700">Abandonner cette question →</button></div>

      <div class="bg-white rounded-xl shadow-lg p-6 border-l-8 border-indigo-500">${solveEditorHTML()}</div>`;
    startSolveExercise({
        tiles: q.tiles, sample: q.sample, targetId: q.target,
        hasSqrt: q.hasSqrt, sqrtTargetId: q.sqrtTargetId, sqrtTargetLabel: q.sqrtTargetLabel, sqrtPlainId: q.sqrtPlainId, sqrtPlainLabel: q.sqrtPlainLabel,
        onSolved: (dm) => {
            const pts = hadError ? 1 : (history.length === 1 ? 3 : 2);
            m4Score += pts;
            m4Answers.push({ num: displayNum, pts, max: 2 });
            dm.innerHTML = `🎉 Équation résolue ! (+${pts} pt${pts>1?'s':''})<div class="mt-4"><button onclick="nextModule4Question()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-bold shadow">Suivant →</button></div>`;

}

    m4Answers.push({ num: m4Idx+5, pts: 0, max: 2 });

}
function finishModule4() {
    const pct = Math.round(m4Score / m4MaxScore * 100);
    const isMax = m4Score >= m4TrueMaxScore;
    const recapHtml = m4Answers.map(a => `<div class="recap-item">Q${a.num}<br><b>${a.pts}/${a.max}</b></div>`).join('');
    document.getElementById('app').innerHTML = `
      <div class="bg-white rounded-xl shadow-lg p-8 text-center border-l-8 border-green-500">
        <h2 class="text-2xl font-bold text-indigo-900 mb-2">Entraînement 2 terminé !</h2>
        ${isMax ? `<p class="text-lg font-bold text-amber-600 mb-2">🏆 Score maximal ! Bravo, c'est un sans-faute parfait !</p>` : ''}

        <button onclick="startModule4Graded()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-bold shadow">↺ Recommencer l'entraînement</button>
        <div class="text-sm font-bold text-gray-500 mt-6 mb-2 text-left">Détail des points</div>
        <div class="recap-grid">${recapHtml}</div>

    if (isMax) launchConfetti();
}
let confettiInterval = null;
function launchConfetti() {
    if (confettiInterval) return;
    spawnConfettiBurst();
    confettiInterval = setInterval(spawnConfettiBurst, 700);
}
function spawnConfettiBurst() {
    const colors = ['#4f46e5','#22c55e','#f59e0b','#ef4444','#06b6d4'];
    for (let i = 0; i < 24; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = (Math.random()*100) + 'vw';
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.animationDuration = (2.5 + Math.random()*1.5) + 's';
        el.style.animationDelay = (Math.random()*0.4) + 's';
        el.style.transform = `rotate(${Math.random()*360}deg)`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4500);
    }
}
