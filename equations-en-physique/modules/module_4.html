    /* ============================================================
       Éditeur d'équation (manipulations du cours) et équations écrites
       des exemples. Couleurs : uniquement les variables de assets/theme.css.
       ============================================================ */
    /* équation écrite (exemples) */
    .eq-line-static { display:flex; align-items:center; justify-content:center; justify-content:safe center; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; }

    .eq-row { display:flex; align-items:center; justify-content:center; justify-content:safe center; flex-wrap:nowrap; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
    .eq-row::-webkit-scrollbar { height:4px; }
    .eq-side { display:flex; align-items:center; flex-shrink:0; }
    .eq-sign { font-size:1.8rem; font-weight:800; color:var(--ink); margin:0 16px; flex-shrink:0; }
    .eq-sign.petit { font-size:1.4rem; margin:0 10px; }

    .slot-simple {
        display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
        min-width:70px; min-height:56px; padding:8px 12px;
        border:2px dashed var(--ink-3); border-radius:10px; background:var(--sheet); transition:all .2s;
    }
    .slot-simple.drag-over { background:var(--cle-bg); }
    .slot-placeholder { color:var(--ink-3); font-weight:700; font-size:1.1rem; }

    .eq-tile {
        display:inline-flex; align-items:center; gap:6px; position:relative;
        background:var(--paper-2); border:2px solid var(--line-strong); border-radius:8px;
        padding:9px 13px; min-height:40px; font-weight:700; color:var(--ink); cursor:grab; touch-action:none;
    }
    .eq-tile.dragging { opacity:.4; }
    .eq-tile-lab { white-space:nowrap; }   /* nom de la grandeur (indice compris) d'un seul tenant */
    .eq-tile.tile-highlight { background:var(--cle-bg); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 0 0 3px var(--cle-line); }
    .eq-tile.drag-over { border-color:var(--accent); box-shadow:0 0 0 3px var(--cle-line); }
    .mult-sign { display:inline-block; font-weight:800; color:var(--ink-3); margin:0 3px; font-size:1rem; flex-shrink:0; }
    .tile-del {
        width:16px; height:16px; border-radius:50%; background:var(--danger); color:var(--sheet);
        font-size:10px; line-height:16px; text-align:center; cursor:pointer;
    }

    .frac-wrap { display:inline-flex; flex-direction:column; align-items:center; gap:4px; position:relative; margin:0 8px; flex-shrink:0; }
    .frac-num-wrap, .frac-den-wrap { position:relative; }
    .frac-line { width:100%; height:3px; background:var(--ink); border-radius:2px; }
    .frac-del {
        position:absolute; top:-9px; right:-9px; width:20px; height:20px; border-radius:50%;
        background:var(--danger); color:var(--sheet); font-size:11px; line-height:16px; text-align:center;
        cursor:pointer; border:2px solid var(--sheet); z-index:1;
    }

    .flip-btn {
        width:44px; height:44px; border-radius:50%; background:var(--paper-2); border:2px solid var(--line-strong);
        color:var(--ink); font:inherit; font-size:1.3rem; font-weight:800; margin-left:12px; flex-shrink:0; cursor:pointer;
    }
    .flip-btn:hover { background:var(--paper-3); }

    .eq-tile-frozen { display:inline-flex; align-items:center; background:var(--paper-2); border:2px solid var(--line-strong); border-radius:8px; padding:6px 10px; font-weight:700; color:var(--ink-2); margin:0 3px; }

    .palette-tile {
        display:inline-flex; align-items:center; justify-content:center;
        min-width:56px; min-height:44px; padding:8px 14px;
        background:var(--sheet); border:2px solid var(--line-strong); border-radius:10px;
        font-weight:700; color:var(--ink); cursor:grab; touch-action:none; user-select:none;
    }
    .palette-tile.dragging { opacity:.4; }
    .palette-frac { display:inline-flex; flex-direction:column; align-items:center; padding:6px 12px; }
    .palette-frac .dots { font-size:.8rem; letter-spacing:2px; color:var(--ink); }
    .palette-frac .frac-line { width:28px; height:2px; margin:2px 0; background:var(--ink); }

    /* ── Zones d'insertion à côté d'une fraction : elles se montrent pendant un glisser ── */
    .insert-zone {
        width:34px; min-height:56px; border:2px dashed var(--ink-3); border-radius:8px;
        opacity:0; transition:opacity .15s; flex-shrink:0;
    }
    .insert-zone.drag-over { background:var(--paper-2); border-color:var(--accent); opacity:1; }
    .ep-glisse .insert-zone { opacity:.55; }
    .ep-glisse .insert-zone.drag-over { opacity:1; }

    @media (max-width:480px) {
        .eq-tile, .eq-tile-frozen { font-size:.85rem; padding:7px 10px; }
        .eq-tile { min-height:36px; }
        .eq-sign { font-size:1.4rem; margin:0 8px; }
        .flip-btn { width:36px; height:36px; font-size:1rem; margin-left:8px; }
        /* téléphone : équation plus compacte, pour qu'elle tienne le plus souvent sans défiler */
        .slot-simple { min-width:52px; min-height:50px; padding:6px; gap:6px; }
        .eq-sign { margin:0 6px; }
        .flip-btn { margin-left:4px; }
        .ep-zone { padding:24px 4px; }
        .insert-zone { width:28px; }
    }

    /* ── Une manipulation (instance de l'éditeur) ── */
    .ep-barre { display:flex; justify-content:flex-end; margin-bottom:8px; }
    .ep-zone { min-height:110px; padding:32px 0; border:2px dashed var(--paper-3); border-radius:12px; background:var(--paper); }
    .er-etape .ep-pal-t { font-size:.75rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); margin:16px 0 8px; }
    .ep-palette { display:flex; flex-wrap:wrap; gap:12px; padding:16px; background:var(--paper); border:1px solid var(--line); border-radius:12px; }
    .ep-partiel { color:var(--success-text); }
    /* manipulation réussie ou réponse affichée : l'équation reste affichée, plus rien ne bouge */
    .ep-fige .ep-barre, .ep-fige .ep-pal-t, .ep-fige .ep-palette, .ep-fige .ep-actions,
    .ep-fige .tile-del, .ep-fige .frac-del, .ep-fige .flip-btn, .ep-fige .insert-zone { display:none; }
    .ep-fige .eq-tile { cursor:default; }

    /* ── Exemple traité : avant / après la manipulation ── */
    .ep-avap { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 22px; margin:12px 0; }
    .ep-av { min-width:0; max-width:100%; }
    .er-etape .ep-av-t { font-size:.72rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); text-align:center; margin-bottom:4px; }
    .er-etape .ep-op { font-weight:800; color:var(--accent); text-align:center; }
    .ep-op::after { content:' →'; }
    @media (max-width:560px) { .ep-op::after { content:' ↓'; } }
</style>

<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · MÉTHODE</span>
    <h2 class="er-titre">Méthode pour gérer les fractions</h2>
    <p class="er-contexte">Une équation peut contenir une <b>fraction multipliée</b> par d'autres termes, comme E<sub>c</sub> = ½ × m × v². Tu vas voir qu'un terme peut <b>entrer</b> dans la fraction ou en <b>sortir</b> sans rien changer, puis le faire dans l'éditeur, par glisser-déposer.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Module 2 · Méthode : les fractions
   Cours par étapes (assets/cours.js) : une étape par règle, avec
   la règle (.cle), un exemple traité (avant / après) puis un
   « À toi » dont les items sont les manipulations de l'éditeur
   d'équation (parties 'perso').
   L'éditeur est une instance par manipulation (monterEditeur) :
   en mode « Afficher tout le cours », toutes les manipulations
   sont affichées en même temps et fonctionnent indépendamment.
   ============================================================ */

EP.menu('module_4');

// ═══════════════════════════════════════════════════════════════
// OUTILS DE CONSTRUCTION DE NŒUDS
// une équation (membre gauche/droit) est une séquence de "zones" (slots)
// multipliées entre elles : {kind:'seq', slots:[...]}
// chaque zone est soit simple {kind:'simple', items:[...]}, soit une fraction
// {kind:'frac', num, den}
// ═══════════════════════════════════════════════════════════════
function tile(id,label){ return {id,label}; }
function simple(items){ return { kind:'simple', items: items.map(t => ({...t})) }; }
function frac(numItems, denItems){ return { kind:'frac', num: simple(numItems), den: simple(denItems) }; }
function seq(slots){ return { kind:'seq', slots }; }
function emptySeq(){ return seq([simple([])]); }
function idsOf(items){ return items.map(i => i.id); }
function setEq(a,b){ if (a.length !== b.length) return false; const sa=[...a].sort(), sb=[...b].sort(); return sa.every((v,i)=>v===sb[i]); }
function isOperatorTile(it) { return it.id === 'plus' || it.id === 'minus' || it.id === 'times'; }

// équation écrite, non manipulable (exemples)
function renderStatic(node) {
    if (node.kind === 'simple') {
        if (node.items.length === 0) return '<span class="slot-placeholder">…</span>';
        return node.items.map((it, idx) => {
            const sep = (idx > 0 && !isOperatorTile(node.items[idx-1]) && !isOperatorTile(it)) ? '<span class="mult-sign">×</span>' : '';
            return sep + `<span class="eq-tile-frozen">${it.label}</span>`;
        }).join('');
    }
    if (node.kind === 'frac') {
        return `<div class="frac-wrap">
            <div class="frac-num-wrap">${renderStatic(node.num)}</div>
            <div class="frac-line"></div>
            <div class="frac-den-wrap">${renderStatic(node.den)}</div>
        </div>`;
    }
    return `<div class="eq-side">${node.slots.map((s,i) => (i>0?'<span class="mult-sign">×</span>':'') + renderStatic(s)).join('')}</div>`;
}
const eqStat = (g, d) => `<div class="eq-line-static">${renderStatic(g)}<span class="eq-sign petit">=</span>${renderStatic(d)}</div>`;

// évaluation numérique d'un membre (vérifie qu'une équation recopiée est juste)
function tokenValue(id, v) {
    if (id === 'one') return 1;
    return (v && id in v) ? v[id] : NaN;
}
function evaluateNode(node, v) {
    if (node.kind === 'seq') return node.slots.reduce((p, s) => p * evaluateNode(s, v), 1);
    if (node.kind === 'frac') return evaluateNode(node.num, v) / evaluateNode(node.den, v);
    if (node.items.length === 0) return NaN;
    let terms = [], termValue = 1, sign = 1;
    node.items.forEach(it => {
        if (it.id === 'plus')       { terms.push(sign * termValue); termValue = 1; sign = 1; }
        else if (it.id === 'minus') { terms.push(sign * termValue); termValue = 1; sign = -1; }
        else if (it.id === 'times') { /* juxtaposition = produit */ }
        else termValue *= tokenValue(it.id, v);
    });
    terms.push(sign * termValue);
    return terms.reduce((s, t) => s + t, 0);
}
function isSlotEmpty(node) {
    if (node.kind === 'simple') return node.items.length === 0;
    if (node.kind === 'frac') return isSlotEmpty(node.num) || isSlotEmpty(node.den);
    return node.slots.some(isSlotEmpty);
}

// un élément déjà placé dans l'équation ne doit jamais apparaître en même
// temps dans la palette (il y réapparaît dès qu'il est retiré de l'équation) —
// sauf le 1, le × et le + (et le −), réutilisables autant de fois que besoin
const REUSABLE_TILE_IDS = new Set(['one', 'times', 'plus', 'minus']);

// ═══════════════════════════════════════════════════════════════
// ÉDITEUR D'ÉQUATION : une instance par manipulation
//   monterEditeur(hote, cfg, api) construit l'éditeur dans hote et renvoie { montrer() }.
//   cfg : left(), right()      équation de départ
//         check(st)            true (réussi) | 'partial' (juste mais incomplet) | false
//         partialMessage       texte affiché quand c'est incomplet
//         diag(st)             diagnostic d'une erreur
//         solution()           { left, right } : équation finale attendue (« Afficher la réponse »)
//         showPalette, tiles   palette : tuiles proposées (+ l'outil fraction)
//   api : celle d'une partie 'perso' du moteur de cours (reussi, erreur, message, effacer, fini)
// Chaque instance a son propre état et ses propres éléments : aucun id fixe,
// et le glisser-déposer ne vise que les zones de son propre éditeur.
// ═══════════════════════════════════════════════════════════════
let nbEditeurs = 0;
function monterEditeur(hote, cfg, api) {
    const num = ++nbEditeurs;
    // sélecteur limité aux éléments de cette instance
    const dans = sel => sel.split(',').map(s => `[data-ep="${num}"] ${s.trim()}`).join(', ');

    let state = null;               // équation en cours { left, right }
    let activeHighlightId = null;   // grandeur mise en évidence
    let fige = false;               // réussi ou réponse affichée : plus rien ne bouge

    if (window.DragDrop) DragDrop.cleanupGhosts();
    hote.innerHTML = `<div class="ep-edit" data-ep="${num}">
        <div class="ep-barre"><button type="button" class="btn-small ep-recommencer">↺ Recommencer</button></div>
        <div class="ep-zone eq-row"></div>
        ${cfg.showPalette ? '<p class="ep-pal-t">Glisse les éléments nécessaires</p><div class="ep-palette"></div>' : ''}
        <div class="er-actions crs-actions-partie ep-actions"><button type="button" class="btn-primary ep-valider">Valider</button></div>
    </div>`;
    const racine = hote.firstElementChild;
    const zoneEq = racine.querySelector('.ep-zone');
    const pal = racine.querySelector('.ep-palette');
    racine.querySelector('.ep-recommencer').addEventListener('click', resetDrill);
    racine.querySelector('.ep-valider').addEventListener('click', checkDrill);

    function getNode(path) {
        const parts = path.split('.');
        let cur = parts[0] === 'left' ? state.left : state.right;
        for (let i = 1; i < parts.length; i++) {
            if (!cur) return null;
            const p = parts[i];
            cur = /^\d+$/.test(p) ? (cur.slots ? cur.slots[+p] : undefined) : cur[p];
        }
        return cur || null;
    }
    function setNode(path, newNode) {
        const parts = path.split('.');
        if (parts.length === 1) { state[parts[0]] = newNode; return; }
        const parent = getNode(parts.slice(0, -1).join('.'));
        const last = parts[parts.length - 1];
        if (/^\d+$/.test(last)) parent.slots[+last] = newNode;
        else parent[last] = newNode;
    }

    // ── Affichage ──
    function renderInsertZone(sidePath, where) {
        return `<div class="insert-zone" data-side="${sidePath}" data-where="${where}"></div>`;
    }
    function renderNode(node, path) {
        if (node.kind === 'simple') {
            const items = node.items.map((it, idx) => {
                const hl = (activeHighlightId && it.id === activeHighlightId) ? ' tile-highlight' : '';
                const sep = (idx > 0 && !isOperatorTile(node.items[idx-1]) && !isOperatorTile(it)) ? '<span class="mult-sign">×</span>' : '';
                return sep + `<span class="eq-tile${hl}" data-path="${path}" data-idx="${idx}"><span class="eq-tile-lab">${it.label}</span><span class="tile-del">✕</span></span>`;
            }).join('');
            return `<div class="slot-simple" data-path="${path}">${items || '<span class="slot-placeholder">…</span>'}</div>`;
        }
        if (node.kind === 'frac') {
            const denIsLoneOne = node.den.items.length === 1 && node.den.items[0].id === 'one';
            return `<div class="frac-wrap">
                <div class="frac-num-wrap">${renderNode(node.num, path + '.num')}</div>
                <div class="frac-line"></div>
                <div class="frac-den-wrap">
                    ${denIsLoneOne ? `<span class="frac-del" data-frac="${path}" title="Supprimer le dénominateur">✕</span>` : ''}
                    ${renderNode(node.den, path + '.den')}
                </div>
            </div>`;
        }
        // seq : une zone d'insertion avant / après une fraction placée en bout de membre
        let html = '';
        const n = node.slots.length;
        if (node.slots[0].kind === 'frac') html += renderInsertZone(path, 'start');
        node.slots.forEach((slot, i) => {
            if (i > 0) html += '<span class="mult-sign">×</span>';
            html += renderNode(slot, path + '.' + i);
        });
        if (node.slots[n-1].kind === 'frac') html += renderInsertZone(path, 'end');
        return `<div class="eq-side" data-path="${path}">${html}</div>`;
    }
    function renderEquationZone() {
        zoneEq.innerHTML =
            renderNode(state.left, 'left') +
            `<div class="eq-sign">=</div>` +
            renderNode(state.right, 'right') +
            `<button type="button" class="flip-btn" title="Inverser le sens de l'équation" aria-label="Inverser le sens de l'équation">⇄</button>`;
        attachEqTileHandlers();
    }
    // le contenu de la zone est régénéré à chaque changement : on réattache
    // le glisser-déposer (assets/dragdrop.js), les croix et le bouton ⇄
    function attachEqTileHandlers() {
        if (fige) return;
        zoneEq.querySelectorAll('.eq-tile').forEach(el => {
            const path = el.dataset.path;
            const idx = parseInt(el.dataset.idx, 10);
            const node = getNode(path);
            const it = node && node.items[idx];
            if (!it) return;
            enableTileDrag(el, { type:'move', from:path, idx, id:it.id, label:it.label }, () => deleteItem(path, idx));
            // croix de la tuile : supprime la tuile sans commencer de glisser
            const x = el.querySelector('.tile-del');
            x.addEventListener('pointerdown', e => e.stopPropagation());
            x.addEventListener('click', e => { e.stopPropagation(); deleteItem(path, idx); });
        });
        // croix d'un dénominateur qui vaut 1 : retire ce 1 (la fraction disparaît)
        zoneEq.querySelectorAll('.frac-del').forEach(x => {
            const p = x.dataset.frac + '.den';
            x.addEventListener('click', () => deleteItem(p, 0));
            x.addEventListener('touchstart', e => e.stopPropagation());
            x.addEventListener('touchend', e => { e.stopPropagation(); e.preventDefault(); deleteItem(p, 0); });
        });
        zoneEq.querySelector('.flip-btn').addEventListener('click', flipEquation);
    }
    function refreshView() {
        renderEquationZone();
        if (cfg.showPalette) buildDrillPalette();
    }

    // ── Glisser-déposer (Pointer Events communs : assets/dragdrop.js) ──
    // une zone de niveau supérieur (juste à côté d'une fraction) devenue vide disparaît,
    // pour laisser réapparaître la zone d'insertion
    function pruneEmptySlot(path) {
        const parts = path.split('.');
        if (parts.length !== 2) return;
        const side = getNode(parts[0]);
        const idx = +parts[1];
        const slot = side.slots[idx];
        if (slot && slot.kind === 'simple' && slot.items.length === 0 && side.slots.length > 1) {
            side.slots.splice(idx, 1);
        }
    }
    // numérateur/dénominateur vidé (à l'intérieur d'une fraction) — le numérateur
    // reste vide (l'élève doit y glisser lui-même un 1 si besoin) ; le dénominateur,
    // lui, reçoit automatiquement un 1 (sinon la fraction perdrait tout son sens)
    function applyEmptinessRuleFrac(path, removedId) {
        if (path.endsWith('.num')) return;
        if (path.endsWith('.den')) {
            if (removedId === 'one') {
                const fracPath = path.slice(0, -4);
                setNode(fracPath, getNode(fracPath).num);
            } else {
                setNode(path, simple([{ id:'one', label:'1' }]));
            }
        }
    }
    function handleEmptied(path, removedId) {
        const parts = path.split('.');
        if (parts.length === 2) pruneEmptySlot(path);
        else applyEmptinessRuleFrac(path, removedId);
    }
    function processDrop(path, data) {
        if (data.type === 'frac') {
            const node = getNode(path);
            if (!node || node.kind !== 'simple') return;
            setNode(path, frac(node.items, [{ id:'one', label:'1' }]));
            refreshView();
            return;
        }
        const node = getNode(path);
        if (!node || node.kind !== 'simple') return;
        if (data.type === 'move') {
            if (data.from === path) { refreshView(); return; }
            const src = getNode(data.from);
            if (src && src.items[data.idx] && src.items[data.idx].id === data.id) {
                const removedId = src.items[data.idx].id;
                src.items.splice(data.idx, 1);
                if (src.items.length === 0) handleEmptied(data.from, removedId);
            }
        }
        node.items.push({ id: data.id, label: data.label });
        refreshView();
    }
    // dépose sur une zone d'insertion (à côté d'une fraction) : crée une nouvelle
    // zone simple au début ou à la fin du membre, avec l'élément déposé dedans
    function handleInsertDropAt(sidePath, where, data) {
        if (!data || data.type === 'frac') return;
        const side = getNode(sidePath);
        if (!side || side.kind !== 'seq') return;
        // retirer la tuile de sa zone d'origine AVANT d'insérer la nouvelle zone :
        // insérer au début (unshift) décale les index des zones existantes
        if (data.type === 'move') {
            const src = getNode(data.from);
            if (src && src.items[data.idx] && src.items[data.idx].id === data.id) {
                const removedId = src.items[data.idx].id;
                src.items.splice(data.idx, 1);
                if (src.items.length === 0) handleEmptied(data.from, removedId);
            }
        }
        const newSlot = simple([{ id: data.id, label: data.label }]);
        if (where === 'start') side.slots.unshift(newSlot); else side.slots.push(newSlot);
        refreshView();
    }
    function deleteItem(path, idx) {
        if (fige) return;
        const node = getNode(path);
        if (!node || node.kind !== 'simple') return;
        const removed = node.items[idx];
        if (!removed) return;
        node.items.splice(idx, 1);
        if (node.items.length === 0) handleEmptied(path, removed.id);
        refreshView();
    }
    // si `onTap` est fourni, un appui sans déplacement (moins de 8 px)
    // déclenche `onTap` au lieu d'un dépôt (supprime une tuile déjà placée)
    function enableTileDrag(el, data, onTap) {
        let startX = 0, startY = 0;
        el.addEventListener('pointerdown', e => { startX = e.clientX; startY = e.clientY; });
        // pendant un glisser, les zones d'insertion de cet éditeur se montrent
        const fin = () => racine.classList.remove('ep-glisse');
        DragDrop.enable(el, {
            zoneSelector: dans('.eq-tile, .slot-simple, .insert-zone, .eq-side'),
            dragOverClass: 'drag-over',
            onStart: () => racine.classList.add('ep-glisse'),
            onDrop: (item, zone, evt) => {
                fin();
                if (fige) return;
                const moved = Math.hypot(evt.clientX - startX, evt.clientY - startY) > 8;
                if (onTap && !moved) { onTap(); return; }
                if (zone) handleZoneDrop(data, zone);
            },
            onCancel: fin,
        });
    }
    // une tuile équivaut à sa zone englobante ; les zones d'insertion sont un cas à part
    function handleZoneDrop(data, zone) {
        if (zone.matches('.insert-zone')) {
            handleInsertDropAt(zone.dataset.side, zone.dataset.where, data);
            return;
        }
        processDrop(zone.dataset.path, data);
    }
    function flipEquation() {
        if (fige) return;
        const tmp = state.left;
        state.left = state.right;
        state.right = tmp;
        refreshView();
    }

    // ── Palette ──
    function countIdAnywhere(id) {
        function c(node) {
            if (!node) return 0;
            if (node.kind === 'simple') return node.items.filter(i => i.id === id).length;
            if (node.kind === 'frac') return c(node.num) + c(node.den);
            return node.slots.reduce((s, sl) => s + c(sl), 0);
        }
        return c(state.left) + c(state.right);
    }
    function addPaletteTile(t) {
        const el = document.createElement('div');
        el.className = 'palette-tile';
        el.innerHTML = t.label;
        enableTileDrag(el, { type:'tile', id:t.id, label:t.label });
        pal.appendChild(el);
    }
    function addFracPaletteTile() {
        const el = document.createElement('div');
        el.className = 'palette-tile palette-frac';
        el.title = 'Fraction';
        el.innerHTML = '<span class="dots">···</span><span class="frac-line"></span><span class="dots">···</span>';
        enableTileDrag(el, { type:'frac' });
        pal.appendChild(el);
    }
    function buildDrillPalette() {
        if (!pal) return;
        pal.innerHTML = '';
        (cfg.tiles || []).filter(t => REUSABLE_TILE_IDS.has(t.id) || countIdAnywhere(t.id) === 0).forEach(addPaletteTile);
        addFracPaletteTile();
        (cfg.paletteTiles || []).filter(t => REUSABLE_TILE_IDS.has(t.id) || countIdAnywhere(t.id) === 0).forEach(addPaletteTile);
    }

    // ── Recommencer, valider ──
    function resetDrill() {
        if (fige) return;
        if (window.DragDrop) DragDrop.cleanupGhosts();
        state = { left: cfg.left(), right: cfg.right() };
        activeHighlightId = cfg.highlight || null;
        api.effacer();
        refreshView();
    }
    function checkDrill() {
        if (fige || api.fini()) return;
        const result = cfg.check(state);
        if (result === true) {
            figer();
            api.reussi();
        } else if (result === 'partial') {
            api.message(`<span class="ep-partiel">✓ ${cfg.partialMessage || "C'est bon, mais ce n'est pas encore complet."}</span>`);
        } else {
            api.erreur((cfg.diag && cfg.diag(state)) || "Ce n'est pas encore ça, réessaie.");
        }
    }
    function figer() {
        fige = true;
        racine.classList.add('ep-fige');
        refreshView();
    }

    state = { left: cfg.left(), right: cfg.right() };
    activeHighlightId = cfg.highlight || null;
    refreshView();
    racine.ep = { etat: () => state, check: () => cfg.check(state) };   // (utile pour vérifier l'application)
    // « Afficher la réponse » : l'équation finale attendue
    return { montrer() { state = cfg.solution(); figer(); } };
}

// ═══════════════════════════════════════════════════════════════
// DIAGNOSTICS DES MANIPULATIONS
// ═══════════════════════════════════════════════════════════════
// emplacement d'une grandeur : 'right.0.num', 'right.1', 'left.0'… (null si absente)
function chemin(st, id) {
    function c(node, path) {
        if (node.kind === 'simple') return node.items.some(i => i.id === id) ? path : null;
        if (node.kind === 'frac') return c(node.num, path + '.num') || c(node.den, path + '.den');
        for (let i = 0; i < node.slots.length; i++) { const r = c(node.slots[i], path + '.' + i); if (r) return r; }
        return null;
    }
    return c(st.left, 'left') || c(st.right, 'right');
}
const dansFraction = p => !!p && /\.(num|den)$/.test(p);
// m et v² doivent être sortis de la fraction, du côté « cote » ('droite' ou 'gauche')
function diagSortie(st, cote) {
    const R = st.right, f = R.slots.find(s => s.kind === 'frac');
    if (f && f.num.items.length === 0) return 'Le numérateur laissé vide doit recevoir un 1 : glisse le 1 de la palette dans la case du haut.';
    const pm = chemin(st, 'm'), pv = chemin(st, 'v2');
    if ([pm, pv].some(dansFraction)) return `m et v² doivent sortir de la fraction : glisse-les dans la zone qui apparaît juste à ${cote} de la fraction pendant le glisser.`;
    const iFrac = R.slots.findIndex(s => s.kind === 'frac'), iTermes = R.slots.findIndex(s => s.kind === 'simple' && s.items.some(t => t.id === 'm' || t.id === 'v2'));
    if (iFrac >= 0 && iTermes >= 0 && (cote === 'droite') !== (iTermes > iFrac)) return `m et v² doivent aller à ${cote} de la fraction, pas de l'autre côté.`;
    return `À droite du signe =, il faut ${cote === 'droite' ? 'la fraction 1/2 suivie de m × v²' : 'm × v² suivi de la fraction 1/2'} (m et v² dans la même case). Clique sur ↺ Recommencer si besoin.`;
}

// ═══════════════════════════════════════════════════════════════
// LES MANIPULATIONS (dans l'ordre du cours)
// ═══════════════════════════════════════════════════════════════
const EC = tile('Ec','E<sub>c</sub>'), M = tile('m','m'), V2 = tile('v2','v²'), DEUX = tile('two','2'), ONE = tile('one','1');
// point de départ commun aux deux premières manipulations : Ec = 1/2 · m · v²,
// avec m et v² écrits à côté de la fraction 1/2
const m4TutStart = {
    left:  () => seq([simple([EC])]),
    right: () => seq([frac([ONE], [DEUX]), simple([M, V2])]),
};

// Entrer dans une fraction
const M_ENTRER = [
    {   titre: 'Faire entrer m et v² dans la fraction',
        instruction: "L'équation E<sub>c</sub> = 1/2 · m · v² est écrite avec m et v² à côté de la fraction. Déplace-les <b>dans</b> la fraction, au numérateur.",
        left:  m4TutStart.left,
        right: m4TutStart.right,
        check: (st) => {
            if (st.right.kind !== 'seq' || st.right.slots.length !== 1 || st.right.slots[0].kind !== 'frac') return false;
            if (!setEq(idsOf(st.right.slots[0].den.items), ['two'])) return false;
            const num = idsOf(st.right.slots[0].num.items);
            if (setEq(num, ['m','v2'])) return true;
            if (setEq(num, ['one','m','v2'])) return 'partial';
            return false;
        },
        partialMessage: "Le 1 qui était déjà là ne disparaît pas tout seul : il ne reste plus qu'à le retirer toi-même (clique sur sa croix).",
        diag: st => {
            const pm = chemin(st, 'm'), pv = chemin(st, 'v2');
            if ([pm, pv].some(p => p && p.endsWith('.den'))) return 'm et v² multiplient la fraction : ils vont au numérateur (au-dessus de la barre), pas au dénominateur.';
            if ([pm, pv].some(p => p && !p.endsWith('.num'))) return 'm et v² doivent tous les deux entrer dans la case du haut de la fraction, au-dessus de la barre.';
            return 'La fraction doit garder 2 au dénominateur, avec m et v² au numérateur ; rien d\'autre ne change. Clique sur ↺ Recommencer si besoin.';
        },
        solution: () => ({ left: seq([simple([EC])]), right: seq([frac([M, V2], [DEUX])]) }),
        explication: '<p>1/2 × m × v² = (1 × m × v²)/2 = (m × v²)/2 : le 1, devenu inutile, se retire.</p>',
    },
    {   titre: 'Créer une nouvelle fraction',
        instruction: "Repartons de la même équation. Cette fois, garde m et v² à côté de la fraction, mais fais l'inverse : utilise l'outil fraction (les pointillés ···) pour créer une nouvelle fraction avec m et v² au numérateur, puis fais glisser le 2 pour qu'il devienne le dénominateur de cette nouvelle fraction. Termine en supprimant les restes de l'ancienne fraction 1/2.",
        left:  m4TutStart.left,
        right: m4TutStart.right,
        showPalette: true,
        tiles: [],
        check: (st) => {
            if (st.right.kind !== 'seq' || st.right.slots.length !== 1 || st.right.slots[0].kind !== 'frac') return false;
            if (!setEq(idsOf(st.right.slots[0].num.items), ['m','v2'])) return false;
            const den = idsOf(st.right.slots[0].den.items);
            if (setEq(den, ['two'])) return true;
            if (setEq(den, ['one','two'])) return 'partial';
            return false;
        },
        partialMessage: "Il ne reste plus qu'à retirer le 1 devenu inutile au dénominateur de la nouvelle fraction (clique sur sa croix, sur la tuile).",
        diag: st => {
            const R = st.right;
            if (!R.slots.some(s => s.kind === 'frac' && s.num.items.some(t => t.id === 'm'))) return 'Glisse l\'outil fraction (···/···) de la palette sur la case de m et v² : ils deviennent le numérateur d\'une nouvelle fraction.';
            const p2 = chemin(st, 'two');
            if (!p2 || !p2.endsWith('.den') || !R.slots.some(s => s.kind === 'frac' && s.den.items.some(t => t.id === 'two') && s.num.items.some(t => t.id === 'm'))) return 'Le 2 doit aller au dénominateur (en bas) de la nouvelle fraction, sous m et v².';
            if (R.slots.length > 1) return 'Il doit rester une seule fraction : supprime les restes de l\'ancienne fraction 1/2 (le 1 et son dénominateur) avec leurs croix ✕.';
            return 'La nouvelle fraction doit avoir m et v² en haut et 2 en bas. Clique sur ↺ Recommencer si besoin.';
        },
        solution: () => ({ left: seq([simple([EC])]), right: seq([frac([M, V2], [DEUX])]) }),
        explication: '<p>On retrouve la même fraction (m × v²)/2 : l\'ancienne fraction 1/2 a disparu, son 2 est passé au dénominateur de la nouvelle.</p>',
    },
];

// Sortir d'une fraction
const M_SORTIR = [
    {   titre: 'Sortir m et v² à droite',
        instruction: "Cette fois, m et v² sont au numérateur de la fraction. Déplace-les <b>à droite</b> de la fraction (hors de la barre). Le numérateur laissé vide ne se remplit pas tout seul : va chercher un 1 dans la palette et glisse-le toi-même.",
        left:  () => seq([simple([EC])]),
        right: () => seq([frac([M, V2], [DEUX])]),
        showPalette: true,
        tiles: [ONE],
        check: (st) => st.right.kind === 'seq' && st.right.slots.length === 2
                    && st.right.slots[0].kind === 'frac' && setEq(idsOf(st.right.slots[0].num.items), ['one']) && setEq(idsOf(st.right.slots[0].den.items), ['two'])
                    && st.right.slots[1].kind === 'simple' && setEq(idsOf(st.right.slots[1].items), ['m','v2']),
        diag: st => diagSortie(st, 'droite'),
        solution: () => ({ left: seq([simple([EC])]), right: seq([frac([ONE], [DEUX]), simple([M, V2])]) }),
        explication: '<p>(m × v²)/2 = 1/2 × m × v² : le numérateur vidé reçoit un 1.</p>',
    },
    {   titre: 'Recopier l\'équation',
        instruction: "Recopie simplement l'équation E<sub>c</sub> = 1/2 · m · v² (tu peux placer m et v² au numérateur ou à côté de la fraction, comme tu préfères).",
        left:  () => emptySeq(),
        right: () => emptySeq(),
        showPalette: true,
        tiles: [EC, M, V2, DEUX, ONE],
        check: (st) => {
            if (isSlotEmpty(st.left) || isSlotEmpty(st.right)) return false;
            for (let i = 0; i < 5; i++) {
                const m = 0.5 + Math.random()*49.5, v = 1 + Math.random()*29;
                const values = { Ec: 0.5*m*v*v, m, v2: v*v, two: 2 };
                const l = evaluateNode(st.left, values), r = evaluateNode(st.right, values);
                if (!isFinite(l) || !isFinite(r) || Math.abs(l-r) > 1e-6*Math.max(1,Math.abs(r))) return false;
            }
            return true;
        },
        diag: st => (isSlotEmpty(st.left) || isSlotEmpty(st.right))
            ? 'Une case est encore vide : complète les deux membres de l\'équation (glisse E<sub>c</sub> à gauche, puis la fraction à droite).'
            : 'Cette équation n\'est pas E<sub>c</sub> = 1/2 × m × v² : vérifie que 2 est au dénominateur, et que m et v² sont au numérateur ou à côté de la fraction.',
        solution: () => ({ left: seq([simple([EC])]), right: seq([frac([M, V2], [DEUX])]) }),
        explication: '<p>E<sub>c</sub> = 1/2 × m × v² = (m × v²)/2 : les deux écritures sont justes.</p>',
    },
    {   titre: 'Sortir m et v² à gauche',
        instruction: "Ici encore, m et v² sont au numérateur de la fraction. Déplace-les <b>à gauche</b> de la fraction, cette fois. Là encore, le numérateur laissé vide ne se remplit pas tout seul : glisse toi-même un 1 depuis la palette.",
        left:  () => seq([simple([EC])]),
        right: () => seq([frac([M, V2], [DEUX])]),
        showPalette: true,
        tiles: [ONE],
        check: (st) => st.right.kind === 'seq' && st.right.slots.length === 2
                    && st.right.slots[0].kind === 'simple' && setEq(idsOf(st.right.slots[0].items), ['m','v2'])
                    && st.right.slots[1].kind === 'frac' && setEq(idsOf(st.right.slots[1].num.items), ['one']) && setEq(idsOf(st.right.slots[1].den.items), ['two']),
        diag: st => diagSortie(st, 'gauche'),
        solution: () => ({ left: seq([simple([EC])]), right: seq([simple([M, V2]), frac([ONE], [DEUX])]) }),
        explication: '<p>(m × v²)/2 = m × v² × 1/2 : un terme peut sortir avant ou après la fraction.</p>',
    },
];

// une manipulation = un item d'« À toi » (partie 'perso' : l'éditeur)
const manip = m => ({ titre: m.titre, enonce: `<p>${m.instruction}</p>`,
    parties: [{ type: 'perso', solution: m.explication, monter: (zone, api) => monterEditeur(zone, m, api) }] });

// ═══════════════════════════════════════════════════════════════
// LE COURS PAR ÉTAPES
// ═══════════════════════════════════════════════════════════════
const { exemple } = COURS;
const T = (id, label) => tile(id, label || id);
const fr = (a, b) => `<span class="som-fr"><span>${a}</span><span>${b}</span></span>`;
// exemple traité : l'équation avant et après la manipulation
const avantApres = (avant, op, apres) => `<div class="ep-avap">
    <div class="ep-av"><p class="ep-av-t">Avant</p>${avant}</div>
    <p class="ep-op">${op}</p>
    <div class="ep-av"><p class="ep-av-t">Après</p>${apres}</div></div>`;
const MODE_EMPLOI = `<div class="callout"><p><b>Dans l'éditeur.</b> Fais glisser une tuile (à la souris ou au doigt) pour la déplacer ; un appui sur une tuile ou sur sa croix ✕ la supprime ; ↺ Recommencer remet l'équation de départ. Clique sur <b>Valider</b> quand c'est fait.</p></div>`;

/* ---------- 1. Entrer dans une fraction ---------- */
function etape1(c) {
    const carte = c.carte('1. Faire entrer un terme dans une fraction');
    c.ajouter(carte, `<div class="cours-bloc">
        <p>Dans ce module, une équation peut comporter plus de deux zones : un terme peut être multiplié par une fraction. Or, placer un terme au numérateur d'une fraction (au-dessus de la barre) ou le placer juste à côté d'elle (avant ou après) revient exactement au même, puisque tout est multiplié.</p>
        <div class="cle"><p><b class="cle-titre">Règle.</b> Un terme qui multiplie une fraction peut entrer dans son numérateur : ${fr('1', '2')} × m × v² = ${fr('1 × m × v²', '2')} = ${fr('m × v²', '2')}.</p></div>
      </div>
      ${exemple(`<p>Dans x = ½ × a × t², on fait entrer a et t² dans la fraction :</p>
        ${avantApres(eqStat(seq([simple([T('x')])]), seq([frac([ONE], [DEUX]), simple([T('a'), T('t2', 't²')])])), 'a et t² au numérateur',
                     eqStat(seq([simple([T('x')])]), seq([frac([T('a'), T('t2', 't²')], [DEUX])])))}
        <p>Le 1 du numérateur, devenu inutile (1 × a × t² = a × t²), se retire : x = ${fr('a × t²', '2')}.</p>`)}
      ${MODE_EMPLOI}`);
    c.aToi(carte, M_ENTRER.map(manip));
    return carte;
}

/* ---------- 2. Sortir d'une fraction ---------- */
function etape2(c) {
    const carte = c.carte('2. Faire sortir un terme d\'une fraction');
    c.ajouter(carte, `<div class="cours-bloc">
        <p>Dans l'autre sens, un terme du numérateur peut sortir de la fraction et se placer juste avant ou juste après elle. Dès que tu commences à glisser un élément, une petite zone de dépose apparaît à côté de la fraction pour t'y déposer un terme.</p>
        <div class="cle"><p><b class="cle-titre">Règle.</b> Un terme du numérateur peut sortir à côté de la fraction (avant ou après). Si le numérateur se vide, on y écrit <b>1</b> : ${fr('m × v²', '2')} = ${fr('1', '2')} × m × v².</p></div>
      </div>
      ${exemple(`<p>Dans P = ${fr('U²', 'R')}, on fait sortir U² de la fraction, à droite :</p>
        ${avantApres(eqStat(seq([simple([T('P')])]), seq([frac([T('U2', 'U²')], [T('R')])])), 'U² sort à droite',
                     eqStat(seq([simple([T('P')])]), seq([frac([ONE], [T('R')]), simple([T('U2', 'U²')])])))}
        <p>Le numérateur vidé reçoit un 1 : P = ${fr('1', 'R')} × U².</p>`)}`);
    c.aToi(carte, M_SORTIR.map(manip));
    return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
    const carte = c.carte('À retenir');
    c.ajouter(carte, `<div class="cle"><p>Placer un terme au numérateur d'une fraction ou juste à côté d'elle (avant ou après) revient au même : tout est multiplié. Un numérateur vidé reçoit un 1.</p>
        <p class="crs-formule">E<sub>c</sub> = ${fr('1', '2')} × m × v² = ${fr('m × v²', '2')}</p></div>
      <div class="cle"><p>On applique ensuite les règles du module 1 : par exemple, pour isoler m, v² et 2 changent de côté.</p>
        <p class="crs-formule">m = ${fr('2 × E<sub>c</sub>', 'v²')}</p></div>
      <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_5.html">Entraînement →</a>
        <a class="btn-secondary" style="text-decoration:none" href="module_6.html">Module 3 : les + et les −</a>
        <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html">Fiche récapitulative</a></div>`);
    return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
</script>
