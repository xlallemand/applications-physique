<html lang="fr">
<head>

<style>
    :root {
        --app-accent-50:  #eef2ff;
        --app-accent-100: #e0e7ff;
        --app-accent-200: #c7d2fe;
        --app-accent-400: #818cf8;
        --app-accent-600: #4f46e5;
        --app-accent-700: #4338ca;
        --app-accent-800: #3730a3;
    }
    body { font-family: var(--font-sans); }

    .frac-wrap-static { display:inline-flex; flex-direction:column; align-items:center; margin:0 6px; vertical-align:middle; }
    .frac-num-static, .frac-den-static { padding:0 6px; }
    .frac-line-static { width:100%; height:2px; background:#1e293b; border-radius:2px; }
    .eq-tile-static { font-weight:700; color:#1e293b; margin:0 4px; }

    .eq-row { display:flex; align-items:center; justify-content:center; justify-content:safe center; flex-wrap:nowrap; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
    .eq-row::-webkit-scrollbar { height:4px; }
    .eq-side { display:flex; align-items:center; flex-shrink:0; }
    .eq-sign { font-size:1.8rem; font-weight:800; color:#1e3a8a; margin:0 16px; flex-shrink:0; }
    .eq-line-static { display:flex; align-items:center; justify-content:center; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }

    @media (max-width:480px) {
        .eq-tile, .eq-tile-frozen { font-size:.85rem; padding:7px 10px; }
        .eq-tile { min-height:36px; }
        .eq-sign { font-size:1.4rem; margin:0 8px; }
        .eq-tile-static { font-size:.9rem; }
        .flip-btn { width:36px; height:36px; font-size:1rem; margin-left:8px; }
    }

    .slot-simple {
        display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
        min-width:70px; min-height:56px; padding:8px 12px; position:relative;
        border:2px dashed #94a3b8; border-radius:10px; background:#fff; transition:all .2s;
    }
    .slot-simple.drag-over { background:#dbeafe; border-color:#3b82f6; }
    .slot-placeholder { color:#94a3b8; font-weight:700; font-size:1.1rem; }

    .eq-tile {
        display:inline-flex; align-items:center; gap:6px; position:relative;
        background:#dbeafe; border:2px solid #60a5fa; border-radius:8px;
        padding:9px 13px; min-height:40px; font-weight:700; color:#1e3a8a; cursor:grab; touch-action:none;
    }
    .eq-tile.dragging { opacity:.4; }
    .eq-tile.tile-highlight { background:#fee2e2; border-color:#ef4444; color:#991b1b; box-shadow:0 0 0 3px rgba(239,68,68,.25); }
    .eq-tile.drag-over { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.35); }
    .mult-sign { display:inline-block; font-weight:800; color:#64748b; margin:0 3px; font-size:1rem; flex-shrink:0; }
    .tile-del {
        width:16px; height:16px; border-radius:50%; background:#ef4444; color:#fff;
        font-size:10px; line-height:16px; text-align:center; cursor:pointer;
    }

    .frac-wrap { display:inline-flex; flex-direction:column; align-items:center; gap:4px; position:relative; margin:0 8px; flex-shrink:0; }
    .frac-num-wrap, .frac-den-wrap { position:relative; }
    .frac-den-wrap.den-draggable { cursor:grab; touch-action:none; border-radius:8px; }
    .frac-den-wrap.den-draggable:hover { background:rgba(79,70,229,.08); }
    .frac-den-wrap.dragging { opacity:.4; }
    .frac-line { width:100%; height:3px; background:#1e293b; border-radius:2px; }
    .frac-del {
        position:absolute; top:-9px; right:-9px; width:20px; height:20px; border-radius:50%;
        background:#ef4444; color:#fff; font-size:11px; line-height:16px; text-align:center;
        cursor:pointer; border:2px solid #fff; z-index:1;
    }

    .flip-btn {
        width:44px; height:44px; border-radius:50%; background:#eef2ff; border:2px solid #818cf8;
        color:#312e81; font-size:1.3rem; font-weight:800; margin-left:12px; flex-shrink:0;
    }
    .flip-btn:hover { background:#e0e7ff; }

    .eq-tile-frozen { display:inline-flex; align-items:center; background:#f1f5f9; border:2px solid #cbd5e1; border-radius:8px; padding:6px 10px; font-weight:700; color:#334155; margin:0 3px; }
    .step-row { border-bottom:1px dashed #e2e8f0; }

    .palette-tile {
        display:inline-flex; align-items:center; justify-content:center;
        min-width:56px; min-height:44px; padding:8px 14px;
        background:#eef2ff; border:2px solid #818cf8; border-radius:10px;
        font-weight:700; color:#312e81; cursor:grab; touch-action:none; user-select:none;
    }
    .palette-tile.dragging { opacity:.4; }
    .palette-frac { display:inline-flex; flex-direction:column; align-items:center; padding:6px 12px; }
    .palette-frac .dots { font-size:.8rem; letter-spacing:2px; color:#312e81; }
    .palette-frac .frac-line { width:28px; height:2px; margin:2px 0; background:#312e81; }
    .palette-tile.func-tool { background:#fef3c7; border-color:#f59e0b; color:#78350f; }
    #currentStepZone.drag-over { background:#dbeafe !important; border-color:#3b82f6 !important; }

    .content-module-badge {
        display:inline-block; background:#4f46e5; color:#fff; font-size:.75rem; font-weight:800;
        padding:4px 12px; border-radius:999px; letter-spacing:.05em; margin-bottom:8px;
    }
    .rule-card { background:#f8fafc; border:2px solid #e2e8f0; border-radius:12px; padding:16px; }

    .progress-bar-outer { background:#e2e8f0; border-radius:999px; height:10px; overflow:hidden; }
    .progress-bar-inner { background:#4f46e5; height:100%; transition:width .3s; }

    .unit-legend { font-size:.85rem; color:#64748b; margin-top:6px; }
    .score-badge { font-weight:800; color:#4f46e5; }

    .recap-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(52px,1fr)); gap:6px; }
    .recap-item { background:#f1f5f9; border-radius:8px; padding:5px 2px; text-align:center; font-size:.7rem; line-height:1.3; color:#334155; }
    .recap-item b { display:block; font-size:.85rem; }

    .confetti-piece {
        position:fixed; top:-20px; width:9px; height:14px; z-index:9999; pointer-events:none;
        animation:confetti-fall linear forwards;
    }
    @keyframes confetti-fall {
        to { top:110vh; transform:translateY(0) rotate(720deg); }
    }
    .insert-zone {
        width:34px; min-height:56px; border:2px dashed #94a3b8; border-radius:8px;
        opacity:0; transition:opacity .15s; flex-shrink:0;
    }
    .insert-zone.drag-over { background:#dbeafe; border-color:#3b82f6; opacity:1; }
    body.dnd-active .insert-zone { opacity:.55; }

    .sum-wrap { display:inline-flex; align-items:center; gap:2px; flex-shrink:0; }
    .sum-parens { font-size:1.5rem; font-weight:800; color:#64748b; }
    .sum-term { display:inline-flex; align-items:center; gap:4px; border-radius:10px; padding:2px; touch-action:none; }
    .sum-term.term-draggable { cursor:grab; }
    .sum-term.term-draggable:hover { background:rgba(79,70,229,.08); }
    .sum-term.dragging { opacity:.4; }
    .sum-sign { font-weight:800; color:#1e3a8a; font-size:1.2rem; display:inline-block; }
    @keyframes signFlip {
        0%   { transform:rotateY(-170deg) scale(1.3); color:#ef4444; }
        55%  { transform:rotateY(-90deg) scale(1.3); color:#ef4444; }
        100% { transform:rotateY(0deg) scale(1); }
    }
    .sum-sign.just-flipped { animation: signFlip 0.9s ease; }
    body.sumterm-dragging .eq-side[data-path="left"], body.sumterm-dragging .eq-side[data-path="right"],
    body.fracden-dragging .eq-side[data-path="left"], body.fracden-dragging .eq-side[data-path="right"] {
        outline: 3px dashed #f59e0b; outline-offset: 5px; border-radius: 10px;
        background: rgba(245,158,11,.06); padding: 10px 20px;
    }
    body.sumterm-dragging .eq-side.drag-over, body.fracden-dragging .eq-side.drag-over { background: rgba(245,158,11,.16); border-radius: 10px; }
    .eq-side.sumterm-source { outline:none !important; background:none !important; }

    /* ── Fonctions et leur réciproque ── */
    .func-wrap { display:inline-flex; align-items:center; margin:0 6px; }
    .func-name { font-weight:800; color:#1e293b; margin-right:2px; }
    .func-exp { font-weight:800; color:#1e293b; font-size:.75em; margin-left:1px; align-self:flex-start; }
    .pow-base { font-weight:800; color:#1e293b; font-size:1.15em; }
    .func-wrap.pow-wrap { align-items:flex-start; }
    .func-exp-inner { font-size:.72em; display:inline-flex; margin-top:-6px; }
    .func-exp-inner .slot-simple { min-height:36px; padding:5px 8px; }
    .func-exp-inner .eq-tile, .func-exp-inner .eq-tile-frozen { padding:6px 9px; min-height:32px; }
    .sqrt-wrap { display:inline-flex; align-items:flex-end; margin:0 6px; }
    .sqrt-hook { display:block; flex-shrink:0; }
    .sqrt-inner { border-top:3px solid #1e293b; padding:2px 6px 0; display:inline-flex; align-items:center; }
    .inline-frac { display:inline-flex; align-items:center; gap:3px; }
    .inline-frac-slash { font-weight:800; color:#1e293b; margin:0 1px; }
</style>

<script>

const nav = AppNav.init({
    appName: 'Équations en Physique',
    portalHref: '../../index.html',
    portalLabel: 'Toutes les applications',
    onHome: () => { window.location.href = '../index.html'; },
    onNavigate: (key) => { window.location.href = key + '.html'; },
    groups: [
        { title: 'Principe', items: [
            { key: 'module_1', label: 'Module 1 : Méthode' },
            { key: 'module_2', label: "Module 2 : Exemple d'application" },
            { key: 'module_3', label: 'Module 3 : Entraînement' },
        ]},
        { title: 'Gestion des fractions', items: [
            { key: 'module_4', label: 'Module 4 : Méthode' },
            { key: 'module_5', label: 'Module 5 : Entraînement' },
        ]},
        { title: 'Gérer les + et les -', items: [
            { key: 'module_6', label: 'Module 6 : Méthode' },
            { key: 'module_7', label: 'Module 7 : Entraînement' },
        ]},
        { title: 'Gérer les fonctions réciproques', items: [
            { key: 'module_8', label: 'Module 8 : Méthode' },
            { key: 'module_9', label: 'Module 9 : Entraînement' },
        ]},
    ],
});
nav.setActive('module_9');
nav.setTitle('Module 9 : Entraînement');

// ═══════════════════════════════════════════════════════════════
// OUTILS DE CONSTRUCTION DE NŒUDS
// {kind:'seq', slots:[...]} produit de zones multipliées entre elles
// {kind:'simple', items:[...]} zone plate (tuiles + opérateurs)
// {kind:'frac', num, den} fraction (num/den peuvent être n'importe quel noeud)
// {kind:'sum', terms:[{sign, node:seq}]} somme signée de termes
// {kind:'func', fn, inner} fonction appliquée à un membre (racine, carré,
//   cube, racine cubique, sinus, sinus réciproque, log, 10^, ln, exp)
// ═══════════════════════════════════════════════════════════════
function tile(id,label){ return {id,label}; }
function simple(items){ return { kind:'simple', items: items.map(t => ({...t})) }; }
function frac(num, den){ return { kind:'frac', num: Array.isArray(num) ? simple(num) : num, den: Array.isArray(den) ? simple(den) : den }; }
function seq(slots){ return { kind:'seq', slots }; }
function emptySeq(){ return seq([simple([])]); }
function term1(sign, slots){ return { sign, node: seq(slots) }; }
function sumNode(terms){ return { kind:'sum', terms: terms.map(t => ({ sign:t.sign, node:t.node })) }; }
function func(fn, inner){ return { kind:'func', fn, inner }; }
function idsOf(items){ return items.map(i => i.id); }

const RECIPROCAL = { sqrt:'sq', sq:'sqrt', cube:'cbrt', cbrt:'cube', sin:'asin', asin:'sin', log:'pow10', pow10:'log', ln:'exp', exp:'ln' };
const FUNC_TOOL_LABEL = { sqrt:'√', sq:'x²', cube:'x³', cbrt:'∛', sin:'sin', asin:'sin⁻¹', log:'log', pow10:'10ˣ', ln:'ln', exp:'eˣ' };

function staticFracHtml(num, den) {
    return `<span class="frac-wrap-static"><span class="frac-num-static">${num}</span><span class="frac-line-static"></span><span class="frac-den-static">${den}</span></span>`;
}

// ═══════════════════════════════════════════════════════════════
// ÉTAT GLOBAL
// ═══════════════════════════════════════════════════════════════
let state = { left: emptySeq(), right: emptySeq() };
let history = [];
let resolved = false;
let stepOneValidated = false;
let currentExercise = null;
let hadError = false;
let activeHighlightId = null;
let lastMovedTerm = null;

function getNode(path) {
    const parts = path.split('.');
    let cur = parts[0] === 'left' ? state.left : state.right;
    for (let i = 1; i < parts.length; i++) {
        if (!cur) return null;
        const p = parts[i];
        if (/^term\d+$/.test(p)) cur = cur.terms[+p.slice(4)].node;
        else if (/^\d+$/.test(p)) cur = cur.slots ? cur.slots[+p] : undefined;
        else cur = cur[p];
    }
    return cur || null;
}
function setNode(path, newNode) {
    const parts = path.split('.');
    if (parts.length === 1) { state[parts[0]] = newNode; return; }
    const parent = getNode(parts.slice(0, -1).join('.'));
    const last = parts[parts.length - 1];
    if (/^term\d+$/.test(last)) parent.terms[+last.slice(4)].node = newNode;
    else if (/^\d+$/.test(last)) parent.slots[+last] = newNode;
    else parent[last] = newNode;
}

// ═══════════════════════════════════════════════════════════════
// AFFICHAGE
// ═══════════════════════════════════════════════════════════════
function isOperatorTile(it) { return it.id === 'plus' || it.id === 'minus' || it.id === 'times'; }
function renderInsertZone(sidePath, where) {
    return `<div class="insert-zone" data-side="${sidePath}" data-where="${where}"></div>`;
}
function isSumIsolated(sumPath) {
    const parentPath = sumPath.split('.').slice(0, -1).join('.');
    const parent = getNode(parentPath);
    return !!(parent && parent.kind === 'seq' && parent.slots.length === 1);
}
function denHasRealContent(node) {
    if (isSlotEmpty(node.den)) return false;
    if (node.den.kind === 'simple' && node.den.items.length === 1 && node.den.items[0].id === 'one') return false;
    return true;
}
// contenu d'une fonction (racine, carré, log...) : toujours figé (une seule
// entité, non démontable tant que la fonction n'est pas retirée) ; une
// fraction s'y affiche en ligne (num/den, à n'importe quelle profondeur) pour
// tenir sur une seule ligne, et une somme à plusieurs termes reçoit des
// parenthèses quand demandé
function renderInlineNode(node) {
    if (node.kind === 'frac') {
        return `<span class="inline-frac">${renderInlineNode(node.num)}<span class="inline-frac-slash">/</span>${renderInlineNode(node.den)}</span>`;
    }
    if (node.kind === 'sum') {
        const inner = node.terms.map((t, i) => {
            const showSign = i > 0 || t.sign === -1;
            const signChar = t.sign === -1 ? '−' : '+';
            return (showSign ? `<span class="sum-sign">${signChar}</span>` : '') + renderInlineNode(t.node);
        }).join('');
        return `<span class="sum-wrap">${inner}</span>`;
    }
    if (node.kind === 'seq') {
        return node.slots.map((s, i) => (i === 0 ? '' : '<span class="mult-sign">×</span>') + renderInlineNode(s)).join('');
    }
    return renderStatic(node);
}
function renderFuncInner(inner, parensIfSum) {
    let n = inner;
    while (n.kind === 'seq' && n.slots.length === 1) n = n.slots[0];
    const html = renderInlineNode(n);
    if (parensIfSum && n.kind === 'sum' && n.terms.length > 1) {
        return `<span class="sum-parens">(</span>${html}<span class="sum-parens">)</span>`;
    }
    return html;
}
function renderNode(node, path) {
    if (node.kind === 'simple') {
        const items = node.items.map((it, idx) => {
            const hl = (activeHighlightId && it.id === activeHighlightId) ? ' tile-highlight' : '';
            const sep = (idx > 0 && !isOperatorTile(node.items[idx-1]) && !isOperatorTile(it)) ? '<span class="mult-sign">×</span>' : '';
            return sep + `<span class="eq-tile${hl}" data-path="${path}" data-idx="${idx}">
                ${it.label}<span class="tile-del"
                    onpointerdown="event.stopPropagation()"
                    onclick="event.stopPropagation();deleteItem('${path}',${idx})">✕</span>
            </span>`;
        }).join('');
        return `<div class="slot-simple" data-path="${path}">
                    ${items || '<span class="slot-placeholder">…</span>'}
                </div>`;
    }
    if (node.kind === 'frac') {
        const showDenCross = (node.den.kind === 'simple' && node.den.items.length === 1 && node.den.items[0].id === 'one')
            || (isSlotEmpty(node.den) && node.forceDenCross);
        const draggableDen = denHasRealContent(node);
        return `<div class="frac-wrap">
            <div class="frac-num-wrap">${renderNode(node.num, path + '.num')}</div>
            <div class="frac-line"></div>
            <div class="frac-den-wrap${draggableDen ? ' den-draggable' : ''}" data-frac-path="${path}">
                ${showDenCross ? `<span class="frac-del"
                    onclick="deleteDen('${path}')"
                    ontouchstart="event.stopPropagation()"
                    ontouchend="event.stopPropagation();event.preventDefault();deleteDen('${path}')"
                    title="Supprimer le dénominateur">✕</span>` : ''}
                ${renderNode(node.den, path + '.den')}
            </div>
        </div>`;
    }
    if (node.kind === 'sum') {
        const isolated = isSumIsolated(path);
        const inner = node.terms.map((t, i) => {
            const showSign = i > 0 || t.sign === -1;
            const signChar = t.sign === -1 ? '−' : '+';
            const signHtml = showSign ? `<span class="sum-sign" data-sum-path="${path}" data-term-idx="${i}">${signChar}</span>` : '';
            return `<span class="sum-term${isolated ? ' term-draggable' : ''}" data-path="${path}" data-term-idx="${i}">${signHtml}${renderNode(t.node, path + '.term' + i)}</span>`;
        }).join('');
        return `<span class="sum-wrap" data-path="${path}">${inner}</span>`;
    }
    if (node.kind === 'func') {
        if (node.fn === 'sqrt') return `<div class="sqrt-wrap"><svg class="sqrt-hook"></svg><div class="sqrt-inner">${renderFuncInner(node.inner, false)}</div></div>`;
        if (node.fn === 'sq')   return `<span class="func-wrap">${renderFuncInner(node.inner, true)}<sup class="func-exp">2</sup></span>`;
        if (node.fn === 'cube') return `<span class="func-wrap">${renderFuncInner(node.inner, true)}<sup class="func-exp">3</sup></span>`;
        if (node.fn === 'cbrt') return `<span class="func-wrap"><span class="func-name">∛</span>(${renderFuncInner(node.inner, false)})</span>`;
        if (node.fn === 'pow10') return `<span class="func-wrap pow-wrap"><span class="pow-base">10</span><sup class="func-exp-inner">${renderFuncInner(node.inner, true)}</sup></span>`;
        if (node.fn === 'exp')   return `<span class="func-wrap pow-wrap"><span class="pow-base">e</span><sup class="func-exp-inner">${renderFuncInner(node.inner, true)}</sup></span>`;
        const label = { log:'log', ln:'ln', sin:'sin', asin:'sin<sup>−1</sup>' }[node.fn];
        return `<span class="func-wrap"><span class="func-name">${label}</span>(${renderFuncInner(node.inner, false)})</span>`;
    }
    // seq
    let html = '';
    const n = node.slots.length;
    const needsInsertBefore = node.slots[0].kind === 'frac' || node.slots[0].kind === 'sum';
    const needsInsertAfter  = node.slots[n-1].kind === 'frac' || node.slots[n-1].kind === 'sum';
    if (needsInsertBefore) html += renderInsertZone(path, 'start');
    if (node.parenthesized) html += '<span class="sum-parens">(</span>';
    node.slots.forEach((slot, i) => {
        if (i > 0) html += '<span class="mult-sign">×</span>';
        const parens = !node.parenthesized && slot.kind === 'sum' && slot.terms.length > 1 && n > 1;
        html += parens ? `<span class="sum-parens">(</span>${renderNode(slot, path + '.' + i)}<span class="sum-parens">)</span>` : renderNode(slot, path + '.' + i);
    });
    if (node.parenthesized) html += '<span class="sum-parens">)</span>';
    if (needsInsertAfter) html += renderInsertZone(path, 'end');
    return `<div class="eq-side" data-path="${path}">${html}</div>`;
}
function renderStatic(node) {
    if (node.kind === 'simple') {
        if (node.items.length === 0) return '<span class="slot-placeholder">…</span>';
        return node.items.map((it, idx) => {
            const sep = (idx > 0 && !isOperatorTile(node.items[idx-1]) && !isOperatorTile(it)) ? '<span class="mult-sign">×</span>' : '';
            return sep + `<span class="eq-tile-frozen">${it.label}</span>`;
        }).join('');
    }
    if (node.kind === 'frac') {
        return `<div class="frac-wrap">
            <div class="frac-num-wrap">${renderStatic(node.num)}</div>
            <div class="frac-line"></div>
            <div class="frac-den-wrap">${renderStatic(node.den)}</div>
        </div>`;
    }
    if (node.kind === 'sum') {
        const inner = node.terms.map((t, i) => {
            const showSign = i > 0 || t.sign === -1;
            const signChar = t.sign === -1 ? '−' : '+';
            return (showSign ? `<span class="sum-sign">${signChar}</span>` : '') + renderStatic(t.node);
        }).join('');
        return `<span class="sum-wrap">${inner}</span>`;
    }
    if (node.kind === 'func') {
        if (node.fn === 'sqrt') return `<div class="sqrt-wrap"><svg class="sqrt-hook"></svg><div class="sqrt-inner">${renderFuncInner(node.inner, false)}</div></div>`;
        if (node.fn === 'sq')   return `<span class="func-wrap">${renderFuncInner(node.inner, true)}<sup class="func-exp">2</sup></span>`;

function pruneEmptySlot(path) {
    const parts = path.split('.');
    if (parts.length !== 2) return;
    const side = getNode(parts[0]);
    const idx = +parts[1];
    const slot = side.slots[idx];
    if (slot && slot.kind === 'simple' && slot.items.length === 0 && side.slots.length > 1) {

}
function applyEmptinessRuleFrac(path, removedId) {

        const fracPath = path.slice(0, -4);

        if (removedId === 'one') setNode(fracPath, fracNode.num);

    }
}
function deleteDen(fracPath) {

    setNode(fracPath, fracNode.num);
    refreshView();
}

}
function processDrop(path, data) {
    if (data.type === 'frac') {
        const node = getNode(path);
        if (!node) return;
        if (node.kind === 'simple') {
            const f = frac(node.items, []);
            f.forceDenCross = true;
            setNode(path, f);
        } else if (node.kind === 'seq' && node.parenthesized) {
            const inner = node.slots.length === 1 ? node.slots[0] : seq(node.slots.slice());
            node.slots = [ { kind:'frac', num: inner, den: simple([]), forceDenCross:true } ];
        } else {
            return;
        }
        refreshView();
        return;
    }
    const node = getNode(path);
    if (!node || node.kind !== 'simple') return;
    if (data.type === 'move') {
        if (data.from === path) { refreshView(); return; }
        const src = getNode(data.from);
        if (src && src.items[data.idx] && src.items[data.idx].id === data.id) {
            const removedId = src.items[data.idx].id;
            src.items.splice(data.idx, 1);
            if (src.items.length === 0) handleEmptied(data.from, removedId);
        }
    }
    node.items.push({ id: data.id, label: data.label });
    refreshView();
}
function handleInsertDropAt(sidePath, where, data) {
    if (!data || data.type !== 'move') return;
    const side = getNode(sidePath);
    if (!side || side.kind !== 'seq') return;
    const src = getNode(data.from);
    if (src && src.items[data.idx] && src.items[data.idx].id === data.id) {
        const removedId = src.items[data.idx].id;
        src.items.splice(data.idx, 1);
        if (src.items.length === 0) handleEmptied(data.from, removedId);
    }
    const newSlot = simple([{ id: data.id, label: data.label }]);
    if (where === 'start') side.slots.unshift(newSlot); else side.slots.push(newSlot);
    refreshView();
}
function deleteItem(path, idx) {
    const node = getNode(path);
    if (!node || node.kind !== 'simple') return;
    const removed = node.items[idx];
    if (!removed) return;
    node.items.splice(idx, 1);
    if (node.items.length === 0) handleEmptied(path, removed.id);
    refreshView();
}
function enableTileDrag(el, data, onTap) {
    let startX = 0, startY = 0;
    el.addEventListener('pointerdown', e => { startX = e.clientX; startY = e.clientY; });
    DragDrop.enable(el, {
        zoneSelector: '.eq-tile, .slot-simple, .insert-zone, .eq-side, .sum-term',
        dragOverClass: 'drag-over',
        onStart: () => {
            if (data.type === 'sumterm' || data.type === 'fracden') {
                document.body.classList.add(data.type === 'sumterm' ? 'sumterm-dragging' : 'fracden-dragging');
                const fromSide = data.from.split('.')[0];
                const src = document.querySelector(`.eq-side[data-path="${fromSide}"]`);
                if (src) src.classList.add('sumterm-source');
            }
        },
        onDrop: (item, zone, evt) => {
            if (data.type === 'sumterm' || data.type === 'fracden') {
                document.body.classList.remove('sumterm-dragging');
                document.body.classList.remove('fracden-dragging');
                document.querySelectorAll('.eq-side.sumterm-source').forEach(e => e.classList.remove('sumterm-source'));
            }
            const moved = Math.hypot(evt.clientX - startX, evt.clientY - startY) > 8;
            if (onTap && !moved) { onTap(); return; }
            if (zone) handleZoneDrop(data, zone);
        },
        onCancel: () => {
            if (data.type === 'sumterm' || data.type === 'fracden') {
                document.body.classList.remove('sumterm-dragging');
                document.body.classList.remove('fracden-dragging');

}
function handleZoneDrop(data, zone) {
    if (data.type === 'sumterm') {
        const side = zone.closest('.eq-side');
        if (side) processSumTermDrop(side.dataset.path, data);
        return;
    }
    if (data.type === 'fracden') {
        const side = zone.closest('.eq-side');
        if (side) processFracDenDrop(data.from, side.dataset.path);
        return;
    }
    if (data.type === 'paren') {
        const side = zone.closest('.eq-side');
        if (side) processParenDrop(side.dataset.path);
        return;
    }
    if (zone.matches('.insert-zone')) {
        handleInsertDropAt(zone.dataset.side, zone.dataset.where, data);
        return;
    }
    processDrop(zone.dataset.path, data);
}
function flipEquation() {
    if (resolved) return;
    const tmp = state.left;
    state.left = state.right;
    state.right = tmp;

}
function removeSumTerm(sumPath, termIdx) {
    const sum = getNode(sumPath);
    if (!sum || sum.kind !== 'sum') return null;
    const [removed] = sum.terms.splice(termIdx, 1);
    if (sum.terms.length === 1 && sum.terms[0].sign === 1) {
        let repl = sum.terms[0].node;
        while (repl.kind === 'seq' && repl.slots.length === 1) repl = repl.slots[0];

}
function processSumTermDrop(sidePath, data) {
    if (sidePath !== 'left' && sidePath !== 'right') return;
    if (data.from === sidePath) { refreshView(); return; }
    const removed = removeSumTerm(data.from, data.termIdx);
    if (!removed) return;
    const flipped = { sign: -removed.sign, node: removed.node };
    const destSide = getNode(sidePath);
    let destTermIdx;
    if (destSide.slots.length === 1 && destSide.slots[0].kind === 'sum') {
        destSide.slots[0].terms.push(flipped);
        destTermIdx = destSide.slots[0].terms.length - 1;
    } else {
        const wrapped = sumNode([{ sign:1, node: seq(destSide.slots) }, flipped]);

// "multiplie les deux côtés par le dénominateur" : on retire le dénominateur

function processFracDenDrop(fracPath, destSidePath) {
    if (destSidePath !== 'left' && destSidePath !== 'right') return;
    const fracNode = getNode(fracPath);
    if (!fracNode || fracNode.kind !== 'frac' || !denHasRealContent(fracNode)) return;
    const denContent = fracNode.den;
    // le dénominateur reste affiché, vide, avec une croix : il n'est pas
    // supprimé automatiquement (l'élève clique la croix s'il veut la fraction
    // en moins, comme partout ailleurs dans l'application)
    fracNode.den = simple([]);
    fracNode.forceDenCross = true;
    const dest = getNode(destSidePath);
    const newSlot = denContent.kind === 'seq' ? (denContent.slots.length === 1 ? denContent.slots[0] : seq(denContent.slots.slice())) : denContent;

function processParenDrop(sidePath) {

function negateBothSides() {

        const s = getNode(sidePath);
        if (s.slots.length === 1 && s.slots[0].kind === 'sum') {
            s.slots[0].terms.forEach(t => { t.sign = -t.sign; });
            if (s.slots[0].terms.length === 1 && s.slots[0].terms[0].sign === 1) {
                let repl = s.slots[0].terms[0].node;
                while (repl.kind === 'seq' && repl.slots.length === 1) repl = repl.slots[0];
                s.slots[0] = repl;

function countIdAnywhere(id) {
    function c(node) {
        if (!node) return 0;
        if (node.kind === 'simple') return node.items.filter(i => i.id === id).length;
        if (node.kind === 'func') return c(node.inner);
        if (node.kind === 'frac') return c(node.num) + c(node.den);
        if (node.kind === 'sum') return node.terms.reduce((s, t) => s + c(t.node), 0);
        return node.slots.reduce((s, sl) => s + c(sl), 0);
    }

}

// ÉVALUATION ALGÉBRIQUE
// ═══════════════════════════════════════════════════════════════
function tokenValue(id, v) {
    if (id === 'one') return 1;
    return (v && id in v) ? v[id] : NaN;
}
function evaluateNode(node, v) {
    if (node.kind === 'func') {
        const x = evaluateNode(node.inner, v);
        switch (node.fn) {
            case 'sqrt': return Math.sqrt(x);
            case 'sq': return x * x;
            case 'cube': return x * x * x;
            case 'cbrt': return Math.cbrt(x);
            case 'sin': return Math.sin(x);
            case 'asin': return Math.asin(x);
            case 'log': return Math.log10(x);
            case 'pow10': return Math.pow(10, x);
            case 'ln': return Math.log(x);
            case 'exp': return Math.exp(x);
        }
        return NaN;
    }
    if (node.kind === 'seq') return node.slots.reduce((p, s) => p * evaluateNode(s, v), 1);
    if (node.kind === 'frac') return evaluateNode(node.num, v) / evaluateNode(node.den, v);
    if (node.kind === 'sum') return node.terms.reduce((s, t) => s + t.sign * evaluateNode(t.node, v), 0);
    if (node.items.length === 0) return NaN;
    let terms = [], termValue = 1, sign = 1;
    node.items.forEach(it => {
        if (it.id === 'plus')       { terms.push(sign * termValue); termValue = 1; sign = 1; }
        else if (it.id === 'minus') { terms.push(sign * termValue); termValue = 1; sign = -1; }
        else if (it.id === 'times') { /* juxtaposition = produit */ }
        else termValue *= tokenValue(it.id, v);
    });
    terms.push(sign * termValue);
    return terms.reduce((s, t) => s + t, 0);
}
function isSlotEmpty(node) {
    if (node.kind === 'simple') return node.items.length === 0;
    if (node.kind === 'func') return isSlotEmpty(node.inner);
    if (node.kind === 'frac') return isSlotEmpty(node.num) || isSlotEmpty(node.den);
    if (node.kind === 'sum') return node.terms.some(t => isSlotEmpty(t.node));
    return node.slots.some(isSlotEmpty);
}
function countOnesIn(node) {
    if (node.kind === 'simple') return node.items.filter(i => i.id === 'one').length;
    if (node.kind === 'func') return countOnesIn(node.inner);
    if (node.kind === 'frac') return countOnesIn(node.num) + countOnesIn(node.den);
    if (node.kind === 'sum') return node.terms.reduce((s, t) => s + countOnesIn(t.node), 0);
    return node.slots.reduce((s, sl) => s + countOnesIn(sl), 0);
}
function isFullyIsolatedSeq(node, targetId) {
    return node && node.kind === 'seq' && node.slots.length === 1
        && node.slots[0].kind === 'simple' && node.slots[0].items.length === 1
        && node.slots[0].items[0].id === targetId;
}
function isIsolatedSeq(node, targetId) {
    if (!node || node.kind !== 'seq' || node.slots.length !== 1) return false;
    const s = node.slots[0];
    if (s.kind === 'simple') return s.items.length === 1 && s.items[0].id === targetId;
    if (s.kind === 'frac') return s.num.kind === 'simple' && s.num.items.length === 1 && s.num.items[0].id === targetId
        && s.den.kind === 'simple' && s.den.items.length === 1 && s.den.items[0].id === 'one';
    return false;
}

    <div id="doneMsg" class="hidden text-center text-xl font-bold text-green-600 py-6"></div>
    <div id="feedback" class="text-center mt-4 font-semibold text-lg"></div>`;
}
function startSolveExercise(cfg) {
    if (window.DragDrop) DragDrop.cleanupGhosts();
    currentExercise = cfg;
    state = { left: cfg.initialLeft(), right: cfg.initialRight() };
    history = [];
    stepOneValidated = true;
    resolved = false;
    hadError = false;
    activeHighlightId = null;
    refreshView();
    renderHistory();
}
function resetSolveExercise() {
    if (window.DragDrop) DragDrop.cleanupGhosts();
    if (!currentExercise) return;
    state = { left: currentExercise.initialLeft(), right: currentExercise.initialRight() };
    history = [];
    stepOneValidated = true;
    resolved = false;
    activeHighlightId = null;
    refreshView();
    renderHistory();
    showFeedback('', false);
}
function verifyStep() {
    if (isSlotEmpty(state.left) || isSlotEmpty(state.right)) {
        showFeedback("✕ Complète les deux membres de l'équation avant de vérifier.", false);
        hadError = true;
        return;
    }
    let equationTrue = true;
    for (let i = 0; i < 5 && equationTrue; i++) {
        const v = currentExercise.sample();
        const l = evaluateNode(state.left, v);
        const r = evaluateNode(state.right, v);
        if (!isFinite(l) || !isFinite(r) || Math.abs(l - r) > 1e-6 * Math.max(1, Math.abs(r))) equationTrue = false;
    }
    if (!equationTrue) {
        showFeedback("✕ Cette équation n'est pas correcte : vérifie tes calculs.", false);
        hadError = true;
        return;
    }
    history.push(JSON.parse(JSON.stringify(state)));
    renderHistory();
    stepOneValidated = true;

    const target = currentExercise.targetId;
    const leftFull  = isFullyIsolatedSeq(state.left, target);
    const rightFull = !leftFull && isFullyIsolatedSeq(state.right, target);
    const leftLoose  = !leftFull && isIsolatedSeq(state.left, target);
    const rightLoose = !rightFull && !leftLoose && isIsolatedSeq(state.right, target);

    const onesTotal = countOnesIn(state.left) + countOnesIn(state.right);
    const onesElsewhere = onesTotal - (leftLoose ? 1 : 0) - (rightLoose ? 1 : 0);
    const complete = leftFull && onesElsewhere === 0;

    if (complete) {
        resolved = true;
        document.getElementById('workZone').classList.add('hidden');
        const dm = document.getElementById('doneMsg');
        dm.classList.remove('hidden');
        showFeedback('', true);
        if (currentExercise.onSolved) currentExercise.onSolved(dm);
        else dm.innerHTML = '🎉 Équation résolue !';
    } else {
        let msg;
        if (rightFull) {
            msg = "✓ Étape correcte ! Il ne reste plus qu'à inverser le sens de l'équation avec ⇄.";
        } else if (rightLoose) {
            msg = "✓ Étape correcte ! Inverse le sens de l'équation avec ⇄, puis retire le dénominateur qui vaut 1.";
        } else if (leftLoose && onesElsewhere > 0) {
            msg = "✓ Étape correcte ! Retire les 1 inutiles.";
        } else if (leftLoose) {
            msg = "✓ Étape correcte ! La grandeur à isoler ne doit plus être dans une fraction : clique sur la croix du dénominateur pour le supprimer.";
        } else if (leftFull && onesElsewhere > 0) {
            msg = "✓ Retire les 1 inutiles.";
        } else {
            msg = "✓ Étape correcte, continue !";
        }
        showFeedback(msg, true);
        state = JSON.parse(JSON.stringify(state));
        refreshView();
    }
}

// ═══════════════════════════════════════════════════════════════
// MODULE 9 — ENTRAÎNEMENT (fonctions réciproques)
// ═══════════════════════════════════════════════════════════════
// pH = −log(C/C0)   (C0 = 1 mol/L, concentration de référence)
const m9StartPh = {
    initialLeft:  () => seq([simple([tile('pH','pH')])]),
    initialRight: () => seq([sumNode([term1(-1, [func('log', frac([tile('C','C')], [tile('C0','C<sub>0</sub>')]))])])]),
};
function samplePh() {
    const C0 = 1;
    const C = Math.pow(10, -(1 + Math.random() * 12));
    return { pH: -Math.log10(C / C0), C, C0, m1: -1 };
}
const phLegend = "pH : potentiel hydrogène (sans unité) · C : concentration en ions H<sub>3</sub>O<sup>+</sup> (mol/L) · C<sub>0</sub> : concentration de référence (C<sub>0</sub> = 1 mol/L)";
const phIntro = "Le pH d'une solution est défini à partir de la concentration en ions oxonium.";
const phStaticEq = `<span class="eq-tile-static">pH</span><span class="eq-sign">=</span><span class="eq-tile-static">−</span><span class="func-wrap"><span class="func-name">log</span>(${staticFracHtml('C','C<sub>0</sub>')})</span>`;
const phTiles = [tile('pH','pH'), tile('C','C'), tile('C0','C<sub>0</sub>')];

// N = N0 × exp(−λt)  (décroissance radioactive)
const m9StartDecay = {
    initialLeft:  () => seq([simple([tile('N','N')])]),
    initialRight: () => seq([simple([tile('N0','N<sub>0</sub>')]), func('exp', sumNode([term1(-1, [simple([tile('lambda','λ'), tile('t','t')])])]))]),
};
function sampleDecay() {
    const lambda = 0.01 + Math.random() * 0.5, t = Math.random() * 10, N0 = 100 + Math.random() * 900;
    return { N: N0 * Math.exp(-lambda * t), N0, lambda, t, m1: -1 };
}
const decayLegend = "N : nombre de noyaux radioactifs restants · N<sub>0</sub> : nombre initial de noyaux · λ : constante radioactive (s<sup>−1</sup>) · t : durée (s)";
const decayIntro = "La décroissance radioactive suit une loi exponentielle.";
const decayStaticEq = `<span class="eq-tile-static">N</span><span class="eq-sign">=</span><span class="eq-tile-static">N<sub>0</sub></span><span class="func-wrap pow-wrap"><span class="pow-base">e</span><sup class="func-exp-inner"><span class="eq-tile-static">−</span><span class="eq-tile-static">λ</span><span class="eq-tile-static">t</span></sup></span>`;
const decayTiles = [tile('N','N'), tile('N0','N<sub>0</sub>'), tile('lambda','λ'), tile('t','t')];

// uc = E × exp(−t/τ)   (décharge d'un condensateur)
const m9StartCap = {
    initialLeft:  () => seq([simple([tile('uc','u<sub>C</sub>')])]),
    initialRight: () => seq([simple([tile('E','E')]), func('exp', sumNode([term1(-1, [frac([tile('t','t')], [tile('tau','τ')])])]))]),
};
function sampleCap() {
    const tau = 0.2 + Math.random() * 5, t = Math.random() * 10, E = 1 + Math.random() * 11;
    return { uc: E * Math.exp(-t / tau), E, t, tau, m1: -1 };
}
const capLegend = "u<sub>C</sub> : tension aux bornes du condensateur (V) · E : tension initiale (V) · t : durée (s) · τ : constante de temps (s)";
const capIntro = "Lors de la décharge d'un condensateur, la tension à ses bornes décroît exponentiellement.";
const capStaticEq = `<span class="eq-tile-static">u<sub>C</sub></span><span class="eq-sign">=</span><span class="eq-tile-static">E</span><span class="func-wrap pow-wrap"><span class="pow-base">e</span><sup class="func-exp-inner"><span class="eq-tile-static">−</span>${staticFracHtml('t','τ')}</sup></span>`;
const capTiles = [tile('uc','u<sub>C</sub>'), tile('E','E'), tile('t','t'), tile('tau','τ')];

// n1×sin(i1) = n2×sin(i2)  (loi de Descartes, un seul sens demandé)
const m9StartDescartes = {
    initialLeft:  () => seq([simple([tile('n1','n<sub>1</sub>')]), func('sin', simple([tile('i1','i<sub>1</sub>')]))]),
    initialRight: () => seq([simple([tile('n2','n<sub>2</sub>')]), func('sin', simple([tile('i2','i<sub>2</sub>')]))]),
};
function sampleDescartes() {
    const i1 = 0.15 + Math.random() * 0.9, i2 = 0.15 + Math.random() * 0.9;
    const n1 = 1 + Math.random() * 0.6;
    const n2 = n1 * Math.sin(i1) / Math.sin(i2);
    return { n1, i1, n2, i2 };
}
const descartesLegend = "n<sub>1</sub>, n<sub>2</sub> : indices de réfraction (sans unité) · i<sub>1</sub>, i<sub>2</sub> : angles d'incidence et de réfraction (rad)";
const descartesIntro = "La loi de Descartes (réfraction de la lumière) relie les indices et les angles de part et d'autre d'un dioptre.";
const descartesStaticEq = `<span class="eq-tile-static">n<sub>1</sub></span><span class="func-wrap"><span class="func-name">sin</span>(<span class="eq-tile-static">i<sub>1</sub></span>)</span><span class="eq-sign">=</span><span class="eq-tile-static">n<sub>2</sub></span><span class="func-wrap"><span class="func-name">sin</span>(<span class="eq-tile-static">i<sub>2</sub></span>)</span>`;
const descartesTiles = [tile('n1','n<sub>1</sub>'), tile('i1','i<sub>1</sub>'), tile('n2','n<sub>2</sub>'), tile('i2','i<sub>2</sub>')];

// T² = k × a³  (troisième loi de Kepler, k regroupe 4π²/(GM))
const m9StartKepler = {
    initialLeft:  () => seq([func('sq', simple([tile('T','T')]))]),
    initialRight: () => seq([simple([tile('k','k')]), func('cube', simple([tile('a','a')]))]),
};
function sampleKepler() {
    const k = 0.5 + Math.random() * 2, a = 1 + Math.random() * 9;
    return { T: Math.sqrt(k * a * a * a), k, a };
}
const keplerLegend = "T : période de révolution (s) · k : constante regroupant 4π²/(GM) · a : demi-grand axe de l'orbite (m)";
const keplerIntro = "La troisième loi de Kepler relie la période de révolution d'une planète au demi-grand axe de son orbite (k = 4π²/(GM) est ici regroupée en une seule grandeur).";
const keplerStaticEq = `<span class="func-wrap"><span class="eq-tile-static">T</span><sup class="func-exp">2</sup></span><span class="eq-sign">=</span><span class="eq-tile-static">k</span><span class="func-wrap"><span class="eq-tile-static">a</span><sup class="func-exp">3</sup></span>`;
const keplerTiles = [tile('T','T'), tile('k','k'), tile('a','a')];

// F = G×MT×MS / (RT+h)²   (force de gravitation, question finale combinée)
const m9StartSat = {
    initialLeft:  () => seq([simple([tile('F','F')])]),
    initialRight: () => seq([frac(
        simple([tile('G','G'), tile('MT','M<sub>T</sub>'), tile('MS','M<sub>S</sub>')]),
        func('sq', seq([sumNode([term1(1,[simple([tile('RT','R<sub>T</sub>')])]), term1(1,[simple([tile('h','h')])])])]))
    )]),
};
function sampleSat() {
    const G = 6.674e-11, MT = 5.97e24, MS = 400 + Math.random() * 5000, RT = 6.371e6, h = 3e5 + Math.random() * 3e6;
    return { F: G * MT * MS / ((RT + h) * (RT + h)), G, MT, MS, RT, h };
}
const satLegend = "F : force de gravitation (N) · G : constante de gravitation (N·m²/kg²) · M<sub>T</sub>, M<sub>S</sub> : masses de la Terre et du satellite (kg) · R<sub>T</sub> : rayon terrestre (m) · h : altitude du satellite (m)";
const satIntro = "La Terre exerce sur un satellite en orbite une force de gravitation qui dépend de son altitude.";
const satStaticEq = `<span class="eq-tile-static">F</span><span class="eq-sign">=</span>${staticFracHtml('<span class="eq-tile-static">G</span><span class="eq-tile-static">M<sub>T</sub></span><span class="eq-tile-static">M<sub>S</sub></span>', `<span class="func-wrap"><span class="sum-parens">(</span><span class="eq-tile-static">R<sub>T</sub></span><span class="eq-tile-static">+</span><span class="eq-tile-static">h</span><span class="sum-parens">)</span><sup class="func-exp">2</sup></span>`)}`;
const satTiles = [tile('F','F'), tile('G','G'), tile('MT','M<sub>T</sub>'), tile('MS','M<sub>S</sub>'), tile('RT','R<sub>T</sub>'), tile('h','h')];

const module9Bank = [
    { legend: phLegend, intro: phIntro, staticEqHtml: phStaticEq, tiles: phTiles, target:'C', funcTools:['pow10'], needsNegTool: true, ...m9StartPh, sample: samplePh },

    { legend: decayLegend, intro: decayIntro, staticEqHtml: decayStaticEq, tiles: decayTiles, target:'t', funcTools:['ln'], needsNegTool: true, needsParenTool: true, ...m9StartDecay, sample: sampleDecay },
    { legend: decayLegend, intro: "On souhaite maintenant exprimer λ.", staticEqHtml: decayStaticEq, tiles: decayTiles, target:'lambda', funcTools:['ln'], needsNegTool: true, needsParenTool: true, ...m9StartDecay, sample: sampleDecay },

    { legend: capLegend, intro: capIntro, staticEqHtml: capStaticEq, tiles: capTiles, target:'t', funcTools:['ln'], needsNegTool: true, ...m9StartCap, sample: sampleCap },

    { legend: descartesLegend, intro: descartesIntro, staticEqHtml: descartesStaticEq, tiles: descartesTiles, target:'i1', funcTools:['asin'], needsParenTool: true, ...m9StartDescartes, sample: sampleDescartes },

    { legend: keplerLegend, intro: keplerIntro, staticEqHtml: keplerStaticEq, tiles: keplerTiles, target:'T', funcTools:['sqrt'], ...m9StartKepler, sample: sampleKepler },
    { legend: keplerLegend, intro: "On souhaite maintenant exprimer a.", staticEqHtml: keplerStaticEq, tiles: keplerTiles, target:'a', funcTools:['cbrt'], needsParenTool: true, ...m9StartKepler, sample: sampleKepler },

    { legend: satLegend, intro: satIntro, staticEqHtml: satStaticEq, tiles: satTiles, target:'h', funcTools:['sqrt'], ...m9StartSat, sample: sampleSat },
];
const m9MaxScore = module9Bank.length * 2;
const m9TrueMaxScore = module9Bank.length * 3;
let m9Idx = 0, m9Score = 0, m9Answers = [];

function targetLabel(q) {
    const t = q.tiles.find(x => x.id === q.target);
    return t ? t.label : q.target;
}

function renderModule9Intro() {
    if (window.DragDrop) DragDrop.cleanupGhosts();
    document.getElementById('app').innerHTML = `
      <div class="bg-white rounded-xl shadow-lg p-6">
        <span class="content-module-badge">MODULE 9</span>
        <h2 class="text-2xl font-bold text-indigo-900 mb-3">Entraînement</h2>
        <p class="text-gray-700 mb-2">Tu vas résoudre des équations comportant des fonctions (racine carrée, carré, cube, sinus, logarithme...), issues de situations physiques variées. Utilise l'outil de fonction réciproque de la palette pour supprimer une fonction, comme vu au module 8.</p>
        <p class="text-gray-700 mb-2"><b>Notation :</b> 2 points si l'équation est résolue en plusieurs étapes sans aucune erreur, 1 point s'il y a eu au moins une erreur avant d'y arriver, 0 point en cas d'abandon. La note finale est donnée en pourcentage.</p>
        <p class="text-gray-700 mb-2"><b>Bonus ultime :</b> si l'équation est résolue en une seule étape, de tête, vous remportez 3 points. La note finale peut alors dépasser 100% !</p>
        <button onclick="startModule9Graded()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-bold shadow mt-2">Commencer →</button>
      </div>`;
}
function startModule9Graded(){ m9Idx = 0; m9Score = 0; m9Answers = []; renderModule9Question(); }
function renderModule9Question() {
    if (window.DragDrop) DragDrop.cleanupGhosts();
    if (m9Idx >= module9Bank.length) { finishModule9(); return; }
    const q = module9Bank[m9Idx];
    const app = document.getElementById('app');
    const displayNum = m9Idx + 1;
    const progressPct = Math.round(m9Idx / module9Bank.length * 100);
    app.innerHTML = `
      <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
        <span class="content-module-badge">MODULE 9</span>
        <h2 class="text-2xl font-bold text-indigo-900 mb-1">Entraînement</h2>
        <p class="text-xs text-gray-400 uppercase font-bold mb-2">Question ${displayNum}/${module9Bank.length} · Score : <span class="score-badge">${m9Score} pt${m9Score>1?'s':''}</span></p>
        <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${progressPct}%"></div></div>
      </div>
      <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
        <p class="text-gray-700 text-lg mb-2">${q.intro}</p>
        <p class="unit-legend mb-2">${q.legend}</p>
        <div class="eq-line-static text-lg md:text-2xl my-4">${q.staticEqHtml}</div>
        <p class="font-bold text-indigo-900">Exprimer ${targetLabel(q)}.</p>
        <div class="text-right mt-2"><button onclick="abandonQuestion9()" class="text-xs font-bold text-red-500 hover:text-red-700">Abandonner cette question →</button></div>
      </div>
      <div class="bg-white rounded-xl shadow-lg p-6">${solveEditorHTML()}</div>`;
    startSolveExercise({
        tiles: q.tiles, sample: q.sample, targetId: q.target, funcTools: q.funcTools,
        needsParenTool: q.needsParenTool, needsNegTool: q.needsNegTool,
        initialLeft: q.initialLeft, initialRight: q.initialRight,
        onSolved: (dm) => {
            const pts = hadError ? 1 : (history.length === 1 ? 3 : 2);
            m9Score += pts;
            m9Answers.push({ num: displayNum, pts, max: 2 });
            dm.innerHTML = `🎉 Équation résolue ! (+${pts} pt${pts>1?'s':''})<div class="mt-4"><button onclick="nextModule9Question()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-bold shadow">Suivant →</button></div>`;
        }
    });
}
function nextModule9Question(){ m9Idx++; renderModule9Question(); }
function abandonQuestion9(){
    m9Answers.push({ num: m9Idx+1, pts: 0, max: 2 });
    m9Idx++; renderModule9Question();
}
function finishModule9() {
    const pct = Math.round(m9Score / m9MaxScore * 100);
    const isMax = m9Score >= m9TrueMaxScore;
    const recapHtml = m9Answers.map(a => `<div class="recap-item">Q${a.num}<br><b>${a.pts}/${a.max}</b></div>`).join('');
    document.getElementById('app').innerHTML = `
      <div class="bg-white rounded-xl shadow-lg p-8 text-center">
        <h2 class="text-2xl font-bold text-indigo-900 mb-2">Entraînement terminé !</h2>
        ${isMax ? `<p class="text-lg font-bold text-amber-600 mb-2">🏆 Score maximal ! Bravo, c'est un sans-faute parfait !</p>` : ''}
        <p class="text-lg text-gray-700 mb-4">Score : ${m9Score} / ${m9MaxScore} points (${pct}%)</p>
        <button onclick="startModule9Graded()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-bold shadow">↺ Recommencer l'entraînement</button>
        <div class="text-sm font-bold text-gray-500 mt-6 mb-2 text-left">Détail des points</div>
        <div class="recap-grid">${recapHtml}</div>
      </div>`;
    if (isMax) launchConfetti();
}
let confettiInterval = null;
function launchConfetti() {
    if (confettiInterval) return;
    spawnConfettiBurst();
    confettiInterval = setInterval(spawnConfettiBurst, 700);
}
function spawnConfettiBurst() {
    const colors = ['#4f46e5','#22c55e','#f59e0b','#ef4444','#06b6d4'];
    for (let i = 0; i < 24; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = (Math.random()*100) + 'vw';
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.animationDuration = (2.5 + Math.random()*1.5) + 's';
        el.style.animationDelay = (Math.random()*0.4) + 's';
        el.style.transform = `rotate(${Math.random()*360}deg)`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4500);
    }
}

renderModule9Intro();
</script>
