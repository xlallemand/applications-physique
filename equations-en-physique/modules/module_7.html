<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 7 : Entraînement</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../../assets/theme.css">
<script src="../../assets/nav.js"></script>
<script src="../../assets/dragdrop.js"></script>
<style>
    :root {
        --app-accent-50:  #eef2ff;
        --app-accent-100: #e0e7ff;
        --app-accent-200: #c7d2fe;
        --app-accent-400: #818cf8;
        --app-accent-600: #4f46e5;
        --app-accent-700: #4338ca;
        --app-accent-800: #3730a3;
    }
    body { font-family: var(--font-sans); }

    .frac-wrap-static { display:inline-flex; flex-direction:column; align-items:center; margin:0 6px; vertical-align:middle; }
    .frac-num-static, .frac-den-static { padding:0 6px; }
    .frac-line-static { width:100%; height:2px; background:#1e293b; border-radius:2px; }
    .eq-tile-static { font-weight:700; color:#1e293b; margin:0 4px; }

    .eq-row { display:flex; align-items:center; justify-content:center; justify-content:safe center; flex-wrap:nowrap; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
    .eq-row::-webkit-scrollbar { height:4px; }
    .eq-side { display:flex; align-items:center; flex-shrink:0; }
    .eq-sign { font-size:1.8rem; font-weight:800; color:#1e3a8a; margin:0 16px; flex-shrink:0; }
    .eq-line-static { display:flex; align-items:center; justify-content:center; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }

    @media (max-width:480px) {
        .eq-tile, .eq-tile-frozen { font-size:.85rem; padding:7px 10px; }
        .eq-tile { min-height:36px; }
        .eq-sign { font-size:1.4rem; margin:0 8px; }
        .eq-tile-static { font-size:.9rem; }
        .flip-btn { width:36px; height:36px; font-size:1rem; margin-left:8px; }
    }

    .slot-simple {
        display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
        min-width:70px; min-height:56px; padding:8px 12px; position:relative;
        border:2px dashed #94a3b8; border-radius:10px; background:#fff; transition:all .2s;
    }
    .slot-simple.drag-over { background:#dbeafe; border-color:#3b82f6; }
    .slot-placeholder { color:#94a3b8; font-weight:700; font-size:1.1rem; }

    .eq-tile {
        display:inline-flex; align-items:center; gap:6px; position:relative;
        background:#dbeafe; border:2px solid #60a5fa; border-radius:8px;
        padding:9px 13px; min-height:40px; font-weight:700; color:#1e3a8a; cursor:grab; touch-action:none;
    }
    .eq-tile.dragging { opacity:.4; }
    .eq-tile.tile-highlight { background:#fee2e2; border-color:#ef4444; color:#991b1b; box-shadow:0 0 0 3px rgba(239,68,68,.25); }
    .eq-tile.drag-over { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.35); }
    .mult-sign { display:inline-block; font-weight:800; color:#64748b; margin:0 3px; font-size:1rem; flex-shrink:0; }
    .tile-del {
        width:16px; height:16px; border-radius:50%; background:#ef4444; color:#fff;
        font-size:10px; line-height:16px; text-align:center; cursor:pointer;
    }

    .frac-wrap { display:inline-flex; flex-direction:column; align-items:center; gap:4px; position:relative; margin:0 8px; flex-shrink:0; }
    .frac-num-wrap, .frac-den-wrap { position:relative; }
    .frac-line { width:100%; height:3px; background:#1e293b; border-radius:2px; }
    .frac-del {
        position:absolute; top:-9px; right:-9px; width:20px; height:20px; border-radius:50%;
        background:#ef4444; color:#fff; font-size:11px; line-height:16px; text-align:center;
        cursor:pointer; border:2px solid #fff; z-index:1;
    }

    .flip-btn {
        width:44px; height:44px; border-radius:50%; background:#eef2ff; border:2px solid #818cf8;
        color:#312e81; font-size:1.3rem; font-weight:800; margin-left:12px; flex-shrink:0;
    }
    .flip-btn:hover { background:#e0e7ff; }

    .eq-tile-frozen { display:inline-flex; align-items:center; background:#f1f5f9; border:2px solid #cbd5e1; border-radius:8px; padding:6px 10px; font-weight:700; color:#334155; margin:0 3px; }
    .step-row { border-bottom:1px dashed #e2e8f0; }

    .palette-tile {
        display:inline-flex; align-items:center; justify-content:center;
        min-width:56px; min-height:44px; padding:8px 14px;
        background:#eef2ff; border:2px solid #818cf8; border-radius:10px;
        font-weight:700; color:#312e81; cursor:grab; touch-action:none; user-select:none;
    }
    .palette-tile.dragging { opacity:.4; }
    .palette-frac { display:inline-flex; flex-direction:column; align-items:center; padding:6px 12px; }
    .palette-frac .dots { font-size:.8rem; letter-spacing:2px; color:#312e81; }
    .palette-frac .frac-line { width:28px; height:2px; margin:2px 0; background:#312e81; }
    .palette-tile.func-tool { background:#fef3c7; border-color:#f59e0b; color:#78350f; }
    #currentStepZone.drag-over { background:#dbeafe !important; border-color:#3b82f6 !important; }

    .content-module-badge {
        display:inline-block; background:#4f46e5; color:#fff; font-size:.75rem; font-weight:800;
        padding:4px 12px; border-radius:999px; letter-spacing:.05em; margin-bottom:8px;
    }
    .rule-card { background:#f8fafc; border:2px solid #e2e8f0; border-radius:12px; padding:16px; }
    .rule-card .rule-title { font-weight:800; color:#312e81; margin-bottom:6px; }

    .progress-bar-outer { background:#e2e8f0; border-radius:999px; height:10px; overflow:hidden; }
    .progress-bar-inner { background:#4f46e5; height:100%; transition:width .3s; }

    .mcq-btn { display:block; width:100%; text-align:left; padding:10px 14px; border:2px solid #c7d2fe; border-radius:10px; margin-bottom:8px; background:#fff; font-weight:700; color:#312e81; }
    .mcq-btn.correct { background:#dcfce7; border-color:#22c55e; }
    .mcq-btn.wrong { background:#fee2e2; border-color:#ef4444; }

    .unit-legend { font-size:.85rem; color:#64748b; margin-top:6px; }
    .score-badge { font-weight:800; color:#4f46e5; }

    .recap-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(52px,1fr)); gap:6px; }
    .recap-item { background:#f1f5f9; border-radius:8px; padding:5px 2px; text-align:center; font-size:.7rem; line-height:1.3; color:#334155; }
    .recap-item b { display:block; font-size:.85rem; }

    .confetti-piece {
        position:fixed; top:-20px; width:9px; height:14px; z-index:9999; pointer-events:none;
        animation:confetti-fall linear forwards;
    }
    @keyframes confetti-fall {
        to { top:110vh; transform:translateY(0) rotate(720deg); }
    }
    .insert-zone {
        width:34px; min-height:56px; border:2px dashed #94a3b8; border-radius:8px;
        opacity:0; transition:opacity .15s; flex-shrink:0;
    }
    .insert-zone.drag-over { background:#dbeafe; border-color:#3b82f6; opacity:1; }
    body.dnd-active .insert-zone { opacity:.55; }

    .sum-wrap { display:inline-flex; align-items:center; gap:2px; flex-shrink:0; }
    .sum-parens { font-size:1.5rem; font-weight:800; color:#64748b; }
    .paren-wrap { display:inline-flex; align-items:center; }
    .paren-bracket { font-weight:800; color:#64748b; font-size:1.3rem; display:inline-block; line-height:1; }
    .paren-content { display:inline-flex; align-items:center; }
    .sum-term { display:inline-flex; align-items:center; gap:4px; border-radius:10px; padding:2px; touch-action:none; }
    .sum-term.term-draggable { cursor:grab; }
    .sum-term.term-draggable:hover { background:rgba(79,70,229,.08); }
    .sum-term.dragging { opacity:.4; }
    .sum-zero { font-weight:800; color:#1e3a8a; font-size:1.2rem; padding:0 6px; }
    .sum-sign { font-weight:800; color:#1e3a8a; font-size:1.2rem; display:inline-block; }
    .sum-sign.sum-sign-drag { cursor:grab; touch-action:none; border-radius:8px; padding:2px 5px; }
    .sum-sign.sum-sign-drag:hover { background:rgba(79,70,229,.08); }
    .sum-sign.sum-sign-drag.dragging { opacity:.4; }
    @keyframes signFlip {
        0%   { transform:rotateY(-170deg) scale(1.8); color:#ef4444; background:rgba(239,68,68,.25); }
        55%  { transform:rotateY(-90deg) scale(1.8); color:#ef4444; background:rgba(239,68,68,.25); }
        100% { transform:rotateY(0deg) scale(1); background:rgba(239,68,68,0); }
    }
    .sum-sign.just-flipped { animation: signFlip 1.3s ease; border-radius:6px; display:inline-block; }
    /* le fantome d'un signe qui disparait completement (voir
       flashVanishingSign) monte et s'estompe en tournant, plutot que de
       rester immobile a une position figee : la ligne d'equation etant
       centree, un changement de cote fait bouger tout ce qui suit le signe
       "=" et une position figee finit facilement collee contre un element
       qui n'a rien a voir (le terme qui vient d'arriver, le bouton ⇄...) */
    @keyframes signVanish {
        0%   { transform:translateY(0) rotateY(-170deg) scale(1.8); color:#ef4444; background:rgba(239,68,68,.25); opacity:1; }
        55%  { transform:translateY(-6px) rotateY(-90deg) scale(1.6); color:#ef4444; background:rgba(239,68,68,.2); opacity:1; }
        100% { transform:translateY(-28px) rotateY(0deg) scale(.8); background:rgba(239,68,68,0); opacity:0; }
    }
    .sign-vanish-ghost { animation: signVanish 1.3s ease forwards; border-radius:6px; }
    /* meme si le signe n'est pas affiche (premier terme positif implicite),
       le terme entier doit clignoter pour signaler le changement de signe */
    @keyframes termFlash {
        0%   { background:rgba(239,68,68,.35); box-shadow:0 0 0 3px rgba(239,68,68,.35); }
        100% { background:rgba(239,68,68,0); box-shadow:0 0 0 3px rgba(239,68,68,0); }
    }
    .sum-term.term-flash, .sum-wrap.term-flash, .eq-side.term-flash { animation: termFlash 1.3s ease; border-radius:10px; }
    body.sumterm-dragging .eq-side[data-path="left"], body.sumterm-dragging .eq-side[data-path="right"] {
        outline: 3px dashed #f59e0b; outline-offset: 5px; border-radius: 10px;
        background: rgba(245,158,11,.06); padding: 10px 20px;
    }
    body.sumterm-dragging .eq-side.drag-over { background: rgba(245,158,11,.16); border-radius: 10px; }
    .eq-side.sumterm-source { outline:none !important; background:none !important; }
</style>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
<div id="app-nav"></div>

<div class="container mx-auto px-4 py-8 max-w-7xl">
    <div id="app"></div>
</div>

<script>

const nav = AppNav.init({
    appName: 'Équations en Physique',
    portalHref: '../../index.html',
    portalLabel: 'Toutes les applications',
    onHome: () => { window.location.href = '../index.html'; },
    onNavigate: (key) => { window.location.href = key + '.html'; },
    groups: [
        { title: 'Principe', items: [
            { key: 'module_1', label: 'Module 1 : Méthode' },
            { key: 'module_2', label: "Module 2 : Exemple d'application" },
            { key: 'module_3', label: 'Module 3 : Entraînement' },
        ]},
        { title: 'Gestion des fractions', items: [
            { key: 'module_4', label: 'Module 4 : Méthode' },
            { key: 'module_5', label: 'Module 5 : Entraînement' },
        ]},
        { title: 'Gérer les + et les -', items: [
            { key: 'module_6', label: 'Module 6 : Méthode' },
            { key: 'module_7', label: 'Module 7 : Entraînement' },
        ]},
        { title: 'Gérer les fonctions réciproques', items: [
            { key: 'module_8', label: 'Module 8 : Méthode' },
            { key: 'module_9', label: 'Module 9 : Entraînement' },
        ]},
    ],
});
nav.setActive('module_7');
nav.setTitle('Module 7 : Entraînement');

// ═══════════════════════════════════════════════════════════════
// OUTILS DE CONSTRUCTION DE NŒUDS (identique au module 6)
// ═══════════════════════════════════════════════════════════════
function tile(id,label){ return {id,label}; }
function simple(items){ return { kind:'simple', items: items.map(t => ({...t})) }; }
function frac(numItems, denItems){ return { kind:'frac', num: simple(numItems), den: simple(denItems) }; }
function seq(slots){ return { kind:'seq', slots }; }
function emptySeq(){ return seq([simple([])]); }
function term1(sign, slots){ return { sign, node: seq(slots) }; }
function sumNode(terms){ return { kind:'sum', terms: terms.map(t => ({ sign:t.sign, node:t.node })) }; }
function idsOf(items){ return items.map(i => i.id); }
function setEq(a,b){ if (a.length !== b.length) return false; const sa=[...a].sort(), sb=[...b].sort(); return sa.every((v,i)=>v===sb[i]); }
function staticFracHtml(num, den) {
    return `<span class="frac-wrap-static"><span class="frac-num-static">${num}</span><span class="frac-line-static"></span><span class="frac-den-static">${den}</span></span>`;
}
// affichage statique d'une somme de termes (pour l'énoncé figé, hors éditeur)
function staticSumHtml(parts) {
    // parts: [{sign, html}], le tout premier '+' est omis
    return parts.map((p,i) => (i>0 || p.sign==='−' ? `<span class="eq-tile-static">${p.sign}</span>` : '') + p.html).join('');
}

// ═══════════════════════════════════════════════════════════════
// ÉTAT GLOBAL
// ═══════════════════════════════════════════════════════════════
let state = { left: emptySeq(), right: emptySeq() };
let history = [];
let resolved = false;
let stepOneValidated = false;
let currentExercise = null;
let hadError = false;
let viewMode = 'solve';
let activeHighlightId = null;
let signsToFlash = [];

function getNode(path) {
    const parts = path.split('.');
    let cur = parts[0] === 'left' ? state.left : state.right;
    for (let i = 1; i < parts.length; i++) {
        if (!cur) return null;
        const p = parts[i];
        if (/^term\d+$/.test(p)) cur = cur.terms[+p.slice(4)].node;
        else if (/^\d+$/.test(p)) cur = cur.slots ? cur.slots[+p] : undefined;
        else cur = cur[p];
    }
    return cur || null;
}
function setNode(path, newNode) {
    const parts = path.split('.');
    if (parts.length === 1) { state[parts[0]] = newNode; return; }
    const parent = getNode(parts.slice(0, -1).join('.'));
    const last = parts[parts.length - 1];
    if (/^term\d+$/.test(last)) parent.terms[+last.slice(4)].node = newNode;
    else if (/^\d+$/.test(last)) parent.slots[+last] = newNode;
    else parent[last] = newNode;
}

// ═══════════════════════════════════════════════════════════════
// AFFICHAGE (identique au module 6)
// ═══════════════════════════════════════════════════════════════
function isOperatorTile(it) { return it.id === 'plus' || it.id === 'minus' || it.id === 'times'; }
function wrapParens(innerHtml) {
    return `<span class="paren-wrap"><span class="paren-bracket paren-open">(</span><span class="paren-content">${innerHtml}</span><span class="paren-bracket paren-close">)</span></span>`;
}
function sizeParens(container) {
    container.querySelectorAll('.paren-wrap').forEach(wrap => {
        const content = wrap.querySelector('.paren-content');
        if (!content) return;
        const h = content.offsetHeight || 24;
        const scale = Math.max(1, h / 22);
        wrap.querySelectorAll('.paren-bracket').forEach(b => { b.style.transform = `scaleY(${scale.toFixed(2)})`; });
    });
}
function renderInsertZone(sidePath, where) {
    return `<div class="insert-zone" data-side="${sidePath}" data-where="${where}"></div>`;
}
function isSumIsolated(sumPath) {
    const parentPath = sumPath.split('.').slice(0, -1).join('.');
    const parent = getNode(parentPath);
    if (!parent || parent.kind !== 'seq' || parent.slots.length !== 1) return false;
    if (parent.parenthesized) return false;
    return true;
}
function renderNode(node, path) {
    if (node.kind === 'simple') {
        const items = node.items.map((it, idx) => {
            const hl = (activeHighlightId && it.id === activeHighlightId) ? ' tile-highlight' : '';
            const sep = (idx > 0 && !isOperatorTile(node.items[idx-1]) && !isOperatorTile(it)) ? '<span class="mult-sign">×</span>' : '';
            return sep + `<span class="eq-tile${hl}" data-path="${path}" data-idx="${idx}">
                ${it.label}<span class="tile-del"
                    onpointerdown="event.stopPropagation()"
                    onclick="event.stopPropagation();deleteItem('${path}',${idx})">✕</span>
            </span>`;
        }).join('');
        return `<div class="slot-simple" data-path="${path}">
                    ${items || '<span class="slot-placeholder">…</span>'}
                </div>`;
    }
    if (node.kind === 'frac') {
        const showDenCross = (node.den.items.length === 1 && node.den.items[0].id === 'one')
            || (node.den.items.length === 0 && node.forceDenCross);
        return `<div class="frac-wrap">
            <div class="frac-num-wrap">${renderNode(node.num, path + '.num')}</div>
            <div class="frac-line"></div>
            <div class="frac-den-wrap">
                ${showDenCross ? `<span class="frac-del"
                    onclick="deleteDen('${path}')"
                    ontouchstart="event.stopPropagation()"
                    ontouchend="event.stopPropagation();event.preventDefault();deleteDen('${path}')"
                    title="Supprimer le dénominateur">✕</span>` : ''}
                ${renderNode(node.den, path + '.den')}
            </div>
        </div>`;
    }
    if (node.kind === 'sum') {
        if (node.terms.length === 0) {
            return `<span class="sum-wrap sum-zero" data-path="${path}">0</span>`;
        }
        if (node.terms.length === 1) {
            const t = node.terms[0];
            const signHtml = t.sign === -1
                ? `<span class="sum-sign sum-sign-drag" data-sum-path="${path}" data-term-idx="0">−</span>`
                : '';
            // si le terme se reduit a une seule grandeur (pas un produit de
            // plusieurs facteurs), la glisser doit deplacer le terme additif
            // (signe inverse), pas l'extraire comme un facteur multiplicatif :
            // seul un vrai produit (ex. -λ×t) doit permettre d'attraper un
            // facteur individuellement (cf. .sum-term-single ci-dessous)
            let flat = t.node;
            while (flat.kind === 'seq' && flat.slots.length === 1) flat = flat.slots[0];
            const singleTile = flat.kind === 'simple' && flat.items.length === 1;
            return `<span class="sum-wrap${singleTile ? ' sum-term-single' : ''}" data-path="${path}" data-term-idx="0">${signHtml}${renderNode(t.node, path + '.term0')}</span>`;
        }
        const isolated = isSumIsolated(path);
        const inner = node.terms.map((t, i) => {
            const showSign = i > 0 || t.sign === -1;
            const signChar = t.sign === -1 ? '−' : '+';
            const signHtml = showSign ? `<span class="sum-sign" data-sum-path="${path}" data-term-idx="${i}">${signChar}</span>` : '';
            return `<span class="sum-term${isolated ? ' term-draggable' : ''}" data-path="${path}" data-term-idx="${i}">${signHtml}${renderNode(t.node, path + '.term' + i)}</span>`;
        }).join('');
        return `<span class="sum-wrap" data-path="${path}">${inner}</span>`;
    }
    if (node.kind === 'sqrt') {
        return `<div class="sqrt-wrap"><svg class="sqrt-hook"></svg><div class="sqrt-inner">${renderNode(node.inner, path + '.inner')}</div></div>`;
    }
    let html = '';
    const n = node.slots.length;
    const needsInsertBefore = node.slots[0].kind === 'frac' || node.slots[0].kind === 'sum';
    const needsInsertAfter  = node.slots[n-1].kind === 'frac' || node.slots[n-1].kind === 'sum';
    if (needsInsertBefore) html += renderInsertZone(path, 'start');
    let inner = '';
    node.slots.forEach((slot, i) => {
        if (i > 0) inner += '<span class="mult-sign">×</span>';
        const parens = !node.parenthesized && slot.kind === 'sum' && slot.terms.length > 1 && n > 1;
        inner += parens ? wrapParens(renderNode(slot, path + '.' + i)) : renderNode(slot, path + '.' + i);
    });
    html += node.parenthesized ? wrapParens(inner) : inner;
    if (needsInsertAfter) html += renderInsertZone(path, 'end');
    return `<div class="eq-side" data-path="${path}">${html}</div>`;
}
function renderStatic(node) {
    if (node.kind === 'simple') {
        if (node.items.length === 0) return '<span class="slot-placeholder">…</span>';
        return node.items.map((it, idx) => {
            const sep = (idx > 0 && !isOperatorTile(node.items[idx-1]) && !isOperatorTile(it)) ? '<span class="mult-sign">×</span>' : '';
            return sep + `<span class="eq-tile-frozen">${it.label}</span>`;
        }).join('');
    }
    if (node.kind === 'frac') {
        return `<div class="frac-wrap">
            <div class="frac-num-wrap">${renderStatic(node.num)}</div>
            <div class="frac-line"></div>
            <div class="frac-den-wrap">${renderStatic(node.den)}</div>
        </div>`;
    }
    if (node.kind === 'sum') {
        if (node.terms.length === 0) return `<span class="sum-wrap sum-zero">0</span>`;
        const inner = node.terms.map((t, i) => {
            const showSign = i > 0 || t.sign === -1;
            const signChar = t.sign === -1 ? '−' : '+';
            return (showSign ? `<span class="sum-sign">${signChar}</span>` : '') + renderStatic(t.node);
        }).join('');
        return `<span class="sum-wrap">${inner}</span>`;
    }
    if (node.kind === 'sqrt') {
        return `<div class="sqrt-wrap"><svg class="sqrt-hook"></svg><div class="sqrt-inner">${renderStatic(node.inner)}</div></div>`;
    }
    return `<div class="eq-side">${node.slots.map((s,i) => (i===0?'':'<span class="mult-sign">×</span>') + renderStatic(s)).join('')}</div>`;
}
function renderEquationZone() {
    const zone = document.getElementById('currentStepZone');
    if (!zone) return;
    zone.innerHTML =
        renderNode(state.left, 'left') +
        `<div class="eq-sign">=</div>` +
        renderNode(state.right, 'right') +
        `<button class="flip-btn" onclick="flipEquation()" title="Inverser le sens de l'équation">⇄</button>`;
    attachEqTileHandlers(zone);
    sizeSqrtHooks(zone);
    sizeParens(zone);
    if (signsToFlash.length) {
        signsToFlash.forEach(({ sidePath, termIdx }) => {

    if (node.kind === 'sum') return node.terms.reduce((s, t) => s + t.sign * evaluateNode(t.node, v), 0);
    if (node.items.length === 0) return NaN;
    let terms = [], termValue = 1, sign = 1;
    node.items.forEach(it => {
        if (it.id === 'plus')       { terms.push(sign * termValue); termValue = 1; sign = 1; }
        else if (it.id === 'minus') { terms.push(sign * termValue); termValue = 1; sign = -1; }
        else if (it.id === 'times') { /* juxtaposition = produit */ }
        else termValue *= tokenValue(it.id, v);
    });
    terms.push(sign * termValue);
    return terms.reduce((s, t) => s + t, 0);
}
function isSlotEmpty(node) {
    if (node.kind === 'simple') return node.items.length === 0;
    if (node.kind === 'sqrt') return isSlotEmpty(node.inner);
    if (node.kind === 'frac') return isSlotEmpty(node.num) || isSlotEmpty(node.den);
    if (node.kind === 'sum') return node.terms.some(t => isSlotEmpty(t.node));
    return node.slots.some(isSlotEmpty);
}
function countOnesIn(node) {
    if (node.kind === 'simple') return node.items.filter(i => i.id === 'one').length;
    if (node.kind === 'sqrt') return countOnesIn(node.inner);
    if (node.kind === 'frac') return countOnesIn(node.num) + countOnesIn(node.den);
    if (node.kind === 'sum') return node.terms.reduce((s, t) => s + countOnesIn(t.node), 0);
    return node.slots.reduce((s, sl) => s + countOnesIn(sl), 0);
}
// compte les "1" residuels d'une fraction du type 1/2 dont le denominateur a
// ete extrait/supprime : tant que le "1" reste au numerateur d'une fraction
// intacte (meme en attente de suppression de son denominateur vide), il n'est
// jamais signale ; il ne devient un residu a retirer qu'une fois la fraction
// elle-meme effacee, le laissant nu a multiplier un terme
function countNakedHalfNumIn(node) {
    if (node.kind === 'simple') return node.items.filter(i => i.id === 'halfNum').length;
    if (node.kind === 'sqrt') return countNakedHalfNumIn(node.inner);
    if (node.kind === 'frac') {
        const numIsIntactHalfNum = node.num.kind === 'simple' && node.num.items.length === 1 && node.num.items[0].id === 'halfNum';
        return (numIsIntactHalfNum ? 0 : countNakedHalfNumIn(node.num)) + countNakedHalfNumIn(node.den);
    }
    if (node.kind === 'sum') return node.terms.reduce((s, t) => s + countNakedHalfNumIn(t.node), 0);
    return node.slots.reduce((s, sl) => s + countNakedHalfNumIn(sl), 0);
}
function isFullyIsolatedSeq(node, targetId) {
    return node && node.kind === 'seq' && node.slots.length === 1
        && node.slots[0].kind === 'simple' && node.slots[0].items.length === 1
        && node.slots[0].items[0].id === targetId;
}
function isIsolatedSeq(node, targetId) {
    if (!node || node.kind !== 'seq' || node.slots.length !== 1) return false;
    const s = node.slots[0];
    if (s.kind === 'simple') return s.items.length === 1 && s.items[0].id === targetId;
    if (s.kind === 'frac') return s.num.kind === 'simple' && s.num.items.length === 1 && s.num.items[0].id === targetId
        && s.den.kind === 'simple' && s.den.items.length === 1 && s.den.items[0].id === 'one';
    return false;
}

function solveEditorHTML() {
    return `
    <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-gray-400 uppercase">Résolution</span>
        <button onclick="resetSolveExercise()" class="text-xs font-bold text-red-500 hover:text-red-700">↺ Recommencer</button>
    </div>
    <div id="stepsHistory" class="mb-2"></div>
    <div id="workZone">
        <div id="stepHint" class="text-center text-sm text-indigo-700 font-semibold mb-3"></div>
        <div id="currentStepZone" class="eq-row py-8 border-2 border-dashed border-indigo-300 rounded-lg bg-indigo-50" style="min-height:110px;"></div>
        <div class="mt-6">
            <div class="text-xs font-bold text-gray-500 uppercase mb-2">Glisse les éléments dans l'équation</div>
            <div id="palette" class="flex flex-wrap gap-3 p-4 bg-gray-50 rounded-lg border border-gray-200"></div>
        </div>
        <div class="text-center mt-6">
            <button onclick="verifyStep()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-bold shadow">✓ Vérifier l'étape</button>
        </div>
    </div>
    <div id="doneMsg" class="hidden text-center text-xl font-bold text-green-600 py-6"></div>
    <div id="feedback" class="text-center mt-4 font-semibold text-lg"></div>`;
}
function startSolveExercise(cfg) {
    if (window.DragDrop) DragDrop.cleanupGhosts();
    currentExercise = cfg;
    viewMode = 'solve';
    state = { left: cfg.initialLeft(), right: cfg.initialRight() };
    history = [];
    stepOneValidated = true;
    resolved = false;
    hadError = false;
    activeHighlightId = null;
    refreshView();
    renderHistory();
}
function resetSolveExercise() {
    if (window.DragDrop) DragDrop.cleanupGhosts();
    if (!currentExercise) return;
    state = { left: currentExercise.initialLeft(), right: currentExercise.initialRight() };
    history = [];
    stepOneValidated = true;
    resolved = false;
    activeHighlightId = null;
    refreshView();
    renderHistory();
    showFeedback('', false);
}
function verifyStep() {
    if (isSlotEmpty(state.left) || isSlotEmpty(state.right)) {
        showFeedback("✕ Complète les deux membres de l'équation avant de vérifier.", false);
        hadError = true;
        return;
    }
    let equationTrue = true;
    for (let i = 0; i < 5 && equationTrue; i++) {
        const v = currentExercise.sample();
        const l = evaluateNode(state.left, v);
        const r = evaluateNode(state.right, v);
        if (!isFinite(l) || !isFinite(r) || Math.abs(l - r) > 1e-6 * Math.max(1, Math.abs(r))) equationTrue = false;
    }
    if (!equationTrue) {
        showFeedback("✕ Cette équation n'est pas correcte : vérifie tes calculs.", false);
        hadError = true;
        return;
    }
    history.push(JSON.parse(JSON.stringify(state)));
    renderHistory();
    stepOneValidated = true;

    const target = currentExercise.targetId;
    const leftFull  = isFullyIsolatedSeq(state.left, target);
    const rightFull = !leftFull && isFullyIsolatedSeq(state.right, target);
    const leftLoose  = !leftFull && isIsolatedSeq(state.left, target);
    const rightLoose = !rightFull && !leftLoose && isIsolatedSeq(state.right, target);

    const onesTotal = countOnesIn(state.left) + countOnesIn(state.right);
    const onesElsewhere = onesTotal - (leftLoose ? 1 : 0) - (rightLoose ? 1 : 0);
    const nakedHalfNum = countNakedHalfNumIn(state.left) + countNakedHalfNumIn(state.right);
    const residual = onesElsewhere + nakedHalfNum;
    const complete = leftFull && residual === 0;

    if (complete) {
        resolved = true;
        document.getElementById('workZone').classList.add('hidden');
        const dm = document.getElementById('doneMsg');
        dm.classList.remove('hidden');
        showFeedback('', true);
        if (currentExercise.onSolved) currentExercise.onSolved(dm);
        else dm.innerHTML = '🎉 Équation résolue !';
    } else {
        let msg;
        if (rightFull) {
            msg = "✓ Étape correcte ! Il ne reste plus qu'à inverser le sens de l'équation avec ⇄.";
        } else if (rightLoose) {
            msg = "✓ Étape correcte ! Inverse le sens de l'équation avec ⇄, puis retire le dénominateur qui vaut 1.";
        } else if (leftLoose && residual > 0) {
            msg = "✓ Étape correcte ! Retire les 1 inutiles.";
        } else if (leftLoose) {
            msg = "✓ Étape correcte ! La grandeur à isoler ne doit plus être dans une fraction : clique sur la croix du dénominateur pour le supprimer.";
        } else if (leftFull && residual > 0) {
            msg = "✓ Retire les 1 inutiles.";
        } else if (residual > 0) {
            // cas general (ex. le "1" residuel d'une fraction 1/2 dont le
            // denominateur 2 a ete extrait) : meme sans correspondre a un motif
            // "grandeur isolee" precis, un 1 qui multiplie encore quelque chose
            // doit etre retire
            msg = "✓ Étape correcte ! Retire le 1 inutile qui multiplie encore un terme.";
        } else {
            msg = "✓ Étape correcte, continue !";
        }
        showFeedback(msg, true);
        state = JSON.parse(JSON.stringify(state));
        refreshView();
    }
}

    });

function nextModule7Question(){ m7Idx++; renderModule7Question(); }
function abandonQuestion7(){
    m7Answers.push({ num: m7Idx+1, pts: 0, max: 2 });
    m7Idx++; renderModule7Question();
}
function finishModule7() {
    const pct = Math.round(m7Score / m7MaxScore * 100);
    const isMax = m7Score >= m7TrueMaxScore;
    const recapHtml = m7Answers.map(a => `<div class="recap-item">Q${a.num}<br><b>${a.pts}/${a.max}</b></div>`).join('');
    document.getElementById('app').innerHTML = `
      <div class="bg-white rounded-xl shadow-lg p-8 text-center">
        <h2 class="text-2xl font-bold text-indigo-900 mb-2">Entraînement terminé !</h2>
        ${isMax ? `<p class="text-lg font-bold text-amber-600 mb-2">🏆 Score maximal ! Bravo, c'est un sans-faute parfait !</p>` : ''}
        <p class="text-lg text-gray-700 mb-4">Score : ${m7Score} / ${m7MaxScore} points (${pct}%)</p>
        <button onclick="startModule7Graded()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-bold shadow">↺ Recommencer l'entraînement</button>
        <a href="module_8.html" class="inline-block bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-bold shadow ml-2">Passer au module 8 →</a>
        <div class="text-sm font-bold text-gray-500 mt-6 mb-2 text-left">Détail des points</div>
        <div class="recap-grid">${recapHtml}</div>
      </div>`;
    if (isMax) launchConfetti();
}
let confettiInterval = null;
function launchConfetti() {
    if (confettiInterval) return;
    spawnConfettiBurst();
    confettiInterval = setInterval(spawnConfettiBurst, 700);
}
function spawnConfettiBurst() {
    const colors = ['#4f46e5','#22c55e','#f59e0b','#ef4444','#06b6d4'];
    for (let i = 0; i < 24; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = (Math.random()*100) + 'vw';
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.animationDuration = (2.5 + Math.random()*1.5) + 's';
        el.style.animationDelay = (Math.random()*0.4) + 's';
        el.style.transform = `rotate(${Math.random()*360}deg)`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4500);
    }
}

renderModule7Intro();
</script>
