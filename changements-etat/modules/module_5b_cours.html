<!DOCTYPE html>

<title>Module 5 : plusieurs étapes, refroidissement — Chapitre 11 : Changements d'état et transferts thermiques</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="ce.css">
<link rel="stylesheet" href="../../assets/sommaire.css">

<script src="ce.js"></script>

</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 5 · COURS 2 / 2</span>
    <h2 class="er-titre">Plusieurs étapes, refroidissement</h2>
    <p class="er-contexte">Le schéma des étapes marche pour toutes les transformations : <b>quatre étapes</b> pour faire passer de la glace à la vapeur, des <b>énergies négatives</b> pour un refroidissement.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Quatre étapes : l'exercice 14 (250 g de glace à −23 °C → vapeur
      à 100 °C ; Q₁ ≈ 1,13 × 10⁴ J, Q₂ ≈ 8,35 × 10⁴ J, Q₃ ≈ 1,05 × 10⁵ J,
      Q₄ ≈ 5,64 × 10⁵ J ; Q ≈ 7,64 × 10⁵ J), données du manuel.
   2. Refroidissement : l'exercice 15 (R22 à 18 bar, gaz 70 °C → gaz
      49 °C → liquide 49 °C → liquide 30 °C, m = 2,00 kg ; Q ≈ −5,43 × 10⁵ J :
      le fluide cède 5,43 × 10⁵ J).
   « À toi » : 400 g de glace à −10 °C → eau à 50 °C (Q ≈ 2,26 × 10⁵ J) ;
   1,0 kg de vapeur à 110 °C → eau à 40 °C (Q ≈ −2,53 × 10⁶ J).
   Valeurs vérifiées par un script.
   ============================================================ */
const { exemple } = COURS;
const { probleme, resolu, schemaPb, calculEtape, etapes, versCours, sci, PROBLEMES } = CE;
const calc = h => `<p class="crs-calc">${h}</p>`;
const methode = pb => etapes(pb).map(versCours);
const item = (titre, def) => { const pb = probleme(def); return { titre, enonce: pb.enonce, parties: methode(pb) }; };
// calculs de chaque flèche puis somme
const somme = pb => pb.etapes.map(e => calculEtape(pb, e)).join('') +
  calc(`Q = ${pb.etapes.map(e => CE.nomQ(pb, e.k)).join(' + ')} = ${pb.etapes.map(e => sci(e.Q, 3)).join(' + ').replace(/\+ −/g, '− ')} ≈ <span class="c">${sci(pb.Q, 3)} J</span>`);

/* ---------- 1. Quatre étapes ---------- */
function etape1(c) {
  const carte = c.carte('1. Quatre étapes : de la glace à la vapeur');
  const pb = resolu(PROBLEMES.ex14());
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Méthode.</b> On passe par <b>chaque température de changement d'état</b> : la glace chauffe jusqu'à 0 °C, fond, l'eau chauffe jusqu'à 100 °C, se vaporise… Une flèche par étape, une formule par flèche.</p>
        <p>Le bon c est celui de la <b>bulle</b> (glace, eau, vapeur) ; le bon L est celui de la <b>flèche</b> (fusion, vaporisation).</p></div>
    </div>
    ${exemple(`<p>On veut faire évaporer 250 g de glace prise à −23 °C (c<sub>glace</sub> = 1 970, c<sub>eau liquide</sub> = 4 180 J·kg<sup>−1</sup>·K<sup>−1</sup> ; L<sub>fus</sub> = 334 kJ·kg<sup>−1</sup> ; L<sub>vap</sub> = 2 257 kJ·kg<sup>−1</sup>).</p>
      ${schemaPb(pb)}${somme(pb)}<p>Q > 0 : la glace reçoit 7,64 × 10<sup>5</sup> J.</p>`, 'Exemple : l\'exercice 14 (Mike Horn et son thé)')}`);
  c.aToi(carte, [item('Trois étapes', { corps: 'eau', m: .4, mTxt: '400 g', ei: 's', ti: -10, ef: 'l', tf: 50 })]);
  return carte;
}

/* ---------- 2. Refroidissement ---------- */
function etape2(c) {
  const carte = c.carte('2. Un refroidissement : des énergies négatives');
  const pb = resolu(PROBLEMES.ex15());
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Refroidir.</b> Quand on refroidit, chaque flèche a une énergie <b>négative</b> : T<sub>f</sub> − T<sub>i</sub> < 0, et pour une liquéfaction ou une solidification, L = −L<sub>vap</sub> ou −L<sub>fus</sub>.</p>
        <p>Si la pression n'est pas la pression atmosphérique, on l'écrit sur les bulles : la température de changement d'état en dépend.</p></div>
    </div>
    ${exemple(`<p>Dans une pompe à chaleur, 2,00 kg de fluide R22 gazeux à 70 °C, sous 18 bar, cèdent de la chaleur jusqu'à devenir liquide à 30 °C. À 18 bar, il se liquéfie à 49 °C (L = 233,7 kJ·kg<sup>−1</sup> ; c<sub>liq</sub> = 1,257 kJ·kg<sup>−1</sup>·K<sup>−1</sup> ; c<sub>gaz</sub> = 0,662 kJ·kg<sup>−1</sup>·K<sup>−1</sup>).</p>
      ${schemaPb(pb)}<p>La première bulle est gazeuse : à 70 °C, le fluide est au-dessus de 49 °C.</p>${somme(pb)}
      <p>Q < 0 : le fluide a <b>cédé</b> 5,43 × 10<sup>5</sup> J au milieu extérieur.</p>`, 'Exemple : l\'exercice 15 (fluide R22)')}`);
  c.aToi(carte, [item('Refroidir de la vapeur', { corps: 'eau', m: 1, mTxt: '1,0 kg', ei: 'g', ti: 110, ef: 'l', tf: 40 })]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p>On passe par chaque température de changement d'état : une bulle par état, une flèche par étape. Le c est celui de la bulle, le L celui de la flèche.</p></div>
    <div class="cle"><p>Refroidissement : toutes les énergies sont négatives (T<sub>f</sub> − T<sub>i</sub> < 0 ; L<sub>liquéfaction</sub> = −L<sub>vap</sub>, L<sub>solidification</sub> = −L<sub>fus</sub>). Q < 0 : énergie cédée au milieu extérieur.</p></div>
    <div class="cle"><p>Pression différente de la pression atmosphérique : on l'écrit sur les bulles.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_5_entrainement.html">Entraînement : problèmes au hasard →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_5_questions.html">Questions sur le schéma des étapes</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_5.html#plusieurs">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
CE.menu('module_5b_cours');
</script>
</body>
</html>
