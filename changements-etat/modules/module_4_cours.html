<title>Module 4 : énergie et changement d'état — Chapitre 11 : Changements d'état et transferts thermiques</title>

<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 4 · COURS</span>
    <h2 class="er-titre">Énergie et changement d'état</h2>
    <p class="er-contexte">Pour faire changer d'état une masse m d'un corps pur, il faut l'énergie <b>Q = m × L</b>. Pendant le changement d'état, la <b>température reste constante</b>, et le <b>signe de L</b> dit si le corps reçoit ou cède de l'énergie.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Q = m L (E ou Q en J, m en kg, L en J·kg⁻¹ ; aussi kJ·kg⁻¹, J·g⁻¹)
   2. Pendant un changement d'état d'un corps pur, la température reste
      constante (paliers de la courbe de chauffage)
   3. Signe : astuce (la transformation a besoin d'énergie, vers un état
      plus désordonné : L > 0 ; et inversement L < 0) ; transformation
      inverse : même valeur, signe opposé
   Valeurs (vérifiées par un script) : 0,500 × 334 × 10³ ≈ 1,67 × 10⁵ J ;
   0,200 × 2 257 × 10³ ≈ 4,51 × 10⁵ J ; 50 × 334 ≈ 1,67 × 10⁴ J ;
   2,0 × (−2 257 × 10³) ≈ −4,51 × 10⁶ J ; 0,300 × (−334 × 10³) ≈ −1,00 × 10⁵ J.
   ============================================================ */
const { exemple } = COURS;
const { o, proche, dessin } = CE;
const calc = h => `<p class="crs-calc">${h}</p>`;
const c_ = h => `<span class="c">${h}</span>`;
const pr = (a, b) => proche(a, b, .015);
const UL = 'J·kg<sup>−1</sup>', ULk = 'kJ·kg<sup>−1</sup>';
// diagnostics des erreurs classiques sur Q = m L
function diagL(v, Q, gr) {
  if (pr(v, -Q)) return Q > 0 ? 'Le corps reçoit de l\'énergie pour ce changement d\'état : L > 0, Q > 0.' : 'Le corps cède de l\'énergie : L est négative, Q aussi.';
  if (pr(v, Q * 1000)) return gr ? 'Avec m en g, prends L en J·g<sup>−1</sup> (ou bien m en kg et L en J·kg<sup>−1</sup>).' : 'La masse doit être en kg : 1 g = 10<sup>−3</sup> kg.';
  if (pr(v, Q / 1000) || pr(v, -Q / 1000)) return 'Convertis L en J·kg<sup>−1</sup> : 1 kJ = 10<sup>3</sup> J.';
  return 'Q = m × L, avec m en kg et L en J·kg<sup>−1</sup>.';
}

/* ---------- 1. Q = m L ---------- */
function etape1(c) {
  const carte = c.carte('1. L\'énergie pour changer d\'état');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Formule.</b> L'énergie reçue (ou cédée) par une masse m d'un corps pur qui change d'état est :</p>
        <p class="crs-formule">Q = m × L</p>
        <p>On la note aussi E. Q en <b>J</b>, m en <b>kg</b>, L (chaleur latente du changement d'état) en <b>J·kg<sup>−1</sup></b>. L est souvent donnée en kJ·kg<sup>−1</sup> (× 10<sup>3</sup>) ou en J·g<sup>−1</sup> (alors m en g).</p></div>
    </div>
    ${exemple(`<p>On fait fondre 500 g de glace à 0 °C (L<sub>fus</sub> = 334 ${ULk}).</p>
      ${calc(`m = 500 g = 0,500 kg ; L<sub>fus</sub> = 334 ${ULk} = 334 × 10<sup>3</sup> ${UL}`)}
      ${calc(`Q = m × L<sub>fus</sub> = 0,500 × 334 × 10<sup>3</sup> = ${c_('1,67 × 10<sup>5</sup> J')}`)}`)}`);
  c.aToi(carte, [
    { titre: 'Vaporiser de l\'eau', enonce: `<p>On vaporise 200 g d'eau à 100 °C (L<sub>vap</sub> = 2 257 ${ULk}).</p>`,
      parties: [{ type: 'sci', q: 'Calcule Q (3 chiffres significatifs).', label: 'Q =', valeur: .2 * 2257e3, unite: 'J', cs: 3, rel: .01, diag: v => diagL(v, .2 * 2257e3),
        solution: calc(`Q = 0,200 × 2 257 × 10<sup>3</sup> = ${c_('4,51 × 10<sup>5</sup> J')}`) }] },
    { titre: 'L en J·g⁻¹', enonce: '<p>On fait fondre 50 g de glace à 0 °C. On donne L<sub>fus</sub> = 334 J·g<sup>−1</sup>.</p>',
      parties: [{ type: 'sci', q: 'Calcule Q (3 chiffres significatifs).', label: 'Q =', valeur: 50 * 334, unite: 'J', cs: 3, rel: .01, diag: v => diagL(v, 50 * 334, true),
        solution: calc(`Q = m × L = 50 g × 334 J·g<sup>−1</sup> = ${c_('1,67 × 10<sup>4</sup> J')}`) + '<p>m en g avec L en J·g<sup>−1</sup> : le résultat est bien en J.</p>' }] },
  ]);
  return carte;
}

/* ---------- 2. Température constante ---------- */
function etape2(c) {
  const carte = c.carte('2. La température reste constante');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Palier.</b> Pendant le changement d'état d'un <b>corps pur</b>, la <b>température reste constante</b> : toute l'énergie reçue sert à changer d'état (à rompre les liaisons entre molécules).</p></div>
    </div>
    ${exemple(`${dessin('palier')}<p>On chauffe régulièrement de la glace à −20 °C : la température monte, reste à <b>0 °C</b> pendant la fusion, monte, reste à <b>100 °C</b> pendant l'ébullition, puis monte encore.</p>`, 'Exemple : courbe de chauffage de l\'eau')}`);
  c.aToi(carte, [
    { titre: 'Pendant l\'ébullition',
      parties: [{ type: 'choix', q: 'On chauffe de l\'eau qui bout à 100 °C sous 1 bar. Pendant l\'ébullition, sa température…', melanger: false,
        options: [o('cst', 'reste à 100 °C'), o('monte', 'continue de monter'), o('baisse', 'baisse')], bonne: 'cst',
        indices: { monte: 'Pendant un changement d\'état d\'un corps pur, l\'énergie reçue sert à changer d\'état : la température ne monte pas.', baisse: 'On chauffe : l\'eau reçoit de l\'énergie, sa température ne baisse pas.' },
        solution: '<p>Elle <b>reste à 100 °C</b> tant qu\'il reste de l\'eau liquide : c\'est le palier d\'ébullition.</p>' }] },
    { titre: 'Le premier palier', enonce: dessin('palier', { sans: true }),
      parties: [{ type: 'choix', q: 'Que se passe-t-il pendant le premier palier ?', melanger: false,
        options: [o('fus', 'la fusion de la glace'), o('vap', 'l\'ébullition de l\'eau'), o('temp', 'la glace se réchauffe')], bonne: 'fus',
        indices: { vap: 'L\'ébullition se fait à 100 °C : c\'est le deuxième palier.', temp: 'Quand la glace se réchauffe, sa température monte : ce n\'est pas un palier.' },
        solution: '<p>Le premier palier, à 0 °C, est la <b>fusion</b> : glace et eau liquide coexistent.</p>' }] },
  ]);
  return carte;
}

/* ---------- 3. Signe de L ---------- */
function etape3(c) {
  const carte = c.carte('3. Le signe de L');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Astuce.</b> Si la transformation a <b>besoin d'énergie</b> pour se faire, L est <b>positive</b>. C'est le cas quand on passe à un état <b>plus désordonné</b> : solide → liquide (fusion), liquide → gaz (vaporisation), et aussi solide → gaz (sublimation), même si c'est plus rare.</p>
        <p>Et inversement : vers un état <b>plus ordonné</b> (solidification, liquéfaction, condensation), le corps <b>cède</b> de l'énergie : L est <b>négative</b>.</p></div>
      <div class="cle"><p><b class="cle-titre">Transformation inverse.</b> Pour la transformation inverse, L a <b>la même valeur</b>, mais <b>le signe opposé</b> :</p>
        <p class="crs-formule">L<sub>solidification</sub> = −L<sub>fusion</sub></p>
        <p>De même : L<sub>liquéfaction</sub> = −L<sub>vaporisation</sub> et L<sub>condensation</sub> = −L<sub>sublimation</sub>. Pour l'eau : L<sub>fus</sub> = 334 ${ULk}, donc L<sub>sol</sub> = −334 ${ULk}.</p></div>
    </div>
    ${exemple(`<p>2,0 kg de vapeur d'eau se liquéfient à 100 °C (L<sub>vap</sub> = 2 257 ${ULk}).</p>
      ${calc(`Q = m × L<sub>liquéfaction</sub> = m × (−L<sub>vap</sub>) = 2,0 × (−2 257 × 10<sup>3</sup>) = ${c_('−4,51 × 10<sup>6</sup> J')}`)}
      <p>Q < 0 : la vapeur <b>cède</b> 4,51 × 10<sup>6</sup> J en se liquéfiant.</p>`)}`);
  c.aToi(carte, [
    { titre: 'Faire des glaçons', enonce: `<p>300 g d'eau liquide à 0 °C se solidifient au congélateur (L<sub>fus</sub> = 334 ${ULk}).</p>`,
      parties: [{ type: 'sci', q: 'Calcule Q (3 chiffres significatifs, signe compris).', label: 'Q =', valeur: -.3 * 334e3, unite: 'J', cs: 3, rel: .01, diag: v => diagL(v, -.3 * 334e3),
        solution: calc(`Q = m × (−L<sub>fus</sub>) = 0,300 × (−334 × 10<sup>3</sup>) = ${c_('−1,00 × 10<sup>5</sup> J')}`) + '<p>L\'eau cède cette énergie au congélateur.</p>' }] },
    { titre: 'Conversion', enonce: `<p>Pour l'aluminium, L<sub>fus</sub> = 397 ${ULk}.</p>`,
      parties: [{ type: 'nombre', q: 'Écris L<sub>fus</sub> en J·kg<sup>−1</sup>.', label: 'L<sub>fus</sub> =', valeur: 397000, unite: UL, signe: false, tol: .5,
        diag: v => (pr(v, .397) ? '1 kJ = 1 000 J : on multiplie par 1 000.' : pr(v, 39700) || pr(v, 3970000) ? 'Multiplie par 1 000 exactement (10<sup>3</sup>).' : '397 kJ·kg<sup>−1</sup> = 397 × 10<sup>3</sup> J·kg<sup>−1</sup>.'),
        solution: calc(`L<sub>fus</sub> = 397 × 10<sup>3</sup> = ${c_('397 000 ' + UL)}`) }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p class="crs-formule">Q = m × L</p><p>Q (ou E) en J, m en kg, L en J·kg<sup>−1</sup> (kJ·kg<sup>−1</sup> × 10<sup>3</sup> ; avec L en J·g<sup>−1</sup>, m en g).</p></div>
    <div class="cle"><p>Pendant le changement d'état d'un corps pur, la température reste constante (palier).</p></div>
    <div class="cle"><p>La transformation a besoin d'énergie (vers un état plus désordonné) : L > 0 (fusion, vaporisation, sublimation). Vers un état plus ordonné : L < 0 (solidification, liquéfaction, condensation).</p>
      <p>Transformation inverse : même valeur de L, signe opposé (L<sub>sol</sub> = −L<sub>fus</sub>, L<sub>liq</sub> = −L<sub>vap</sub>, L<sub>cond</sub> = −L<sub>sub</sub>).</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_4_questions.html">Questions sur Q = m L →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_5a_cours.html">Module 5 : le schéma des étapes</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_4.html">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
CE.menu('module_4_cours');
</script>
</body>
