<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 5 : une ou deux étapes — Chapitre 11 : Changements d'état et transferts thermiques</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="ce.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="ce.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 5 · COURS 1 / 2</span>
    <h2 class="er-titre">La méthode du schéma des étapes : une ou deux étapes</h2>
    <p class="er-contexte">Avant tout calcul, on dessine le <b>schéma des étapes</b> : une <b>bulle</b> par état (état physique et température), une <b>flèche</b> par étape. Chaque flèche a sa formule : plus besoin de chercher « la » formule.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. La méthode : bulles (état, température), flèches Q₁, Q₂… :
      changement de température (Q = m c_état ΔT) ou changement d'état
      à température fixe (Q = m L) ; Q = Q₁ + Q₂ + … ; signe.
      Exemples à une étape ; « À toi » : toute la méthode (CE.etapes).
   2. Deux étapes : le dégivrage du bac blanc (glace −10 °C → glace 0 °C
      → eau 0 °C, m = 2,3 kg) : E₁ ≈ 4,81 × 10⁴ J, E₂ ≈ 7,66 × 10⁵ J,
      E ≈ 8,14 × 10⁵ J.
   Valeurs (vérifiées par un script) : 0,500 × 4 180 × 40 ≈ 8,36 × 10⁴ J ;
   0,200 × 334 × 10³ ≈ 6,68 × 10⁴ J ; 0,800 × 4 180 × 60 ≈ 2,01 × 10⁵ J ;
   0,250 × 2 257 × 10³ ≈ 5,64 × 10⁵ J ; 0,500 × 4 180 × 40 + 0,500 × 2 257 × 10³ ≈ 1,21 × 10⁶ J.
   ============================================================ */
const { exemple } = COURS;
const { probleme, resolu, schemaPb, calculEtape, etapes, versCours, sci, PROBLEMES } = CE;
const calc = h => `<p class="crs-calc">${h}</p>`;
// toute la méthode, en parties du cours ; un « À toi » par problème
const methode = pb => etapes(pb).map(versCours);
const item = (titre, def) => { const pb = probleme(def); return { titre, enonce: pb.enonce, parties: methode(pb) }; };

/* ---------- 1. La méthode ---------- */
function etape1(c) {
  const carte = c.carte('1. Les bulles et les flèches');
  const p1 = resolu(probleme({ corps: 'eau', m: .5, mTxt: '500 g', ei: 'l', ti: 20, ef: 'l', tf: 60 }));
  const p2 = resolu(probleme({ corps: 'eau', m: .2, mTxt: '200 g', ei: 's', ti: 0, ef: 'l', tf: 0 }));
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Le schéma.</b></p>
        <ul class="er-liste"><li><b>Bulles</b> : chacune porte l'<b>état physique</b> (glace, eau, gaz…) et la <b>température</b> (et la pression si elle n'est pas atmosphérique), de l'état de départ à l'état final ;</li>
          <li><b>Flèches</b> : chaque flèche est <b>une étape</b>, notée Q<sub>1</sub>, Q<sub>2</sub>… Soit l'état ne change pas et la température change : <b>Q = m × c<sub>état</sub> × (T<sub>f</sub> − T<sub>i</sub>)</b> ; soit l'état change à température fixe : <b>Q = m × L</b>.</li></ul>
        <p>Énergie totale : <b>Q = Q<sub>1</sub> + Q<sub>2</sub> + …</b> ; Q > 0 : énergie reçue ; Q < 0 : énergie cédée.</p></div>
      <div class="crs-attention"><p><b class="cle-titre">Deux règles.</b> Un changement d'état se fait à <b>température fixe</b> (deux bulles de même température, d'états différents). Un changement de température se fait <b>sans changer d'état</b>.</p></div>
    </div>
    ${exemple(`<p>On chauffe 500 g d'eau liquide de 20 °C à 60 °C : une seule flèche, un changement de température.</p>
      ${schemaPb(p1)}${calculEtape(p1, p1.etapes[0])}
      <p>On fait fondre 200 g de glace à 0 °C : une seule flèche, un changement d'état (fusion) à 0 °C.</p>
      ${schemaPb(p2)}${calculEtape(p2, p2.etapes[0])}`, 'Exemples à une étape')}`);
  c.aToi(carte, [
    item('Chauffer de l\'eau', { corps: 'eau', m: .8, mTxt: '800 g', ei: 'l', ti: 15, ef: 'l', tf: 75 }),
    item('Vaporiser de l\'eau', { corps: 'eau', m: .25, mTxt: '250 g', ei: 'l', ti: 100, ef: 'g', tf: 100 }),
  ]);
  return carte;
}

/* ---------- 2. Deux étapes : le dégivrage ---------- */
function etape2(c) {
  const carte = c.carte('2. Deux étapes : le dégivrage');
  const pb = resolu(PROBLEMES.bac());
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Quand l'état de départ et l'état final n'ont ni le même état ni la même température, il faut <b>plusieurs flèches</b> : on passe par la température du changement d'état.</p>
    </div>
    ${exemple(`<p>Une couche de 2,3 kg de glace à −10 °C recouvre l'aile d'un avion. Quelle énergie faut-il pour la transformer en eau liquide à 0 °C ? (c<sub>es</sub> = 2 090 J·kg<sup>−1</sup>·K<sup>−1</sup> pour la glace ; L<sub>fusion</sub> = 333 kJ·kg<sup>−1</sup>)</p>
      ${schemaPb(pb)}
      <p>E<sub>1</sub> : la glace chauffe de −10 °C à 0 °C ; E<sub>2</sub> : la glace fond à 0 °C.</p>
      ${pb.etapes.map(e => calculEtape(pb, e)).join('')}
      ${calc(`E = E<sub>1</sub> + E<sub>2</sub> = ${sci(pb.etapes[0].Q, 3)} + ${sci(pb.etapes[1].Q, 3)} ≈ <span class="c">${sci(pb.Q, 3)} J</span>`)}`, 'Exemple : le dégivrage (bac blanc)')}`);
  c.aToi(carte, [item('Une bouilloire qui s\'emballe', { corps: 'eau', m: .5, mTxt: '500 g', ei: 'l', ti: 60, ef: 'g', tf: 100 })]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p>Avant tout calcul : le <b>schéma des étapes</b>. Une bulle par état (état physique, température), une flèche par étape.</p></div>
    <div class="cle"><p>Flèche sans changement d'état : Q = m × c<sub>état de la bulle</sub> × (T<sub>f</sub> − T<sub>i</sub>). Flèche de changement d'état, à température fixe : Q = m × L.</p></div>
    <div class="cle"><p>Q = Q<sub>1</sub> + Q<sub>2</sub> + … ; Q > 0 : énergie reçue ; Q < 0 : énergie cédée.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_5b_cours.html">Cours : plusieurs étapes, refroidissement →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_5.html#deux">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
CE.menu('module_5a_cours');
</script>
</body>
</html>
