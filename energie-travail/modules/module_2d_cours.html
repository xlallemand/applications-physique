<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : accélérateur linéaire — Énergie et travail</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="../../assets/equations.css">
<link rel="stylesheet" href="et.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="et.js"></script>
<script src="figures.js"></script>
<script src="../../assets/equations.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS 4 / 4</span>
    <h2 class="er-titre">Accélérateur linéaire</h2>
    <p class="er-contexte">La vitesse de sortie d'un condensateur se trouve en quelques lignes avec le <b>théorème de l'énergie cinétique</b> et le travail <b>W = q U</b> : le même résultat que par la méthode de Newton, bien plus vite.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Particule q > 0 sans vitesse initiale, tension U : ½ m v_B² = qU,
      v_B = √(2qU/m) ; comparaison avec la méthode de « Mouvement dans un
      champ uniforme » (lien facultatif) ; « À toi » : isoler v_B avec
      l'éditeur d'équations EQ, puis un proton (10 kV : 1,4 × 10⁶ m·s⁻¹)
   2. Électron qui arrive avec v₀ : ½ m v_B² − ½ m v₀² = eU (signe à
      justifier : travail moteur) ; « À toi » : calcul
   Valeurs (vérifiées par un script).
   ============================================================ */
const { exemple, hasard } = COURS;
const { fmt, sci, proche, fr, rac, W, V, MS, CALC, figAcc, E_CH, M_P, M_E, o } = ET;
const calc = h => `<p class="crs-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const DEC = 'Δ<sub>OB</sub>E<sub>c</sub>', WE = `W<sub>OB</sub>(${V('F', 'él')})`, vB = 'v<sub>B</sub>', v0 = 'v<sub>0</sub>';
const v2 = x => `${x}<sup>2</sup>`;
const GV = { v: vB, q: 'q', U: 'U', m: 'm', deux: '2' };

/* ---------- 1. Particule sans vitesse initiale ---------- */
function etape1(c_) {
  const carte = c_.carte('1. Vitesse de sortie');
  c_.ajouter(carte, `<div class="cours-bloc">
      <p>Une particule de charge q > 0 est placée en O, sans vitesse initiale, dans un condensateur plan de largeur L soumis à la tension U. On cherche sa vitesse à la sortie B.</p>
      ${figAcc({ q: 1 })}
      <p><b>Bilan des forces</b> : ${V('F', 'él')} = q ${V('E')} (poids négligeable). D'après le théorème de l'énergie cinétique entre O et B :</p>
      ${calc(`${DEC} = ${WE} &nbsp; ⟺ &nbsp; ½ m ${v2(vB)} − 0 = +q U &nbsp; (travail moteur)`)}
      <div class="cle"><p class="crs-formule">${vB} = ${rac(fr('2 q U', 'm'))}</p></div>
      <div class="ph-lien-app"><p>Le même résultat par la seconde loi de Newton (deux intégrations, x(t<sub>sortie</sub>) = L) : bien plus long !</p><a class="btn-small" href="../../champ-uniforme/modules/module_5a_cours.html" target="_blank" rel="noopener">Mouvement dans un champ uniforme ↗</a></div>
    </div>
    ${exemple(`<p>Un proton (m<sub>p</sub> = 1,67 × 10<sup>−27</sup> kg, e = 1,60 × 10<sup>−19</sup> C) est accéléré sans vitesse initiale sous U = 10 kV.</p>
      ${calc(`${vB} = ${rac(fr('2 e U', 'm<sub>p</sub>'))} = ${rac(fr('2 × 1,60 × 10<sup>−19</sup> × 1,0 × 10<sup>4</sup>', '1,67 × 10<sup>−27</sup>'))} = ${c('1,4 × 10<sup>6</sup> ' + MS)}`)}`)}`);
  const U = hasard([500, 2000, 8000]), v = Math.sqrt(2 * E_CH * U / M_P);
  c_.aToi(carte, [
    { titre: 'Isole v<sub>B</sub>', enonce: '<p class="er-consigne">Dans l\'éditeur, isole v<sub>B</sub> dans ½ m v<sub>B</sub><sup>2</sup> = q U : glisse les grandeurs d\'un membre à l\'autre, puis l\'outil √ sur les deux membres.</p>',
      parties: [EQ.partie(EQ.exercice({ eq: '[1|deux] m v^2 = q U', g: GV, cible: 'v', outils: ['sqrt'],
        valeurs: () => { const m = 1 + Math.random() * 9, v = 1 + Math.random() * 9, q = 1 + Math.random() * 4; return { m, v, q, U: m * v * v / (2 * q), deux: 2 }; },
        aides: ['m et ½ sont en facteur de v<sup>2</sup> : glisse m et le 2 de l\'autre côté du signe =.', 'Applique √ aux deux membres pour passer de v<sup>2</sup> à v.'] }),
        { solution: `<p>${vB} = ${rac(fr('2 q U', 'm'))}</p>` })] },
    { titre: 'Un proton', enonce: `<p>Un proton (m<sub>p</sub> = 1,67 × 10<sup>−27</sup> kg, e = 1,60 × 10<sup>−19</sup> C) part du repos et est accéléré sous U = ${fmt(U)} V.</p>`,
      parties: [{ type: 'sci', q: `Calcule sa vitesse de sortie (2 chiffres significatifs).`, label: `${vB} =`, valeur: v, cs: 2, rel: .02, unite: MS + CALC,
        diag: x => (proche(x, v * v, .05) ? 'Tu as calculé v<sub>B</sub>² : prends la racine.' : proche(x, v / Math.SQRT2, .03) ? `N'oublie pas le 2 : v<sub>B</sub> = ${rac(fr('2 e U', 'm'))}.` : `${vB} = ${rac(fr('2 e U', 'm<sub>p</sub>'))}.`),
        solution: calc(`${vB} = ${rac(fr(`2 × 1,60 × 10<sup>−19</sup> × ${fmt(U)}`, '1,67 × 10<sup>−27</sup>'))} = ${c(sci(v, 2) + ' ' + MS)}`) }] },
  ]);
  return carte;
}

/* ---------- 2. Électron avec une vitesse initiale ---------- */
function etape2(c_) {
  const carte = c_.carte('2. Avec une vitesse initiale');
  c_.ajouter(carte, `<div class="cours-bloc">
      <p>Un électron arrive en O avec une vitesse ${V('v', '0')} dans un condensateur de largeur L soumis à la tension U. La force ${V('F', 'él')} = −e ${V('E')} est dans le sens du mouvement : son travail est <b>moteur</b>, ${WE} = +e U (signe à justifier sur la copie).</p>
      ${figAcc({ q: -1, v0: true })}
      ${calc(`${DEC} = ${WE} &nbsp; ⟺ &nbsp; ½ m ${v2(vB)} − ½ m ${v2(v0)} = e U`)}
      ${calc(`${v2(vB)} − ${v2(v0)} = ${fr('2 e U', 'm')} &nbsp; ⟺ &nbsp; ${vB} = ${rac(`${fr('2 e U', 'm')} + ${v2(v0)}`)}`)}
    </div>
    ${exemple(`<p>Électron (m<sub>e</sub> = 9,11 × 10<sup>−31</sup> kg) entrant à ${v0} = 1,0 × 10<sup>6</sup> ${MS}, U = 100 V :</p>
      ${calc(`${vB} = ${rac(`${fr('2 × 1,60 × 10<sup>−19</sup> × 100', '9,11 × 10<sup>−31</sup>')} + (1,0 × 10<sup>6</sup>)<sup>2</sup>`)} = ${c('6,0 × 10<sup>6</sup> ' + MS)}`)}`)}`);
  const U = hasard([50, 200, 400]), vi = hasard([2e6, 3e6]), v = Math.sqrt(2 * E_CH * U / M_E + vi * vi);
  c_.aToi(carte, [
    { titre: 'Le signe', parties: [{ type: 'choix', q: 'Pour un électron qui va de l\'armature − vers l\'armature +, le travail de la force électrique vaut :', colonne: false, melanger: false,
      options: [o('p', '+e U'), o('m', '−e U'), o('0', '0')], bonne: 'p', indices: { m: 'L\'électron est attiré par l\'armature + : la force est dans le sens du mouvement, travail moteur.', 0: 'La force est parallèle au déplacement.' },
      solution: '<p>Travail moteur : W = +e U.</p>' }] },
    { titre: 'Vitesse de sortie', enonce: `<p>Un électron (m<sub>e</sub> = 9,11 × 10<sup>−31</sup> kg) entre à ${sci(vi, 1)} ${MS} dans un condensateur soumis à U = ${U} V, qui l'accélère.</p>`,
      parties: [{ type: 'sci', q: 'Calcule sa vitesse de sortie (2 chiffres significatifs).', label: `${vB} =`, valeur: v, cs: 2, rel: .02, unite: MS + CALC,
        diag: x => (proche(x, Math.sqrt(2 * E_CH * U / M_E), .02) ? `N'oublie pas la vitesse initiale : + ${v2(v0)} sous la racine.` : proche(x, Math.sqrt(2 * E_CH * U / M_E) + vi, .02) ? 'On ajoute les carrés des vitesses (sous la racine), pas les vitesses.' : `${vB} = ${rac(`${fr('2 e U', 'm')} + ${v2(v0)}`)}.`),
        solution: calc(`${vB} = ${rac(`${fr(`2 × 1,60 × 10<sup>−19</sup> × ${U}`, '9,11 × 10<sup>−31</sup>')} + (${sci(vi, 1)})<sup>2</sup>`)} = ${c(sci(v, 2) + ' ' + MS)}`) }] },
  ]);
  return carte;
}

function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>Théorème de l'énergie cinétique entre l'entrée et la sortie, avec W = q U (signe : moteur ou résistant) : ½ m ${v2(vB)} − ½ m ${v2(v0)} = |q| U pour une particule accélérée.</p></div>
    <div class="cle"><p>Sans vitesse initiale : ${vB} = ${rac(fr('2 q U', 'm'))}, le même résultat que par la seconde loi de Newton.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2_questions.html">Questions sur le théorème →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_3a_cours.html">Module 3 : énergie mécanique</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html#accelerateur">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
ET.menu('module_2d_cours');
</script>
</body>
</html>
