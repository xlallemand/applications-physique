<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : frottements et énergie perdue — Énergie et travail</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="et.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="et.js"></script>
<script src="figures.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · COURS 3 / 3</span>
    <h2 class="er-titre">Frottements et énergie perdue</h2>
    <p class="er-contexte">Avec des frottements, l'énergie mécanique <b>diminue</b>. L'énergie perdue (transformée en énergie thermique) est égale au <b>travail des forces de frottement</b>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. E_m diminue ; ΔE_m = W(f⃗) (perte = travail des frottements) ;
      lancer de balle avec frottements (5 J perdus) ; « À toi » : ΔE_m,
      présence de frottements, W(f⃗)
   2. En déduire la force de frottement (constante, opposée au
      mouvement) : W(f⃗) = −f × d ; « À toi » : f
   Valeurs (vérifiées par un script).
   ============================================================ */
const { exemple, hasard } = COURS;
const { fmt, proche, nomV, W, MS, CALC, figEnergies, o } = ET;
const calc = h => `<p class="crs-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const G = 'm·s<sup>−2</sup>', EPP = 'E<sub>pp</sub>', EM = 'E<sub>m</sub>', EC = 'E<sub>c</sub>', DEM = 'ΔE<sub>m</sub>', WFR = W('f');
const r3 = v => fmt(+v.toPrecision(3));

/* ---------- 1. L'énergie perdue ---------- */
function etape1(c_) {
  const carte = c_.carte('1. E<sub>m</sub> diminue');
  c_.ajouter(carte, `<div class="cours-bloc">
      <p>S'il y a des pertes d'énergie (par frottements par exemple), l'énergie mécanique <b>diminue</b> : elle est transformée en énergie thermique.</p>
      <div class="cle"><p>La perte d'énergie mécanique correspond au travail des forces de frottement :</p>
        <p class="crs-formule">${DEM} = ${EM}(B) − ${EM}(A) = ${WFR} &lt; 0</p></div>
    </div>
    ${exemple(`<p>Lancer d'une balle avec frottements de l'air non négligeables : ${EM} passe de 25 J à 20 J. L'énergie perdue par frottements est de ${c('5 J')} (énergie thermique) : ${WFR} = −5 J.</p>
      ${figEnergies({ frott: 5, Em0: 25, aria: 'Énergies d\'une balle lancée avec frottements : l\'énergie mécanique passe de 25 J à 20 J' })}`)}`);
  const m = hasard([0.045, 0.060]), v0 = hasard([10, 12]), z = hasard([3.5, 4.0]), dEc = -.5 * m * v0 * v0, dEp = m * 9.81 * z, dEm = dEc + dEp;
  c_.aToi(carte, [
    { titre: 'Une balle freinée par l\'air', enonce: `<p>Une balle de ${fmt(m * 1000)} g, lancée verticalement vers le haut depuis le sol à ${v0} ${MS}, atteint une altitude maximale de ${fmt(z)} m (g = 9,81 ${G}).</p>`,
      parties: [{ type: 'nombre', q: `a) Calcule la variation d'énergie cinétique ΔE<sub>c</sub> entre le départ et le sommet (3 chiffres significatifs).`, label: 'ΔE<sub>c</sub> =', valeur: dEc, rel: .01, unite: 'J' + CALC,
        diag: x => (proche(x, -dEc, .02) ? 'Final (sommet, v = 0) moins initial : négatif.' : 'ΔE<sub>c</sub> = 0 − ½ m v<sub>0</sub>².'), solution: calc(`ΔE<sub>c</sub> = 0 − ½ × ${fmt(m)} × ${v0}<sup>2</sup> = ${c(r3(dEc) + ' J')}`) },
      { type: 'nombre', q: `b) Calcule ΔE<sub>pp</sub> (3 chiffres significatifs).`, label: 'ΔE<sub>pp</sub> =', valeur: dEp, rel: .01, unite: 'J' + CALC,
        diag: x => (proche(x, -dEp, .02) ? 'La balle monte : E<sub>pp</sub> augmente.' : 'ΔE<sub>pp</sub> = m g z<sub>max</sub> − 0.'), solution: calc(`ΔE<sub>pp</sub> = ${fmt(m)} × 9,81 × ${fmt(z)} − 0 = ${c(r3(dEp) + ' J')}`) },
      { type: 'nombre', q: `c) Calcule ${DEM}, puis conclus : y a-t-il des frottements ? (2 chiffres significatifs)`, label: `${DEM} =`, valeur: dEm, rel: .03, unite: 'J' + CALC,
        diag: () => `${DEM} = ΔE<sub>c</sub> + ΔE<sub>pp</sub>.`, solution: calc(`${DEM} = ${r3(dEc)} + ${r3(dEp)} = ${c(fmt(+dEm.toPrecision(2)) + ' J')} : ${EM} a diminué, il y a des frottements ; ${WFR} = ${fmt(+dEm.toPrecision(2))} J.`) }] },
  ]);
  return carte;
}

/* ---------- 2. Trouver la force de frottement ---------- */
function etape2(c_) {
  const carte = c_.carte('2. En déduire la force de frottement');
  c_.ajouter(carte, `<div class="cours-bloc">
      <p>Si la force de frottement ${nomV('f')} est constante et toujours opposée au mouvement (α = 180°), son travail sur une distance d vaut ${WFR} = f × d × cos 180° = −f × d. Donc :</p>
      <div class="cle"><p class="crs-formule">f = −${DEM} / d</p></div>
    </div>
    ${exemple(`<p>Un palet de 200 g lancé à 4,0 ${MS} sur un sol horizontal s'arrête après 5,0 m.</p>
      ${calc(`${DEM} = ΔE<sub>c</sub> = 0 − ½ × 0,200 × 4,0<sup>2</sup> = −1,6 J (${EPP} ne change pas)`)}
      ${calc(`f = −${DEM} / d = 1,6 / 5,0 = ${c('0,32 N')}`)}`)}`);
  const m = hasard([0.5, 1.0]), h = hasard([2.0, 3.0]), v = hasard([5.0, 6.0]), L = hasard([4.0, 5.0]), dEm = .5 * m * v * v - m * 9.81 * h, f = -dEm / L;
  c_.aToi(carte, [
    { titre: 'Une glissade', enonce: `<p>Un bloc de ${fmt(m)} kg part sans vitesse du haut d'une pente de ${fmt(L)} m de long et ${fmt(h)} m de dénivelé ; il arrive en bas à ${fmt(v)} ${MS} (g = 9,81 ${G}).</p>`,
      parties: [{ type: 'nombre', q: `a) Calcule ${DEM} (3 chiffres significatifs).`, label: `${DEM} =`, valeur: dEm, rel: .01, unite: 'J' + CALC,
        diag: x => (proche(x, -dEm, .02) ? 'Final (en bas) moins initial (en haut).' : 'ΔE<sub>m</sub> = ΔE<sub>c</sub> + ΔE<sub>pp</sub> = ½ m v² − m g h.'), solution: calc(`${DEM} = ½ × ${fmt(m)} × ${fmt(v)}<sup>2</sup> − ${fmt(m)} × 9,81 × ${fmt(h)} = ${c(r3(dEm) + ' J')}`) },
      { type: 'nombre', q: 'b) En déduis la force de frottement, constante (3 chiffres significatifs).', label: 'f =', valeur: f, rel: .01, unite: 'N' + CALC, signe: false,
        diag: x => (proche(x, -dEm / h, .02) ? 'La distance parcourue est la longueur de la pente, pas le dénivelé.' : 'f = −ΔE<sub>m</sub> / d.'), solution: calc(`f = −${DEM} / L = ${r3(-dEm)} / ${fmt(L)} = ${c(r3(f) + ' N')}`) }] },
  ]);
  return carte;
}

function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>Avec des frottements, ${EM} diminue : ${DEM} = ${WFR} < 0, énergie perdue (transformée en énergie thermique).</p></div>
    <div class="cle"><p>Force de frottement constante sur une distance d : ${WFR} = −f × d, donc f = −${DEM} / d.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_3_simulation.html">Simulateur : énergies d'un skieur et d'une balle →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_3.html#frottements">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
ET.menu('module_3c_cours');
</script>
</body>
</html>
