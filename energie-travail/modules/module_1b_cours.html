<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 : travail moteur, résistant ou nul — Énergie et travail</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="et.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="et.js"></script>
<script src="figures.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 1 · COURS 2 / 5</span>
    <h2 class="er-titre">Travail moteur, résistant ou nul</h2>
    <p class="er-contexte">Le <b>signe</b> du travail dit si la force <b>favorise</b> le déplacement (travail <b>moteur</b>), s'y <b>oppose</b> (travail <b>résistant</b>) ou n'a <b>pas d'effet</b> (travail <b>nul</b>). Il suffit de regarder l'angle α.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Le tableau du cours (0° ≤ α < 90° : moteur ; 90° < α ≤ 180° :
      résistant ; α = 90° : nul), exemple : wagon tiré par des cordes ;
      « À toi » : grille d'angles, puis forces d'une situation
   ============================================================ */
const { exemple } = COURS;
const { W, nomV, figSignes, figTravail, versCours, o } = ET;
const WF = W('F');

function etape1(c_) {
  const carte = c_.carte('1. Le signe du travail');
  const col = (cas, titre, ang, cos, w, effet) => `<div class="et-signe"><p class="et-signe-t">${titre}</p>${figSignes(cas)}<p>${ang}</p><p>${cos}</p><p><b>${w}</b></p><p>${effet}</p></div>`;
  c_.ajouter(carte, `<div class="cours-bloc">
      <p>Dans ${WF} = F × AB × cos α, F et AB sont positifs : le signe du travail est celui de <b>cos α</b>.</p>
      <div class="et-signes">
        ${col('m', 'Travail moteur', '0° ≤ α < 90°', '0 < cos α ≤ 1', `${WF} > 0`, 'La force <b>favorise</b> le déplacement.')}
        ${col('r', 'Travail résistant', '90° < α ≤ 180°', '−1 ≤ cos α < 0', `${WF} < 0`, 'La force <b>ne favorise pas</b> le déplacement.')}
        ${col('n', 'Travail nul', 'α = 90°', 'cos α = 0', `${WF} = 0`, 'La force <b>n\'a pas d\'effet</b> sur le déplacement.')}
      </div>
    </div>
    ${exemple(`<p>Un wagon roule de A vers B sur des rails. Une corde tirée vers l'avant (α = 30°) a un travail <b>moteur</b> ; une corde tirée vers l'arrière (α = 150°) a un travail <b>résistant</b> ; une corde tirée perpendiculairement aux rails (α = 90°) a un travail <b>nul</b> : elle ne fait ni avancer ni reculer le wagon.</p>
      ${figTravail({ alpha: 150, W: 300, H: 130, arc: 'α = 150°', aria: 'Corde tirée vers l\'arrière : angle de 150° avec le déplacement' })}`)}`);
  c_.aToi(carte, [
    { titre: 'D\'après l\'angle', parties: [versCours({ type: 'grille', q: 'Pour chaque angle α entre la force et le déplacement, le travail est :',
      options: [o('m', 'moteur'), o('r', 'résistant'), o('n', 'nul')],
      lignes: [{ id: 'a', label: 'α = 30°', bonne: 'm' }, { id: 'b', label: 'α = 120°', bonne: 'r' }, { id: 'c', label: 'α = 90°', bonne: 'n' }, { id: 'd', label: 'α = 180°', bonne: 'r' }, { id: 'e', label: 'α = 0°', bonne: 'm' }],
      diag: () => 'Moteur si α < 90° (cos α > 0), résistant si α > 90° (cos α < 0), nul si α = 90°.',
      solution: '<p>30° et 0° : moteur ; 120° et 180° : résistant ; 90° : nul.</p>' })] },
    { titre: 'Une voiture qui freine', enonce: '<p>Une voiture roule sur une route horizontale et freine.</p>',
      parties: [versCours({ type: 'grille', q: 'Le travail de chaque force sur ce déplacement est :',
        options: [o('m', 'moteur'), o('r', 'résistant'), o('n', 'nul')],
        lignes: [{ id: 'P', label: `poids ${nomV('P')}`, bonne: 'n', indices: { m: 'Le poids est vertical, le déplacement horizontal.', r: 'Le poids est vertical, le déplacement horizontal.' } },
          { id: 'R', label: `réaction normale ${nomV('RN')}`, bonne: 'n', indices: { m: 'La réaction normale est perpendiculaire à la route.', r: 'La réaction normale est perpendiculaire à la route.' } },
          { id: 'f', label: `frottements ${nomV('f')}`, bonne: 'r', indices: { m: 'Les frottements sont opposés au mouvement (α = 180°).', n: 'Les frottements sont opposés au mouvement (α = 180°), pas perpendiculaires.' } }],
        solution: '<p>Poids et réaction normale : α = 90°, travail nul. Frottements : α = 180°, travail résistant.</p>' })] },
  ]);
  return carte;
}

function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>0° ≤ α < 90° : ${WF} > 0, travail <b>moteur</b> (la force favorise le déplacement).</p></div>
    <div class="cle"><p>90° < α ≤ 180° : ${WF} < 0, travail <b>résistant</b> (elle ne le favorise pas).</p></div>
    <div class="cle"><p>α = 90° : ${WF} = 0, travail <b>nul</b> (elle n'a pas d'effet sur le déplacement).</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_1c_cours.html">Cours : travail du poids →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_1.html#signe">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, aRetenir]);
ET.menu('module_1b_cours');
</script>
</body>
</html>
