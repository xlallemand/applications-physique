<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 : travail du poids — Énergie et travail</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="et.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="et.js"></script>
<script src="figures.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 1 · COURS 3 / 5</span>
    <h2 class="er-titre">Travail du poids</h2>
    <p class="er-contexte">Dans un champ de pesanteur uniforme, le poids est une force constante. Son travail ne dépend que de l'<b>altitude descendue</b> : W<sub>AB</sub>(<span class="vec-nom">P</span>) = <b>m g h</b>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. W_AB(P⃗) = m g h, h altitude descendue (h > 0 en descente : moteur ;
      h < 0 en montée : résistant) ; « Retenir avec : poids × altitude,
      puis le signe » ; « À toi » : descente, montée (diagnostics : signe,
      masse en g, altitude au lieu de la différence d'altitude)
   2. Démonstration en décomposant le trajet A → C → B (le travail ne
      dépend pas du chemin suivi) ; « À toi » : travail sur chaque portion
   ============================================================ */
const { exemple, hasard } = COURS;
const { fmt, proche, W, nomV, figDecomp, CALC, o } = ET;
const calc = h => `<p class="crs-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const WP = W('P'), G = 'm·s<sup>−2</sup>';

/* ---------- 1. La formule ---------- */
function etape1(c_) {
  const carte = c_.carte('1. W = m g h');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p class="crs-formule">${WP} = m g h</p>
        <p>${WP} : travail du poids entre A et B, en J ; m : masse de l'objet qui va de A à B, en kg ; g : intensité de la pesanteur, en ${G} ; h : <b>altitude descendue</b> entre A et B, en m (h = z<sub>A</sub> − z<sub>B</sub>).</p></div>
      <p><b>Signe</b> : si l'objet <b>descend</b>, le poids l'aide : h > 0, travail <b>moteur</b>. S'il <b>monte</b>, le poids s'y oppose : h < 0, travail <b>résistant</b>.</p>
      <div class="cle"><p><b class="cle-titre">Pour retenir.</b> Poids × altitude (dénivelé), <b>puis</b> le signe : + s'il descend, − s'il monte.</p></div>
    </div>
    ${exemple(`<p>Un skieur de 70 kg descend une piste de A (altitude 1 850 m) à B (altitude 1 730 m) ; g = 9,81 ${G}.</p>
      ${calc(`h = z<sub>A</sub> − z<sub>B</sub> = 1 850 − 1 730 = 120 m (il descend : h > 0)`)}
      ${calc(`${WP} = m g h = 70 × 9,81 × 120 = ${c('8,2 × 10<sup>4</sup> J')} : travail moteur`)}`)}`);
  const m = hasard([0.50, 0.25, 2.0]), h = hasard([3.0, 4.5, 12]), w = m * 9.81 * h;
  c_.aToi(carte, [
    { titre: 'Une montée', enonce: `<p>On soulève un sac de ${fmt(m * 1000)} g de ${fmt(h)} m (g = 9,81 ${G}).</p>`,
      parties: [{ type: 'nombre', q: `Calcule ${WP} (3 chiffres significatifs).`, label: `${WP} =`, valeur: -w, rel: .01, unite: 'J' + CALC,
        diag: v => (proche(v, w, .01) ? 'Le sac <b>monte</b> : le poids s\'oppose au mouvement, le travail est <b>négatif</b>.' : proche(Math.abs(v), w * 1000, .01) ? 'La masse s\'exprime en <b>kg</b>.' : `${WP} = m g h, avec h = z<sub>A</sub> − z<sub>B</sub> négatif pour une montée.`),
        solution: calc(`${WP} = m g h = ${fmt(m)} × 9,81 × (−${fmt(h)}) = ${c(fmt(+(-w).toPrecision(3)) + ' J')} : travail résistant`) }] },
    { titre: 'Une descente', enonce: '<p>Une bille de 20 g roule le long d\'un toboggan qui part d\'une altitude z<sub>A</sub> = 1,50 m et arrive à z<sub>B</sub> = 0,30 m (g = 9,81 ' + G + ').</p>',
      parties: [{ type: 'nombre', q: `Calcule ${WP} (3 chiffres significatifs).`, label: `${WP} =`, valeur: 0.020 * 9.81 * 1.2, rel: .01, unite: 'J' + CALC,
        diag: v => (proche(v, 0.020 * 9.81 * 1.5, .01) ? 'h est l\'altitude <b>descendue</b> : z<sub>A</sub> − z<sub>B</sub>, pas z<sub>A</sub>.' : proche(v, -0.020 * 9.81 * 1.2, .01) ? 'La bille descend : travail moteur, positif.' : proche(v, 20 * 9.81 * 1.2, .01) ? 'La masse s\'exprime en <b>kg</b> : 20 g = 0,020 kg.' : `${WP} = m g (z<sub>A</sub> − z<sub>B</sub>).`),
        solution: calc(`${WP} = m g (z<sub>A</sub> − z<sub>B</sub>) = 0,020 × 9,81 × (1,50 − 0,30) = ${c('0,235 J')}`) }] },
  ]);
  return carte;
}

/* ---------- 2. La démonstration ---------- */
function etape2(c_) {
  const carte = c_.carte('2. D\'où vient m g h ?');
  c_.ajouter(carte, `<div class="cours-bloc">
      <p>Le travail du poids ne dépend pas du chemin suivi : on le calcule sur un chemin plus simple, <b>A → C</b> vertical puis <b>C → B</b> horizontal.</p>
      <p><b>Si l'objet descend</b> (AC = h, altitude descendue, positive) :</p>
      ${figDecomp('descend')}
      ${calc(`${WP} = W<sub>AC</sub>(${nomV('P')}) + W<sub>CB</sub>(${nomV('P')}) = P × AC × cos 0° + P × CB × cos 90° = P × AC + 0`)}
      ${calc(`donc ${WP} = m g h, avec h = AC > 0`)}
      <p><b>Si l'objet monte</b> :</p>
      ${figDecomp('monte')}
      ${calc(`${WP} = W<sub>AC</sub>(${nomV('P')}) + W<sub>CB</sub>(${nomV('P')}) = 0 + P × CB × cos 180° = −m g CB`)}
      ${calc(`donc ${WP} = m g h, avec h = −CB < 0, l'altitude descendue`)}
    </div>
    ${exemple(`<p>Une bille de 50 g descend de 2,0 m en suivant une rampe sinueuse de 5 m de long (g = 9,81 ${G}). Le chemin n'intervient pas :</p>
      ${calc(`${WP} = m g h = 0,050 × 9,81 × 2,0 = ${c('0,98 J')}`)}`)}`);
  c_.aToi(carte, [
    { titre: 'Sur chaque portion', enonce: '<p>Un objet descend de A à B ; on décompose : A → C vertical vers le bas, puis C → B horizontal.</p>',
      parties: [{ type: 'choix', q: `Sur la portion horizontale C → B, W<sub>CB</sub>(${nomV('P')}) vaut :`, colonne: false, melanger: false,
        options: [o('0', '0'), o('pc', 'P × CB'), o('mc', '−P × CB')], bonne: '0', indice: 'Le poids est vertical : il est perpendiculaire au déplacement horizontal (α = 90°).',
        solution: '<p>α = 90°, cos 90° = 0 : le poids ne travaille pas sur un trajet horizontal.</p>' },
      { type: 'choix', q: `Sur la portion verticale A → C (vers le bas), W<sub>AC</sub>(${nomV('P')}) vaut :`, colonne: false, melanger: false,
        options: [o('p', 'P × AC'), o('m', '−P × AC'), o('0', '0')], bonne: 'p', indices: { m: 'Le poids et le déplacement sont vers le bas : α = 0°, cos 0° = 1.', 0: 'Ici, le déplacement est vertical, comme le poids.' },
        solution: '<p>α = 0° : W<sub>AC</sub> = P × AC = m g h.</p>' }] },
  ]);
  return carte;
}

function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>${WP} = m g h, h = z<sub>A</sub> − z<sub>B</sub> altitude descendue : h > 0 si l'objet descend (moteur), h < 0 s'il monte (résistant).</p></div>
    <div class="cle"><p>Il ne dépend que de l'altitude de départ et d'arrivée, pas du chemin suivi : sur un trajet horizontal, le poids ne travaille pas.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_1d_cours.html">Cours : travail d'une force électrique →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_1.html#poids">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
ET.menu('module_1c_cours');
</script>
</body>
</html>
