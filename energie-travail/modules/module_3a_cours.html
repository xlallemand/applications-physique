<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : énergie potentielle et énergie mécanique — Énergie et travail</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="et.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="et.js"></script>
<script src="figures.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · COURS 1 / 3</span>
    <h2 class="er-titre">Énergie potentielle et énergie mécanique</h2>
    <p class="er-contexte">Un objet possède une <b>énergie potentielle de pesanteur</b> E<sub>pp</sub> = m g z, liée à son altitude. Avec l'énergie cinétique, elle forme l'<b>énergie mécanique</b> E<sub>m</sub> = E<sub>c</sub> + E<sub>pp</sub>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. E_m = E_c + E_p ; en chute libre E_p = E_pp = m g z ; « À toi » :
      E_pp, E_m
   2. E_pp définie à une constante près : exemple du balcon (balle de
      100 g à 3 m, g = 10 : 3 J et 0 J, ou 0 J et −3 J ; ΔE_pp = −3 J dans
      les deux cas) ; « À toi » : E_pp avec une origine donnée, variation
   ============================================================ */
const { exemple, hasard } = COURS;
const { fmt, proche, demo, MS, CALC, figBalcon, o } = ET;
const calc = h => `<p class="crs-calc">${h}</p>`;
const c = h => `<span class="c">${h}</span>`;
const G = 'm·s<sup>−2</sup>', EPP = 'E<sub>pp</sub>', EM = 'E<sub>m</sub>', EC = 'E<sub>c</sub>';

/* ---------- 1. Les trois énergies ---------- */
function etape1(c_) {
  const carte = c_.carte('1. Énergie mécanique');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p class="crs-formule">${EM} = ${EC} + E<sub>p</sub></p>
        <p>${EM} : énergie mécanique (J) ; ${EC} = ½ m v<sup>2</sup> : énergie cinétique (J) ; E<sub>p</sub> : énergie potentielle (J).</p></div>
      <div class="cle"><p>Dans le cas d'une chute libre, l'énergie potentielle est l'énergie potentielle de pesanteur :</p>
        <p class="crs-formule">E<sub>p</sub> = ${EPP} = m g z</p>
        <p>m : masse (kg) ; g : intensité de la pesanteur (${G}) ; z : altitude de l'objet (m), sur un axe vertical vers le haut.</p></div>
    </div>
    ${exemple(`<p>Une balle de 60 g passe à 2,0 m d'altitude à la vitesse de 5,0 ${MS} (g = 9,81 ${G}).</p>
      ${demo([`${EC} = ½ m v<sup>2</sup> = ½ × 0,060 × 5,0<sup>2</sup> = 0,75 J`, `${EPP} = m g z = 0,060 × 9,81 × 2,0 = 1,18 J`, `${EM} = ${EC} + ${EPP} = 0,75 + 1,18 = ${c('1,93 J')}`])}`)}`);
  const m = hasard([0.25, 0.40, 1.5]), z = hasard([1.2, 3.0, 8.0]), v = hasard([2.0, 4.0, 6.0]), Ep = m * 9.81 * z, Ec = .5 * m * v * v;
  c_.aToi(carte, [
    { titre: 'Énergies d\'un objet', enonce: `<p>Un objet de ${fmt(m * 1000)} g passe à l'altitude z = ${fmt(z)} m à la vitesse de ${fmt(v)} ${MS} (g = 9,81 ${G}).</p>`,
      parties: [{ type: 'nombre', q: `Calcule ${EPP} (3 chiffres significatifs).`, label: `${EPP} =`, valeur: Ep, rel: .01, unite: 'J' + CALC, signe: false,
        diag: x => (proche(x, Ep * 1000, .02) ? 'La masse en kg.' : `${EPP} = m g z.`), solution: calc(`${EPP} = ${fmt(m)} × 9,81 × ${fmt(z)} = ${c(fmt(+Ep.toPrecision(3)) + ' J')}`) },
      { type: 'nombre', q: `Calcule ${EM} (3 chiffres significatifs).`, label: `${EM} =`, valeur: Ep + Ec, rel: .01, unite: 'J' + CALC, signe: false,
        diag: x => (proche(x, Ep + m * v * v, .02) ? `${EC} = ½ m v² : le ½.` : proche(x, Ep, .02) || proche(x, Ec, .02) ? `${EM} = ${EC} + ${EPP} : les deux.` : `${EM} = ½ m v² + m g z.`),
        solution: demo([`${EC} = ½ × ${fmt(m)} × ${fmt(v)}<sup>2</sup> = ${fmt(+Ec.toPrecision(3))} J`, `${EM} = ${EC} + ${EPP}`, `= ${fmt(+Ec.toPrecision(3))} + ${fmt(+Ep.toPrecision(3))}`, `= ${c(fmt(+(Ec + Ep).toPrecision(3)) + ' J')}`]) }] },
  ]);
  return carte;
}

/* ---------- 2. L'origine des altitudes ---------- */
function etape2(c_) {
  const carte = c_.carte('2. Une énergie définie à une constante près');
  c_.ajouter(carte, `<div class="cours-bloc">
      <p>On choisit l'altitude où l'on décide que ${EPP} est nulle (l'origine z = 0). La valeur de ${EPP} change avec ce choix, mais <b>ses variations ne changent pas</b> : ce sont elles qui comptent.</p>
    </div>
    ${exemple(`<p>Énergie potentielle de pesanteur d'une balle de 100 g sur un balcon à 3 m du sol (g = 10 ${G}) :</p>
      <div class="et-figs2"><div><p><b>Origine au sol</b></p>${figBalcon({ origine: 'sol' })}
          ${demo([`> Sur le balcon (z = 3 m) :`, `${EPP} = 0,100 × 10 × 3 = 3 J`, `> Au sol (z = 0) :`, `${EPP} = 0,100 × 10 × 0 = 0 J`, `> Dans sa chute :`, `Δ${EPP} = 0 − 3 = ${c('−3 J')}`])}</div>
        <div><p><b>Origine au balcon</b></p>${figBalcon({ origine: 'balcon' })}
          ${demo([`> Sur le balcon (z = 0) :`, `${EPP} = 0,100 × 10 × 0 = 0 J`, `> Au sol (z = −3 m) :`, `${EPP} = 0,100 × 10 × (−3) = −3 J`, `> Dans sa chute :`, `Δ${EPP} = −3 − 0 = ${c('−3 J')}`])}</div></div>`)}`);
  const m = hasard([0.50, 2.0]), z = hasard([4.0, 6.0]);
  c_.aToi(carte, [
    { titre: 'Origine en haut', enonce: `<p>Un pot de fleurs de ${fmt(m)} kg est posé sur le rebord d'une fenêtre à ${fmt(z)} m du sol. On choisit l'origine des altitudes au niveau de la <b>fenêtre</b> (g = 10 ${G}).</p>`,
      parties: [{ type: 'nombre', q: `Calcule ${EPP} du pot <b>s'il tombe au sol</b>.`, label: `${EPP} =`, valeur: -m * 10 * z, tol: .01, unite: 'J', dec: 0,
        diag: x => (proche(x, m * 10 * z) ? `Le sol est <b>sous</b> l'origine : z<sub>sol</sub> = −${fmt(z)} m.` : `${EPP} = m g z<sub>sol</sub>, avec z<sub>sol</sub> = −${fmt(z)} m.`),
        solution: calc(`${EPP} = ${fmt(m)} × 10 × (−${fmt(z)}) = ${c(fmt(-m * 10 * z) + ' J')}`) },
      { type: 'choix', q: `Avec l'origine au sol, la variation de ${EPP} pendant la chute serait :`, colonne: false, melanger: false,
        options: [o('meme', `la même : −${fmt(m * 10 * z)} J`), o('opp', `+${fmt(m * 10 * z)} J`), o('nul', '0 J')], bonne: 'meme',
        indice: `${EPP} change avec l'origine, pas sa variation.`, solution: `<p>De ${fmt(m * 10 * z)} J à 0 J : la même variation, −${fmt(m * 10 * z)} J.</p>` }] },
  ]);
  return carte;
}

function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>${EM} = ${EC} + E<sub>p</sub> ; en chute libre, E<sub>p</sub> = ${EPP} = m g z (z altitude, axe vers le haut).</p></div>
    <div class="cle"><p>${EPP} dépend du choix de l'origine z = 0 ; ses <b>variations</b> n'en dépendent pas.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_3b_cours.html">Cours : conservation de l'énergie mécanique →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_3.html#energies">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
ET.menu('module_3a_cours');
</script>
</body>
</html>
