<html lang="fr" data-matiere="maths">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puissances de 10 - Entraînement</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../assets/theme.css">
    <link rel="stylesheet" href="../equilibrer-reactions/modules/er.css">
    <link rel="stylesheet" href="../assets/sommaire.css">
    <link rel="stylesheet" href="../assets/cours.css">
    <script src="../assets/sommaire.js"></script>
    <script src="../assets/numpad.js"></script>
    <script src="../assets/dragdrop.js"></script>
    <script src="../assets/hero.js"></script>
    <script src="../assets/cours.js"></script>
    <style>
        :root {
            --app-accent-50:  var(--paper);
            --app-accent-100: var(--paper-2);
            --app-accent-200: var(--cle-bg);
            --app-accent-400: var(--line-strong);
            --app-accent-600: var(--accent);
            --app-accent-700: var(--accent);
            --app-accent-800: var(--ink);
        }
        .btn-module { transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
        .btn-module:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .question-box { animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
        .correct { animation: correctPulse 0.5s; }
        @keyframes correctPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }
        .draggable { cursor: move; user-select: none; touch-action: none; transition: box-shadow .15s; }
        .draggable.dragging { opacity: .4; }
        .drop-zone-h { min-height:64px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; transition: all 0.3s; }
        .drop-zone-h.drag-over { background-color:var(--paper-2); border-color:var(--accent); }
        .source-items-h { display:flex; flex-wrap:wrap; gap:8px; min-height:64px; }
        input[type="text"], input[type="number"] { font-size:16px; }
        .fraction { display:inline-block; text-align:center; vertical-align:middle; margin:0 4px; }
        .fraction-num { border-bottom:2px solid currentColor; padding:2px 8px; display:block; }
        .fraction-den { padding:2px 8px; display:block; }


        /* ── Affichage 10^[input] (entraînements) */
        .power-answer-wrap { display: inline-flex; align-items: flex-start; gap: 2px; }
        .power-answer-wrap .base { font-size: 1.5rem; font-weight: 800; line-height: 1; }
        .power-answer-wrap .exp-input {
            width: 80px; font-size: 0.95rem; font-weight: 700; margin-top: -12px;
            padding: 4px 8px; border-radius: 6px; background: white;
        }
        /* ── Cours par étapes (assets/cours.js) dans l'application en une page */
        .p10-cours.er-page { max-width: none; padding: 0 0 32px; }
        .p10-cours .er-actions a { text-decoration: none; }
        .p10-cours ul.er-liste { list-style: disc; }
        .p10-cours ol.er-liste { list-style: decimal; }
        .p10-cours .er-liste li + li { margin-top: 4px; }
        /* « … = 10 » suivi de la case de l'exposant, surélevée comme un exposant */
        .p10-cours .crs-valeur:has(.p10-base) { padding-top: 22px; column-gap: 3px; }
        .p10-cours .crs-valeur:has(.p10-base) > .crs-lab { white-space: nowrap; }
        .p10-cours .crs-valeur:has(.p10-base) > .crs-champ-box { margin-top: -16px; }
        .p10-cours .crs-valeur:has(.p10-base) .crs-champ { width: 62px; font-size: 16px; padding: 6px 4px; }
        .p10-cours .crs-valeur:has(.p10-base) .crs-pm { width: 30px; height: 34px; font-size: .95rem; }
        /* écriture scientifique en deux cases : [a] × 10 puis [n] en exposant */
        .p10-cours .crs-champs.ligne:has(.p10-x10) { column-gap: 0; align-items: flex-start; padding-top: 16px; }
        .p10-cours .crs-champs.ligne:has(.p10-x10) > .crs-valeur + .crs-valeur { margin: -16px 0 0 -6px; padding-left: 2px; }
        .p10-cours .crs-champs.ligne:has(.p10-x10) > .crs-valeur + .crs-valeur .crs-champ { width: 58px; font-size: 16px; padding: 6px 4px; }
        .p10-cours .crs-champs.ligne:has(.p10-x10) > .crs-valeur + .crs-valeur .crs-pm { width: 30px; height: 34px; font-size: .95rem; }
        .p10-x10 { font-size: 1.15rem; font-weight: 800; }
        .p10-cours .crs-lab .fraction, .p10-cours .crs-partie-q .fraction { font-size: 1rem; }
        sup input { width:80px; font-size:13px; vertical-align: baseline; }
        /* ── Toutes les zones de saisie (cours et entraînements) : même arrondi que dans Conversions */
        #moduleContainer input[type="text"] { border-radius: 10px; }

        /* ── Pavé numérique ─────────────────────── */
        /* ── Liste des modules sur l'accueil ─────── */
        .module-card-actions .btn-primary,
        .module-card-actions .btn-secondary { font-size: .9rem; padding: 10px 20px; }

<div id="app" class="container mx-auto px-4 py-8 max-w-4xl">

    <!-- une ligne dépliable par module (voir assets/sommaire.js) -->

<script>
// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// PLAN DE L'APPLICATION ET NAVIGATION (voir assets/sommaire.js)
// Application en une seule page : chaque page du sommaire est une
// ancre de l'adresse (#course-1, #training-1, #fiche-1…).
// ═══════════════════════════════════════════════════════════════
const PLAN = [
    { n: 1, titre: 'Définitions et écritures', desc: 'Ce qu\'est une puissance de 10 et ses liens avec l\'écriture décimale', fiche: 'fiche-1',
      parties: [{ nom: 'Définitions et écritures', cours: 'course-1', entrainement: 'training-1' }] },
    { n: 2, titre: 'Écriture scientifique', desc: 'Écrire un nombre sous la forme a × 10<sup>n</sup> avec 1 ≤ a &lt; 10', fiche: 'fiche-2',
      parties: [{ nom: 'Écriture scientifique', cours: 'course-2', entrainement: 'training-2' }] },
    { n: 3, titre: 'Opérations avec les puissances de 10', desc: 'Multiplier, diviser, calculer l\'inverse et les puissances de puissances', fiche: 'fiche-3',
      parties: [{ nom: 'Opérations', cours: 'course-3', entrainement: 'training-3' }] },
    { n: 4, titre: 'S\'entraîner sur toutes les notions', desc: 'Questions avancées qui combinent toutes les notions',
      parties: [{ nom: 'Toutes les notions', entrainement: 'training-4' }] },
];
SOM.init({ nom: 'Puissances de 10', id: 'puissances-10', spa: true, plan: PLAN });

let currentPage = 'home'; // 'home' | 'course-1' | 'course-2' | 'course-3' | 'training-1' | 'training-2' | 'training-3' | 'training-4'

// (le titre de la page affichée est donné par le bandeau du sommaire)
function setTopBarTitle() {}

// sommaire de la page affichée ; l'adresse suit la page (#course-1…) pour que le retour arrière fonctionne
function updateActiveMenuItem() {
    const h = currentPage === 'home' ? '' : '#' + currentPage;
    if (location.hash !== h) history.pushState(null, '', location.pathname + location.search + h);
    SOM.menu(currentPage === 'home' ? 'accueil' : currentPage);
    if (currentPage === 'home') SOM.accueil(document.getElementById('menu'));
    // (un cours est marqué fait par assets/cours.js quand sa dernière étape s'affiche)
}
// une ancre de l'adresse ouvre la page correspondante (liens du sommaire et de l'accueil, retour arrière)
function ouvrirAncre() {
    const m = /^#(course|training|fiche)-(\d+)$/.exec(location.hash);
    if (!m) { backToMenu(); return; }
    const n = Number(m[2]);
    if (m[1] === 'course') showCourse(n);
    else if (m[1] === 'training') showTraining(n);
    else showFiche(n);
}
addEventListener('hashchange', ouvrirAncre);

// ═══════════════════════════════════════════════════════════════
// COULEUR DE CHAQUE MODULE D'ENTRAÎNEMENT (appliquée à tous les
// éléments de l'écran : titre, barre de progression, boutons,
// question, glisser-déposer, écran de résultat)
// ═══════════════════════════════════════════════════════════════
const TRAINING_THEMES = {
    1: { color:'blue', title:'Définitions et écritures' },
    2: { color:'blue', title:'Écriture scientifique'    },
    3: { color:'blue', title:'Opérations'               },
    4: { color:'blue', title:'Toutes les notions — Niveau avancé' },
};

// ═══════════════════════════════════════════════════════════════
// ÉTAT GLOBAL
// ═══════════════════════════════════════════════════════════════
let currentModule = 0, currentQuestion = 0, score = 0, questions = [];

// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
function frac(num, den) {
    return `<span class="fraction"><span class="fraction-num">${num}</span><span class="fraction-den">${den}</span></span>`;
}
function fmt(n) {
    if (Number.isInteger(n)) return n.toLocaleString('fr-FR');
    return n.toString().replace('.', ',');
}

function hideMenu() {
    document.getElementById('mainHeader').style.display = 'none';
    document.getElementById('menu').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
function backToMenu() {
    document.getElementById('moduleContainer').innerHTML = '';
    document.getElementById('mainHeader').style.display = '';
    document.getElementById('menu').style.display = '';
    setTopBarTitle('Puissances de 10');
    currentPage = 'home';
    updateActiveMenuItem();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
// cours par étapes du module num (voir COURS_P10 plus bas) : en-tête, puis les étapes
// construites par le moteur commun ; les liens de fin (entraînement, cours suivant,
// fiche) sont dans la carte « À retenir »
function showCourse(num) {
    hideMenu();
    const cours = COURS_P10[num];
    const c = document.getElementById('moduleContainer');
    c.innerHTML = `<div class="er-page p10-cours">
        <div class="er-card">
            <span class="er-badge">MODULE ${num} · COURS</span>
            <h2 class="er-titre">${cours.titre}</h2>
            <p class="er-contexte">${cours.contexte}</p>
        </div>
        <div class="p10-etapes"></div>
    </div>`;
    new COURS.Cours(c.querySelector('.p10-etapes'), cours.etapes, { cle: 'course-' + num });
    currentPage = 'course-' + num;
    updateActiveMenuItem();
}
// ═══════════════════════════════════════════════════════════════
// FICHES RÉCAPITULATIVES (une par module avec un cours)
// ═══════════════════════════════════════════════════════════════
function getFiche(num) {
    const carte = (titre, html) => `<section class="er-card"><h3 class="cours-titre">${titre}</h3>${html}</section>`;
    const FICHES = {
        1: ['Définitions et écritures', [
            carte('Puissances positives et négatives', `
                <div class="cle"><p>10<sup>n</sup> = 10 × 10 × … × 10 (n fois) : un 1 suivi de n zéros. 10<sup>0</sup> = 1.</p>
                <p>10<sup>−n</sup> = ${frac('1', '10<sup>n</sup>')} : le chiffre 1 est au n<sup>e</sup> rang après la virgule.</p></div>
                <p>10<sup>3</sup> = 1 000 &nbsp;·&nbsp; 10<sup>−2</sup> = 0,01 &nbsp;·&nbsp; 10<sup>−5</sup> = 0,000 01</p>`),
            carte('Lien avec l\'écriture décimale', `
                <div class="cle"><p>Multiplier par 10<sup>n</sup> (n &gt; 0) : la virgule se déplace de n rangs <b>vers la droite</b>.</p>
                <p>Multiplier par 10<sup>−n</sup> (n &gt; 0) : la virgule se déplace de n rangs <b>vers la gauche</b>.</p></div>
                <p>3,5 × 10<sup>2</sup> = 350 &nbsp;·&nbsp; 5,2 × 10<sup>−2</sup> = 0,052</p>
                <p>Dans l'autre sens, on compte de combien de rangs on déplace la virgule : 3 500 = 3,5 × 10<sup>3</sup> &nbsp;·&nbsp; 0,004 2 = 4,2 × 10<sup>−3</sup></p>`),
        ]],
        2: ['Écriture scientifique', [
            carte('Définition', `
                <div class="cle"><p class="som-formule">a × 10<sup>n</sup></p>
                <p><b>a</b> : un seul chiffre non nul avant la virgule (1 ≤ a &lt; 10) ; <b>n</b> : entier relatif.</p></div>
                <p>Oui : 3,47 × 10<sup>8</sup> ; 7,25 × 10<sup>−5</sup>. Non : 35 × 10<sup>7</sup> (il faut 3,5 × 10<sup>8</sup>) ; 0,42 × 10<sup>3</sup> (il faut 4,2 × 10<sup>2</sup>).</p>`),
            carte('Mettre en écriture scientifique', `
                <div class="cle"><ol class="er-liste" style="margin:0">
                    <li>Déplacer la virgule pour n'avoir qu'un seul chiffre non nul avant elle ;</li>
                    <li>le nombre de rangs déplacés donne |n| ;</li>
                    <li>virgule déplacée vers la gauche → exposant positif ; vers la droite → exposant négatif.</li></ol></div>
                <p>28 300 = 2,83 × 10<sup>4</sup> &nbsp;·&nbsp; 0,000 537 = 5,37 × 10<sup>−4</sup></p>`),
        ]],
        3: ['Opérations avec les puissances de 10', [
            carte('Les quatre règles', `
                <div class="cle">
                <p><b class="cle-titre">Multiplication</b> : on additionne les exposants.</p><p class="som-formule">10<sup>a</sup> × 10<sup>b</sup> = 10<sup>a+b</sup></p>
                <p><b class="cle-titre">Division</b> : on soustrait les exposants.</p><p class="som-formule">${frac('10<sup>a</sup>', '10<sup>b</sup>')} = 10<sup>a−b</sup></p>
                <p><b class="cle-titre">Inverse</b> : on change le signe de l'exposant.</p><p class="som-formule">${frac('1', '10<sup>a</sup>')} = 10<sup>−a</sup></p>
                <p><b class="cle-titre">Puissance d'une puissance</b> : on multiplie les exposants.</p><p class="som-formule">(10<sup>a</sup>)<sup>b</sup> = 10<sup>a×b</sup></p></div>
                <p>10<sup>3</sup> × 10<sup>−5</sup> = 10<sup>−2</sup> &nbsp;·&nbsp; ${frac('10<sup>4</sup>', '10<sup>−2</sup>')} = 10<sup>6</sup> &nbsp;·&nbsp; (10<sup>2</sup>)<sup>3</sup> = 10<sup>6</sup></p>`),
        ]],
    };
    const [titre, cartes] = FICHES[num];
    return `<div class="som-fiche">
        <div class="er-card"><span class="er-badge">MODULE ${num} · FICHE RÉCAPITULATIVE</span><h2 class="er-titre">${titre}</h2></div>
        ${cartes.join('')}
        <div class="er-actions som-fiche-liens"><a class="btn-secondary" href="#course-${num}">Revoir le cours</a><a class="btn-secondary" href="#training-${num}">S'entraîner</a></div>
    </div>`;
}
function showFiche(num) {
    hideMenu();
    document.getElementById('moduleContainer').innerHTML = getFiche(num);
    currentPage = 'fiche-' + num;
    updateActiveMenuItem();
}
function showTraining(num) {
    hideMenu();
    currentModule = num; currentQuestion = 0; score = 0;
    if (num === 1) {
        setTopBarTitle('Module 1 : Définitions et écritures — Entraînement');
        questions = generateTraining1();
    } else if (num === 2) {
        setTopBarTitle('Module 2 : Écriture scientifique — Entraînement');
        questions = generateTraining2();
    } else if (num === 3) {
        setTopBarTitle('Module 3 : Opérations avec les puissances de 10 — Entraînement');
        questions = generateTraining3();
    } else if (num === 4) {
        setTopBarTitle('Module 4 : Toutes les notions — Entraînement');
        questions = generateTraining4();
    }
    currentPage = 'training-' + num;
    updateActiveMenuItem();
    document.getElementById('moduleContainer').innerHTML = getTrainingHTML(num);
    showQuestion();
}

// ═══════════════════════════════════════════════════════════════
// COURS PAR ÉTAPES (moteur commun assets/cours.js) :
// notion → exemple → « À toi » → … → « À retenir ».
// Chaque cours est reconstruit à chaque affichage (showCourse) :
// les valeurs des « À toi » sont tirées au hasard à chaque fois.
// ═══════════════════════════════════════════════════════════════
const COURS_P10 = (function () {
    const { hasard, entre, exemple, proche } = COURS;
    const nb = COURS.fmt;                       // nombre écrit à la française : 1 000 ; 0,052
    const ex = n => String(n).replace('-', '−'); // exposant avec le moins typographique
    const p10 = n => `10<sup>${ex(n)}</sup>`;
    const rang = n => `${n}<sup>e</sup>`;        // 3ᵉ rang
    const pl = (k, mot) => `${k} ${mot}${Math.abs(k) > 1 ? 's' : ''}`;
    // valeur exacte de a × 10ⁿ (évite 0,07000000000000001)
    const val = (a, n) => +(a * Math.pow(10, n)).toPrecision(12);
    const egal = (a, b) => proche(a, b, 1e-9);
    // a écrit sans virgule : 1,2 → 12 ; 0,45 → 45 ; 3,06 → 306
    const chiffres = a => +String(a).replace('.', '');
    // étiquette d'une case d'exposant : « … = 10 » puis la case surélevée (voir .p10-base)
    const base = avant => `${avant || ''}<span class="p10-base">10</span>`;
    // liens de fin de cours (dernière carte « À retenir »)
    const actions = liens => `<div class="er-actions">${liens.map(([h, t], i) =>
        `<a class="${i ? 'btn-secondary' : 'btn-primary'}" href="${h}">${t}</a>`).join('')}</div>`;

    // Partie « exposant » : l'élève complète 10^[ ]
    function partieExp(o) {
        return { type: 'nombre', q: o.q, label: base(o.avant), valeur: o.valeur, entier: true, tol: 0,
            aria: 'Exposant de la puissance de 10', diag: o.diag, solution: o.solution };
    }
    // Partie « écriture décimale » : réponse exacte (pas d'arrondi)
    function partieDec(o) {
        return { type: 'nombre', q: o.q, label: o.label, valeur: o.valeur, rel: 1e-9, signe: false, diag: o.diag, solution: o.solution };
    }

    /* ---------- Diagnostics des erreurs fréquentes ---------- */
    // 10ⁿ (n > 0) écrit en décimal
    function diagPuisPos(v, n) {
        if (v === 10 * n) return `Tu as calculé 10 × ${n}. ${p10(n)} n'est pas 10 × ${n} : c'est 10 multiplié ${n} fois par lui-même.`;
        if (v === Math.pow(10, n - 1)) return `Il manque un zéro : ${p10(n)}, c'est un 1 suivi de <b>${pl(n, 'zéro')}</b>.`;
        if (v === Math.pow(10, n + 1)) return `Il y a un zéro de trop : ${p10(n)}, c'est un 1 suivi de <b>${pl(n, 'zéro')}</b>.`;
        if (v < 0) return `${p10(n)} est un nombre positif : un 1 suivi de ${pl(n, 'zéro')}.`;
        return `${p10(n)} s'écrit avec un 1 suivi de ${pl(n, 'zéro')}.`;
    }
    // 10⁻ⁿ écrit en décimal
    function diagPuisNeg(v, n) {
        if (v < 0) return `Un exposant négatif ne donne pas un nombre négatif : ${p10(-n)} = ${frac('1', p10(n))} est positif, plus petit que 1.`;
        if (v >= 1) return `Avec un exposant négatif, le nombre est plus petit que 1 : ${p10(-n)} = ${frac('1', p10(n))} = 0,…`;
        if (egal(v, val(1, -n - 1))) return `Il y a un zéro de trop : le chiffre 1 doit être au ${rang(n)} rang après la virgule.`;
        if (egal(v, val(1, -n + 1))) return `Il manque un zéro : le chiffre 1 doit être au ${rang(n)} rang après la virgule.`;
        return `${p10(-n)} = ${frac('1', p10(n))} : écris « 0, » puis place le chiffre 1 au ${rang(n)} rang après la virgule.`;
    }
    // a × 10ⁿ écrit en décimal : sens de déplacement de la virgule, nombre de rangs
    function diagDecale(v, a, n) {
        const r = Math.abs(n), sens = n > 0 ? 'droite' : 'gauche';
        if (v < 0) return `Le résultat n'est pas négatif : multiplier par ${p10(n)} déplace seulement la virgule.`;
        if (egal(v, val(a, -n))) return n > 0
            ? `Tu as déplacé la virgule vers la gauche. Multiplier par ${p10(n)} (exposant positif) rend le nombre plus grand : la virgule va de ${pl(r, 'rang')} vers la <b>droite</b>.`
            : `Tu as déplacé la virgule vers la droite. Multiplier par ${p10(n)} (exposant négatif) rend le nombre plus petit : la virgule va de ${pl(r, 'rang')} vers la <b>gauche</b>.`;
        if (n > 0 && !Number.isInteger(a) && egal(v, val(chiffres(a), n)))
            return `Tu as écrit les chiffres de ${nb(a)} sans la virgule puis ajouté les zéros : il faut <b>déplacer la virgule</b> de ${pl(r, 'rang')} vers la ${sens}.`;
        if (egal(v, a)) return `Ajouter des zéros après la virgule ne change pas le nombre : déplace la virgule de ${pl(r, 'rang')} vers la ${sens}.`;
        for (const k of [1, -1]) {
            if (r + k > 0 && egal(v, val(a, n > 0 ? n + k : n - k)))
                return `Tu as déplacé la virgule de ${pl(r + k, 'rang')} : il en faut exactement ${r}, vers la ${sens}.${n < 0 ? ' Compte les rangs, pas les zéros.' : ''}`;
        }
        return `Déplace la virgule de ${pl(r, 'rang')} vers la ${sens}, en complétant par des zéros si besoin.`;
    }
    // exposant trouvé à partir d'une écriture décimale : N = a × 10^n
    function diagExposant(v, n, N, a) {
        const r = Math.abs(n);
        if (v === -n) return n > 0
            ? `${nb(N)} est plus grand que ${nb(a)} : la virgule va vers la droite, l'exposant est <b>positif</b>.`
            : `${nb(N)} est plus petit que 1 : la virgule va vers la gauche, l'exposant est <b>négatif</b>.`;
        if (Math.abs(v) === r + 1) return `Tu as compté un rang de trop${N > 1 ? ' (peut-être tous les chiffres du nombre)' : ''} : compte seulement les rangs dont la virgule se déplace entre ${nb(a)} et ${nb(N)}.`;
        if (Math.abs(v) === r - 1) return `Tu as compté un rang de moins${N < 1 ? ' (peut-être seulement les zéros)' : ''} : compte tous les rangs dont la virgule se déplace entre ${nb(a)} et ${nb(N)}.`;
        return `Compte de combien de rangs la virgule se déplace pour passer de ${nb(a)} à ${nb(N)}.`;
    }

    /* ═══════════════ COURS 1 — Définitions et écritures ═══════════════ */
    function c1Positives(c) {
        const carte = c.carte('1. Les puissances de 10 positives');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>${p10('n')} se lit « 10 puissance n » (ou « 10 exposant n ») : c'est 10 multiplié n fois par lui-même.</p>
                <div class="cle"><p class="crs-formule">10<sup>n</sup> = 10 × 10 × … × 10 &nbsp;(n facteurs)</p>
                    <p>C'est un <b>1 suivi de n zéros</b>. Par convention, <b>10<sup>0</sup> = 1</b>.</p></div>
            </div>
            ${exemple(`<p class="crs-calc">10<sup>3</sup> = 10 × 10 × 10 = <span class="c">1 000</span> &nbsp;(un 1 suivi de 3 zéros)</p>
                <p>De même : 10<sup>1</sup> = 10 · 10<sup>2</sup> = 100 · 10<sup>5</sup> = 100 000 · 10<sup>0</sup> = 1.</p>`)}`);
        const n = entre(4, 6), m = hasard([2, 3, 5, 7].filter(k => k !== n)), M = Math.pow(10, m);
        c.aToi(carte, [
            { titre: 'De la puissance au nombre',
              parties: [{ type: 'nombre', q: `Combien vaut ${p10(n)} ?`, label: `${p10(n)} =`, valeur: Math.pow(10, n),
                entier: true, signe: false, tol: 0, diag: v => diagPuisPos(v, n),
                solution: `<p class="crs-calc">${p10(n)} = un 1 suivi de ${n} zéros = <span class="c">${nb(Math.pow(10, n))}</span></p>` }] },
            { titre: 'Du nombre à la puissance',
              enonce: `<p>Écris ${nb(M)} sous la forme d'une puissance de 10.</p>`,
              parties: [partieExp({ avant: `${nb(M)} = `, valeur: m,
                diag: v => v === m + 1 ? 'Tu as compté tous les chiffres, le 1 compris : compte seulement les zéros après le 1.'
                    : v === m - 1 ? 'Il manque un zéro : compte-les tous.'
                    : v === -m ? `${nb(M)} est plus grand que 1 : l'exposant est positif.`
                    : 'L\'exposant est le nombre de zéros après le 1.',
                solution: `<p class="crs-calc">${nb(M)} = un 1 suivi de ${m} zéros = <span class="c">${p10(m)}</span></p>` })] },
            { titre: 'Un cas à part',
              parties: [{ type: 'choix', q: 'Combien vaut 10<sup>0</sup> ?', melanger: false,
                options: [{ id: 'un', label: '1' }, { id: 'zero', label: '0' }, { id: 'dix', label: '10' }], bonne: 'un',
                indices: { zero: '10<sup>0</sup> n\'est pas 0 : c\'est un 1 suivi d\'aucun zéro.',
                           dix: '10 = 10<sup>1</sup> (un 1 suivi d\'un zéro). 10<sup>0</sup>, c\'est un 1 suivi d\'aucun zéro.' },
                solution: '<p>Par convention, <b>10<sup>0</sup> = 1</b> : un 1 suivi de 0 zéro.</p>' }] },
        ]);
        return carte;
    }

    function c1Negatives(c) {
        const carte = c.carte('2. Les puissances de 10 négatives');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>Avec un exposant négatif, on divise : 10<sup>−n</sup> est l'inverse de 10<sup>n</sup>. C'est un nombre positif, plus petit que 1.</p>
                <div class="cle"><p class="crs-formule">10<sup>−n</sup> = ${frac('1', '10<sup>n</sup>')} = 0,0…01</p>
                    <p>Le chiffre <b>1</b> est au <b>n<sup>e</sup> rang après la virgule</b> (il y a n zéros en tout, en comptant celui avant la virgule).</p></div>
            </div>
            ${exemple(`<p class="crs-calc">10<sup>−3</sup> = ${frac('1', '10<sup>3</sup>')} = ${frac('1', '1 000')} = <span class="c">0,001</span> &nbsp;(le 1 au 3<sup>e</sup> rang)</p>
                <p>De même : 10<sup>−1</sup> = 0,1 · 10<sup>−2</sup> = 0,01 · 10<sup>−5</sup> = 0,00001.</p>`)}`);
        const n1 = entre(2, 3), n2 = entre(4, 5), m = hasard([3, 4, 5, 6].filter(k => k !== n1 && k !== n2)), N = val(1, -m);
        const item = (titre, n) => ({ titre,
            parties: [partieDec({ q: `Combien vaut ${p10(-n)} ?`, label: `${p10(-n)} =`, valeur: val(1, -n), diag: v => diagPuisNeg(v, n),
                solution: `<p class="crs-calc">${p10(-n)} = ${frac('1', p10(n))} = <span class="c">${nb(val(1, -n))}</span> &nbsp;(le 1 au ${rang(n)} rang)</p>` })] });
        c.aToi(carte, [
            item('De la puissance au nombre', n1),
            item('Un peu plus petit', n2),
            { titre: 'Du nombre à la puissance',
              enonce: `<p>Écris ${nb(N)} sous la forme d'une puissance de 10.</p>`,
              parties: [partieExp({ avant: `${nb(N)} = `, valeur: -m,
                diag: v => v === m ? `${nb(N)} est plus petit que 1 : l'exposant est <b>négatif</b>.`
                    : v === -(m - 1) ? `Tu as compté seulement les zéros après la virgule : le 1 est au ${rang(m)} rang après la virgule.`
                    : v === -(m + 1) ? `Le 1 est au ${rang(m)} rang après la virgule, pas au ${rang(m + 1)}.`
                    : 'Regarde à quel rang après la virgule se trouve le chiffre 1.',
                solution: `<p class="crs-calc">${nb(N)} : le 1 est au ${rang(m)} rang après la virgule, donc ${nb(N)} = <span class="c">${p10(-m)}</span></p>` })] },
        ]);
        return carte;
    }

    function c1Droite(c) {
        const carte = c.carte('3. Multiplier par 10<sup>n</sup> : la virgule va vers la droite');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>Multiplier par 10, c'est rendre le nombre 10 fois plus grand : chaque chiffre avance d'un rang.</p>
                <div class="cle"><p>Multiplier un nombre par <b>10<sup>n</sup></b> (n &gt; 0), c'est déplacer sa virgule de <b>n rangs vers la droite</b>. On complète par des zéros si besoin.</p></div>
            </div>
            ${exemple(`<p class="crs-calc">3,5 × 10<sup>2</sup> : 3,5 → 35 → 350, donc 3,5 × 10<sup>2</sup> = <span class="c">350</span> &nbsp;(2 rangs vers la droite)</p>
                <p>De même : 2,7 × 10<sup>4</sup> = 27 000 · 0,45 × 10<sup>3</sup> = 450.</p>`)}`);
        const a1 = hasard([1.2, 2.5, 4.8, 6.3, 7.1]), n1 = hasard([2, 3]);
        const a2 = hasard([0.45, 3.06, 5.25, 0.82]), n2 = hasard([3, 4]);
        const item = (titre, a, n) => ({ titre,
            parties: [partieDec({ q: `Combien vaut ${nb(a)} × ${p10(n)} ?`, label: `${nb(a)} × ${p10(n)} =`, valeur: val(a, n), diag: v => diagDecale(v, a, n),
                solution: `<p class="crs-calc">La virgule avance de ${pl(n, 'rang')} : ${nb(a)} × ${p10(n)} = <span class="c">${nb(val(a, n))}</span></p>` })] });
        c.aToi(carte, [item('Un chiffre après la virgule', a1, n1), item('Avec des zéros à compléter', a2, n2)]);
        return carte;
    }

    function c1Gauche(c) {
        const carte = c.carte('4. Multiplier par 10<sup>−n</sup> : la virgule va vers la gauche');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>Multiplier par 10<sup>−1</sup> = 0,1, c'est diviser par 10 : chaque chiffre recule d'un rang.</p>
                <div class="cle"><p>Multiplier un nombre par <b>10<sup>−n</sup></b> (n &gt; 0), c'est déplacer sa virgule de <b>n rangs vers la gauche</b>. On ajoute des zéros devant si besoin.</p></div>
            </div>
            ${exemple(`<p class="crs-calc">8 × 10<sup>−3</sup> : 8 → 0,8 → 0,08 → 0,008, donc 8 × 10<sup>−3</sup> = <span class="c">0,008</span> &nbsp;(3 rangs vers la gauche)</p>
                <p>De même : 5,2 × 10<sup>−2</sup> = 0,052 · 125 × 10<sup>−4</sup> = 0,0125.</p>`)}`);
        const a1 = entre(2, 9), n1 = hasard([2, 3]);
        const a2 = hasard([4.5, 36, 125, 2.4]), n2 = hasard([2, 3, 4]);
        const item = (titre, a, n) => ({ titre,
            parties: [partieDec({ q: `Combien vaut ${nb(a)} × ${p10(-n)} ?`, label: `${nb(a)} × ${p10(-n)} =`, valeur: val(a, -n), diag: v => diagDecale(v, a, -n),
                solution: `<p class="crs-calc">La virgule recule de ${pl(n, 'rang')} : ${nb(a)} × ${p10(-n)} = <span class="c">${nb(val(a, -n))}</span></p>` })] });
        c.aToi(carte, [item('Un nombre entier', a1, n1), item('Un autre nombre', a2, n2)]);
        return carte;
    }

    function c1VersPuissance(c) {
        const carte = c.carte('5. De l\'écriture décimale à la puissance de 10');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>Dans l'autre sens, on cherche l'exposant n tel que le nombre s'écrive a × 10<sup>n</sup>.</p>
                <div class="cle"><p>On compte de combien de rangs la virgule se déplace pour passer de a au nombre : vers la <b>droite</b> (le nombre est plus grand) → n <b>positif</b> ; vers la <b>gauche</b> (le nombre est plus petit) → n <b>négatif</b>.</p></div>
            </div>
            ${exemple(`<p class="crs-calc">3 500 = <span class="c">3,5 × 10<sup>3</sup></span> &nbsp;(de 3,5 à 3 500 : 3 rangs vers la droite)</p>
                <p class="crs-calc">0,0042 = <span class="c">4,2 × 10<sup>−3</sup></span> &nbsp;(de 4,2 à 0,0042 : 3 rangs vers la gauche)</p>
                <p>De même : 250 000 = 2,5 × 10<sup>5</sup>.</p>`)}`);
        const a1 = entre(2, 9), n1 = entre(3, 6);
        const a2 = hasard([4.2, 3.7, 8.1, 2.6]), n2 = -entre(2, 4);
        const a3 = hasard([2.5, 1.8, 7.3, 4.06]), n3 = entre(4, 6);
        const item = (titre, a, n) => {
            const N = val(a, n);
            return { titre,
                parties: [partieExp({ q: 'Complète l\'exposant :', avant: `${nb(N)} = ${nb(a)} × `, valeur: n,
                    diag: v => diagExposant(v, n, N, a),
                    solution: `<p class="crs-calc">De ${nb(a)} à ${nb(N)}, la virgule va de ${pl(Math.abs(n), 'rang')} vers la ${n > 0 ? 'droite' : 'gauche'} : ${nb(N)} = <span class="c">${nb(a)} × ${p10(n)}</span></p>` })] };
        };
        c.aToi(carte, [item('Un grand nombre', a1, n1), item('Un nombre plus petit que 1', a2, n2), item('Avec une virgule', a3, n3)]);
        return carte;
    }

    function c1Retenir(c) {
        const carte = c.carte('À retenir');
        c.ajouter(carte, `<div class="cle"><p>10<sup>n</sup> = 10 × … × 10 (n facteurs) : un 1 suivi de n zéros. <b>10<sup>0</sup> = 1</b>.</p>
                <p>10<sup>−n</sup> = ${frac('1', '10<sup>n</sup>')} : le chiffre 1 est au n<sup>e</sup> rang après la virgule.</p></div>
            <div class="cle"><p>× 10<sup>n</sup> (n &gt; 0) : la virgule se déplace de n rangs <b>vers la droite</b>.</p>
                <p>× 10<sup>−n</sup> (n &gt; 0) : la virgule se déplace de n rangs <b>vers la gauche</b>.</p></div>
            <div class="cle"><p>Dans l'autre sens, on compte les rangs : 3 500 = 3,5 × 10<sup>3</sup> · 0,0042 = 4,2 × 10<sup>−3</sup>.</p></div>
            ${actions([['#training-1', 'S\'entraîner sur les définitions →'], ['#course-2', 'Module 2 : écriture scientifique'], ['#fiche-1', 'Fiche récapitulative']])}`);
        return carte;
    }

    /* ═══════════════ COURS 2 — Écriture scientifique ═══════════════ */
    // quatre écritures égales d'un même nombre : une seule est scientifique
    function itemReconnaitre(titre, e) {
        const d1 = entre(1, 9), d2 = entre(0, 9), d3 = entre(1, 9);
        const neg = e < 0 ? ' (l\'exposant peut être négatif : ce n\'est pas lui le problème)' : '';
        return { titre,
            parties: [{ type: 'choix', q: 'Ces quatre écritures désignent le même nombre. Laquelle est l\'écriture scientifique ?',
                options: [
                    { id: 'ok', label: `${d1},${d2}${d3} × ${p10(e)}` },
                    { id: 'deux', label: `${d1}${d2},${d3} × ${p10(e - 1)}` },
                    { id: 'zero', label: `0,${d1}${d2}${d3} × ${p10(e + 1)}` },
                    { id: 'trois', label: `${d1}${d2}${d3} × ${p10(e - 2)}` }],
                bonne: 'ok',
                indices: {
                    deux: `${d1}${d2},${d3} a deux chiffres avant la virgule : il faut 1 ≤ a &lt; 10${neg}.`,
                    zero: `0,${d1}${d2}${d3} commence par 0 : il faut un chiffre <b>non nul</b> avant la virgule${neg}.`,
                    trois: `${d1}${d2}${d3} est plus grand que 10 : il faut 1 ≤ a &lt; 10${neg}.` },
                solution: `<p>${d1},${d2}${d3} × ${p10(e)} : un seul chiffre non nul avant la virgule (1 ≤ ${d1},${d2}${d3} &lt; 10).</p>` }] };
    }
    // corriger une écriture qui n'est pas scientifique : 35 × 10⁷ → 3,5 × 10⁸
    function itemCorriger(titre) {
        const w = hasard([{ m: 35, e: 7 }, { m: 47, e: 5 }, { m: 0.63, e: 4 }, { m: 12.8, e: -2 }, { m: 0.42, e: 3 }]);
        const k = w.m >= 10 ? 1 : -1, a = val(w.m, -k), bon = w.e + k;
        const faux = `${nb(w.m)} × ${p10(w.e)}`;
        const autre = k > 0 ? `${nb(val(w.m, 1))} × ${p10(w.e - 1)}` : `${nb(val(w.m, -1))} × ${p10(w.e + 1)}`;
        return { titre,
            parties: [{ type: 'choix', q: `${faux} n'est pas en écriture scientifique. Quelle est la bonne écriture ?`,
                options: [{ id: 'ok', label: `${nb(a)} × ${p10(bon)}` }, { id: 'meme', label: `${nb(a)} × ${p10(w.e)}` },
                          { id: 'sens', label: `${nb(a)} × ${p10(w.e - k)}` }, { id: 'autre', label: autre }],
                bonne: 'ok',
                indices: {
                    meme: k > 0 ? `${nb(a)} est 10 fois plus petit que ${nb(w.m)} : pour garder la même valeur, il faut une puissance de 10 dix fois plus grande (exposant + 1).`
                                : `${nb(a)} est 10 fois plus grand que ${nb(w.m)} : pour garder la même valeur, il faut une puissance de 10 dix fois plus petite (exposant − 1).`,
                    sens: k > 0 ? `${nb(w.m)} = ${nb(a)} × 10 : on <b>ajoute</b> 1 à l'exposant, on ne l'enlève pas.`
                                : `${nb(w.m)} = ${nb(a)} × 10<sup>−1</sup> : on <b>enlève</b> 1 à l'exposant, on ne l'ajoute pas.`,
                    autre: `C'est bien le même nombre, mais ${autre.split(' ×')[0]} n'est pas entre 1 et 10.` },
                solution: `<p class="crs-calc">${faux} = ${nb(a)} × ${k > 0 ? '10' : '10<sup>−1</sup>'} × ${p10(w.e)} = <span class="c">${nb(a)} × ${p10(bon)}</span></p>` }] };
    }
    // diagnostic d'une écriture scientifique saisie (a, n) pour le nombre N = a0 × 10^n0
    function diagSci(vs, N, a0, n0) {
        const [a, n] = vs;
        if (!Number.isInteger(n)) return 'L\'exposant n est un nombre entier.';
        if (a >= 10 || a < 1) {
            const pb = a >= 10 ? `${nb(a)} a plus d'un chiffre avant la virgule` : `${nb(a)} n'a pas de chiffre non nul avant la virgule`;
            return egal(val(a, n), N) ? `Ton écriture est bien égale à ${nb(N)}, mais ${pb} : ce n'est pas l'écriture scientifique (il faut 1 ≤ a &lt; 10).`
                                       : `${pb} : en écriture scientifique, 1 ≤ a &lt; 10.`;
        }
        if (!egal(a, a0)) return `Le nombre a garde les chiffres de ${nb(N)} : place la virgule juste après le premier chiffre non nul.`;
        if (n === -n0) return n0 > 0 ? `Le signe de l'exposant est faux : ${nb(N)} est plus grand que 10, la virgule va vers la gauche, l'exposant est <b>positif</b>.`
                                     : `Le signe de l'exposant est faux : ${nb(N)} est plus petit que 1, la virgule va vers la droite, l'exposant est <b>négatif</b>.`;
        if (Math.abs(Math.abs(n) - Math.abs(n0)) === 1) return `Recompte les rangs : tu en as compté un de ${Math.abs(n) > Math.abs(n0) ? 'trop' : 'moins'} entre ${nb(N)} et ${nb(a0)}.`;
        return `Compte de combien de rangs la virgule se déplace entre ${nb(N)} et ${nb(a0)}.`;
    }
    // écrire N en écriture scientifique : deux cases (a, puis l'exposant n)
    function itemEcrire(titre, a0, n0) {
        const N = val(a0, n0);
        return { titre,
            parties: [{ type: 'champs', q: `Écris ${nb(N)} en écriture scientifique.`, ligne: true,
                champs: [{ valeur: a0, rel: 1e-9, signe: false, unite: '<span class="p10-x10">× 10</span>', aria: 'Nombre a, entre 1 et 10' },
                         { valeur: n0, tol: 0, entier: true, aria: 'Exposant n' }],
                diag: vs => diagSci(vs, N, a0, n0),
                solution: `<p class="crs-calc">${nb(N)} → ${nb(a0)} : la virgule se déplace de ${pl(Math.abs(n0), 'rang')} vers la ${n0 > 0 ? 'gauche' : 'droite'}, donc ${nb(N)} = <span class="c">${nb(a0)} × ${p10(n0)}</span></p>` }] };
    }

    function c2Definition(c) {
        const carte = c.carte('1. Qu\'est-ce que l\'écriture scientifique ?');
        c.ajouter(carte, `<div class="cours-bloc">

                    <li>12,8 × 10<sup>−2</sup> : 12,8 a deux chiffres avant la virgule → il faut 1,28 × 10<sup>−1</sup>.</li></ul>`, 'Exemples et contre-exemples')}`);

    }

    function c2Decimale(c) {
        const carte = c.carte('3. Revenir à l\'écriture décimale');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>Pour écrire en décimal un nombre en écriture scientifique, on applique la règle du module 1.</p>
                <div class="cle"><p>a × 10<sup>n</sup> : la virgule de a se déplace de n rangs vers la <b>droite</b> si n &gt; 0, vers la <b>gauche</b> si n &lt; 0.</p></div>
            </div>
            ${exemple(`<p class="crs-calc">2,83 × 10<sup>4</sup> = <span class="c">28 300</span> &nbsp;(4 rangs vers la droite)</p>
                <p class="crs-calc">5,37 × 10<sup>−4</sup> = <span class="c">0,000537</span> &nbsp;(4 rangs vers la gauche)</p>`)}`);
        const item = (titre, a, n) => ({ titre,
            parties: [partieDec({ q: `Écris ${nb(a)} × ${p10(n)} en écriture décimale.`, label: `${nb(a)} × ${p10(n)} =`, valeur: val(a, n), diag: v => diagDecale(v, a, n),
                solution: `<p class="crs-calc">La virgule va de ${pl(Math.abs(n), 'rang')} vers la ${n > 0 ? 'droite' : 'gauche'} : ${nb(a)} × ${p10(n)} = <span class="c">${nb(val(a, n))}</span></p>` })] });
        c.aToi(carte, [
            item('Exposant positif', hasard([3.6, 7.2, 1.8, 4.05, 9.3]), entre(3, 5)),
            item('Exposant négatif', hasard([6.42, 7.25, 1.5, 3.08]), -entre(2, 4)),
        ]);
        return carte;
    }

    function c2Retenir(c) {
        const carte = c.carte('À retenir');
        c.ajouter(carte, `<div class="cle"><p>Écriture scientifique : <b>a × 10<sup>n</sup></b> avec 1 ≤ a &lt; 10 (un seul chiffre non nul avant la virgule) et n entier relatif.</p></div>
            <div class="cle"><p>Pour l'obtenir, on déplace la virgule : le nombre de rangs donne n ; vers la gauche → n positif, vers la droite → n négatif.</p>
                <p>28 300 = 2,83 × 10<sup>4</sup> · 0,000537 = 5,37 × 10<sup>−4</sup></p></div>
            <div class="cle"><p>Retour à l'écriture décimale : la virgule de a se déplace de n rangs (vers la droite si n &gt; 0, vers la gauche si n &lt; 0).</p></div>
            ${actions([['#training-2', 'S\'entraîner sur l\'écriture scientifique →'], ['#course-3', 'Module 3 : opérations'], ['#fiche-2', 'Fiche récapitulative']])}`);
        return carte;
    }

    /* ═══════════════ COURS 3 — Opérations ═══════════════ */
    const par = n => n < 0 ? `(${ex(n)})` : ex(n);   // −4 → (−4) dans un calcul
    function diagMul(v, a, b) {
        if (v === a * b) return 'Tu as multiplié les exposants : pour un produit de puissances de 10, on les <b>additionne</b>.';
        if ((a < 0 || b < 0) && (v === Math.abs(a) + Math.abs(b) || v === -(a + b) || v === -(Math.abs(a) + Math.abs(b))))
            return `Attention aux signes : ${ex(a)} + ${par(b)} = ${ex(a + b)}.`;
        if (v === a - b || v === b - a) return 'Tu as soustrait : pour un produit, on <b>additionne</b> les exposants.';
        return `On additionne les exposants : ${ex(a)} + ${par(b)}.`;
    }
    function diagDiv(v, a, b) {
        if (b < 0 && v === a + b) return `Soustraire un exposant négatif revient à ajouter : ${ex(a)} − ${par(b)} = ${ex(a)} + ${ex(-b)}.`;
        if (v === a + b) return 'Tu as additionné : pour une division, on <b>soustrait</b> les exposants (celui du haut moins celui du bas).';
        if (v === b - a) return `Tu as calculé ${ex(b)} − ${par(a)} : c'est l'exposant du <b>haut</b> moins celui du bas.`;
        return `On soustrait les exposants : ${ex(a)} − ${par(b)}.`;
    }
    function diagPP(v, a, b) {
        if (v === a + b) return 'Tu as additionné : pour une puissance de puissance, on <b>multiplie</b> les exposants.';
        if (v === -(a * b)) return `Attention à la règle des signes : ${ex(a)} × ${par(b)} = ${ex(a * b)}.`;
        if (a > 0 && b > 0 && v === Math.pow(a, b)) return `Tu as calculé ${a}<sup>${b}</sup> : il suffit de multiplier ${a} × ${b}.`;
        return `On multiplie les exposants : ${ex(a)} × ${par(b)}.`;
    }
    // tirage au hasard recommencé tant que la condition « refus » est vraie
    const tirerSauf = (tirer, refus) => { let x; do { x = tirer(); } while (refus(x)); return x; };

    function c3Multiplication(c) {
        const carte = c.carte('1. Multiplier deux puissances de 10');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>10<sup>3</sup> × 10<sup>2</sup> = (10 × 10 × 10) × (10 × 10) : il y a 3 + 2 = 5 facteurs 10.</p>
                <div class="cle"><p class="crs-formule">10<sup>a</sup> × 10<sup>b</sup> = 10<sup>a+b</sup></p>
                    <p>On <b>additionne</b> les exposants.</p></div>
            </div>
            ${exemple(`<p class="crs-calc">10<sup>3</sup> × 10<sup>2</sup> = 10<sup>3+2</sup> = <span class="c">10<sup>5</sup></span></p>
                <p class="crs-calc">10<sup>7</sup> × 10<sup>−4</sup> = 10<sup>7+(−4)</sup> = <span class="c">10<sup>3</sup></span></p>
                <p class="crs-calc">10<sup>−2</sup> × 10<sup>−3</sup> = 10<sup>−2+(−3)</sup> = <span class="c">10<sup>−5</sup></span></p>`)}`);
        // le deuxième couple ne doit pas donner 10⁰ (a + b = 0)
        const paires = [[entre(2, 7), entre(2, 7)], tirerSauf(() => [entre(4, 9), -entre(2, 7)], p => p[0] + p[1] === 0), [-entre(2, 5), -entre(1, 4)]];
        const titres = ['Deux exposants positifs', 'Un exposant négatif', 'Deux exposants négatifs'];
        c.aToi(carte, paires.map(([a, b], i) => ({ titre: titres[i],
            parties: [partieExp({ q: 'Calcule et complète l\'exposant :', avant: `${p10(a)} × ${p10(b)} = `, valeur: a + b, diag: v => diagMul(v, a, b),
                solution: `<p class="crs-calc">${p10(a)} × ${p10(b)} = 10<sup>${ex(a)}+${par(b)}</sup> = <span class="c">${p10(a + b)}</span></p>` })] })));
        return carte;
    }

    function c3Division(c) {
        const carte = c.carte('2. Diviser deux puissances de 10');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>${frac('10<sup>5</sup>', '10<sup>2</sup>')} = ${frac('10 × 10 × 10 × 10 × 10', '10 × 10')} : on simplifie deux facteurs 10, il en reste 5 − 2 = 3.</p>
                <div class="cle"><p class="crs-formule">${frac('10<sup>a</sup>', '10<sup>b</sup>')} = 10<sup>a−b</sup></p>
                    <p>On <b>soustrait</b> les exposants : celui du haut moins celui du bas.</p></div>
            </div>
            ${exemple(`<p class="crs-calc">${frac('10<sup>7</sup>', '10<sup>3</sup>')} = 10<sup>7−3</sup> = <span class="c">10<sup>4</sup></span></p>
                <p class="crs-calc">${frac('10<sup>2</sup>', '10<sup>5</sup>')} = 10<sup>2−5</sup> = <span class="c">10<sup>−3</sup></span></p>
                <p class="crs-calc">${frac('10<sup>−2</sup>', '10<sup>−5</sup>')} = 10<sup>−2−(−5)</sup> = <span class="c">10<sup>3</sup></span></p>`)}`);
        const b1 = entre(1, 4), a1 = entre(b1 + 1, b1 + 5);
        const a2 = entre(1, 4), b2 = entre(a2 + 2, a2 + 5);
        const a3 = entre(2, 6), b3 = -entre(1, 4);
        const titres = ['Le plus grand exposant en haut', 'Le plus grand exposant en bas', 'Un exposant négatif en bas'];
        c.aToi(carte, [[a1, b1], [a2, b2], [a3, b3]].map(([a, b], i) => ({ titre: titres[i],
            parties: [partieExp({ q: 'Calcule et complète l\'exposant :', avant: `${frac(p10(a), p10(b))} = `, valeur: a - b, diag: v => diagDiv(v, a, b),
                solution: `<p class="crs-calc">${frac(p10(a), p10(b))} = 10<sup>${ex(a)}−${par(b)}</sup> = <span class="c">${p10(a - b)}</span></p>` })] })));
        return carte;
    }

    function c3Inverse(c) {
        const carte = c.carte('3. L\'inverse d\'une puissance de 10');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>C'est un cas particulier de la division : 1 = 10<sup>0</sup>, donc ${frac('1', '10<sup>a</sup>')} = 10<sup>0−a</sup>.</p>
                <div class="cle"><p class="crs-formule">${frac('1', '10<sup>a</sup>')} = 10<sup>−a</sup></p>
                    <p>On <b>change le signe</b> de l'exposant.</p></div>
            </div>
            ${exemple(`<p class="crs-calc">${frac('1', '10<sup>3</sup>')} = <span class="c">10<sup>−3</sup></span> &nbsp;·&nbsp; ${frac('1', '10<sup>−5</sup>')} = <span class="c">10<sup>5</sup></span></p>`)}`);
        const a = entre(2, 8), b = entre(2, 6), k = entre(2, 4), D = Math.pow(10, k);
        c.aToi(carte, [
            { titre: 'Un exposant positif',
              parties: [partieExp({ q: 'Calcule et complète l\'exposant :', avant: `${frac('1', p10(a))} = `, valeur: -a,
                diag: v => v === a ? 'Tu as gardé l\'exposant : pour l\'inverse, on <b>change son signe</b>.' : `On change le signe de l'exposant : ${ex(a)} devient ${ex(-a)}.`,
                solution: `<p class="crs-calc">${frac('1', p10(a))} = <span class="c">${p10(-a)}</span></p>` })] },
            { titre: 'Un exposant négatif',
              parties: [partieExp({ q: 'Calcule et complète l\'exposant :', avant: `${frac('1', p10(-b))} = `, valeur: b,
                diag: v => v === -b ? 'Tu as gardé l\'exposant : on change son signe, −' + b + ' devient ' + b + '.' : `On change le signe de l'exposant : ${ex(-b)} devient ${b}.`,
                solution: `<p class="crs-calc">${frac('1', p10(-b))} = <span class="c">${p10(b)}</span></p>` })] },
            { titre: 'Avec l\'écriture décimale',
              parties: [partieExp({ q: `Écris ${frac('1', nb(D))} sous la forme d'une puissance de 10.`, avant: `${frac('1', nb(D))} = `, valeur: -k,
                diag: v => v === k ? `${nb(D)} = ${p10(k)}, et l'inverse change le signe de l'exposant : l'exposant est négatif.`
                    : `Écris d'abord ${nb(D)} sous la forme d'une puissance de 10, puis change le signe de l'exposant.`,
                solution: `<p class="crs-calc">${frac('1', nb(D))} = ${frac('1', p10(k))} = <span class="c">${p10(-k)}</span></p>` })] },
        ]);
        return carte;
    }

    function c3Puissance(c) {
        const carte = c.carte('4. La puissance d\'une puissance');
        c.ajouter(carte, `<div class="cours-bloc">
                <p>(10<sup>3</sup>)<sup>2</sup> = 10<sup>3</sup> × 10<sup>3</sup> = 10<sup>3+3</sup> = 10<sup>6</sup> : c'est 3 × 2.</p>
                <div class="cle"><p class="crs-formule">(10<sup>a</sup>)<sup>b</sup> = 10<sup>a×b</sup></p>
                    <p>On <b>multiplie</b> les exposants (attention à la règle des signes).</p></div>
            </div>
            ${exemple(`<p class="crs-calc">(10<sup>3</sup>)<sup>2</sup> = 10<sup>3×2</sup> = <span class="c">10<sup>6</sup></span> &nbsp;·&nbsp; (10<sup>−2</sup>)<sup>3</sup> = 10<sup>−2×3</sup> = <span class="c">10<sup>−6</sup></span></p>
                <p class="crs-calc">(10<sup>4</sup>)<sup>−1</sup> = 10<sup>4×(−1)</sup> = <span class="c">10<sup>−4</sup></span> &nbsp;·&nbsp; (10<sup>−3</sup>)<sup>−2</sup> = 10<sup>−3×(−2)</sup> = <span class="c">10<sup>6</sup></span></p>`)}`);
        const paires = [[entre(2, 5), entre(2, 5)], hasard([[-entre(2, 4), entre(2, 3)], [entre(2, 4), -entre(2, 3)]]), [-entre(2, 3), -entre(2, 3)]];
        const titres = ['Deux exposants positifs', 'Un exposant négatif', 'Deux exposants négatifs'];
        c.aToi(carte, paires.map(([a, b], i) => ({ titre: titres[i],
            parties: [partieExp({ q: 'Calcule et complète l\'exposant :', avant: `(${p10(a)})<sup>${ex(b)}</sup> = `, valeur: a * b, diag: v => diagPP(v, a, b),
                solution: `<p class="crs-calc">(${p10(a)})<sup>${ex(b)}</sup> = 10<sup>${ex(a)}×${par(b)}</sup> = <span class="c">${p10(a * b)}</span></p>` })] })));
        return carte;
    }

    function c3Retenir(c) {
        const carte = c.carte('À retenir');
        c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Multiplication</b> : on additionne les exposants.</p><p class="crs-formule">10<sup>a</sup> × 10<sup>b</sup> = 10<sup>a+b</sup></p></div>
            <div class="cle"><p><b class="cle-titre">Division</b> : on soustrait les exposants.</p><p class="crs-formule">${frac('10<sup>a</sup>', '10<sup>b</sup>')} = 10<sup>a−b</sup></p></div>
            <div class="cle"><p><b class="cle-titre">Inverse</b> : on change le signe de l'exposant.</p><p class="crs-formule">${frac('1', '10<sup>a</sup>')} = 10<sup>−a</sup></p></div>
            <div class="cle"><p><b class="cle-titre">Puissance d'une puissance</b> : on multiplie les exposants.</p><p class="crs-formule">(10<sup>a</sup>)<sup>b</sup> = 10<sup>a×b</sup></p></div>
            ${actions([['#training-3', 'S\'entraîner sur les opérations →'], ['#training-4', 'Module 4 : toutes les notions'], ['#fiche-3', 'Fiche récapitulative']])}`);
        return carte;
    }

    return {
        1: { titre: 'Définitions et écritures',
             contexte: 'Tu vas voir ce que vaut <b>10<sup>n</sup></b> quand n est positif ou négatif, puis comment passer d\'un nombre écrit avec une puissance de 10 à son <b>écriture décimale</b>, et inversement.',
             etapes: [c1Positives, c1Negatives, c1Droite, c1Gauche, c1VersPuissance, c1Retenir] },
        2: { titre: 'Écriture scientifique',
             contexte: 'Les très grands et les très petits nombres s\'écrivent en <b>écriture scientifique</b>, a × 10<sup>n</sup>. Tu vas apprendre à la reconnaître, à l\'obtenir et à revenir à l\'écriture décimale.',
             etapes: [c2Definition, c2Methode, c2Decimale, c2Retenir] },
        3: { titre: 'Opérations avec les puissances de 10',
             contexte: 'Tu vas apprendre les quatre règles de calcul sur les puissances de 10 : <b>multiplication</b>, <b>division</b>, <b>inverse</b> et <b>puissance d\'une puissance</b>.',
             etapes: [c3Multiplication, c3Division, c3Inverse, c3Puissance, c3Retenir] },
    };
})();

// AFFICHAGE D'UNE QUESTION

function showQuestion() {
    const q = questions[currentQuestion];
    const color = TRAINING_THEMES[currentModule].color;
    const container = document.getElementById('questionContainer');
    document.getElementById('questionNum').textContent = currentQuestion + 1;
    document.getElementById('progressBar').style.width = ((currentQuestion + 1) / 20 * 100) + '%';
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('submitBtn').style.display = 'block';
    document.getElementById('nextBtn').style.display = 'none';

    if (q.type === 'input_exp') {
        container.innerHTML = `
            <div class="bg-${color}-50 rounded-xl p-6 question-box">
                <p class="text-xl mb-6 font-medium">${q.question}</p>
                <div class="flex items-center gap-3 flex-wrap mt-2">
                    <span class="text-gray-600 font-semibold text-lg">Réponse :</span>
                    <div class="power-answer-wrap">
                        <span class="base text-${color}-900">10</span>
                        <input type="text" id="userAnswer" inputmode="numeric" class="exp-input border-2 border-${color}-500 text-${color}-900" placeholder="?" onfocus="numpadFocus(this.id)" ontouchstart="numpadFocus(this.id)">
                    </div>
                </div>
                ${numpadWidget()}

    } else if (q.type === 'input_decimal') {
        container.innerHTML = `
            <div class="bg-${color}-50 rounded-xl p-6 question-box">

                <div class="flex items-center gap-3 flex-wrap">
                    <span class="text-gray-600 font-semibold">Réponse :</span>
                    <input type="text" id="userAnswer" inputmode="decimal" class="border-2 border-${color}-400 rounded px-4 py-2 text-lg w-44 bg-white font-bold" placeholder="Réponse" onfocus="numpadFocus(this.id)" ontouchstart="numpadFocus(this.id)">
                </div>
                ${numpadWidget()}
            </div>`;

    } else if (q.type === 'qcm') {
        container.innerHTML = `

                <p class="text-xl mb-5 font-medium">${q.question}</p>
                <div class="space-y-3">
                    ${q.options.map((opt, i) => `
                        <label class="qcm-option-label flex items-center p-4 bg-white rounded-xl cursor-pointer hover:bg-${color}-100 border-2 border-${color}-200 transition">
                            <input type="radio" name="qcm" value="${i}" class="mr-3 w-5 h-5">
                            <span class="text-lg">${opt}</span>
                        </label>`).join('')}

            </div>`;

    } else if (q.type === 'order') {
        container.innerHTML = `
            <div class="bg-${color}-50 rounded-xl p-6 question-box">
                <p class="text-xl mb-5 font-medium">${q.question}</p>
                <div class="mb-4">
                    <p class="font-semibold mb-2 text-gray-700">Éléments à trier :</p>
                    <div id="sourceItems" class="source-items-h">
                        ${q.items.map((item, i) => `
                            <div class="draggable bg-white px-4 py-2 rounded-xl border-2 border-${color}-400 font-bold cursor-move" data-index="${i}">${item}</div>`).join('')}
                    </div>
                </div>
                <div>
                    <p class="font-semibold mb-2 text-gray-700">Ordre croissant (plus petit → plus grand) :</p>
                    <div id="targetItems" class="drop-zone-h border-2 border-dashed border-${color}-400 rounded-xl p-3 bg-${color}-50"></div>
                </div>
                <p class="text-sm text-gray-500 mt-3">Glisse les éléments dans la zone ci-dessus</p>
            </div>`;
        initDragAndDrop();

    } else if (q.type === 'scientific') {
        container.innerHTML = `
            <div class="bg-${color}-50 rounded-xl p-6 question-box">
                <p class="text-xl mb-6 font-medium">${q.question}</p>
                <div class="flex items-center gap-2 flex-wrap mt-2">
                    <span class="text-gray-600 font-semibold">Réponse :</span>
                    <input type="text" id="answerA" inputmode="decimal" class="border-2 border-${color}-400 rounded px-3 py-2 w-24 bg-white font-bold text-lg" placeholder="a" onfocus="numpadFocus(this.id)" ontouchstart="numpadFocus(this.id)">
                    <span class="text-xl font-bold">× 10</span>
                    <sup><input type="text" id="answerN" inputmode="numeric" style="width:80px; font-size:14px; padding:5px 8px;" class="border-2 border-${color}-400 rounded bg-white font-bold" placeholder="n" onfocus="numpadFocus(this.id)" ontouchstart="numpadFocus(this.id)"></sup>
                </div>
                ${numpadWidget()}
            </div>`;

}

// ═══════════════════════════════════════════════════════════════
// DRAG & DROP
// ═══════════════════════════════════════════════════════════════
function initDragAndDrop() {
    document.querySelectorAll('.draggable').forEach(item => {
        DragDrop.enable(item, {
            zoneSelector: '#targetItems, #sourceItems',
            onDrop: (dragged, zone) => { if (zone) zone.appendChild(dragged); },
        });
    });
}

// ═══════════════════════════════════════════════════════════════
// VALIDATION
// ═══════════════════════════════════════════════════════════════
function submitAnswer() {
    const q = questions[currentQuestion];
    const feedback = document.getElementById('feedback');
    let isCorrect = false;

    if (q.type === 'input_exp') {
        const user = parseInt(document.getElementById('userAnswer').value);
        isCorrect = user === q.answer;
    } else if (q.type === 'input_decimal') {
        let user = document.getElementById('userAnswer').value.trim().replace(',', '.').replace(/\s/g, '');
        let correct = String(q.answer).replace(',', '.').replace(/\s/g, '');
        isCorrect = Math.abs(parseFloat(user) - parseFloat(correct)) < 0.0000001;
    } else if (q.type === 'qcm') {
        const sel = document.querySelector('input[name="qcm"]:checked');
        if (sel) isCorrect = parseInt(sel.value) === q.answer;
        document.querySelectorAll('input[name="qcm"]').forEach(radio => {
            radio.disabled = true;
            const label = radio.closest('.qcm-option-label');
            if (parseInt(radio.value) === q.answer) label.classList.add('opt-correct');
            else if (radio.checked) label.classList.add('opt-wrong');
        });
    } else if (q.type === 'order') {
        const ordered = Array.from(document.getElementById('targetItems').children).map(el => el.innerHTML.trim());
        isCorrect = JSON.stringify(ordered) === JSON.stringify(q.answer);
    } else if (q.type === 'scientific') {
        const userA = parseFloat(document.getElementById('answerA').value.replace(',', '.'));
        const userN = parseInt(document.getElementById('answerN').value);
        isCorrect = Math.abs(userA - q.answerA) < 0.01 && userN === q.answerN;
    }

    if (isCorrect) {
        score++;
        feedback.innerHTML = `<div class="callout-success correct">
            <p class="text-green-800 font-bold text-xl">✓ Correct ! 🎉</p>
            <p class="text-green-700 mt-2">${q.explanation}</p></div>`;
    } else {
        feedback.innerHTML = `<div class="callout-danger">
            <p class="text-red-800 font-bold text-xl">✗ Incorrect</p>
            <p class="text-red-700 mt-2">${q.explanation}</p></div>`;
    }

    document.getElementById('score').textContent = score;
    document.getElementById('total').textContent = currentQuestion + 1;
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < 20) showQuestion();
    else showResults();
}

function showResults() {
    SOM.marquer({ note: Math.round(score / questions.length * 20 * 2) / 2 }, 'training-' + currentModule);   // meilleure note sur 20
    const pct = Math.round(score / 20 * 100);
    const color = TRAINING_THEMES[currentModule].color;
    let msg = '';
    if (pct >= 90) msg = 'Excellent ! Tu maîtrises parfaitement ce chapitre ! 🏆';
    else if (pct >= 70) msg = 'Très bien ! Continue comme ça ! 👍';
    else if (pct >= 50) msg = 'Pas mal ! Avec un peu plus de travail tu vas y arriver. 💪';
    else msg = 'Continue à t\'entraîner, tu vas progresser ! 📚';
    document.getElementById('questionContainer').innerHTML = `
        <div class="bg-${color}-50 border border-${color}-200 rounded-2xl shadow-lg p-10 text-center">
            <h3 class="text-2xl font-bold text-gray-800 mb-3">Entraînement terminé !</h3>
            <div class="text-6xl font-bold text-${color}-700 mb-2">${score} / 20</div>
            <div class="text-xl font-bold text-gray-400 mb-6">${pct}%</div>
            <p class="text-gray-500 mb-8 text-lg">${msg}</p>
            <div class="flex gap-4 justify-center flex-wrap">
                <button onclick="showTraining(${currentModule})" class="bg-${color}-500 hover:bg-${color}-600 text-white px-6 py-3 rounded-lg font-bold">Recommencer</button>
            </div>
        </div>`;
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
}

// MODULE 1 — Définitions & écritures
// ═══════════════════════════════════════════════════════════════
function generateTraining1() {
    const qs = [];
    // Q1-4 : 10^n → décimale (positifs)
    const posData = shuffle([
        {n:2, val:'100'}, {n:3, val:'1000'}, {n:4, val:'10000'},
        {n:5, val:'100000'}, {n:6, val:'1000000'}, {n:1, val:'10'}
    ]);
    for (let i = 0; i < 4; i++) {
        const d = posData[i];
        qs.push({ type:'input_decimal', question:`Écris en écriture décimale : 10<sup>${d.n}</sup>`,
            answer: d.val, explanation:`10<sup>${d.n}</sup> = ${d.val} (1 suivi de ${d.n} zéro${d.n>1?'s':''}).` });
    }
    // Q5-7 : 10^-n → décimale (négatifs)
    const negData = shuffle([
        {n:-1, val:'0,1'}, {n:-2, val:'0,01'}, {n:-3, val:'0,001'}, {n:-4, val:'0,0001'}
    ]);
    for (let i = 0; i < 3; i++) {
        const d = negData[i];
        qs.push({ type:'input_decimal', question:`Écris en écriture décimale : 10<sup>${d.n}</sup>`,
            answer: d.val, explanation:`10<sup>${d.n}</sup> = ${frac('1','10<sup>'+ (-d.n) +'</sup>')} = ${d.val}` });
    }
    // Q8-10 : décimale → exposant positif
    const bigNums = shuffle([[100,2],[1000,3],[10000,4],[100000,5],[1000000,6]]);
    for (let i = 0; i < 3; i++) {
        const [num, exp] = bigNums[i];
        qs.push({ type:'input_exp', question:`Complète : ${num.toLocaleString('fr-FR')} = 10<sup>?</sup>`,
            answer: exp, explanation:`${num.toLocaleString('fr-FR')} = 10<sup>${exp}</sup> (${exp} zéro${exp>1?'s':''}).` });
    }
    // Q11-12 : décimale → exposant négatif
    const smallNums = shuffle([
        {str:'0,1', exp:-1}, {str:'0,01', exp:-2}, {str:'0,001', exp:-3}, {str:'0,0001', exp:-4}
    ]);
    for (let i = 0; i < 2; i++) {
        const d = smallNums[i];
        qs.push({ type:'input_exp', question:`Complète : ${d.str} = 10<sup>?</sup>`,
            answer: d.exp, explanation:`${d.str} = 10<sup>${d.exp}</sup>` });
    }
    // Q13 QCM
    qs.push({ type:'qcm', question:'Combien vaut 10<sup>0</sup> ?',
        options:['1','0','10','100'], answer:0, explanation:'10<sup>0</sup> = 1 (toute base non nulle à la puissance 0 vaut 1).' });
    qs.push({ type:'qcm', question:'Lequel est le plus grand ?',
        options:['10<sup>5</sup>','10<sup>2</sup>','10<sup>-3</sup>','10<sup>0</sup>'], answer:0,
        explanation:'10<sup>5</sup> = 100 000 est le plus grand.' });
    qs.push({ type:'qcm', question:'Lequel est le plus petit ?',
        options:['10<sup>-4</sup>','10<sup>-1</sup>','10<sup>0</sup>','10<sup>3</sup>'], answer:0,
        explanation:'10<sup>-4</sup> = 0,0001 est le plus petit.' });
    // Q16-17 : a × 10^n → décimale (n positif)
    const mulPos = shuffle([
        {a:3,n:2,val:'300'},{a:7,n:3,val:'7000'},{a:5,n:4,val:'50000'},{a:2,n:5,val:'200000'}
    ]);
    for (let i = 0; i < 2; i++) {
        const d = mulPos[i];
        qs.push({ type:'input_decimal', question:`Écris en écriture décimale : ${d.a} × 10<sup>${d.n}</sup>`,
            answer: d.val, explanation:`${d.a} × 10<sup>${d.n}</sup> = ${d.val} (${d.n} rang${d.n>1?'s':''} vers la droite).` });
    }
    // Q18-19 : a × 10^-n → décimale
    const mulNeg = shuffle([
        {a:7,n:2,val:'0,07'},{a:3,n:3,val:'0,003'},{a:5,n:2,val:'0,05'},{a:9,n:3,val:'0,009'}
    ]);
    for (let i = 0; i < 2; i++) {
        const d = mulNeg[i];
        qs.push({ type:'input_decimal', question:`Écris en écriture décimale : ${d.a} × 10<sup>-${d.n}</sup>`,
            answer: d.val, explanation:`${d.a} × 10<sup>-${d.n}</sup> = ${d.val} (${d.n} rang${d.n>1?'s':''} vers la gauche).` });
    }
    // Q20 : Ordre
    const expsOrd = shuffle([-3,-1,0,2,4]);
    qs.push({ type:'order', question:'Place ces puissances dans l\'ordre croissant :',
        items: expsOrd.map(n=>`10<sup>${n}</sup>`), answer: [-3,-1,0,2,4].map(n=>`10<sup>${n}</sup>`),
        explanation:'10<sup>-3</sup> &lt; 10<sup>-1</sup> &lt; 10<sup>0</sup> &lt; 10<sup>2</sup> &lt; 10<sup>4</sup>' });
    return qs;
}

// MODULE 3 — Opérations
// ═══════════════════════════════════════════════════════════════
function generateTraining3() {
    const qs = [];

    for (let i = 0; i < 4; i++) {
        const a = rnd(1,6), b = rnd(1,6);
        qs.push({ type:'input_exp',
            question:`Calcule : 10<sup>${a}</sup> × 10<sup>${b}</sup> = 10<sup>?</sup>`,
            answer: a+b,
            explanation:`10<sup>${a}</sup> × 10<sup>${b}</sup> = 10<sup>${a}+${b}</sup> = 10<sup>${a+b}</sup><br>On additionne les exposants.` });
    }

    for (let i = 0; i < 3; i++) {
        const b = rnd(1,4), a = rnd(b+1, b+5);
        qs.push({ type:'input_exp',
            question:`Calcule : ${frac('10<sup>'+a+'</sup>','10<sup>'+b+'</sup>')} = 10<sup>?</sup>`,
            answer: a-b,
            explanation:`${frac('10<sup>'+a+'</sup>','10<sup>'+b+'</sup>')} = 10<sup>${a}−${b}</sup> = 10<sup>${a-b}</sup><br>On soustrait les exposants.` });
    }

    for (let i = 0; i < 3; i++) {
        const a = rnd(3,7), b = -rnd(1,4);
        qs.push({ type:'input_exp',
            question:`Calcule : 10<sup>${a}</sup> × 10<sup>${b}</sup> = 10<sup>?</sup>`,
            answer: a+b,
            explanation:`10<sup>${a}</sup> × 10<sup>${b}</sup> = 10<sup>${a}+(${b})</sup> = 10<sup>${a+b}</sup><br>On additionne les exposants.` });
    }

    const qa = rnd(2,5), qb = rnd(1,3);
    qs.push({ type:'qcm', question:`Que vaut 10<sup>${qa}</sup> × 10<sup>${qb}</sup> ?`,
        options:[`10<sup>${qa+qb}</sup>`,`10<sup>${qa*qb}</sup>`,`10<sup>${qa-qb}</sup>`,`${qa+qb}`],
        answer:0, explanation:`10<sup>${qa}</sup> × 10<sup>${qb}</sup> = 10<sup>${qa+qb}</sup> (on additionne les exposants).` });
    qs.push({ type:'qcm', question:`Que vaut 10<sup>-3</sup> ?`,
        options:['0,001','0,01','0,1','-1 000'], answer:0,
        explanation:`10<sup>-3</sup> = ${frac('1','1 000')} = 0,001` });

    for (let i = 0; i < 2; i++) {
        const a = rnd(2,8);
        qs.push({ type:'input_exp',
            question:`Calcule : ${frac('1','10<sup>'+a+'</sup>')} = 10<sup>?</sup>`,
            answer: -a,
            explanation:`${frac('1','10<sup>'+a+'</sup>')} = 10<sup>-${a}</sup><br>L'inverse change le signe de l'exposant.` });
    }

    const expOrd = shuffle([-3,-1,0,2,4]);
    qs.push({ type:'order', question:'Place ces puissances dans l\'ordre croissant :',
        items: expOrd.map(n=>`10<sup>${n}</sup>`), answer: [-3,-1,0,2,4].map(n=>`10<sup>${n}</sup>`),
        explanation:'10<sup>-3</sup> &lt; 10<sup>-1</sup> &lt; 10<sup>0</sup> &lt; 10<sup>2</sup> &lt; 10<sup>4</sup>' });

    const ppPool = shuffle([
        { a:-2, b:3  },
        { a:3,  b:-2 },
        { a:-4, b:2  },
        { a:2,  b:-3 },
        { a:-3, b:-2 },
        { a:4,  b:-2 },
        { a:-2, b:-3 },
        { a:5,  b:2  },
        { a:-3, b:4  },
    ]);
    for (let i = 0; i < 2; i++) {
        const { a, b } = ppPool[i];
        const res = a * b;
        const bDisplay = b < 0 ? `(${b})` : `${b}`;
        qs.push({ type:'input_exp',
            question:`Calcule : (10<sup>${a}</sup>)<sup>${b}</sup> = 10<sup>?</sup>`,
            answer: res,
            explanation:`(10<sup>${a}</sup>)<sup>${b}</sup> = 10<sup>${a}×${bDisplay}</sup> = 10<sup>${res}</sup><br>On multiplie les exposants.` });
    }

    for (let i = 0; i < 3; i++) {
        const a = rnd(2,5), b = -rnd(1,3), c = rnd(1,3), d = -rnd(1,2);
        const res = a+b-c-d;
        qs.push({ type:'input_exp',
            question:`Calcule : ${frac('10<sup>'+a+'</sup> × 10<sup>'+b+'</sup>','10<sup>'+c+'</sup> × 10<sup>'+d+'</sup>')} = 10<sup>?</sup>`,
            answer: res,
            explanation:`Numérateur : 10<sup>${a}</sup> × 10<sup>${b}</sup> = 10<sup>${a+b}</sup><br>
                         Dénominateur : 10<sup>${c}</sup> × 10<sup>${d}</sup> = 10<sup>${c+d}</sup><br>
                         ${frac('10<sup>'+(a+b)+'</sup>','10<sup>'+(c+d)+'</sup>')} = 10<sup>${a+b}−(${c+d})</sup> = 10<sup>${res}</sup>` });
    }

    return qs;
}

    const prodData = shuffle([
        { text:'3 × 10<sup>4</sup> × 2 × 10<sup>3</sup>',     ra:6, rn:7, expl:'3×2=6 ; 10<sup>4</sup>×10<sup>3</sup>=10<sup>7</sup>' },
        { text:'4 × 10<sup>5</sup> × 2,5 × 10<sup>2</sup>',   ra:1, rn:8, expl:'4×2,5=10=1×10<sup>1</sup> ; 10<sup>5</sup>×10<sup>2</sup>=10<sup>7</sup> ; total 1×10<sup>8</sup>' },
        { text:'6 × 10<sup>3</sup> × 5 × 10<sup>-2</sup>',    ra:3, rn:2, expl:'6×5=30=3×10 ; 10<sup>3</sup>×10<sup>-2</sup>=10<sup>1</sup> ; total 3×10<sup>2</sup>' },
        { text:'2 × 10<sup>6</sup> × 4 × 10<sup>-3</sup>',    ra:8, rn:3, expl:'2×4=8 ; 10<sup>6</sup>×10<sup>-3</sup>=10<sup>3</sup>' }
    ]);
    for (let i = 0; i < 3; i++) {
        const d = prodData[i];
        qs.push({ type:'scientific',
            question:`Calcule et donne le résultat en écriture scientifique : ${d.text} =`,
            answerA:d.ra, answerN:d.rn,
            explanation:`${d.text} = ${d.ra} × 10<sup>${d.rn}</sup><br>${d.expl}` });
    }

    const divData = shuffle([
        { num:'8 × 10<sup>6</sup>',  den:'4 × 10<sup>2</sup>',  ra:2, rn:4,  expl:'8÷4=2 ; 10<sup>6</sup>÷10<sup>2</sup>=10<sup>4</sup>' },
        { num:'9 × 10<sup>-2</sup>', den:'3 × 10<sup>3</sup>',  ra:3, rn:-5, expl:'9÷3=3 ; 10<sup>-2</sup>÷10<sup>3</sup>=10<sup>-5</sup>' },
        { num:'6 × 10<sup>5</sup>',  den:'2 × 10<sup>-3</sup>', ra:3, rn:8,  expl:'6÷2=3 ; 10<sup>5</sup>÷10<sup>-3</sup>=10<sup>5-(-3)</sup>=10<sup>8</sup>' }
    ]);
    for (let i = 0; i < 2; i++) {
        const d = divData[i];
        qs.push({ type:'scientific',
            question:`Calcule et donne le résultat en écriture scientifique : ${frac(d.num, d.den)} =`,
            answerA:d.ra, answerN:d.rn,
            explanation:`${frac(d.num, d.den)} = ${d.ra} × 10<sup>${d.rn}</sup><br>${d.expl}` });
    }

    qs.push({ type:'qcm', question:`Que vaut (10<sup>3</sup>)<sup>-2</sup> ?`,
        options:['10<sup>-6</sup>','10<sup>-5</sup>','10<sup>6</sup>','10<sup>1</sup>'], answer:0,
        explanation:'(10<sup>3</sup>)<sup>-2</sup> = 10<sup>3×(-2)</sup> = 10<sup>-6</sup>' });
    qs.push({ type:'qcm', question:`Quelle expression est égale à 10<sup>-5</sup> ?`,
        options:[`${frac('10<sup>2</sup>','10<sup>7</sup>')}`,`${frac('10<sup>3</sup>','10<sup>-2</sup>')}`,
                 `10<sup>-3</sup> × 10<sup>-3</sup>`,'(10<sup>-1</sup>)<sup>4</sup>'],
        answer:0,
        explanation:`${frac('10<sup>2</sup>','10<sup>7</sup>')} = 10<sup>2-7</sup> = 10<sup>-5</sup> ✓<br>Les autres donnent 10<sup>5</sup>, 10<sup>-6</sup>, 10<sup>-4</sup>.` });

    const hardOrder = [
        { display:'5 × 10<sup>3</sup>', value:5000 },
        { display:'(10<sup>2</sup>)<sup>3</sup>', value:1000000 },
        { display:'10<sup>-1</sup>', value:0.1 },
        { display:'2,5 × 10<sup>4</sup>', value:25000 }
    ];
    const hardOrderSh = shuffle([...hardOrder]);
    const hardOrderSorted = [...hardOrder].sort((a,b) => a.value - b.value);
    qs.push({ type:'order', question:'Range ces expressions dans l\'ordre croissant (calcule d\'abord chacune) :',
        items: hardOrderSh.map(n=>n.display), answer: hardOrderSorted.map(n=>n.display),
        explanation:`10<sup>-1</sup>=0,1 ; 5×10<sup>3</sup>=5 000 ; 2,5×10<sup>4</sup>=25 000 ; (10<sup>2</sup>)<sup>3</sup>=10<sup>6</sup>=1 000 000` });

    qs.push({ type:'scientific', question:'Écris le résultat de 1,5 × 10<sup>3</sup> × 10<sup>2</sup> en écriture scientifique :',
        answerA:1.5, answerN:5, explanation:'1,5 × 10<sup>3</sup> × 10<sup>2</sup> = 1,5 × 10<sup>5</sup>' });
    qs.push({ type:'scientific', question:`Écris le résultat de ${frac('3,6 × 10<sup>7</sup>','10<sup>3</sup>')} en écriture scientifique :`,
        answerA:3.6, answerN:4, explanation:`${frac('3,6 × 10<sup>7</sup>','10<sup>3</sup>')} = 3,6 × 10<sup>7-3</sup> = 3,6 × 10<sup>4</sup>` });

    for (let i = 0; i < 2; i++) {
        const a = rnd(2,4), b = rnd(2,3), c = -rnd(1,3), d = rnd(1,3), e = -rnd(1,2);
        const res = a*b+c-d-e;
        qs.push({ type:'input_exp',
            question:`Calcule : ${frac('(10<sup>'+a+'</sup>)<sup>'+b+'</sup> × 10<sup>'+c+'</sup>','10<sup>'+d+'</sup> × 10<sup>'+e+'</sup>')} = 10<sup>?</sup>`,
            answer: res,
            explanation:`Numérateur : 10<sup>${a*b}</sup> × 10<sup>${c}</sup> = 10<sup>${a*b+c}</sup><br>
                         Dénominateur : 10<sup>${d}</sup> × 10<sup>${e}</sup> = 10<sup>${d+e}</sup><br>
                         Résultat : 10<sup>${a*b+c}−(${d+e})</sup> = 10<sup>${res}</sup>` });
    }

    qs.push({ type:'qcm',
        question:`2,4 × 10<sup>5</sup> × 5 × 10<sup>3</sup> est égal en écriture scientifique à :`,
        options:['1,2 × 10<sup>9</sup>','1,2 × 10<sup>8</sup>','12 × 10<sup>8</sup>','1,2 × 10<sup>15</sup>'],
        answer:0,
        explanation:'2,4×5=12=1,2×10 ; 10<sup>5</sup>×10<sup>3</sup>=10<sup>8</sup> ; total : 1,2×10×10<sup>8</sup>=1,2×10<sup>9</sup>' });
    qs.push({ type:'qcm',
        question:`${frac('6 × 10<sup>8</sup>','3 × 10<sup>-2</sup>')} est égal à :`,
        options:['2 × 10<sup>10</sup>','2 × 10<sup>6</sup>','2 × 10<sup>-10</sup>','18 × 10<sup>6</sup>'],
        answer:0,
        explanation:`6÷3=2 ; ${frac('10<sup>8</sup>','10<sup>-2</sup>')}=10<sup>8-(-2)</sup>=10<sup>10</sup><br>Résultat : 2×10<sup>10</sup>` });
    qs.push({ type:'qcm',
        question:`Quel est l'ordre de grandeur (puissance de 10 la plus proche) de 3,7 × 10<sup>5</sup> + 2 × 10<sup>4</sup> ?`,
        options:['10<sup>5</sup>','10<sup>4</sup>','10<sup>6</sup>','10<sup>9</sup>'], answer:0,
        explanation:'3,7×10<sup>5</sup>=370 000 domine 2×10<sup>4</sup>=20 000.<br>La somme ≈ 390 000 → ordre de grandeur 10<sup>5</sup>.' });

    return qs;
}

// ─── Init ───────────────────────────────────────────────────────
ouvrirAncre();   // page donnée par l'adresse (accueil par défaut)

// ─── Helpers ────────────────────────────────────────────────────
function rnd(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}
