<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 4 : projections sur des axes — Forces et mouvement : lois de Newton</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="../../bilan-forces/modules/bf.css">
<link rel="stylesheet" href="ln.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="ln.js"></script>
<script src="../../bilan-forces/modules/bf.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 4 · COURS 5 / 5</span>
    <h2 class="er-titre">Projections sur des axes</h2>
    <p class="er-contexte">Pour calculer avec des vecteurs, on les <b>projette sur des axes</b> : F<sub>x</sub> = F cos α, F<sub>y</sub> = F sin α. Sur un plan incliné, on choisit l'axe le long de la pente.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Coordonnées d'un vecteur : F_x = F cos α, F_y = F sin α (α : angle
      avec l'axe Ox). Exemple : F = 10 N, α = 30°.
   2. Plan incliné (axe x le long de la pente, vers le bas) : P_x = P sin α,
      P_y = −P cos α ; sans frottements, la deuxième loi projetée sur x
      donne a = g sin α (skieur, α = 20° : a = 3,36 m·s⁻²). Même idée
      pour le parapente (exercice 20 : axe le long de la trajectoire).
   Valeurs vérifiées par un script.
   ============================================================ */
const { hasard, exemple } = COURS;
const { V, SFX, CALC, fl, nom, svg, txt } = LN;
const { fmt, cs, COUL } = BF;
const MS2 = 'm·s<sup>−2</sup>';
const rad = d => d * Math.PI / 180;

/* ---------- figures ---------- */
// vecteur F⃗ faisant l'angle α avec l'axe Ox, ses deux projections en pointillés
const AXES = (() => {
  const O = [50, 150], L = 170, a = rad(32), X = O[0] + L * Math.cos(a), Y = O[1] - L * Math.sin(a);
  return svg(320, 180, fl(O[0], O[1], 300, O[1], '#16181d', { ep: 1.6, lt: 9 }) + fl(O[0], O[1], O[0], 12, '#16181d', { ep: 1.6, lt: 9 }) + txt(302, O[1] + 16, 'x', { g: 800, c: '#16181d', t: 13 }) + txt(O[0] - 16, 20, 'y', { g: 800, c: '#16181d', t: 13 }) + txt(O[0] - 14, O[1] + 14, 'O', { t: 12 }) +
    `<line x1="${X}" y1="${Y}" x2="${X}" y2="${O[1]}" stroke="#8d8f94" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="${X}" y1="${Y}" x2="${O[0]}" y2="${Y}" stroke="#8d8f94" stroke-width="1.4" stroke-dasharray="5 4"/>` +
    fl(O[0], O[1], X, Y, COUL.F, { ep: 2.8 }) + nom(X - 6, Y - 12, 'F', '', COUL.F) +
    `<path d="M${O[0] + 46},${O[1]} A46,46 0 0 0 ${O[0] + 46 * Math.cos(a)},${O[1] - 46 * Math.sin(a)}" fill="none" stroke="#5a3fc4" stroke-width="1.6"/>` + txt(O[0] + 54, O[1] - 10, 'α', { g: 800, c: '#5a3fc4', t: 14 }) +
    txt(X, O[1] + 16, 'F<tspan baseline-shift="sub" font-size="9">x</tspan> = F cos α', { a: 'middle', t: 12, c: '#16181d' }) +
    txt(O[0] + 6, Y - 6, 'F<tspan baseline-shift="sub" font-size="9">y</tspan> = F sin α', { t: 12, c: '#16181d' }),
  'Un vecteur F faisant un angle alpha avec l\'axe x : sa projection sur x vaut F cos alpha, sa projection sur y vaut F sin alpha');
})();
// plan incliné : axe x vers le bas de la pente, poids et ses deux composantes, réaction perpendiculaire
const PLAN = (() => {
  const a = rad(24), A = [24, 40], B = [306, 40 + 282 * Math.tan(a)], G = [150, 40 + 126 * Math.tan(a) - 22];
  const ux = [Math.cos(a), Math.sin(a)], uy = [Math.sin(a), -Math.cos(a)], L = 74;
  const Px = [G[0] + L * Math.sin(a) * ux[0], G[1] + L * Math.sin(a) * ux[1]], Pb = [G[0], G[1] + L];
  return svg(330, 200, `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#16181d" stroke-width="2"/><line x1="${B[0] - 120}" y1="${B[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#8d8f94" stroke-width="1.2"/>` +
    `<path d="M${B[0] - 44},${B[1]} A44,44 0 0 1 ${B[0] - 44 * Math.cos(a)},${B[1] - 44 * Math.sin(a)}" fill="none" stroke="#5a3fc4" stroke-width="1.5"/>` + txt(B[0] - 64, B[1] - 6, 'α', { g: 800, c: '#5a3fc4', t: 13 }) +
    `<g transform="translate(${G[0]},${G[1]}) rotate(${(a * 180 / Math.PI).toFixed(1)})"><rect x="-22" y="-17" width="44" height="34" rx="5" fill="#ebe7f8" stroke="#5a3fc4" stroke-width="2"/></g>` +
    fl(G[0], G[1], G[0] + 95 * ux[0], G[1] + 95 * ux[1], '#16181d', { ep: 1.4, lt: 8, tirets: false }) + txt(G[0] + 100 * ux[0], G[1] + 100 * ux[1] + 4, 'x', { g: 800, c: '#16181d', t: 13 }) +
    fl(G[0], G[1], G[0] + 70 * uy[0], G[1] + 70 * uy[1], '#16181d', { ep: 1.4, lt: 8 }) + txt(G[0] + 74 * uy[0] + 4, G[1] + 74 * uy[1], 'y', { g: 800, c: '#16181d', t: 13 }) +
    `<line x1="${Pb[0]}" y1="${Pb[1]}" x2="${Px[0]}" y2="${Px[1]}" stroke="#8d8f94" stroke-width="1.3" stroke-dasharray="5 4"/>` +
    fl(G[0], G[1], Px[0], Px[1], COUL.P, { ep: 2, tirets: true, lt: 8 }) + txt(Px[0] + 4, Px[1] - 4, 'P sin α', { t: 11, c: COUL.P, g: 800 }) +
    fl(G[0], G[1], Pb[0], Pb[1], COUL.P, { ep: 2.8 }) + nom(G[0] - 14, Pb[1] - 4, 'P', '', COUL.P) +
    fl(G[0], G[1], G[0] + 58 * uy[0], G[1] + 58 * uy[1], COUL.RN, { ep: 2.8 }) + nom(G[0] + 58 * uy[0] - 18, G[1] + 58 * uy[1] + 6, 'R', 'N', COUL.RN) +
    `<circle cx="${G[0]}" cy="${G[1]}" r="3" fill="#16181d"/>`,
  'Plan incliné d\'un angle alpha : axe x le long de la pente vers le bas, axe y perpendiculaire ; le poids a une composante P sin alpha le long de la pente, la réaction est perpendiculaire à la pente');
})();

/* ---------- 1. Coordonnées d'un vecteur ---------- */
const VECTEURS = [[10, 30], [20, 60], [5.0, 45], [12, 20], [8.0, 50]];
function etape1(c_) {
  const carte = c_.carte('1. Coordonnées d\'un vecteur');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Projections.</b> Un vecteur ${V('F')} de valeur F fait l'angle α avec l'axe Ox :</p>
        <p class="crs-formule">F<sub>x</sub> = F × cos α &nbsp;&nbsp; F<sub>y</sub> = F × sin α</p>
        <p>Une coordonnée est négative si la projection est dans le sens opposé à l'axe.</p></div>
      ${AXES}
    </div>
    ${exemple(`<p>${V('F')} de valeur F = 10 N fait un angle α = 30° avec l'axe Ox :</p>
      <p class="crs-calc">F<sub>x</sub> = 10 × cos 30° = <span class="c">8,7 N</span> ; F<sub>y</sub> = 10 × sin 30° = <span class="c">5,0 N</span></p>`)}`);
  const v = hasard(VECTEURS.slice(1)), Fx = v[0] * Math.cos(rad(v[1])), Fy = v[0] * Math.sin(rad(v[1]));
  c_.aToi(carte, [{ titre: 'Projeter un vecteur', enonce: `<p>Une force ${V('F')} de valeur F = ${fmt(v[0])} N fait un angle α = ${v[1]}° avec l'axe Ox (vers le haut et la droite).</p>`,
    parties: [
      { type: 'nombre', q: 'a) Calcule sa coordonnée sur l\'axe Ox (2 ou 3 chiffres significatifs).', label: 'F<sub>x</sub> =', valeur: Fx, affiche: cs(Fx, 3), rel: .015, unite: 'N' + CALC,
        diag: x => (Math.abs(x - Fy) < .02 * Fy ? 'Tu as pris le sinus : sur l\'axe de l\'angle, c\'est le <b>cosinus</b>.' : 'F<sub>x</sub> = F × cos α (calculatrice en degrés).'), solution: `<p class="crs-calc">F<sub>x</sub> = ${fmt(v[0])} × cos ${v[1]}° = <span class="c">${cs(Fx, 3)} N</span></p>` },
      { type: 'nombre', q: 'b) Calcule sa coordonnée sur l\'axe Oy.', label: 'F<sub>y</sub> =', valeur: Fy, affiche: cs(Fy, 3), rel: .015, unite: 'N' + CALC,
        diag: x => (Math.abs(x - Fx) < .02 * Fx ? 'Sur l\'axe Oy, c\'est le <b>sinus</b> de l\'angle avec Ox.' : 'F<sub>y</sub> = F × sin α.'), solution: `<p class="crs-calc">F<sub>y</sub> = ${fmt(v[0])} × sin ${v[1]}° = <span class="c">${cs(Fy, 3)} N</span></p>` }] }]);
  return carte;
}

/* ---------- 2. Sur un plan incliné ---------- */
const PENTES = [[60, 15], [75, 25], [50, 10], [80, 30]];
function etape2(c_) {
  const carte = c_.carte('2. Sur un plan incliné');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Axe le long de la pente.</b> On choisit l'axe x le long de la pente (vers le bas) et l'axe y perpendiculaire. Pour une pente d'angle α :</p>
        <p class="crs-formule">P<sub>x</sub> = P × sin α &nbsp;&nbsp; P<sub>y</sub> = −P × cos α</p>
        <p>La réaction ${V('R', 'N')} est perpendiculaire à la pente : R<sub>N,x</sub> = 0.</p></div>
      ${PLAN}
    </div>
    ${exemple(`<p>Un skieur descend une piste rectiligne d'angle α = 20°, sans frottements (référentiel terrestre supposé galiléen). D'après la deuxième loi de Newton, ${SFX} = ${V('P')} + ${V('R', 'N')} = m ${V('a')}. En projection sur l'axe x :</p>
      <p class="crs-calc">m × g × sin α + 0 = m × a<sub>x</sub> ⟺ a<sub>x</sub> = g × sin α = 9,81 × sin 20° = <span class="c">3,36 ${MS2}</span></p>
      <p>L'accélération ne dépend pas de la masse. Même idée pour le parapente de l'exercice 20 : on projette sur l'axe de la trajectoire.</p>`)}`);
  const p = hasard(PENTES), P = p[0] * 9.81, Px = P * Math.sin(rad(p[1])), a = 9.81 * Math.sin(rad(p[1]));
  c_.aToi(carte, [{ titre: 'Une luge sur une pente', enonce: `<p>Une luge et son passager (m = ${p[0]} kg) descendent une pente rectiligne d'angle α = ${p[1]}°, sans frottements ; g = 9,81 N·kg<sup>−1</sup>. Axe x le long de la pente, vers le bas.</p>`,
    parties: [
      { type: 'nombre', q: 'a) Calcule la coordonnée P<sub>x</sub> du poids.', label: 'P<sub>x</sub> =', valeur: Px, affiche: cs(Px, 3), rel: .015, unite: 'N' + CALC,
        diag: x => (Math.abs(x - P * Math.cos(rad(p[1]))) < .02 * P ? 'Le long de la pente, c\'est P × <b>sin</b> α (l\'angle α est entre le poids et l\'axe y).' : Math.abs(x - P) < .01 * P ? 'Seule une partie du poids est le long de la pente : P<sub>x</sub> = P × sin α.' : 'P<sub>x</sub> = m × g × sin α.'),
        solution: `<p class="crs-calc">P<sub>x</sub> = m × g × sin α = ${p[0]} × 9,81 × sin ${p[1]}° = <span class="c">${cs(Px, 3)} N</span></p>` },
      { type: 'nombre', q: 'b) Déduis-en l\'accélération de la luge (deuxième loi de Newton projetée sur x).', label: 'a<sub>x</sub> =', valeur: a, affiche: cs(a, 3), rel: .015, unite: MS2 + CALC,
        diag: x => (Math.abs(x - Px) < .01 * Px ? 'Divise par la masse : a<sub>x</sub> = P<sub>x</sub> / m.' : 'm × a<sub>x</sub> = m × g × sin α, donc a<sub>x</sub> = g × sin α.'),
        solution: `<p class="crs-calc">a<sub>x</sub> = g × sin α = 9,81 × sin ${p[1]}° = <span class="c">${cs(a, 3)} ${MS2}</span></p>` }] }]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>F<sub>x</sub> = F cos α, F<sub>y</sub> = F sin α (α : angle avec Ox). Plan incliné, axe x le long de la pente : P<sub>x</sub> = P sin α ; sans frottements, a = g sin α.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_4_simulation.html">Atelier : somme des forces et accélération →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_4_questions.html">Questions</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_4.html#projections">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
BF.menu('module_4e_cours');
</script>
</body>
</html>
