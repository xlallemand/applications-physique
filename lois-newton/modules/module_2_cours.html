<!DOCTYPE html>

<meta charset="UTF-8">

<title>Module 2 : troisième loi et référentiel galiléen — Forces et mouvement : lois de Newton</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="../../bilan-forces/modules/bf.css">

</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS</span>
    <h2 class="er-titre">Troisième loi et référentiel galiléen</h2>
    <p class="er-contexte">Deux objets en interaction exercent l'un sur l'autre des forces <b>opposées</b> : c'est la <b>troisième loi de Newton</b>. Puis le <b>référentiel galiléen</b>, celui dans lequel les lois de Newton s'appliquent.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Troisième loi (actions réciproques) : F⃗A/B = −F⃗B/A ; personne
      qui pousse un mur, Terre et Lune (LN.mur, LN.terreLune).
      « À toi » : la main pousse une porte (figPaire, figBilanPorte).
   2. Référentiel galiléen : principe d'inertie vérifié ; héliocentrique,
      géocentrique (quelques jours), terrestre (quelques minutes) ; un
      référentiel qui tourne, ralentit ou accélère n'est pas galiléen.
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { V, mur, terreLune, fl, nom, svg, txt, ENCRE, ENCRE2, ENCRE3 } = LN;
const o = (id, label) => ({ id, label });
const FAB = V('F', 'A/B'), FBA = V('F', 'B/A');

/* ---------- 1. Troisième loi de Newton ---------- */
const PAIRES = [
  ['La Terre attire une pomme avec une force de valeur', 'N', 1.5, 'Quelle est la valeur de la force exercée par la pomme sur la Terre ?', 'F<sub>pomme/Terre</sub>'],
  ['Un aimant attire un clou avec une force de valeur', 'N', 0.40, 'Quelle est la valeur de la force exercée par le clou sur l\'aimant ?', 'F<sub>clou/aimant</sub>'],
  ['Un nageur pousse le mur de la piscine avec une force de valeur', 'N', 350, 'Quelle est la valeur de la force exercée par le mur sur le nageur ?', 'F<sub>mur/nageur</sub>'],
];
/* ---------- La main pousse une porte (« À toi » 3) ---------- */
const C_MAIN = '#c2255c', C_PORTE = '#1971c2', C_P = '#2f9e44', C_R = '#e8590c';
// bras tendu (avec sa manche) qui arrive au point de contact (xc, yc) : paume à plat sur la porte, doigts vers le haut
const PEAU = '#f6dccb';
const bras = (xc, yc) => `<path d="M40,${yc - 6} L${xc - 46},${yc + 2} L${xc - 46},${yc + 18} L40,${yc + 12} Z" fill="#cfd8e6" stroke="${ENCRE}" stroke-width="1.5" stroke-linejoin="round"/>` +
  `<path d="M${xc - 46},${yc + 3} L${xc - 16},${yc + 6} L${xc - 16},${yc + 16} L${xc - 46},${yc + 17} Z" fill="${PEAU}" stroke="${ENCRE}" stroke-width="1.5" stroke-linejoin="round"/>` +
  // paume contre la porte, quatre doigts vers le haut, pouce vers l'arrière
  `<path d="M${xc - 17},${yc + 17} L${xc - 17},${yc - 6} Q${xc - 17},${yc - 10} ${xc - 13},${yc - 11} L${xc - 12},${yc - 28} Q${xc - 12},${yc - 32} ${xc - 8},${yc - 32} L${xc - 3},${yc - 32} Q${xc},${yc - 32} ${xc},${yc - 28} L${xc},${yc + 14} Q${xc},${yc + 18} ${xc - 4},${yc + 18} Z" fill="${PEAU}" stroke="${ENCRE}" stroke-width="1.5" stroke-linejoin="round"/>` +
  `<path d="M${xc - 17},${yc - 2} Q${xc - 27},${yc - 8} ${xc - 26},${yc - 14} Q${xc - 24},${yc - 18} ${xc - 18},${yc - 12}" fill="${PEAU}" stroke="${ENCRE}" stroke-width="1.5" stroke-linejoin="round"/>` +
  `<path d="M${xc - 11},${yc - 24} L${xc - 11},${yc - 14} M${xc - 6},${yc - 26} L${xc - 6},${yc - 14}" stroke="${ENCRE3}" stroke-width="1" stroke-linecap="round"/>`;
// porte vue de profil (panneau vertical)
const porte = x => `<rect x="${x}" y="22" width="12" height="150" fill="#e9d8b8" stroke="${ENCRE2}" stroke-width="1.5"/>`;
// contour en tirets d'un système
const contourPorte = x => `<rect x="${x - 4}" y="14" width="20" height="166" rx="6" fill="none" stroke="${C_PORTE}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
const sol = `<line x1="20" y1="172" x2="300" y2="172" stroke="${ENCRE}" stroke-width="2"/>`;
// figure 1 : la paire de forces réciproques, sur deux systèmes différents
function figPaire() {
  const xc = 200, yc = 110;
  let s = sol + porte(xc) + bras(xc, yc) + contourPorte(xc);
  s += `<ellipse cx="${xc - 10}" cy="${yc - 6}" rx="20" ry="30" fill="none" stroke="${C_MAIN}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  s += fl(xc, yc, xc + 70, yc, C_PORTE, { ep: 3 }) + nom(xc + 64, yc - 14, 'F', 'main/porte', C_PORTE, { t: 14 });
  s += fl(xc, yc, xc - 70, yc, C_MAIN, { ep: 3 }) + nom(xc - 50, yc + 34, 'F', 'porte/main', C_MAIN, { t: 14 });
  s += txt(xc + 6, 194, 'système : la porte', { a: 'middle', c: C_PORTE }) + txt(xc - 78, 76, 'système : la main', { a: 'middle', c: C_MAIN });
  return svg(320, 200, s, 'La force de la main sur la porte s\'exerce sur la porte ; la force de la porte sur la main s\'exerce sur la main : même valeur, sens opposés, deux systèmes différents');
}
// figure 2 : bilan des forces qui s'exercent sur le seul système porte
function figBilanPorte() {
  const x = 150, xg = x + 6, yg = 97, yc = 120;
  let s = sol + porte(x) + contourPorte(x);
  s += fl(xg, yg, xg, yg + 62, C_P, { ep: 3 }) + nom(xg - 22, yg + 52, 'P', '', C_P, { t: 14 });
  s += fl(xg, yg, xg, yg - 62, C_R, { ep: 3 }) + nom(xg + 26, yg - 46, 'R', '', C_R, { t: 14 }) + txt(xg + 18, yg - 28, '(gonds)', { c: C_R, t: 11 });
  s += `<circle cx="${xg}" cy="${yg}" r="3" fill="${ENCRE}"/>` + txt(xg - 10, yg + 4, 'G', { a: 'end', t: 11 });
  s += fl(x, yc, x + 76, yc, C_PORTE, { ep: 3 }) + nom(x + 62, yc - 12, 'F', 'main/porte', C_PORTE, { t: 14 });
  s += txt(x + 6, 194, 'système : la porte', { a: 'middle', c: C_PORTE });
  return svg(320, 200, s, 'Forces qui s\'exercent sur la porte : le poids vers le bas, la force des gonds vers le haut qui le compense, et la force de la main, horizontale, que rien ne compense');
}
const SOL_PORTE = `<p><b>Les deux forces ont la même valeur</b> : c'est la troisième loi de Newton. Elle s'applique toujours, que les objets bougent ou non.</p>
  <p>On a envie de répondre « supérieure », puisque c'est la main qui fait bouger la porte. C'est faux. En physique, il faut <b>appliquer les règles</b> (bilan des forces, lois de Newton) même quand elles semblent contredire l'intuition : si on ne les respecte pas, on se trompe. Le mouvement de la porte a une <b>autre explication</b>.</p>
  <p><b>L'erreur : raisonner sur deux systèmes à la fois.</b> ${V('F', 'main/porte')} s'exerce sur la <b>porte</b> ; ${V('F', 'porte/main')} s'exerce sur la <b>main</b>. Elles agissent sur deux systèmes différents : elles ne se compensent pas, et les comparer ne dit rien du mouvement de la porte. « Les forces se compensent, donc le système est immobile ou en mouvement rectiligne uniforme » ne vaut que pour des forces qui s'exercent sur le <b>même système</b>.</p>
  ${figPaire()}
  <p><b>Le bon raisonnement : un seul système, la porte.</b> On fait le bilan des forces qui s'exercent sur elle :</p>
  <ul><li>son poids ${V('P')}, vertical, vers le bas ;</li>
    <li>la force ${V('R')} exercée par les gonds, qui compense le poids ;</li>
    <li>la force ${V('F', 'main/porte')} exercée par la main, horizontale.</li></ul>
  ${figBilanPorte()}
  <p>Aucune force ne compense ${V('F', 'main/porte')} : les forces qui s'exercent sur la porte <b>ne se compensent pas</b>. D'après le principe d'inertie (module 3), la porte ne peut donc pas rester immobile : elle se met en mouvement.</p>
  <p>${V('F', 'porte/main')} n'apparaît pas dans ce bilan : elle s'exerce sur la main, pas sur la porte.</p>`;

function etape1(c_) {
  const carte = c_.carte('1. Troisième loi de Newton : actions réciproques');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Troisième loi de Newton.</b> Si un objet A exerce sur un objet B une force ${FAB}, alors B exerce sur A une force ${FBA} telle que :</p>
        <p class="crs-formule">${FAB} = −${FBA}</p>
        <p>Les deux forces ont la <b>même direction</b>, des <b>sens opposés</b> et la <b>même valeur</b>. Elles s'appliquent sur <b>deux objets différents</b> : elles ne se compensent donc jamais.</p></div>
    </div>
    ${exemple(`<p>Une personne pousse un mur : le mur la repousse, avec une force de même valeur, de sens opposé.</p>${mur()}
      <p>La Terre attire la Lune, et la Lune attire la Terre avec une force de même valeur (2,0 × 10<sup>20</sup> N), même si la Terre est bien plus lourde.</p>${terreLune()}`)}`);
  const p = hasard(PAIRES);
  c_.aToi(carte, [
    { titre: 'Même valeur', enonce: `<p>${p[0]} ${BF.fmt(p[2])} ${p[1]}.</p>`,
      parties: [{ type: 'nombre', q: p[3], label: `${p[4]} =`, valeur: p[2], unite: p[1], signe: false, indice: 'Troisième loi : les deux forces ont la même valeur.', solution: `<p>D'après la troisième loi de Newton, les deux forces ont la même valeur : ${BF.fmt(p[2])} ${p[1]}.</p>` }] },
    { titre: 'Se compensent-elles ?', enonce: `<p>Le mur exerce sur la personne une force opposée à celle que la personne exerce sur le mur.</p>`,
      parties: [{ type: 'choix', q: 'Ces deux forces se compensent-elles ?', options: [o('non', 'non : elles s\'appliquent sur deux objets différents'), o('oui', 'oui : elles sont opposées')], bonne: 'non', melanger: false, colonne: true,
        indices: { oui: 'Des forces se compensent quand elles s\'exercent sur le <b>même</b> système. Ici, l\'une s\'exerce sur le mur, l\'autre sur la personne.' }, solution: '<p>Elles s\'appliquent sur deux objets différents (le mur et la personne) : elles ne se compensent pas.</p>' }] },
    { titre: 'Pousser une porte', enonce: `<p>On pousse une porte avec la main pour l'ouvrir.</p>`,
      parties: [{ type: 'choix', q: `La force que la main exerce sur la porte est-elle inférieure, supérieure ou égale à la force que la porte exerce sur la main ?`,
        options: [o('inf', 'inférieure'), o('sup', 'supérieure'), o('egale', 'égale')], bonne: 'egale', melanger: false,
        indices: { sup: 'C\'est l\'intuition : « la main fait bouger la porte, donc elle pousse plus fort ». Que dit la troisième loi de Newton sur les valeurs des deux forces ?',
          inf: 'Que dit la troisième loi de Newton sur les valeurs des deux forces ?' },
        solution: SOL_PORTE }] },
  ]);
  return carte;
}

/* ---------- 2. Référentiel galiléen ---------- */
const ETUDES = [
  ['la chute d\'une bille pendant 1 s', 'terrestre', 'L\'étude dure moins de quelques minutes : le référentiel terrestre peut être considéré comme galiléen.'],
  ['le mouvement de la Lune autour de la Terre pendant une journée', 'geocentrique', 'Mouvement autour de la Terre, sur moins de quelques jours : référentiel géocentrique.'],
  ['le mouvement de Mars autour du Soleil pendant un an', 'helio', 'Mouvement autour du Soleil, sur une longue durée : référentiel héliocentrique.'],
  ['le démarrage d\'une voiture pendant 10 s', 'terrestre', 'L\'étude dure moins de quelques minutes : le référentiel terrestre peut être considéré comme galiléen.'],
];
const OPTS_REF = [o('terrestre', 'terrestre'), o('geocentrique', 'géocentrique'), o('helio', 'héliocentrique')];
const NON_GAL = [
  ['le référentiel d\'un manège qui tourne', 'non', 'Il tourne par rapport au référentiel terrestre : il n\'est pas galiléen.'],
  ['le référentiel d\'un train qui freine', 'non', 'Il ralentit par rapport au référentiel terrestre : il n\'est pas galiléen.'],
  ['le référentiel d\'un train qui roule en ligne droite à vitesse constante', 'oui', 'Il est en translation rectiligne uniforme par rapport au référentiel terrestre : il est galiléen (pour une étude courte).'],
  ['le référentiel d\'un ascenseur qui démarre', 'non', 'Il accélère par rapport au référentiel terrestre : il n\'est pas galiléen.'],
];
function etape2(c_) {
  const carte = c_.carte('2. Le référentiel galiléen');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Référentiel galiléen.</b> C'est un référentiel dans lequel le <b>principe d'inertie</b> est vérifié (module 3). Un référentiel qui <b>tourne</b>, <b>ralentit</b> ou <b>accélère</b> par rapport à un référentiel galiléen n'est pas galiléen.</p></div>
      <div class="crs-defile"><table class="crs-tab ln-tab-ref">
        <thead><tr><th>Référentiel</th><th>Galiléen…</th></tr></thead>
        <tbody><tr><td>héliocentrique (centre du Soleil, trois étoiles lointaines)</td><td>oui</td></tr>
          <tr><td>géocentrique (centre de la Terre, trois étoiles lointaines)</td><td>si l'étude ne dépasse pas quelques jours</td></tr>
          <tr><td>terrestre (le sol, le laboratoire)</td><td>si l'étude ne dépasse pas quelques minutes</td></tr></tbody>
      </table></div>
    </div>
    ${exemple('<p>Une balle est posée sur la tablette d\'un train arrêté : elle reste immobile. Quand le train démarre, elle roule vers l\'arrière alors que les forces qui s\'exercent sur elle (poids, réaction de la tablette) n\'ont pas changé : dans le référentiel du train qui accélère, le principe d\'inertie n\'est plus vérifié. Ce référentiel n\'est pas galiléen.</p>')}`);
  const e = hasard(ETUDES), n = hasard(NON_GAL);
  c_.aToi(carte, [
    { titre: 'Quel référentiel ?', enonce: `<p>On étudie ${e[0]}.</p>`,
      parties: [{ type: 'choix', q: 'Quel référentiel galiléen choisir ?', options: OPTS_REF, bonne: e[1], melanger: false, indice: 'Autour de quoi a lieu le mouvement, et combien de temps dure l\'étude ?', solution: `<p>${e[2]}</p>` }] },
    { titre: 'Galiléen ou non ?', enonce: `<p>On considère ${n[0]}.</p>`,
      parties: [{ type: 'choix', q: 'Ce référentiel est-il galiléen ?', options: [o('oui', 'oui'), o('non', 'non')], bonne: n[1], melanger: false, indice: 'Tourne-t-il, ralentit-il ou accélère-t-il par rapport au référentiel terrestre ?', solution: `<p>${n[2]}</p>` }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p><b>Troisième loi</b> : ${FAB} = −${FBA} (même direction, sens opposés, même valeur, sur deux objets différents).</p></div>
    <div class="cle"><p><b>Référentiel galiléen</b> : le principe d'inertie y est vérifié. Héliocentrique ; géocentrique (quelques jours) ; terrestre (quelques minutes). Un référentiel qui tourne, ralentit ou accélère n'est pas galiléen.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2_questions.html">Questions →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_3a_cours.html">Module 3 : principe d'inertie →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
BF.menu('module_2_cours');
</script>
</body>
