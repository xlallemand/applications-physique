<!DOCTYPE html>
<html lang="fr" data-matiere="chimie">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : fiche récapitulative — pH</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="ph.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<script src="../../assets/sommaire.js"></script>
<script src="ph.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page som-fiche" id="fiche"></div>

<script>
/* ============================================================
   Fiche récapitulative du module 2 : définition du pH,
   formule réciproque, méthodes de calcul, validité.
   ============================================================ */
const M = PH.MOINS, H3O = PH.H3O, UNITE = PH.UNITE;
document.getElementById('fiche').innerHTML = `
  <div class="er-card">
    <span class="er-badge">MODULE 2 · FICHE RÉCAPITULATIVE</span>
    <h2 class="er-titre">Définition du pH</h2>
  </div>

  <section class="er-card">
    <h3 class="cours-titre">Définition</h3>
    <div class="cle"><p>Le pH d'une solution est une grandeur <b>sans dimension</b> :</p>
      <p class="ph-formule">pH = ${M}log(${H3O} / c°)</p>
      <p><b>${H3O}</b> : concentration en <b>ions oxonium</b>, en ${UNITE} ; <b>c° = 1 ${UNITE}</b> : <b>concentration standard</b>.</p></div>
    <p>On divise par c° car on ne calcule le log que d'un nombre <b>sans unité</b> ; la valeur ne change pas.</p>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Formule réciproque</h3>
    <div class="cle"><p class="ph-formule">pH = ${M}log(${H3O} / c°) &nbsp;⇔&nbsp; ${H3O} = c° × 10<sup>${M}pH</sup></p>
      <p>On l'obtient en multipliant par (${M}1), puis en appliquant 10<sup>x</sup> aux deux membres, enfin en multipliant par c°.</p></div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Calculs</h3>
    <div class="cle"><p><b class="cle-titre">pH à partir de ${H3O}.</b> Concentration en ${UNITE} ; pH donné avec <b>une décimale</b>.</p>
      <p class="ph-calc">${H3O} = 5,0 × 10<sup>${M}3</sup> ${UNITE} : pH = ${M}log(5,0 × 10<sup>${M}3</sup>) = <span class="c">2,3</span></p></div>
    <div class="cle"><p><b class="cle-titre">${H3O} à partir du pH.</b> Écriture scientifique avec <b>deux chiffres significatifs</b>.</p>
      <p class="ph-calc">pH = 5,2 : ${H3O} = 10<sup>${M}5,2</sup> = <span class="c">6,3 × 10<sup>${M}6</sup> ${UNITE}</span></p></div>
    <p><b>Plus ${H3O} est grande, plus le pH est petit.</b> Pour une puissance de 10 : ${H3O} = 10<sup>${M}n</sup> ${UNITE} donne pH = n.</p>
    <div class="cle"><p><b class="cle-titre">Acide de concentration c.</b> Si chaque molécule d'acide libère un ion H<sub>3</sub>O<sup>+</sup> (AH + H<sub>2</sub>O → A<sup>${M}</sup> + H<sub>3</sub>O<sup>+</sup>), alors <b>${H3O} = c</b>. Contre-exemple : l'acide sulfurique H<sub>2</sub>SO<sub>4</sub> libère deux ions, ${H3O} = 2c.</p></div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Limite de validité</h3>
    <div class="cle"><p>La relation n'est <b>pas valable</b> pour des concentrations en ions H<sub>3</sub>O<sup>+</sup> trop élevées ou trop faibles. Dans les exercices, on la considère toujours valable.</p></div>
  </section>

  <div class="er-actions som-fiche-liens">
    <a class="btn-secondary" href="module_2_cours.html">Revoir le cours</a>
    <a class="btn-secondary" href="module_2_questions.html">Questions sur le pH</a>
  </div>`;
PH.menu('fiche_2');
</script>
</body>
</html>
