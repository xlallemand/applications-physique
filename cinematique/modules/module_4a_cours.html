<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 4 : le vecteur position — Cinématique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="cin.css">
<script src="vecteurs.js"></script>
<script src="cin.js"></script>
<script src="figures.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 4 · COURS 1/4</span>
    <h2 class="er-titre">Le vecteur position</h2>
    <p class="er-contexte">Trois vecteurs décrivent le mouvement d'un point : le vecteur position, le vecteur vitesse et le vecteur accélération. On commence par le vecteur position. On travaille dans un plan, dans le repère (O, <span class="vec-nom">i</span>, <span class="vec-nom">j</span>).</p>
    <p class="cin-lien-fiche"><a href="fiche_4.html">Fiche récapitulative du module 4 →</a></p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes : notion, exemple, puis exemples semblables
   faits par l'élève (« À toi »).
   ============================================================ */
const { nomHTML: N, colHTML: col, ijHTML: ij } = VEC;
const { fmt, poly } = CIN;
const M = CIN.MOINS;
const o = (id, label) => ({ id, label });
const I = N('i'), J = N('j'), K = N('k');

new CIN.Cours(document.getElementById('etapes'), [

  // ---------- 1. Le vecteur position ----------
  (cours) => {
    const c = cours.carte('1. Le vecteur position');
    cours.ajouter(c, `<div class="cours-bloc">
        <p>Dans un repère (O, ${I}, ${J}), la position d'un point M est repérée par le vecteur ${N('OM')}. Le point M est en mouvement : ses coordonnées dépendent du temps. On les note x(t) et y(t), et le vecteur position ${N('OM')}(t).</p>
        <div class="cle"><p><b class="cle-titre">Trois notations équivalentes.</b></p>
          <p class="ph-formule">M ${col('x(t)', 'y(t)')} &nbsp; ; &nbsp; ${N('OM')}(t) ${col('x(t)', 'y(t)')} &nbsp; ; &nbsp; ${N('OM')}(t) = x(t)${I} + y(t)${J}</p>
          <p>x(t) et y(t) s'expriment en <b>mètres</b> (m).</p>
          <p class="er-petit">Dans l'espace, on ajoute une troisième coordonnée z(t) et un troisième vecteur unitaire ${K}. Si le mouvement est plan, on choisit un repère à deux dimensions (par exemple pour étudier le lancer d'un objet).</p></div>
      </div>
      <div class="cours-exemple">
        <p class="cours-exemple-t">Exemple : un ballon lancé</p>
        <p>x(t) = 2t et y(t) = ${poly([-1, 4, 0])} (x et y en m, t en s), donc ${N('OM')}(t) = 2t${I} + (${poly([-1, 4, 0])})${J}. Fais varier t : le point M se déplace, ses coordonnées x(t) et y(t) changent.</p>
        <div data-x="anim"></div>
      </div>`);
    FIG.ballon(c.querySelector('[data-x="anim"]'));
    CIN.aToi(c, [
      { parties: [{ type: 'choix', q: `Parmi ces écritures, laquelle n'est pas équivalente aux autres ?`, colonne: true, options: [o('ok', `${N('OM')}(t) = x(t) + y(t)`), o('a', `M ${col('x(t)', 'y(t)')}`), o('b', `${N('OM')}(t) ${col('x(t)', 'y(t)')}`), o('c', `${N('OM')}(t) = x(t)${I} + y(t)${J}`)], bonne: 'ok',
        indice: 'Un vecteur ne peut pas être égal à un nombre.', solution: `x(t) + y(t) est un nombre, pas un vecteur : il manque ${I} et ${J}.` }] },
      { titre: `Un point M a pour coordonnées x(t) = ${poly([4, -2])} et y(t) = ${poly([1, 0, 1])} (en m).`, parties: [
        { type: 'gabarit', q: `Écris ${N('OM')}(t) avec ${I} et ${J}.`, label: `${N('OM')}(t) =`, morceaux: ['(', { v: 4 }, ' t + ', { v: -2 }, `) ${I} + (`, { v: 1 }, ' t² + ', { v: 1 }, `) ${J}`],
          indice: `${N('OM')}(t) = x(t)${I} + y(t)${J} : recopie x(t), puis y(t).`, solution: `${N('OM')}(t) = (${poly([4, -2])})${I} + (${poly([1, 0, 1])})${J}` }] },
      { titre: `Un point M a pour vecteur position ${N('OM')}(t) = 3t²${I} + (${poly([-5, 2])})${J} (en m).`, parties: [
        { type: 'choix', q: 'Ses coordonnées sont :', options: [o('ok', `x(t) = 3t² et y(t) = ${poly([-5, 2])}`), o('a', `x(t) = ${poly([-5, 2])} et y(t) = 3t²`), o('b', `x(t) = 3 et y(t) = ${M}5`), o('c', `x(t) = 3t² ${M} 5t + 2`)], bonne: 'ok', colonne: true,
          indice: `Le nombre devant ${I} est x(t), le nombre devant ${J} est y(t).`, solution: `x(t) = 3t² (devant ${I}) et y(t) = ${poly([-5, 2])} (devant ${J}).` }] },
      { parties: [{ type: 'choix', q: 'Les coordonnées x(t) et y(t) du vecteur position s\'expriment en :', options: [o('ok', 'm'), o('a', 's'), o('b', `m·s<sup>${M}1</sup>`), o('c', 'sans unité')], bonne: 'ok',
        indice: 'Ce sont des positions.', solution: 'x(t) et y(t) sont des positions : elles s\'expriment en mètres.' }] },
    ], () => cours.continuer(c));
    return c;
  },

  // ---------- 2. Position à une date donnée ----------
  (cours) => {
    const c = cours.carte('2. Position à une date donnée');
    cours.ajouter(c, `<div class="cours-bloc">
        <div class="cle"><p><b class="cle-titre">Méthode.</b> Pour connaître la position du point à la date t<sub>1</sub>, on remplace t par t<sub>1</sub> dans x(t) et dans y(t) : M ${col('x(t<sub>1</sub>)', 'y(t<sub>1</sub>)')}.</p>
          <p>À l'instant initial (t = 0 s), on note x(0) et y(0) : ce sont les coordonnées du point de départ.</p></div>
      </div>
      <div class="cours-exemple">
        <p class="cours-exemple-t">Exemple : le ballon</p>
        <p class="ph-calc">t = 0 s : x(0) = 2 × 0 = 0 m ; y(0) = ${M}0² + 4 × 0 = 0 m &nbsp;→ le ballon part de O<br>
          t = 1 s : x(1) = 2 × 1 = 2 m ; y(1) = ${M}1² + 4 × 1 = 3 m &nbsp;→ <span class="c">${N('OM')}(1) = 2${I} + 3${J}</span></p>
        <p class="er-petit">Vérifie avec le curseur de l'animation du 1. : à t = 1,0 s, x = 2,0 m et y = 3,0 m.</p>
      </div>`);
    CIN.aToi(c, [
      { titre: `Un point M a pour coordonnées x(t) = ${poly([4, -2])} et y(t) = ${poly([1, 0, 1])} (en m, t en s).`, parties: [
        { type: 'coord', q: `Donne les coordonnées de ${N('OM')}(0), à l'instant initial.`, label: `${N('OM')}(0)`, valeurs: [-2, 1], indice: 'Remplace t par 0 dans x(t) et dans y(t).', solution: `x(0) = 4 × 0 ${M} 2 = ${M}2 et y(0) = 0² + 1 = 1 : ${N('OM')}(0) ${col(-2, 1)} = ${ij(-2, 1)}` },
        { type: 'nombre', q: 'Calcule x(3), l\'abscisse du point à t = 3 s.', label: 'x(3) =', valeur: 10, tol: 1e-9, unite: 'm', indice: 'Remplace t par 3 dans x(t).', solution: 'x(3) = 4 × 3 − 2 = 10 m' },
        { type: 'nombre', q: 'Calcule y(3).', label: 'y(3) =', valeur: 10, tol: 1e-9, unite: 'm', indice: 'Remplace t par 3 dans y(t).', solution: 'y(3) = 3² + 1 = 10 m' }] },
      { titre: `Un point M a pour coordonnées x(t) = ${poly([-1, 6, 0])} et y(t) = ${poly([3, 1])} (en m, t en s).`, parties: [
        { type: 'coord', q: `Calcule les coordonnées du point M à t = 2 s.`, label: `${N('OM')}(2)`, valeurs: [8, 7], unite: 'm',
          diag: v => (v[0] === 16 ? '(−2)² = 4, mais −2² = −(2²) = −4 : ici x(2) = −4 + 12.' : null), indice: 'Remplace t par 2 dans x(t), puis dans y(t). Attention : −t² = −(t²).', solution: `x(2) = ${M}2² + 6 × 2 = ${M}4 + 12 = 8 m ; y(2) = 3 × 2 + 1 = 7 m` },
        { type: 'ij', q: `Écris ${N('OM')}(0) avec ${I} et ${J}.`, label: `${N('OM')}(0) =`, valeurs: [0, 1], lecture: false, indice: 'x(0) = 0 et y(0) = 1 : un terme nul ne s\'écrit pas.', solution: `x(0) = 0 et y(0) = 1 : ${N('OM')}(0) = ${ij(0, 1)}` }] },
    ], () => cours.continuer(c, 'Ce qu\'il faut retenir →'));
    return c;
  },

  // ---------- À retenir ----------
  (cours) => {
    const c = cours.carte('À retenir');
    cours.ajouter(c, `<div class="cle"><p><b class="cle-titre">Vecteur position.</b> M ${col('x(t)', 'y(t)')} ; ${N('OM')}(t) ${col('x(t)', 'y(t)')} ; ${N('OM')}(t) = x(t)${I} + y(t)${J}, coordonnées en m.</p></div>
      <div class="cle"><p><b class="cle-titre">Position à la date t<sub>1</sub>.</b> On remplace t par t<sub>1</sub> dans x(t) et y(t) ; à t = 0 : position de départ.</p></div>
      <div class="er-actions">
        <a class="btn-primary" style="text-decoration:none" href="module_4a_questions.html">Questions sur le vecteur position →</a>
        <a class="btn-secondary" style="text-decoration:none" href="module_4b_cours.html">Cours : le vecteur vitesse</a>
        <a class="btn-secondary" style="text-decoration:none" href="fiche_4.html">Fiche récapitulative</a>
      </div>`);
    return c;
  },
]);

CIN.menu('module_4a_cours');
</script>
</body>
</html>
