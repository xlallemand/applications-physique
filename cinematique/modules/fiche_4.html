<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 4 : fiche récapitulative — Cinématique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="cin.css">
<script src="../../assets/nav.js"></script>
<script src="vecteurs.js"></script>
<script src="cin.js"></script>
<script src="figures.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page cin-fiche" id="fiche"></div>

<script>
/* ============================================================
   Fiche récapitulative du module 4 : vecteurs position, vitesse,
   accélération, détermination expérimentale.
   ============================================================ */
const { nomHTML: N, colHTML: col } = VEC;
const { fr, dd } = CIN;
const M = CIN.MOINS;
const I = N('i'), J = N('j'), K = N('k');
const MS = `m·s<sup>${M}1</sup>`, MS2 = `m·s<sup>${M}2</sup>`;
const R = h => `<span class="racine">√<span>${h}</span></span>`;

document.getElementById('fiche').innerHTML = `
  <div class="er-card">
    <span class="er-badge">MODULE 4 · FICHE RÉCAPITULATIVE</span>
    <h2 class="er-titre">Position, vitesse et accélération</h2>
  </div>

  <section class="er-card">
    <h3 class="cours-titre">Vecteur position</h3>
    <div class="cle"><p class="ph-formule">M ${col('x(t)', 'y(t)')} &nbsp; ; &nbsp; ${N('OM')}(t) ${col('x(t)', 'y(t)')} &nbsp; ; &nbsp; ${N('OM')}(t) = x(t)${I} + y(t)${J}</p>
      <p>x(t) et y(t) en <b>m</b>. Position à la date t<sub>1</sub> : on remplace t par t<sub>1</sub> ; à t = 0 : position de départ. En 3D : + z(t)${K}.</p></div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Vecteur vitesse</h3>
    <div class="cle"><p class="ph-formule">${N('v')} = ${dd(N('OM'))} &nbsp; ; &nbsp; ${N('v')} ${col(`v<sub>x</sub> = ${dd('x')}`, `v<sub>y</sub> = ${dd('y')}`)}</p>
      <p><b>Tangent à la trajectoire</b>, dans le <b>sens du mouvement</b>. Coordonnées en ${MS}.</p>
      <p>Valeur : <span style="white-space:nowrap">v = ${R('v<sub>x</sub>² + v<sub>y</sub>²')}</span> (en 3D : v = √(v<sub>x</sub>² + v<sub>y</sub>² + v<sub>z</sub>²)).</p></div>
    <div data-f="ballon"></div>
    <p class="cin-fiche-leg">Ballon : x = 2t, y = ${CIN.poly([-1, 4, 0])} ; à t = 1 s, ${N('OM')} = 2${I} + 3${J} et ${N('v')} = 2${I} + 2${J} (tangent à la trajectoire)</p>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Vecteur accélération</h3>
    <div class="cle"><p class="ph-formule">${N('a')} = ${dd(N('v'))} &nbsp; ; &nbsp; ${N('a')} ${col(`a<sub>x</sub> = ${dd('v<sub>x</sub>')}`, `a<sub>y</sub> = ${dd('v<sub>y</sub>')}`)}</p>
      <p>Variation du vecteur vitesse : de sa <b>valeur</b> ou de sa <b>direction</b>. Coordonnées en ${MS2}. Valeur : <span style="white-space:nowrap">a = ${R('a<sub>x</sub>² + a<sub>y</sub>²')}</span>.</p>
      <p>On dérive deux fois : ${N('OM')} → ${N('v')} → ${N('a')}.</p>
      <p>Trois « accélérateurs » dans une voiture : la pédale d'accélérateur, le frein et le volant (il change la direction du vecteur vitesse).</p></div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Détermination expérimentale (TP)</h3>
    <div class="cle"><p><b class="cle-titre">Vitesse en M<sub>i</sub>.</b> Origine M<sub>i</sub> ; direction de M<sub>i</sub>M<sub>i+1</sub>, sens du mouvement ; <span style="white-space:nowrap">v<sub>i</sub> = ${fr('M<sub>i</sub>M<sub>i+1</sub>', 'τ')}</span>.</p>
      <p><b class="cle-titre">Accélération en M<sub>i</sub>.</b> Direction et sens de Δ${N('v')}<sub>i</sub> = ${N('v')}<sub>i+1</sub> ${M} ${N('v')}<sub>i</sub> ; <span style="white-space:nowrap">a<sub>i</sub> = ${fr('Δv<sub>i</sub>', 'τ')}</span>.</p>
      <p><b class="cle-titre">Tableur.</b> <span class="cin-nobr">v<sub>x,i</sub> = ${fr('x<sub>i+1</sub> − x<sub>i</sub>', 't<sub>i+1</sub> − t<sub>i</sub>')}</span> &nbsp; <span class="cin-nobr">a<sub>x,i</sub> = ${fr('v<sub>x,i+1</sub> − v<sub>x,i</sub>', 't<sub>i+1</sub> − t<sub>i</sub>')}</span></p>
      <p>La longueur des flèches dépend de l'échelle choisie : un vecteur vitesse ne relie pas deux positions.</p></div>
    <div class="cin-fiche-figs deux">
      <div><div data-f="chrono"></div><p>τ = 0,10 s ; 1 carreau = 5 cm ; v<sub>1</sub> = 2,2 ${MS} (1 carreau ↔ 1 ${MS})</p></div>
      <div><div data-f="dv"></div><p>Δ${N('v')}<sub>4</sub> = ${N('v')}<sub>5</sub> ${M} ${N('v')}<sub>4</sub> : ${N('v')}<sub>5</sub> et ${M}${N('v')}<sub>4</sub> bout à bout</p></div>
    </div>
  </section>

  <div class="er-actions cin-fiche-liens">
    <a class="btn-secondary" style="text-decoration:none" href="module_4a_cours.html">Cours : position</a>
    <a class="btn-secondary" style="text-decoration:none" href="module_4b_cours.html">Cours : vitesse</a>
    <a class="btn-secondary" style="text-decoration:none" href="module_4c_cours.html">Cours : accélération</a>
    <a class="btn-secondary" style="text-decoration:none" href="module_4d_cours.html">Cours : détermination expérimentale</a>
  </div>`;

FIG.ballon(document.querySelector('[data-f="ballon"]'), { vitesse: true, fixe: 1 });
new VEC.Repere(document.querySelector('[data-f="chrono"]'), { mode: 'aucun', xmin: 0, xmax: 12, ymin: 0, ymax: 8, axes: false, unitaires: false, largeurMax: 420,
  points: [[1, 1], [3, 5], [5, 7], [7, 7], [9, 5], [11, 1]].map((p, i) => ({ x: p[0], y: p[1], nom: `M${i + 1}`, dx: -16, dy: 6 })),
  vecteurs: [{ nom: 'v_1', dep: [1, 1], coord: [1, 2], fixe: true, coul: '#dc2626', nomPos: [.75, -.1] }] });
new VEC.Repere(document.querySelector('[data-f="dv"]'), { mode: 'aucun', xmin: 0, xmax: 12, ymin: 0, ymax: 7, axes: false, unitaires: false, largeurMax: 420,
  vecteurs: [{ nom: 'v_4', dep: [1, 4], coord: [3, 1], fixe: true }, { nom: 'v_5', dep: [6, 5], coord: [3, -1], fixe: true },
    { nom: '', dep: [9, 4], coord: [-3, -1], fixe: true, pointille: true, coul: '#8d8f94' }, { nom: 'Δv_4', dep: [6, 5], coord: [0, -2], fixe: true, coul: '#dc2626', nomPos: [-.9, 0] }] });
CIN.menu('fiche_4');
</script>
</body>
</html>
