<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 : fiche récapitulative — Cinématique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="cin.css">
<script src="vecteurs.js"></script>
<script src="cin.js"></script>
<script src="figures.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page cin-fiche" id="fiche"></div>

<script>
/* ============================================================
   Fiche récapitulative du module 1 : définitions, vocabulaire,
   figures importantes.
   ============================================================ */
document.getElementById('fiche').innerHTML = `
  <div class="er-card">
    <span class="er-badge">MODULE 1 · FICHE RÉCAPITULATIVE</span>
    <h2 class="er-titre">Référentiel et trajectoire</h2>
  </div>

  <section class="er-card">
    <h3 class="cours-titre">Définitions</h3>
    <div class="cle"><p><b class="cle-titre">Référentiel.</b> Solide de référence par rapport auquel on étudie un mouvement. On lui associe :</p>
      <ul class="er-liste"><li>un <b>repère d'espace</b> (la position du point : ses coordonnées) ;</li><li>un <b>repère de temps</b> (une horloge : les dates).</li></ul></div>
    <div class="cle"><p><b class="cle-titre">Trajectoire.</b> Ensemble des positions successives occupées par le point au cours du temps.</p>
      <p>La trajectoire <b>dépend du référentiel</b> : il faut toujours préciser le référentiel d'étude.</p></div>
    <p class="cours-exemple-t">Balle lâchée dans un train qui roule à vitesse constante</p>
    ${FIG.train(7)}
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Décrire un mouvement</h3>
    <div class="cle"><p>Un mot pour la <b>trajectoire</b>, puis un mot pour l'évolution de la <b>vitesse</b> :</p>
      <div class="cin-defile"><table class="cin-tab">
        <tr><th>Trajectoire</th><th>Vitesse</th></tr>
        <tr><td>rectiligne (droite)</td><td>uniforme (constante)</td></tr>
        <tr><td>circulaire (cercle)</td><td>accéléré (augmente)</td></tr>
        <tr><td>parabolique (parabole)</td><td>ralenti (diminue)</td></tr>
        <tr><td>curviligne (autre courbe)</td><td></td></tr>
      </table></div>
      <p><b>Chronophotographie</b> (positions à intervalles de temps égaux) : distance constante entre deux positions → uniforme ; distance qui augmente → accéléré ; qui diminue → ralenti.</p></div>
    <div class="cin-fiche-figs">
      <div>${FIG.chrono({ forme: 'droite', vitesse: 'uniforme' })}<p>rectiligne uniforme</p></div>
      <div>${FIG.chrono({ forme: 'cercle', vitesse: 'accelere', n: 9 })}<p>circulaire accéléré</p></div>
      <div>${FIG.chrono({ forme: 'oblique', vitesse: 'ralenti' })}<p>rectiligne ralenti</p></div>
    </div>
  </section>

  <section class="er-card">
    <h3 class="cours-titre">Trois référentiels à connaître</h3>
    <div class="cin-defile"><table class="cin-tab">
      <tr><th>Référentiel</th><th>Origine</th><th>Axes</th><th>Adapté pour</th></tr>
      <tr><td><b>héliocentrique</b></td><td>centre du Soleil</td><td>vers trois étoiles fixes</td><td>les planètes</td></tr>
      <tr><td><b>géocentrique</b></td><td>centre de la Terre</td><td>vers trois étoiles fixes</td><td>les satellites de la Terre</td></tr>
      <tr><td><b>terrestre</b></td><td>un point du sol</td><td>liés à la Terre</td><td>les objets sur Terre</td></tr>
    </table></div>
    ${FIG.referentiels()}
  </section>

  <div class="er-actions cin-fiche-liens">
    <a class="btn-secondary" style="text-decoration:none" href="module_1_cours.html">Revoir le cours</a>
    <a class="btn-secondary" style="text-decoration:none" href="module_1_questions.html">Questions sur le référentiel</a>
  </div>`;
CIN.menu('fiche_1');
</script>
</body>
</html>
