<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 4 : questions sur la détermination expérimentale de v et de a — Cinématique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="cin.css">
<script src="../../assets/nav.js"></script>

<script src="cin.js"></script>

<body>
<div id="app-nav"></div>
<div class="er-page" id="app"></div>

<script>
/* ============================================================
   10 questions tirées au hasard : calcul approché de la vitesse
   et de l'accélération (chronophotographie, tableur), tracés.
   6 QCM et 4 questions à saisie ou à tracé.
   Les vecteurs vitesse à tracer ne relient jamais deux positions :
   la flèche s'arrête au milieu du segment M2M3, sur un nœud du
   quadrillage, et sa valeur s'affiche pendant le tracé.
   ============================================================ */
const { hasard, melanger, entre, fmt, fr, dd } = CIN;
const { nomHTML: N, colHTML: col } = VEC;
const M = CIN.MOINS;
const o = (id, label) => ({ id, label });
const MS = `m·s<sup>${M}1</sup>`, MS2 = `m·s<sup>${M}2</sup>`;
const R = h => `<span class="racine">√<span>${h}</span></span>`;
const choix = (theme, q, options, bonne, solution, indice, opts) => ({ theme, parties: [Object.assign({ type: 'choix', q, options, bonne, solution, indice, colonne: true }, opts)] });
const opts = (bonne, autres) => { const vus = new Set([bonne]); return [o('ok', bonne)].concat(autres.filter(x => !vus.has(x) && vus.add(x)).slice(0, 3).map((x, i) => o('f' + i, x))); };

/* ---------- QCM ---------- */
function formuleVQCM() {
  return choix('Calcul approché', 'Sur une chronophotographie, la valeur de la vitesse au point M<sub>i</sub> est :', [o('ok', `v<sub>i</sub> = ${fr('M<sub>i</sub>M<sub>i+1</sub>', 'τ')}`), o('a', `v<sub>i</sub> = M<sub>i</sub>M<sub>i+1</sub> × τ`), o('b', `v<sub>i</sub> = ${fr('τ', 'M<sub>i</sub>M<sub>i+1</sub>')}`), o('c', `v<sub>i</sub> = ${fr('OM<sub>i</sub>', 'τ')}`)], 'ok',
    'On approche la vitesse instantanée par la vitesse moyenne entre M<sub>i</sub> et M<sub>i+1</sub> : distance divisée par la durée τ.', 'Une vitesse est une distance divisée par une durée.', { colonne: false });
}
function tableurVQCM() {
  return choix('Calcul approché', 'Dans un tableur, la coordonnée v<sub>x,i</sub> de la vitesse se calcule par :', [o('ok', fr('x<sub>i+1</sub> − x<sub>i</sub>', 't<sub>i+1</sub> − t<sub>i</sub>')), o('a', fr('x<sub>i</sub>', 't<sub>i</sub>')), o('b', 'x<sub>i+1</sub> − x<sub>i</sub>'), o('c', fr('t<sub>i+1</sub> − t<sub>i</sub>', 'x<sub>i+1</sub> − x<sub>i</sub>'))], 'ok',
    `v<sub>x,i</sub> = (x<sub>i+1</sub> − x<sub>i</sub>) / (t<sub>i+1</sub> − t<sub>i</sub>) : petite variation de x divisée par la petite variation de t, comme ${dd('x')}.`, 'C\'est l\'équivalent de dx/dt avec de petites variations.', { colonne: false });
}
function directionAQCM() {
  return choix('Calcul approché', 'Le vecteur accélération au point M<sub>i</sub> a la même direction et le même sens que :', [o('ok', `${N('v')}<sub>i+1</sub> ${M} ${N('v')}<sub>i</sub>`), o('a', `${N('v')}<sub>i</sub>`), o('b', `${N('v')}<sub>i</sub> + ${N('v')}<sub>i+1</sub>`), o('c', `${N('OM')}<sub>i</sub>`)], 'ok',
    `${N('a')}<sub>i</sub> a la direction et le sens de Δ${N('v')}<sub>i</sub> = ${N('v')}<sub>i+1</sub> ${M} ${N('v')}<sub>i</sub>, et a<sub>i</sub> = Δv<sub>i</sub> / τ.`, 'L\'accélération est la variation du vecteur vitesse.', { colonne: false });
}
function tableurAQCM() {
  return choix('Calcul approché', 'Dans un tableur, la coordonnée a<sub>x,i</sub> de l\'accélération se calcule par :', [o('ok', fr('v<sub>x,i+1</sub> − v<sub>x,i</sub>', 't<sub>i+1</sub> − t<sub>i</sub>')), o('a', fr('x<sub>i+1</sub> − x<sub>i</sub>', 't<sub>i+1</sub> − t<sub>i</sub>')), o('b', 'v<sub>x,i+1</sub> − v<sub>x,i</sub>'), o('c', fr('v<sub>x,i</sub>', 't<sub>i</sub>'))], 'ok',
    'a<sub>x,i</sub> = (v<sub>x,i+1</sub> − v<sub>x,i</sub>) / (t<sub>i+1</sub> − t<sub>i</sub>) : variation de la vitesse divisée par la durée.', 'Même méthode que pour la vitesse, avec v<sub>x</sub> à la place de x.', { colonne: false });
}
function directionQCM() {
  return choix('Tracé du vecteur vitesse', 'Sur une chronophotographie, le vecteur vitesse au point M<sub>i</sub> :', [o('ok', 'part de M<sub>i</sub>, dans la direction de M<sub>i</sub>M<sub>i+1</sub> ; sa longueur dépend de l\'échelle'), o('a', 'va toujours de M<sub>i</sub> jusqu\'à M<sub>i+1</sub>'), o('b', 'part de l\'origine O du repère'), o('c', 'est perpendiculaire au segment M<sub>i</sub>M<sub>i+1</sub>')], 'ok',
    'Origine M<sub>i</sub>, direction de M<sub>i</sub>M<sub>i+1</sub>, sens du mouvement ; sa longueur est fixée par la valeur v<sub>i</sub> et l\'échelle choisie : il ne relie pas deux positions.', 'La longueur de la flèche représente une vitesse, pas une distance.');
}
function conversionQCM() {
  const d = hasard([12, 15, 18, 20, 24, 30]), tau = hasard([40, 50, 60, 100]), v = (d / 100) / (tau / 1000);
  const f = x => `${CIN.cs(x, 2)} ${MS}`;
  return choix('Calcul approché', `Sur une chronophotographie, M<sub>3</sub>M<sub>4</sub> = ${d} cm et τ = ${tau} ms. La valeur de la vitesse en M<sub>3</sub> est :`,
    opts(f(v), [f(v * 100), f(v / 1000), f(v / 10), f(v * 10)]), 'ok',
    `v<sub>3</sub> = ${fr(fmt(d / 100), fmt(tau / 1000))} = ${CIN.cs(v, 2)} ${MS} (distance en m, durée en s).`, 'Convertis : la distance en m et la durée en s.', { colonne: false });
}
function valeurAQCM() {
  const dv = hasard([.4, .5, .6, .8, 1.2, 1.5]), tau = hasard([.04, .05, .1, .2]), a = dv / tau;
  const f = x => `${CIN.cs(x, 2)} ${MS2}`;
  return choix('Calcul approché', `Entre M<sub>2</sub> et M<sub>3</sub>, la variation de vitesse vaut Δv<sub>2</sub> = ${fmt(dv)} ${MS}, et τ = ${fmt(tau)} s. La valeur de l'accélération en M<sub>2</sub> est :`,
    opts(f(a), [f(dv * tau), f(tau / dv), f(a / 10), f(a * 10)]), 'ok',
    `a<sub>2</sub> = ${fr('Δv<sub>2</sub>', 'τ')} = ${fr(fmt(dv), fmt(tau))} = ${CIN.cs(a, 2)} ${MS2}.`, 'a<sub>i</sub> = Δv<sub>i</sub> / τ.', { colonne: false });
}

/* ---------- Calculs (une valeur est donnée à i) ---------- */
function calculV() {
  if (Math.random() < .5) {
    const d = hasard([12, 15, 18, 20, 24, 30, 36]), tau = hasard([20, 40, 50, 60, 100]), v = (d / 100) / (tau / 1000), i = entre(2, 6);
    return { theme: 'Calcul approché de la vitesse', consigne: `Sur une chronophotographie, M<sub>${i}</sub>M<sub>${i + 1}</sub> = ${d} cm et τ = ${tau} ms. Calcule v<sub>${i}</sub>.`,
      parties: [{ type: 'nombre', label: `v<sub>${i}</sub> =`, valeur: v, rel: .02, cs: 2, unite: MS,
        diag: w => (CIN.proche(w, d / (tau / 1000), .02) ? `Convertis la distance en mètres : ${d} cm = ${fmt(d / 100)} m.` : CIN.proche(w, (d / 100) / tau, .02) ? `Convertis la durée en secondes : ${tau} ms = ${fmt(tau / 1000)} s.` : CIN.proche(w, d / tau, .02) ? 'Convertis en mètres et en secondes.' : null),
        indice: `v<sub>${i}</sub> = M<sub>${i}</sub>M<sub>${i + 1}</sub> / τ, avec la distance en m et τ en s.`, solution: `v<sub>${i}</sub> = ${fr(fmt(d / 100), fmt(tau / 1000))} = ${CIN.cs(v, 2)} ${MS}` }] };
  }
  const i = entre(2, 8), x1 = entre(10, 40) / 10, dx = entre(5, 30) / 100, dt = hasard([.04, .05, .1]), v = dx / dt;
  return { theme: 'Calcul approché de la vitesse', consigne: `Dans un tableur : x<sub>${i}</sub> = ${fmt(x1, 2)} m, x<sub>${i + 1}</sub> = ${fmt(x1 + dx, 2)} m et t<sub>${i + 1}</sub> − t<sub>${i}</sub> = ${fmt(dt)} s. Calcule v<sub>x,${i}</sub>.`,
    parties: [{ type: 'nombre', label: `v<sub>x,${i}</sub> =`, valeur: v, rel: .02, cs: 2, unite: MS,
      diag: w => (Math.abs(w - dx) < .005 ? `Tu as calculé x<sub>${i + 1}</sub> − x<sub>${i}</sub> : il faut encore diviser par la durée.` : null),
      indice: `v<sub>x,${i}</sub> = (x<sub>${i + 1}</sub> − x<sub>${i}</sub>) / (t<sub>${i + 1}</sub> − t<sub>${i}</sub>).`, solution: `v<sub>x,${i}</sub> = ${fr(`${fmt(x1 + dx, 2)} − ${fmt(x1, 2)}`, fmt(dt))} = ${CIN.cs(v, 2)} ${MS}` }] };
}
function calculA() {
  const i = entre(2, 8), v1 = entre(10, 40) / 10, dv = hasard([-1, 1]) * entre(2, 12) / 10, dt = hasard([.04, .05, .1, .2]), a = dv / dt;
  return { theme: 'Calcul approché de l\'accélération', consigne: `Dans un tableur : v<sub>x,${i}</sub> = ${fmt(v1, 1)} ${MS}, v<sub>x,${i + 1}</sub> = ${fmt(v1 + dv, 1)} ${MS} et t<sub>${i + 1}</sub> − t<sub>${i}</sub> = ${fmt(dt)} s. Calcule a<sub>x,${i}</sub>.`,
    parties: [{ type: 'nombre', label: `a<sub>x,${i}</sub> =`, valeur: a, rel: .02, cs: 2, unite: MS2,
      diag: w => (Math.abs(w - dv) < .005 ? 'Tu as calculé la variation de vitesse : il faut encore diviser par la durée.' : Math.abs(w + a) < 1e-6 + Math.abs(a) * .02 ? `Attention au signe : on calcule v<sub>x,${i + 1}</sub> − v<sub>x,${i}</sub>.` : null),
      indice: `a<sub>x,${i}</sub> = (v<sub>x,${i + 1}</sub> − v<sub>x,${i}</sub>) / (t<sub>${i + 1}</sub> − t<sub>${i}</sub>).`, solution: `a<sub>x,${i}</sub> = ${fr(`${fmt(v1 + dv, 1)} − ${fmt(v1, 1)}`, fmt(dt))} = ${CIN.cs(a, 2)} ${MS2}` }] };
}

/* ---------- Tracés ---------- */
// vecteur vitesse en M2 : direction de M2M3, la valeur s'affiche pendant le tracé
function traceV() {
  // échelles choisies pour que la flèche mesure la moitié de M2M3 (en carreaux)
  const E = hasard([
    { pos: '1 carreau représente 5 cm', tau: 'τ = 0,10 s', k: 1 },
    { pos: '1 carreau représente 2 cm', tau: 'τ = 40 ms', k: 1 },
    { pos: '1 carreau représente 10 cm', tau: 'τ = 0,10 s', k: 2 },
  ]);
  const D2 = [[4, 0], [4, 2], [2, 4], [4, 4], [6, 2], [2, 2], [6, 0], [4, -2], [6, -2], [2, -2], [2, -4], [4, -4]];
  let P, d2;
  do {
    const d1 = [entre(2, 5), entre(-2, 3)], d3 = [entre(1, 4), entre(-3, 3)];
    d2 = hasard(D2);
    P = [[1, entre(1, 7)]];
    [d1, d2, d3].forEach(d => { const q = P[P.length - 1]; P.push([q[0] + d[0], q[1] + d[1]]); });
  } while (P.some(p => p[0] > 15 || p[1] < 1 || p[1] > 8));
  const c = [d2[0] / 2, d2[1] / 2], v = Math.hypot(c[0], c[1]) * E.k, vTxt = `${fmt(v, 1)} ${MS}`;
  const diag = (w) => {
    const d = [w.fin[0] - w.dep[0], w.fin[1] - w.dep[1]], vect = d[0] * c[1] - d[1] * c[0], scal = d[0] * c[0] + d[1] * c[1];
    if (!vect && scal > 0) return `La direction et le sens sont justes, mais pas la longueur : arrête la flèche quand la valeur affichée vaut ${vTxt}.`;
    if (!vect) return 'La direction est juste, mais pas le sens : le vecteur vitesse est dans le sens du mouvement, de M<sub>2</sub> vers M<sub>3</sub>.';
    return 'Le vecteur vitesse en M<sub>2</sub> a la direction du segment M<sub>2</sub>M<sub>3</sub> : la flèche part de M<sub>2</sub> et longe ce segment.';
  };
  return { theme: 'Tracer un vecteur vitesse', consigne: `Trace ${N('v')}<sub>2</sub>, le vecteur vitesse au point M<sub>2</sub>.`,
    enonce: `<p>Positions toutes les ${E.tau} ; ${E.pos}. On a calculé <b>v<sub>2</sub> = ${fr('M<sub>2</sub>M<sub>3</sub>', 'τ')} = ${vTxt}</b>. Échelle des vitesses : <b>1 carreau ↔ ${E.k} ${MS}</b>.</p><p class="er-petit">Arrête la flèche quand la valeur affichée vaut ${vTxt}.</p>`,
    parties: [{ type: 'tracer', repere: { xmin: 0, xmax: 16, ymin: 0, ymax: 9, axes: false, unitaires: false, points: P.map((p, i) => ({ x: p[0], y: p[1], nom: `M${i + 1}`, dx: -16, dy: 6 })),
      vecteurs: [{ nom: 'v_2', dep: P[1], coord: c, valeur: { k: E.k, unite: MS, dec: 1 } }] }, diag,
      solution: `${N('v')}<sub>2</sub> part de M<sub>2</sub> et suit le segment M<sub>2</sub>M<sub>3</sub>. Avec l'échelle, ${vTxt} correspond à ${fmt(v / E.k, 1)} carreau${v / E.k >= 2 ? 'x' : ''} : la flèche s'arrête au milieu du segment M<sub>2</sub>M<sub>3</sub>.` }] };
}
// variation du vecteur vitesse
function traceDv() {
  let v1, v2, dv;
  do { v1 = [entre(1, 4), entre(-2, 3)]; v2 = [entre(1, 4), entre(-3, 2)]; dv = [v2[0] - v1[0], v2[1] - v1[1]]; } while ((!dv[0] && !dv[1]) || Math.abs(dv[1]) > 4);
  const xs = []; for (let x = 8; x <= 13; x++) if (x + dv[0] >= 7 && x + dv[0] <= 14) xs.push(x);
  const ys = []; for (let y = 1; y <= 7; y++) if (y + dv[1] >= 0 && y + dv[1] <= 8) ys.push(y);
  const A = [hasard(xs), hasard(ys)];
  return { theme: 'Variation du vecteur vitesse', consigne: `Trace Δ${N('v')} = ${N('v')}<sub>4</sub> ${M} ${N('v')}<sub>3</sub> à partir du point M<sub>3</sub>.`,
    enonce: `<p class="er-petit">Mets bout à bout ${N('v')}<sub>4</sub> et l'opposé de ${N('v')}<sub>3</sub>, ou calcule d'abord les coordonnées. Le vecteur accélération en M<sub>3</sub> a la même direction et le même sens que Δ${N('v')}.</p>`,
    parties: [{ type: 'tracer', repere: { xmin: 0, xmax: 14, ymin: 0, ymax: 8, axes: false, unitaires: false, points: [{ x: A[0], y: A[1], nom: 'M3', dx: -18, dy: 4 }],
      vecteurs: [{ nom: 'v_3', dep: [1, 8 - Math.max(0, v1[1])], coord: v1, fixe: true }, { nom: 'v_4', dep: [1, 1 - Math.min(0, v2[1])], coord: v2, fixe: true }, { nom: 'Δv', dep: A, coord: dv }] },
      solution: `Δ${N('v')} = ${col(`${v2[0]} − ${v1[0]}`, `${fmt(v2[1])} − ${v1[1] < 0 ? `(${fmt(v1[1])})` : v1[1]}`)} = ${col(dv[0], dv[1])}` }] };
}

// 6 QCM différents (parmi 7) et 4 questions à saisie ou à tracé
function tirage() {
  const q = melanger([formuleVQCM, tableurVQCM, directionQCM, conversionQCM, directionAQCM, tableurAQCM, valeurAQCM]).slice(0, 6).map(f => f());
  return [q[0], q[1], calculV(), q[2], traceV(), q[3], calculA(), q[4], traceDv(), q[5]];
}

CIN.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 4 · QUESTIONS 4/4', titre: 'Détermination expérimentale de <span class="vec-nom">v</span> et de <span class="vec-nom">a</span>',
  intro: '<p class="er-contexte">10 questions tirées au hasard, surtout des QCM : calcul approché de la vitesse et de l\'accélération à partir d\'une chronophotographie ou d\'un tableur, tracé d\'un vecteur vitesse et d\'une variation de vitesse.</p>',
  questions: tirage,
  revoir: { href: 'module_4d_cours.html', label: 'Revoir le cours' },
  suite: { href: 'module_5_cours.html', label: 'Module 5 : le repère de Frenet →' },
});
CIN.menu('module_4d_questions');
</script>
</body>
