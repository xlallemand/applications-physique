<!DOCTYPE html>
<html lang="fr" data-matiere="physique">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 4 : questions sur la vitesse et l'accélération — Cinématique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="cin.css">
<script src="../../assets/nav.js"></script>
<script src="vecteurs.js"></script>
<script src="cin.js"></script>

<body>
<div id="app-nav"></div>
<div class="er-page" id="app"></div>

<script>
/* ============================================================
   10 questions tirées au hasard : vecteur position (2), vecteur
   vitesse (2), valeur de la vitesse (1), accélération (2),
   question de cours (1), calcul approché (1), tracé (1).
   ============================================================ */
const { hasard, melanger, entre, fmt, fr, dd, poly } = CIN;
const { nomHTML: N, colHTML: col, ijHTML: ij } = VEC;
const M = CIN.MOINS;
const o = (id, label) => ({ id, label });
const I = N('i'), J = N('j');
const MS = `m·s<sup>${M}1</sup>`, MS2 = `m·s<sup>${M}2</sup>`;
const R = h => `<span class="racine">√<span>${h}</span></span>`;
const nz = (a) => { let k; do { k = entre(-(a || 9), a || 9); } while (!k); return k; };
const val = (c, t) => c[0] * t * t + c[1] * t + c[2];
const par = (c) => (c.filter(Boolean).length > 1 ? `(${poly(c)})` : poly(c));
// fonction du temps de degré 2 ou 1, coefficients entiers
const fonction = () => (Math.random() < .6 ? [nz(5), entre(-9, 9), entre(-9, 9)] : [0, nz(), entre(-9, 9)]);
const sq = v => (v < 0 ? `(${fmt(v)})²` : `${fmt(v)}²`);
const choix = (theme, q, options, bonne, solution, indice, opts) => ({ theme, parties: [Object.assign({ type: 'choix', q, options, bonne, solution, indice, colonne: true }, opts)] });

/* ---------- Position ---------- */
function position() {
  const x = fonction(), y = fonction();
  const enonce = `Un point M a pour coordonnées x(t) = ${poly(x)} et y(t) = ${poly(y)} (x et y en m, t en s).`;
  const k = entre(0, 2);
  if (k === 0) return { theme: 'Vecteur position', consigne: enonce + ` Donne les coordonnées de ${N('OM')}(0).`,
    parties: [{ type: 'coord', label: `${N('OM')}(0)`, valeurs: [x[2], y[2]], unite: 'm', indice: 'Remplace t par 0 : il ne reste que les termes constants.', solution: `x(0) = ${fmt(x[2])} m et y(0) = ${fmt(y[2])} m : ${N('OM')}(0) ${col(x[2], y[2])}` }] };
  if (k === 1) {
    const t = entre(1, 4);
    return { theme: 'Vecteur position', consigne: enonce + ` Calcule les coordonnées du point M à t = ${t} s.`,
      parties: [{ type: 'coord', label: `${N('OM')}(${t})`, valeurs: [val(x, t), val(y, t)], unite: 'm', indice: `Remplace t par ${t} dans x(t) et dans y(t).`,
        solution: `x(${t}) = ${fmt(val(x, t))} m ; y(${t}) = ${fmt(val(y, t))} m` }] };
  }
  const champs = c => (c[0] ? [{ v: c[0] }, ' t² + ', { v: c[1] }, ' t + ', { v: c[2] }] : [{ v: c[1] }, ' t + ', { v: c[2] }]);
  return { theme: 'Vecteur position', consigne: enonce + ` Écris ${N('OM')}(t) avec ${I} et ${J}.`, enonce: '<p class="er-petit">Écris 0 si un terme n\'existe pas.</p>',
    parties: [{ type: 'gabarit', label: `${N('OM')}(t) =`, morceaux: ['('].concat(champs(x), [`) ${I} + (`], champs(y), [`) ${J}`]),
      indice: `${N('OM')}(t) = x(t)${I} + y(t)${J}.`, solution: `${N('OM')}(t) = ${par(x)}${I} + ${par(y)}${J}` }] };
}

/* ---------- Vitesse ---------- */
function vitesse() {
  const x = fonction(), y = fonction();
  const vx = [2 * x[0], x[1]], vy = [2 * y[0], y[1]];
  const g = (c) => (c[0] ? [{ v: c[0] }, ' t + ', { v: c[1] }] : [{ v: c[1] }]);
  return { theme: 'Vecteur vitesse', consigne: `Un point M a pour coordonnées x(t) = ${poly(x)} et y(t) = ${poly(y)} (en m, t en s). Écris le vecteur vitesse ${N('v')}(t).`,
    parties: [{ type: 'gabarit', label: `${N('v')}(t) =`, morceaux: ['('].concat(g(vx), [`) ${I} + (`], g(vy), [`) ${J}`]),
      diag: v => (x[0] && v[0] === x[0] && vx[0] !== x[0] ? 'La dérivée de at² est 2at.' : null),
      indice: `v<sub>x</sub> = ${dd('x')} et v<sub>y</sub> = ${dd('y')} : dérive chaque coordonnée.`, solution: `v<sub>x</sub> = ${poly(vx)} et v<sub>y</sub> = ${poly(vy)} : ${N('v')}(t) = ${par(vx)}${I} + ${par(vy)}${J}` }] };
}
function valeurVitesse() {
  // vitesses entières à la date choisie de temps en temps
  const t = entre(1, 3), x = fonction(), y = fonction();
  const vx = 2 * x[0] * t + x[1], vy = 2 * y[0] * t + y[1], v = Math.hypot(vx, vy), ent = Number.isInteger(v);
  return { theme: 'Valeur de la vitesse', consigne: `Un point M a pour coordonnées x(t) = ${poly(x)} et y(t) = ${poly(y)} (en m, t en s). Calcule la valeur de sa vitesse à t = ${t} s${ent ? '' : ', arrondie au dixième'}.`,
    parties: [{ type: 'nombre', label: `v(${t}) ${ent ? '=' : '≈'}`, valeur: v, tol: ent ? 1e-9 : .051, dec: ent ? 0 : 1, unite: MS,
      diag: w => (Math.abs(w - Math.hypot(val(x, t), val(y, t))) < .06 ? 'Tu as calculé la distance OM : il faut d\'abord dériver pour avoir vx et vy.' : Math.abs(w - (Math.abs(vx) + Math.abs(vy))) < .01 ? 'On n\'additionne pas : v = √(vx² + vy²).' : null),
      indice: `Dérive x(t) et y(t), calcule v<sub>x</sub>(${t}) et v<sub>y</sub>(${t}), puis v = √(v<sub>x</sub>² + v<sub>y</sub>²).`,
      solution: `v<sub>x</sub> = ${poly([2 * x[0], x[1]])} ⇒ v<sub>x</sub>(${t}) = ${fmt(vx)} ${MS} ; v<sub>y</sub> = ${poly([2 * y[0], y[1]])} ⇒ v<sub>y</sub>(${t}) = ${fmt(vy)} ${MS}<br>v = ${R(`${sq(vx)} + ${sq(vy)}`)} ${ent ? '=' : '≈'} ${ent ? fmt(v) : fmt(v, 1)} ${MS}` }] };
}

/* ---------- Accélération ---------- */
function acceleration() {
  if (Math.random() < .5) {
    const vx = [nz(), entre(-9, 9)], vy = Math.random() < .5 ? [0, entre(-9, 9)] : [nz(), entre(-9, 9)];
    const a = Math.hypot(vx[0], vy[0]), ent = Number.isInteger(a);
    return { theme: 'Vecteur accélération', consigne: `La vitesse d'un point a pour coordonnées v<sub>x</sub>(t) = ${poly(vx)} et v<sub>y</sub>(t) = ${poly(vy)} (en ${MS}).`,
      parties: [
        { type: 'coord', q: `Donne les coordonnées de ${N('a')}.`, label: N('a'), valeurs: [vx[0], vy[0]], unite: MS2, indice: `a<sub>x</sub> = ${dd('v<sub>x</sub>')} et a<sub>y</sub> = ${dd('v<sub>y</sub>')}.`,
          diag: v => (v[0] === vx[1] || v[1] === vy[1] ? 'La dérivée d\'une constante est 0 : seul le terme en t compte.' : null), solution: `a<sub>x</sub> = ${fmt(vx[0])} ${MS2} et a<sub>y</sub> = ${fmt(vy[0])} ${MS2}` },
        { type: 'nombre', q: `Calcule la valeur a de l'accélération${ent ? '' : ', arrondie au dixième'}.`, label: `a ${ent ? '=' : '≈'}`, valeur: a, tol: ent ? 1e-9 : .051, dec: ent ? 0 : 1, unite: MS2, indice: 'a = √(ax² + ay²).',
          solution: `a = ${R(`${sq(vx[0])} + ${sq(vy[0])}`)} ${ent ? '=' : '≈'} ${ent ? fmt(a) : fmt(a, 1)} ${MS2}` }] };
  }
  const x = [nz(5), entre(-9, 9), entre(-9, 9)], y = Math.random() < .5 ? [0, nz(), entre(-9, 9)] : [nz(5), entre(-9, 9), entre(-9, 9)];
  return { theme: 'Vecteur accélération', consigne: `Un point M a pour coordonnées x(t) = ${poly(x)} et y(t) = ${poly(y)} (en m). Donne les coordonnées de son accélération.`,
    parties: [{ type: 'coord', label: N('a'), valeurs: [2 * x[0], 2 * y[0]], unite: MS2, indice: 'Dérive deux fois : d\'abord la vitesse, puis l\'accélération.',
      diag: v => (v[0] === 2 * x[0] * 1 + x[1] && x[1] ? 'Tu as calculé la vitesse : il faut la dériver encore une fois.' : null),
      solution: `v<sub>x</sub> = ${poly([2 * x[0], x[1]])} ⇒ a<sub>x</sub> = ${fmt(2 * x[0])} ; v<sub>y</sub> = ${poly([2 * y[0], y[1]])} ⇒ a<sub>y</sub> = ${fmt(2 * y[0])} (en ${MS2})` }] };
}

/* ---------- Questions de cours ---------- */
function cours() {
  return hasard([
    () => choix('Question de cours', 'Le vecteur vitesse d\'un point est :', [o('ok', 'tangent à la trajectoire, dans le sens du mouvement'), o('a', 'dirigé vers l\'origine du repère'), o('b', 'perpendiculaire à la trajectoire'), o('c', 'toujours horizontal')], 'ok', 'Le vecteur vitesse est tangent à la trajectoire, dans le sens du mouvement.', 'Pense à l\'animation du ballon.'),
    () => choix('Question de cours', `${N('a')} = ${dd(N('v'))}. Le vecteur accélération représente :`, [o('ok', 'la variation du vecteur vitesse'), o('a', 'la variation de la position'), o('b', 'la vitesse moyenne'), o('c', 'la distance parcourue')], 'ok', 'L\'accélération est la variation (la dérivée) du vecteur vitesse.', 'Lis la définition : dérivée de quoi ?'),
    () => choix('Question de cours', 'Un point décrit un cercle à vitesse de valeur constante. Son accélération :', [o('ok', 'n\'est pas nulle, car la direction du vecteur vitesse change'), o('a', 'est nulle, car la valeur de la vitesse est constante'), o('b', 'est nulle, car le mouvement est circulaire'), o('c', 'est égale à la vitesse')], 'ok', 'Le vecteur vitesse change de direction : il varie, l\'accélération n\'est pas nulle.', 'Pense au volant, « troisième accélérateur ».'),
    () => choix('Question de cours', `Les coordonnées du vecteur accélération s'expriment en :`, [o('ok', MS2), o('a', MS), o('b', 'm'), o('c', 'm·s')], 'ok', `a<sub>x</sub> = ${dd('v<sub>x</sub>')} → (m·s<sup>${M}1</sup>) / s = ${MS2}.`, 'Écris l\'unité du haut divisée par l\'unité du bas.', { colonne: false }),
    () => choix('Question de cours', `La coordonnée v<sub>y</sub> du vecteur vitesse est :`, [o('ok', dd('y')), o('a', fr('y', 't')), o('b', dd('t', 'y')), o('c', dd('v'))], 'ok', `v<sub>y</sub> = ${dd('y')} = y'(t).`, 'C\'est la dérivée d\'une coordonnée de la position.', { colonne: false }),
  ])();
}

/* ---------- Calcul approché ---------- */
function approche() {
  if (Math.random() < .5) {
    const d = hasard([12, 15, 18, 20, 24, 30, 36]), tau = hasard([20, 40, 50, 60, 100]), v = (d / 100) / (tau / 1000);
    return { theme: 'Calcul approché de la vitesse', consigne: `Sur une chronophotographie, M<sub>3</sub>M<sub>4</sub> = ${d} cm et τ = ${tau} ms. Calcule v<sub>3</sub>.`,
      parties: [{ type: 'nombre', label: 'v<sub>3</sub> =', valeur: v, rel: .02, cs: 2, unite: MS,
        diag: w => (CIN.proche(w, d / (tau / 1000), .02) ? `Convertis la distance en mètres : ${d} cm = ${fmt(d / 100)} m.` : CIN.proche(w, (d / 100) / tau, .02) ? `Convertis la durée en secondes : ${tau} ms = ${fmt(tau / 1000)} s.` : CIN.proche(w, d / tau, .02) ? 'Convertis en mètres et en secondes.' : null),
        indice: 'v₃ = M₃M₄ / τ, avec M₃M₄ en m et τ en s.', solution: `v<sub>3</sub> = ${fr(fmt(d / 100), fmt(tau / 1000))} = ${CIN.cs(v, 2)} ${MS}` }] };
  }
  const x1 = entre(10, 40) / 10, dx = entre(5, 30) / 100, dt = hasard([.04, .05, .1]), v = dx / dt;
  return { theme: 'Calcul approché de la vitesse', consigne: `Dans un tableur : x<sub>i</sub> = ${fmt(x1, 2)} m, x<sub>i+1</sub> = ${fmt(x1 + dx, 2)} m et t<sub>i+1</sub> − t<sub>i</sub> = ${fmt(dt)} s. Calcule v<sub>x,i</sub>.`,
    parties: [{ type: 'nombre', label: 'v<sub>x,i</sub> =', valeur: v, rel: .02, cs: 2, unite: MS,
      diag: w => (Math.abs(w - dx) < .005 ? 'Tu as calculé la variation de x : il faut encore diviser par la durée.' : null),
      indice: 'vx,i = (xi+1 − xi) / (ti+1 − ti).', solution: `v<sub>x,i</sub> = ${fr(`${fmt(x1 + dx, 2)} − ${fmt(x1, 2)}`, fmt(dt))} = ${CIN.cs(v, 2)} ${MS}` }] };
}

/* ---------- Tracé : vitesse ou variation de vitesse ---------- */
function trace() {
  if (Math.random() < .5) {
    // positions successives : v_i a la direction de M_i M_(i+1)
    const pas = [[2, 1], [3, 1], [3, 2], [4, 2], [3, 3]], d1 = hasard(pas.slice(0, 3)), d2 = hasard(pas.slice(2));
    const P = [[1, 1]];
    P.push([P[0][0] + d1[0], P[0][1] + d1[1]]); P.push([P[1][0] + d2[0], P[1][1] + d2[1]]); P.push([P[2][0] + d2[0] + 1, P[2][1] + d2[1] - 1]);
    return { theme: 'Tracer un vecteur vitesse', consigne: `Trace ${N('v')}<sub>2</sub>, le vecteur vitesse au point M<sub>2</sub>.`,
      enonce: `<p>Positions toutes les τ = 0,10 s ; 1 carreau représente 0,10 m. Échelle des vitesses : 1 carreau ↔ 1 ${MS}.</p>`,
      parties: [{ type: 'tracer', repere: { xmin: 0, xmax: 16, ymin: 0, ymax: 9, axes: false, unitaires: false, points: P.map((p, i) => ({ x: p[0], y: p[1], nom: `M${i + 1}`, dx: -16, dy: 6 })), vecteurs: [{ nom: 'v_2', dep: P[1], coord: d2 }] },
        solution: `${N('v')}<sub>2</sub> a la direction de M<sub>2</sub>M<sub>3</sub> : ${d2[0]} carreaux à droite et ${d2[1]} vers le haut (avec cette échelle, mêmes déplacements que M<sub>2</sub>M<sub>3</sub>).` }] };
  }
  let v1, v2, dv;
  do { v1 = [entre(1, 4), entre(-2, 3)]; v2 = [entre(1, 4), entre(-3, 2)]; dv = [v2[0] - v1[0], v2[1] - v1[1]]; } while ((!dv[0] && !dv[1]) || Math.abs(dv[1]) > 4);
  const xs = []; for (let x = 8; x <= 13; x++) if (x + dv[0] >= 7 && x + dv[0] <= 14) xs.push(x);
  const ys = []; for (let y = 1; y <= 7; y++) if (y + dv[1] >= 0 && y + dv[1] <= 8) ys.push(y);
  const A = [hasard(xs), hasard(ys)];
  return { theme: 'Variation du vecteur vitesse', consigne: `Trace Δ${N('v')} = ${N('v')}<sub>4</sub> ${M} ${N('v')}<sub>3</sub> à partir du point M<sub>3</sub>.`,
    enonce: `<p class="er-petit">Mets bout à bout ${N('v')}<sub>4</sub> et l'opposé de ${N('v')}<sub>3</sub>, ou calcule d'abord les coordonnées. Le vecteur accélération en M<sub>3</sub> a la même direction et le même sens que Δ${N('v')}.</p>`,
    parties: [{ type: 'tracer', repere: { xmin: 0, xmax: 14, ymin: 0, ymax: 8, axes: false, unitaires: false, points: [{ x: A[0], y: A[1], nom: 'M3', dx: -18, dy: 4 }],
      vecteurs: [{ nom: 'v_3', dep: [1, 8 - Math.max(0, v1[1])], coord: v1, fixe: true }, { nom: 'v_4', dep: [1, 1 - Math.min(0, v2[1])], coord: v2, fixe: true }, { nom: 'Δv', dep: A, coord: dv }] },
      solution: `Δ${N('v')} = ${col(`${v2[0]} − ${v1[0]}`, `${fmt(v2[1])} − ${v1[1] < 0 ? `(${fmt(v1[1])})` : v1[1]}`)} = ${col(dv[0], dv[1])}` }] };
}

function tirage() {
  return [position(), vitesse(), cours(), valeurVitesse(), acceleration(), approche(), position(), trace(), vitesse(), acceleration()];
}

CIN.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 4 · QUESTIONS', titre: 'Position, vitesse et accélération',
  intro: '<p class="er-contexte">10 questions tirées au hasard : vecteur position, vecteur vitesse et sa valeur, vecteur accélération, calcul approché à partir d\'une chronophotographie ou d\'un tableur, tracés.</p>',
  questions: tirage,
  revoir: { href: 'module_4_cours.html', label: 'Revoir le cours' },
  suite: { href: 'module_5_cours.html', label: 'Module 5 : le repère de Frenet →' },
});
CIN.menu('module_4_questions');
</script>
</body>
</html>
