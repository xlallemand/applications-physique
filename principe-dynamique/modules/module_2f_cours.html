<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : forces qui se compensent — Chapitre 6 : Principe fondamental de la dynamique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="pfd.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="pfd.js"></script>
<script src="situations.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS 6 / 6</span>
    <h2 class="er-titre">Forces qui se compensent</h2>
    <p class="er-contexte">Dernière question d'un bilan des forces : les forces se <b>compensent</b>-elles, c'est-à-dire leur <b>somme</b> est-elle nulle ?</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 6 du module 2 : des forces se compensent quand leur somme
   est nulle. Exemple du palet d'air-hockey et du skieur sans frottement
   (diagramme objet-action au-dessus de chaque dessin) ; « À toi » :
   deux bilans tout faits à juger, puis un bilan complet (PFD.bilan).
   ============================================================ */
const { melanger, exemple } = COURS;
const { o, nomV, sceneRemplie, diagrammesDe, bilan, SITUATIONS } = PFD;

/* ---------- 1. Des forces qui se compensent ---------- */
// « ces forces se compensent-elles ? » sur un bilan tout fait
function qComp(titre, s) {
  const autre = s.comp.bonne === 'oui' ? 'non' : 'oui';
  return { titre, enonce: `<p>${s.enonce}</p><div class="pfd-sc-cadre">${sceneRemplie(s)}</div>`,
    parties: [{ type: 'choix', q: s.comp.q || 'Ces forces se compensent-elles ?', options: [o('oui', 'oui : leur somme est nulle'), o('non', 'non : leur somme n\'est pas nulle')],
      bonne: s.comp.bonne, melanger: false, colonne: true, indices: { [autre]: s.comp.indice }, solution: `<p>${s.comp.expl}</p>` }] };
}
function etape1(c_) {
  const carte = c_.carte('1. Des forces qui se compensent');
  const deux = [SITUATIONS.palet, SITUATIONS.skieurSans], dos = diagrammesDe(deux);
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Définition.</b> Des forces se <b>compensent</b> quand leur somme vectorielle est nulle : Σ <span class="vec-nom">F</span> = <span class="vec-nom">0</span>. Deux forces qui se compensent ont la même direction, des sens opposés et la même valeur.</p></div>
    </div>
    ${exemple(`<div class="pfd-ballon deux">${deux.map((s, k) => `<figure><p class="pfd-ballon-t">${s.titre}</p>${dos[k]}${sceneRemplie(s)}</figure>`).join('')}</div>
      <p>Palet d'air-hockey : ${nomV('RN')} et ${nomV('P')} se compensent toujours. Skieur sans frottement : elles ne se compensent pas ; leur somme Σ <span class="vec-nom">F</span> = ${nomV('RN')} + ${nomV('P')} fait accélérer le skieur vers le bas de la pente.</p>`)}`);
  const [a, b] = melanger([['brique', 'La brique sur la planche'], ['pendule', 'Le pendule']]);
  c_.aToi(carte, [qComp(a[1], SITUATIONS[a[0]]), qComp(b[1], SITUATIONS[b[0]]),
    Object.assign({ titre: 'Un skieur sans frottement : le bilan complet' }, bilan(SITUATIONS.skieurSans))]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>Des forces se compensent quand leur somme est nulle : Σ <span class="vec-nom">F</span> = <span class="vec-nom">0</span> (deux forces : même direction, sens opposés, même valeur).</p></div>
    <div class="cle"><p><b>Bilan des forces</b> : le diagramme objet-action, puis chaque force sur le schéma (point de départ, direction, sens, nom), enfin : les forces se compensent-elles ?</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2_simulation.html">Atelier : bilan des forces →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_2_questions.html">Questions sur le bilan des forces</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html#compensation">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, aRetenir]);
PFD.menu('module_2f_cours');
</script>
</body>
</html>
