<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : accélération et forces — Chapitre 6 : Principe fondamental de la dynamique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="pfd.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="pfd.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · COURS 5 / 5</span>
    <h2 class="er-titre">Accélération et forces</h2>
    <p class="er-contexte">4<sup>e</sup> façon : on connaît les <b>forces</b> et la <b>masse</b> : a = Σ F / m, avec le principe fondamental de la dynamique.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 5 du module 3 : 4e façon de calculer a : avec les forces, a = Σ F / m
   (principe fondamental, module 4).
   Erreurs diagnostiquées : Σ F et m inversés, masse en g non convertie.
   ============================================================ */
const { fmt, hasard, melanger, exemple } = COURS;
const { o, fr, proche } = PFD;
const c = h => `<span class="c">${h}</span>`;
const r3 = v => +v.toPrecision(3);
const MS2 = 'm·s<sup>−2</sup>';

/* ---------- 1. 4e façon : avec les forces, a = Σ F / m ---------- */
function etape1(c_) {
  const carte = c_.carte('1. Avec les forces : a = Σ F / m');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p>Si on connaît la <b>résultante des forces</b> Σ F (la somme de toutes les forces) et la <b>masse</b> m, le principe fondamental de la dynamique donne :</p>
        <p class="crs-formule">a = ${fr('Σ F', 'm')}</p><p>Σ F en N, m en kg, a en m·s<sup>−2</sup>.</p></div>
      <div class="ph-lien-app"><p>Le principe fondamental de la dynamique, et comment trouver Σ F, sont au module 4.</p><a class="btn-small" href="module_4a_cours.html">Module 4 →</a></div>
    </div>
    ${exemple(`<p>Sur une voiture de course de 600 kg, la résultante des forces vaut 6 660 N.</p><p class="crs-calc">a = ${fr('Σ F', 'm')} = ${fr('6 660', '600')} = <span class="c">11,1 ${MS2}</span></p>`)}`);
  const [F1, m1] = hasard([[50, 20], [3000, 1200], [150, 75], [9000, 1500]]), [F2, mg] = hasard([[0.115, 46], [0.6, 400], [1.5, 250]]);
  c_.aToi(carte, [
    { titre: 'Un véhicule', enonce: `<p>La résultante des forces sur un véhicule de ${fmt(m1)} kg vaut ${fmt(F1)} N.</p>`,
      parties: [{ type: 'nombre', q: 'Calcule son accélération.', label: 'a =', valeur: F1 / m1, unite: MS2, signe: false, rel: .01,
        diag: v => proche(v, F1 * m1, .02) ? 'On divise : a = Σ F / m.' : proche(v, m1 / F1, .02) ? 'Rapport inversé : a = Σ F / m.' : 'a = Σ F / m.', solution: `<p class="crs-calc">a = ${fr(fmt(F1), fmt(m1))} = ${c(fmt(r3(F1 / m1)) + ' ' + MS2)}</p>` }] },
    { titre: 'Une masse en grammes', enonce: `<p>La résultante des forces sur une balle de ${mg} g vaut ${fmt(F2)} N.</p>`,
      parties: [{ type: 'nombre', q: 'Calcule son accélération (3 chiffres significatifs).', label: 'a =', valeur: F2 / (mg / 1000), unite: MS2, signe: false, rel: .01, affiche: fmt(r3(F2 / (mg / 1000))),
        diag: v => proche(v, F2 / mg, .02) ? `Convertis la masse en kg : ${mg} g = ${fmt(mg / 1000)} kg.` : 'a = Σ F / m, avec m en kg.', solution: `<p class="crs-calc">m = ${mg} g = ${fmt(mg / 1000)} kg ; a = ${fr(fmt(F2), fmt(mg / 1000))} ≈ ${c(fmt(r3(F2 / (mg / 1000))) + ' ' + MS2)}</p>` }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p class="crs-formule">a = ${fr('Σ F', 'm')}</p><p>Σ F en N, m en kg, a en m·s<sup>−2</sup> (principe fondamental de la dynamique, module 4).</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_3_questions.html">Questions sur l'accélération →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_4a_cours.html">Module 4 : principe fondamental de la dynamique</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_3.html#forces">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, aRetenir]);
PFD.menu('module_3e_cours');
</script>
</body>
</html>
