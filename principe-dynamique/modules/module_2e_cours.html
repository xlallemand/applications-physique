<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : réaction du support — Chapitre 6 : Principe fondamental de la dynamique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="pfd.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="pfd.js"></script>
<script src="situations.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS 5 / 6</span>
    <h2 class="er-titre">Réaction du support</h2>
    <p class="er-contexte">Le support (sol, table, planche…) touche le système : une bulle dans le diagramme objet-action, <b>une force</b>, la <b>réaction</b> <span class="vec-nom">R</span>. Sans frottement, elle est <b>perpendiculaire au support</b> ; avec frottements, on la décompose : <span class="vec-nom">R</span> = <span class="vec-nom">R</span><sub>N</sub> + <span class="vec-nom">f</span>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 5 du module 2 : la réaction du support. Sans frottement,
   R⃗ₙ perpendiculaire au support (palet d'air-hockey) ; avec
   frottements, R⃗ = R⃗ₙ + f⃗, f⃗ opposée au glissement qu'il y aurait
   sans frottement (brique immobile sur la planche inclinée). Outil
   PFD.bilan arrêté aux noms des forces.
   ============================================================ */
const { exemple } = COURS;
const { nomV, sceneRemplie, diagrammeDe, bilan, SITUATIONS } = PFD;
// exemple : diagramme objet-action à côté du dessin
const figs = s => `<div class="pfd-noms-figs"><div class="pfd-do-cadre">${diagrammeDe(s)}</div><div class="pfd-sc-cadre">${sceneRemplie(s)}</div></div>`;

/* ---------- 1. Sans frottement : la réaction normale ---------- */
function etape1(c_) {
  const carte = c_.carte('1. Sans frottement : la réaction normale');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Règle.</b> <b>Sans frottement</b>, la force du support est <b>perpendiculaire au support</b> : c'est ${nomV('RN')} (N = normale = perpendiculaire). Elle part du point de contact.</p></div>
    </div>
    ${exemple(`<p>${SITUATIONS.brique.enonce}</p>${figs(SITUATIONS.brique)}
      <p>La planche touche la brique : une bulle, une force, ${nomV('RN')}, depuis le point de contact A, perpendiculaire à la planche (ici verticale, vers le haut).</p>`)}`);
  c_.aToi(carte, [Object.assign({ titre: 'Le palet d\'air-hockey' }, bilan(SITUATIONS.palet, { jusqua: 'noms' }))]);
  return carte;
}

/* ---------- 2. Avec frottements : R⃗ = R⃗ₙ + f⃗ ---------- */
function etape2(c_) {
  const carte = c_.carte('2. Avec frottements : <span class="vec-nom">R</span> = <span class="vec-nom">R</span><sub>N</sub> + <span class="vec-nom">f</span>');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p class="crs-formule">${nomV('R')} = ${nomV('RN')} + ${nomV('f')}</p>
        <ul class="er-liste"><li>${nomV('RN')} : perpendiculaire au support ;</li>
        <li>${nomV('f')} : les <b>frottements</b>, parallèles au support, <b>opposés au mouvement</b> qu'il y aurait si le solide glissait sans frottement.</li></ul>
        <p>Dans le diagramme objet-action, le support garde <b>une seule bulle</b> : on écrit ${nomV('RN')} + ${nomV('f')} sur son trait.</p></div>
    </div>
    ${exemple(`<p>${SITUATIONS.livre.enonce}</p>${figs(SITUATIONS.livre)}
      <p>La table donne une force, qu'on décompose : ${nomV('RN')}, perpendiculaire à la table, et ${nomV('f')}, vers la gauche (opposée au glissement). La corde donne ${nomV('F')}, la Terre ${nomV('P')}.</p>`)}`);
  c_.aToi(carte, [Object.assign({ titre: 'La brique sur la planche inclinée' }, bilan(SITUATIONS.incline, { jusqua: 'noms' }))]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p class="crs-formule">${nomV('R')} = ${nomV('RN')} + ${nomV('f')}</p><p>Sans frottement, la réaction du support est perpendiculaire au support (${nomV('RN')}) ; les frottements ${nomV('f')} sont parallèles au support et s'opposent au glissement. Dans le diagramme, une seule bulle pour le support.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2f_cours.html">Cours : forces qui se compensent →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html#reaction">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
PFD.menu('module_2e_cours');
</script>
</body>
</html>
