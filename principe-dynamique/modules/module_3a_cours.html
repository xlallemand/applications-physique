<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : définition de l'accélération — Chapitre 6 : Principe fondamental de la dynamique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="pfd.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="pfd.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · COURS 1 / 5</span>
    <h2 class="er-titre">Définition de l'accélération</h2>
    <p class="er-contexte">L'<b>accélération</b> est la <b>dérivée de la vitesse</b> : elle mesure la <b>variation de la vitesse</b> au cours du temps. Selon ce que l'on connaît, il y a <b>quatre façons</b> de la calculer. Unité : le <b>m·s<sup>−2</sup></b>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 1 du module 3 : définition : a = dv/dt (= v′), la variation de la vitesse,
   en m·s⁻² ; les quatre façons de calculer a, selon ce que l'on connaît
   (l'élève choisit la façon qui convient à chaque situation).
   ============================================================ */
const { fmt, hasard, melanger, exemple } = COURS;
const { o, fr, proche } = PFD;
const c = h => `<span class="c">${h}</span>`;
const r3 = v => +v.toPrecision(3);
const MS2 = 'm·s<sup>−2</sup>';

/* ---------- 1. Définition, et les quatre façons de calculer a ---------- */
const FACONS = [o('derivee', 'a = v′ : on dérive v(t)'), o('nulle', 'a = 0'), o('delta', 'a = Δv / Δt'), o('pfd', 'a = Σ F / m')];
// situations : [façon, texte]
const SITU_A = [
  ['derivee', 'On connaît la vitesse d\'un train en fonction du temps : v = 0,5 t + 12.'], ['derivee', 'La vitesse d\'une fusée au décollage s\'écrit v = 30 t.'],
  ['nulle', 'Une voiture roule en ligne droite à 90 km/h constants.'], ['nulle', 'Un tapis roulant avance à 0,5 m/s, sans changer de vitesse.'],
  ['delta', 'Un cycliste passe de 4 m/s à 10 m/s en 3 s (accélération considérée constante).'], ['delta', 'Une moto passe de 0 à 100 km/h en 4 s (accélération considérée constante).'],
  ['pfd', 'La résultante des forces qui s\'exercent sur un chariot de 20 kg vaut 50 N.'], ['pfd', 'On connaît la masse d\'une voiture et toutes les forces qui s\'exercent sur elle.'],
];
const IND_A = {
  derivee: 'On connaît l\'expression de la vitesse en fonction du temps : on la dérive.',
  nulle: 'La vitesse ne change pas : elle ne varie pas.',
  delta: 'On connaît une vitesse de départ, une vitesse d\'arrivée et une durée.',
  pfd: 'On connaît des forces et une masse : c\'est le principe fondamental de la dynamique.',
};
function etape1(c_) {
  const carte = c_.carte('1. L\'accélération : la dérivée de la vitesse');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Définition (à connaître).</b> L'accélération est la <b>dérivée de la vitesse</b> par rapport au temps :</p>
        <p class="crs-formule">a = ${fr('dv', 'dt')} = v′ &nbsp; en m·s<sup>−2</sup></p></div>
      <p>Elle correspond à la <b>variation de la vitesse</b> au cours du temps : a &gt; 0 quand la vitesse augmente, a &lt; 0 quand elle diminue, a = 0 quand elle ne change pas.</p>
      <div class="cle"><p><b class="cle-titre">Comment calculer l'accélération ?</b> Il y a quatre façons, selon ce que l'on connaît :</p>
        <div class="pfd-cas">
          <div class="pfd-cas-c"><span class="pfd-cas-t">1<sup>re</sup> façon</span><p>On a l'<b>expression</b> (la formule) de la vitesse en fonction du temps, v(t) : on la dérive.</p><p class="pfd-cas-f">a = v′</p></div>
          <div class="pfd-cas-c"><span class="pfd-cas-t">2<sup>e</sup> façon</span><p>La vitesse est <b>constante</b>.</p><p class="pfd-cas-f">a = 0</p></div>
          <div class="pfd-cas-c"><span class="pfd-cas-t">3<sup>e</sup> façon</span><p>On a une <b>vitesse de départ</b> et une <b>vitesse d'arrivée</b>, et on considère l'accélération constante.</p><p class="pfd-cas-f">a = ${fr('Δv', 'Δt')}</p></div>
          <div class="pfd-cas-c"><span class="pfd-cas-t">4<sup>e</sup> façon</span><p>On a les <b>forces</b> (et la masse) : principe fondamental de la dynamique (<a href="module_4a_cours.html">module 4</a>).</p><p class="pfd-cas-f">a = ${fr('Σ F', 'm')}</p></div>
        </div></div>
    </div>
    ${exemple(`<p>a = 2,5 ${MS2} : la vitesse augmente de 2,5 m/s chaque seconde.<br>a = −2 ${MS2} : la vitesse diminue de 2 m/s chaque seconde.<br>a = 0 : la vitesse ne change pas.</p>`)}`);
  // une situation de chaque façon : l'élève choisit la façon de calculer a
  const choisies = ['derivee', 'nulle', 'delta', 'pfd'].map(k => hasard(SITU_A.filter(s => s[0] === k)));
  c_.aToi(carte, melanger(choisies).map((s, k) => ({ titre: `Situation ${k + 1}`, enonce: `<p>${s[1]}</p>`,
    parties: [{ type: 'choix', q: 'Comment calculer l\'accélération ?', options: FACONS, bonne: s[0], melanger: false,
      indices: FACONS.reduce((m, x) => (x.id === s[0] ? m : Object.assign(m, { [x.id]: IND_A[s[0]] })), {}), solution: `<p>${IND_A[s[0]]}</p>` }] })));
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p class="crs-formule">a = ${fr('dv', 'dt')} = v′ &nbsp; en m·s<sup>−2</sup></p><p>L'accélération est la dérivée de la vitesse : la variation de la vitesse au cours du temps (à connaître).</p></div>
    <div class="cle"><p><b>Quatre façons</b> de calculer a, selon ce que l'on connaît :</p>
      <ul class="er-liste"><li>l'expression de v(t) : <b>a = v′</b> ;</li><li>une vitesse constante : <b>a = 0</b> ;</li>
      <li>une vitesse de départ et d'arrivée (a considérée constante) : <b>a = Δv / Δt</b> ;</li>
      <li>les forces : <b>a = Σ F / m</b> (principe fondamental de la dynamique, module 4).</li></ul></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_3b_cours.html">Cours : dériver la vitesse →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_3.html#definition">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, aRetenir]);
PFD.menu('module_3a_cours');
</script>
</body>
</html>
