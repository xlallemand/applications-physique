<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : force de l'air — Chapitre 6 : Principe fondamental de la dynamique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="pfd.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="pfd.js"></script>
<script src="situations.js"></script>

</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS 3 / 6</span>
    <h2 class="er-titre">Force de l'air</h2>
    <p class="er-contexte">L'air <b>touche toujours</b> le système : il a toujours sa bulle dans le diagramme objet-action. Sa force est souvent <b>négligeable</b>, mais pas toujours : <b>frottements</b> de l'air ou <b>poussée d'Archimède</b>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 3 du module 2 : l'air touche toujours le système ; sa
   force est souvent négligée, sauf frottements (F⃗air) ou poussée
   d'Archimède (F⃗archi). Puis la force de l'air dans le diagramme
   objet-action (trait barré ou nom de la force) : ballon avant et après
   la frappe, outil PFD.bilan (parachutiste) arrêté au tracé.
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { nomV, sceneRemplie, diagrammesDe, bilan, OPTS_AIR, REGLE_AIR, SITUATIONS, BALLON } = PFD;

/* ---------- 1. L'air touche toujours le système ---------- */
// situations : [texte, réponse ('oui' : négligeable, 'frottements', 'archi'), explication]
const AIRS = [
  ['Une brique est posée sur une table.', 'oui', 'Immobile, et lourde pour son volume : on néglige la force de l\'air.'],
  ['Une pomme tombe d\'un arbre (chute de 2 m).', 'oui', 'Chute courte, vitesse faible : on néglige la force de l\'air.'],
  ['Une bille roule lentement sur une table.', 'oui', 'Vitesse faible, petite surface : on néglige la force de l\'air.'],
  ['Un parachutiste descend, parachute ouvert.', 'frottements', 'Le parachute a une très grande surface : les frottements de l\'air freinent la chute.'],
  ['Une voiture roule sur l\'autoroute à 130 km/h.', 'frottements', 'Grande vitesse, grande surface : les frottements de l\'air ne sont pas négligeables.'],
  ['Une feuille de papier tombe en virevoltant.', 'frottements', 'Très légère et de grande surface : les frottements de l\'air la freinent beaucoup.'],
  ['Une montgolfière s\'élève dans le ciel.', 'archi', 'L\'air chaud de l\'enveloppe la rend très légère pour son volume : la poussée d\'Archimède de l\'air la fait monter.'],
  ['Un ballon de baudruche gonflé à l\'hélium monte vers le plafond.', 'archi', 'Très léger pour son volume : la poussée d\'Archimède de l\'air le fait monter.'],
  ['Un dirigeable flotte dans l\'air, immobile.', 'archi', 'Rempli d\'hélium, très léger pour son volume : la poussée d\'Archimède de l\'air compense son poids.'],
];
function etape1(c_) {
  const carte = c_.carte('1. L\'air touche toujours le système');
  c_.ajouter(carte, `<div class="cours-bloc">
      <p>Sauf dans le vide ou dans un liquide, le système est entouré d'air : <b>l'air le touche toujours</b>. Il y a donc <b>toujours une force de l'air</b>, une force de contact.</p>
      <div class="cle"><p><b class="cle-titre">Règle.</b> On <b>néglige</b> souvent la force de l'air, sauf :</p>
        <ul class="er-liste"><li>quand les <b>frottements de l'air</b> ne sont pas négligeables (grande vitesse, grande surface : parachute, voiture rapide, ballon frappé fort…) ; la force de l'air se note alors ${nomV('Fair')} ;</li>
        <li>quand la <b>poussée d'Archimède</b> de l'air n'est pas négligeable (système très léger pour son volume : montgolfière, ballon de baudruche gonflé à l'hélium).</li></ul></div>
      <div class="cle"><p><b class="cle-titre">Notation.</b> La poussée d'Archimède, exercée par un fluide (l'air, l'eau, l'huile…), se note <b>${nomV('Farchi')}</b>. Elle est verticale, vers le haut.</p></div>
    </div>
    ${exemple(`<div class="pfd-sc-cadre">${sceneRemplie(SITUATIONS.helium)}</div>
      <p>${SITUATIONS.helium.enonce} L'air touche le ballon, et sa poussée d'Archimède n'est pas négligeable : ${nomV('Farchi')}, depuis G, vers le haut. Elle compense le poids ${nomV('P')} et la force ${nomV('T')} de la ficelle : sa flèche est aussi longue que les deux autres réunies.</p>`)}`);
  // une situation de chaque sorte : force de l'air négligeable, frottements, poussée d'Archimède
  const choisies = ['oui', 'frottements', 'archi'].map(r => hasard(AIRS.filter(a => a[1] === r)));
  const ind = { oui: REGLE_AIR, frottements: 'Ici, les frottements de l\'air sont-ils vraiment importants ? Grande vitesse ? Grande surface ?', archi: 'Le système est-il très léger pour son volume, comme une montgolfière ou un ballon d\'hélium ?' };
  c_.aToi(carte, melanger(choisies).map((a, k) => ({ titre: `Situation ${k + 1}`, enonce: `<p>${a[0]}</p>`,
    parties: [{ type: 'choix', q: 'L\'air touche le système : peut-on négliger sa force ?', options: OPTS_AIR, bonne: a[1], melanger: false, colonne: true,
      indices: OPTS_AIR.reduce((m, x) => (x.id === a[1] ? m : Object.assign(m, { [x.id]: ind[x.id] })), {}), solution: `<p>${a[2]}</p>` }] })));
  return carte;
}

/* ---------- 2. La force de l'air dans le diagramme objet-action ---------- */
function etape2(c_) {
  const carte = c_.carte('2. La force de l\'air dans le diagramme objet-action');
  const deux = [BALLON[0], BALLON[2]], dos = diagrammesDe(deux);
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Méthode.</b> L'air est un objet en contact : il a <b>toujours sa bulle</b> dans le diagramme, reliée au système par un trait plein.</p>
        <ul class="er-liste"><li>Force négligeable : trait <b>barré</b> ; on ne la dessine pas sur le schéma.</li>
        <li>Sinon, on écrit son nom sur le trait : ${nomV('Fair')} (frottements, opposés au mouvement) ou ${nomV('Farchi')} (poussée d'Archimède, verticale vers le haut), et on la dessine.</li></ul></div>
    </div>
    ${exemple(`<div class="pfd-ballon deux">${deux.map((b, k) => `<figure><p class="pfd-ballon-t">${b.titre}</p>${dos[k]}${sceneRemplie(b, { aria: 'Ballon ' + b.titre.toLowerCase() + ' : bilan des forces' })}</figure>`).join('')}</div>
      <p>Avant la frappe, le ballon est immobile : la force de l'air est négligeable, son trait est barré. Après la frappe, le ballon va vite : les frottements de l'air ne sont plus négligeables, on écrit ${nomV('Fair')} sur le trait et on dessine la force, opposée au mouvement.</p>`)}`);
  c_.aToi(carte, [Object.assign({ titre: 'Le parachutiste' }, bilan(SITUATIONS.parachute, { jusqua: 'trace' }))]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>L'<b>air</b> touche toujours le système : on néglige sa force, sauf si ses frottements (${nomV('Fair')}) ou sa poussée d'Archimède (${nomV('Farchi')}, verticale vers le haut) ne sont pas négligeables.</p></div>
    <div class="cle"><p>Dans le diagramme objet-action, l'air a toujours sa bulle : trait barré si sa force est négligeable, sinon le nom de sa force sur le trait.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2d_cours.html">Cours : poids →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html#air">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
PFD.menu('module_2c_cours');
</script>
</body>
</html>
