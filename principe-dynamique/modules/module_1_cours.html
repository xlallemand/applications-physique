<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 : référentiel et nature du mouvement — Chapitre 6 : Principe fondamental de la dynamique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="pfd.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="pfd.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 1 · COURS</span>
    <h2 class="er-titre">Référentiel et nature du mouvement</h2>
    <p class="er-contexte">Un mouvement se décrit toujours <b>par rapport à</b> un objet de référence : le <b>référentiel</b>. On le décrit ensuite avec <b>deux mots</b> : la <b>trajectoire</b> (rectiligne, circulaire ou curviligne), puis la <b>vitesse</b> (uniforme, accéléré, décéléré ou ralenti).</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Référentiel (terrestre, géocentrique, héliocentrique), référentiel
   galiléen, description d'un mouvement en deux mots (trajectoire, puis
   vitesse) d'après une chronophotographie animée (PFD.chrono, outil
   PFD.partieMouvement).
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { o, chrono, partieMouvement } = PFD;

/* ---------- 1. Le référentiel ---------- */
const REFS = [o('ter', 'terrestre'), o('geo', 'géocentrique'), o('helio', 'héliocentrique')];
const SITU_REF = [
  ['ter', 'Une voiture roule sur une autoroute.'], ['ter', 'Un skieur descend une piste.'], ['ter', 'Un avion décolle de la piste.'],
  ['geo', 'Un satellite tourne autour de la Terre.'], ['geo', 'La Lune tourne autour de la Terre.'],
  ['helio', 'Mars tourne autour du Soleil.'], ['helio', 'Une comète passe près du Soleil.'],
];
const IND_REF = {
  ter: 'Le référentiel terrestre (le sol, un bâtiment) convient pour les mouvements à la surface de la Terre.',
  geo: 'Le référentiel géocentrique (centre de la Terre et trois étoiles lointaines) sert pour les satellites et la Lune.',
  helio: 'Le référentiel héliocentrique (centre du Soleil et trois étoiles lointaines) sert pour les planètes et les comètes.',
};
function qRef(titre, sit) {
  const ind = {};
  REFS.forEach(r => { if (r.id !== sit[0]) ind[r.id] = IND_REF[r.id] + ' Est-ce adapté ici ?'; });
  return { titre, enonce: `<p>${sit[1]}</p>`, parties: [{ type: 'choix', q: 'Quel référentiel est le plus adapté pour étudier ce mouvement ?', options: REFS, bonne: sit[0], melanger: false, indices: ind, solution: `<p>${IND_REF[sit[0]]}</p>` }] };
}
function etape1(c_) {
  const carte = c_.carte('1. Le référentiel');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Définition.</b> Le <b>référentiel</b> est le solide de référence par rapport auquel on étudie le mouvement du <b>système</b>.</p></div>
      <ul class="er-liste"><li><b>terrestre</b> : le sol, un bâtiment (le plus souvent) ;</li><li><b>géocentrique</b> : le centre de la Terre (satellites, Lune) ;</li><li><b>héliocentrique</b> : le centre du Soleil (planètes).</li></ul>
    </div>
    ${exemple('<p>Un voyageur assis dans un train qui roule est <b>immobile</b> dans le référentiel du train, mais <b>en mouvement</b> dans le référentiel terrestre (le quai). Le mouvement dépend du référentiel choisi.</p>')}`);
  const [a, b, c] = ['ter', 'geo', 'helio'].map(k => hasard(SITU_REF.filter(x => x[0] === k)));
  c_.aToi(carte, melanger([a, b, c]).map((s, k) => qRef(`Situation ${k + 1}`, s)));
  return carte;
}

/* ---------- 2. Le référentiel galiléen ---------- */
function etape2(c_) {
  const carte = c_.carte('2. Le référentiel galiléen');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Définition.</b> Un référentiel est <b>galiléen</b> si le <b>principe d'inertie</b> y est vérifié. Un référentiel immobile ou en <b>mouvement rectiligne uniforme</b> par rapport à un référentiel galiléen est lui aussi galiléen.</p></div>
      <p>Pour des expériences courtes à la surface de la Terre, le référentiel <b>terrestre</b> est considéré comme galiléen.</p>
    </div>
    ${exemple('<p>Un train qui roule en ligne droite à vitesse constante est un référentiel galiléen. Un train qui freine ne l\'est pas : un objet posé sur la tablette glisse vers l\'avant sans qu\'aucune force ne le pousse.</p>')}`);
  const q = (titre, enonce, bonne, ind, sol) => ({ titre, enonce: `<p>${enonce}</p>`, parties: [{ type: 'choix', q: 'Ce référentiel peut-il être considéré comme galiléen ?', options: [o('oui', 'oui'), o('non', 'non')], bonne, melanger: false, indices: { [bonne === 'oui' ? 'non' : 'oui']: ind }, solution: `<p>${sol}</p>` }] });
  c_.aToi(carte, melanger([
    q('Un TGV', 'Le référentiel d\'un TGV qui roule en ligne droite à 300 km/h constants.', 'oui', 'Un mouvement rectiligne <b>uniforme</b> par rapport au sol : regarde la définition.', 'Mouvement rectiligne uniforme par rapport au référentiel terrestre (galiléen) : il est galiléen.'),
    q('Un bus qui démarre', 'Le référentiel d\'un bus qui démarre.', 'non', 'Le bus accélère : son mouvement n\'est pas uniforme.', 'Le bus accélère : ce référentiel n\'est pas galiléen (les passagers sont projetés vers l\'arrière).'),
    q('Une voiture dans un virage', 'Le référentiel d\'une voiture qui prend un virage à vitesse constante.', 'non', 'Le mouvement n\'est pas rectiligne.', 'Le mouvement n\'est pas rectiligne : ce référentiel n\'est pas galiléen.'),
  ]).slice(0, 2));
  return carte;
}

/* ---------- 3. Décrire un mouvement en deux mots ---------- */
const TRAJS = ['rectiligne', 'circulaire', 'curviligne'], VITS = ['uniforme', 'accelere', 'decelere'];
function qMouvement(titre, traj, vit) {
  return { titre, enonce: chrono({ traj, type: vit }), parties: [partieMouvement({ traj, vit })] };
}
function etape3(c_) {
  const carte = c_.carte('3. Décrire un mouvement en deux mots');
  c_.ajouter(carte, `<div class="cours-bloc">
      <p>Une <b>chronophotographie</b> montre les positions successives du système à <b>intervalles de temps égaux</b>. Plus deux positions sont éloignées, plus le système va vite.</p>
      <div class="cle"><p><b class="cle-titre">Méthode.</b> On décrit un mouvement avec <b>deux mots</b> : d'abord la trajectoire, puis la vitesse.</p>
        <div class="pfd-2mots"><div><p class="pfd-2mots-t">1<sup>er</sup> mot : la trajectoire</p><ul class="er-liste">
            <li><b>rectiligne</b> : une droite ;</li><li><b>circulaire</b> : un cercle (ou un arc de cercle) ;</li><li><b>curviligne</b> : une courbe quelconque.</li></ul></div>
          <div><p class="pfd-2mots-t">2<sup>e</sup> mot : la vitesse</p><ul class="er-liste">
            <li><b>uniforme</b> : la vitesse est constante (positions régulièrement espacées) ;</li><li><b>accéléré</b> : la vitesse augmente (positions de plus en plus espacées) ;</li>
            <li><b>décéléré</b> ou <b>ralenti</b> : la vitesse diminue (positions de moins en moins espacées).</li></ul></div></div>
        <p>Exemple : un mouvement <b>rectiligne uniforme</b>, un mouvement <b>circulaire accéléré</b>.</p></div>
    </div>
    ${exemple(`${chrono({ type: 'uniforme', titre: 'Rectiligne uniforme (le mobile va de gauche à droite)' })}${chrono({ traj: 'circulaire', type: 'accelere', titre: 'Circulaire accéléré' })}${chrono({ traj: 'curviligne', type: 'decelere', titre: 'Curviligne décéléré (ou ralenti)' })}`)}`);
  // trois chronophotographies : chaque trajectoire et chaque vitesse une fois
  const vits = melanger(VITS);
  c_.aToi(carte, melanger(TRAJS).map((tr, k) => qMouvement(`Chronophotographie ${k + 1}`, tr, vits[k])));
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>Le <b>référentiel</b> est le solide de référence : terrestre (le plus souvent), géocentrique (satellites), héliocentrique (planètes).</p></div>
    <div class="cle"><p>Un référentiel <b>galiléen</b> vérifie le principe d'inertie ; il est immobile ou en mouvement rectiligne uniforme par rapport à un autre référentiel galiléen. Le référentiel terrestre est considéré comme galiléen.</p></div>
    <div class="cle"><p>Un mouvement se décrit avec <b>deux mots</b> : la trajectoire (<b>rectiligne</b>, <b>circulaire</b> ou <b>curviligne</b>), puis la vitesse (<b>uniforme</b>, <b>accéléré</b>, <b>décéléré</b> ou <b>ralenti</b>). Exemple : mouvement rectiligne uniforme.</p>
      <p>Chronophotographie : positions régulièrement espacées → uniforme ; de plus en plus espacées → accéléré ; de moins en moins espacées → décéléré (ralenti).</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_1_questions.html">Questions sur le référentiel et le mouvement →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_2_cours.html">Module 2 : bilan des forces</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_1.html">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
PFD.menu('module_1_cours');
</script>
</body>
</html>
