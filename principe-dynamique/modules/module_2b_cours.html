<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : méthode du diagramme objet-action — Chapitre 6 : Principe fondamental de la dynamique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="pfd.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="pfd.js"></script>
<script src="situations.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS 2 / 6</span>
    <h2 class="er-titre">Méthode du diagramme objet-action</h2>
    <p class="er-contexte">Pour faire le <b>bilan des forces</b>, on utilise <b>toujours</b> la même méthode : le <b>diagramme objet-action</b>. Elle permet de lister toutes les forces <b>sans en oublier</b> et <b>sans en inventer</b>. On dessine d'abord le diagramme, puis les forces sur le schéma.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 2 du module 2 : la méthode du diagramme objet-action,
   à utiliser partout. 1. Dessiner le diagramme : les trois actions à
   distance (la Terre toujours, plus rarement un aimant ou un objet
   électrisé), puis une bulle pour chaque objet en contact (chacun donne
   une force) ; outil PFD.bilan arrêté au diagramme. 2. Dessiner les
   forces sur le schéma : exemple du ballon (PFD.ballonHTML), outil
   PFD.bilan arrêté au tracé.
   ============================================================ */
const { exemple } = COURS;
const { nomV, scene, diagrammeDe, bilan, SITUATIONS } = PFD;

/* ---------- 1. Dessiner le diagramme objet-action ---------- */
function etape1(c_) {
  const carte = c_.carte('1. Dessiner le diagramme objet-action');
  const clou = SITUATIONS.clou;
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Méthode.</b> À utiliser <b>partout</b>. On écrit le <b>système</b> dans une bulle, au centre, puis on dessine :</p>
        <ol class="er-liste"><li>les <b>trois actions à distance</b> possibles : il y a <b>toujours la Terre</b>, plus rarement un aimant ou un objet électrisé ; trait en <b>pointillés</b> ;</li>
        <li><b>une bulle pour chaque objet en contact</b> avec le système, l'air compris ; trait <b>plein</b>. <b>Chacun donne une force.</b></li></ol>
        <p>Une force négligeable (souvent celle de l'air) : trait <b>barré</b>. Le <b>nom de la force</b> s'écrit sur le trait.</p></div>
    </div>
    ${exemple(`<p>${clou.enonce}</p><div class="pfd-noms-figs"><div class="pfd-sc-cadre">${scene(clou, { aria: clou.titre })}</div><div class="pfd-do-cadre">${diagrammeDe(clou)}</div></div>
      <p>À distance : la Terre (toujours) et l'aimant, en pointillés. Contact : le sol et l'air, en trait plein ; la force de l'air est négligeable, son trait est barré. Quatre bulles, dont une barrée : <b>trois forces</b>, ni plus ni moins : ${nomV('P')}, ${nomV('Fmag')} et ${nomV('R')}.</p>`)}`);
  c_.aToi(carte, [Object.assign({ titre: 'La brique sur la planche' }, bilan(SITUATIONS.brique, { jusqua: 'diagramme' })),
    Object.assign({ titre: 'La boule et le bâton frotté' }, bilan(SITUATIONS.ebonite, { jusqua: 'diagramme' }))]);
  return carte;
}

/* ---------- 2. Dessiner les forces sur le schéma ---------- */
function etape2(c_) {
  const carte = c_.carte('2. Dessiner les forces sur le schéma');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Méthode.</b> On dessine ensuite sur le schéma <b>la force de chaque bulle</b> (sauf trait barré), sans souci d'échelle :</p>
        <ul class="er-liste"><li>une force <b>à distance</b> part du <b>centre G</b> du système ;</li><li>une force <b>de contact</b> part du <b>point de contact</b>.</li></ul>
        <p>Pour chaque force : sa <b>direction</b> et son <b>sens</b>.</p></div>
    </div>
    ${exemple(`<p>Bilan des forces qui s'exercent sur un <b>ballon</b> de foot : le diagramme objet-action, puis les forces dessinées.</p>${PFD.ballonHTML()}`)}`);
  c_.aToi(carte, [Object.assign({ titre: 'La masse suspendue au ressort' }, bilan(SITUATIONS.ressort, { jusqua: 'trace' })),
    Object.assign({ titre: 'La balle lancée' }, bilan(SITUATIONS.balle, { jusqua: 'trace' }))]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p><b>Diagramme objet-action</b>, à utiliser partout : il liste toutes les forces, sans en oublier et sans en inventer. Le système au centre, puis :</p>
      <ul class="er-liste"><li>les actions à distance : la Terre (toujours), plus rarement un aimant ou un objet électrisé ; trait en pointillés ;</li>
      <li>une bulle pour chaque objet en contact, l'air compris ; trait plein ; chacun donne une force ;</li><li>trait barré : force négligeable.</li></ul></div>
    <div class="cle"><p>On dessine ensuite les forces sur le schéma : à distance depuis le centre G, de contact depuis le point de contact.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2c_cours.html">Cours : force de l'air →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html#diagramme">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
PFD.menu('module_2b_cours');
</script>
</body>
</html>
