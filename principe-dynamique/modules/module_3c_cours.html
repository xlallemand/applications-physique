<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : vitesse constante — Chapitre 6 : Principe fondamental de la dynamique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="pfd.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="pfd.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · COURS 3 / 5</span>
    <h2 class="er-titre">Vitesse constante</h2>
    <p class="er-contexte">2<sup>e</sup> façon : la vitesse est <b>constante</b>, elle ne varie pas : l'accélération est <b>nulle</b>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Sous-module 3 du module 3 : 2e façon de calculer a : vitesse constante, a = 0.
   Erreur diagnostiquée : vitesse prise pour a.
   ============================================================ */
const { fmt, hasard, melanger, exemple } = COURS;
const { o, fr, proche } = PFD;
const c = h => `<span class="c">${h}</span>`;
const r3 = v => +v.toPrecision(3);
const MS2 = 'm·s<sup>−2</sup>';

/* ---------- 1. 2e façon : vitesse constante, a = 0 ---------- */
function etape1(c_) {
  const carte = c_.carte('1. Vitesse constante : a = 0');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p>Si la <b>vitesse est constante</b>, elle ne varie pas : son accélération est <b>nulle</b>.</p>
        <p class="crs-formule">a = 0</p>
        <p>(La dérivée d'une constante est nulle.)</p></div>
    </div>
    ${exemple(`<p>Un TGV roule en ligne droite à 300 km/h constants : sa vitesse ne change pas.</p><p class="crs-calc">a = <span class="c">0 ${MS2}</span></p>`)}`);
  const vt = hasard([0.5, 0.6, 1.2]), [vb, nb] = hasard([[8, 'un bateau'], [12, 'un camion'], [25, 'un train']]);
  c_.aToi(carte, [
    { titre: 'Un tapis roulant', enonce: `<p>Un tapis roulant avance toujours à ${fmt(vt)} m/s.</p>`,
      parties: [{ type: 'nombre', q: 'Quelle est l\'accélération d\'une valise posée sur le tapis ?', label: 'a =', valeur: 0, unite: MS2, tol: .001,
        diag: v => proche(v, vt) ? `${fmt(vt)} m/s est la vitesse, pas sa variation : la vitesse ne change pas.` : 'La vitesse est constante : elle ne varie pas.', solution: `<p class="crs-calc">Vitesse constante : a = ${c('0 ' + MS2)}</p>` }] },
    { titre: 'Une vitesse qui ne dépend pas du temps', enonce: `<p>La vitesse de ${nb} s'écrit v = ${vb} (v en m/s), quel que soit t.</p>`,
      parties: [{ type: 'nombre', q: 'Quelle est son accélération ?', label: 'a =', valeur: 0, unite: MS2, tol: .001,
        diag: v => proche(v, vb) ? `La dérivée d'une constante est nulle : v′ = 0.` : 'a = v′, et v ne dépend pas de t.', solution: `<p class="crs-calc">v = ${vb} est constante : a = v′ = ${c('0 ' + MS2)}</p>` }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>Vitesse constante : <b>a = 0</b> (la vitesse ne varie pas ; la dérivée d'une constante est nulle).</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_3d_cours.html">Cours : accélération constante →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_3.html#constante">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, aRetenir]);
PFD.menu('module_3c_cours');
</script>
</body>
</html>
