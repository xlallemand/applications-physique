<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 5 : Vérification — Méthodes</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="ptools.css">
<script src="../../assets/nav.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="ptools.js"></script>
<style>
  .formula-line { font-size:1.05rem; font-weight:700; color:var(--app-accent-800); text-align:center; margin:10px 0; }
</style>
</head>
<body class="bg-gradient-to-br from-violet-50 to-purple-100 min-h-screen">
<div id="app-nav"></div>
<div class="container mx-auto px-4 py-8 max-w-3xl" id="app"></div>

<script>
const bank = [
  { type: 'qcm', text: "On veut calculer le coefficient de proportionnalité k reliant y (grandeur B) à x (grandeur A), avec y = k &times; x. Quelle formule donne k ?",
    options: ['k = y / x', 'k = x / y', 'k = y &times; x', 'k = y + x'], correct: 0 },

  { type: 'drag', text: "Un sirop se prépare avec une dose D proportionnelle au volume d'eau V. On sait que D = 40 mL correspond à V = 200 mL. Construis le produit en croix qui permet de trouver le volume V correspondant à D = 100 mL.",
    chips: [
      { id: 'a1', label: '40 mL' }, { id: 'b1', label: '200 mL' }, { id: 'a2', label: '100 mL' },
      { id: 'x1', label: '0,4 L' }, { id: 'x2', label: '500 mL' },
    ],
    lines: [ { tokens: ['slot:a1', '&times; ?', '=', 'slot:a2', '&times;', 'slot:b1'] } ],
  },

  { type: 'qcm', text: "Que calcule-t-on en premier lorsqu'on utilise la méthode du « retour à l'unité » ?",
    options: [
      'La valeur de la grandeur B correspondant à 1 unité de la grandeur A',
      'Le produit des quatre valeurs du tableau',
      'La somme des deux grandeurs',
      'La moyenne des deux grandeurs',
    ], correct: 0 },

  { type: 'drag', text: "Une résistance chauffante dissipe une énergie E proportionnelle à la durée t de fonctionnement. On sait : t = 4 s &rarr; E = 120 J. Construis le calcul du coefficient k (la puissance), puis celui de l'énergie E&sup2; dissipée en 15 s.",
    chips: [
      { id: 'e1', label: '120 J' }, { id: 't1', label: '4 s' }, { id: 't2', label: '15 s' },
      { id: 'x1', label: '120 s' }, { id: 'x2', label: '4 J' },
    ],
    lines: [
      { label: 'Coefficient (puissance) :', tokens: ['k', '=', 'slot:e1', '/', 'slot:t1'] },
      { label: 'Énergie recherchée :', tokens: ['E&sup2;', '=', 'k', '&times;', 'slot:t2'] },
    ],
  },

  { type: 'qcm', text: "Dans un tableau de proportionnalité, pourquoi est-il indispensable d'indiquer les unités de chaque grandeur ?",
    options: [
      'Pour repérer si une conversion est nécessaire avant de calculer',
      'Uniquement pour que le tableau soit plus joli',
      'Les unités n\'ont aucune importance dans un calcul',
      'Pour remplacer les nombres',
    ], correct: 0 },

  { type: 'drag', text: "Une pile alimente un circuit où 3 lampes identiques en série se répartissent 9 V à parts égales. Construis le calcul par retour à l'unité pour trouver la tension nécessaire pour 5 lampes identiques.",
    chips: [
      { id: 'u1', label: '9 V' }, { id: 'n1', label: '3' }, { id: 'n2', label: '5' },
      { id: 'x1', label: '9 lampes' }, { id: 'x2', label: '3 V' },
    ],
    lines: [
      { label: '1 lampe :', tokens: ['slot:u1', '/', 'slot:n1'] },
      { label: '5 lampes :', tokens: ['(9/3)', '&times;', 'slot:n2'] },
    ],
  },

  { type: 'qcm', text: "On a calculé k = 15 (g/L) pour une solution, à partir de m = 15 g dissous dans V = 1 L. Que représente ce nombre 15 ?",
    options: [
      'La masse (en g) dissoute dans 1 L de solution',
      'Le volume (en L) contenant 1 g de soluté',
      'La masse totale de solution, quel que soit le volume',
      'Un simple hasard de calcul, sans signification physique',
    ], correct: 0 },
];
let idx = 0, score = 0, answers = [];
function maxScore() { return bank.reduce((s,q) => s + (q.type==='qcm' ? 1 : countSlots(q)), 0); }
function countSlots(q) { return q.lines.reduce((s,l) => s + l.tokens.filter(t => t.startsWith('slot:')).length, 0); }

function renderIntro() {
  document.getElementById('app').innerHTML = `
    <div class="bg-white rounded-xl shadow-lg p-6">
      <span class="content-module-badge">MODULE 5</span>
      <h2 class="text-2xl font-bold text-[var(--app-accent-800)] mb-3">Vérification des connaissances</h2>
      <p class="text-gray-700 mb-2">QCM et glisser-déposer sur les trois méthodes de calcul (tableau, coefficient, retour à l'unité). Il ne s'agit ici que de <b>construire le calcul</b>, pas de donner un résultat numérique.</p>
      <button onclick="start()" class="btn-primary mt-2">Commencer →</button>
    </div>`;
}
function start() { idx = 0; score = 0; answers = []; render(); }

function tokenHtml(tok, chipsById) {
  if (tok.startsWith('slot:')) {
    const id = tok.slice(5);
    return ptSlot(id, '?');
  }
  return `<span>${tok}</span>`;
}

function render() {
  if (idx >= bank.length) return finish();
  const q = bank[idx];
  const app = document.getElementById('app');
  const head = ptHeader({ badge: 'MODULE 5', title: 'Vérification des connaissances', idx, total: bank.length, score });

  if (q.type === 'qcm') {
    app.innerHTML = head + `
      <div class="bg-white rounded-xl shadow-lg p-6">
        <p class="text-gray-700 text-lg mb-4">${q.text}</p>
        <div id="opts">${q.options.map((o,i) => `<button class="mcq-btn" onclick="answerQcm(${i})">${o}</button>`).join('')}</div>
      </div>`;
    return;
  }

  // type === 'drag'
  const linesHtml = q.lines.map(l => `
    <div class="mb-2">
      ${l.label ? `<div class="text-sm font-bold text-gray-500 mb-1">${l.label}</div>` : ''}
      <div class="formula-line">${l.tokens.map(t => tokenHtml(t)).join(' ')}</div>
    </div>`).join('');
  app.innerHTML = head + `
    <div class="bg-white rounded-xl shadow-lg p-6">
      <p class="text-gray-700 text-lg mb-3">${q.text}</p>
      <div class="pt-palette">${q.chips.map(c => ptChip(c.id, c.label)).join('')}</div>
      ${linesHtml}
      <div class="text-center mt-4"><button id="dragNext" class="btn-primary" style="display:none" onclick="nextQ()">Suite →</button></div>
    </div>`;
  ptWireSlots(document.getElementById('app'), () => {
    score += countSlots(q);
    answers.push({ num: idx+1, pts: countSlots(q), max: countSlots(q) });
    document.getElementById('dragNext').style.display = 'inline-block';
  });
}

function answerQcm(i) {
  const q = bank[idx];
  const ok = i === q.correct;
  document.querySelectorAll('#opts .mcq-btn').forEach((b,bi) => {
    b.disabled = true;
    if (bi === q.correct) b.classList.add('correct');
    else if (bi === i) b.classList.add('wrong');
  });
  if (ok) score += 1;
  answers.push({ num: idx+1, pts: ok?1:0, max: 1 });
  document.getElementById('opts').insertAdjacentHTML('afterend',
    `<div class="text-center mt-4"><button onclick="nextQ()" class="btn-primary">Suite →</button></div>`);
}
function nextQ() { idx++; render(); }

function finish() {
  document.getElementById('app').innerHTML = ptFinish({
    score, max: maxScore(), trueMax: maxScore(),
    title: 'Vérification terminée !', recap: answers,
    restartFn: 'start()', nextHref: 'module_6.html', nextLabel: 'Module 6 : Entraînement →',
  });
}

renderIntro();

const nav = AppNav.init({
  appName: 'Proportionnalité', portalHref: '../../index.html', portalLabel: 'Toutes les applications',
  onHome: () => { window.location.href = '../index.html'; },
  onNavigate: (key) => { window.location.href = key + '.html'; },
  groups: [
    { title: 'Reconnaître', items: [
      { key: 'module_1', label: 'Module 1 : Cours' }, { key: 'module_2', label: 'Module 2 : Vérification' }, { key: 'module_3', label: 'Module 3 : Entraînement' },
    ]},
    { title: 'Utiliser', items: [
      { key: 'module_4', label: 'Module 4 : Cours' }, { key: 'module_5', label: 'Module 5 : Vérification' }, { key: 'module_6', label: 'Module 6 : Entraînement' },
    ]},
    { title: 'Graphique', items: [
      { key: 'module_7', label: 'Module 7 : Cours' }, { key: 'module_8', label: 'Module 8 : Vérification' }, { key: 'module_9', label: 'Module 9 : Entraînement' },
    ]},
  ],
});
nav.setActive('module_5');
nav.setTitle('Module 5 : Vérification');
</script>
</body>
</html>
