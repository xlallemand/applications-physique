<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 9 : Entraînement — Graphique</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="ptools.css">
<script src="../../assets/nav.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="ptools.js"></script>
<style>
  .graph-row { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-bottom:12px; }
  .graph-item { text-align:center; flex:1; min-width:220px; max-width:300px; }
  .formula-line { font-size:1.05rem; font-weight:700; color:var(--app-accent-800); text-align:center; margin:10px 0; }
</style>
</head>
<body class="bg-gradient-to-br from-violet-50 to-purple-100 min-h-screen">
<div id="app-nav"></div>
<div class="container mx-auto px-4 py-8 max-w-3xl" id="app"></div>

<script>
const bank = [
  { type: 'fracdrag', text: "Masse m (g) et volume V (mL) d'un échantillon d'eau sont reliés par le graphique suivant : ils sont donc proportionnels. Le premier point est à l'origine : place les coordonnées du point B pour calculer leur coefficient de proportionnalité.",
    graph: {xMax:10,yMax:10,nx:5,ny:5,xLabel:'V (mL)',yLabel:'m (g)',k:1,intercept:0,showPoints:true,pointA:[0,0],pointB:[8,8]},
    chips: [{id:'num',label:'8 g',value:8,unit:'g'},{id:'den',label:'8 mL',value:8,unit:'mL'},{id:'x1',label:'10 g',value:10,unit:'g'},{id:'x2',label:'10 mL',value:10,unit:'mL'}],
    decimals: 2, name: 'la masse volumique &rho; = m/V' },

  { type: 'qcm', text: "Quelle est l'unité du coefficient directeur du graphique précédent (masse en fonction du volume) ?",
    options: ['g/mL', 'mL/g', 'g', 'mL'], correct: 0 },

  { type: 'fracdrag', text: "Distance d (m) et durée t (s) sont reliées par le graphique suivant : elles sont donc proportionnelles (mouvement à vitesse constante). Place les coordonnées du point B pour calculer leur coefficient de proportionnalité.",
    graph: {xMax:5,yMax:20,nx:5,ny:5,xLabel:'t (s)',yLabel:'d (m)',k:4,intercept:0,showPoints:true,pointA:[0,0],pointB:[4,16]},
    chips: [{id:'num',label:'16 m',value:16,unit:'m'},{id:'den',label:'4 s',value:4,unit:'s'},{id:'x1',label:'20 m',value:20,unit:'m'},{id:'x2',label:'5 s',value:5,unit:'s'}],
    decimals: 2, name: 'la vitesse v = d/t' },

  { type: 'fracdrag', text: "Tension U (V) et intensité I (A) aux bornes d'un conducteur ohmique sont reliées par le graphique suivant : elles sont donc proportionnelles (loi d'Ohm). Place les coordonnées du point B pour calculer leur coefficient de proportionnalité.",
    graph: {xMax:4,yMax:20,nx:4,ny:4,xLabel:'I (A)',yLabel:'U (V)',k:5,intercept:0,showPoints:true,pointA:[0,0],pointB:[3,15]},
    chips: [{id:'num',label:'15 V',value:15,unit:'V'},{id:'den',label:'3 A',value:3,unit:'A'},{id:'x1',label:'20 V',value:20,unit:'V'},{id:'x2',label:'4 A',value:4,unit:'A'}],
    decimals: 2, name: 'la résistance R = U/I' },

  { type: 'qcm', text: "Quelle est l'unité du coefficient directeur du graphique précédent (tension en fonction de l'intensité) ?",
    options: ['&Omega; (V/A)', 'A/V', 'V', 'A'], correct: 0 },

  { type: 'fracdrag', text: "Masse m (g) et quantité de matière n (mol) d'eau sont reliées par le graphique suivant : elles sont donc proportionnelles. Ici, l'origine n'est pas visible : place les <b>variations</b> (et non les valeurs brutes) pour calculer leur coefficient de proportionnalité.",
    graph: {xMin:1,xMax:4,yMin:9,yMax:54,nx:3,ny:5,xLabel:'n (mol)',yLabel:'m (g)',k:18,intercept:0,showPoints:true,pointA:[1,18],pointB:[3,54]},
    chips: [{id:'num',label:'&Delta;m = 36 g',value:36,unit:'g'},{id:'den',label:'&Delta;n = 2 mol',value:2,unit:'mol'},{id:'x1',label:'54 g',value:54,unit:'g'},{id:'x2',label:'3 mol',value:3,unit:'mol'}],
    decimals: 2, name: 'la masse molaire M = &Delta;m/&Delta;n' },

  { type: 'fracdrag', text: "Force F (N) et allongement x (cm) d'un ressort sont reliés par le graphique suivant : ils sont donc proportionnels (loi de Hooke). Place les coordonnées du point B pour calculer leur coefficient de proportionnalité.",
    graph: {xMax:8,yMax:20,nx:4,ny:4,xLabel:'x (cm)',yLabel:'F (N)',k:2.5,intercept:0,showPoints:true,pointA:[0,0],pointB:[6,15]},
    chips: [{id:'num',label:'15 N',value:15,unit:'N'},{id:'den',label:'6 cm',value:6,unit:'cm'},{id:'x1',label:'20 N',value:20,unit:'N'},{id:'x2',label:'8 cm',value:8,unit:'cm'}],
    decimals: 2, name: 'la raideur du ressort k = F/x' },

  { type: 'fracdrag', text: "Masse m (g) de soluté dissous et volume V (L) de solution sont reliés par le graphique suivant : ils sont donc proportionnels. Place les coordonnées du point B pour calculer leur coefficient de proportionnalité.",
    graph: {xMax:1.6,yMax:20,nx:4,ny:4,xLabel:'V (L)',yLabel:'m (g)',k:12.5,intercept:0,showPoints:true,pointA:[0,0],pointB:[1.2,15]},
    chips: [{id:'num',label:'15 g',value:15,unit:'g'},{id:'den',label:'1,2 L',value:1.2,unit:'L'},{id:'x1',label:'20 g',value:20,unit:'g'},{id:'x2',label:'1,6 L',value:1.6,unit:'L'}],
    decimals: 2, name: 'la concentration massique C<sub>m</sub> = m/V' },

  { type: 'fracdrag', text: "Énergie E (J) reçue et durée t (s) sont reliées par le graphique suivant : elles sont donc proportionnelles (source de puissance constante). Place les coordonnées du point B pour calculer leur coefficient de proportionnalité.",
    graph: {xMax:8,yMax:60,nx:4,ny:4,xLabel:'t (s)',yLabel:'E (J)',k:7.5,intercept:0,showPoints:true,pointA:[0,0],pointB:[6,45]},
    chips: [{id:'num',label:'45 J',value:45,unit:'J'},{id:'den',label:'6 s',value:6,unit:'s'},{id:'x1',label:'60 J',value:60,unit:'J'},{id:'x2',label:'8 s',value:8,unit:'s'}],
    decimals: 2, name: 'la puissance P = E/t' },

  { type: 'qcm', text: "Quelle est l'unité du coefficient directeur du graphique précédent (énergie en fonction du temps) ?",
    options: ['W (J/s)', 's/J', 'J', 's'], correct: 0 },
];
let idx = 0, score = 0, answers = [], engine = null, questionDone = false;
function maxScore() { return bank.reduce((s,q) => s + (q.type==='qcm' ? 1 : 2), 0); }

function renderIntro() {
  document.getElementById('app').innerHTML = `
    <div class="bg-white rounded-xl shadow-lg p-6">
      <span class="content-module-badge">MODULE 9</span>
      <h2 class="text-2xl font-bold text-[var(--app-accent-800)] mb-3">Entraînement</h2>
      <p class="text-gray-700 mb-2">Lis les coordonnées des points sur chaque graphique, puis place-les dans le calcul du coefficient de proportionnalité — le résultat s'affiche automatiquement.</p>
      <button onclick="start()" class="btn-primary mt-2">Commencer →</button>
    </div>`;
}
function start() { idx = 0; score = 0; answers = []; render(); }

function render() {
  if (idx >= bank.length) return finish();
  const q = bank[idx];
  const app = document.getElementById('app');
  const head = ptHeader({ badge: 'MODULE 9', title: 'Entraînement', idx, total: bank.length, score });
  questionDone = false;

  if (q.type === 'qcm') {
    app.innerHTML = head + `
      <div class="bg-white rounded-xl shadow-lg p-6">
        <p class="text-gray-700 text-lg mb-4">${q.text}</p>
        <div id="opts">${q.options.map((o,i) => `<button class="mcq-btn" onclick="answerQcm(${i})">${o}</button>`).join('')}</div>
        <div class="text-right mt-2">${ptSkipBtn('skipQ()')}</div>
      </div>`;
    return;
  }

  app.innerHTML = head + `
    <div class="bg-white rounded-xl shadow-lg p-6" id="qCard">
      <p class="text-gray-700 text-lg mb-2">${q.text}</p>
      <div class="graph-row"><div class="graph-item">${ptGraphSvg(q.graph)}</div></div>
      <div class="pt-palette">${q.chips.map(c => ptChip(c.id, c.label, c.value, c.unit)).join('')}</div>
      <div class="formula-line">k = ${ptFraction('num', 'den', 'liveFD')}</div>
      <div class="flex items-center justify-between mt-4" id="actionRow">
        ${ptSkipBtn('skipQ()')}
        <button class="btn-primary" onclick="verifyFracdrag()">Vérifier</button>
      </div>
      <p id="dragMsg" class="mt-2 font-semibold"></p>
    </div>`;
  questionDone = false;
  engine = ptSlotEngine(document.getElementById('qCard'), {
    liveGroups: [{ slots: ['num','den'], op: 'div', target: '#liveFD', decimals: q.decimals, dynamicUnit: true }],
  });
}

function verifyFracdrag() {
  if (questionDone) return;
  const r = engine.verify();
  const msg = document.getElementById('dragMsg');
  if (r.correct === r.total) {
    questionDone = true;
    score += r.total;
    document.querySelector('.score-badge').textContent = score + ' pt' + (score>1?'s':'');
    answers.push({ num: idx+1, pts: r.total, max: r.total });
    msg.style.color = '#166534';
    const q = bank[idx];
    msg.innerHTML = '✓ Bien placé !' + (q.name ? ` Ce coefficient, c'est <b>${q.name}</b>.` : '');
    document.getElementById('actionRow').style.display = 'none';
    msg.insertAdjacentHTML('afterend', `<div class="text-center mt-2"><button onclick="nextQ()" class="btn-primary">Suite →</button></div>`);
  } else {
    msg.style.color = '#991b1b';
    msg.textContent = `${r.correct}/${r.total} cases correctes — corrige les cases rouges et re-vérifie.`;
  }
}

function answerQcm(i) {
  const q = bank[idx];
  const ok = i === q.correct;
  document.querySelectorAll('#opts .mcq-btn').forEach((b,bi) => {
    b.disabled = true;
    if (bi === q.correct) b.classList.add('correct');
    else if (bi === i) b.classList.add('wrong');
  });
  if (ok) { score += 1; document.querySelector('.score-badge').textContent = score + ' pt' + (score>1?'s':''); }
  answers.push({ num: idx+1, pts: ok?1:0, max: 1 });
  document.getElementById('opts').insertAdjacentHTML('afterend',
    `<div class="text-center mt-4"><button onclick="nextQ()" class="btn-primary">Suite →</button></div>`);
}
function nextQ() { idx++; render(); }
function skipQ() {
  if (questionDone) return;
  const q = bank[idx];
  answers.push({ num: idx+1, pts: 0, max: q.type==='qcm' ? 1 : 2 });
  idx++; render();
}

function finish() {
  document.getElementById('app').innerHTML = ptFinish({
    score, max: maxScore(), trueMax: maxScore(),
    title: 'Entraînement terminé !', recap: answers,
    restartFn: 'start()',
  });
}

renderIntro();

const nav = AppNav.init({
  appName: 'Proportionnalité', portalHref: '../../index.html', portalLabel: 'Toutes les applications',
  onHome: () => { window.location.href = '../index.html'; },
  onNavigate: (key) => { window.location.href = key + '.html'; },
  groups: [
    { title: 'Reconnaître', items: [
      { key: 'module_1', label: 'Module 1 : Cours' }, { key: 'module_2', label: 'Module 2 : Vérification' }, { key: 'module_3', label: 'Module 3 : Entraînement' },
    ]},
    { title: 'Utiliser', items: [
      { key: 'module_4', label: 'Module 4 : Cours' }, { key: 'module_5', label: 'Module 5 : Vérification' }, { key: 'module_6', label: 'Module 6 : Entraînement' },
    ]},
    { title: 'Graphique', items: [
      { key: 'module_7', label: 'Module 7 : Cours' }, { key: 'module_8', label: 'Module 8 : Vérification' }, { key: 'module_9', label: 'Module 9 : Entraînement' },
    ]},
  ],
});
nav.setActive('module_9');
nav.setTitle('Module 9 : Entraînement');
</script>
</body>
</html>
