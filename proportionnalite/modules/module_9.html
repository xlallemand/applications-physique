<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 9 : Entraînement — Graphique</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="ptools.css">
<script src="../../assets/nav.js"></script>
<script src="../../assets/numpad.js"></script>
<script src="ptools.js"></script>
<style>
  .graph-row { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-bottom:12px; }
  .graph-item { text-align:center; flex:1; min-width:220px; max-width:300px; }
</style>
</head>
<body class="bg-gradient-to-br from-violet-50 to-purple-100 min-h-screen">
<div id="app-nav"></div>
<div class="container mx-auto px-4 py-8 max-w-3xl" id="app"></div>

<script>
const bank = [
  { text: "Masse m (g) d'un volume V (mL) d'eau. Détermine la masse volumique (coefficient, en g/mL) à l'aide des points A et B.",
    graph: {xMax:10,yMax:10,xLabel:'V (mL)',yLabel:'m (g)',k:1,intercept:0,showPoints:true,pointA:[2,2],pointB:[8,8]},
    unit:'g/mL', answer:1, decimals:2 },

  { text: "Distance d (m) parcourue en fonction de la durée t (s), à vitesse constante. Détermine la vitesse (coefficient, en m/s).",
    graph: {xMax:6,yMax:24,xLabel:'t (s)',yLabel:'d (m)',k:4,intercept:0,showPoints:true,pointA:[1,4],pointB:[5,20]},
    unit:'m/s', answer:4, decimals:2 },

  { text: "Tension U (V) aux bornes d'un conducteur ohmique, en fonction de l'intensité I (A). Détermine sa résistance (coefficient, en &Omega;).",
    graph: {xMax:5,yMax:22,xLabel:'I (A)',yLabel:'U (V)',k:5,intercept:0,showPoints:true,pointA:[1,5],pointB:[4,20]},
    unit:'&Omega;', answer:5, decimals:2 },

  { text: "Masse m (g) d'eau en fonction de la quantité de matière n (mol). Détermine la masse molaire de l'eau (coefficient, en g/mol).",
    graph: {xMax:4,yMax:60,xLabel:'n (mol)',yLabel:'m (g)',k:18,intercept:0,showPoints:true,pointA:[1,18],pointB:[3,54]},
    unit:'g/mol', answer:18, decimals:2 },

  { text: "Force F (N) exercée par un ressort en fonction de son allongement x (cm) (loi de Hooke). Détermine la raideur du ressort (coefficient, en N/cm).",
    graph: {xMax:8,yMax:18,xLabel:'x (cm)',yLabel:'F (N)',k:2.5,intercept:0,showPoints:true,pointA:[2,5],pointB:[6,15]},
    unit:'N/cm', answer:2.5, decimals:2 },

  { text: "Masse m (g) de soluté dissous en fonction du volume V (L) de solution. Détermine la concentration massique (coefficient, en g/L).",
    graph: {xMax:1.6,yMax:18,xLabel:'V (L)',yLabel:'m (g)',k:12.5,intercept:0,showPoints:true,pointA:[0.4,5],pointB:[1.2,15]},
    unit:'g/L', answer:12.5, decimals:2 },

  { text: "Énergie E (J) reçue en fonction de la durée t (s), pour une source de puissance constante. Détermine cette puissance (coefficient, en W).",
    graph: {xMax:8,yMax:50,xLabel:'t (s)',yLabel:'E (J)',k:7.5,intercept:0,showPoints:true,pointA:[2,15],pointB:[6,45]},
    unit:'W', answer:7.5, decimals:2 },
];
let idx = 0, score = 0, answers = [];
function maxScore() { return bank.length * 2; }

function renderIntro() {
  document.getElementById('app').innerHTML = `
    <div class="bg-white rounded-xl shadow-lg p-6">
      <span class="content-module-badge">MODULE 9</span>
      <h2 class="text-2xl font-bold text-[var(--app-accent-800)] mb-3">Entraînement</h2>
      <p class="text-gray-700 mb-2">Lis les coordonnées des points A et B sur chaque graphique, puis calcule le coefficient de proportionnalité (&Delta;y / &Delta;x).</p>
      <button onclick="start()" class="btn-primary mt-2">Commencer →</button>
    </div>`;
}
function start() { idx = 0; score = 0; answers = []; render(); }

function render() {
  if (idx >= bank.length) return finish();
  const q = bank[idx];
  const app = document.getElementById('app');
  const head = ptHeader({ badge: 'MODULE 9', title: 'Entraînement', idx, total: bank.length, score });
  app.innerHTML = head + `
    <div class="bg-white rounded-xl shadow-lg p-6">
      <p class="text-gray-700 text-lg mb-2">${q.text}</p>
      <div class="graph-row"><div class="graph-item">${ptGraphSvg(q.graph)}</div></div>
      ${numpadToggleBar()}
      <div class="flex items-center gap-3 flex-wrap">
        <input type="text" id="ansInput" inputmode="decimal" class="check-input w-32" placeholder="Coefficient" onfocus="numpadFocus('ansInput')" ontouchstart="numpadFocus('ansInput')">
        <span class="text-gray-600 font-semibold" id="unitLbl"></span>
        <button class="check-btn" onclick="checkResult()">Vérifier</button>
      </div>
      ${numpadWidget()}
      <p id="ansFb" class="mt-2 font-semibold"></p>
    </div>`;
  document.getElementById('unitLbl').innerHTML = q.unit;
}

function checkResult() {
  const q = bank[idx];
  const input = document.getElementById('ansInput');
  const fb = document.getElementById('ansFb');
  const ok = ptNumOk(input.value, q.answer, 3);
  if (ok) { fb.innerHTML = '✓ Correct ! 🎉'; fb.style.color = '#166534'; score += 2; }
  else { fb.innerHTML = `✗ Incorrect. La réponse est : ${ptFmt(q.answer, q.decimals)} ${q.unit.replace('&Omega;','Ω')}`; fb.style.color = '#991b1b'; }
  answers.push({ num: idx+1, pts: ok?2:0, max: 2 });
  input.disabled = true;
  document.querySelector('.check-btn').disabled = true;
  fb.insertAdjacentHTML('afterend', `<div class="text-center mt-3"><button class="btn-primary" onclick="nextQ()">Suite →</button></div>`);
}
function nextQ() { idx++; render(); }

function finish() {
  document.getElementById('app').innerHTML = ptFinish({
    score, max: maxScore(), trueMax: maxScore(),
    title: 'Entraînement terminé !', recap: answers,
    restartFn: 'start()',
  });
}

renderIntro();

const nav = AppNav.init({
  appName: 'Proportionnalité', portalHref: '../../index.html', portalLabel: 'Toutes les applications',
  onHome: () => { window.location.href = '../index.html'; },
  onNavigate: (key) => { window.location.href = key + '.html'; },
  groups: [
    { title: 'Reconnaître', items: [
      { key: 'module_1', label: 'Module 1 : Cours' }, { key: 'module_2', label: 'Module 2 : Vérification' }, { key: 'module_3', label: 'Module 3 : Entraînement' },
    ]},
    { title: 'Utiliser', items: [
      { key: 'module_4', label: 'Module 4 : Cours' }, { key: 'module_5', label: 'Module 5 : Vérification' }, { key: 'module_6', label: 'Module 6 : Entraînement' },
    ]},
    { title: 'Graphique', items: [
      { key: 'module_7', label: 'Module 7 : Cours' }, { key: 'module_8', label: 'Module 8 : Vérification' }, { key: 'module_9', label: 'Module 9 : Entraînement' },
    ]},
  ],
});
nav.setActive('module_9');
nav.setTitle('Module 9 : Entraînement');
</script>
</body>
</html>
