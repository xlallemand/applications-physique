<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : Vérification — Reconnaître</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="ptools.css">
<script src="../../assets/nav.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="ptools.js"></script>
</head>
<body class="bg-gradient-to-br from-violet-50 to-purple-100 min-h-screen">
<div id="app-nav"></div>
<div class="container mx-auto px-4 py-8 max-w-3xl" id="app"></div>

<script>
const bank = [
  { type: 'qcm3', text: "Une voiture roule à vitesse constante. On regarde la distance parcourue et la durée du trajet.", correct: 'Proportionnalité directe' },
  { type: 'qcm3', text: "Un objet a une masse fixée. On regarde sa masse volumique et son volume.", correct: 'Proportionnalité inverse' },
  { type: 'sort', text: "Range chaque situation dans le bon panier.", items: [
      { text: "Une baignoire se remplit à débit constant : volume d'eau versé et durée de remplissage", type: 'directe' },
      { text: "À résistance fixée d'un conducteur ohmique : tension à ses bornes et intensité qui le traverse", type: 'directe' },
      { text: "Prix d'une course de taxi (prise en charge fixe + prix au km) et distance parcourue", type: 'aucune' },
      { text: "À vitesse constante : distance parcourue et durée du trajet", type: 'directe' },
  ]},
  { type: 'qcm3', text: "Le poids d'un objet et sa masse, à un endroit donné (l'intensité de la pesanteur y est fixée).", correct: 'Proportionnalité directe' },
  { type: 'qcm3', text: "Une pompe refoule de l'eau à débit constant : le volume d'eau pompé et la durée de fonctionnement.", correct: 'Proportionnalité directe' },
  { type: 'qcm3', text: "L'aire d'un carré et la longueur de son côté.", correct: 'Aucune des deux' },
  { type: 'sort', text: "Range chaque situation dans le bon panier.", items: [
      { text: "À pression et température fixées : volume occupé par un gaz et la quantité de gaz", type: 'directe' },
      { text: "Durée pour vider un réservoir et nombre de pompes identiques utilisées en même temps", type: 'inverse' },
      { text: "Si on double la longueur d'un pendule, sa période est multipliée par &radic;2 &asymp; 1,41 (et non par 2)", type: 'aucune' },
      { text: "Énergie totale disponible (en Wh) pour plusieurs piles identiques utilisées ensemble, et le nombre de piles", type: 'directe' },
  ]},
  { type: 'qcm3', text: "L'énergie cinétique d'un objet de masse fixée et sa vitesse.", correct: 'Aucune des deux' },
  { type: 'qcm3', text: "À longueur d'onde fixée, l'énergie d'un photon et la fréquence de l'onde (relation de Planck).", correct: 'Proportionnalité directe' },
];
let idx = 0, score = 0, answers = [];
function maxScore() { return bank.reduce((s,q) => s + (q.type==='qcm3' ? 1 : q.items.length), 0); }

function renderIntro() {
  document.getElementById('app').innerHTML = `
    <div class="bg-white rounded-xl shadow-lg p-6">
      <span class="content-module-badge">MODULE 2</span>
      <h2 class="text-2xl font-bold text-[var(--app-accent-800)] mb-3">Vérification des connaissances</h2>
      <p class="text-gray-700 mb-2">Pour chaque situation, indique s'il s'agit d'une <b>proportionnalité directe</b>, d'une <b>proportionnalité inverse</b>, ou d'<b>aucune des deux</b>.</p>
      <p class="text-gray-700 mb-2">Questions à choix multiple et glisser-déposer uniquement — aucun calcul à faire ici.</p>
      <button onclick="start()" class="btn-primary mt-2">Commencer →</button>
    </div>`;
}
function start() { idx = 0; score = 0; answers = []; render(); }

function render() {
  if (idx >= bank.length) return finish();
  const q = bank[idx];
  const app = document.getElementById('app');
  const head = ptHeader({ badge: 'MODULE 2', title: 'Vérification des connaissances', idx, total: bank.length, score });

  if (q.type === 'qcm3') {
    app.innerHTML = head + `
      <div class="bg-white rounded-xl shadow-lg p-6">
        <p class="text-gray-700 text-lg mb-4">${q.text}</p>
        <div id="opts"></div>
        <div class="text-right mt-2">${ptSkipBtn('skipQ()')}</div>
      </div>`;
    const opts = ['Proportionnalité directe', 'Proportionnalité inverse', 'Aucune des deux'];
    document.getElementById('opts').innerHTML = opts.map(o => `<button class="mcq-btn" onclick="answerQcm('${o}')">${o}</button>`).join('');
    return;
  }

  // type === 'sort'
  DragDrop.cleanupGhosts();
  app.innerHTML = head + `
    <div class="bg-white rounded-xl shadow-lg p-6">
      <p class="text-gray-700 text-lg mb-2">${q.text}</p>
      <div class="pt-palette" id="sortPalette">
        ${q.items.map((it, i) => `<div class="basket-card" draggable="true" data-idx="${i}" data-type="${it.type}">${it.text}</div>`).join('')}
      </div>
      <div class="basket-grid">
        <div class="basket" data-basket-type="directe"><div class="basket-title">Directe</div></div>
        <div class="basket" data-basket-type="inverse"><div class="basket-title">Inverse</div></div>
        <div class="basket" data-basket-type="aucune"><div class="basket-title">Aucune</div></div>
      </div>
      <div class="flex items-center justify-between mt-4">
        ${ptSkipBtn('skipQ()')}
        <button id="sortNext" class="btn-primary" style="display:none" onclick="nextQ()">Suite →</button>
      </div>
    </div>`;
  wireSort(q);
}

function wireSort(q) {
  let placed = 0, correctCount = 0;
  document.querySelectorAll('.basket-card').forEach(card => {
    DragDrop.enable(card, {
      zoneSelector: '.basket',
      dragOverClass: 'pt-slot-over',
      onDrop: (item, zone) => {
        if (!zone || item.dataset.locked === '1') return;
        item.dataset.locked = '1';
        item.setAttribute('draggable', 'false');
        item.style.cursor = 'default';
        const ok = item.dataset.type === zone.dataset.basketType;
        item.classList.add(ok ? 'placed-ok' : 'placed-wrong');
        if (!ok) item.innerHTML += `<br><span style="font-size:.75rem;font-weight:800">→ en réalité : ${labelFor(item.dataset.type)}</span>`;
        zone.appendChild(item);
        placed++; if (ok) correctCount++;
        if (placed === q.items.length) {
          score += correctCount;
          document.querySelector('.score-badge').textContent = score + ' pt' + (score>1?'s':'');
          answers.push({ num: idx+1, pts: correctCount, max: q.items.length });
          document.getElementById('sortNext').style.display = 'inline-block';
        }
      },
    });
  });
}
function labelFor(t) { return t==='directe' ? 'proportionnalité directe' : t==='inverse' ? 'proportionnalité inverse' : 'aucune des deux'; }

function answerQcm(choice) {
  const q = bank[idx];
  const ok = choice === q.correct;
  document.querySelectorAll('#opts .mcq-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correct) b.classList.add('correct');
    else if (b.textContent === choice) b.classList.add('wrong');
  });
  if (ok) { score += 1; document.querySelector('.score-badge').textContent = score + ' pt' + (score>1?'s':''); }
  answers.push({ num: idx+1, pts: ok?1:0, max: 1 });
  document.getElementById('opts').insertAdjacentHTML('beforeend',
    `<div class="text-center mt-4"><button onclick="nextQ()" class="btn-primary">Suite →</button></div>`);
}
function nextQ() { idx++; render(); }
function skipQ() {
  const q = bank[idx];
  answers.push({ num: idx+1, pts: 0, max: q.type==='qcm3' ? 1 : q.items.length });
  idx++; render();
}

function finish() {
  document.getElementById('app').innerHTML = ptFinish({
    score, max: maxScore(), trueMax: maxScore(),
    title: 'Vérification terminée !', recap: answers,
    restartFn: 'start()', nextHref: 'module_3.html', nextLabel: 'Module 3 : Entraînement →',
  });
}

renderIntro();

const nav = AppNav.init({
  appName: 'Proportionnalité', portalHref: '../../index.html', portalLabel: 'Toutes les applications',
  onHome: () => { window.location.href = '../index.html'; },
  onNavigate: (key) => { window.location.href = key + '.html'; },
  groups: [
    { title: 'Reconnaître', items: [
      { key: 'module_1', label: 'Module 1 : Cours' }, { key: 'module_2', label: 'Module 2 : Vérification' }, { key: 'module_3', label: 'Module 3 : Entraînement' },
    ]},
    { title: 'Utiliser', items: [
      { key: 'module_4', label: 'Module 4 : Cours' }, { key: 'module_5', label: 'Module 5 : Vérification' }, { key: 'module_6', label: 'Module 6 : Entraînement' },
    ]},
    { title: 'Graphique', items: [
      { key: 'module_7', label: 'Module 7 : Cours' }, { key: 'module_8', label: 'Module 8 : Vérification' }, { key: 'module_9', label: 'Module 9 : Entraînement' },
    ]},
  ],
});
nav.setActive('module_2');
nav.setTitle('Module 2 : Vérification');
</script>
</body>
</html>
