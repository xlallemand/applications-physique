<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 8 : Vérification — Graphique</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="ptools.css">
<script src="../../assets/nav.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="ptools.js"></script>
<style>
  .graph-row { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-bottom:12px; }
  .graph-item { text-align:center; flex:1; min-width:200px; max-width:260px; }
  .basket-card .pt-graph { max-width:220px; margin:4px auto; }
  .formula-line { font-size:1.05rem; font-weight:700; color:var(--app-accent-800); text-align:center; margin:10px 0; }
</style>
</head>
<body class="bg-gradient-to-br from-violet-50 to-purple-100 min-h-screen">
<div id="app-nav"></div>
<div class="container mx-auto px-4 py-8 max-w-3xl" id="app"></div>

<script>
const G = {
  directe1: {xMax:10,yMax:8,xLabel:'x',yLabel:'y',k:0.7,intercept:0,showPoints:false},
  directe2: {xMax:10,yMax:6,xLabel:'x',yLabel:'y',k:0.45,intercept:0,showPoints:false},
  affine1: {xMax:10,yMax:9,xLabel:'d (km)',yLabel:'prix (€)',k:0.6,intercept:2.5,showPoints:false},
  affine2: {xMax:10,yMax:8,xLabel:'x',yLabel:'y',k:0.3,intercept:3,showPoints:false},
  courbe1: {xMax:10,yMax:8,xLabel:'x',yLabel:'y',curved:true,curveFn:(x)=>2*Math.sqrt(x),showPoints:false},
  courbe2: {xMax:10,yMax:9,xLabel:'v (m/s)',yLabel:'Ec (J)',curved:true,curveFn:(x)=>0.09*x*x,showPoints:false},
  coefA: {xMax:10,yMax:9,nx:5,ny:3,xLabel:'n (mol)',yLabel:'m (g)',k:0.6,intercept:0,showPoints:true,pointA:[0,0],pointB:[10,6]},
  coefA2: {xMax:10,yMax:6,nx:5,ny:5,xLabel:'n (mol)',yLabel:'m (g)',k:0.6,intercept:0,showPoints:true,pointA:[2,1.2],pointB:[8,4.8]},
  coefB: {xMax:8,yMax:16,nx:4,ny:4,xLabel:'I (A)',yLabel:'U (V)',k:1.5,intercept:0,showPoints:true,pointA:[0,0],pointB:[8,12]},
};

const bank = [
  { type: 'qcm', text: "Que doit vérifier un graphique y = f(x) pour représenter une situation de proportionnalité directe ?",
    options: ['C\'est une droite qui passe par l\'origine (0 ; 0)', 'C\'est n\'importe quelle droite', 'C\'est une courbe croissante', 'C\'est une droite décroissante'], correct: 0 },

  { type: 'qcm', text: "Ce graphique représente-t-il une situation de proportionnalité ?", graph: G.directe1,
    options: ['Oui, c\'est une proportionnalité', 'Non, situation affine', 'Non, autre situation'], correct: 0 },

  { type: 'qcm', text: "Ce graphique (prix d'une course en fonction de la distance) représente-t-il une situation de proportionnalité ?", graph: G.affine1,
    options: ['Oui, c\'est une proportionnalité', 'Non, situation affine', 'Non, autre situation'], correct: 1 },

  { type: 'qcm', text: "Ce graphique (énergie cinétique en fonction de la vitesse) représente-t-il une situation de proportionnalité ?", graph: G.courbe2,
    options: ['Oui, c\'est une proportionnalité', 'Non, situation affine', 'Non, autre situation (courbe)'], correct: 2 },

  { type: 'sort', text: "Range chaque graphique dans le bon panier.",
    baskets: [ {key:'oui', label:'Proportionnelle'}, {key:'non', label:'Non proportionnelle'} ],
    items: [
      { graph: G.directe2, type: 'oui' },
      { graph: G.affine2, type: 'non' },
      { graph: G.courbe1, type: 'non' },
      { graph: G.coefA, type: 'oui' },
  ]},

  { type: 'fracdrag', text: "Quantité de matière n (mol) et masse m (g) d'une espèce chimique. Le premier point est à l'origine : place les coordonnées du point B dans le calcul du coefficient (la masse molaire).", graph: G.coefA,
    chips: [ {id:'num', label:'6 g', value:6}, {id:'den', label:'10 mol', value:10}, {id:'x1', label:'10 g', value:10}, {id:'x2', label:'6 mol', value:6} ],
    suffix: ' g/mol', decimals: 2 },

  { type: 'qcm', text: "Quelle est l'unité du coefficient directeur du graphique précédent (masse en fonction de la quantité de matière) ?",
    options: ['g/mol', 'mol/g', 'g', 'mol'], correct: 0 },

  { type: 'fracdrag', text: "Même grandeur, mais cette fois l'origine n'est pas utilisée : place les variations (et non les valeurs brutes) dans le calcul du coefficient à l'aide des points A et B.", graph: G.coefA2,
    chips: [ {id:'num', label:'&Delta;m = 3,6 g', value:3.6}, {id:'den', label:'&Delta;n = 6 mol', value:6}, {id:'x1', label:'4,8 g', value:4.8}, {id:'x2', label:'8 mol', value:8} ],
    suffix: ' g/mol', decimals: 2 },

  { type: 'fracdrag', text: "Loi d'Ohm : tension U (V) en fonction de l'intensité I (A). Place les coordonnées du point B dans le calcul de la résistance.", graph: G.coefB,
    chips: [ {id:'num', label:'12 V', value:12}, {id:'den', label:'8 A', value:8}, {id:'x1', label:'8 V', value:8}, {id:'x2', label:'12 A', value:12} ],
    suffix: ' &Omega;', decimals: 2 },

  { type: 'qcm', text: "Quelle est l'unité du coefficient directeur du graphique précédent (tension en fonction de l'intensité) ?",
    options: ['&Omega; (V/A)', 'A/V', 'V', 'A'], correct: 0 },

  { type: 'qcm', text: "Pourquoi utilise-t-on deux points A et B (et non un seul) pour déterminer le coefficient directeur d'une droite ?",
    options: [
      'Pour calculer un rapport de variations &Delta;y/&Delta;x, qui nécessite deux points',
      'Parce qu\'un seul point ne peut pas être placé sur un graphique',
      'Pour rendre le graphique plus joli',
      'Ce n\'est qu\'une habitude, un seul point suffirait',
    ], correct: 0 },
];
let idx = 0, score = 0, answers = [], engine = null;
function maxScore() { return bank.reduce((s,q) => s + (q.type==='qcm' ? 1 : q.type==='fracdrag' ? 2 : q.items.length), 0); }

function renderIntro() {
  document.getElementById('app').innerHTML = `
    <div class="bg-white rounded-xl shadow-lg p-6">
      <span class="content-module-badge">MODULE 8</span>
      <h2 class="text-2xl font-bold text-[var(--app-accent-800)] mb-3">Vérification des connaissances</h2>
      <p class="text-gray-700 mb-2">QCM et glisser-déposer pour vérifier que tu sais reconnaître un graphique de proportionnalité et construire le calcul de son coefficient.</p>
      <button onclick="start()" class="btn-primary mt-2">Commencer →</button>
    </div>`;
}
function start() { idx = 0; score = 0; answers = []; render(); }

function render() {
  if (idx >= bank.length) return finish();
  const q = bank[idx];
  const app = document.getElementById('app');
  const head = ptHeader({ badge: 'MODULE 8', title: 'Vérification des connaissances', idx, total: bank.length, score });
  const graphHtml = q.graph ? `<div class="graph-row"><div class="graph-item">${ptGraphSvg(q.graph)}</div></div>` : '';

  if (q.type === 'qcm') {
    app.innerHTML = head + `
      <div class="bg-white rounded-xl shadow-lg p-6">
        <p class="text-gray-700 text-lg mb-3">${q.text}</p>
        ${graphHtml}
        <div id="opts">${q.options.map((o,i) => `<button class="mcq-btn" onclick="answerQcm(${i})">${o}</button>`).join('')}</div>
        <div class="text-right mt-2">${ptSkipBtn('skipQ()')}</div>
      </div>`;
    return;
  }

  if (q.type === 'fracdrag') {
    app.innerHTML = head + `
      <div class="bg-white rounded-xl shadow-lg p-6" id="qCard">
        <p class="text-gray-700 text-lg mb-3">${q.text}</p>
        ${graphHtml}
        <div class="pt-palette">${q.chips.map(c => ptChip(c.id, c.label, c.value)).join('')}</div>
        <div class="formula-line">k = ${ptFraction('num', 'den', 'liveFD', q.suffix)}</div>
        <div class="flex items-center justify-between mt-4">
          ${ptSkipBtn('skipQ()')}
          <button class="btn-primary" onclick="verifyFracdrag()">Vérifier</button>
        </div>
        <p id="dragMsg" class="mt-2 font-semibold"></p>
      </div>`;
    engine = ptSlotEngine(document.getElementById('qCard'), {
      liveGroups: [{ slots: ['num','den'], op: 'div', target: '#liveFD', decimals: q.decimals, suffix: q.suffix }],
    });
    return;
  }

  DragDrop.cleanupGhosts();
  app.innerHTML = head + `
    <div class="bg-white rounded-xl shadow-lg p-6">
      <p class="text-gray-700 text-lg mb-2">${q.text}</p>
      <div class="pt-palette" id="sortPalette">
        ${q.items.map((it, i) => `<div class="basket-card" draggable="true" data-idx="${i}" data-type="${it.type}">${ptGraphSvg(it.graph)}</div>`).join('')}
      </div>
      <div class="basket-grid" style="grid-template-columns:repeat(${q.baskets.length},1fr)">
        ${q.baskets.map(b => `<div class="basket" data-basket-type="${b.key}"><div class="basket-title">${b.label}</div></div>`).join('')}
      </div>
      <div class="flex items-center justify-between mt-4">
        ${ptSkipBtn('skipQ()')}
        <button id="sortNext" class="btn-primary" style="display:none" onclick="nextQ()">Suite →</button>
      </div>
    </div>`;
  wireSort(q);
}

function wireSort(q) {
  let placed = 0, correctCount = 0;
  document.querySelectorAll('.basket-card').forEach(card => {
    DragDrop.enable(card, {
      zoneSelector: '.basket',
      dragOverClass: 'pt-slot-over',
      onDrop: (item, zone) => {
        if (!zone || item.dataset.locked === '1') return;
        item.dataset.locked = '1';
        item.setAttribute('draggable', 'false');
        item.style.cursor = 'default';
        const ok = item.dataset.type === zone.dataset.basketType;
        item.classList.add(ok ? 'placed-ok' : 'placed-wrong');
        zone.appendChild(item);
        placed++; if (ok) correctCount++;
        if (placed === q.items.length) {
          score += correctCount;
          document.querySelector('.score-badge').textContent = score + ' pt' + (score>1?'s':'');
          answers.push({ num: idx+1, pts: correctCount, max: q.items.length });
          document.getElementById('sortNext').style.display = 'inline-block';
        }
      },
    });
  });
}

function verifyFracdrag() {
  const r = engine.verify();
  const msg = document.getElementById('dragMsg');
  if (r.correct === r.total) {
    score += r.total;
    document.querySelector('.score-badge').textContent = score + ' pt' + (score>1?'s':'');
    answers.push({ num: idx+1, pts: r.total, max: r.total });
    msg.style.color = '#166534';
    msg.innerHTML = '✓ Bien placé !';
    msg.insertAdjacentHTML('afterend', `<div class="text-center mt-2"><button onclick="nextQ()" class="btn-primary">Suite →</button></div>`);
  } else {
    msg.style.color = '#991b1b';
    msg.textContent = `${r.correct}/${r.total} cases correctes — corrige les cases rouges et re-vérifie.`;
  }
}

function answerQcm(i) {
  const q = bank[idx];
  const ok = i === q.correct;
  document.querySelectorAll('#opts .mcq-btn').forEach((b,bi) => {
    b.disabled = true;
    if (bi === q.correct) b.classList.add('correct');
    else if (bi === i) b.classList.add('wrong');
  });
  if (ok) { score += 1; document.querySelector('.score-badge').textContent = score + ' pt' + (score>1?'s':''); }
  answers.push({ num: idx+1, pts: ok?1:0, max: 1 });
  document.getElementById('opts').insertAdjacentHTML('afterend',
    `<div class="text-center mt-4"><button onclick="nextQ()" class="btn-primary">Suite →</button></div>`);
}
function nextQ() { idx++; render(); }
function skipQ() {
  const q = bank[idx];
  answers.push({ num: idx+1, pts: 0, max: q.type==='qcm' ? 1 : q.type==='fracdrag' ? 2 : q.items.length });
  idx++; render();
}

function finish() {
  document.getElementById('app').innerHTML = ptFinish({
    score, max: maxScore(), trueMax: maxScore(),
    title: 'Vérification terminée !', recap: answers,
    restartFn: 'start()', nextHref: 'module_9.html', nextLabel: 'Module 9 : Entraînement →',
  });
}

renderIntro();

const nav = AppNav.init({
  appName: 'Proportionnalité', portalHref: '../../index.html', portalLabel: 'Toutes les applications',
  onHome: () => { window.location.href = '../index.html'; },
  onNavigate: (key) => { window.location.href = key + '.html'; },
  groups: [
    { title: 'Reconnaître', items: [
      { key: 'module_1', label: 'Module 1 : Cours' }, { key: 'module_2', label: 'Module 2 : Vérification' }, { key: 'module_3', label: 'Module 3 : Entraînement' },
    ]},
    { title: 'Utiliser', items: [
      { key: 'module_4', label: 'Module 4 : Cours' }, { key: 'module_5', label: 'Module 5 : Vérification' }, { key: 'module_6', label: 'Module 6 : Entraînement' },
    ]},
    { title: 'Graphique', items: [
      { key: 'module_7', label: 'Module 7 : Cours' }, { key: 'module_8', label: 'Module 8 : Vérification' }, { key: 'module_9', label: 'Module 9 : Entraînement' },
    ]},
  ],
});
nav.setActive('module_8');
nav.setTitle('Module 8 : Vérification');
</script>
</body>
</html>
