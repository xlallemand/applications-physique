<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 1 · COURS</span>
    <h2 class="er-titre">Reconnaître une situation de proportionnalité</h2>
    <p class="er-contexte">Avant de calculer quoi que ce soit, il faut savoir reconnaître le <b>type</b> de relation entre deux grandeurs : <b>proportionnalité directe</b>, <b>proportionnalité inverse</b>, ou aucune des deux.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Les « Vérifie ta compréhension » de l'ancien cours sont repris
   comme premières questions des « À toi ».
   ============================================================ */
const { fmt, hasard, exemple } = COURS;
const proche = (a, b) => COURS.proche(a, b, .01);
const fr = (a, b) => `<span class="som-fr"><span>${a}</span><span>${b}</span></span>`;
// tableau de valeurs en lignes : [['t (h)', 1, 2, 3], ['d (km)', 90, 180, 270]]
const tabLignes = lignes => `<div class="crs-defile"><table class="crs-tab"><tbody>${lignes.map(l => `<tr><th>${l[0]}</th>${l.slice(1).map(x => `<td>${typeof x === 'number' ? fmt(x) : x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
// QCM « directe / inverse / aucune » (les trois réponses dans le même ordre à chaque fois)
const OPTS3 = [{ id: 'dir', label: 'Proportionnalité directe' }, { id: 'inv', label: 'Proportionnalité inverse' }, { id: 'auc', label: 'Aucune des deux' }];
const qcm3 = (titre, enonce, q, bonne, indices, solution) => ({ titre, enonce, parties: [{ type: 'choix', q, options: OPTS3, bonne, indices, solution, melanger: false }] });

/* ---------- 1. La proportionnalité directe ---------- */
function etape1(c) {
  const carte = c.carte('1. La proportionnalité directe');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Deux grandeurs <b>x</b> et <b>y</b> sont <b>directement proportionnelles</b> si leur <b>rapport</b> reste constant.</p>
      <div class="cle"><p class="crs-formule">y = k × x &nbsp;(k constant)</p>
        <p>Quand x double, y double ; quand x est divisé par 3, y est divisé par 3, etc. Dans un tableau de valeurs, tous les rapports ${fr('y', 'x')} sont égaux (à k).</p></div>
    </div>
    ${exemple(`<p>Une voiture roule à vitesse constante : 90 km/h signifie qu'elle parcourt 90 km en 1 h, et <b>deux fois plus</b> (180 km) en 2 h, <b>trois fois plus</b> (270 km) en 3 h…</p>
      ${tabLignes([['t (h)', 1, 2, 3], ['d (km)', 90, 180, 270]])}
      <p class="crs-calc">${fr('d', 't')} = ${fr('90', '1')} = ${fr('180', '2')} = ${fr('270', '3')} = <span class="c">90 km/h</span></p>
      <p>La distance parcourue est <b>directement proportionnelle</b> à la durée du trajet.</p>`)}`);
  // rapport d'un tableau : valeurs tirées au hasard, rapport entier
  const v = hasard([12, 15, 25, 30]), ts = [2, 5, 8];
  // tableau presque proportionnel : une valeur décalée
  const k3 = hasard([2.5, 3, 4]), xs = [2, 4, 6], ys = xs.map(x => k3 * x), j = hasard([1, 2]);
  ys[j] += hasard([1, 2]);
  // rapports y / x écrits avec « = » ou « ≈ » selon qu'ils tombent juste au centième
  const rapports = xs.map((x, i) => `${fmt(ys[i])} / ${x} ${Number.isInteger(Math.round(ys[i] / x * 1e6) / 1e4) ? '=' : '≈'} ${fmt(Math.round(ys[i] / x * 100) / 100)}`).join(' ; ');
  c.aToi(carte, [
    qcm3('Le robinet', '<p>Un robinet coule à débit constant de 3 L/min : il verse donc 6 L en 2 min, et 15 L en 5 min.</p>',
      'Quelle est la relation entre le volume d\'eau écoulé (en L) et la durée d\'écoulement ?', 'dir',
      { inv: 'Quand la durée double, le volume double aussi : il ne diminue pas. Dans une proportionnalité inverse, quand l\'une est multipliée par 2, l\'autre est divisée par 2.',
        auc: 'Calcule le rapport volume / durée : 6 L / 2 min = 3 L/min et 15 L / 5 min = 3 L/min. Il est constant.' },
      '<p>Le rapport volume / durée vaut toujours 3 L/min (le débit) : le volume est <b>directement proportionnel</b> à la durée.</p>'),
    { titre: 'Le rapport d\'un tableau',
      enonce: `<p>Un objet se déplace à vitesse constante. On relève la distance d parcourue au cours du temps :</p>${tabLignes([['t (s)', ...ts], ['d (m)', ...ts.map(t => v * t)]])}`,
      parties: [{ type: 'nombre', q: 'Calcule le rapport d / t (il est le même pour chaque colonne).', label: 'd / t =', unite: 'm/s', valeur: v, signe: false,
        diag: x => (ts.some(t => proche(x, t / (v * t))) ? 'Tu as calculé t / d. Le rapport demandé est d / t : la distance divisée par la durée.'
          : ts.some(t => proche(x, v * t * t)) ? 'Tu as multiplié d par t. Le rapport d / t est une division.'
          : `Prends une colonne du tableau et divise la distance par la durée, par exemple ${fmt(v * ts[0])} / ${ts[0]}.`),
        solution: `<p class="crs-calc">${ts.map(t => fr(fmt(v * t), t)).join(' = ')} = <span class="c">${v} m/s</span></p><p>C'est la vitesse : le coefficient de proportionnalité entre d et t.</p>` }] },
    { titre: 'Un tableau de proportionnalité ?',
      enonce: tabLignes([['x', ...xs], ['y', ...ys]]),
      parties: [{ type: 'choix', q: 'Ce tableau est-il un tableau de proportionnalité ?', colonne: true, melanger: false,
        options: [{ id: 'oui', label: 'Oui : les rapports y / x sont tous égaux' }, { id: 'non', label: 'Non : les rapports y / x ne sont pas tous égaux' }, { id: 'aug', label: 'Oui : y augmente quand x augmente' }],
        bonne: 'non',
        indices: { oui: `Calcule-les tous : ${rapports}.`,
          aug: 'Augmenter ensemble ne suffit pas : il faut que le rapport y / x soit constant.' },
        solution: `<p>${rapports} : les rapports ne sont pas tous égaux, ce n'est <b>pas</b> un tableau de proportionnalité.</p>` }] },
  ]);
  return carte;
}

/* ---------- 2. La proportionnalité inverse ---------- */
function etape2(c) {
  const carte = c.carte('2. La proportionnalité inverse');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Deux grandeurs x et y sont <b>inversement proportionnelles</b> si leur <b>produit</b> reste constant.</p>
      <div class="cle"><p class="crs-formule">x × y = k &nbsp; soit &nbsp; y = ${fr('k', 'x')}</p>
        <p>Quand x double, y est divisé par 2 ; quand x est multiplié par 3, y est divisé par 3.</p></div>
      <div class="crs-attention"><p><b class="cle-titre">Attention.</b> Ce n'est pas la même chose que « les deux grandeurs varient en sens contraire » : il faut que le produit soit <b>exactement</b> constant.</p></div>
    </div>
    ${exemple(`<p>Loi de Boyle-Mariotte : à température constante, si on divise par 2 le volume V d'un gaz (on le comprime), sa pression P est multipliée par 2 ; si on divise le volume par 3, la pression est multipliée par 3.</p>
      ${tabLignes([['V (L)', 6, 3, 2], ['P (bar)', 1, 2, 3]])}
      <p class="crs-calc">P × V = 1 × 6 = 2 × 3 = 3 × 2 = <span class="c">6 bar·L</span></p>
      <p>P et V sont <b>inversement proportionnelles</b>.</p>`)}`);
  // produit d'un tableau : valeurs choisies pour que P soit entier
  const t2 = hasard([[12, [2, 3, 6]], [24, [2, 4, 6]], [36, [3, 4, 6]], [18, [1, 2, 3]]]);
  const k2 = t2[0], Vs = t2[1], Ps = Vs.map(V => k2 / V);
  // varient en sens contraire sans être inversement proportionnelles
  const t3 = hasard([[[1, 2, 4], [10, 8, 4]], [[1, 2, 5], [12, 9, 4]], [[2, 3, 6], [9, 8, 2]]]);
  const pr3 = t3[0].map((x, i) => `${x} × ${t3[1][i]} = ${x * t3[1][i]}`).join(' ; ');
  c.aToi(carte, [
    qcm3('La loi d\'Ohm', '<p>Un conducteur ohmique est soumis à une tension fixée (loi d\'Ohm). Si sa résistance est multipliée par 4, l\'intensité qui le traverse est divisée par 4.</p>',
      'Quelle est la relation entre l\'intensité et la résistance (à tension fixée) ?', 'inv',
      { dir: 'Quand R est multipliée par 4, I est <b>divisée</b> par 4 : elles ne sont pas multipliées par le même nombre.',
        auc: 'Le produit R × I reste constant (il vaut la tension U, fixée) : c\'est justement une proportionnalité inverse.' },
      '<p>R × I = U reste constant : l\'intensité est <b>inversement proportionnelle</b> à la résistance.</p>'),
    { titre: 'Le produit d\'un tableau',
      enonce: `<p>On comprime un gaz à température constante :</p>${tabLignes([['V (L)', ...Vs], ['P (bar)', ...Ps]])}`,
      parties: [{ type: 'nombre', q: 'Calcule le produit P × V (il est le même pour chaque colonne).', label: 'P × V =', unite: 'bar·L', valeur: k2, signe: false,
        diag: x => (Vs.some((V, i) => proche(x, Ps[i] / V) || proche(x, V / Ps[i])) ? 'Tu as fait une division. Pour une proportionnalité inverse, c\'est le <b>produit</b> P × V qui est constant.'
          : `Prends une colonne du tableau et multiplie la pression par le volume, par exemple ${fmt(Ps[0])} × ${Vs[0]}.`),
        solution: `<p class="crs-calc">${Vs.map((V, i) => `${fmt(Ps[i])} × ${V}`).join(' = ')} = <span class="c">${k2} bar·L</span></p>` }] },
    { titre: 'En sens contraire',
      enonce: tabLignes([['x', ...t3[0]], ['y', ...t3[1]]]),
      parties: [{ type: 'choix', q: 'Quand x augmente, y diminue. Quelle est la relation entre x et y ?', options: OPTS3, melanger: false, bonne: 'auc',
        indices: { inv: `y diminue bien quand x augmente, mais calcule les produits : ${pr3}. Ils ne sont pas tous égaux.`,
          dir: 'y diminue quand x augmente : ce ne peut pas être une proportionnalité directe.' },
        solution: `<p>${pr3} : le produit n'est pas constant. Les grandeurs varient en sens contraire, mais ne sont <b>pas</b> inversement proportionnelles.</p>` }] },
  ]);
  return carte;
}

/* ---------- 3. Le réflexe de l'unité « A par B » ---------- */
function etape3(c) {
  const carte = c.carte('3. En pratique : le réflexe de l\'unité « A par B »');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">C'est la méthode la plus utile face à un sujet.</b> Plutôt que de chercher à deviner si deux grandeurs sont proportionnelles, regarde s'il existe une grandeur connue dont l'unité s'écrit comme un quotient <b>« A par B »</b> (m/s, kg/m<sup>3</sup>, Wh/kg…). Cette grandeur est alors le coefficient de proportionnalité entre A et B, à condition qu'elle reste fixée dans la situation étudiée. C'est souvent le repère le plus rapide pour reconnaître une proportionnalité <b>directe</b>.</p></div>
      <div class="crs-defile"><table class="crs-tab">
        <thead><tr><th>Grandeur</th><th>Unité</th><th>Relation</th></tr></thead>
        <tbody>
          <tr><td>Vitesse v</td><td>m/s</td><td>distance ∝ durée (à v fixée)</td></tr>
          <tr><td>Masse volumique ρ</td><td>kg/m<sup>3</sup></td><td>masse ∝ volume (à ρ fixée)</td></tr>
          <tr><td>Énergie massique</td><td>Wh/kg</td><td>énergie stockée ∝ masse de la batterie</td></tr>
          <tr><td>Éclairement E</td><td>W/m<sup>2</sup></td><td>puissance reçue ∝ surface (à E fixé)</td></tr>
        </tbody>
      </table></div>
      <p>Ce quotient est justement le <b>coefficient de proportionnalité</b> ! On y reviendra dans le module suivant.</p>
    </div>
    ${exemple(`<p>Un panneau solaire reçoit un éclairement constant (en W/m<sup>2</sup>, « watts par mètre carré ») : sur une surface deux fois plus grande, il reçoit une puissance deux fois plus grande. La puissance reçue est <b>directement proportionnelle</b> à la surface du panneau.</p>`)}`);
  c.aToi(carte, [
    qcm3('La pièce métallique', '<p>Une pièce métallique a une masse volumique fixée : si son volume est multiplié par 3, sa masse est elle aussi multipliée par 3.</p>',
      'Quelle est la relation entre la masse et le volume ?', 'dir',
      { inv: 'Quand le volume est multiplié par 3, la masse est multipliée par 3 aussi : elle n\'est pas divisée.',
        auc: 'La masse volumique (en kg/m<sup>3</sup>, « kg par m<sup>3</sup> ») est fixée : c\'est le coefficient de proportionnalité entre la masse et le volume.' },
      '<p>ρ = m / V est fixée : la masse est <b>directement proportionnelle</b> au volume.</p>'),
    { titre: 'Quelles grandeurs ?',
      enonce: '<p>Une batterie a une énergie massique de 150 Wh/kg.</p>',
      parties: [{ type: 'choix', q: 'Quelles grandeurs sont directement proportionnelles ?', colonne: true,
        options: [{ id: 'em', label: 'L\'énergie stockée (en Wh) et la masse de la batterie (en kg)' }, { id: 'mm', label: 'L\'énergie massique et la masse de la batterie' }, { id: 'md', label: 'La masse de la batterie et la durée de charge' }],
        bonne: 'em',
        indices: { mm: 'L\'énergie massique (150 Wh/kg) est fixée : c\'est le coefficient de proportionnalité, pas l\'une des deux grandeurs.', md: 'L\'unité Wh/kg relie des Wh (une énergie) et des kg (une masse) : la durée n\'y apparaît pas.' },
        solution: '<p>Wh/kg = « Wh par kg » : l\'énergie stockée (Wh) est proportionnelle à la masse (kg), avec le coefficient 150 Wh/kg.</p>' }] },
    { titre: 'L\'unité du coefficient',
      enonce: '<p>Lors d\'un mouvement à vitesse constante, la distance d (en m) est proportionnelle à la durée t (en s).</p>',
      parties: [{ type: 'choix', q: 'Quelle est l\'unité du coefficient de proportionnalité k = d / t ?',
        options: [{ id: 'ms', label: 'm/s' }, { id: 'sm', label: 's/m' }, { id: 'mxs', label: 'm·s' }],
        bonne: 'ms',
        indices: { sm: 'k = d / t : c\'est la distance (en m) qu\'on divise par la durée (en s), pas l\'inverse.', mxs: 'm·s serait l\'unité d\'un produit d × t. Le coefficient d\'une proportionnalité directe est un quotient : d / t.' },
        solution: '<p>k = d / t s\'exprime en m/s : c\'est la vitesse.</p>' }] },
  ]);
  return carte;
}

/* ---------- 4. Les pièges ---------- */
function etape4(c) {
  const carte = c.carte('4. Attention aux pièges : ce n\'est pas toujours proportionnel !');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Deux grandeurs qui varient « dans le même sens » ne sont pas forcément proportionnelles. Deux pièges classiques :</p>
      <div class="cle"><ul class="er-liste">
        <li><b>La situation affine</b> : y = a × x + b avec b ≠ 0 (une valeur de départ non nulle). Le rapport y / x n'est alors pas constant.</li>
        <li><b>La situation non linéaire</b> : y dépend de x<sup>2</sup>, de √x, etc. Le rapport y / x n'est pas constant non plus.</li>
      </ul></div>
    </div>
    ${exemple(`<p>Une course de taxi coûte 2,50 € de prise en charge, puis 1,20 € par km parcouru : prix = 2,50 + 1,20 × d.</p>
      ${tabLignes([['d (km)', 1, 2, 4], ['prix (€)', '3,70', '4,90', '7,30']])}
      <p>Si d double, le prix ne double pas (à cause des 2,50 € fixes) : ce <b>n'est pas</b> une situation de proportionnalité.</p>`)}`);
  // eau chauffée : température de départ non nulle (situation affine)
  const th0 = hasard([15, 18, 20]), pente = hasard([4, 5]), tmin = [0, 2, 4];
  c.aToi(carte, [
    qcm3('L\'énergie cinétique', '<p>L\'énergie cinétique d\'un objet dépend de sa vitesse : si la vitesse est multipliée par 2, l\'énergie cinétique est multipliée par 4 (et non par 2) ; si la vitesse triple, l\'énergie cinétique est multipliée par 9.</p>',
      'Quelle est la relation entre l\'énergie cinétique et la vitesse ?', 'auc',
      { dir: 'Si la vitesse double, l\'énergie cinétique est multipliée par 4, pas par 2 : le rapport E<sub>c</sub> / v n\'est pas constant.',
        inv: 'L\'énergie cinétique augmente quand la vitesse augmente : ce ne peut pas être une proportionnalité inverse.' },
      '<p>E<sub>c</sub> dépend de v<sup>2</sup> (situation non linéaire) : ce n\'est <b>pas</b> une proportionnalité.</p>'),
    qcm3('Le ressort', '<p>Un ressort mesure 10 cm à vide. Chaque masse de 100 g qu\'on y suspend l\'allonge de 2 cm.</p>',
      'Quelle est la relation entre la <b>longueur</b> du ressort et la masse suspendue ?', 'auc',
      { dir: 'Sans masse, le ressort mesure déjà 10 cm : si la masse double, la longueur ne double pas (10 + 2 = 12 cm, puis 10 + 4 = 14 cm).',
        inv: 'La longueur augmente quand la masse augmente : ce ne peut pas être une proportionnalité inverse.' },
      '<p>La longueur vaut 10 cm, plus 2 cm par tranche de 100 g : situation <b>affine</b>, pas de proportionnalité. En revanche, l\'<b>allongement</b> (longueur − 10 cm) est proportionnel à la masse.</p>'),
    qcm3('L\'eau chauffée', `<p>On chauffe de l'eau et on relève sa température θ au cours du temps :</p>${tabLignes([['t (min)', ...tmin], ['θ (°C)', ...tmin.map(t => th0 + pente * t)]])}`,
      'Quelle est la relation entre la température et la durée de chauffage ?', 'auc',
      { dir: `La température augmente régulièrement, mais à t = 0 elle vaut déjà ${th0} °C : quand la durée double (de 2 à 4 min), la température ne double pas.`,
        inv: 'La température augmente quand la durée augmente : ce ne peut pas être une proportionnalité inverse.' },
      `<p>θ = ${th0} + ${pente} × t : situation <b>affine</b> (valeur de départ ${th0} °C), pas de proportionnalité.</p>`),
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p><b class="cle-titre">Proportionnalité directe.</b> y = k × x : le rapport y / x est constant ; quand x double, y double.</p></div>
    <div class="cle"><p><b class="cle-titre">Proportionnalité inverse.</b> x × y = k : le produit est constant ; quand x double, y est divisé par 2. Varier en sens contraire ne suffit pas.</p></div>
    <div class="cle"><p><b class="cle-titre">Le réflexe « A par B ».</b> Une grandeur fixée dont l'unité s'écrit « A par B » (m/s, kg/m<sup>3</sup>, Wh/kg…) est le coefficient de proportionnalité entre A et B.</p></div>
    <div class="cle"><p><b class="cle-titre">Les pièges.</b> Situation affine (y = a × x + b, b ≠ 0) ou non linéaire (x<sup>2</sup>, √x…) : le rapport y / x n'est pas constant, ce n'est pas proportionnel.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2.html">Vérification des connaissances →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_4.html">Module 2 : utiliser la proportionnalité</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_1.html">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, etape4, aRetenir]);
PT.menu('module_1');
</script>
