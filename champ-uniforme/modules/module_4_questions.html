<title>Module 4 : questions — Mouvement dans un champ uniforme</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="cu.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<script src="../../assets/sommaire.js"></script>
<script src="cu.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page" id="app"></div>

<script>
/* ============================================================
   Série du module 4 : 10 questions.
   Sens de F⃗ (proton, électron, ion), sens de E⃗ et de la flèche de U,
   valeur de E = U / L (conversion des cm), valeur de F, accélération,
   équations (q remplacé par e ou −e), nature de la trajectoire, poids
   négligeable (rapport des ordres de grandeur), déviation à la sortie.
   ============================================================ */
const { o, fq, fmt, cs, sci, hasard, melanger, V, MS, MS2, VM, fr, condo, E_CH, M_P, M_E } = CU;
const G = 9.81;
const sciP = (q, label, valeur, unite, opts) => Object.assign({ type: 'sci', q, label, valeur, unite, cs: 2, rel: .03, calc: true }, opts);

const PARTS = [['un proton', 1], ['un électron', -1], ['un ion Na<sup>+</sup>', 1], ['un ion Cl<sup>−</sup>', -1], ['une particule α', 2]];
function sensF() {
  const p = hasard(PARTS), haut = hasard(['+', '−']);
  const bas = (p[1] > 0) === (haut === '+');
  return { theme: 'Sens de la force', enonce: `<p>${p[0][0].toUpperCase() + p[0].slice(1)} se trouve entre les armatures d'un condensateur dont l'armature du haut est chargée ${haut === '+' ? 'positivement' : 'négativement'}.</p>`,
    parties: [fq.choix(`a) Sens de ${V('E')} :`, [o('h', 'vers le haut'), o('b', 'vers le bas')], haut === '+' ? 'b' : 'h', { melanger: false, indice: V('E') + ' va de l\'armature + vers l\'armature −.', solution: '<p>De + vers −.</p>' }),
      fq.choix(`b) Sens de ${V('F', 'él')} :`, [o('h', 'vers le haut'), o('b', 'vers le bas')], bas ? 'b' : 'h', { melanger: false, indice: p[1] > 0 ? 'Charge positive : même sens que ' + V('E') + '.' : 'Charge négative : sens opposé à ' + V('E') + '.', solution: `<p>${V('F', 'él')} = q ${V('E')} avec q ${p[1] > 0 ? '> 0 : même sens' : '< 0 : sens opposé'}.</p>` })] };
}
function sensU() {
  const haut = hasard(['+', '−']);
  return { theme: 'Sens de U', enonce: condo({ haut, U: false, aria: `Condensateur, armature du haut ${haut === '+' ? 'positive' : 'négative'}, champ électrique dessiné` }),
    parties: [fq.choix('La flèche qui représente la tension U entre les armatures est orientée :', [o('h', 'vers le haut'), o('b', 'vers le bas')], haut === '+' ? 'h' : 'b',
      { melanger: false, indice: 'La flèche de U pointe vers la borne + : sens inverse de ' + V('E') + '.', solution: '<p>Vers l\'armature +, dans le sens inverse de ' + V('E') + '.</p>' })] };
}
function champE() {
  const U = hasard([150, 300, 450, 2000]), L = hasard([1.5, 3.0, 5.0, 10]), E = U / (L / 100);
  return { theme: 'Valeur du champ', parties: [sciP(`Tension U = ${fmt(U)} V entre deux armatures distantes de L = ${fmt(L)} cm. Valeur du champ électrique (2 chiffres significatifs) :`, 'E =', E, VM,
    { diag: v => (Math.abs(v / (U / L) - 1) < .05 ? 'L doit être en mètres.' : Math.abs(v / (U * L / 100) - 1) < .05 ? 'E = U / L : on divise.' : 'E = U / L, L en m.'), solution: `<p>E = ${fmt(U)} / ${fmt(L / 100)} = ${sci(E, 2)} ${VM}</p>` })] };
}
function force() {
  const E = hasard([2.5e3, 8.0e3, 1.2e4, 6.0e5]), F = E_CH * E;
  return { theme: 'Force électrique', parties: [sciP(`Valeur de la force subie par un électron dans un champ E = ${sci(E, 2)} ${VM} (e = 1,60 × 10<sup>−19</sup> C) :`, 'F<sub>él</sub> =', F, 'N',
    { diag: () => 'F<sub>él</sub> = e × E (une valeur est positive).', solution: `<p>F<sub>él</sub> = 1,60 × 10<sup>−19</sup> × ${sci(E, 2)} = ${sci(F, 2)} N</p>` })] };
}
function acceleration() {
  const p = hasard([['un électron', M_E, '9,11 × 10<sup>−31</sup>'], ['un proton', M_P, '1,67 × 10<sup>−27</sup>']]), E = hasard([1.0e3, 4.0e3, 2.5e4]), a = E_CH * E / p[1];
  return { theme: 'Accélération', parties: [sciP(`Accélération de ${p[0]} (m = ${p[2]} kg) dans un champ E = ${sci(E, 2)} ${VM}, poids négligé :`, 'a =', a, MS2,
    { diag: v => (Math.abs(v / (E_CH * E) - 1) < .05 ? 'C\'est la force : divise par m.' : Math.abs(v / G - 1) < .05 ? 'Le poids est négligé : a = eE / m.' : 'D\'après la seconde loi de Newton, a = eE / m.'), solution: `<p>a = eE / m = ${sci(a, 2)} ${MS2}</p>` })] };
}
function equation() {
  const p = hasard([['un proton', 1], ['un électron', -1]]);
  const bonne = p[1] > 0 ? 'moins' : 'plus';
  return { theme: 'Équations du mouvement', enonce: `<p>${p[0][0].toUpperCase() + p[0].slice(1)} entre en O avec ${V('v', '0')} horizontale ; ${V('E')} est vertical vers le bas ; axe z vers le haut.</p>`,
    parties: [fq.choix('Expression de z(t) :', [o('moins', `z(t) = −${fr('eE', '2m')} t<sup>2</sup>`), o('plus', `z(t) = +${fr('eE', '2m')} t<sup>2</sup>`), o('g', 'z(t) = −½ g t<sup>2</sup>'), o('v', `z(t) = −${fr('eE', '2m')} t<sup>2</sup> + v<sub>0</sub> t`)], bonne,
      { melanger: false, indices: { g: 'Le poids est négligé : g est remplacé par qE / m.', v: 'v<sub>0</sub> est horizontale : v<sub>z</sub>(0) = 0.', [bonne === 'moins' ? 'plus' : 'moins']: p[1] > 0 ? 'q = +e : force dans le sens de ' + V('E') + ', vers le bas.' : 'q = −e : force opposée à ' + V('E') + ', vers le haut.' },
        solution: `<p>a<sub>z</sub> = −qE / m avec q = ${p[1] > 0 ? 'e' : '−e'} : z(t) = ${p[1] > 0 ? '−' : '+'}(eE / 2m) t<sup>2</sup>.</p>` })] };
}
function nature() {
  const ang = hasard([0, 30]);
  return { theme: 'Nature de la trajectoire', parties: [fq.choix(`Une particule chargée entre dans un condensateur avec ${V('v', '0')} ${ang ? 'inclinée par rapport aux' : 'parallèle aux'} armatures. Sa trajectoire entre les armatures est :`,
    [o('ok', 'une portion de parabole'), o('d', 'une droite'), o('c', 'un arc de cercle')], 'ok', { melanger: false, indices: { d: 'Elle serait rectiligne si ' + V('v', '0') + ' était parallèle à ' + V('E') + '.', c: 'L\'accélération est constante, comme en chute libre.' }, solution: '<p>Accélération constante, non colinéaire à ' + V('v', '0') + ' : parabole.</p>' })] };
}
function poids() {
  const E = hasard([5.0e2, 1.0e3, 2.0e4]), r = E_CH * E / (M_P * G);
  return { theme: 'Poids négligeable', enonce: `<p>Proton (m<sub>p</sub> = 1,67 × 10<sup>−27</sup> kg) dans un champ E = ${sci(E, 1)} ${VM} ; g = 9,81 N·kg<sup>−1</sup>.</p>`,
    parties: [sciP('a) Rapport F<sub>él</sub> / P (1 chiffre significatif) :', 'F<sub>él</sub> / P =', r, '', { cs: 1, rel: .12, diag: v => (Math.abs(v * r - 1) < .2 ? 'Tu as calculé P / F<sub>él</sub>.' : 'F<sub>él</sub> = eE, P = m<sub>p</sub> g.'), solution: `<p>F<sub>él</sub> / P = (1,60 × 10<sup>−19</sup> × ${sci(E, 1)}) / (1,67 × 10<sup>−27</sup> × 9,81) ≈ ${sci(r, 1)}</p>` }),
      fq.choix('b) Conclusion :', [o('ok', 'le poids est négligeable'), o('f', 'la force électrique est négligeable'), o('c', 'il faut tenir compte des deux forces')], 'ok', { melanger: false, colonne: true, indice: 'Le rapport est énorme.', solution: '<p>F<sub>él</sub> est bien plus grande que P : on néglige le poids.</p>' })] };
}
function deviation() {
  const v0 = hasard([2.0e7, 3.0e7]), E = hasard([1.0e4, 2.0e4]), l = hasard([5.0, 8.0]), ts = l / 100 / v0, z = E_CH * E * ts * ts / (2 * M_E);
  return { theme: 'Déviation', enonce: `<p>Un électron (m<sub>e</sub> = 9,11 × 10<sup>−31</sup> kg) entre en O parallèlement aux armatures avec v<sub>0</sub> = ${sci(v0, 1)} ${MS} ; E = ${sci(E, 1)} ${VM} ; longueur des armatures ℓ = ${fmt(l)} cm. On a établi x(t) = v<sub>0</sub> t et z(t) = eE t<sup>2</sup> / (2 m<sub>e</sub>).</p>`,
    parties: [fq.choix('a) L\'électron sort du condensateur au point S. Comment le traduire ?', [o('ok', 'x(t<sub>S</sub>) = ℓ'), o('z', 'z(t<sub>S</sub>) = ℓ'), o('v', 'v<sub>z</sub>(t<sub>S</sub>) = 0')], 'ok',
      { melanger: false, indices: { z: 'ℓ se mesure le long des armatures, sur l\'axe x.', v: 'v<sub>z</sub> ne s\'annule pas : l\'électron est de plus en plus dévié.' }, indice: CU.aide6('le point de sortie S', 'il est au bout des armatures'), solution: '<p>S est au bout des armatures : x(t<sub>S</sub>) = ℓ, donc t<sub>S</sub> = ℓ / v<sub>0</sub>.</p>' }),
      fq.nombre('b) Déviation à la sortie z<sub>S</sub> = z(t<sub>S</sub>), en mm (2 chiffres significatifs) :', 'z<sub>S</sub> =', z * 1000, 'mm', { calc: true, rel: .03, cs: 2, signe: false,
      diag: v => (Math.abs(v / (z * 1000) - 2) < .05 ? 'N\'oublie pas le 2 du dénominateur de z(t).' : 't<sub>S</sub> = ℓ / v<sub>0</sub> (ℓ en mètres), puis z<sub>S</sub> = z(t<sub>S</sub>), converti en mm.'), solution: `<p>t<sub>S</sub> = ${fmt(l / 100)} / ${sci(v0, 1)} = ${sci(ts, 2)} s ; z<sub>S</sub> = z(t<sub>S</sub>) = ${sci(z, 2)} m = ${cs(z * 1000, 2)} mm</p>` })] };
}

CU.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 4 · QUESTIONS', titre: 'Particule chargée dans un champ électrique uniforme',
  intro: '<p class="er-contexte">10 questions : sens de la force et du champ, E = U / L, force, accélération, équations, trajectoire, poids négligeable, déviation.</p>',
  questions: () => melanger([sensF(), sensU(), champE(), force(), acceleration(), equation(), nature(), poids(), deviation(), sensF()]),
  revoir: { href: 'module_4a_cours.html', label: 'Revoir les cours' },
  suite: { href: 'module_5a_cours.html', label: 'Module 5 : accélérateurs →' },
});
CU.menu('module_4_questions');
</script>
</body>
