<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : chute sans vitesse initiale — Mouvement dans un champ uniforme</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="../../assets/equations.css">
<link rel="stylesheet" href="cu.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="cu.js"></script>
<script src="../../assets/equations.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS 1 / 4</span>
    <h2 class="er-titre">Chute sans vitesse initiale</h2>
    <p class="er-contexte">Un objet en <b>chute libre</b> n'est soumis qu'à son <b>poids</b> : son accélération est le <b>champ de pesanteur</b> <span class="vec-nom">g</span>. Premier cas : l'objet est lâché sans vitesse initiale.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Champ de pesanteur uniforme : P⃗ = m g⃗, a⃗ = g⃗ en chute libre,
      unités (N·kg⁻¹ = m·s⁻²), sept unités de base du SI
   2. Repère bien choisi, équations horaires (h = 2,0 m)
   3. Durée de la chute : z(t_chute) = 0 ; isoler t (éditeur EQ)
   ============================================================ */
const { exemple, hasard } = COURS;
const { V, fmt, cs, sys, fr, rac, MS, MS2, CALC, figTir } = CU;
const o = (id, label) => ({ id, label });
const t2 = 't<sup>2</sup>';
const G = 9.81;

/* ---------- 1. Le champ de pesanteur ---------- */
function etape1(c) {
  const carte = c.carte('1. Le champ de pesanteur');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Près de la Terre, tout objet de masse m subit son poids : ${V('P')} = m ${V('g')}. Le vecteur ${V('g')} (champ de pesanteur) est <b>vertical, vers le bas</b>, de valeur g = 9,81 N·kg<sup>−1</sup>.</p>
      <div class="cle"><p><b class="cle-titre">Chute libre.</b> Un objet en chute libre n'est soumis qu'à son poids (frottements et poussée d'Archimède négligés). Dans le référentiel terrestre supposé galiléen, d'après la deuxième loi de Newton :</p>
        <p class="crs-formule">m ${V('a')} = Σ ${V('F', 'ext')} = m ${V('g')} &nbsp;donc&nbsp; ${V('a')} = ${V('g')}</p>
        <p>L'accélération ne dépend pas de la masse : g est aussi l'« accélération de la pesanteur », g = 9,81 ${MS2} (1 N·kg<sup>−1</sup> = 1 kg·${MS2}·kg<sup>−1</sup> = 1 ${MS2}, car 1 N = 1 kg·${MS2}).</p></div>
      <p>Dans une salle, ${V('g')} est le même partout : le champ est <b>uniforme</b>, de coordonnées (0 ; 0 ; −g) dans un repère d'axe z vertical vers le haut. À l'échelle de la Terre, il n'est pas uniforme : il est dirigé vers le centre de la Terre.</p>
      <div class="crs-defile"><table class="crs-tab"><thead><tr><th>Grandeur de base du SI</th><th>Unité</th></tr></thead>
        <tbody><tr><td>longueur</td><td>mètre (m)</td></tr><tr><td>masse</td><td>kilogramme (kg)</td></tr><tr><td>temps</td><td>seconde (s)</td></tr><tr><td>intensité du courant</td><td>ampère (A)</td></tr>
        <tr><td>température</td><td>kelvin (K)</td></tr><tr><td>quantité de matière</td><td>mole (mol)</td></tr><tr><td>intensité lumineuse</td><td>candela (cd)</td></tr></tbody></table></div>
    </div>
    ${exemple(`<p>Une bille de 3 g et une balle de 500 g lâchées de la même hauteur, sans frottements : elles ont la même accélération ${V('g')}, les mêmes conditions initiales, donc le même mouvement. Elles touchent le sol en même temps.</p>`)}`);
  const m = hasard([0.20, 2.0, 5.0, 70]);
  c.aToi(carte, [
    { titre: 'L\'accélération en chute libre', parties: [{ type: 'nombre', q: `Un objet de masse ${fmt(m)} kg est en chute libre (g = 9,81 N·kg<sup>−1</sup>). Que vaut son accélération ?`, label: 'a =', valeur: G, rel: .003, unite: MS2, signe: false,
      diag: v => (Math.abs(v - G * m) < .01 * G * m ? 'Tu as calculé le poids P = m g (en N). L\'accélération vaut a = P / m = g.' : 'En chute libre, ' + V('a') + ' = ' + V('g') + ' : elle ne dépend pas de la masse.'),
      solution: `<p>m ${V('a')} = m ${V('g')}, donc a = g = 9,81 ${MS2}, quelle que soit la masse.</p>` }] },
    { titre: 'Direction', parties: [{ type: 'choix', q: `Dans un repère d'axe z vertical <b>vers le haut</b>, les coordonnées de ${V('g')} sont :`, colonne: false, melanger: false,
      options: [o('ok', '(0 ; 0 ; −g)'), o('p', '(0 ; 0 ; g)'), o('x', '(−g ; 0 ; 0)')], bonne: 'ok',
      indices: { p: V('g') + ' est vers le bas, l\'axe z vers le haut : la coordonnée est négative.', x: V('g') + ' est vertical : il n\'a de coordonnée que sur l\'axe vertical z.' },
      solution: '<p>' + V('g') + ' est vertical, vers le bas : g<sub>z</sub> = −g.</p>' }] },
  ]);
  return carte;
}

/* ---------- 2. Repère et équations horaires ---------- */
function etape2(c) {
  const carte = c.carte('2. Équations horaires d\'une chute sans vitesse initiale');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>À t = 0, une balle de masse m est lâchée sans vitesse initiale d'une hauteur h = 2,0 m. On l'assimile à un point M (son centre de gravité).</p>
      <p><b>Repère bien choisi</b> : la balle tombe verticalement, on prend un seul axe z <b>vertical</b>, orienté vers le haut, d'origine O <b>au sol</b>. (Trois axes x, y, z dont aucun n'est vertical, ou une origine quelconque, compliqueraient les calculs.)</p>
      ${figTir({ h: 2, v0: 0, axe: 'z', traj: false, aria: 'Balle lâchée sans vitesse initiale à la hauteur h, axe z vertical vers le haut, origine au sol' })}
      <div class="cle"><p><b class="cle-titre">Équations horaires.</b> a<sub>z</sub>(t) = −g ; en intégrant, v<sub>z</sub>(t) = −gt + C<sub>1</sub> avec C<sub>1</sub> = v<sub>z</sub>(0) = 0 ; en intégrant, z(t) = −${fr('1', '2')}g${t2} + C<sub>2</sub> avec C<sub>2</sub> = z(0) = h :</p>
        <p class="crs-formule">${sys('v<sub>z</sub>(t) = −g t', `z(t) = −${fr('1', '2')} g ${t2} + h`)}</p></div>
    </div>
    ${exemple(`<p>Avec h = 2,0 m et g = 9,81 ${MS2} : z(t) = −4,905 ${t2} + 2,0. À t = 0,30 s : z = −4,905 × 0,30<sup>2</sup> + 2,0 = <span class="c">1,6 m</span> ; v<sub>z</sub> = −9,81 × 0,30 = <span class="c">−2,9 ${MS}</span> (la balle descend).</p>`)}`);
  const h = hasard([1.5, 3.0, 5.0, 10]);
  c.aToi(carte, [
    { titre: 'La vitesse', enonce: `<p>Une pierre est lâchée sans vitesse initiale d'une hauteur h = ${fmt(h)} m (axe z vertical vers le haut, origine au sol).</p>`,
      parties: [{ type: 'choix', q: 'Expression de v<sub>z</sub>(t) :', colonne: false, melanger: false, options: [o('ok', 'v<sub>z</sub>(t) = −g t'), o('p', 'v<sub>z</sub>(t) = g t'), o('h', 'v<sub>z</sub>(t) = −g t + h'), o('c', 'v<sub>z</sub>(t) = −g')], bonne: 'ok',
        indices: { p: 'L\'axe est vers le haut et la pierre descend : v<sub>z</sub> est négative.', h: 'h est la position initiale, pas la vitesse initiale (nulle).', c: '−g est l\'accélération : intègre-la.' },
        solution: '<p>Primitive de −g : −g t + C<sub>1</sub>, et C<sub>1</sub> = v<sub>z</sub>(0) = 0.</p>' },
      { type: 'choix', q: 'Expression de z(t) :', colonne: false, melanger: false, options: [o('ok', `z(t) = −${fr('1', '2')} g ${t2} + ${fmt(h)}`), o('sans', `z(t) = −${fr('1', '2')} g ${t2}`), o('g', `z(t) = −g ${t2} + ${fmt(h)}`), o('p', `z(t) = ${fr('1', '2')} g ${t2} + ${fmt(h)}`)], bonne: 'ok',
        indices: { sans: `La constante vaut z(0) = h = ${fmt(h)} m (origine au sol).`, g: 'Primitive de −g t : −½ g t².', p: 'v<sub>z</sub> = −g t : la primitive est négative.' },
        solution: `<p>z(t) = −${fr('1', '2')} g ${t2} + C<sub>2</sub> avec C<sub>2</sub> = z(0) = ${fmt(h)} m.</p>` }] },
    { titre: 'Une valeur', parties: [{ type: 'nombre', q: `Pour h = ${fmt(h)} m, que vaut l'altitude z à t = 0,40 s ? (2 chiffres significatifs)`, label: 'z =', valeur: -4.905 * .16 + h, rel: .02, unite: 'm' + CALC,
      diag: v => (Math.abs(v - (h - 9.81 * .16)) < .05 ? 'Il y a un ½ : −½ g t².' : Math.abs(v - 4.905 * .16) < .05 ? 'N\'oublie pas d\'ajouter h.' : 'z = −½ × 9,81 × 0,40<sup>2</sup> + h.'),
      solution: `<p class="crs-calc">z = −0,5 × 9,81 × 0,40<sup>2</sup> + ${fmt(h)} = <span class="c">${cs(-4.905 * .16 + h, 2)} m</span></p>` }] },
  ]);
  return carte;
}

/* ---------- 3. Durée de la chute ---------- */
const GE = { h: 'h', g: 'g', t: 't', deux: '2' };
function etape3(c) {
  const carte = c.carte('3. Durée de la chute');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>On traduit la question : la balle touche le sol quand <b>z(t<sub>chute</sub>) = 0</b>.</p>
      <p class="crs-calc">−${fr('1', '2')} g t<sub>chute</sub><sup>2</sup> + h = 0 ⟺ ${fr('1', '2')} g t<sub>chute</sub><sup>2</sup> = h ⟺ t<sub>chute</sub><sup>2</sup> = ${fr('2h', 'g')}</p>
      <div class="cle"><p class="crs-formule">t<sub>chute</sub> = ${rac(fr('2h', 'g'))}</p><p>(la racine négative n'a pas de sens physique : t<sub>chute</sub> > 0). La durée de chute ne dépend pas de la masse.</p></div>
    </div>
    ${exemple(`<p class="crs-calc">h = 2,0 m : t<sub>chute</sub> = ${rac(fr('2 × 2,0', '9,81'))} = <span class="c">0,64 s</span></p>`)}`);
  const h = hasard([5.0, 10, 20, 45]), t = Math.sqrt(2 * h / G);
  c.aToi(carte, [
    { titre: 'Isole t<sub>chute</sub>', enonce: '<p class="er-consigne">Dans l\'éditeur, isole t dans h = ½ g t<sup>2</sup> : glisse les grandeurs d\'un membre à l\'autre et utilise l\'outil √ (sur les deux membres), puis « Vérifier l\'étape ».</p>',
      parties: [EQ.partie(EQ.exercice({ eq: 'h = [1|deux] g t^2', g: GE, cible: 't', outils: ['sqrt'],
        valeurs: () => { const g = 1 + Math.random() * 20, t = .5 + Math.random() * 5; return { g, t, h: g * t * t / 2, deux: 2 }; },
        aides: ['Le 2 du dénominateur passe de l\'autre côté en multipliant : glisse-le à côté de h.', 'g multiplie t<sup>2</sup> : glisse-le de l\'autre côté, il divisera.', 'Applique √ aux deux membres pour passer de t<sup>2</sup> à t.'] }),
      { solution: `<p>t = ${rac(fr('2h', 'g'))}</p>` })] },
    { titre: 'Calcule', parties: [{ type: 'nombre', q: `Une pierre tombe sans vitesse initiale d'une hauteur h = ${fmt(h)} m. Durée de la chute (2 chiffres significatifs) :`, label: 't<sub>chute</sub> =', valeur: t, rel: .02, unite: 's' + CALC, signe: false,
      diag: v => (Math.abs(v - Math.sqrt(h / G)) < .02 * t ? 'Il manque le 2 : t = √(2h / g).' : Math.abs(v - 2 * h / G) < .03 ? 'N\'oublie pas la racine carrée.' : 't<sub>chute</sub> = √(2h / g).'),
      solution: `<p class="crs-calc">t<sub>chute</sub> = ${rac(fr(`2 × ${fmt(h)}`, '9,81'))} = <span class="c">${cs(t, 2)} s</span></p>` }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p>Chute libre : seul le poids agit, donc <b>${V('a')} = ${V('g')}</b> (vertical, vers le bas, g = 9,81 ${MS2}), quelle que soit la masse.</p></div>
    <div class="cle"><p>Sans vitesse initiale, axe z vers le haut, origine au sol : v<sub>z</sub>(t) = −g t ; z(t) = −½ g ${t2} + h.</p></div>
    <div class="cle"><p>Le sol est atteint pour z = 0 : t<sub>chute</sub> = √(2h / g).</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2b_cours.html">Cours : vitesse initiale horizontale →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html#sans-vitesse">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
CU.menu('module_2a_cours');
</script>
</body>
</html>
