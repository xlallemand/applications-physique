<title>Module 5 : questions — Mouvement dans un champ uniforme</title>

<div id="app-nav"></div>
<div class="er-page" id="app"></div>

<script>
/* ============================================================
   Série du module 5 : 10 questions.
   Vitesse de sortie par la méthode, étape par étape (q = e ou −e),
   traduction de la sortie, tension nécessaire, influence de L, nombre
   d'étages, polarité au bon moment, durée de traversée, applications.
   ============================================================ */
const { o, fq, fmt, cs, sci, hasard, melanger, V, MS, MS2, VM, fr, rac, E_CH, M_P, M_E } = CU;
const sciP = (q, label, valeur, unite, opts) => Object.assign({ type: 'sci', q, label, valeur, unite, cs: 2, rel: .03, calc: true }, opts);
const PART = [['un proton', M_P, '1,67 × 10<sup>−27</sup>', 1], ['un électron', M_E, '9,11 × 10<sup>−31</sup>', -1]];

function vSortie() {
  const p = hasard(PART), U = hasard([200, 1000, 4.0e3]), L = hasard([2.0, 4.0, 5.0]), E = U / (L / 100), a = E_CH * E / p[1], t = Math.sqrt(2 * (L / 100) / a), v = a * t;
  return { theme: 'Vitesse de sortie, étape par étape', enonce: `<p>${p[0][0].toUpperCase() + p[0].slice(1)} (m = ${p[2]} kg) part du repos sur une armature d'un condensateur de largeur L = ${fmt(L)} cm soumis à U = ${fmt(U)} V (E = U / L). On prend l'axe x de son mouvement, d'origine O au point de départ.</p>`,
    parties: [sciP('a) Seconde loi de Newton, poids négligé : valeur de l\'accélération a = eE / m :', 'a =', a, MS2, { diag: x => (Math.abs(x / (E_CH * U / p[1]) - 1) < .05 ? 'E = U / L avec L en mètres.' : 'E = U / L, puis a = eE / m.'), solution: `<p>E = ${fmt(U)} / ${fmt(L / 100)} = ${sci(E, 2)} ${VM} ; a = 1,60 × 10<sup>−19</sup> × ${sci(E, 2)} / ${p[2]} = ${sci(a, 2)} ${MS2}</p>` }),
      sciP('b) La sortie se traduit par x(t<sub>sortie</sub>) = L, avec x(t) = ½ a t² : date de sortie :', 't<sub>sortie</sub> =', t, 's', { diag: x => (Math.abs(x / (t * t) - 1) < .05 ? 'Tu as calculé t² : prends la racine.' : '½ a t<sub>sortie</sub><sup>2</sup> = L donne t<sub>sortie</sub><sup>2</sup> = 2L / a.'), solution: `<p>½ a t<sub>sortie</sub><sup>2</sup> = L ⟺ t<sub>sortie</sub> = ${rac(fr('2L', 'a'))} = ${sci(t, 2)} s</p>` }),
      sciP('c) Vitesse de sortie, v<sub>sortie</sub> = v<sub>x</sub>(t<sub>sortie</sub>) = a t<sub>sortie</sub> :', 'v =', v, MS, { diag: () => 'v<sub>x</sub>(t) = a t : remplace t par t<sub>sortie</sub>.', solution: `<p>v<sub>sortie</sub> = ${sci(a, 2)} × ${sci(t, 2)} = ${sci(v, 2)} ${MS}</p>` })] };
}
function traduction() {
  return { theme: 'Traduire la question', parties: [fq.choix('Une particule part du repos en O sur une armature (axe x vers l\'autre armature, distante de L). Quelle équation traduit « elle sort par l\'autre armature » ?', [o('ok', 'x(t<sub>sortie</sub>) = L'), o('v', 'v<sub>x</sub>(t<sub>sortie</sub>) = 0'), o('z', 'x(t<sub>sortie</sub>) = 0')], 'ok',
    { melanger: false, indices: { v: 'La particule sort avec une vitesse non nulle : c\'est une position qu\'il faut traduire.', z: 'x = 0 est le point de départ.' }, indice: CU.aide6('l\'autre armature', 'son abscisse'), solution: '<p>L\'autre armature est à l\'abscisse L : x(t<sub>sortie</sub>) = L.</p>' }),
    fq.choix('Une fois t<sub>sortie</sub> connu, la vitesse de sortie s\'obtient par :', [o('ok', 'v<sub>sortie</sub> = v<sub>x</sub>(t<sub>sortie</sub>)'), o('x', 'v<sub>sortie</sub> = x(t<sub>sortie</sub>) / t<sub>sortie</sub>'), o('a', 'v<sub>sortie</sub> = a<sub>x</sub> / t<sub>sortie</sub>')], 'ok',
    { melanger: false, colonne: true, indices: { x: 'Ce serait une vitesse moyenne : la vitesse augmente pendant la traversée.', a: 'v<sub>x</sub>(t) = a<sub>x</sub> t.' }, solution: '<p>On remplace t par t<sub>sortie</sub> dans l\'équation de la vitesse.</p>' })] };
}
function tension() {
  const p = hasard(PART), v = p[3] > 0 ? hasard([1.0e6, 4.0e6]) : hasard([1.0e7, 3.0e7]), U = p[1] * v * v / (2 * E_CH);
  return { theme: 'Tension nécessaire', parties: [sciP(`Quelle tension faut-il pour accélérer ${p[0]} (m = ${p[2]} kg) du repos jusqu'à ${sci(v, 1)} ${MS} ?`, 'U =', U, 'V',
    { diag: x => (Math.abs(x / (2 * U) - 1) < .05 ? 'Il y a un 2 : v<sup>2</sup> = 2eU / m.' : 'La méthode donne v<sub>sortie</sub><sup>2</sup> = 2eU / m : isole U.'), solution: `<p>v<sup>2</sup> = 2eU / m ⟺ U = m v<sup>2</sup> / (2e) = ${sci(U, 2)} V</p>` })] };
}
function largeur() {
  return { theme: 'Influence de la largeur', parties: [fq.choix('À tension égale, on remplace un condensateur de 2 cm de large par un condensateur de 10 cm. La vitesse de sortie d\'un proton :', [o('ok', 'est la même'), o('p', 'est 5 fois plus grande'), o('m', 'est 5 fois plus petite')], 'ok',
    { melanger: false, indices: { p: 'E est 5 fois plus petit, sur une distance 5 fois plus grande.', m: 'Dans l\'expression obtenue par la méthode, en remplaçant E par U / L, L se simplifie.' }, solution: '<p>En remplaçant E par U / L dans l\'expression de v<sub>sortie</sub>, L se simplifie : elle n\'intervient pas.</p>' })] };
}
function etages() {
  const U = hasard([1.0e4, 2.0e4, 5.0e4]), vise = hasard([5.0e6, 8.0e6, 1.0e7]), Utot = M_P * vise * vise / (2 * E_CH), n = Math.ceil(Utot / U);
  return { theme: 'Nombre d\'étages', enonce: `<p>Accélérateur linéaire : chaque étage est soumis à U = ${fmt(U / 1000)} kV. Pour amener un proton, parti du repos, à ${sci(vise, 1)} ${MS}, il faudrait un seul condensateur de tension U<sub>tot</sub> = ${cs(Utot / 1000, 3)} kV.</p>`,
    parties: [fq.nombre('Nombre minimal d\'étages (n étages de tension U accélèrent comme un seul condensateur de tension n U) :', 'n =', n, '', { tol: 1e-9, signe: false, calc: true, dec: 0,
      diag: x => (Math.abs(x - Utot / U) < 1 && x < n ? 'Avec ce nombre, la vitesse n\'est pas tout à fait atteinte : arrondis à l\'entier supérieur.' : 'n U ≥ U<sub>tot</sub>, donc n ≥ U<sub>tot</sub> / U, arrondi à l\'entier supérieur.'),
      solution: `<p>n ≥ U<sub>tot</sub> / U = ${cs(Utot / U, 3)}, donc n = ${n}.</p>` })] };
}
function polarite() {
  const p = hasard([['un proton', 1], ['un électron', -1]]);
  return { theme: 'Polarité', enonce: `<p>Dans un accélérateur linéaire, ${p[0]} vient de traverser le condensateur C<sub>1</sub> et entre dans C<sub>2</sub>, vers la droite.</p>`,
    parties: [fq.choix('a) Que doit-on faire au moment où il change de condensateur ?', [o('ok', 'inverser la polarité du générateur'), o('rien', 'ne rien changer'), o('couper', 'couper le générateur')], 'ok',
      { melanger: false, colonne: true, indices: { rien: 'Le champ de C<sub>2</sub> serait opposé à celui de C<sub>1</sub> : il serait freiné.', couper: 'Sans champ, il ne serait plus accéléré.' }, solution: '<p>On inverse la polarité, pour que le champ dans C<sub>2</sub> l\'accélère.</p>' }),
    fq.choix(`b) Dans C<sub>2</sub>, ${V('E')} doit alors être dirigé :`, [o('d', 'vers la droite'), o('g', 'vers la gauche')], p[1] > 0 ? 'd' : 'g',
      { melanger: false, indice: p[1] > 0 ? 'Charge positive : la force a le sens de ' + V('E') + '.' : 'Charge négative : la force est opposée à ' + V('E') + '.', solution: `<p>${p[1] > 0 ? 'Proton : ' + V('E') + ' dans le sens du mouvement.' : 'Électron : ' + V('E') + ' opposé au mouvement, pour que −e' + V('E') + ' soit vers la droite.'}</p>` })] };
}
function duree() {
  const U = hasard([1.0e3, 5.0e3]), L = hasard([2.0, 5.0]), E = U / (L / 100), a = E_CH * E / M_P, t = Math.sqrt(2 * (L / 100) / a);
  return { theme: 'Durée de la traversée', enonce: `<p>Un proton part du repos dans un condensateur de largeur L = ${fmt(L)} cm soumis à U = ${fmt(U)} V (m<sub>p</sub> = 1,67 × 10<sup>−27</sup> kg).</p>`,
    parties: [sciP('a) Accélération du proton :', 'a =', a, MS2, { diag: () => 'E = U / L (L en m), puis a = eE / m<sub>p</sub>.', solution: `<p>E = ${fmt(U)} / ${fmt(L / 100)} = ${sci(E, 2)} ${VM} ; a = eE / m<sub>p</sub> = ${sci(a, 2)} ${MS2}</p>` }),
      sciP('b) Durée de la traversée (la sortie se traduit par x(t) = ½ a t² = L) :', 't =', t, 's', { diag: () => '½ a t² = L donne t² = 2L / a, avec L en m.', solution: `<p>½ a t<sup>2</sup> = L ⟺ t = ${rac(fr(`2 × ${fmt(L / 100)}`, sci(a, 2)))} = ${sci(t, 2)} s</p>` })] };
}
function application() {
  return { theme: 'Applications', parties: [fq.choix('Au CERN, avant d\'être injectés dans les grands anneaux, les protons sont :', [o('ok', 'accélérés dans des accélérateurs linéaires'), o('d', 'déviés par un seul condensateur'), o('r', 'ralentis')], 'ok',
    { melanger: false, colonne: true, indices: { d: 'Il faut d\'abord leur donner de la vitesse.', r: 'Il s\'agit de les accélérer.' }, solution: '<p>Les accélérateurs linéaires sont la première étape de la chaîne d\'accélération.</p>' })] };
}
function independance() {
  return { theme: 'Vitesse de sortie', parties: [fq.choix('La vitesse de sortie d\'un accélérateur linéaire dépend :', [o('ok', 'de la tension, de la charge et de la masse de la particule'), o('l', 'de la largeur des condensateurs'), o('t', 'seulement de la tension')], 'ok',
    { melanger: false, colonne: true, indices: { l: 'En remplaçant E par U / L, L se simplifie.', t: 'Un électron et un proton n\'ont pas la même vitesse avec la même tension : a = qE / m.' }, solution: '<p>La méthode donne une vitesse qui dépend de U, de q et de m ; L se simplifie.</p>' })] };
}

CU.serie({
  app: document.getElementById('app'),
  badge: 'MODULE 5 · QUESTIONS', titre: 'Accélérateurs de particules',
  intro: '<p class="er-contexte">10 questions : vitesse de sortie, tension nécessaire, nombre d\'étages, polarité au bon moment, applications.</p>',
  questions: () => melanger([vSortie(), traduction(), tension(), largeur(), etages(), polarite(), duree(), application(), independance(), vSortie()]),
  revoir: { href: 'module_5a_cours.html', label: 'Revoir les cours' },
  suite: { href: 'module_6.html', label: 'Module 6 : exercices →' },
});
CU.menu('module_5_questions');
</script>
