<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 : de l'accélération à la position — Mouvement dans un champ uniforme</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="cu.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="cu.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 1 · COURS</span>
    <h2 class="er-titre">De l'accélération à la position : intégrer</h2>
    <p class="er-contexte">La deuxième loi de Newton donne l'<b>accélération</b>. Pour connaître la <b>vitesse</b> puis la <b>position</b> à chaque instant, on cherche des <b>primitives</b> et on fixe les constantes avec les <b>conditions initiales</b>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. La chaîne a⃗ → v⃗ → OM⃗ et les primitives (0, A, At)
   2. Les constantes et les conditions initiales (atelier : glisser la
      courbe jusqu'à la condition initiale, CU.partieConstante)
   3. Les six étapes de résolution
   ============================================================ */
const { exemple, hasard, melanger } = COURS;
const { V, fmt, sys, fr, MS, MS2 } = CU;
const o = (id, label) => ({ id, label });
const t2 = 't<sup>2</sup>';
// écrit a t² + b t + c sans termes nuls ni coefficients 1
function poly(a, b, c) {
  const t = [[a, t2], [b, 't'], [c, '']].filter(x => x[0]);
  if (!t.length) return '0';
  return t.map(([k, p], i) => (k < 0 ? (i ? ' − ' : '−') : (i ? ' + ' : '')) + (Math.abs(k) === 1 && p ? '' : fmt(Math.abs(k))) + p).join('');
}

/* ---------- 1. Intégrer : les primitives ---------- */
function etape1(c) {
  const carte = c.carte('1. De l\'accélération à la position : intégrer');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Pour étudier un mouvement, on part des forces et on remonte jusqu'à la position :</p>
      <ol class="cu-methode">
        <li><b>Bilan des forces</b> : on obtient Σ ${V('F', 'ext')}.</li>
        <li><b>Deuxième loi de Newton</b> : m ${V('a')} = Σ ${V('F', 'ext')} donne l'accélération ${V('a')}.</li>
        <li>${V('a')} = ${fr(`d${V('v')}`, 'dt')} : on <b>intègre</b> ${V('a')} pour obtenir ${V('v')}.</li>
        <li>${V('v')} = ${fr(`d${V('OM')}`, 'dt')} : on <b>intègre</b> ${V('v')} pour obtenir ${V('OM')}.</li>
      </ol>
      <p>Intégrer par rapport au temps, c'est chercher une <b>primitive</b> : une fonction dont la dérivée est la fonction de départ.</p>
      <div class="cle"><p><b class="cle-titre">Primitives à connaître.</b> A est une constante ; C, C<sub>1</sub>, C<sub>2</sub>… sont des constantes à déterminer.</p>
        <div class="crs-defile"><table class="crs-tab"><thead><tr><th>Fonction</th><th>Primitive</th></tr></thead>
          <tbody><tr><td>0</td><td>C</td></tr><tr><td>A</td><td>A t + C<sub>1</sub></td></tr><tr><td>A t</td><td>${fr('1', '2')} A ${t2} + C<sub>2</sub></td></tr></tbody></table></div>
        <p>On vérifie toujours en <b>dérivant</b> : la dérivée de ${fr('1', '2')} A ${t2} + C<sub>2</sub> est bien A t (la dérivée d'une constante est nulle).</p></div>
    </div>
    ${exemple(`<p class="crs-calc">primitive de 8 : 8t + C &nbsp;·&nbsp; de 8t : 4${t2} + C &nbsp;·&nbsp; de 8t + 8 : 4${t2} + 8t + C &nbsp;·&nbsp; de 5t + 3 : 2,5${t2} + 3t + C</p>
      <p>Avec des vecteurs, on intègre chaque coordonnée : la primitive de 3 ${V('i')} + 4t ${V('j')} est 3t ${V('i')} + 2${t2} ${V('j')} + ${V('C')} (${V('C')} : vecteur constant).</p>`)}`);
  const A = hasard([2, 3, 5, 6, 9.8]), k = hasard([4, 6, 10, 3]), b = hasard([2, 5, 7]);
  c.aToi(carte, [
    { titre: 'Primitive d\'une constante', parties: [{ type: 'choix', q: `Quelle est une primitive de ${fmt(A)} ?`, colonne: false,
      options: [o('ok', `${fmt(A)}t + C`), o('t2', `${fmt(A / 2)}${t2} + C`), o('c', `${fmt(A)}`), o('zero', '0')], bonne: 'ok',
      indices: { t2: `La dérivée de ${fmt(A / 2)}${t2} est ${fmt(A)}t, pas ${fmt(A)}.`, c: `La dérivée d'une constante est nulle : la dérivée de ${fmt(A)} n'est pas ${fmt(A)}.`, zero: 'C\'est la dérivée d\'une constante, pas sa primitive.' },
      solution: `<p>La dérivée de ${fmt(A)}t + C est ${fmt(A)} : c'est bien une primitive.</p>` }] },
    { titre: 'Primitive de A t + B', enonce: `<p>Trouve une primitive de <b>${fmt(k)}t + ${b}</b> : écris-la sous la forme a ${t2} + b t + C.</p>`,
      parties: [{ type: 'champs', ligne: true, q: 'Complète les coefficients.', champs: [{ label: 'a =', valeur: k / 2, signe: false }, { label: 'b =', valeur: b, signe: false }],
        diag: v => (Math.abs(v[0] - k) < 1e-9 ? `La primitive de ${fmt(k)}t est ${fr('1', '2')} × ${fmt(k)} ${t2} : n'oublie pas le ½.` : Math.abs(v[0] - 2 * k) < 1e-9 ? `On divise par 2, on ne multiplie pas : ${fr('1', '2')} × ${fmt(k)}.` : 'Primitive de A t : ½ A t², primitive de B : B t.'),
        solution: `<p>Primitive : ${poly(k / 2, b, 0)} + C ; en dérivant : ${fmt(k)}t + ${b}.</p>` }] },
    { titre: 'Avec des vecteurs', parties: [{ type: 'choix', q: `Quelle est une primitive de −9,8 ${V('j')} (vecteur constant) ?`, colonne: true,
      options: [o('ok', `−9,8t ${V('j')} + ${V('C')}`), o('t2', `−4,9${t2} ${V('j')} + ${V('C')}`), o('rien', `−9,8 ${V('j')}`)], bonne: 'ok',
      indices: { t2: `C'est la primitive de −9,8t ${V('j')}.`, rien: 'Une constante n\'est pas sa propre primitive : sa dérivée serait nulle.' },
      solution: `<p>On intègre la coordonnée : −9,8 donne −9,8t, plus un vecteur constant ${V('C')}.</p>` }] },
  ]);
  return carte;
}

/* ---------- 2. Les constantes : conditions initiales ---------- */
function etape2(c) {
  const carte = c.carte('2. Fixer les constantes : les conditions initiales');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Une primitive est connue à une constante près : toutes les courbes v(t) = A t + C ont la même pente, elles sont décalées verticalement. Pour choisir <b>la bonne</b>, on utilise une valeur connue, en général à t = 0 : la <b>condition initiale</b>.</p>
      <div class="cle"><p><b class="cle-titre">Conditions initiales.</b> On remplace t par 0 dans l'expression trouvée : v(0) = A × 0 + C, donc <b>C = v(0)</b> (vitesse initiale) ; de même, la constante de la position vaut <b>x(0)</b> (position initiale).</p></div>
    </div>
    ${exemple(`<p>a(t) = 0 et v(0) = 8 ${MS} : v(t) = C et v(0) = C = 8, donc <b>v(t) = 8 ${MS}</b>.</p>
      <p>v<sub>x</sub>(t) = 8t et x(0) = 5 m : x(t) = 4${t2} + C ; x(0) = 4 × 0 + C = C = 5, donc <b>x(t) = 4${t2} + 5</b>.</p>`)}`);
  const A = hasard([1, 2, 3]), v0 = hasard([2, 3, 4, 5]) * hasard([1, -1]), A2 = hasard([2, 4]), x0 = hasard([1, 3, 5, 6]);
  c.aToi(carte, [
    { titre: 'Atelier : glisse la courbe', enonce: `<p>a(t) = ${A} ${MS2}, donc v(t) = ${A}t + C. La vitesse initiale vaut v(0) = ${fmt(v0)} ${MS}. Glisse la courbe de v(t) (ou utilise ▲ ▼) jusqu'à ce qu'elle passe par le point de la condition initiale, puis valide.</p>`,
      parties: [CU.partieConstante({ A, C0: v0, forme: 'lin', nom: 'v', ymin: -6, ymax: 16, depart: v0 > 0 ? -3 : 4, solution: `<p>C = v(0) = ${fmt(v0)}, donc v(t) = ${A}t ${v0 < 0 ? '−' : '+'} ${Math.abs(v0)} (en ${MS}).</p>` })] },
    { titre: 'La position', enonce: `<p>v<sub>x</sub>(t) = ${A2}t et x(0) = ${x0} m, donc x(t) = ${fmt(A2 / 2)}${t2} + C. Glisse la courbe de x(t) jusqu'à la condition initiale.</p>`,
      parties: [CU.partieConstante({ A: A2, C0: x0, forme: 'quad', nom: 'x', ymin: -4, ymax: 20, tmax: 3, depart: -2, solution: `<p>C = x(0) = ${x0}, donc x(t) = ${fmt(A2 / 2)}${t2} + ${x0} (en m).</p>` })] },
    { titre: 'Sans dessin', parties: [{ type: 'nombre', q: `v<sub>x</sub>(t) = −4t + C<sub>1</sub> et v<sub>x</sub>(0) = 6 ${MS}. Que vaut C<sub>1</sub> ?`, label: 'C<sub>1</sub> =', valeur: 6, tol: 1e-9, unite: MS,
      diag: v => (v === -6 ? 'À t = 0, −4 × 0 = 0 : C<sub>1</sub> = v<sub>x</sub>(0), sans changer de signe.' : v === -4 ? 'C<sub>1</sub> est la valeur de v<sub>x</sub> à t = 0, pas le coefficient de t.' : 'Remplace t par 0 : v<sub>x</sub>(0) = C<sub>1</sub>.'),
      solution: `<p>v<sub>x</sub>(0) = −4 × 0 + C<sub>1</sub> = C<sub>1</sub>, donc C<sub>1</sub> = 6 ${MS}.</p>` }] },
  ]);
  return carte;
}

/* ---------- 3. Les six étapes ---------- */
const ETAPES = ['Système, schéma (on y reporte les données) et repère', 'Bilan des forces', 'Accélération par la deuxième loi de Newton',
  'Vitesse : on intègre l\'accélération, puis conditions initiales', 'Position : on intègre la vitesse, puis conditions initiales',
  'Caractéristiques du mouvement (trajectoire, hauteur maximale, durée de chute…) : on traduit la question par une ou plusieurs équations établies'];
function etape3(c) {
  const carte = c.carte('3. Les six étapes de résolution');
  c.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Méthode.</b></p><ol class="cu-methode">${ETAPES.map(e => `<li>${e}.</li>`).join('')}</ol></div>
      <p>Les étapes 4 et 5 se rédigent en deux temps : « En intégrant, … + C<sub>1</sub> » puis « avec, à t = 0, C<sub>1</sub> = v<sub>x</sub>(0) = … ».</p>
    </div>
    ${exemple(`<p>Une balle tombe sans vitesse initiale d'une hauteur h (axe z vertical vers le haut, origine au sol) :</p>
      <p class="crs-calc">a<sub>z</sub>(t) = −g &nbsp;⟹&nbsp; v<sub>z</sub>(t) = −gt + C<sub>1</sub>, avec C<sub>1</sub> = v<sub>z</sub>(0) = 0 &nbsp;⟹&nbsp; z(t) = −${fr('1', '2')}g${t2} + C<sub>2</sub>, avec C<sub>2</sub> = z(0) = h</p>
      <p>Étape 6 : « la balle touche le sol » se traduit par z(t<sub>chute</sub>) = 0.</p>`)}`);
  const ordre = melanger([0, 1, 2]);
  c.aToi(carte, [
    { titre: 'Dans l\'ordre', parties: [{ type: 'choix', q: 'Que fait-on juste après avoir obtenu l\'accélération ?', colonne: true,
      options: [o('ok', 'On intègre pour obtenir la vitesse, puis on fixe la constante avec la vitesse initiale.'), o('pos', 'On intègre pour obtenir directement la position.'), o('der', 'On dérive l\'accélération pour obtenir la vitesse.')], bonne: 'ok',
      indices: { pos: 'Il faut intégrer deux fois : d\'abord la vitesse, puis la position.', der: 'L\'accélération est la dérivée de la vitesse : pour remonter à la vitesse, on intègre.' },
      solution: '<p>Étape 4 : on intègre ' + V('a') + ', puis on utilise ' + V('v') + '(0).</p>' }] },
    { titre: 'Traduire la question', parties: [{ type: 'choix', q: 'Une balle lancée vers le haut atteint son point le plus haut. Comment le traduire ?', colonne: true,
      options: melanger([o('ok', 'La coordonnée verticale de la vitesse est nulle : v<sub>z</sub> = 0.'), o('z0', 'La position verticale est nulle : z = 0.'), o('a0', 'L\'accélération est nulle.')]), bonne: 'ok', melanger: false,
      indices: { z0: 'z = 0 traduit le retour au sol (si l\'origine est au sol).', a0: 'L\'accélération vaut toujours ' + V('g') + ' : elle n\'est jamais nulle en chute libre.' },
      solution: '<p>Au sommet, le vecteur vitesse est horizontal : v<sub>z</sub> = 0.</p>' }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p>${V('a')} → on intègre → ${V('v')} → on intègre → ${V('OM')}. Primitives : 0 → C ; A → A t + C<sub>1</sub> ; A t → ½ A ${t2} + C<sub>2</sub>.</p></div>
    <div class="cle"><p>Les constantes se fixent avec les <b>conditions initiales</b> : C<sub>1</sub> = v(0), C<sub>2</sub> = x(0).</p></div>
    <div class="cle"><p>Six étapes : repère, forces, accélération, vitesse, position, puis on traduit la question par une équation.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_1_questions.html">Questions du module 1 →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_2a_cours.html">Module 2 : chute libre</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_1.html">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
CU.menu('module_1_cours');
</script>
</body>
</html>
