<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : exploiter les équations — Mouvement dans un champ uniforme</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="cu.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="cu.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS 4 / 4</span>
    <h2 class="er-titre">Exploiter les équations</h2>
    <p class="er-contexte">Une question sur le mouvement se <b>traduit par une équation</b> : au <b>sommet</b>, v<sub>y</sub> = 0 ; au <b>point de chute</b>, y = 0 ; pour une <b>cible</b>, on calcule y à l'abscisse de la cible.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   1. Sommet de la trajectoire : v_y = 0 → t_sommet → altitude maximale
   2. Point de chute : y = 0 (second degré) → t_chute → distance, vitesse
   3. Une cible : y(x_cible) (panier de basket à 4,6 m, cercle à 3,0 m)
   Exemple du cours : v₀ = 5,0 m·s⁻¹, α = 40°, h = 2,0 m.
   ============================================================ */
const { exemple, hasard } = COURS;
const { V, fmt, cs, sys, fr, rac, MS, MS2, CALC, figTir } = CU;
const o = (id, label) => ({ id, label });
const t2 = 't<sup>2</sup>';
const G = 9.81, rad = d => d * Math.PI / 180;

/* ---------- tableau « point particulier → traduction mathématique » ---------- */
const TABLEAU = `<div class="crs-defile"><table class="crs-tab cu-tab-g"><thead><tr><th>Point particulier</th><th>Traduction mathématique</th></tr></thead><tbody>
  <tr><td>Sommet S (altitude maximale)</td><td>${V('v')} horizontal : v<sub>y</sub>(t<sub>S</sub>) = 0 donne t<sub>S</sub>, puis y(t<sub>S</sub>) donne l'altitude maximale</td></tr>
  <tr><td>Point de chute C</td><td>y(t<sub>chute</sub>) = 0 donne t<sub>chute</sub> ; ou y(x) = 0 donne la distance d ; v = √(v<sub>x</sub><sup>2</sup> + v<sub>y</sub><sup>2</sup>) à t<sub>chute</sub> donne la vitesse au sol</td></tr>
  <tr><td>Autre point (cible, panier, transversale d'un but…)</td><td>une condition sur x(t), y(t), y(x), v<sub>x</sub>(t) ou v<sub>y</sub>(t) : par exemple y(x<sub>cible</sub>)</td></tr></tbody></table></div>`;

/* ---------- 1. Le sommet ---------- */
function etape1(c) {
  const carte = c.carte('1. Le sommet de la trajectoire');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Au sommet S, la balle ne monte plus et ne descend pas encore : le vecteur vitesse est <b>horizontal</b>.</p>
      ${figTir({ h: 2, v0: 5, alpha: 40, sommet: 'v', chute: true, aria: 'Au sommet S de la trajectoire, le vecteur vitesse est horizontal ; C est le point de chute' })}
      <div class="cle"><p class="crs-formule">v<sub>y</sub>(t<sub>S</sub>) = 0 ⟺ −g t<sub>S</sub> + v<sub>0</sub> sin α = 0 ⟺ t<sub>S</sub> = ${fr('v<sub>0</sub> sin α', 'g')}</p>
        <p>puis l'altitude maximale y<sub>max</sub> = y(t<sub>S</sub>).</p></div>
    </div>
    ${exemple(`<p class="crs-calc">t<sub>S</sub> = ${fr('5,0 × sin 40°', '9,81')} = 0,328 s ; y<sub>max</sub> = −4,905 × 0,328<sup>2</sup> + 3,21 × 0,328 + 2,0 = <span class="c">2,5 m</span></p>`)}`);
  const v0 = hasard([8.0, 10, 12]), al = hasard([30, 45, 60]), h = hasard([0, 1.0, 2.0]);
  const vy = v0 * Math.sin(rad(al)), ts = vy / G, ym = h + vy * vy / (2 * G);
  c.aToi(carte, [
    { titre: 'Altitude maximale', enonce: `<p>v<sub>0</sub> = ${fmt(v0)} ${MS}, α = ${al}°, h = ${fmt(h)} m.</p>`,
      parties: [{ type: 'nombre', q: 'Date t<sub>S</sub> du sommet (3 chiffres significatifs) :', label: 't<sub>S</sub> =', valeur: ts, rel: .01, unite: 's' + CALC, signe: false,
        diag: v => (Math.abs(v - v0 * Math.cos(rad(al)) / G) < .02 * ts ? 'C\'est v<sub>y</sub> qui s\'annule : v<sub>0</sub> sin α.' : 't<sub>S</sub> = v<sub>0</sub> sin α / g.'), solution: `<p>t<sub>S</sub> = ${fmt(v0)} × sin ${al}° / 9,81 = ${cs(ts, 3)} s</p>` },
      { type: 'nombre', q: 'Altitude maximale (2 chiffres significatifs) :', label: 'y<sub>max</sub> =', valeur: ym, rel: .02, unite: 'm' + CALC, signe: false,
        diag: v => (Math.abs(v - (ym - h)) < .02 * ym ? 'N\'oublie pas h.' : 'y<sub>max</sub> = y(t<sub>S</sub>) = −½ g t<sub>S</sub><sup>2</sup> + (v<sub>0</sub> sin α) t<sub>S</sub> + h.'),
        solution: `<p>y<sub>max</sub> = −4,905 × ${cs(ts, 3)}<sup>2</sup> + ${cs(vy, 3)} × ${cs(ts, 3)} + ${fmt(h)} = ${cs(ym, 2)} m</p>` }] },
  ]);
  return carte;
}

/* ---------- 2. Le point de chute ---------- */
function etape2(c) {
  const carte = c.carte('2. Le point de chute');
  c.ajouter(carte, `<div class="cours-bloc">
      <p>Au sol, y(t<sub>chute</sub>) = 0 : −½ g t<sup>2</sup> + (v<sub>0</sub> sin α) t + h = 0, équation du <b>second degré</b>. Discriminant Δ = (v<sub>0</sub> sin α)<sup>2</sup> + 2gh > 0 : deux racines, une seule est positive.</p>
      <div class="cle"><p class="crs-formule">t<sub>chute</sub> = ${fr('v<sub>0</sub> sin α + √Δ', 'g')}</p>
        <p>(l'autre racine est négative : elle n'a pas de sens physique). Distance du lancer : d = x(t<sub>chute</sub>) = (v<sub>0</sub> cos α) t<sub>chute</sub>. Vitesse au sol : v = √(v<sub>x</sub><sup>2</sup> + v<sub>y</sub><sup>2</sup>) à t<sub>chute</sub>.</p></div>
    </div>
    ${exemple(`<p class="crs-calc">−4,905 t<sup>2</sup> + 3,21 t + 2,0 = 0 ; Δ = 3,21<sup>2</sup> + 4 × 4,905 × 2,0 = 49,6 ; t<sub>chute</sub> = ${fr('3,21 + √49,6', '9,81')} = 1,05 s</p>
      <p class="crs-calc">d = 3,83 × 1,05 = <span class="c">4,0 m</span> ; v<sub>y</sub> = −9,81 × 1,05 + 3,21 = −7,04 ${MS} ; v = √(3,83<sup>2</sup> + 7,04<sup>2</sup>) = <span class="c">8,0 ${MS}</span></p>`)}`);
  const v0 = hasard([6.0, 8.0, 10]), al = hasard([30, 45]), h = hasard([1.0, 2.0, 5.0]);
  const vx = v0 * Math.cos(rad(al)), vy = v0 * Math.sin(rad(al)), tc = (vy + Math.sqrt(vy * vy + 2 * G * h)) / G;
  c.aToi(carte, [
    { titre: 'Durée et distance', enonce: `<p>v<sub>0</sub> = ${fmt(v0)} ${MS}, α = ${al}°, h = ${fmt(h)} m.</p>`,
      parties: [{ type: 'nombre', q: 'Durée de la chute (3 chiffres significatifs) :', label: 't<sub>chute</sub> =', valeur: tc, rel: .01, unite: 's' + CALC, signe: false,
        diag: v => (Math.abs(v - 2 * vy / G) < .02 * tc ? 'Ce serait la durée pour revenir à l\'altitude de départ : il reste à descendre de h.' : Math.abs(v - Math.sqrt(2 * h / G)) < .02 ? 'La vitesse initiale verticale n\'est pas nulle : résous l\'équation du second degré.' : 'Résous −4,905 t² + (v<sub>0</sub> sin α) t + h = 0 et garde la racine positive.'),
        solution: `<p>Δ = ${cs(vy, 3)}<sup>2</sup> + 2 × 9,81 × ${fmt(h)} = ${cs(vy * vy + 2 * G * h, 3)} ; t<sub>chute</sub> = (${cs(vy, 3)} + √Δ) / 9,81 = ${cs(tc, 3)} s</p>` },
      { type: 'nombre', q: 'Distance du lancer (2 chiffres significatifs) :', label: 'd =', valeur: vx * tc, rel: .02, unite: 'm' + CALC, signe: false,
        diag: v => (Math.abs(v - v0 * tc) < .02 * v0 * tc ? 'Sur l\'axe horizontal, la vitesse est v<sub>0</sub> cos α.' : 'd = (v<sub>0</sub> cos α) t<sub>chute</sub>.'), solution: `<p>d = ${cs(vx, 3)} × ${cs(tc, 3)} = ${cs(vx * tc, 2)} m</p>` }] },
  ]);
  return carte;
}

/* ---------- 3. Une cible ---------- */
function etape3(c) {
  const carte = c.carte('3. Atteindre une cible');
  const yp = x => -G * x * x / (2 * Math.pow(7.5 * Math.cos(rad(52)), 2)) + Math.tan(rad(52)) * x + 2;
  c.ajouter(carte, `<div class="cours-bloc">
      ${TABLEAU}
      <p>Pour une cible (panier, barre transversale d'un but), on utilise l'équation de la trajectoire à l'abscisse de la cible : on calcule y(x<sub>cible</sub>) et on compare à la hauteur de la cible.</p>
    </div>
    ${exemple(`<p>Un basketteur lance le ballon de h = 2,0 m, à v<sub>0</sub> = 7,5 ${MS} et α = 52°. Le cercle du panier est à x = 4,6 m et à 3,0 m de haut.</p>
      <p class="crs-calc">y(4,6) = −${fr('9,81', '2 × (7,5 × cos 52°)<sup>2</sup>')} × 4,6<sup>2</sup> + tan 52° × 4,6 + 2,0 = <span class="c">${cs(yp(4.6), 2)} m</span></p>
      <p>y(4,6) = 3,0 m : le ballon passe par le cercle. (Plus grand : au-dessus ; plus petit : en dessous.)</p>`)}`);
  const v0 = hasard([18, 20, 22]), al = hasard([20, 25]), x = hasard([16, 20]);
  const y = -G * x * x / (2 * Math.pow(v0 * Math.cos(rad(al)), 2)) + Math.tan(rad(al)) * x;
  c.aToi(carte, [
    { titre: 'Sous la barre ?', enonce: `<p>Un ballon de football est frappé depuis le sol (h = 0) à v<sub>0</sub> = ${v0} ${MS}, α = ${al}°. Le but est à ${x} m ; sa barre transversale est à 2,44 m de haut.</p>`,
      parties: [{ type: 'nombre', q: 'Hauteur du ballon à l\'abscisse du but (2 chiffres significatifs) :', label: 'y =', valeur: y, rel: .03, unite: 'm' + CALC,
        diag: () => 'y(x) = −g x² / (2 (v<sub>0</sub> cos α)²) + (tan α) x, avec x = ' + x + ' m.', solution: `<p>y(${x}) = −9,81 × ${x}<sup>2</sup> / (2 × (${v0} × cos ${al}°)<sup>2</sup>) + tan ${al}° × ${x} = ${cs(y, 2)} m</p>` },
      { type: 'choix', q: 'Le ballon passe-t-il sous la barre (en supposant qu\'il est entre les poteaux) ?', colonne: false, melanger: false, options: [o('sous', 'oui, en dessous'), o('dessus', 'non, au-dessus'), o('sol', 'il touche le sol avant')],
        bonne: y < 0 ? 'sol' : y < 2.44 ? 'sous' : 'dessus', indice: 'Compare y(' + x + ') à 2,44 m.', solution: `<p>y = ${cs(y, 2)} m ${y < 0 ? '< 0 : le ballon est retombé avant le but.' : y < 2.44 ? '< 2,44 m : il passe sous la barre.' : '> 2,44 m : il passe au-dessus.'}</p>` }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c) {
  const carte = c.carte('À retenir');
  c.ajouter(carte, `<div class="cle"><p>Sommet : v<sub>y</sub> = 0 → t<sub>S</sub> = v<sub>0</sub> sin α / g → y<sub>max</sub> = y(t<sub>S</sub>).</p></div>
    <div class="cle"><p>Point de chute : y = 0 (second degré, racine positive) → t<sub>chute</sub> → d = x(t<sub>chute</sub>) ; vitesse au sol v = √(v<sub>x</sub><sup>2</sup> + v<sub>y</sub><sup>2</sup>).</p></div>
    <div class="cle"><p>Cible : on calcule y(x<sub>cible</sub>) avec l'équation de la trajectoire et on compare.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2_simulation.html">Simulateur : tir dans le champ de pesanteur →</a>
      <a class="btn-secondary" style="text-decoration:none" href="module_2_questions.html">Questions du module 2</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html#exploiter">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, etape3, aRetenir]);
CU.menu('module_2d_cours');
</script>
</body>
</html>
