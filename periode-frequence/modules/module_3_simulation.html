<body>

<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 3 · SIMULATION</span>
    <h2 class="er-titre">Écran d'oscilloscope</h2>
    <p class="er-contexte">Sur un écran d'oscilloscope, on compte les <b>carreaux</b> d'une ou plusieurs périodes, puis on multiplie par la <b>base de temps</b><span id="bulleB"></span> (durée d'un carreau). Change la base de temps : l'affichage change, pas la période.</p>
  </div>
  <div id="zone"></div>
</div>
<script>
SOM.menu('module_3_simulation');
document.getElementById('bulleB').innerHTML = BULLE.info('La <b>base de temps</b> (en ms/carreau) est la durée représentée par un carreau horizontal. La <b>sensibilité verticale</b> (en V/carreau) est la tension représentée par un carreau vertical : elle ne sert pas à mesurer une durée.', 'Base de temps et sensibilité verticale');
PF.simulation(document.getElementById('zone'));
</script>
