<!DOCTYPE html>
<html lang="fr" data-matiere="physique">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 : cours — Somme des forces et variation de la vitesse</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../equilibrer-reactions/modules/er.css">
<link rel="stylesheet" href="../../bilan-forces/modules/bf.css">
<link rel="stylesheet" href="../../assets/sommaire.css">
<link rel="stylesheet" href="../../assets/cours.css">
<script src="../../assets/sommaire.js"></script>
<script src="../../cinematique/modules/vecteurs.js"></script>
<script src="fv.js"></script>
<script src="../../bilan-forces/modules/bf.js"></script>
<script src="../../assets/cours.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="er-page">
  <div class="er-card">
    <span class="er-badge">MODULE 2 · COURS</span>
    <h2 class="er-titre">Somme des forces et variation de la vitesse</h2>
    <p class="er-contexte">Quand les forces ne se compensent pas, leur <b>somme</b> Σ <span class="vec-nom">F</span> modifie la vitesse : la variation du vecteur vitesse <span class="vec-nom">Δv</span> a la <b>même direction</b> et le <b>même sens</b> que Σ <span class="vec-nom">F</span>.</p>
  </div>
  <div id="etapes"></div>
</div>

<script>
/* ============================================================
   Cours par étapes (assets/cours.js) : notion → exemple → « À toi ».
   Module 2 (1re ; moteur de bilan-forces/modules/bf.js) : somme des forces
   dans un quadrillage (BF.partieResultante, repère de
   cinematique/modules/vecteurs.js), puis Δv⃗ (entre deux instants voisins)
   de même direction et de même sens que Σ F⃗ (BF.partieAcc avec nomVec
   'Δv' ; Σ F⃗ à 45° : Δv⃗ peut s'arrêter sur plusieurs nœuds du quadrillage,
   sa longueur n'a pas d'importance) ; m Δv⃗ / Δt ≈ Σ F⃗.
   ============================================================ */
const { hasard, melanger, exemple } = COURS;
const { o, nomV, partieResultante, partieAcc } = BF;
const SF = 'Σ <span class="vec-nom">F</span>', DV = '<span class="vec-nom">Δv</span>';

/* ---------- 1. La somme des forces ---------- */
function etape1(c_) {
  const carte = c_.carte('1. La somme des forces');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Somme des forces.</b> ${SF} = <span class="vec-nom">F</span><sub>1</sub> + <span class="vec-nom">F</span><sub>2</sub> + … : on met les flèches <b>bout à bout</b> ; ${SF} va du point de départ à l'extrémité de la dernière flèche.</p>
        <p>Deux forces <b>opposées</b> : on soustrait leurs valeurs. Deux forces <b>perpendiculaires</b> : la somme est la diagonale du rectangle.</p></div>
    </div>
    ${exemple('<p><span class="vec-nom">F</span><sub>1</sub> = 4 N vers la gauche et <span class="vec-nom">F</span><sub>2</sub> = 1 N vers la droite : Σ <span class="vec-nom">F</span> = 3 N vers la gauche.</p><p><span class="vec-nom">F</span><sub>1</sub> = 2 N vers le haut et <span class="vec-nom">F</span><sub>3</sub> = 4 N vers le bas se réduisent à 2 N vers le bas ; avec <span class="vec-nom">F</span><sub>2</sub> = 3 N vers la droite, Σ <span class="vec-nom">F</span> est la diagonale « 3 carreaux à droite, 2 carreaux vers le bas ».</p>')}`);
  const [a, b] = hasard([[[-4, 0], [2, 0]], [[0, 3], [0, -1]], [[3, 0], [-1, 0]]]);
  const pp = hasard([[{ nom: 'F_1', coord: [0, 2] }, { nom: 'F_2', coord: [3, 0] }, { nom: 'F_3', coord: [0, -4] }], [{ nom: 'F_1', coord: [-2, 0] }, { nom: 'F_2', coord: [0, 3] }, { nom: 'F_3', coord: [4, 0] }]]);
  c_.aToi(carte, [
    { titre: 'Deux forces opposées', enonce: '<p>Deux forces s\'exercent sur un objet, au point G (1 carreau = 1 N).</p>',
      parties: [partieResultante({ forces: [{ nom: 'F_1', coord: a }, { nom: 'F_2', coord: b }], etendue: 4, solution: '<p>Les deux forces sont opposées : on soustrait leurs valeurs ; Σ <span class="vec-nom">F</span> est dans le sens de la plus grande.</p>' })] },
    { titre: 'Trois forces', enonce: '<p>Trois forces s\'exercent au point G (1 carreau = 1 N).</p>',
      parties: [partieResultante({ forces: pp, etendue: 4, solution: '<p>Les deux forces opposées se réduisent à une seule ; avec la troisième, perpendiculaire, Σ <span class="vec-nom">F</span> est la diagonale du rectangle.</p>' })] },
  ]);
  return carte;
}

/* ---------- 2. Somme des forces et variation de la vitesse ---------- */
const CAS = [['Une voiture roule en ligne droite vers la droite et freine.', 'arriere', 'Elle ralentit : <span class="vec-nom">Δv</span> est vers l\'arrière, donc Σ <span class="vec-nom">F</span> aussi (vers la gauche).'],
  ['Une voiture roule en ligne droite vers la droite et accélère.', 'avant', 'Elle accélère : <span class="vec-nom">Δv</span> est vers l\'avant, donc Σ <span class="vec-nom">F</span> aussi (vers la droite).'],
  ['Un parachutiste descend verticalement à vitesse constante.', 'nulle', 'Mouvement rectiligne uniforme : <span class="vec-nom">Δv</span> = <span class="vec-nom">0</span>, donc Σ <span class="vec-nom">F</span> = <span class="vec-nom">0</span>.']];
function etape2(c_) {
  const carte = c_.carte('2. Somme des forces et variation de la vitesse');
  c_.ajouter(carte, `<div class="cours-bloc">
      <div class="cle"><p><b class="cle-titre">Règle.</b> Entre deux instants voisins, la variation du vecteur vitesse ${DV} = <span class="vec-nom">v</span><sub>2</sub> − <span class="vec-nom">v</span><sub>1</sub> a la <b>même direction</b> et le <b>même sens</b> que ${SF}.</p>
        <p class="crs-formule">m × ${DV} / Δt ≈ ${SF}</p><p>Plus la masse est grande, plus il faut de force pour changer la vitesse.</p></div>
    </div>
    ${exemple(`<p>Un skieur sans frottement : ${SF} = ${nomV('RN')} + ${nomV('P')} est dirigée vers le bas de la pente ; ${DV} aussi : le skieur va de plus en plus vite vers le bas de la pente.</p>`)}`);
  // Σ F⃗ à 45° (2 ; −2) : Δv⃗ peut s'arrêter sur plusieurs nœuds du quadrillage, avec une autre longueur
  const pp = [{ nom: 'F_1', coord: [0, 2] }, { nom: 'F_2', coord: [2, 0] }, { nom: 'F_3', coord: [0, -4] }];
  const cas = hasard(CAS);
  c_.aToi(carte, [
    { titre: 'Tracer <span class="vec-nom">Δv</span>', enonce: '<p>Trois forces s\'exercent sur un palet ; leur somme Σ <span class="vec-nom">F</span> est tracée en noir.</p>',
      parties: [partieAcc({ forces: pp, etendue: 4, nomVec: 'Δv', q: `Trace la variation du vecteur vitesse ${DV} depuis G (sans souci d'échelle : sa longueur peut être différente de celle de ${SF}), puis valide.`, solution: `<p>${DV} a la même direction et le même sens que ${SF} ; sa longueur dépend de la masse et de la durée Δt.</p>` })] },
    { titre: 'Dans quel sens ?', enonce: `<p>${cas[0]}</p>`, parties: [{ type: 'choix', q: `Comment est dirigée la somme des forces ${SF} ?`, options: [o('avant', 'dans le sens du mouvement'), o('arriere', 'dans le sens opposé au mouvement'), o('nulle', 'elle est nulle')], bonne: cas[1], melanger: false,
      indice: `${SF} a la même direction et le même sens que ${DV} : la vitesse augmente-t-elle, diminue-t-elle, ou reste-t-elle constante ?`, solution: `<p>${cas[2]}</p>` }] },
  ]);
  return carte;
}

/* ---------- À retenir ---------- */
function aRetenir(c_) {
  const carte = c_.carte('À retenir');
  c_.ajouter(carte, `<div class="cle"><p>${SF} : forces mises bout à bout. ${DV} (entre deux instants voisins) a la même direction et le même sens que ${SF} : m × ${DV} / Δt ≈ ${SF}.</p></div>
    <div class="er-actions"><a class="btn-primary" style="text-decoration:none" href="module_2_questions.html">Questions →</a>
      <a class="btn-secondary" style="text-decoration:none" href="fiche_2.html">Fiche récapitulative</a></div>`);
  return carte;
}

new COURS.Cours(document.getElementById('etapes'), [etape1, etape2, aRetenir]);
BF.menu('module_2_cours');
</script>
</body>
</html>
