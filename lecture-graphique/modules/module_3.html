<!DOCTYPE html>
<html lang="fr" data-matiere="maths">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 : Entraînement 2 — Lecture graphique</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="lgtools.css">
<script src="../../assets/nav.js"></script>
<script src="../../assets/dragdrop.js"></script>
<script src="../../assets/numpad.js"></script>
<script src="lgtools.js"></script>
</head>
<body>
<div id="app-nav"></div>
<div class="lg-page" id="app"></div>

<script>
/* ============================================================
   Banque de questions — Entraînement 2 (échelles et situations plus difficiles)
   Types : periode (T ou λ), max, amplitude, lectureY, lectureX.
   Les signaux périodiques sont décrits par « signal », les autres
   courbes par une fonction « f ».
   ============================================================ */
const bank = [
  // 1. Période d'un électrocardiogramme
  { type: 'periode',
    contexte: "Un électrocardiogramme (ECG) enregistre l'activité électrique du cœur d'un sportif au repos. La fréquence cardiaque se déduit de la période des battements.",
    cible: "À déterminer : la <b>période T</b> des battements, c'est-à-dire la durée entre deux pics les plus hauts (repérée en <b>orange</b>).",
    grandeur: { symbole: 'T', nom: 'période', noms: 'périodes' },
    axeX: { min: 0, max: 4, pas: 0.5, nom: 't', unite: 's', libelle: 'Durée' },
    axeY: { min: -0.5, max: 1.5, pas: 0.5, nom: 'u', unite: 'mV' },
    signal: { forme: 'ecg', periode: 0.83, ampl: 1.2, phase: -0.1 },
    unites: ['cm', 'mm', 's', 'ms', 'mV'] },

  // 2. Lecture d'une ordonnée, graduations de 150 en 150
  { type: 'lectureY',
    contexte: "L'activité A d'un échantillon de cobalt 60 diminue au cours du temps (désintégrations radioactives).",
    cible: "À déterminer : l'<b>activité A</b> de l'échantillon au bout de <b>t = 10 ans</b> (point repéré en <b>orange</b>). Mesure verticalement, depuis l'axe des abscisses (0 Bq) jusqu'au point.",
    grandeur: { symbole: 'A' },
    axeX: { min: 0, max: 30, pas: 5, nom: 't', unite: 'ans', libelle: 'Durée' },
    axeY: { min: 0, max: 900, pas: 150, nom: 'A', unite: 'Bq', libelle: 'Activité' },
    f: t => 800 * Math.pow(2, -t / 5.3), x0: 10,
    unites: ['cm', 'mm', 'ans', 'Bq', 's'] },

  // 3. Période d'une tension en dents de scie
  { type: 'periode',
    contexte: "Un oscillateur délivre une tension en « dents de scie », qui croît régulièrement puis chute brutalement.",
    cible: "À déterminer : la <b>période T</b> de la tension (repérée en <b>orange</b>, entre deux sommets).",
    grandeur: { symbole: 'T', nom: 'période', noms: 'périodes' },
    axeX: { min: 0, max: 50, pas: 10, nom: 't', unite: 'µs', libelle: 'Durée' },
    axeY: { min: -2, max: 10, pas: 2, nom: 'u', unite: 'V' },
    signal: { forme: 'dent', periode: 13.7, ampl: 4, decal: 4, phase: 1.1 },
    unites: ['cm', 'mm', 'µs', 'ms', 'V'] },

  // 4. Amplitude d'une tension décalée
  { type: 'amplitude',
    contexte: "Un GBF délivre une tension triangulaire à laquelle on a ajouté une tension continue (décalage) : sa valeur moyenne n'est plus nulle.",
    cible: "À déterminer : l'<b>amplitude U<sub>m</sub></b> de la tension, c'est-à-dire l'écart entre sa valeur moyenne et son maximum (repérée en <b>orange</b>).",
    grandeur: { symbole: 'U_m' },
    axeX: { min: 0, max: 4, pas: 0.5, nom: 't', unite: 'ms', libelle: 'Durée' },
    axeY: { min: 0, max: 6, pas: 1, nom: 'u', unite: 'V', libelle: 'Tension' },
    signal: { forme: 'triangle', periode: 0.8, ampl: 1.8, decal: 3.1, phase: 0.1 },
    unites: ['cm', 'mm', 'ms', 'V', 'mV'] },

  // 5. Lecture d'une abscisse
  { type: 'lectureX',
    contexte: "On allume un four et on enregistre la température θ à l'intérieur en fonction du temps t.",
    cible: "À déterminer : la <b>durée t<sub>1</sub></b> nécessaire pour que le four atteigne <b>150 °C</b> (point repéré en <b>orange</b>). Mesure horizontalement, depuis l'axe des ordonnées (t = 0) jusqu'au point.",
    grandeur: { symbole: 't_1' },
    axeX: { min: 0, max: 60, pas: 10, nom: 't', unite: 'min', libelle: 'Durée' },
    axeY: { min: 0, max: 250, pas: 50, nom: 'θ', unite: '°C', libelle: 'Température' },
    f: t => 20 + 180 * (1 - Math.exp(-t / 12)), y0: 150,
    unites: ['cm', 'mm', 'min', 's', '°C'] },

  // 6. Période d'un signal ultrasonore
  { type: 'periode',
    contexte: "Un émetteur d'ultrasons est relié à un oscilloscope. On visualise la tension u qu'il reçoit en fonction du temps t.",
    cible: "À déterminer : la <b>période T</b> des ultrasons (repérée en <b>orange</b>, entre deux maximums).",
    grandeur: { symbole: 'T', nom: 'période', noms: 'périodes' },
    axeX: { min: 0, max: 100, pas: 20, nom: 't', unite: 'µs', libelle: 'Durée' },
    axeY: { min: -2, max: 2, pas: 0.5, nom: 'u', unite: 'V' },
    signal: { forme: 'sinus', periode: 24.6, ampl: 1.35, phase: 3 },
    unites: ['cm', 'mm', 'µs', 'ms', 'V'] },

  // 7. Longueur d'onde d'une vague
  { type: 'periode',
    contexte: "Des vagues se propagent à la surface de l'eau d'une cuve à ondes. On trace la hauteur h de la surface en fonction de la position x, à un instant donné.",
    cible: "À déterminer : la <b>longueur d'onde λ</b> des vagues, c'est-à-dire la distance entre deux crêtes voisines (repérée en <b>orange</b>).",
    grandeur: { symbole: 'λ', nom: "longueur d'onde", noms: "longueurs d'onde" },
    axeX: { min: 0, max: 1.2, pas: 0.2, nom: 'x', unite: 'm', libelle: 'Position' },
    axeY: { min: -6, max: 6, pas: 2, nom: 'h', unite: 'mm' },
    signal: { forme: 'sinus', periode: 0.268, ampl: 4.2, phase: 0.03 },
    unites: ['cm', 'mm', 'm', 's'] },

  // 8. Valeur maximale d'un son complexe
  { type: 'max',
    contexte: "Un microphone capte le son d'une voix qui chante une note. La tension u délivrée par le microphone est périodique mais pas sinusoïdale.",
    cible: "À déterminer : la <b>valeur maximale U<sub>max</sub></b> de la tension (repérée en <b>orange</b>). Mesure verticalement, depuis l'axe des abscisses (0 mV) jusqu'au pic le plus haut.",
    grandeur: { symbole: 'U_max' },
    axeX: { min: 0, max: 8, pas: 2, nom: 't', unite: 'ms', libelle: 'Durée' },
    axeY: { min: -40, max: 40, pas: 20, nom: 'u', unite: 'mV', libelle: 'Tension' },
    signal: { forme: 'complexe', periode: 2.35, ampl: 38, phase: 0.5 },
    unites: ['cm', 'mm', 'ms', 'mV', 'V'] },

  // 9. Période d'un signal carré (rapport cyclique différent de 1/2)
  { type: 'periode',
    contexte: "On enregistre la tension u aux bornes d'une ampoule de clignotant de voiture : elle est allumée, puis éteinte, et ainsi de suite.",
    cible: "À déterminer : la <b>période T</b> du clignotement, c'est-à-dire la durée d'un cycle « allumé + éteint » (repérée en <b>orange</b>, entre deux allumages).",
    grandeur: { symbole: 'T', nom: 'période', noms: 'périodes' },
    axeX: { min: 0, max: 6, pas: 1, nom: 't', unite: 's', libelle: 'Durée' },
    axeY: { min: -2, max: 14, pas: 2, nom: 'u', unite: 'V' },
    signal: { forme: 'carre', periode: 1.35, ampl: 6, decal: 6, phase: 0.3, rc: 0.4 },
    unites: ['cm', 'mm', 's', 'ms', 'V'] },

  // 10. Lecture d'une ordonnée, graduations de 20 en 20
  { type: 'lectureY',
    contexte: "Un parachutiste saute d'un avion. Pendant sa chute, avant l'ouverture du parachute, on relève sa vitesse v en fonction du temps t.",
    cible: "À déterminer : la <b>vitesse v</b> du parachutiste à la date <b>t = 5 s</b> (point repéré en <b>orange</b>). Mesure verticalement, depuis l'axe des abscisses (0 m/s) jusqu'au point.",
    grandeur: { symbole: 'v' },
    axeX: { min: 0, max: 30, pas: 5, nom: 't', unite: 's', libelle: 'Durée' },
    axeY: { min: 0, max: 60, pas: 20, nom: 'v', unite: 'm/s', libelle: 'Vitesse' },
    f: t => 55 * (1 - Math.exp(-t / 5.6)), x0: 5,
    unites: ['cm', 'mm', 's', 'm/s', 'km/h'] },
];

// pavé numérique masqué par défaut
setNumpadPref(false);
LG.lancerQuiz({
  app: document.getElementById('app'),
  badge: 'MODULE 3', titre: 'Entraînement 2',
  intro: `<p class="lg-contexte">Même méthode, avec des échelles moins pratiques (graduations de 150 en 150, en µs…), des signaux plus variés (électrocardiogramme, dents de scie, tension décalée) et moins d'aide : à toi de choisir les mesures les plus précises.</p>`,
  bank: bank,
});

const nav = AppNav.init({
  appName: 'Lecture graphique', portalHref: '../../index.html', portalLabel: 'Toutes les applications',
  onHome: () => { window.location.href = '../index.html'; },
  onNavigate: (key) => { window.location.href = key + '.html'; },
  groups: [
    { title: 'Modules', items: [
      { key: 'module_1', label: 'Module 1 : La méthode' },
      { key: 'module_2', label: 'Module 2 : Entraînement 1' },
      { key: 'module_3', label: 'Module 3 : Entraînement 2' },
    ]},
  ],
});
nav.setActive('module_3');
nav.setTitle('Module 3 : Entraînement 2');
</script>
</body>
</html>
